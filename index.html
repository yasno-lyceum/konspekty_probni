<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Українська мова 9 клас</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Кольори ліцею «Ясно» зі скриншотів: синій #0644FF, світло-синій #517BFF, жовтий #FFCD01; картки з жовтою смугою й трьома крапками, як на сайті. Ліва навігація, сцена уроку з етапами праворуч */
  --paper:#F5F6FA; --card:#FFFFFF; --ink:#0B1640; --muted:#5A6485; --line:#DFE3EE; --blue-light:#517BFF;
  --accent:#FFCD01; --accent-ink:#1A1400; --blue:#0644FF; --blue-deep:#0433C2; --blue-soft:#E6EDFF;
  --good:#12A05C; --good-soft:#E3F6EC; --bad:#E5484D; --bad-soft:#FDE9EA;
  --font-display:"Montserrat","Arial",system-ui,sans-serif;
  --font-body:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:20px; --fs:17px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:var(--fs);line-height:1.55}
body.present{--fs:22px}
button,input,select{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;line-height:1.2;margin:0}
h1{font-size:clamp(1.6rem,3.2vw,2.5rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:800}
h3{font-size:1.05rem;font-weight:700}
.app{display:grid;grid-template-columns:300px 1fr;height:100%}
body.present .app,body.nav-hidden .app{grid-template-columns:1fr}
body.present .side,body.nav-hidden .side{display:none}

/* Sidebar */
.side{border-right:1px solid var(--line);background:var(--card);overflow-y:auto;display:flex;flex-direction:column}
.brand{padding:18px 18px 12px;display:flex;gap:12px;align-items:center;cursor:pointer;border:0;background:none;text-align:left}
.logo{width:42px;height:42px;border-radius:14px;background:var(--blue);color:#fff;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:1.05rem;flex:none}
.brand b{font-family:var(--font-display);font-size:.95rem;display:block}
.brand small{color:var(--muted);font-size:.8rem}
.search{margin:0 14px 10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);width:calc(100% - 28px)}
.nav{padding:0 8px 24px}
.nav details{margin:2px 0}
.nav summary{list-style:none;cursor:pointer;padding:10px 10px;border-radius:10px;font-weight:700;font-size:.9rem;display:flex;gap:8px;align-items:center}
.nav summary::-webkit-details-marker{display:none}
.nav summary .mnum{font-family:var(--font-display);font-size:.75rem;background:var(--blue-soft);color:var(--blue);border-radius:6px;padding:2px 7px}
.nav summary:hover{background:var(--paper)}
.nav a.ln{display:flex;gap:8px;padding:7px 10px 7px 14px;border-radius:9px;text-decoration:none;color:var(--ink);font-size:.86rem;line-height:1.35}
.nav a.ln:hover{background:var(--paper)}
.nav a.ln.on{background:var(--blue);color:#fff;font-weight:700}
.nav a.ln .n{font-variant-numeric:tabular-nums;color:var(--muted);min-width:22px;font-weight:700}
.nav a.ln.on .n{color:#fff}
.nav a.ln.done .n::after{content:" ✓";color:var(--good)}
.nav .special{display:flex;gap:8px;padding:10px;border-radius:10px;font-weight:700;text-decoration:none;color:var(--ink);font-size:.9rem}
.nav .special:hover{background:var(--paper)}

/* Main */
.main{overflow-y:auto;height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:10px clamp(16px,3vw,36px);background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .crumb{flex:1;min-width:0;color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{text-decoration:none;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:.88rem;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.primary:hover{background:var(--blue-deep)}
.btn.sun{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.stage{padding:clamp(18px,3.5vw,44px);max-width:1180px;width:100%;margin:0 auto;flex:1}

/* Home */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:center;padding:8px 0 28px}
.hero p{color:var(--muted);max-width:60ch;font-size:1.05rem}
.tag{display:inline-block;font-family:var(--font-display);font-weight:700;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;background:var(--blue);color:#fff;padding:5px 10px;border-radius:999px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stat b{font-family:var(--font-display);font-size:1.9rem;display:block;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.85rem}
.grid-mod{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin:12px 0 34px}
.mod{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;border-top:6px solid var(--mc,var(--blue))}
.mod:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(20,30,60,.08)}
.mod .meta{color:var(--muted);font-size:.82rem;font-weight:700}
.mod ul{margin:0;padding-left:18px;color:var(--muted);font-size:.86rem}
.section-title{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:8px 0 6px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin:12px 0}
.game{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px}
.game:hover{border-color:var(--blue)}
.game .ico{width:40px;height:40px;border-radius:10px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:800;font-family:var(--font-display)}
.game small{color:var(--muted)}

/* Lesson */
.lhead{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.lmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font-size:.78rem;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--blue-soft);color:var(--blue)}
.chip.sun{background:var(--accent);color:var(--accent-ink)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 18px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:800;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);border-color:var(--blue)}
.theory{display:flex;flex-direction:column;gap:16px}
.theory p{margin:0;max-width:75ch}
.def{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--blue);border-radius:var(--r);padding:16px 18px;font-size:1.06rem}
.def b{color:var(--ink)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.rule{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.rule h3{font-size:.98rem;color:var(--blue)}
.rule ul,.theory ul{margin:0;padding-left:20px}
.rule li{margin:2px 0}
.ex{background:var(--blue-soft);border-radius:10px;padding:10px 14px;font-style:italic}
.ex .src{font-style:normal;color:var(--muted);font-size:.85em}
.note{background:var(--good-soft);border-radius:10px;padding:12px 16px;border:1px dashed var(--good)}
.note b{color:var(--good)}
.warn{background:var(--bad-soft);border-radius:10px;padding:12px 16px;border:1px dashed var(--bad)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:10px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{font-family:var(--font-display);font-weight:600;font-size:.8rem;background:var(--paper)}
tr:last-child td{border-bottom:0}
.scheme{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-weight:700;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-style:normal;white-space:nowrap}
mark{background:color-mix(in srgb,var(--accent) 45%,transparent);color:inherit;border-radius:4px;padding:0 3px}
.timeline{display:flex;flex-direction:column;gap:0;border-left:3px solid var(--accent);margin-left:8px}
.timeline div{padding:6px 0 10px 18px;position:relative}
.timeline div::before{content:"";position:absolute;left:-9px;top:12px;width:14px;height:14px;border-radius:50%;background:var(--card);border:3px solid var(--blue)}
.timeline b{font-family:var(--font-display);font-variant-numeric:tabular-nums}
.lnav{display:flex;justify-content:space-between;gap:10px;margin-top:34px;padding-top:18px;border-top:1px solid var(--line)}

/* Activities */
.act{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(14px,2.4vw,24px);margin-bottom:20px}
.act-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.act-h .kind{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--blue)}
.act-task{color:var(--muted);margin:0 0 14px}
.act-foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}
.score{font-weight:800;margin-left:auto;font-variant-numeric:tabular-nums}
.score.good{color:var(--good)}

/* flip */
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.flip{perspective:900px;height:170px;cursor:pointer;border:0;background:none;padding:0}
body.present .flip{height:210px}
.flip-in{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.flip.open .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:14px;display:flex;align-items:center;justify-content:center;text-align:center;overflow:auto}
.face.front{background:var(--blue);color:#fff;font-family:var(--font-display);font-weight:600;font-size:1.02rem}
.face.back{background:var(--paper);border:2px solid var(--blue);transform:rotateY(180deg);font-size:.92rem;line-height:1.4}
.face.front::after{content:"натисни";position:absolute;bottom:8px;right:12px;font-family:var(--font-body);font-size:.68rem;opacity:.7;font-weight:400}

/* quiz */
.q-prog{height:8px;background:var(--paper);border-radius:9px;overflow:hidden;margin-bottom:14px}
.q-prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.q-text{font-size:1.15rem;font-weight:700;margin-bottom:14px}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;font-weight:600;display:flex;gap:10px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt .k{font-family:var(--font-display);font-size:.8rem;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 7px;flex:none}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.explain{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--blue-soft)}

/* sort */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:10px;border:2px dashed var(--line);border-radius:12px;margin-bottom:14px}
.item{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;cursor:grab;font-weight:600;box-shadow:0 1px 0 var(--line);text-align:left}
.item.sel{outline:3px solid var(--accent);border-color:var(--accent)}
.item.ok{background:var(--good-soft);border-color:var(--good)}
.item.no{background:var(--bad-soft);border-color:var(--bad)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.bucket{border:2px solid var(--line);border-radius:14px;padding:10px;min-height:120px;background:var(--paper);display:flex;flex-direction:column;gap:8px;cursor:pointer}
.bucket.over,.bucket.target{border-color:var(--blue);background:var(--blue-soft)}
.bucket h4{margin:0;font-family:var(--font-display);font-size:.85rem;font-weight:600;color:var(--blue)}
.bucket .its{display:flex;flex-wrap:wrap;gap:6px}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match .col{display:flex;flex-direction:column;gap:8px}
.mi{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;font-weight:600;min-height:48px}
.mi.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--paper))}
.mi.done{border-color:var(--good);background:var(--good-soft);cursor:default}
.mi.shake{animation:shake .35s;border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* order */
.order{display:flex;flex-direction:column;gap:8px;counter-reset:o}
.ord{display:flex;gap:10px;align-items:center;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 10px;font-weight:600;cursor:grab}
.ord::before{counter-increment:o;content:counter(o);font-family:var(--font-display);min-width:28px;height:28px;border-radius:8px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:.8rem;flex:none}
.ord span{flex:1}
.ord .mv{border:1px solid var(--line);background:var(--card);border-radius:8px;width:34px;height:34px;cursor:pointer;flex:none}
.ord.ok{border-color:var(--good);background:var(--good-soft)}
.ord.no{border-color:var(--bad);background:var(--bad-soft)}
.ord.drag{opacity:.4}

/* punct */
.psent{font-size:1.12rem;line-height:2.3;padding:10px 0;border-bottom:1px dashed var(--line)}
body.present .psent{line-height:2.2}
.slot{display:inline-grid;place-items:center;min-width:34px;height:34px;margin:0 2px;border:2px dashed var(--blue);border-radius:8px;background:var(--blue-soft);cursor:pointer;font-weight:900;font-size:1.15rem;vertical-align:middle;padding:0 4px;line-height:1}
.slot.ok{border-style:solid;border-color:var(--good);background:var(--good-soft)}
.slot.no{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.slot .hint{font-size:.7rem;color:var(--muted);font-weight:700}
.legend{display:flex;gap:6px;flex-wrap:wrap;color:var(--muted);font-size:.85rem;align-items:center}

/* tf */
.tf{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line)}
.tf p{margin:0;font-weight:600}
.tf .bt{display:flex;gap:6px;flex:none}
.tf .bt button{min-width:74px}
.tf .bt button.ok{background:var(--good-soft);border-color:var(--good)}
.tf .bt button.no{background:var(--bad-soft);border-color:var(--bad)}
.tf .why{display:block;color:var(--muted);font-weight:400;font-size:.9rem;margin-top:4px}

/* fill */
.fsent{font-size:1.1rem;padding:10px 0;border-bottom:1px dashed var(--line);line-height:2}
.fsent select{border:2px solid var(--blue);border-radius:8px;padding:3px 6px;background:var(--blue-soft);font-weight:700}
.fsent select.ok{border-color:var(--good);background:var(--good-soft)}
.fsent select.no{border-color:var(--bad);background:var(--bad-soft)}

/* crossword */
.cw-wrap{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.cw-wrap .clues{flex:1;min-width:300px}
.cw-grid-box{overflow-x:auto;max-width:100%}
.cw{display:grid;gap:2px;width:max-content}
.cw .c{width:36px;height:36px;position:relative}
body.present .cw .c{width:44px;height:44px}
.cw .c.w input{width:100%;height:100%;border:2px solid var(--ink);border-radius:5px;text-align:center;font-weight:800;text-transform:uppercase;font-size:1.05rem;background:var(--card);padding:0}
.cw .c.w input:focus{background:color-mix(in srgb,var(--accent) 35%,var(--card));outline:none}
.cw .c.w input.ok{background:var(--good-soft);border-color:var(--good)}
.cw .c.w input.no{background:var(--bad-soft);border-color:var(--bad)}
.cw .c .num{position:absolute;top:1px;left:3px;font-size:.6rem;font-weight:800;pointer-events:none;color:var(--blue)}
.clues{display:grid;grid-template-columns:1fr 1fr;gap:16px;font-size:.92rem}
.clues h4{margin:0 0 6px;font-family:var(--font-display);font-size:.85rem;color:var(--blue)}
.clues ol{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.clues li b{font-variant-numeric:tabular-nums;margin-right:6px}
.clues li.hl{background:color-mix(in srgb,var(--accent) 30%,transparent);border-radius:6px}

/* memory */
.mem{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mc{height:110px;border-radius:12px;border:0;cursor:pointer;background:var(--blue);color:#fff;font-weight:700;padding:8px;font-size:.88rem;line-height:1.3}
.mc.open{background:var(--paper);color:var(--ink);border:2px solid var(--accent)}
.mc.gone{background:var(--good-soft);color:var(--good);border:2px solid var(--good);cursor:default}

/* blitz & teams */
.big-num{font-family:var(--font-display);font-size:3rem;font-variant-numeric:tabular-nums}
.timer{display:flex;align-items:center;gap:14px}
.timer .bar{flex:1;height:12px;background:var(--paper);border-radius:9px;overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--blue);transition:width .25s linear}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.team{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.team input{border:0;background:transparent;font-family:var(--font-display);font-size:1.1rem;text-align:center;width:100%}
.team .big-num{font-size:3.4rem}
.team .row{display:flex;gap:8px}
.floatscore{position:fixed;right:18px;bottom:18px;z-index:20;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px;display:none;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.floatscore.on{display:flex}
.floatscore .t{display:flex;align-items:center;gap:6px;font-weight:800}
.floatscore button{width:30px;height:30px;padding:0;justify-content:center}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.hide{display:none!important}
.muted{color:var(--muted)}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 20% 0 0;z-index:30;transform:translateX(-102%);transition:transform .25s;box-shadow:0 0 40px rgba(0,0,0,.25)}
  body.nav-open .side{transform:none;display:flex}
  body.nav-hidden .side{display:flex}
  .hero{grid-template-columns:1fr}
  .cw-wrap{grid-template-columns:1fr}
  .match{grid-template-columns:1fr 1fr;gap:8px}
}
@media (max-width:520px){.clues{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr 1fr}.tf{flex-direction:column;align-items:flex-start}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== Етапи уроку ===== */
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;font-weight:700;font-size:.85rem;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--blue);color:#fff}
.timerbox{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin-bottom:12px;position:sticky;top:62px;z-index:4;box-shadow:0 6px 18px rgba(6,68,255,.06)}
.tcol{display:flex;flex-direction:column;gap:3px;min-width:170px;flex:1}
.tcol small{color:var(--muted);font-weight:700;font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm{font-family:var(--font-display);font-size:1.3rem;font-variant-numeric:tabular-nums}

.stepper{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;margin-bottom:22px}
.step{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:8px 8px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.step .sn{font-family:var(--font-display);font-weight:800;font-size:.8rem;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue)}
.step .st{font-weight:800;font-size:.8rem;line-height:1.2}
.step .sm{font-size:.72rem;color:var(--muted);font-weight:700}
.step.past .sn{background:var(--good-soft);color:var(--good)}
.step.on{background:var(--blue);border-color:var(--blue);color:#fff}
.step.on .sn{background:#fff;color:var(--blue)}
.step.on .sm{color:#cfdcff}
.stage-head{margin-bottom:16px}
.stage-head .stage-no{display:block;font-weight:800;font-size:.85rem;color:var(--blue)}

.mood-q{margin-bottom:12px}
.votes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.vote{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;border-top:5px solid var(--vc)}
.vote-main{border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:6px;border-radius:14px;position:relative}

.vote-main:active{transform:scale(.97)}
.vote-num{position:absolute;top:2px;left:4px;font-family:var(--font-display);font-weight:800;font-size:.8rem;color:var(--muted)}
.vote-e{font-size:2.6rem;line-height:1.1}
body.present .vote-e{font-size:3.4rem}
.vote-main small{color:var(--muted)}
.vote-bar{height:10px;background:var(--paper);border-radius:9px;overflow:hidden;position:relative}
.vote-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--vc);border-radius:9px;transition:width .3s}
.vote-bar i.ghost{background:#C5CCDF;top:6px;opacity:.9}
.vote-foot{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-variant-numeric:tabular-nums;font-size:.9rem}
.mini{border:1px solid var(--line);background:var(--card);border-radius:8px;width:28px;height:28px;cursor:pointer;font-weight:800}
.goal-card{background:linear-gradient(135deg,var(--blue),#3D6BFF);color:#fff;border-radius:24px;padding:clamp(20px,4vw,40px)}
.goal-card .tag{background:#fff;color:var(--blue)}
.goal-title{font-family:var(--font-display);font-weight:800;font-size:clamp(1.5rem,3.4vw,2.4rem);line-height:1.2;text-wrap:balance}
.goals{margin:8px 0 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:1.1rem}
.goals li{background:rgba(255,255,255,.14);border-radius:12px;padding:8px 14px}
.goals li::before{content:"✓ ";font-weight:900;color:var(--accent)}
.plan{display:flex;gap:4px;border-radius:14px;overflow:hidden}
.plan div{background:var(--blue-soft);padding:10px 8px;display:flex;flex-direction:column;gap:2px;min-width:0;font-size:.78rem}
.plan div:nth-child(4),.plan div:nth-child(5){background:var(--blue);color:#fff}
.plan b{font-family:var(--font-display);font-size:.85rem}
.plan span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.checks{display:flex;flex-direction:column;gap:8px}
.check{display:flex;gap:12px;align-items:center;padding:12px 14px;border:2px solid var(--line);border-radius:14px;cursor:pointer;font-weight:700;font-size:1.05rem;background:var(--paper)}
.check input{width:22px;height:22px;accent-color:var(--good)}
.check:has(input:checked){border-color:var(--good);background:var(--good-soft)}
.starts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.start{border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:16px;text-align:left;cursor:pointer;font-weight:800;font-size:1.05rem}
.start.on{border-color:var(--blue);background:var(--blue);color:#fff;transform:scale(1.02)}
.note-in{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit;background:var(--paper);resize:vertical}
.cloud{min-height:140px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:center;padding:18px;background:var(--paper);border-radius:16px}
.cloud span{font-family:var(--font-display);font-weight:800;line-height:1.1}
.final{text-align:center;margin-top:20px;padding:24px;border-radius:24px;background:var(--blue-soft)}
.final h3{font-size:1.5rem}
@media (max-width:900px){.stepper{grid-template-columns:repeat(4,1fr)}.timerbox{top:56px}}
@media (max-width:520px){.stepper{grid-template-columns:repeat(2,1fr)}.plan span{display:none}}

.lhead h1{font-size:clamp(1.5rem,2.8vw,2.2rem)}

 radial-gradient(circle at 26px 50%,#fff 6px,transparent 7px),radial-gradient(circle at 48px 50%,#fff 6px,transparent 7px),radial-gradient(circle at 70px 50%,#fff 6px,transparent 7px),var(--accent)}

html.present{font-size:125%}
body.present .top .crumb,body.present #btn-nav{visibility:hidden}
body.present .stage{max-width:1500px}
body.present .top{background:transparent;border-bottom:0;backdrop-filter:none}

.cloze{font-size:1.25rem;line-height:2.4;background:var(--paper);border-radius:16px;padding:18px 22px}
.blank{display:inline-grid;vertical-align:middle;border:2px dashed var(--blue-light);background:var(--blue-soft);border-radius:10px;padding:0 10px;height:2em;cursor:pointer;font:inherit;font-weight:800;color:var(--blue);margin:0 2px}

.bcard .bbtns{display:flex;gap:8px;margin-top:auto}
.bcard.ok{border-color:var(--good);background:var(--good-soft)}
.bcard.no{border-color:var(--bad);background:var(--bad-soft)}
.bcard[data-done] .bbtns{display:none}
.verdict:empty{display:none}

<div class="app">
  <aside class="side" aria-label="Зміст курсу">
    <button class="brand" onclick="location.hash='home'"><span class="logo">9</span><span><b>Українська мова</b><small>9 клас · 50 уроків по 30 хв</small></span></button>
    <input id="search" class="search" type="search" placeholder="Пошук уроку чи правила…" aria-label="Пошук уроку">

  <main class="main" id="main">

    </div>

  </main>
</div>
<div class="floatscore" id="float" aria-label="Табло команд"></div>
<script>
/* ===== Утиліти ===== */
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
};
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k, d) { try { const v = localStorage.getItem('ukr9-' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ukr9-' + k, JSON.stringify(v)); } catch (e) {} }
};
let uid = 0; const nid = p => (p || 'x') + (++uid);

function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = el('canvas', { class: 'confetti' }); document.body.append(c);
  const ctx = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
  const cols = ['#0644FF', '#FFCD01', '#517BFF', '#12A05C', '#FFFFFF'];
  const ps = Array.from({ length: 140 }, () => ({ x: innerWidth / 2, y: innerHeight / 3, vx: (Math.random() - .5) * 14, vy: Math.random() * -12 - 2, s: 4 + Math.random() * 6, c: cols[Math.floor(Math.random() * cols.length)], r: Math.random() * 6 }));
  let t = 0;
  (function f() {
    ctx.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += .2; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); ctx.restore(); });
    if (++t < 110) requestAnimationFrame(f); else c.remove();
  })();
}

/* Обгортка вправи */
const KIND = { flip: 'Картки, що перевертаються', quiz: 'Вікторина', sort: 'Розподіли за групами', match: 'Знайди пару', order: 'Розстав по порядку', punct: 'Розстав розділові знаки', tf: 'Правда чи ні?', fill: 'Обери пропущене', cross: 'Кросворд', memory: 'Гра «Пам’ять»' };
function actBox(a, body, onReset) {
  const box = el('section', { class: 'act' },
    el('div', { class: 'act-h' }, el('div', {}, el('div', { class: 'kind' }, KIND[a.type] || ''), el('h3', {}, a.title || KIND[a.type])),
      onReset ? el('button', { class: 'btn ghost', onclick: onReset, title: 'Почати вправу заново' }, '↻ Заново') : null),
    a.task ? el('p', { class: 'act-task' }, a.task) : null, body);
  return box;
}
function done(ctx) { confetti(); if (ctx && ctx.lesson) markDone(ctx.lesson); }

/* ===== Картки ===== */
function Flip(a) {
  const wrap = el('div');
  const draw = () => {
    wrap.innerHTML = '';
    const g = el('div', { class: 'flips' });
    a.cards.forEach(([f, b]) => {
      const card = el('button', { class: 'flip', 'aria-label': 'Картка: ' + f + '. Натисніть, щоб перевернути' },
        el('div', { class: 'flip-in' }, el('div', { class: 'face front' }, f), el('div', { class: 'face back', html: b })));
      card.onclick = () => card.classList.toggle('open');
      g.append(card);
    });
    wrap.append(g, el('div', { class: 'act-foot' },
      el('button', { class: 'btn', onclick: () => wrap.querySelectorAll('.flip').forEach(x => x.classList.add('open')) }, 'Відкрити всі'),
      el('button', { class: 'btn', onclick: () => wrap.querySelectorAll('.flip').forEach(x => x.classList.remove('open')) }, 'Закрити всі'),
      el('button', { class: 'btn', onclick: () => { a.cards = shuffle(a.cards); draw(); } }, 'Перемішати')));
  };
  draw();
  return actBox(a, wrap);
}

/* ===== Вікторина ===== */
function Quiz(a, ctx) {
  const wrap = el('div'); let i, score, qs;
  const start = () => { qs = a.shuffle === false ? a.qs.slice() : shuffle(a.qs); i = 0; score = 0; show(); };
  const show = () => {
    wrap.innerHTML = '';
    if (i >= qs.length) {
      const good = score === qs.length;
      wrap.append(el('div', { class: 'q-text' }, good ? 'Чудово! Усі відповіді правильні.' : `Результат: ${score} з ${qs.length}.`),
        el('p', { class: 'muted' }, good ? 'Можна переходити до наступної вправи.' : 'Спробуйте ще раз: питання й варіанти перемішаються.'),
        el('button', { class: 'btn primary', onclick: start }, 'Пройти ще раз'));
      if (good) done(ctx);
      return;
    }
    const q = qs[i];
    const order = shuffle(q.o.map((t, k) => ({ t, k })));
    const prog = el('div', { class: 'q-prog' }, el('i', { style: `width:${(i / qs.length) * 100}%` }));
    const opts = el('div', { class: 'opts' });
    const ex = el('div', { class: 'explain hide' });
    const next = el('button', { class: 'btn primary hide', onclick: () => { i++; show(); } }, i + 1 < qs.length ? 'Далі →' : 'Результат');
    order.forEach((o, n) => {
      const b = el('button', { class: 'opt' }, el('span', { class: 'k' }, 'АБВГДЕ'[n]), el('span', { html: o.t }));
      b.onclick = () => {
        opts.querySelectorAll('.opt').forEach(x => x.disabled = true);
        if (o.k === q.a) { b.classList.add('ok'); score++; } else { b.classList.add('no'); opts.children[order.findIndex(z => z.k === q.a)].classList.add('ok'); }
        if (q.e) { ex.innerHTML = q.e; ex.classList.remove('hide'); }
        next.classList.remove('hide');
      };
      opts.append(b);
    });
    wrap.append(prog, el('div', { class: 'muted', style: 'font-size:.85rem;font-weight:700' }, `Питання ${i + 1} з ${qs.length}`),
      el('div', { class: 'q-text', html: q.q }), opts, ex, el('div', { class: 'act-foot' }, next, el('span', { class: 'score' }, `Бали: ${score}`)));
  };
  start();
  return actBox(a, wrap, start);
}

/* ===== Сортування ===== */
function Sort(a, ctx) {
  const wrap = el('div');
  const build = () => {
    wrap.innerHTML = '';
    let sel = null;
    const pool = el('div', { class: 'pool', 'aria-label': 'Нерозподілені картки' });
    const bks = a.buckets.map((name, bi) => {
      const its = el('div', { class: 'its' });
      const b = el('div', { class: 'bucket', 'data-b': bi, tabindex: 0, role: 'button', 'aria-label': 'Група ' + name }, el('h4', {}, name), its);
      const drop = () => { if (sel) { its.append(sel); sel.classList.remove('sel', 'ok', 'no'); sel = null; clearT(); } };
      b.onclick = e => { if (e.target.closest('.item')) return; drop(); };
      b.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); drop(); } };
      b.ondragover = e => { e.preventDefault(); b.classList.add('over'); };
      b.ondragleave = () => b.classList.remove('over');
      b.ondrop = e => { e.preventDefault(); b.classList.remove('over'); const it = wrap.querySelector('[data-drag="1"]'); if (it) { its.append(it); it.classList.remove('ok', 'no'); } };
      return b;
    });
    const clearT = () => bks.forEach(b => b.classList.remove('target'));
    pool.onclick = e => { if (sel && !e.target.closest('.item')) { pool.append(sel); sel.classList.remove('sel'); sel = null; clearT(); } };
    shuffle(a.items).forEach(([t, k]) => {
      const it = el('button', { class: 'item', draggable: 'true', 'data-k': k, html: t });
      it.onclick = e => { e.stopPropagation(); if (sel === it) { it.classList.remove('sel'); sel = null; clearT(); return; } if (sel) sel.classList.remove('sel'); sel = it; it.classList.add('sel'); bks.forEach(b => b.classList.add('target')); };
      it.ondragstart = () => it.setAttribute('data-drag', '1');
      it.ondragend = () => it.removeAttribute('data-drag');
      pool.append(it);
    });
    const res = el('span', { class: 'score' });
    const check = () => {
      let ok = 0, all = a.items.length;
      wrap.querySelectorAll('.item').forEach(it => {
        const b = it.closest('.bucket'); it.classList.remove('ok', 'no');
        if (!b) return; if (+b.dataset.b === +it.dataset.k) { it.classList.add('ok'); ok++; } else it.classList.add('no');
      });
      res.textContent = `Правильно: ${ok} з ${all}`; res.classList.toggle('good', ok === all);
      if (ok === all) done(ctx);
    };
    const solve = () => wrap.querySelectorAll('.item').forEach(it => { bks[+it.dataset.k].querySelector('.its').append(it); it.classList.add('ok'); });
    wrap.append(el('p', { class: 'legend' }, 'Натисніть картку, потім групу (або перетягніть мишею).'), pool, el('div', { class: 'buckets' }, bks),
      el('div', { class: 'act-foot' }, el('button', { class: 'btn primary', onclick: check }, 'Перевірити'), el('button', { class: 'btn', onclick: solve }, 'Показати відповідь'), res));
  };
  build();
  return actBox(a, wrap, build);
}

/* ===== Пари ===== */
function Match(a, ctx) {
  const wrap = el('div');
  const build = () => {
    wrap.innerHTML = '';
    let L = null, R = null, left = 0;
    const lc = el('div', { class: 'col' }), rc = el('div', { class: 'col' });
    const res = el('span', { class: 'score' }, `Пар: 0 з ${a.pairs.length}`);
    const tryPair = () => {
      if (!L || !R) return;
      if (L.dataset.i === R.dataset.i) { [L, R].forEach(x => { x.classList.remove('sel'); x.classList.add('done'); x.disabled = true; }); left++; res.textContent = `Пар: ${left} з ${a.pairs.length}`; if (left === a.pairs.length) { res.classList.add('good'); done(ctx); } }
      else { const l = L, r = R; [l, r].forEach(x => { x.classList.remove('sel'); x.classList.add('shake'); }); setTimeout(() => [l, r].forEach(x => x.classList.remove('shake')), 400); }
      L = R = null;
    };
    shuffle(a.pairs.map((p, i) => [p[0], i])).forEach(([t, i]) => { const b = el('button', { class: 'mi', 'data-i': i, html: t }); b.onclick = () => { if (L) L.classList.remove('sel'); L = b; b.classList.add('sel'); tryPair(); }; lc.append(b); });
    shuffle(a.pairs.map((p, i) => [p[1], i])).forEach(([t, i]) => { const b = el('button', { class: 'mi', 'data-i': i, html: t }); b.onclick = () => { if (R) R.classList.remove('sel'); R = b; b.classList.add('sel'); tryPair(); }; rc.append(b); });
    wrap.append(el('div', { class: 'match' }, lc, rc), el('div', { class: 'act-foot' }, res));
  };
  build();
  return actBox(a, wrap, build);
}

/* ===== Порядок ===== */
function Order(a, ctx) {
  const wrap = el('div');
  const build = () => {
    wrap.innerHTML = '';
    const list = el('div', { class: 'order' });
    let items = shuffle(a.items.map((t, i) => ({ t, i })));
    if (items.every((x, k) => x.i === k)) items.reverse();
    let dragEl = null;
    items.forEach(({ t, i }) => {
      const row = el('div', { class: 'ord', draggable: 'true', 'data-i': i },
        el('span', { html: t }),

L(2, 'Мовлення. Види мовленнєвої діяльності. Різновиди читання', `
<div class="def"><b>Мовленнєва діяльність</b> — процес використання засобів мови для різних типів спілкування та обміну інформацією.</div>
<div class="tbl"><table><tr><th>Вид</th><th>Тип</th><th>Що відбувається</th></tr>
<tr><td><b>Говоріння</b></td><td>продуктивний</td><td>озвучення думки</td></tr>
<tr><td><b>Письмо</b></td><td>продуктивний</td><td>передача інформації графічними знаками</td></tr>
<tr><td><b>Аудіювання</b></td><td>рецептивний</td><td>слухання + розуміння почутого</td></tr>
<tr><td><b>Читання</b></td><td>рецептивний</td><td>зорове сприйняття інформації</td></tr></table></div>
<div class="note"><b>Підказка:</b> продуктивні види — ми <i>створюємо</i> текст; рецептивні — <i>сприймаємо</i>.</div>
<h2>Різновиди читання</h2>
<div class="rules">
 <div class="rule"><h3>Ознайомлювальне</h3><p>Попереднє знайомство з текстом: про що він загалом?</p></div>
 <div class="rule"><h3>Переглядове (вибіркове)</h3><p>Швидке, побіжне читання: вихоплюємо лише потрібні фрагменти.</p></div>
 <div class="rule"><h3>Вивчальне</h3><p>Найуважніше: з’ясовуємо незрозуміле, запам’ятовуємо, мислимо критично.</p></div>
</div>`,
[
 { type: 'sort', title: 'Продуктивні чи рецептивні?', buckets: ['Продуктивні (створюємо)', 'Рецептивні (сприймаємо)'], items: [['говоріння', 0], ['письмо', 0], ['виступ на конкурсі', 0], ['пишу допис у блог', 0], ['аудіювання', 1], ['читання', 1], ['слухаю подкаст', 1], ['гортаю статтю', 1]] },
 { type: 'match', title: 'Яке читання тут потрібне?', pairs: [['Шукаю в розкладі, о котрій потяг до Львова', 'Переглядове (вибіркове)'], ['Готуюся до контрольної за параграфом', 'Вивчальне'], ['Дивлюся, про що нова книжка, перш ніж купити', 'Ознайомлювальне']] }
]);

L(3, 'Граматична основа. Односкладне й двоскладне речення', `
<div class="def"><b>Граматична (предикативна) основа</b> — головні члени речення: <b>підмет</b> і <b>присудок</b>.</div>
<div class="rules">
 <div class="rule"><h3>Підмет (хто? що?)</h3><ul><li><b>Простий</b> — одне слово: ${ex('У дитинстві сукні шив мені <mark>дід</mark>.')}</li><li><b>Складений</b> — два й більше повнозначних слів: ${ex('<mark>Баба з дідом</mark> вийшли на пенсію.')}</li></ul></div>
 <div class="rule"><h3>Присудок (що робить? який?)</h3><ul><li><b>Простий</b> — дієслово: <i>Вони <mark>застрягли</mark> у заторі.</i></li><li><b>Складений іменний</b> — дієслово-зв’язка + іменна частина: <i>Ніч <mark>була ясна</mark>. Олег <mark>став переможцем</mark>.</i></li><li><b>Складений дієслівний</b> — допоміжне дієслово + інфінітив: <i>Аня вже <mark>вміє читати</mark>. Нам <mark>треба відпочити</mark>.</i></li></ul></div>
</div>
<p><b>Двоскладне</b> речення має і підмет, і присудок. <b>Односкладне</b> — лише один головний член.</p>
<div class="tbl"><table><tr><th>Односкладне</th><th>Що означає</th><th>Приклад</th></tr>
<tr><td>Означено-особове</td><td>дію виконує конкретна особа (я, ти, ми, ви)</td><td><i>Люблю чернігівську дорогу весною</i> (Л. Костенко)</td></tr>
<tr><td>Неозначено-особове</td><td>дію виконують невизначені особи (вони)</td><td><i>Нас зустрічають хлібом-сіллю</i> (Леся Українка)</td></tr>
<tr><td>Узагальнено-особове</td><td>дія стосується будь-кого</td><td><i>Друга пізнають у біді</i> (нар. творчість)</td></tr>
<tr><td>Безособове</td><td>дія не має виконавця</td><td><i>А в теплій хаті пахне свіжим хлібом</i> (О. Пахльовська)</td></tr>
<tr><td>Називне</td><td>стверджує наявність предмета чи явища</td><td><i>Чудесна київська осінь</i> (Остап Вишня)</td></tr></table></div>`,
[
 { type: 'quiz', title: 'Який присудок?', qs: [
  { q: 'Тоді ще <u>були модні</u> гольфи.', o: ['простий', 'складений іменний', 'складений дієслівний'], a: 1, e: 'Дієслово-зв’язка <i>були</i> + прикметник <i>модні</i>.' },
  { q: 'Женя <u>продовжує спати</u>.', o: ['простий', 'складений іменний', 'складений дієслівний'], a: 2, e: 'Допоміжне дієслово + інфінітив.' },
  { q: 'Вони <u>застрягли</u> у заторі під дощем.', o: ['простий', 'складений іменний', 'складений дієслівний'], a: 0, e: 'Одне дієслово в особовій формі.' },
  { q: 'Олег <u>став переможцем</u>.', o: ['простий', 'складений іменний', 'складений дієслівний'], a: 1, e: 'Зв’язка <i>став</i> + іменник.' },
  { q: 'Нам <u>треба відпочити</u>.', o: ['простий', 'складений іменний', 'складений дієслівний'], a: 2, e: '<i>Треба</i> + інфінітив.' }] },
 { type: 'match', title: 'Тип односкладного речення', pairs: [['Люблю чернігівську дорогу весною.', 'Означено-особове'], ['Нас зустрічають хлібом-сіллю.', 'Неозначено-особове'], ['Друга пізнають у біді.', 'Узагальнено-особове'], ['У хаті пахне свіжим хлібом.', 'Безособове'], ['Чудесна київська осінь.', 'Називне']] }
]);

L(4, 'Розділові знаки у простому ускладненому реченні', `
<div class="def">Просте речення має <b>одну</b> граматичну основу. Його ускладнюють: <b>однорідні члени</b>, <b>звертання</b>, <b>вставні слова</b>, <b>відокремлені члени</b>.</div>
<div class="rules">
 <div class="rule"><h3>Однорідні члени: кома ставиться</h3><ul><li>без сполучників: <span class="scheme">О, О, О</span></li><li>перед протиставними <i>а, але, та (=але), проте, зате, однак</i></li><li>при повторюваних сполучниках: <span class="scheme">і О, і О</span></li><li>у парних: <i>не тільки… а й; як… так і</i></li></ul></div>
 <div class="rule"><h3>Кома НЕ ставиться</h3><ul><li>між двома однорідними з одиничним <i>і (й), та (=і), чи, або</i></li><li>у фразеологізмах: <i>ні світ ні зоря, і сміх і гріх</i></li></ul><p>Узагальнювальне слово: <span class="scheme">: О, О, О</span> або <span class="scheme">О, О, О — …</span></p></div>
 <div class="rule"><h3>Звертання</h3><p>Завжди виділяємо комами: на початку, в кінці, всередині речення.</p>${ex('Чарлі, послухай. Послухай, Чарлі, Бред не хоче… Бред не хоче цього, Чарлі.')}</div>
 <div class="rule"><h3>Вставні слова</h3><p>Виражають ставлення, джерело, зв’язок думок. Виділяємо комами.</p><p><b>Завжди вставні:</b> отже, мабуть, по-перше, по-друге, щоправда, а втім.<br><b>Не бувають вставними:</b> адже, навіть, принаймні, усе-таки, начебто, нібито.</p></div>
</div>
<div class="note"><b>Відокремлюємо</b> дієприслівникові звороти, поширені означення після означуваного слова, означення до особового займенника, прикладки з <i>тобто, на ім’я, як-от</i>, додатки з <i>крім, окрім, замість, за винятком</i>.</div>`,
[
 { type: 'punct', title: 'Поставте коми', items: ['Кожен із друзів витягує папірець[,] купує подарунки[,] а потім ховає їх у шафці.', 'Чарлі[,] послухай[,] Бред не хоче цього.', 'Сем[,] безперечно[,] поставила кілька своїх улюблених пісень.', 'Встав він ні світ[] ні зоря.', 'У лісі бродив туман[,] підзолочений сонячним промінням.', 'Зробивши зарядку[,] іду на кухню.'], opts: ['', ','] },
 { type: 'sort', title: 'Вставне чи ні?', buckets: ['Завжди вставні (виділяємо)', 'Ніколи не вставні (не виділяємо)'], items: [['отже', 0], ['мабуть', 0], ['по-перше', 0], ['щоправда', 0], ['а втім', 0], ['адже', 1], ['навіть', 1], ['принаймні', 1], ['усе-таки', 1], ['нібито', 1], ['начебто', 1]] }
]);

L(5, 'Пряма і непряма мова як засоби передачі чужої мови', `
<div class="rules">
 <div class="rule"><h3>Пряма мова</h3><p>Дослівна передача мовлення. Складається з <b>власне прямої мови</b> (у лапках) і <b>слів автора</b>.</p>${ex('Кароліна хвилюється: «Це ж небезпечно для життя!»')}</div>
 <div class="rule"><h3>Непряма мова</h3><p>Недослівна передача: зберігається лише суть. Це складнопідрядне речення.</p>${ex('Ейвінн додає, що це не біда.')}</div>
 <div class="rule"><h3>Цитата</h3><p>Дослівний фрагмент висловлювання чи тексту з покликанням на автора — для підтвердження думки.</p></div>
 <div class="rule"><h3>Діалог</h3><p>Пряма мова двох осіб, репліка за реплікою, кожна з нового рядка після тире.</p></div>
</div>
<h2>Де стоять слова автора</h2>
<div class="rules">
 <div class="rule"><h3>Перед прямою мовою</h3><span class="scheme">А: «П».</span></div>
 <div class="rule"><h3>Після прямої мови</h3><span class="scheme">«П», — а.</span>${ex('«Мабуть, заробляє шалені гроші!» — каже Нільс.')}</div>
 <div class="rule"><h3>Усередині</h3><span class="scheme">«П, — а, — п».</span></div>
</div>
<div class="note"><b>Непряму мову</b> приєднують сполучником <b>чи</b>, якщо пряма мова — питальне речення без питального слова: <i>«Тобі потрібна допомога?» → Я запитую, чи йому потрібна допомога.</i></div>`,
[
 { type: 'sort', title: 'Який спосіб передачі?', buckets: ['Пряма мова', 'Непряма мова', 'Цитата'], items: [['«Я знаю, що нам робити!» — каже Кароліна.', 0], ['Уле розповів Софії: «Декорослини — це рослини для окраси».', 0], ['Кароліна сказала, що знає, що робити.', 1], ['Я запитую, чи йому потрібна наша допомога.', 1], ['Як писав Сковорода, «світ ловив мене, та не спіймав».', 2], ['«Мова їм потрібна лише для того, аби не наговорити дурниць» (Сергій Жадан).', 2]] },
 { type: 'tf', title: 'Правда чи ні?', items: [['У непрямій мові зберігається лише суть сказаного.', true, 'Так, передаємо зміст своїми словами.'], ['Власне пряму мову беремо в лапки.', true, ''], ['Речення з непрямою мовою — просте.', false, 'Воно складне (складнопідрядне).'], ['Слова автора можуть стояти всередині прямої мови.', true, 'Схема «П, — а, — п».'], ['Цитата не потребує покликання на автора.', false, 'Цитату подаємо з покликанням на автора й джерело.']] }
]);

L(6, 'Розділові знаки в реченнях з прямою мовою', `
<div class="def">Розділові знаки залежать від того, де стоять <b>слова автора (А/а)</b> щодо <b>прямої мови (П/п)</b>.</div>
<div class="tbl"><table><tr><th>Схема</th><th>Приклад</th></tr>
<tr><td><span class="scheme">А: «П».</span></td><td>Уле розповів Софії: «Декорослини — це рослини, які служать окрасою».</td></tr>
<tr><td><span class="scheme">А: «П!»</span></td><td>Уле випалив: «Моє хобі — гриби і декорослини!»</td></tr>
<tr><td><span class="scheme">А: «П?»</span></td><td>Софія перепитала: «Гриби й дикі рослини?»</td></tr>
<tr><td><span class="scheme">«П», — а.</span></td><td>«Моя мама теж любить гриби», — сказала Софія.</td></tr>
<tr><td><span class="scheme">«П?» — а.</span></td><td>«Лисичкового собаку?» — здивувалися Антон та Уле.</td></tr>
<tr><td><span class="scheme">«П!» — а.</span></td><td>«Це такі собаки!» — вигукнула Софія.</td></tr>
<tr><td><span class="scheme">«П, — а, — п».</span></td><td>«Настільний теніс, — раптом сказав Антон, — бо тітка має тенісний стіл».</td></tr>
<tr><td><span class="scheme">«П! — а. — П».</span></td><td>«Ходімо вже! — не терпілося Уле. — Софія вже кличе нас».</td></tr>
<tr><td><span class="scheme">«П, — а: — П».</span></td><td>«Приватна школа, — пояснила Софія й додала: — Мама скептична до державних установ».</td></tr></table></div>
<div class="note"><b>Запам’ятайте:</b> якщо слова автора мають два дієслова мовлення («сказав і додав»), після них ставимо <b>двокрапку й тире</b>, а друга частина прямої мови — з великої літери.</div>`,
[
 { type: 'match', title: 'Схема ↔ речення', pairs: [['А: «П!»', 'Уле випалив: «Моє хобі — гриби!»'], ['«П», — а.', '«Мама теж любить гриби», — сказала Софія.'], ['«П?» — а.', '«Лисичкового собаку?» — здивувалися хлопці.'], ['«П, — а, — п».', '«Настільний теніс, — сказав Антон, — бо тітка має стіл».'], ['А: «П?»', 'Софія перепитала: «Гриби й дикі рослини?»']] },
 { type: 'punct', title: 'Розставте знаки при прямій мові', task: 'Деякі віконця містять кілька знаків разом (наприклад, кома й тире).', opts: ['', ',', ':', '—', ', —', '. —'], items: ['Антон спитав[:] «Можеш мене сфоткати?»', '«У тебе все добре?»[—] набираю я смс.', '«Хто що любить[, —] пише Іне[. —] Мама практикує йогу».', '«Гм, може, серденько допоможе?»[—] пишу я.'] }
]);

L(7, 'Заміна прямої мови непрямою', `
<div class="def"><b>Непряма мова</b> — складнопідрядне речення: спочатку слова автора, потім непряма мова, приєднана сполучником або сполучним словом.</div>
<div class="rules">
 <div class="rule"><h3>Під час заміни</h3><ul><li>пропускаємо вигуки, частки, іноді вставні слова;</li><li>наказовий спосіб замінюємо іншими формами;</li><li>звертання пропускаємо або робимо членом речення;</li><li>займенники 1-ї та 2-ї особи → 3-тя особа.</li></ul></div>
</div>
<div class="tbl"><table><tr><th>Речення</th><th>Пряма мова</th><th>Непряма мова</th></tr>
<tr><td>Розповідне → <b>що</b></td><td>«Ми маємо намір довірити вам опіку над дітьми», — повідомила суддя Бартелемі.</td><td>Суддя повідомила, що вони мають намір довірити Бартелемі опіку над дітьми.</td></tr>
<tr><td>Спонукальне → <b>щоб</b></td><td>«Послухайте, пане Морлеване», — сказала суддя.</td><td>Суддя попросила пана Морлевана, щоб він її послухав.</td></tr>
<tr><td>Питальне з питальним словом → <b>те саме слово</b></td><td>Бартелемі вигукнув: «Хто ці троє в залі суду?»</td><td>Бартелемі перепитав, хто ті троє дітей у залі суду.</td></tr>

L(8, 'Цитата як спосіб передачі чужої мови', `
<div class="def"><b>Цитата</b> — дослівно переданий фрагмент висловлювання іншої людини чи уривок із тексту. Цитати підтверджують, пояснюють чи аргументують думку з покликанням на автора й джерело.</div>
<div class="rules">
 <div class="rule"><h3>1. Як пряма мова</h3>${ex('Сергій Жадан писав: «Мова зникає, коли нею не говорять про любов».')}${ex('«Радість — це те, що дається з боєм», — стверджує Жадан.')}</div>
 <div class="rule"><h3>2. Частина речення</h3><p>У лапках, <b>з малої літери</b>.</p>${ex('Жадан писав, що «слова, якими можна все пояснити, завжди прості».')}</div>
 <div class="rule"><h3>3. Неповна цитата</h3><p>На місці пропущених слів — <b>три крапки</b>.</p></div>
 <div class="rule"><h3>4. Епіграф</h3><p>Без лапок, праворуч; автор — у наступному рядку без дужок і без крапки.</p></div>
 <div class="rule"><h3>5. Віршові рядки</h3><p>Без лапок; після цитати — кома й тире; далі слова автора.</p></div>
 <div class="rule"><h3>6. Автор у дужках</h3>${ex('«Мова їм потрібна лише для того, аби не наговорити дурниць» (Сергій Жадан).')}</div>
</div>`,
[
 { type: 'tf', title: 'Перевір себе', items: [['Цитату-частину речення пишемо з малої літери.', true, 'Наприклад: …писав, що «слова… завжди прості».'], ['Епіграф беремо в лапки.', false, 'Епіграф пишемо без лапок.'], ['Пропущені слова в цитаті позначаємо трьома крапками.', true, ''], ['Строфи з віршів беремо в лапки.', false, 'Поетичні строфи подаємо без лапок.'], ['Автора можна вказати в дужках після цитати.', true, '']] },
 { type: 'flip', title: 'Шість способів оформити цитату', cards: [['Як пряма мова', 'Слова автора + цитата в лапках за правилами прямої мови.'], ['Частина речення', 'Лапки, мала літера: …що «слова… прості».'], ['Неповна цитата', 'Пропуск позначаємо <b>…</b>'], ['Епіграф', 'Без лапок, праворуч, автор нижче без дужок і крапки.'], ['Вірш', 'Без лапок; після — кома й тире, потім слова автора.'], ['Автор у дужках', '«Цитата» (Автор).']] }
]);

L(12, 'Складне речення, його ознаки. Види зв’язку', `
<div class="def"><b>Складне речення</b> має дві й більше граматичні основи. Скільки основ — стільки частин.</div>
<div class="tbl"><table><tr><th>Вид</th><th>Засоби зв’язку</th><th>Приклад</th></tr>
<tr><td><b>Складносурядне</b></td><td>сурядні сполучники + інтонація; частини рівноправні</td><td>Радіє весняне сонце, <mark>і</mark> вишні цвітуть рясно в саду.</td></tr>
<tr><td><b>Складнопідрядне</b></td><td>підрядні сполучники або сполучні слова; частини нерівноправні</td><td>Радіє весняне сонце, <mark>бо</mark> вишні цвітуть рясно в саду.</td></tr>
<tr><td><b>Безсполучникове</b></td><td>лише інтонація</td><td>Радіє весняне сонце<mark>,</mark> вишні цвітуть рясно в саду.</td></tr></table></div>
<div class="rules">
 <div class="rule"><h3>Сполучники підрядності</h3><p><b>Не є членами речення:</b> що, щоб, коли, бо, тому що, якщо, хоч, якби, як, мов, через те що, для того щоб.</p></div>
 <div class="rule"><h3>Сполучні слова</h3><p><b>Є членами речення</b>, на них падає логічний наголос. Займенники: хто, що, який, чий, котрий, скільки. Прислівники: де, куди, звідки, коли, чому, навіщо.</p></div>
 <div class="rule"><h3>Сурядні сполучники</h3><ul><li>єднальні: і, й, та (= і)</li><li>протиставні: а, але, проте, зате, однак, та (= але)</li><li>розділові: або, чи, або… або, чи… чи</li></ul></div>
</div>
<h2>Алгоритм</h2>
<div class="timeline">
 <div>Одна граматична основа? → <b>просте речення</b></div>
 <div>Частини без сполучників і сполучних слів? → <b>безсполучникове</b></div>
 <div>Частини рівноправні, сурядний сполучник? → <b>складносурядне</b></div>
 <div>Частини нерівноправні, підрядний сполучник чи сполучне слово? → <b>складнопідрядне</b></div>
 <div>Кілька видів зв’язку? → <b>складне з різними видами зв’язку</b></div>
</div>`,
[
 { type: 'sort', title: 'Визначте вид речення', buckets: ['Просте', 'Складносурядне', 'Складнопідрядне', 'Безсполучникове'], items: [['Існує багато виконавців, які співають свистом.', 2], ['Мешканці острова Гомера спілкуються свистом.', 0], ['До битви треба було готуватися, але ми майстрували зміїв самі.', 1], ['Цілу осінь ми заощаджували гроші: кидали їх у скарбничку.', 3], ['У 2009 році «сільбо» відзначили — комісія занесла її до списку ЮНЕСКО.', 3], ['Зазвичай свист використовують на відстанях, але мешканці почали спілкуватися ним через ущелини.', 1], ['Радіє сонце, бо вишні цвітуть.', 2]] },
 { type: 'tf', title: 'Сполучник чи сполучне слово?', items: [['Сполучні слова є членами речення.', true, 'На них падає логічний наголос, до них можна поставити питання.'], ['Сполучник «бо» — член речення.', false, 'Сполучники не бувають членами речення.'], ['«Який», «чий», «котрий» — сполучні слова.', true, 'Це відносні займенники.'], ['У безсполучниковому реченні частини поєднує інтонація.', true, '']] }
]);

L(13, 'Складносурядне речення: будова й засоби зв’язку', `
<div class="def"><b>Складносурядне речення</b> — частини рівноправні за змістом і граматично, поєднані <b>сурядними сполучниками</b>. Від однієї частини до іншої не можна поставити питання; кожна може існувати самостійно.</div>
<div class="tbl"><table><tr><th>Сполучники</th><th>Приклад</th></tr>
<tr><td><b>Єднальні:</b> і, й, та (= і), ні… ні, ані… ані, не тільки… а й, і… і</td><td>Не тільки дівчата дбають про стильне вбрання, а й хлопці переймаються своїм виглядом.</td></tr>
<tr><td><b>Протиставні:</b> а, але, зате, проте, однак, та (= але)</td><td>Стиль одягу має значення, але практичність важливіша.</td></tr>
<tr><td><b>Розділові:</b> або, чи, то… то, або… або, чи… чи, не то… не то</td><td>Або я допоможу братові з краваткою, або ви дайте йому пораду.</td></tr></table></div>
<div class="rules"><div class="rule"><h3>Схема</h3><p>Частини рівноправні — позначаємо <b>квадратними дужками</b>, між ними пишемо знак і сполучник.</p><p><span class="scheme">[ ], і [ ].</span> &nbsp; <span class="scheme">[ ], або [ ], або [ ].</span></p></div></div>`,
[
 { type: 'sort', title: 'Розподіліть сполучники', buckets: ['Єднальні', 'Протиставні', 'Розділові'], items: [['і', 0], ['й', 0], ['ні… ні', 0], ['не тільки… а й', 0], ['та (= і)', 0], ['а', 1], ['але', 1], ['проте', 1], ['зате', 1], ['однак', 1], ['та (= але)', 1], ['або', 2], ['чи', 2], ['то… то', 2], ['не то… не то', 2]] },
 { type: 'quiz', title: 'Оберіть схему', qs: [
  { q: 'Гаррі глянув на чарівну паличку, а вона й досі була в руці.', o: ['[ ], а [ ].', '[ ], (а …).', '[ ] а [ ].'], a: 0 },
  { q: 'Там він зможе забрати гроші, або розпочати життя вигнанця, або зникнути назавжди.', o: ['Це просте речення з однорідними присудками', '[ ], або [ ], або [ ].', '[ ], (або …).'], a: 0, e: 'Підмет один (<i>він</i>), присудки однорідні: <i>зможе забрати, розпочати, зникнути</i>.' },
  { q: 'Це була жахлива перспектива, але ж не міг він сидіти на цьому мурі.', o: ['[ ], але [ ].', '[ ]: [ ].', '[ ], (але …).'], a: 0 }] }
]);

L(14, 'Стилі, типи й жанри мовлення', `
<div class="def"><b>Текст</b> — сукупність речень, об’єднаних темою, головною думкою, стилем і граматично. Ознаки: цілісність, зв’язність, структурна організованість, завершеність.</div>
<h2>Типи мовлення</h2>
<div class="rules">
 <div class="rule"><h3>Розповідь</h3><p>Події, що розгортаються в часі: зав’язка → розвиток (кульмінація) → розв’язка.</p></div>
 <div class="rule"><h3>Опис</h3><p>Ознаки предмета, особи, явища: пейзаж, портрет, інтер’єр, характеристика.</p></div>
 <div class="rule"><h3>Роздум</h3><p>Причини й обґрунтування: <b>теза → аргументи → висновок</b>.</p></div>
</div>
<h2>Стилі мовлення</h2>
<div class="tbl"><table><tr><th>Стиль</th><th>Сфера й ознаки</th><th>Жанри</th></tr>
<tr><td><b>Розмовний</b></td><td>побут; емоційність, сленг, неповні речення, вільний порядок слів</td><td>діалог, полілог, переписка</td></tr>
<tr><td><b>Науковий</b></td><td>наука, освіта; терміни, точність, логічність, складні речення</td><td>монографія, стаття, тези, доповідь, реферат</td></tr>
<tr><td><b>Художній</b></td><td>література; образність, тропи (епітети, метафори), діалектизми</td><td>роман, повість, вірш, драма</td></tr>
<tr><td><b>Публіцистичний</b></td><td>медіа; емоційні слова, звертання, риторичні питання</td><td>стаття, нарис, блог, репортаж, інтерв’ю</td></tr>
<tr><td><b>Офіційно-діловий</b></td><td>документи; кліше, стислість, нейтральна лексика</td><td>закон, указ, договір, заява, резюме</td></tr>
<tr><td><b>Конфесійний</b></td><td>релігія; сакральна лексика, старослов’янізми</td><td>проповідь, молитва</td></tr>
<tr><td><b>Епістолярний</b></td><td>листування; ознаки розмовного й художнього</td><td>лист</td></tr></table></div>`,
[
 { type: 'match', title: 'Уривок ↔ стиль', pairs: [['— Владнаємо? Та ви ж стоїте на моїй клумбі! — закричав Уве.', 'Розмовний'], ['Стиль — сукупність ознак, які характеризують мистецтво певного часу та напряму.', 'Науковий'], ['І сніг, який так вміло оминали, вже майже тут — ці світлі мінерали терпіння…', 'Художній'], ['Загадковий крик гагари чути ледь не в кожній американській стрічці.', 'Публіцистичний'], ['Прошу прийняти мене на посаду економіста з 16 вересня.', 'Офіційно-діловий']] },
 { type: 'sort', title: 'Жанр → стиль', buckets: ['Науковий', 'Публіцистичний', 'Офіційно-діловий', 'Художній'], items: [['монографія', 0], ['реферат', 0], ['доповідь', 0], ['репортаж', 1], ['нарис', 1], ['блог', 1], ['указ', 2], ['договір', 2], ['заява', 2], ['повість', 3], ['вірш', 3], ['комедія', 3]] },
 { type: 'order', title: 'Структура роздуму', items: ['Теза — основне твердження', 'Аргументи — докази', 'Висновок — узагальнення'] }
]);

L(15, 'Смислові зв’язки між частинами складносурядного речення', `

<div class="tbl"><table><tr><th>Відношення</th><th>Приклад</th></tr>
<tr><td>Одночасність</td><td>Співали птахи, і з веранди репетував батько Кнута.</td></tr>
<tr><td>Послідовність</td><td>Кнут підійшов до перехрестя, і там про зуби в нього запитала Беата.</td></tr>

<tr><td>Протиставлення</td><td>Анна полюбляла сидіти самотою, але наодинці добре було тільки вдень.</td></tr>
<tr><td>Зіставлення</td><td>Беата затулила вуха, а хлопці навіть не звернули уваги.</td></tr>
<tr><td>Чергування</td><td>Йорген то грав у лови, то він шалено швидко бігав.</td></tr>
<tr><td>Різка зміна подій</td><td>Анна побрела подвір’ям — і раптом позад неї почувся дзенькіт.</td></tr></table></div>
<p class="muted">Приклади — з повісті Вігдіс Йорт «Йорген + Анна = любов».</p>`,

L(16, 'Кома між частинами складносурядного речення', `
<div class="rules">
 <div class="rule"><h3>Кому ставимо</h3><ul><li>при одночасності: <i>Містера Дурслі розбудило гучне ухкання, і долинало воно з кімнати Гаррі.</i></li><li>при послідовності: <i>Вернон гаркнув на племінника, та потім похмуро перезирнувся з Петунією.</i></li><li>при протиставленні: <i>Гаррі хотів щось заперечити, але його слова заглушила відрижка Дадлі.</i></li><li>при повторюваних сполучниках: <i>…і місіс Дурслі зойкнула, і містер Дурслі зірвався на ноги.</i></li></ul></div>
 <div class="rule"><h3>Кому НЕ ставимо</h3><ul><li>якщо частини мають <b>спільний</b> другорядний член, вставне слово, частку <i>лише, тільки, ще, навіть</i>: <i>Ясна річ, Гаррі закінчив перший клас й Дурслів не тішило його повернення.</i></li><li>якщо частини — два <b>називні, безособові, окличні, питальні чи спонукальні</b> речення: <i>Було тихо й пахло їжею.</i></li></ul></div>
</div>`,
[
 { type: 'punct', title: 'Кома чи ні?', task: 'Поставте кому лише там, де вона справді потрібна.', opts: ['', ','], items: ['Гаррі збирався відправити Гедвігу з листом[,] але так і не ризикнув.', 'Проте звісток від Рона й Герміони й далі не було[,] і Гаррі почувався відірваним від магічного світу.', 'Було тихо[] й пахло їжею.', 'Ясна річ[,] Гаррі закінчив перший клас[] й Дурслів не тішило його повернення.', 'Я тихенько сидітиму в кімнаті[] й Дадлі нічого не помітить!', 'Дадлі гепнувся зі стільця[,] і місіс Дурслі зойкнула[,] і містер Дурслі зірвався на ноги.'] }
]);

L(17, 'Крапка з комою між частинами складносурядного речення', `
<div class="def">Крапку з комою між частинами складносурядного речення ставимо в трьох випадках.</div>
<div class="rules">
 <div class="rule"><h3>1. Частини великі за обсягом</h3>${ex('Магли за часів середньовіччя боялися магії й не розумілися на ній; і, звісно, справжню відьму ловили вкрай рідко.')}<span class="scheme">[ ]; і [ ].</span></div>
 <div class="rule"><h3>2. Усередині частин уже є розділові знаки</h3>${ex('Гаррі ненавидів літні канікули, намагаючись усе робити потай; та навіть уночі він мусив затискати перо зубами.')}<span class="scheme">[ ]; та [ ].</span></div>
 <div class="rule"><h3>3. Частини далекі за змістом</h3>${ex('Гаррі підійшов до відчиненого вікна, сперся на підвіконня; а Гедвіга не поверталася вже другу ніч.')}<span class="scheme">[ ]; а [ ].</span></div>
</div>`,
[
 { type: 'quiz', title: 'Чому тут крапка з комою?', qs: [
  { q: 'Усе зраділо, стрічаючи день; і день зрадів, розцвітаючи, ясний, погожий (Панас Мирний).', o: ['у частинах є власні розділові знаки', 'частини виражають чергування', 'так завжди перед «і»'], a: 0 },
  { q: 'Гаррі підійшов до вікна, сперся на підвіконня; а Гедвіга не поверталася вже другу ніч.', o: ['частини далекі за змістом', 'друга частина — наслідок', 'частини однорідні'], a: 0 },
  { q: 'Між частинами складносурядного речення без власних знаків, близькими за змістом, ставимо…', o: ['кому', 'крапку з комою', 'двокрапку'], a: 0 }] }
]);

L(18, 'Тире в складносурядному реченні', `
<div class="def">Тире ставимо перед сполучником, якщо друга частина виражає <b>наслідок, висновок</b> або <b>швидку (раптову) зміну подій</b>.</div>
<div class="rules">
 <div class="rule"><h3>Наслідок, висновок</h3>${ex('Ти виконаєш домашнє завдання — і ми підемо в парк.')}${ex('Дощ пройшов — і Київ зеленіє', 'М. Рильський')}</div>
 <div class="rule"><h3>Швидка зміна подій</h3>${ex('Він упав — і всі засміялися.')}${ex('Дмухнув вітер понад ставом — і сліду не стало', 'Т. Шевченко')}</div>

L(21, 'Складнопідрядне речення: будова й засоби зв’язку', `
<div class="def"><b>Складнопідрядне речення</b> — частини нерівноправні за змістом і граматично, поєднані <b>підрядними сполучниками</b> або <b>сполучними словами</b>. Від головної частини до підрядної можна поставити питання.</div>
<div class="rules">
 <div class="rule"><h3>Головна й підрядна</h3><p><b>Головна</b> — від неї ставимо питання. <b>Підрядна</b> (залежна) — відповідає на нього. Підрядних може бути кілька.</p></div>
 <div class="rule"><h3>Лайфхак</h3><p>Підрядна частина <b>починається зі сполучника або сполучного слова</b>.</p></div>
 <div class="rule"><h3>Схема</h3><p>Головна — <b>квадратні</b> дужки, підрядна — <b>круглі</b>.</p>${ex('Пахнуть хлібом слова, що мене їх навчила мати.')}<span class="scheme">[ іменник ], (що…).</span>${ex('І скрізь, де тропа моя в’ється, лишав я частиночки хмари.')}<span class="scheme">[ , (де…), ].</span></div>
</div>
<div class="note"><b>Сполучник</b> — службова частина мови, членом речення не буває: <i>Мені завжди здавалось, що у Греції навіть статуї теплі.</i> <b>Сполучне слово</b> — займенник чи прислівник, член речення: <i>Музика — журкіт води, що струменить у фонтанах.</i></div>`,
[
 { type: 'quiz', title: 'Знайдіть підрядну частину', qs: [
  { q: 'Якщо ти купиш усі продукти, ми приготуємо торт.', o: ['якщо ти купиш усі продукти', 'ми приготуємо торт'], a: 0, e: 'Починається зі сполучника <b>якщо</b>.' },
  { q: 'Люблю поезію, яка торкає струн душі.', o: ['яка торкає струн душі', 'люблю поезію'], a: 0 },
  { q: 'Де б я не була, мені завжди красиво.', o: ['де б я не була', 'мені завжди красиво'], a: 0 },
  { q: 'Я часто протираю камеру телефону, щоб зробити фото.', o: ['щоб зробити фото', 'я часто протираю камеру телефону'], a: 0 }] },
 { type: 'match', title: 'Речення ↔ схема', pairs: [['Пахнуть хлібом слова, що мене їх навчила мати.', '[ ], (що…).'], ['Якщо завтра не буде дощу, підемо в парк.', '(Якщо…), [ ].'], ['Скрізь, де тропа в’ється, лишав я хмари.', '[ , (де…), ].']] }
]);

L(22, 'Підрядні сполучники й сполучні слова', `
<div class="rules">
 <div class="rule"><h3>Сполучне слово</h3><ul><li>є членом речення;</li><li>можна поставити питання;</li><li>падає логічний наголос;</li><li>не можна опустити;</li><li>замінюється іншим повнозначним словом.</li></ul>${ex('Побачив зайця, що (= який) сидів під кущем.')}</div>
 <div class="rule"><h3>Сполучник</h3><ul><li>не є членом речення;</li><li>питання не поставимо;</li><li>логічного наголосу немає;</li><li>часто можна опустити;</li><li>замінюється лише синонімічним сполучником.</li></ul>${ex('Знаю, що завтра буде дощ.')}</div>
</div>
<div class="tbl"><table><tr><th>Лише сполучні слова</th><th>Лише сполучники</th></tr>
<tr><td>хто, який, котрий, чий, скільки, наскільки; де, куди, звідки, поки, доки, відколи, навіщо, чому (причина)</td><td>аби, щоб, для того щоб; мов, немов, наче, неначе, ніби, буцім; перед тим як, після того як, щойно, ледве, перш ніж; якщо, якби, раз; хоч, хай, нехай, дарма що, незважаючи на те що; так що; бо, тому що, через те що, оскільки, позаяк</td></tr></table></div>
<h2>Що, як, коли — і те, і те</h2>
<div class="rules">
 <div class="rule"><h3>ЩО</h3><p><b>Сполучне слово</b>, якщо замінюється на <i>який, котрий, щось</i>: <i>набережна, <mark>що</mark> (яка) названа Оболонською</i>. Інакше — <b>сполучник</b>: <i>Він не здогадувався, що на нього чекає вечірка.</i></p></div>
 <div class="rule"><h3>ЯК</h3><p><b>Сполучник</b> у підрядних часу, умови, порівняння: <i>Розум без книжки, як птах без крил.</i> <b>Сполучне слово</b> — у підрядних способу дії: <i>Він жив, як належить жити чесній людині.</i></p></div>
 <div class="rule"><h3>КОЛИ</h3><p><b>Сполучник</b> у підрядних умови (= якщо): <i>Коли б ти захотіла…</i> <b>Сполучне слово</b> в означальних, з’ясувальних, часу: <i>Я хочу знати, коли ти повернешся.</i></p></div>
</div>`,
[
 { type: 'sort', title: 'Розподіліть засоби зв’язку', buckets: ['Лише сполучники', 'Лише сполучні слова', 'Буває і так, і так'], items: [['щоб', 0], ['бо', 0], ['ніби', 0], ['якщо', 0], ['хоч', 0], ['так що', 0], ['хто', 1], ['який', 1], ['чий', 1], ['де', 1], ['звідки', 1], ['відколи', 1], ['що', 2], ['як', 2], ['коли', 2]] },
 { type: 'quiz', title: 'Сполучник чи сполучне слово?', task: 'Йдеться про виділене слово (Ліна Костенко та інші приклади).', qs: [
  { q: 'Не знаю я, <b>що</b> буде після нас.', o: ['сполучне слово', 'сполучник'], a: 0, e: 'Падає логічний наголос; це підмет підрядної частини.' },
  { q: 'Єдиний, <b>хто</b> не втомлюється, — час.', o: ['сполучне слово', 'сполучник'], a: 0, e: '<i>Хто</i> — завжди сполучне слово.' },
  { q: 'Людині бійся душу ошукать, <b>бо</b> в цьому схибиш — то уже навіки.', o: ['сполучник', 'сполучне слово'], a: 0, e: '<i>Бо</i> — сполучник причини.' },
  { q: 'Знаю, <b>що</b> завтра буде дощ.', o: ['сполучник', 'сполучне слово'], a: 0, e: 'Не можна замінити на «який», наголосу немає.' },
  { q: 'Я хочу знати, <b>коли</b> ти повернешся.', o: ['сполучне слово', 'сполучник'], a: 0, e: 'Відповідає на питання, є обставиною часу.' },
  { q: '<b>Коли</b> б ти захотіла, я б уже все вивчила.', o: ['сполучник', 'сполучне слово'], a: 0, e: 'Можна замінити на «якби» — підрядне умови.' }] }
]);

L(23, 'Основні види складнопідрядних речень', `
<div class="def">За значенням складнопідрядні речення бувають <b>означальні</b>, <b>з’ясувальні</b> та <b>обставинні</b>. Підрядні частини відповідають на питання другорядних членів речення.</div>
<div class="rules">
 <div class="rule" style="border-top:5px solid var(--blue)"><h3>Означальна</h3><p>Питання <b>який? яка? яке? які?</b> — як означення.</p>${ex('Можливо, кінь згубив підкову, яка щасливою була', 'Б. Коханевич')}</div>
 <div class="rule" style="border-top:5px solid var(--accent)"><h3>З’ясувальна</h3><p>Питання непрямих відмінків — як додаток (<b>кого? чого? що? чим?</b>).</p>${ex('Казав він, що земля наша древня', 'У. Самчук')}</div>
 <div class="rule" style="border-top:5px solid var(--good)"><h3>Обставинна</h3><p>Питання обставини: <b>де? коли? як? чому? навіщо?</b></p>${ex('Завітай навесні, коли синя фіалка в чисте небо погляне', 'М. Сингаївський')}</div>
</div>`,
[
 { type: 'sort', title: 'Який вид підрядної частини?', buckets: ['Означальна', 'З’ясувальна', 'Обставинна'], items: [['Я бачив на небі зірки, що тонули у хмарах.', 0], ['Він подивився на будинок, який стояв на розі.', 0], ['Усім цікаво з людиною, яка багато читає.', 0], ['Ти не знаєш, що він задумав?', 1], ['Казав він, що земля наша древня.', 1], ['Ти не знаєш, що мама приготує на вечерю?', 1], ['Коли сідає сонце, Поділ стає чарівним.', 2], ['Якщо маєш талант, розвивай його.', 2], ['Я змерз, тому що дув пронизливий вітер.', 2]] },
 { type: 'flip', title: 'Перетворіть на складнопідрядне', task: 'Замініть відокремлений член підрядною частиною, потім переверніть картку.', cards: [['Прагнучи досягнути успіху, не забувай працювати над собою.', 'Якщо прагнеш досягнути успіху, не забувай працювати над собою.'], ['Блукаючи вдень парком, я відчула присутність осені.', 'Коли я блукала вдень парком, я відчула присутність осені.'], ['Дорога, розігріта за день, парувала.', 'Дорога, яка розігрілася за день, парувала.'], ['До істини йдемо сумніваючись.', 'До істини йдемо, коли сумніваємося.']] }
]);

L(24, 'Ділові папери. Заява. Резюме', `

</div>
<div class="rules">
 <div class="rule"><h3>Реквізити заяви</h3><ol><li>Адресат — <b>давальний</b> відмінок (Директору ТОВ «Усе буде добре» Костянтину ДОБРОДІЮ)</li><li>Адресант — <b>родовий</b> відмінок (Соколенка Василя Миколайовича…)</li><li>Назва документа — ЗАЯВА</li><li>Текст заяви («Прошу…»)</li><li>Додатки (за потреби)</li><li>Дата й підпис</li></ol></div>

 { type: 'order', title: 'Структура резюме', items: ['Прізвище, ім’я, по батькові', 'Дата народження, адреса, телефон', 'Мета пошуку роботи', 'Освіта та професійна підготовка', 'Досвід роботи', 'Додаткова інформація', 'Дата складання резюме'] },
 { type: 'quiz', title: 'Відмінки в заяві', qs: [
  { q: 'У якому відмінку пишемо адресата (кому)?', o: ['давальному', 'родовому', 'називному'], a: 0 },
  { q: 'У якому відмінку пишемо адресанта (від кого)?', o: ['родовому', 'давальному', 'орудному'], a: 0 },
  { q: 'Яким словом найчастіше починається текст заяви?', o: ['Прошу', 'Привіт', 'Повідомляю вам усім'], a: 0 }] }
]);

L(25, 'Підрядні означальні', `
<div class="def"><b>Означальна</b> підрядна частина відповідає на питання <b>який? яка? яке? які?</b> і пояснює в головній частині <b>іменник</b> (займенник чи слово в значенні іменника).</div>
<div class="rules">
 <div class="rule"><h3>Засоби зв’язку</h3><p>Сполучні слова: <b>що, який, чий, котрий, де, куди, звідки, коли</b>. Сполучники: <b>що, щоб, наче, ніби</b>.</p></div>
 <div class="rule"><h3>Вказівні слова в головній</h3><p>той, цей, такий, все, кожний, всякий, дехто, щось.</p>${ex('Я з тих країв, де Дніпро простягнувся.')}</div>
</div>
${ex('Дякуй усякому досвіду, який трапляється тобі на шляху.')}
${ex('Згадую миті, коли ми, безстрашні й юні, бігли назустріч хвилям.')}
<div class="note"><b>Схема:</b> <span class="scheme">[ … іменник ], (який…).</span> — питання ставимо від іменника.</div>`,
[
 { type: 'fill', title: 'Додайте засіб зв’язку', items: ['Я знову задивляюсь у твої очі, {що|бо|хоч} сяють, мов зорі.', 'Навколо було багато квітів, {які|щоб|якщо} пахли медом.', 'Я чекаю на той день, {коли|тому що|хоча} ми знову зустрінемось.', 'Я хочу жити в такому світі, {де|бо|хай} немає війни.', 'Є слова, {котрі|аби|ніж} лікують душу.'] }
]);

L(26, 'Підрядні з’ясувальні', `
<div class="def"><b>З’ясувальна</b> підрядна частина пояснює в головній <b>дієслово</b> (рідше прислівник, прикметник, іменник) зі значенням <b>мовлення, мислення, волевиявлення, сподівання</b> і відповідає на питання непрямих відмінків.</div>
<div class="rules">
 <div class="rule"><h3>Пояснювані слова</h3><p>говорити, кричати, запитати, розповідати, думати, бачити, чути, розуміти, хотіти; відомо, очевидно, приємно, важливо; радий, певен, щасливий.</p></div>
 <div class="rule"><h3>Засоби зв’язку</h3><p>Сполучники: <b>що, щоб, аби, мов, як, чи, ніби, наче</b>. Сполучні слова: <b>хто, який, чий, де, куди, коли, чому, скільки, як</b>.</p></div>
</div>
${ex('Він хотів би, щоб у цей день за столом зібралася вся його рідня.')}
${ex('Ми зачаровано спостерігали за тим, як снігові мушки спускаються з неба.')}`,
[
 { type: 'fill', title: 'Оберіть сполучник чи сполучне слово', items: ['Він хотів би, {щоб|бо|де} за столом зібралася вся рідня.', 'Спитайте дозволу, {чи|бо|хоча} можна виставляти фото з чужого дому.', 'Перш ніж публікувати світлину, подумайте, {як|бо|щоб} на неї відреагують.', 'Я знаю з історії свого народу, {що|щоб|аж} він сильний.', 'Ми щасливі тим, {що|бо|хоч} маємо друзів.'] },
 { type: 'tf', title: 'З’ясувальна чи ні?', items: [['Важко навіть уявити, що буде завтра. — з’ясувальна', true, 'Пояснює слово «уявити» (що?).'], ['Дякуй досвіду, який трапляється на шляху. — з’ясувальна', false, 'Це означальна: досвіду (якому?).'], ['Мені відомо, як дістатися туди. — з’ясувальна', true, 'Пояснює «відомо» (що?).']] }
]);

L(27, 'Підрядні обставинні: огляд', `
