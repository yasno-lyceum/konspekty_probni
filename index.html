]);

L(28, 'Підрядні способу дії й ступеня', `
<div class="def">Підрядні <b>способу дії й ступеня</b> вказують на спосіб дії або ступінь вияву ознаки. Питання: <b>як? яким способом? якою мірою? наскільки?</b></div>
<div class="rules">
 <div class="rule"><h3>Засоби зв’язку</h3><p>як, що, щоб, мов, немов, мовби, наче, неначе, ніби, нібито, ніж. У головній часто є вказівні слова <b>так, такий, настільки, стільки</b>.</p>${ex('Енея так вона любила, що аж сама себе спалила', 'І. Котляревський')}${ex('Скільки міг, стільки й допоміг', 'нар. творчість')}</div>
 <div class="rule"><h3>«так, що» чи «, так що»?</h3><p><b>Розчленований</b> сполучник (<i>так</i> у головній) → спосіб дії й ступеня: <i>Ми втомилися <mark>так, що</mark> вирішили завтра відпочити.</i></p><p><b>Нерозчленований</b> (<i>так що</i> разом) → наслідок: <i>Ми втомилися<mark>, так що</mark> вирішили завтра відпочити.</i></p></div>
</div>`,
[
 { type: 'sort', title: 'Спосіб дії чи наслідок?', buckets: ['Спосіб дії й ступеня', 'Наслідку'], items: [['Ми втомилися так, що вирішили відпочити.', 0], ['Енея так вона любила, що аж сама себе спалила.', 0], ['Він говорив так тихо, що всі прислухалися.', 0], ['Ми втомилися, так що вирішили відпочити.', 1], ['Промовець говорив неголосно, так що на задніх лавах не все чули.', 1], ['Погода стояла сонячна, так що шибки аж миготіли.', 1]] }
]);

L(29, 'Підрядні порівняльні', `
<div class="def">У реченні з <b>підрядним порівняльним</b> зміст головної частини розкриваємо через порівняння зі змістом підрядної. Питання: <b>як? подібно до чого?</b> Сполучники: <b>як, мов, наче, ніби</b>.</div>
${ex('Людина прагне до щастя одвічно, як ріки прагнуть в долини', 'М. Нагнибіда')}
${ex('Немовби день чекає ночі, я так побачення чекав', 'П. Сердюк')}
<div class="rules"><div class="rule"><h3>Речення чи зворот?</h3><p>У порівняльній частині є <b>підмет або присудок</b>? Так — підрядне порівняльне. Ні — порівняльний зворот.</p>${ex('І ніхто тієї пісні не міг так зрозуміти, як він… — підрядне')}${ex('Як парость виноградної лози, плекайте мову — зворот', 'М. Вінграновський')}</div></div>`,
[
 { type: 'sort', title: 'Підрядне порівняльне чи порівняльний зворот?', buckets: ['Підрядне порівняльне', 'Порівняльний зворот'], items: [['Людина прагне до щастя, як ріки прагнуть в долини.', 0], ['Сивина блищить, наче озимина взялась інеєм.', 0], ['Немовби день чекає ночі, я так побачення чекав.', 0], ['Як парость виноградної лози, плекайте мову.', 1], ['Розум без книжки, як птах без крил.', 1], ['Хлопець біг, як вітер.', 1]] }
]);

L(30, 'Підрядні місця', `
<div class="def">Підрядна <b>місця</b> вказує на місце чи напрям дії. Питання: <b>де? куди? звідки?</b> Сполучні слова: <b>де, куди, звідки</b>. Вказівні слова в головній: <i>тут, там, туди, звідти, скрізь, усюди</i>.</div>
${ex('Іди туди, де люди творять світло і ставлять хрест на темне і старе', 'М. Рудь')}
${ex('Раз на рік бувайте там, де ви ніколи не були', 'Далай-лама')}
<div class="rules"><div class="rule"><h3>Місця чи означальна?</h3><p>Підрядна стосується <b>всієї головної</b> (чи вказівного слова <i>там, туди</i>) → місця. Пояснює <b>іменник</b> → означальна.</p>${ex('Ми пішли туди, де показують цікаві фільми. — місця')}${ex('Ми пішли до кінотеатру, де показують цікаві фільми. — означальна')}</div></div>`,
[
 { type: 'quiz', title: 'Місця чи означальна?', qs: [
  { q: 'Ми пішли туди, де показують цікаві фільми.', o: ['місця', 'означальна'], a: 0, e: 'Пояснює вказівне слово «туди» — куди пішли?' },
  { q: 'Ми пішли до кінотеатру, де показують цікаві фільми.', o: ['означальна', 'місця'], a: 0, e: 'Пояснює іменник «кінотеатру» — якого?' },
  { q: 'Люди перестають мислити там, де зникають книжки.', o: ['місця', 'означальна'], a: 0 },
  { q: 'Я з тих країв, де Дніпро простягнувся.', o: ['означальна', 'місця'], a: 0, e: 'Пояснює іменник «країв» — яких?' },
  { q: 'Звідки вітер віє, звідти й хмари пливуть.', o: ['місця', 'означальна'], a: 0 }] }
]);

L(31, 'Підрядні часу', `
<div class="def">Підрядна <b>часу</b> вказує на час чи тривалість дії. Питання: <b>коли? відколи? доки? як довго?</b></div>
<div class="rules">
 <div class="rule"><h3>Засоби зв’язку</h3><p>Сполучники: коли, як, як тільки, тільки-но, щойно, ледве, після того як, перед тим як, з того часу як. Сполучні слова: <b>відколи, поки, доки</b>. Вказівні: тоді, відтоді, доти.</p>${ex('Чому ж стоїш без руху ти, коли ввесь світ співає?', 'Олександр Олесь')}${ex('Відколи Настя вступила в його хату, в хаті стало тихо та весело', 'М. Коцюбинський')}</div>
 <div class="rule"><h3>Кома зі складеними сполучниками</h3><p>Можна ставити перед усім сполучником або перед <i>як</i>:</p>${ex('Після того, як оголосили результати, я став екосвідомим.')}${ex('Після того як оголосили результати, я став екосвідомим.')}</div>
 <div class="rule"><h3>Розірваний сполучник з «час», «пора»</h3><p>Підрядна характеризує лише іменник → означальна.</p>${ex('Ми не бачились, з того часу як він переїхав. — часу')}${ex('З того часу ми не бачились, як він переїхав. — означальна')}</div>
</div>`,
[
 { type: 'tf', title: 'Правда чи ні?', items: [['«Відколи», «поки», «доки» — сполучні слова.', true, ''], ['У реченні «Після того як оголосили результати, я змінився» кома перед «як» обов’язкова.', false, 'Кому можна ставити перед усім сполучником або перед «як».'], ['«Чому ж стоїш без руху ти, коли ввесь світ співає?» — підрядне часу.', true, 'Питання «коли?».'], ['Підрядна часу відповідає на питання «навіщо?».', false, 'Це питання підрядної мети.']] }
]);

L(32, 'Підрядні причини', `
<div class="def">Підрядна <b>причини</b> вказує на причину або обґрунтовує зміст головної. Питання: <b>чому? через що? з якої причини?</b></div>
<div class="rules">
 <div class="rule"><h3>Сполучники</h3><p>бо, тому що, через те що, затим що, оскільки, позаяк, завдяки тому що, у зв’язку з тим що.</p>${ex('Чуюся добре, бо нікому не зробив зла', 'В. Стус')}${ex('Час — найлютіший кат якраз тому, що він — найгуманніший лікар', 'В. Пахаренко')}</div>
 <div class="rule"><h3>Складені сполучники</h3><p><i>Тому що, через те що</i> можуть розподілятися між частинами:</p>${ex('Я вчусь розуміти емоції, тому що це важлива навичка.')}${ex('Я вчусь розуміти емоції тому, що це важлива навичка.')}</div>
</div>`,
[
 { type: 'fill', title: 'Оберіть сполучник причини', items: ['Чуюся добре, {бо|щоб|якщо} нікому не зробив зла.', 'Я відмовився від вечірки, {тому що|щоб|хоч} хотів відпочити.', 'Матч перенесли, {оскільки|аби|ніби} поле замерзло.', 'Ми запізнилися, {через те що|для того щоб|так що} зламався автобус.'] }
]);

L(33, 'Підрядні наслідку', `
<div class="def">Підрядна <b>наслідку</b> вказує на наслідок того, про що йдеться в головній. Питання <b>не ставимо</b>. Єдиний сполучник — <b>так що</b> (нерозчленований).</div>
${ex('Промовець говорив неголосно, так що на задніх лавах не все чули', 'В. Земляк')}
${ex('Погода стояла тепла і сонячна, так що шибки на вікнах аж миготіли', 'Г. Тютюнник')}
<div class="warn"><b>Не плутайте:</b> <i>Ми втомилися <b>так, що</b>…</i> — спосіб дії й ступеня; <i>Ми втомилися<b>, так що</b>…</i> — наслідок.</div>`,
[
 { type: 'punct', title: 'Де кома?', task: 'Кома перед «так що» — наслідок; кома між «так» і «що» — спосіб дії.', opts: ['', ','], items: ['Ми сьогодні втомилися[,] так що вирішили завтра відпочити. (наслідок)', 'Ми сьогодні втомилися так[,] що вирішили завтра відпочити. (спосіб дії)', 'Страх охопив мене[,] так що в очах потемніло.', 'Над світом стояла така тиша[,] що було чути кожну краплю.'] }
]);

L(34, 'Підрядні мети', `
<div class="def">Підрядна <b>мети</b> вказує на мету дії. Питання: <b>з якою метою? для чого? навіщо?</b> Сполучники: <b>щоб, аби, для того щоб, заради того щоб, з тим щоб</b>.</div>
${ex('Щоб прийшло на землю сподіване щастя, треба великої праці', 'М. Коцюбинський')}
<div class="note"><b>Складені сполучники</b> можна розділити: <i>Треба вчитися, для того щоб реалізувати себе.</i> = <i>Треба вчитися для того, щоб реалізувати себе.</i></div>`,
[
 { type: 'fill', title: 'Мета чи щось інше?', items: ['{Щоб|Бо|Хоч} прийшло на землю сподіване щастя, треба великої праці.', 'Я наполегливо працюю, {аби|бо|якщо} вивчити англійську.', 'Протираю камеру, {щоб|тому що|хоч} зробити гарне фото.', 'Ми вийшли раніше, {для того щоб|через те що|дарма що} встигнути на потяг.'] }
]);

L(35, 'Підрядні умови', `
<div class="def">Підрядна <b>умови</b> вказує на умову, за якої можливе те, про що йдеться в головній. Питання: <b>за якої умови?</b></div>
<div class="rules">
 <div class="rule"><h3>Сполучники</h3><p>якщо, якщо… то, якби, коли, коли б, як, аби, раз, аби тільки.</p>${ex('Народ сам скує собі долю, аби тільки не заважали', 'М. Коцюбинський')}${ex('Якщо ви вдало виберете справу і вкладете в неї душу, то щастя саме відшукає вас', 'К. Ушинський')}</div>
 <div class="rule"><h3>«Коли»: умова чи час?</h3><p>Питання <b>за якої умови?</b> (можна замінити на «якщо») → умова. Питання <b>коли?</b> → час.</p>${ex('Мова зникає, коли нею не говорять про любов. — умови', 'С. Жадан')}${ex('Чому ж стоїш без руху ти, коли ввесь світ співає? — часу', 'О. Олесь')}</div>
</div>`,
[
 { type: 'sort', title: 'Умова чи час?', buckets: ['Підрядне умови', 'Підрядне часу'], items: [['Мова зникає, коли нею не говорять про любов.', 0], ['Якщо завтра не буде дощу, підемо в парк.', 0], ['Ти міг би відпочивати, якби вчився старанніше.', 0], ['Раз пообіцяв, то виконуй.', 0], ['Чому ж стоїш без руху ти, коли ввесь світ співає?', 1], ['Коли сідає сонце, Поділ стає чарівним.', 1], ['Як тільки літо, так я й в дорогу!', 1]] }
]);

L(36, 'Підрядні допустові', `
<div class="def">Підрядна <b>допустова</b> вказує на умову, <b>всупереч</b> якій відбувається дія. Питання: <b>незважаючи на що? всупереч чому?</b></div>
<div class="rules">
 <div class="rule"><h3>Засоби зв’язку</h3><p>Сполучники: хоч (хоча), незважаючи на те що, дарма що, хай. Сполучні слова: <b>хто не, що не, який не, як не, скільки не</b>.</p>${ex('Тепла все ще не було, дарма що минуло кілька днів березня', 'П. Тичина')}${ex('Скільки не дивись на море, воно ніколи не набридне', 'В. Козаченко')}</div>
 <div class="rule"><h3>Правильно</h3><p><b>незважаючи на те, що</b> — разом.</p><p class="warn">Неправильно: <s>не зважаючи на те що</s>, <s>не дивлячись на те що</s> — це дієприслівники «не дивитися», «не зважати».</p></div>
 <div class="rule"><h3>Речення чи зворот?</h3><p>Є граматична основа → підрядне допусту; немає → відокремлена обставина.</p>${ex('Незважаючи на те що ми втомились, ми прекрасно провели час.')}${ex('Незважаючи на втому, ми прекрасно провели час.')}</div>
</div>`,
[
 { type: 'quiz', title: 'Обери правильно', qs: [
  { q: 'Ми пішли гуляти, … була погана погода.', o: ['незважаючи на те що', 'не дивлячись на те що', 'не зважаючи на те що'], a: 0 },
  { q: '«Незважаючи на втому, ми прекрасно провели час» — це…', o: ['просте речення з відокремленою обставиною', 'складнопідрядне з підрядним допусту'], a: 0, e: 'У звороті немає граматичної основи.' },
  { q: 'Прийшов, хоч і не кликали. Вид підрядної?', o: ['допустова', 'умови', 'причини'], a: 0 },
  { q: 'Яке сполучне слово вводить допустову частину?', o: ['скільки не', 'бо', 'щоб'], a: 0 }] }
]);

L(37, 'Складнопідрядне речення з кількома підрядними', `
<div class="def">Одна головна частина й дві або більше підрядних. Види підрядності: <b>послідовна</b>, <b>однорідна</b>, <b>неоднорідна</b>.</div>
<div class="rules">
 <div class="rule" style="border-top:5px solid var(--blue)"><h3>Послідовна</h3><p>Кожна наступна підрядна залежить від попередньої (ланцюжок).</p>${ex('Ніколи не треба забувати, що митці покликані народом для того, аби показувати світові, що життя прекрасне', 'О. Довженко')}<span class="scheme">[ ], (що…), (аби…), (що…).</span></div>
 <div class="rule" style="border-top:5px solid var(--accent)"><h3>Однорідна</h3><p>Однакові підрядні стосуються одного слова чи всієї головної.</p>${ex('Пишіть листи, коли їх ждуть, коли є час, коли немає часу і коли навіть ні про що писати', 'Л. Костенко')}<span class="scheme">[ ], (коли…), (коли…) і (коли…).</span></div>
 <div class="rule" style="border-top:5px solid var(--good)"><h3>Неоднорідна</h3><p>Підрядні по-різному пояснюють головну (різні види або різні слова).</p>${ex('Коли мені було п’ять років, мама казала мені, що головне в житті — щастя', 'Дж. Леннон')}<span class="scheme">(коли…), [ ], (що…).</span></div>
</div>`,
[
 { type: 'sort', title: 'Визначте тип підрядності', buckets: ['Послідовна', 'Однорідна', 'Неоднорідна'], items: [['Над світом стояла така тиша, що було чути, як кущики жита ронили краплі роси.', 0], ['Ніколи не треба забувати, що митці покликані народом для того, аби показувати світові красу.', 0], ['Він радий, що може побути вдома, що гарна погода і що прийшов Володька.', 1], ['Я люблю слухати, як шумить ліс, як говорять між собою дерева.', 1], ['Пройшло немало років, як погас вогонь війни, як вичахли гармати.', 1], ['Коли дерева одцвітають, вони скидають лист, щоб знову зацвісти.', 2], ['Коли мені було п’ять років, мама казала мені, що головне в житті — щастя.', 2]] }
]);

L(38, 'Розділові знаки в складнопідрядному реченні', `
<div class="rules">
 <div class="rule"><h3>Кома</h3><p>Головну й підрядну розділяємо комами — підрядна може стояти після, перед або всередині головної.</p>${ex('Людина, доки вона не вважає себе щасливою, не щаслива.')}</div>
 <div class="rule"><h3>Складені сполучники</h3><p><i>тому що, через те що, після того як</i> можна розділити комою або лишити цілими. Якщо підрядна <b>перед</b> головною — сполучник не розділяємо.</p>${ex('Незважаючи на те що всі хочуть щастя, більшість страждає…')}<p><i>у той час як, перш ніж, тоді як</i> — кома лише перед усім сполучником.</p></div>
 <div class="rule"><h3>Тире</h3><p>Підрядна перед головною й інтонаційно виділена: <i>Де грози падають — там райдуги встають</i> (П. Тичина). Висновок у головній — <b>кома й тире</b>: <i>Коли зникає народна мова, — народу немає більше</i> (К. Ушинський).</p></div>
 <div class="rule"><h3>Кому НЕ ставимо</h3><ul><li>між двома сполучниками підряд: <i>Я знаю, що коли людина чогось хоче…</i> (ставимо одну кому перед першим)</li><li>перед сполучним засобом є <b>не</b>: <i>Важливо не як ти зробив, а що ти зробив.</i></li><li>перед ним є сурядний сполучник: <i>Треба любити людей і коли дуже важко.</i></li><li>повторюваний <i>і…і</i>: <i>Він знав і що він хоче, і як цього досягти.</i></li></ul></div>
</div>`,
[
 { type: 'punct', title: 'Гаррі Поттер: розставте коми', opts: ['', ','], items: ['Невіл ще зроду не сідав на мітлу[,] бо йому не дозволяла бабуся.', 'Гаррі потай міркував[,] що тут вона мала цілковиту рацію.', 'Навіть ходячи по твердій землі[,] Невіл постійно встрявав у халепу.', 'Це було те[,] чого не можна визубрити з книжки[,] хоча вона й намагалася.', 'Решта полегшено зітхнули[,] коли Герміонину лекцію урвало прибуття пошти.', 'Важливо не[] як ти зробив, а[] що ти зробив.'] }
]);

L(39, 'Розділові знаки в реченні з кількома підрядними', `
<div class="def">У реченнях з <b>однорідною</b> підрядністю знаки ставимо, як при однорідних членах речення.</div>
<div class="rules">
 <div class="rule"><h3>1. Без сурядних сполучників — кома</h3>${ex('Вони перелетять у ту країну, де небо ще синіє, де виноград в долині зеленіє, де грає сонця проміння', 'Леся Українка')}</div>
 <div class="rule"><h3>2. Одиничне і, й, та — без коми</h3>${ex('Може, наснилося йому все те, що могло бути й до чого прагнула його душа?', 'І. Цюпа')}</div>
 <div class="rule"><h3>3. Повторюваний сполучник — коми</h3>${ex('Хочу жити так, і щоб бути щасливим, і щоб приносити користь.')}</div>
 <div class="rule"><h3>4. Поширені частини з власними знаками — крапка з комою</h3>${ex('…туди, де немає кривди, захланності, бідності; де за тобою не стежать недобрі очі; де люди добрі, співчутливі й тихі', 'Ю. Мушкетик')}</div>
 <div class="rule"><h3>5. Послідовна й неоднорідна</h3><p>Кожну підрядну відокремлюємо за загальними правилами.</p>${ex('Як добре, що не потрібно чекати ні хвилини, щоб почати робити світ кращим', 'Анна Франк')}</div>
</div>`,
[
 { type: 'punct', title: 'Петро Яцик: уставте пропущені знаки', opts: ['', ',', ';'], items: ['Він був українцем[,] який усвідомлював болі і тривоги свого народу.', 'Петро Яцик був розумною людиною[,] так що співрозмовники[,] які мали за честь з ним спілкуватись[,] починали вірити в себе.', 'Він виріс до рівня мецената[,] який бачить національні пріоритети[] та відстоює їх.', 'Я люблю їхати на поле тоді, як ниви зеленіють[;] коли обважнілі колоски черкаються об голову, об вуха[;] коли ниви поцяцьковані волошками.'] }
]);

const BSR_TABLE = `<div class="tbl"><table><tr><th>Знак</th><th>Ставимо, якщо…</th><th>Приклад</th></tr>
<tr><td style="font-size:1.4rem;font-weight:900">,</td><td>перелічуються факти, послідовні чи одночасні події</td><td>Небо скоро затяглося хмарами, стало мрячити (О. Гончар).</td></tr>
<tr><td style="font-size:1.4rem;font-weight:900">;</td><td>частини далекі за змістом або мають власні розділові знаки</td><td>Не титули і не герби, не банків лондонських скарби — зарука щастя й миру; ні, не гонитва за добром… дають утіху щиру (Р. Бернс).</td></tr>
<tr><td style="font-size:1.4rem;font-weight:900">:</td><td>друга частина виражає <b>причину</b>, <b>доповнює</b> або <b>пояснює</b> першу</td><td>Я завжди говорив: уся справа в грамотно вибраному творчому кредо (С. Жадан).</td></tr>
<tr><td style="font-size:1.4rem;font-weight:900">—</td><td>протиставлення, зіставлення, різка зміна подій; перша частина — <b>час чи умова</b>; друга — <b>наслідок</b> чи <b>порівняння</b></td><td>Плакати хотілось — сльози не текли (Олександр Олесь).</td></tr></table></div>`;

L(41, 'Безсполучникове складне речення', `
<div class="def"><b>Безсполучникове складне речення</b> — частини поєднані в одне змістове ціле <b>лише інтонацією</b>, без сполучників і сполучних слів.</div>
<div class="rules">
 <div class="rule"><h3>З однорідними частинами</h3><p>Рівноправні, подібні до складносурядних.</p>${ex('Для кохання у нас часу мало, для мовчання — у нас віки', 'В. Симоненко')}<p class="muted">≈ …часу мало, <b>а</b> для мовчання — у нас віки.</p></div>
 <div class="rule"><h3>З неоднорідними частинами</h3><p>Одна пояснює іншу, подібні до складнопідрядних.</p>${ex('Ми боїмося самоти: у неї надто гостре жало', 'В. Малишко')}<p class="muted">≈ Ми боїмося самоти, <b>адже</b> у неї надто гостре жало.</p></div>
</div>
<h2>Інтонація</h2>
<div class="rules">
 <div class="rule"><h3>Переліку</h3>${ex('Валилися стіни палацу, тряслася земля, море поглинало суходіл', 'П. Загребельний')}</div>
 <div class="rule"><h3>Протиставлення</h3>${ex('Плакати хотілось — сльози не текли', 'О. Олесь')}</div>
 <div class="rule"><h3>Пояснення</h3>${ex('Сьогодні я маю право назвати себе щасливим: я пізнав творчу радість', 'Л. Дмитерко')}</div>
</div>`,
[
 { type: 'quiz', title: 'Яким сполучним реченням можна замінити?', qs: [
  { q: 'Ми боїмося самоти: у неї надто гостре жало.', o: ['Ми боїмося самоти, адже у неї надто гостре жало.', 'Ми боїмося самоти, і у неї надто гостре жало.', 'Ми боїмося самоти, щоб у неї було жало.'], a: 0 },
  { q: 'Для кохання у нас часу мало, для мовчання — у нас віки.', o: ['…часу мало, а для мовчання у нас віки.', '…часу мало, бо для мовчання у нас віки.', '…часу мало, якщо для мовчання у нас віки.'], a: 0 },
  { q: 'Плакати хотілось — сльози не текли.', o: ['Плакати хотілось, але сльози не текли.', 'Плакати хотілось, тому що сльози не текли.', 'Плакати хотілось, щоб сльози не текли.'], a: 0 }] },
 { type: 'sort', title: 'Яка інтонація?', buckets: ['Переліку', 'Протиставлення', 'Пояснення'], items: [['Валилися стіни палацу, тряслася земля.', 0], ['Засвітить місяць, засяють зорі.', 0], ['Плакати хотілось — сльози не текли.', 1], ['Хтось виграє, когось розіб’ють вщент.', 1], ['Я пізнав радість: я написав книжку.', 2], ['А потім ударила по селу тривога: замерзають лебеді.', 2]] }
]);

L(42, 'Смислові відношення між частинами безсполучникового речення', `
<div class="rules">
 <div class="rule"><h3>Однорідні частини</h3><ul><li><b>одночасність:</b> <i>Містечко давно спочивало, скрізь було тихо</i> (В. Шкляр)</li><li><b>послідовність:</b> <i>Засвітить місяць, засяють зорі, земля потоне в сріблястім морі</i> (О. Олесь)</li><li><b>зіставлення / протиставлення:</b> <i>Хтось виграє, когось розіб’ють вщент</i> (М. Кублій)</li></ul></div>
 <div class="rule"><h3>Неоднорідні частини</h3><ul><li><b>наслідок:</b> <i>Подивилась ясно — заспівали скрипки</i> (П. Тичина)</li><li><b>причина:</b> <i>Прощався квапливо: боявся розплакатися</i> (В. Гуртовенко)</li><li><b>умова:</b> <i>Віриш — здійсняться мрії</i> (Н. Позняк)</li><li><b>час:</b> <i>Прийде осінь — у засіках буде хліб золотий</i> (О. Десняк)</li><li><b>доповнення:</b> <i>Ніхто не сказав краще за греків: справедливість — це стримування сили мудрістю</i> (П. Загребельний)</li><li><b>пояснення:</b> <i>А потім ударила по селу тривога: замерзають лебеді</i> (Є. Гуцало)</li></ul></div>
</div>`,
[
 { type: 'match', title: 'Речення ↔ смислове відношення', pairs: [['Містечко давно спочивало, скрізь було тихо.', 'одночасність'], ['Засвітить місяць, засяють зорі.', 'послідовність'], ['Подивилась ясно — заспівали скрипки.', 'наслідок'], ['Прощався квапливо: боявся розплакатися.', 'причина'], ['Віриш — здійсняться мрії.', 'умова'], ['Прийде осінь — у засіках буде хліб.', 'час'], ['А потім ударила тривога: замерзають лебеді.', 'пояснення']] },
 { type: 'flip', title: 'Лист Василя Стуса до сина: аналіз', task: 'Визначте відношення, потім переверніть картку.', cards: [['Учися жити — то високе мистецтво.', 'Пояснення / зіставлення: друга частина розкриває зміст першої.'], ['Люди, народившись, вважають: жити вони вміють.', 'Доповнення (вважають що?).'], ['Оце і все життя: заслонити свою порожнечу громаддям машин.', 'Пояснення.']] }
]);

L(45, 'Двокрапка в безсполучниковому складному реченні', `

L(48, 'Розділові знаки в безсполучникових складних реченнях', `

function moduleCross(m) { const c = moduleActs(m, 'cross')[0]; return c ? c.words : EXTRA_CW[m]; }
function modulePairs(m) {
  const out = [];
  LESSONS.filter(l => l.m === m).forEach(l => l.acts.forEach(a => {
    if (a.type === 'flip') a.cards.forEach(c => out.push(c));
    if (a.type === 'match') a.pairs.forEach(c => out.push(c));
  }));
  const seen = new Set();
  return out.map(([x, y]) => [strip(x), strip(y)]).filter(([x, y]) => x.length < 70 && y.length < 90 && !seen.has(y) && seen.add(y));

  };
  const hist = el('p', { class: 'muted', style: 'text-align:center' });
  wrap.append(el('div', { class: 'act-foot' }, el('label', { for: 'class-size' }, 'Учнів у класі:'), inp, el('button', { class: 'btn primary', onclick: go }, 'Обрати номер'), el('button', { class: 'btn', onclick: () => { used.clear(); hist.textContent = ''; out.textContent = '—'; } }, 'Почати заново')), out, hist,
    el('p', { class: 'muted', style: 'text-align:center' }, 'Номер відповідає номеру учня в журналі. Номери не повторюються, доки не відповість увесь клас.'));
  return wrap;
}

/* ===== Маршрутизація ===== */
function route() {
  const h = location.hash.slice(1);
  document.body.classList.remove('nav-open');
  if (h.startsWith('lesson-')) viewScenario(+h.slice(7));
  else if (h === 'games') viewGames();
  else if (h.startsWith('game-')) viewGame(h.slice(5));
  else viewHome();
  $('#main').scrollTo({ top: 0 });
}

function toast(t) {
  const d = el('div', { class: 'toast', role: 'status' }, t); document.body.append(d);
  setTimeout(() => d.classList.add('out'), 4200); setTimeout(() => d.remove(), 4800);
}

/* ===== Запуск ===== */
function init() {
  buildNav(); drawFloat(); if (store.get('float', 0)) $('#float').classList.add('on');
  $('#search').oninput = e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.nav details').forEach(d => { let any = false; d.querySelectorAll('a.ln').forEach(a => { const l = lessonBy(+a.dataset.n); const hit = !q || (l.n + ' ' + l.title + ' ' + strip(l.theory)).toLowerCase().includes(q); a.classList.toggle('hide', !hit); any = any || hit; }); d.classList.toggle('hide', !any); if (q) d.open = any; });
  };
  $('#btn-nav').onclick = () => { if (innerWidth <= 900) document.body.classList.toggle('nav-open'); else document.body.classList.toggle('nav-hidden'); };
  $('#btn-games').onclick = () => location.hash = 'games';
  $('#btn-score').onclick = () => { const f = $('#float'); f.classList.toggle('on'); store.set('float', f.classList.contains('on') ? 1 : 0); };
  const setPresent = async on => {
    document.documentElement.classList.toggle('present', on);
    document.body.classList.toggle('present', on);
    $('#btn-present').textContent = on ? '✕ Вийти з презентації' : 'Презентація';
    if (on) {
      let full = false;
      try { const r = document.documentElement; const fn = r.requestFullscreen || r.webkitRequestFullscreen; if (fn) { await fn.call(r); full = !!(document.fullscreenElement || document.webkitFullscreenElement); } } catch (e) {}
      if (!full) toast('Режим презентації увімкнено. Щоб розгорнути на весь екран, натисніть F11.');
    } else {
      try { if (document.fullscreenElement) await document.exitFullscreen(); } catch (e) {}
    }
  };
  $('#btn-present').onclick = () => setPresent(!document.body.classList.contains('present'));
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && document.body.classList.contains('present')) setPresent(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.body.classList.contains('present') && !document.fullscreenElement) setPresent(false); });
  document.addEventListener('keydown', e => {
    if (e.target.closest('input,select,textarea')) return;
    const h = location.hash; if (!h.startsWith('#lesson-')) return;
    const n = +h.slice(8);
    if (lessonMode === 'stages' && window._goStage) { if (e.key === 'ArrowRight') window._goStage(1); if (e.key === 'ArrowLeft') window._goStage(-1); return; }
    if (e.key === 'ArrowRight' && lessonBy(n + 1)) location.hash = 'lesson-' + (n + 1);
    if (e.key === 'ArrowLeft' && lessonBy(n - 1)) location.hash = 'lesson-' + (n - 1);
  });
  addEventListener('hashchange', route);
  route();
}
init();

</script>
