м", "15 км"], "a": 1, "why": "s = 3·10⁸·10⁻³/2 = 1,5·10⁵ м = 150 км."}]}, {"n": "46", "type": "test", "t": "Комплексна підсумкова робота № 3 з теми «Механічні та електромагнітні хвилі»", "gr": "ГР1, ГР2, ГР3", "g": "Перевірити рівень засвоєння знань і вмінь з теми «Механічні та електромагнітні хвилі».", "blocks": [{"h": "Що перевіряє підсумкова робота", "p": ["Робота перевіряє, чи розумієте ви природу коливань, механічних, звукових та електромагнітних хвиль, чи вмієте пояснювати явища й застосовувати формули для розрахунків."], "ul": ["Характеристики коливань: A, T, ν та зв’язок між ними.", "Види хвиль, довжина і швидкість хвилі.", "Характеристики звуку, інфразвук і ультразвук, луна.", "Електромагнітне поле й хвилі, шкала електромагнітних хвиль.", "Принципи радіозв’язку й радіолокації."]}, {"h": "Структура роботи", "p": ["Робота складається із завдань різних типів: від простих тестових до розрахункових задач, де потрібно записати повний розв’язок."], "ul": ["Тестові завдання з вибором однієї правильної відповіді.", "Завдання на встановлення відповідності (наприклад, величина — одиниця, діапазон — застосування).", "Якісне завдання: пояснити явище.", "Розрахункові задачі з повним оформленням: Дано, СІ, Розв’язання, Відповідь."]}, {"h": "Як готуватися", "p": ["Повторіть конспекти уроків 37–45, особливо формули й типові помилки з уроку узагальнення. Розв’яжіть тренувальні задачі нижче без підглядання в розв’язання, а потім перевірте себе."], "ul": ["Вивчіть напам’ять: ν = 1/T, v = λν, c = λν, s = vt/2.", "Запам’ятайте швидкості: звук у повітрі ≈ 340 м/с, світло c ≈ 3·10⁸ м/с.", "Потренуйтеся переводити кГц, МГц, ГГц, нм, мкс у СІ.", "Повторіть порядок діапазонів шкали електромагнітних хвиль.", "Пройдіть тренувальний тест нижче."]}, {"h": "Критерії оцінювання", "p": ["Тестові завдання оцінюють за правильну відповідь. У розрахункових задачах враховують запис умови, переведення в СІ, правильну формулу, обчислення й одиниці у відповіді — тому навіть за частково виконану задачу можна отримати бали."], "ul": ["Повний правильний розв’язок з одиницями — максимальний бал.", "Правильна формула без обчислень — частина балів.", "Відповідь без розв’язання не зараховується повністю.", "Охайне оформлення й пояснення посилюють оцінку."]}], "formulas": [{"f": "T = t/N", "d": "період коливань"}, {"f": "ν = N/t = 1/T", "d": "частота коливань"}, {"f": "T = 2π√(l/g)", "d": "період нитяного маятника"}, {"f": "v = λ/T = λν", "d": "швидкість механічної хвилі"}, {"f": "s = vt/2", "d": "луна"}, {"f": "c = λν", "d": "електромагнітна хвиля, c ≈ 3·10⁸ м/с"}, {"f": "s = ct/2", "d": "радіолокація"}], "terms": [], "examples": [{"q": "Хвилі на поверхні ставка поширюються зі швидкістю 1,2 м/с. Поплавок за 10 с здійснив 6 коливань. Знайдіть довжину хвилі.", "s": ["Дано: v = 1,2 м/с, t = 10 с, N = 6.", "Розв’язання: ν = N/t = 0,6 Гц; λ = v/ν = 1,2/0,6 = 2 м.", "Відповідь: λ = 2 м."]}, {"q": "Дельфін випромінює ультразвук частотою 150 кГц. Яка довжина хвилі у воді (v = 1500 м/с)? Через який час повернеться луна від рибини на відстані 30 м?", "s": ["Дано: ν = 150 кГц, v = 1500 м/с, s = 30 м.", "СІ: ν = 1,5·10⁵ Гц.", "Розв’язання: λ = v/ν = 1500 / 1,5·10⁵ = 0,01 м = 1 см. t = 2s/v = 60/1500 = 0,04 с.", "Відповідь: λ = 1 см; t = 0,04 с."]}, {"q": "Довжина хвилі ультрафіолетового випромінювання 300 нм, а радіохвилі — 300 м. У скільки разів частота ультрафіолету більша?", "s": ["Дано: λ₁ = 300 нм = 3·10⁻⁷ м, λ₂ = 300 м.", "Розв’язання: ν = c/λ, тому ν₁/ν₂ = λ₂/λ₁ = 300 / 3·10⁻⁷ = 1·10⁹.", "Відповідь: у 10⁹ (мільярд) разів."]}], "lab": null, "f": "", "pr": ["Розв’яжіть тренувальні задачі самостійно, закривши розв’язання, і порівняйте свої відповіді.", "Складіть для однокласника 3 власні тестові питання з теми з відповідями та поясненнями."], "qz": [{"q": "Частота коливань 50 Гц. Період —", "o": ["50 с", "0,5 с", "0,02 с", "2 с"], "a": 2, "why": "T = 1/50 = 0,02 с."}, {"q": "Звук у повітрі є хвилею", "o": ["поздовжньою механічною", "поперечною механічною", "електромагнітною", "поверхневою"], "a": 0, "why": "Згущення й розрідження повітря поширюються вздовж напрямку руху хвилі."}, {"q": "Амплітуда 10 см. Шлях за 2 періоди —", "o": ["20 см", "40 см", "10 см", "80 см"], "a": 3, "why": "За 1 період 4A = 40 см, за 2 — 80 см."}, {"q": "Відповідність: УЗД — це застосування", "o": ["інфразвуку", "ультразвуку", "рентгенівського випромінювання", "радіохвиль"], "a": 1, "why": "Ультразвукове дослідження використовує ультразвук."}, {"q": "Довжина хвилі 0,5 м, швидкість 340 м/с. Частота —", "o": ["170 Гц", "680 Гц", "340 Гц", "0,0015 Гц"], "a": 1, "why": "ν = 340/0,5 = 680 Гц."}, {"q": "Хто експериментально відкрив електромагнітні хвилі?", "o": ["Максвелл", "Фарадей", "Герц", "Рентген"], "a": 2, "why": "Генріх Герц у 1888 р."}, {"q": "Яке випромінювання використовують у пультах дистанційного керування?", "o": ["Ультрафіолетове", "Гамма", "Рентгенівське", "Інфрачервоне"], "a": 3, "why": "Пульт містить ІЧ-світлодіод."}, {"q": "Частота 600 МГц. Довжина електромагнітної хвилі —", "o": ["0,5 м", "2 м", "5 м", "50 см"], "a": 0, "why": "λ = 3·10⁸ / 6·10⁸ = 0,5 м."}, {"q": "Радіоімпульс від літака повернувся через 300 мкс. Відстань —", "o": ["90 км", "45 км", "4,5 км", "900 км"], "a": 1, "why": "s = 3·10⁸ · 3·10⁻⁴ / 2 = 4,5·10⁴ м = 45 км."}, {"q": "Що визначає тембр звуку?", "o": ["Набір обертонів", "Лише амплітуда", "Швидкість звуку", "Тривалість звуку"], "a": 0, "why": "Тембр залежить від форми коливань, тобто обертонів."}]}, {"n": "47", "type": "project", "t": "Захист навчальних проєктів", "gr": "ГР1, ГР2, ГР3", "g": "Підготувати й представити навчальний проєкт з теми «Механічні та електромагнітні хвилі», навчитися аргументовано презентувати результати дослідження.", "blocks": [{"h": "Як підготувати проєкт", "p": ["Навчальний проєкт — це самостійне невелике дослідження: ви ставите питання, шукаєте відповідь у джерелах і, якщо можливо, на досліді, а потім представляєте результат. Працювати можна самостійно або в парі.", "Обираючи тему, подумайте, що вам ікрофон і камеру, увімкніть показ екрана заздалегідь, а відео досліду вставте в презентацію, щоб не залежати від швидкості інтернету."], "ul": ["Почніть з цікавого запитання чи факту.", "Не читайте зі слайдів — розповідайте своїми словами.", "На слайдах — мінімум тексту, більше схем і фото досліду.", "Наприкінці чітко сформулюйте висновки.", "Підготуйте відповіді на 2–3 ймовірні запитання."]}, {"h": "Взаємооцінювання", "p": ["Слухаючи однокласників, оцініть кожен виступ за критеріями й поставте одне змістовне запитання. Це вчить критично мислити й поважати чужу працю."], "ul": ["Чи зрозуміла мета проєкту?", "Чи правильно пояснено фізику явища?", "Чи є власний дослід, спостереження або розрахунок?", "Чи переконливі висновки?", "Що вам найбільше запам’яталося?"]}, {"h": "Теми проєктів", "p": ["Теми цього заняття стосуються електромагнітних хвиль. Можна запропонувати власну тему за погодженням з учителем."], "ul": ["Як працює мобільний зв’язок: від смартфона до базової станції.", "Wi-Fi удома: де сигнал найкращий (вимірювання рівня сигналу смартфоном у різних кімнатах).", "Інфрачервоне випромінювання навколо нас: пульт, тепловізор, обігрівач.", "Ультрафіолет: користь і шкода, як захистити шкіру й очі.", "Рентгенівське випромінювання: від відкриття Рентгена до сучасної медицини.", "Радіолокація: принцип роботи й застосування в авіації та метеорології.", "Як астрономи «бачать» невидимий Всесвіт: радіо-, ІЧ- і рентгенівські телескопи.", "Супутникова навігація: як смартфон визначає своє місце."]}, {"h": "Приклад плану виступу", "p": ["Тема: «Wi-Fi удома: де сигнал найкращий». Тривалість — 6 хвилин."], "ul": ["1. Вступ: що таке Wi-Fi і на якій частоті він працює (1 хв).", "2. Мета й гіпотеза: стіни й відстань послаблюють сигнал (0,5 хв).", "3. Методика: вимірювання рівня сигналу застосунком смартфона в 5 точках квартири (1 хв).", "4. Результати: карта квартири з позначеннями рівня сигналу (1,5 хв).", "5. Пояснення: поглинання й відбивання електромагнітних хвиль, обчислення λ = c/ν для 2,4 ГГц (1 хв).", "6. Висновки й поради, куди поставити роутер (1 хв)."]}], "formulas": [], "terms": [["Взаємооцінювання", "оцінювання учнями робіт одне одного за погодженими критеріями."], ["Методика дослідження", "опис того, як саме, якими засобами й у якій послідовності проводиться дослідження."]], "examples": [], "lab": null, "f": "", "pr": ["Підготуйте й відрепетируйте виступ за своїм проєктом, перевірте техніку для дистанційного захисту.", "Заповніть аркуш взаємооцінювання для трьох виступів однокласників."], "qz": [{"q": "Довжина хвилі Wi-Fi частотою 2,4 ГГц приблизно", "o": ["12,5 см", "1,25 м", "12,5 м", "1,25 мм"], "a": 0, "why": "λ = 3·10⁸ / 2,4·10⁹ ≈ 0,125 м."}, {"q": "Тепловізор реєструє", "o": ["ультрафіолет", "радіохвилі", "інфрачервоне випромінювання", "звук"], "a": 2, "why": "Нагріті тіла випромінюють ІЧ-хвилі."}, {"q": "Навіщо рентгенівські телескопи виводять на орбіту?", "o": ["Щоб бути ближче до зірок", "Атмосфера поглинає рентгенівське випромінювання", "На Землі їх нікуди поставити", "Щоб уникнути радіозавад"], "a": 1, "why": "Космічне рентгенівське випромінювання не доходить до поверхні Землі."}, {"q": "Що з наведеного НЕ є електромагнітною хвилею?", "o": ["Світло", "Радіохвиля", "Рентгенівське випромінювання", "Ультразвук"], "a": 3, "why": "Ультразвук — механічна хвиля."}, {"q": "Що визначає радар за часом повернення імпульсу?", "o": ["Відстань до об’єкта", "Масу об’єкта", "Колір об’єкта", "Температуру об’єкта"], "a": 0, "why": "s = ct/2."}]}]}, {"title": "Світлові явища", "lessons": [{"n": "49", "type": "theory", "t": "Світлові явища. Джерела й приймачі світла. Швидкість поширення світла", "gr": "ГР2", "g": "Дізнатися, що таке світло, які бувають джерела й приймачі світла та як було виміряно швидкість світла.", "blocks": [{"h": "Що таке світло", "p": ["Світло — це електромагнітні хвилі видимого діапазону (≈ 380–760 нм), які сприймає око людини. Світлові явища — це явища, пов’язані з поширенням світла і його взаємодією з речовиною: утворення тіні, відбивання, заломлення, розкладання білого світла на кольори, веселка.", "Розділ фізики, що вивчає світлові явища, називають оптикою. Світло переносить енергію: саме завдяки сонячному світлу існує життя на Землі, працюють сонячні електростанції."], "ul": ["Світло — електромагнітна хвиля.", "Світло поширюється і у вакуумі.", "Світло переносить енергію.", "Приклади світлових явищ: тінь, відблиск, веселка, міраж, затемнення."]}, {"h": "Джерела світла", "p": ["Джерела світла — тіла, які самі випромінюють світло. Вони бувають природні (Сонце, зорі, блискавка, полярне сяйво, світлячки) і штучні (лампи, свічка, екран смартфона). Місяць і планети не є джерелами світла — вони лише відбивають сонячне світло.", "За механізмом світіння розрізняють теплові джерела, які світяться, бо дуже нагріті (Сонце, полум’я, лампа розжарювання), і люмінесцентні — «холодне світіння» (світлодіоди, люмінесцентні лампи, світлячки, екрани)."], "ul": ["Природні та штучні джерела.", "Теплові та люмінесцентні джерела.", "Світлодіодні лампи економніші за лампи розжарювання: більша частина енергії перетворюється на світло, а не на тепло.", "Точкове джерело — джерело, розмірами якого можна знехтувати порівняно з відстанню до нього (далека зоря).", "Протяжне джерело — джерело, розміри якого суттєві (лампа денного світла поруч)."]}, {"h": "Приймачі світла", "p": ["Приймачі світла — пристрої та органи, у яких під дією світла відбуваються певні зміни. Природний приймач — око: світло падає на сітківку, і її клітини посилають сигнали в мозок.", "Штучні приймачі — фотоплівка, фотоелементи й матриці фотокамер і смартфонів, сонячні батареї, датчики освітленості (автоматичне вмикання вуличних ліхтарів, регулювання яскравості екрана)."], "ul": ["Око — природний приймач світла.", "Матриця камери перетворює світло на електричні сигнали.", "Сонячна батарея перетворює енергію світла на електричну.", "Листки рослин — природні «приймачі», де відбувається фотосинтез."]}, {"h": "Швидкість світла", "p": ["Світло поширюється дуже швидко, тому довго вважалося, що миттєво. Уперше швидкість світла оцінив данський астроном Оле Ремер (1676) за спостереженнями затемнень супутника Юпітера Іо. У 1849 р. Іпполіт Фізо вперше виміряв її в земних умовах за допомогою обертового зубчастого колеса.", "Швидкість світла у вакуумі c ≈ 3·10⁸ м/с = 300 000 км/с — найбільша можлива швидкість у природі. У воді, склі та інших прозорих середовищах світло поширюється повільніше."], "ul": ["c ≈ 3·10⁸ м/с у вакуумі (і майже така сама в повітрі).", "Світло від Сонця до Землі йде ≈ 8 хв 20 с.", "Від Місяця — ≈ 1,3 с.", "Світловий рік — відстань, яку світло проходить за рік, ≈ 9,46·10¹⁵ м; це одиниця відстані, а не часу."]}], "formulas": [{"f": "s = ct", "d": "відстань, яку світло проходить за час t; c ≈ 3·10⁸ м/с"}, {"f": "t = s/c", "d": "час поширення світла на відстань s"}], "terms": [["Оптика", "розділ фізики, що вивчає світлові явища."], ["Джерело світла", "тіло, яке випромінює світло."], ["Теплове джерело світла", "джерело, яке світиться завдяки високій температурі."], ["Люмінесценція", "світіння тіл, не пов’язане з їх нагріванням («холодне світіння»)."], ["Приймач світла", "пристрій або орган, у якому під дією світла відбуваються певні зміни."], ["Точкове джерело світла", "джерело, розмірами якого можна знехтувати порівняно з відстанню до місця спостереження."], ["Світловий рік", "відстань, яку світло проходить у вакуумі за один рік."]], "examples": [{"q": "Відстань від Сонця до Землі ≈ 1,5·10¹¹ м. За який час сонячне світло досягає Землі?", "s": ["Дано: s = 1,5·10¹¹ м, c = 3·10⁸ м/с.", "Розв’язання: t = s/c = 1,5·10¹¹ / 3·10⁸ = 500 с ≈ 8 хв 20 с.", "Відповідь: ≈ 8 хв 20 с."]}, {"q": "Яку відстань світло проходить за 1 рік (1 рік ≈ 3,15·10⁷ с)?", "s": ["Дано: t = 3,15·10⁷ с, c = 3·10⁸ м/с.", "Розв’язання: s = ct = 3·10⁸ · 3,15·10⁷ ≈ 9,45·10¹⁵ м.", "Відповідь: ≈ 9,5·10¹⁵ м — це і є 1 світловий рік."]}], "lab": null, "f": "Найближча до Сонця зоря — Проксима Центавра — розташована на відстані близько 4,2 світлового року: її світло, яке ми бачимо сьогодні, вийшло понад чотири роки тому.", "pr": ["Складіть таблицю джерел світла у вашому домі й на вулиці: природне чи штучне, теплове чи люмінесцентне.", "Обчисліть, за який час світло долає відстань від Рівного до Києва (≈ 300 км), і порівняйте з часом поїздки автомобілем."], "qz": [{"q": "Що з наведеного НЕ є джерелом світла?", "o": ["Сонце", "Місяць", "Блискавка", "Світлячок"], "a": 1, "why": "Місяць лише відбиває сонячне світло."}, {"q": "Лампа розжарювання — це джерело", "o": ["люмінесцентне природне", "теплове природне", "теплове штучне", "люмінесцентне штучне"], "a": 2, "why": "Нитка лампи світиться, бо дуже нагріта, і створена людиною."}, {"q": "Яке джерело світла є люмінесцентним?", "o": ["Полум’я свічки", "Сонце", "Розжарене залізо", "Світлодіод"], "a": 3, "why": "Світлодіод світиться без сильного нагрівання."}, {"q": "Швидкість світла у вакуумі приблизно", "o": ["3·10⁸ м/с", "340 м/с", "3·10⁵ м/с", "1500 м/с"], "a": 0, "why": "c ≈ 300 000 км/с = 3·10⁸ м/с."}, {"q": "Хто вперше оцінив швидкість світла за астрономічними спостереженнями?", "o": ["Фізо", "Ремер", "Ньютон", "Герц"], "a": 1, "why": "Оле Ремер у 1676 р., спостерігаючи затемнення Іо."}, {"q": "Світловий рік — це одиниця", "o": ["часу", "швидкості", "відстані", "яскравості"], "a": 2, "why": "Це відстань, яку світло проходить за рік."}, {"q": "Світло від Місяця (3,84·10⁸ м) до Землі йде приблизно", "o": ["1,3 с", "8 хв", "1 год", "0,1 с"], "a": 0, "why": "t = 3,84·10⁸ / 3·10⁸ ≈ 1,3 с."}, {"q": "Що є приймачем світла?", "o": ["Свічка", "Ліхтарик", "Зоря", "Матриця фотокамери"], "a": 3, "why": "Матриця реагує на світло й перетворює його на сигнали."}]}, {"n": "50", "type": "theory", "t": "Поширення світла в однорідному середовищі", "gr": "ГР2", "g": "Сформулювати закон прямолінійного поширення світла й пояснити за його допомогою утворення тіні, півтіні та зображення в камері-обскурі.", "blocks": [{"h": "Світловий промінь і пучок", "p": ["Щоб описувати, як поширюється світло, використовують модель — світловий промінь: лінію, уздовж якої поширюється енергія світла. Насправді світло завжди йде пучком, а промінь — це його зручне геометричне зображення.", "Розділ оптики, у якому світло описують променями, називають геометричною оптикою. Пучки бувають паралельні (сонячне світло), розбіжні (від лампочки) і збіжні (після лупи)."], "ul": ["Промінь зображують прямою зі стрілкою, що вказує напрямок.", "Паралельний пучок — промені не розходяться.", "Розбіжний пучок — промені виходять з однієї точки.", "Збіжний пучок — промені сходяться в точку.", "Промені від різних джерел, перетинаючись, не впливають один на одного."]}, {"h": "Закон прямолінійного поширення світла", "p": ["В однорідному прозорому середовищі світло поширюється прямолінійно. Однорідне — це середовище, властивості якого однакові в усіх точках (повітря в кімнаті, чиста вода, скло).", "Доказом є гострі тіні, прямі «стовпи» сонячного світла крізь хмари чи у запиленій кімнаті, промінь лазерної указки. Цим законом користуються будівельники (провішування ліній), стрільці (прицілювання), геодезисти."], "ul": ["Закон виконується лише в однорідному середовищі.", "На межі двох середовищ напрямок світла змінюється (відбивання, заломлення).", "У неоднорідному середовищі (нагріте повітря над асфальтом) промені викривлюються — виникають міражі.", "Перевірити рівність дошки можна, поглянувши вздовж неї."]}, {"h": "Тінь і півтінь", "p": ["Тінь — область простору, куди не потрапляє світло від джерела, бо на шляху стоїть непрозоре тіло. Якщо джерело точкове, тінь має чіткі межі.", "Якщо джерело протяжне, позаду тіла утворюються повна тінь (куди не потрапляє світло від жодної точки джерела) і півтінь (куди потрапляє світло лише від частини джерела). Що ближче тіло до екрана й що менше джерело, то різкіша тінь."], "ul": ["Точкове джерело → лише тінь з різкими краями.", "Протяжне джерело → тінь і півтінь.", "Розміри тіні знаходять з подібності трикутників.", "Хірургічні лампи роблять з кількох джерел, щоб не було тіней від рук лікаря.", "Тінь сонячного годинника вказує час."]}, {"h": "Камера-обскура", "p": ["Камера-обскура — темна скринька з маленьким отвором в одній стінці. Промені від кожної точки предмета проходять крізь отвір прямолінійно і на протилежній стінці утворюють перевернуте зображення.", "Розмір зображення залежить від відстаней: відношення висоти зображення h до висоти предмета H дорівнює відношенню відстані від отвору до екрана l до відстані від предмета до отвору L. Камера-обскура — «прабабуся» фотоапарата."], "ul": ["Зображення в камері-обскурі — дійсне, перевернуте.", "Що менший отвір, то різкіше, але тьмяніше зображення.", "Камеру-обскуру легко зробити з коробки і кальки.", "Сонячні «зайчики» під деревами — круглі зображення Сонця крізь щілини між листям."]}], "formulas": [{"f": "h/H = l/L", "d": "камера-обскура: h — висота зображення, H — висота предмета, l — відстань від отвору до екрана, L — відстань від предмета до отвору"}, {"f": "H/h = L/l", "d": "подібність трикутників у задачах на тінь: висота предмета H та довжина тіні L відносяться так само, як висота іншого предмета h та довжина його тіні l (за тих самих умов освітлення Сонцем)"}], "terms": [["Світловий промінь", "лінія, уздовж якої поширюється енергія світла."], ["Однорідне середовище", "середовище, фізичні властивості якого однакові в усіх його точках."], ["Закон прямолінійного поширення світла", "в однорідному прозорому середовищі світло поширюється прямолінійно."], ["Тінь", "область простору, у яку не потрапляє світло від джерела."], ["Півтінь", "область, у яку потрапляє світло лише від частини протяжного джерела."], ["Камера-обскура", "темна камера з невеликим отвором, у якій утворюється перевернуте зображення предметів."]], "examples": [{"q": "Метрова паличка, поставлена вертикально, відкидає тінь 0,8 м. Тінь від дерева в той самий час — 12 м. Яка висота дерева?", "s": ["Дано: h = 1 м, l = 0,8 м, L = 12 м.", "Розв’язання: сонячні промені паралельні, трикутники подібні: H/h = L/l, H = h·L/l = 1 · 12 / 0,8 = 15 м.", "Відповідь: H = 15 м."]}, {"q": "Ялинка заввишки 2 м розташована на відстані 4 м від камери-обскури. Яка висота зображення, якщо довжина камери 20 см?", "s": ["Дано: H = 2 м, L = 4 м, l = 20 см.", "СІ: l = 0,2 м.", "Розв’язання: h/H = l/L, h = H·l/L = 2 · 0,2 / 4 = 0,1 м.", "Відповідь: h = 10 см (зображення перевернуте)."]}], "lab": null, "f": "Ще давньогрецький учений Арістотель помітив, що під час часткового сонячного затемнення сонячні «зайчики» під деревами стають серпоподібними.", "pr": ["Виготовте камеру-обскуру з коробки (або пластикової склянки), фольги з маленьким отвором і кальки. Спостерігайте зображення вікна чи лампи й опишіть його.", "Виміряйте свою тінь і тінь метрової лінійки (або палиці) в сонячний день і обчисліть висоту будинку чи дерева біля вашого дому."], "qz": [{"q": "У якому середовищі світло поширюється прямолінійно?", "o": ["У будь-якому", "В однорідному прозорому", "Лише у вакуумі", "Лише у воді"], "a": 1, "why": "Закон прямолінійного поширення виконується в однорідному середовищі."}, {"q": "Що доводить прямолінійне поширення світла?", "o": ["Утворення тіні", "Веселка", "Нагрівання тіл", "Луна"], "a": 0, "why": "Тінь з чіткими межами виникає саме через прямолінійність променів."}, {"q": "Півтінь утворюється, якщо джерело світла", "o": ["точкове", "дуже яскраве", "протяжне", "розташоване далеко"], "a": 2, "why": "Від частини протяжного джерела світло потрапляє за край тіла."}, {"q": "Зображення в камері-обскурі", "o": ["пряме і уявне", "пряме і збільшене", "кольорове, але без зображення", "перевернуте"], "a": 3, "why": "Промені від верху предмета йдуть крізь отвір донизу екрана і навпаки."}, {"q": "Стовп 3 м відкидає тінь 2 м. Тінь будинку в той самий час — 10 м. Висота будинку —", "o": ["15 м", "6,7 м", "20 м", "5 м"], "a": 0, "why": "H = 3·10/2 = 15 м."}, {"q": "Що станеться із зображенням у камері-обскурі, якщо отвір значно збільшити?", "o": ["Стане різкішим", "Стане розмитим, але яскравішим", "Зникне", "Стане прямим"], "a": 1, "why": "Кожна точка предмета дає на екрані більшу пляму — зображення розмивається."}, {"q": "Предмет 1,5 м на відстані 3 м від камери-обскури завдовжки 10 см. Висота зображення —", "o": ["45 см", "1 см", "5 см", "15 см"], "a": 2, "why": "h = 1,5 · 0,1 / 3 = 0,05 м = 5 см."}, {"q": "Чому в операційних використовують лампи з багатьма джерелами світла?", "o": ["Щоб було тепліше", "Для економії енергії", "Щоб світло було кольоровим", "Щоб не утворювалося різких тіней"], "a": 3, "why": "Світло з різних напрямків «засвічує» тіні від рук та інструментів."}]}, {"n": "51", "type": "theory", "t": "Сонячне та місячне затемнення", "gr": "ГР2", "g": "Пояснити сонячні та місячні затемнення як наслідок прямолінійного поширення світла й руху Місяця навколо Землі.", "blocks": [{"h": "Чому бувають затемнення", "p": ["Місяць обертається навколо Землі приблизно за місяць, а Земля разом із Місяцем — навколо Сонця. Іноді Сонце, Земля і Місяць опиняються майже на одній прямій. Тоді тінь одного небесного тіла падає на інше — відбувається затемнення.", "Затемнення — яскравий доказ прямолінійного поширення світла: тінь Місяця і тінь Землі мають форму конусів, які утворюють прямі промені від Сонця."], "ul": ["Сонце — протяжне джерело світла, тому за Землею й Місяцем утворюються тінь і півтінь.", "Затемнення не відбуваються щомісяця, бо орбіта Місяця нахилена до площини орбіти Землі (≈ 5°).", "Щороку на Землі буває від 2 до 5 сонячних затемнень.", "Затемнення можна точно передбачити на століття вперед."]}, {"h": "Сонячне затемнення", "p": ["Сонячне затемнення відбувається, коли Місяць проходить між Сонцем і Землею (у новолуння) і його тінь падає на Землю. У смузі повної тіні спостерігають повне затемнення: на кілька хвилин стає темно, видно зорі та сонячну корону. У півтіні — часткове затемнення.", "Діаметр Сонця приблизно в 400 разів більший за діаметр Місяця, але Сонце й приблизно в 400 разів далі від нас, тому на небі вони мають майже однакові видимі розміри. Коли Місяць далі від Землі, він не закриває Сонце повністю — буває кільцеве затемнення."], "ul": ["Буває лише в новолуння.", "Повне — у вузькій смузі повної тіні (до ≈ 270 км завширшки).", "Часткове — у великій області півтіні.", "Кільцеве — Місяць видно темним диском на фоні яскравого кільця.", "Повна фаза триває лише кілька хвилин.", "Дивитися на Сонце без спеціального захисного фільтра НЕ МОЖНА навіть під час затемнення — можна пошкодити очі."]}, {"h": "Місячне затемнення", "p": ["Місячне затемнення відбувається, коли Земля опиняється між Сонцем і Місяцем (у повню) і Місяць потрапляє в земну тінь. Його видно з усієї нічної півкулі Землі, і триває воно довше — повна фаза може тривати понад годину.", "Під час повного місячного затемнення Місяць зазвичай не зникає, а стає мідно-червоним: атмосфера Землі заломлює частину сонячного світла в тінь, причому найкраще проходить червоне світло."], "ul": ["Буває лише в повню.", "Видно з усієї нічної сторони Землі.", "Безпечно спостерігати неозброєним оком.", "Буває повним, частковим і півтіньовим.", "Ще Арістотель за круглою тінню Землі на Місяці зробив висновок про кулястість Землі."]}], "formulas": [{"f": "D_С/L_С ≈ D_М/L_М", "d": "умова повного сонячного затемнення: відношення діаметра до відстані (видимий розмір) Місяця не менше, ніж у Сонця; D — діаметр, L — відстань до Землі"}, {"f": "t = s/c", "d": "час поширення світла від Сонця чи Місяця до Землі"}], "terms": [["Сонячне затемнення", "явище, коли Місяць закриває Сонце від спостерігача на Землі, бо тінь Місяця падає на Землю."], ["Місячне затемнення", "явище, коли Місяць потрапляє в тінь Землі."], ["Повне затемнення", "затемнення, під час якого спостерігач перебуває в повній тіні (сонячне) або Місяць повністю в тіні Землі (місячне)."], ["Часткове затемнення", "затемнення, коли закрито лише частину диска Сонця або Місяць частково в тіні Землі."], ["Кільцеве затемнення", "сонячне затемнення, коли Місяць закриває центр диска Сонця, залишаючи яскраве кільце."], ["Сонячна корона", "зовнішня світна оболонка Сонця, яку видно під час повного сонячного затемнення."]], "examples": [{"q": "Діаметр Місяця ≈ 3,5·10³ км, відстань до нього ≈ 3,8·10⁵ км. Діаметр Сонця ≈ 1,4·10⁶ км, відстань ≈ 1,5·10⁸ км. Порівняйте їх видимі розміри.", "s": ["Дано: D_М = 3,5·10³ км, L_М = 3,8·10⁵ км, D_С = 1,4·10⁶ км, L_С = 1,5·10⁸ км.", "Розв’язання: D_М/L_М = 3,5·10³ / 3,8·10⁵ ≈ 0,0092; D_С/L_С = 1,4·10⁶ / 1,5·10⁸ ≈ 0,0093.", "Відношення майже рівні, тому Місяць може саме закрити диск Сонця.", "Відповідь: видимі розміри Сонця й Місяця майже однакові (≈ 0,5°)."]}], "lab": null, "f": "Повне сонячне затемнення в одному й тому самому місці Землі трапляється в середньому лише раз на кілька століть.", "pr": ["Змоделюйте затемнення: ліхтарик (Сонце), м’ячик (Земля) і маленька кулька (Місяць). Опишіть, як розташувати тіла для сонячного та місячного затемнень, і зробіть схеми.", "Поясніть, чому сонячне затемнення буває лише в новолуння, а місячне — лише в повню."], "qz": [{"q": "Сонячне затемнення відбувається, коли", "o": ["Земля між Сонцем і Місяцем", "Місяць між Сонцем і Землею", "Сонце між Землею і Місяцем", "Місяць у тіні Землі"], "a": 1, "why": "Місяць закриває Сонце, і його тінь падає на Землю."}, {"q": "Місячне затемнення може бути лише", "o": ["у повню", "у новолуння", "у першій чверті", "будь-коли"], "a": 0, "why": "У повню Місяць за Землею відносно Сонця і може потрапити в її тінь."}, {"q": "Чому під час повного місячного затемнення Місяць червоний?", "o": ["Він сам світиться", "Його освітлюють зорі", "Земна атмосфера заломлює в тінь переважно червоне світло", "Через вулкани на Місяці"], "a": 2, "why": "Червоне світло найкраще проходить крізь атмосферу і потрапляє в тінь Землі."}, {"q": "Яке затемнення бачать з більшої території Землі?", "o": ["Повне сонячне", "Кільцеве сонячне", "Усі однаково", "Місячне"], "a": 3, "why": "Місячне затемнення видно з усієї нічної півкулі."}, {"q": "Чому затемнення не відбуваються щомісяця?", "o": ["Орбіта Місяця нахилена до площини орбіти Землі", "Місяць не завжди освітлений", "Сонце рухається", "Земля обертається навколо осі"], "a": 0, "why": "Через нахил орбіти Місяць зазвичай проходить вище або нижче лінії Сонце–Земля."}, {"q": "Кільцеве сонячне затемнення буває, коли", "o": ["Місяць найближче до Землі", "Місяць далі від Землі й здається меншим за Сонце", "Земля в тіні Місяця повністю", "хмарно"], "a": 1, "why": "Видимий диск Місяця менший за сонячний — навколо лишається яскраве кільце."}, {"q": "Як безпечно спостерігати сонячне затемнення?", "o": ["Неозброєним оком", "Крізь сонцезахисні окуляри", "Крізь бінокль", "Через спеціальний сертифікований сонячний фільтр або проєкцію на екран"], "a": 3, "why": "Звичайні окуляри й тим паче оптика без фільтра не захищають очі."}, {"q": "Яке явище, пов’язане з поширенням світла, пояснює затемнення?", "o": ["Відбивання світла", "Заломлення світла", "Прямолінійне поширення світла", "Розкладання світла"], "a": 2, "why": "Тінь Місяця і Землі утворюється прямолінійними променями Сонця."}]}, {"n": "52", "type": "problems", "t": "Розв’язування задач", "gr": "ГР3", "g": "Навчитися розв’язувати задачі на швидкість світла, прямолінійне поширення світла, тінь, камеру-обскуру та затемнення.", "blocks": [{"h": "Алгоритм розв’язування задач з геометричної оптики", "p": ["У задачах про тінь і камеру-обскуру обов’язково зробіть рисунок: проведіть промені від джерела через краї предмета. Знайдіть подібні трикутники й запишіть пропорцію між відповідними сторонами.", "У задачах на швидкість світла використовуйте s = ct; не забувайте, що для сигналу «туди й назад» шлях подвійний. Переводьте кілометри в метри, хвилини в секунди."], "ul": ["Рисунок → подібні трикутники → пропорція.", "Сонячні промені вважаємо паралельними.", "Від точкового джерела (лампи) промені розбіжні — розмір тіні залежить від відстаней.", "Камера-обскура: h/H = l/L.", "c ≈ 3·10⁸ м/с; s = ct; для відбитого сигналу s = ct/2."]}], "formulas": [{"f": "s = ct", "d": "шлях світла за час t"}, {"f": "s = ct/2", "d": "відстань за часом повернення відбитого світлового (лазерного) сигналу"}, {"f": "H/h = L/l", "d": "подібність трикутників у задачах на тінь"}, {"f": "h/H = l/L", "d": "камера-обскура"}], "terms": [], "examples": [{"q": "Лазерний сигнал, надісланий на Місяць, повернувся відбитим через 2,5 с. Знайдіть відстань до Місяця.", "s": ["Дано: t = 2,5 с, c = 3·10⁸ м/с.", "Розв’язання: світло пройшло шлях туди й назад: s = ct/2 = 3·10⁸ · 2,5 / 2 = 3,75·10⁸ м.", "Відповідь: ≈ 3,75·10⁸ м = 375 000 км."]}, {"q": "Учень зростом 1,6 м відкидає тінь завдовжки 2 м. Яка висота телевежі, тінь від якої в цей самий час 150 м?", "s": ["Дано: h = 1,6 м, l = 2 м, L = 150 м.", "Розв’язання: H/h = L/l, H = h·L/l = 1,6 · 150 / 2 = 120 м.", "Відповідь: H = 120 м."]}, {"q": "Лампа висить на висоті 3 м над підлогою. Людина зростом 1,8 м стоїть на відстані 2 м від точки під лампою. Яка довжина тіні людини?", "s": ["Дано: H = 3 м, h = 1,8 м, a = 2 м.", "Розв’язання: промінь від лампи через маківку людини утворює подібні трикутники: H/h = (a + x)/x, де x — довжина тіні.", "3/1,8 = (2 + x)/x → 3x = 1,8(2 + x) → 1,2x = 3,6 → x = 3 м.", "Відповідь: 3 м."]}, {"q": "Камера-обскура має довжину 15 см. Зображення будинку на її задній стінці має висоту 3 см. Висота будинку 12 м. На якій відстані від будинку розташована камера?", "s": ["Дано: l = 15 см, h = 3 см, H = 12 м.", "СІ: l = 0,15 м, h = 0,03 м.", "Розв’язання: h/H = l/L, L = H·l/h = 12 · 0,15 / 0,03 = 60 м.", "Відповідь: L = 60 м."]}, {"q": "Найближча зоря Проксима Центавра розташована на відстані ≈ 4·10¹⁶ м. Скільки років іде від неї світло (1 рік ≈ 3,15·10⁷ с)?", "s": ["Дано: s = 4·10¹⁶ м, c = 3·10⁸ м/с.", "Розв’язання: t = s/c = 4·10¹⁶ / 3·10⁸ ≈ 1,33·10⁸ с; у роках: 1,33·10⁸ / 3,15·10⁷ ≈ 4,2 року.", "Відповідь: ≈ 4,2 року."]}], "lab": null, "f": "", "pr": ["Скільки часу йде світло від Землі до Марса, якщо відстань між ними в певний момент 7,8·10¹⁰ м? (260 с ≈ 4 хв 20 с)", "Паркан заввишки 1,5 м відкидає тінь 2,5 м. Яка висота дерева, тінь якого в цей самий час 10 м? (6 м)", "Предмет заввишки 60 см розташований на відстані 1,2 м від камери-обскури довжиною 30 см. Знайдіть висоту зображення. (15 см)", "Ліхтар висить на висоті 4 м. Хлопчик зростом 1,6 м відкидає тінь 2 м. На якій відстані від стовпа ліхтаря стоїть хлопчик? (3 м)"], "qz": [{"q": "Яку відстань світло проходить за 0,01 с?", "o": ["3·10⁶ м", "3·10⁸ м", "3·10¹⁰ м", "3·10⁴ м"], "a": 0, "why": "s = 3·10⁸ · 0,01 = 3·10⁶ м = 3000 км."}, {"q": "Лазерний імпульс від відбивача повернувся через 2 мкс. Відстань до відбивача —", "o": ["600 м", "300 м", "150 м", "3 км"], "a": 1, "why": "s = 3·10⁸ · 2·10⁻⁶ / 2 = 300 м."}, {"q": "Вертикальна жердина 2 м відкидає тінь 1 м. Тінь вежі — 25 м. Висота вежі —", "o": ["12,5 м", "25 м", "27 м", "50 м"], "a": 3, "why": "H = 2·25/1 = 50 м."}, {"q": "Як зміниться висота зображення в камері-обскурі, якщо камеру віддалити від предмета вдвічі?", "o": ["Збільшиться вдвічі", "Не зміниться", "Зменшиться вдвічі", "Зменшиться в 4 рази"], "a": 2, "why": "h = H·l/L: при збільшенні L удвічі h зменшується вдвічі."}, {"q": "Людина підходить до ліхтаря. Як змінюється довжина її тіні?", "o": ["Зменшується", "Збільшується", "Не змінюється", "Спочатку зростає, потім зменшується"], "a": 0, "why": "Що ближче до джерела, то крутіше падають промені і коротша тінь."}, {"q": "Чому в задачах на тінь від Сонця промені вважають паралельними?", "o": ["Сонце точкове", "Сонце дуже далеко порівняно з розмірами предметів", "Сонячне світло поширюється повільно", "Так простіше рахувати, хоча це неправильно"], "a": 1, "why": "Через величезну відстань до Сонця промені, що падають на невеликі предмети, практично паралельні."}, {"q": "Предмет 2 м на відстані 5 м від камери-обскури довжиною 25 см. Висота зображення —", "o": ["2,5 см", "40 см", "50 см", "10 см"], "a": 3, "why": "h = 2 · 0,25 / 5 = 0,1 м = 10 см."}, {"q": "Світло від зорі йшло до Землі 10 років. Відстань до зорі —", "o": ["10 світлових років", "3·10⁹ м", "10 км", "1 світловий рік"], "a": 0, "why": "Світловий рік — відстань, яку світло проходить за рік, тому 10 років → 10 св. р."}]}, {"n": "53", "type": "theory", "t": "Відбивання світла. Закони відбивання світла", "gr": "ГР2", "g": "Сформулювати закони відбивання світла, навчитися будувати відбитий промінь і розрізняти дзеркальне та розсіяне відбивання.", "blocks": [{"h": "Явище відбивання світла", "p": ["Коли світло падає на межу двох середовищ, частина його повертається в перше середовище — це відбивання світла. Саме завдяки відбитому світлу ми бачимо більшість предметів навколо: книгу, стіни, Місяць — вони не світяться самі, а відбивають світло джерел.", "Для опису відбивання в точці падіння проводять перпендикуляр до поверхні. Кут падіння α — кут між падаючим променем і перпендикуляром; кут відбивання γ — кут між відбитим променем і перпендикуляром."], "ul": ["Падаючий промінь — промінь, що йде від джерела до поверхні.", "Відбитий промінь — промінь, що йде від поверхні після відбивання.", "Кути відраховують від перпендикуляра, а не від поверхні!", "Білі поверхні відбивають майже все світло, чорні — майже все поглинають."]}, {"h": "Закони відбивання світла", "p": ["Перший закон: падаючий промінь, відбитий промінь і перпендикуляр до поверхні, проведений у точці падіння, лежать в одній площині. Другий закон: кут відбивання дорівнює куту падіння (γ = α).", "З законів відбивання випливає оборотність світлових променів: якщо пустити промінь назустріч відбитому, після відбивання він піде шляхом падаючого."], "ul": ["γ = α — головна формула теми.", "Якщо промінь падає перпендикулярно (α = 0°), він відбивається назад сам у себе.", "Кут між падаючим і відбитим променями дорівнює 2α.", "Якщо дано кут між променем і поверхнею β, то α = 90° − β.", "Оборотність променів: «якщо я бачу тебе в дзеркалі, ти бачиш мене»."]}, {"h": "Дзеркальне і розсіяне відбивання", "p": ["Від гладенької поверхні (дзеркало, спокійна вода, полірований метал) паралельний пучок відбивається також паралельним — це дзеркальне відбивання. Воно створює зображення і відблиски.", "Від шорсткої поверхні (папір, тканина, стіна) паралельні промені відбиваються в усіх напрямках — це розсіяне (дифузне) відбивання. Закони відбивання виконуються для кожного променя, але маленькі ділянки поверхні мають різний нахил. Завдяки розсіяному відбиванню ми бачимо предмети з будь-якого боку."], "ul": ["Дзеркальне відбивання — від гладенької поверхні, дає зображення.", "Розсіяне відбивання — від шорсткої поверхні, освітлює простір рівномірно.", "Мокра дорога вночі відбиває світло фар дзеркально — тому вона здається темною і сліпить.", "Екран у кінотеатрі роблять матовим, щоб зображення було видно з усіх місць.", "Світлоповертальні елементи на одязі повертають світло фар назад до водія."]}], "formulas": [{"f": "γ = α", "d": "закон відбивання: γ — кут відбивання, α — кут падіння (обидва вимірюють від перпендикуляра до поверхні)"}, {"f": "α = 90° − β", "d": "β — кут між падаючим променем і поверхнею"}, {"f": "φ = α + γ = 2α", "d": "φ — кут між падаючим і відбитим променями"}], "terms": [["Відбивання світла", "явище повернення світла в перше середовище на межі двох середовищ."], ["Кут падіння", "кут між падаючим променем і перпендикуляром до поверхні, проведеним у точці падіння."], ["Кут відбивання", "кут між відбитим променем і перпендикуляром до поверхні в точці падіння."], ["Дзеркальне відбивання", "відбивання від гладенької поверхні, за якого паралельний пучок залишається паралельним."], ["Розсіяне відбивання", "відбивання від шорсткої поверхні, за якого світло відбивається в усіх напрямках."], ["Оборотність світлових променів", "властивість, за якою промінь, пущений назустріч відбитому, після відбивання йде шляхом падаючого."]], "examples": [{"q": "Кут між падаючим променем і поверхнею дзеркала 30°. Знайдіть кут відбивання і кут між падаючим та відбитим променями.", "s": ["Дано: β = 30°.", "Розв’язання: α = 90° − β = 60°; γ = α = 60°; φ = α + γ = 120°.", "Відповідь: γ = 60°, φ = 120°."]}, {"q": "Кут між падаючим і відбитим променями 80°. Як зміниться цей кут, якщо кут падіння збільшити на 15°?", "s": ["Дано: φ₁ = 80°, Δα = 15°.", "Розв’язання: α₁ = φ₁/2 = 40°; α₂ = 40° + 15° = 55°; φ₂ = 2α₂ = 110°.", "Кут збільшиться на 30°.", "Відповідь: стане 110°, тобто збільшиться на 30°."]}], "lab": null, "f": "На Місяці астронавти залишили дзеркальні відбивачі; лазерні імпульси, відбиті від них, дозволяють вимірювати відстань до Місяця з точністю до сантиметрів.", "pr": ["Посвітіть ліхтариком на дзеркало і на аркуш білого паперу в темній кімнаті. Опишіть, чим відрізняється відбите світло, і поясніть різницю.", "Побудуйте в зошиті відбиті промені для кутів падіння 20°, 45° і 70° (використайте транспортир)."], "qz": [{"q": "Кут падіння вимірюють між падаючим променем і", "o": ["поверхнею", "відбитим променем", "перпендикуляром до поверхні в точці падіння", "горизонтом"], "a": 2, "why": "Обидва кути — падіння й відбивання — відраховують від перпендикуляра."}, {"q": "Кут падіння 35°. Кут відбивання —", "o": ["55°", "35°", "70°", "145°"], "a": 1, "why": "За законом відбивання γ = α."}, {"q": "Промінь падає на дзеркало під кутом 20° до поверхні. Кут відбивання —", "o": ["70°", "20°", "40°", "140°"], "a": 0, "why": "α = 90° − 20° = 70°, γ = α = 70°."}, {"q": "Кут між падаючим і відбитим променями 90°. Кут падіння —", "o": ["90°", "30°", "60°", "45°"], "a": 3, "why": "φ = 2α → α = 45°."}, {"q": "Чому ми бачимо аркуш паперу з будь-якого місця кімнати?", "o": ["Папір світиться", "Папір розсіює світло в усіх напрямках", "Папір поглинає світло", "Папір дзеркально відбиває світло"], "a": 1, "why": "Шорстка поверхня дає розсіяне відбивання."}, {"q": "Промінь падає перпендикулярно до дзеркала. Кут відбивання —", "o": ["0°", "90°", "180°", "45°"], "a": 0, "why": "α = 0°, отже γ = 0° — промінь повертається назад."}, {"q": "Де відбувається дзеркальне відбивання?", "o": ["Від стіни", "Від тканини", "Від спокійної поверхні озера", "Від асфальту в суху погоду"], "a": 2, "why": "Гладенька поверхня води відбиває паралельний пучок паралельно."}, {"q": "Кут падіння зменшили на 10°. Кут між падаючим і відбитим променями", "o": ["зменшився на 10°", "не змінився", "збільшився на 20°", "зменшився на 20°"], "a": 3, "why": "φ = 2α, тому зменшення α на 10° зменшує φ на 20°."}]}, {"n": "54", "type": "theory", "t": "Плоске дзеркало. Побудова зображення в плоскому дзеркалі", "gr": "ГР2, ГР3", "g": "Навчитися будувати зображення предметів у плоскому дзеркалі та знати його властивості.", "blocks": [{"h": "Як утворюється зображення в дзеркалі", "p": ["Плоске дзеркало — гладенька плоска поверхня, яка дзеркально відбиває світло. Промені від точки S предмета падають на дзеркало і відбиваються за законом відбивання. Відбиті промені розходяться, але їх продовження за дзеркалом перетинаються в одній точці S₁. Око сприймає відбиті промені так, ніби вони виходять з точки S₁, — там ми й «бачимо» зображення.", "Оскільки в точці S₁ перетинаються не самі промені, а їх продовження, зображення в плоскому дзеркалі уявне: його не можна отримати на екрані, поставленому за дзеркалом."], "ul": ["Зображення утворюється продовженнями відбитих променів.", "За дзеркалом світла немає — зображення уявне.", "Для побудови достатньо двох променів від кожної точки.", "Око бачить зображення, лише якщо відбиті промені потрапляють в око."]}, {"h": "Властивості зображення в плоскому дзеркалі", "p": ["Зображення в плоскому дзеркалі уявне, пряме, такого самого розміру, як предмет, і розташоване симетрично предмету відносно площини дзеркала: на такій самій відстані за дзеркалом, як предмет перед ним.", "Через симетрію ліве і праве в зображенні міняються місцями: піднявши праву руку, ви бачите, що «двійник» піднімає ліву. Тому слово «ШВИДКА» на капоті машин швидкої допомоги пишуть дзеркально — щоб водій попереду прочитав його в дзеркалі заднього огляду."], "ul": ["Уявне.", "Пряме (не перевернуте).", "Рівне за розміром предмету.", "Симетричне предмету відносно дзеркала: d₁ = d.", "Ліве і праве міняються місцями."]}, {"h": "Як побудувати зображення", "p": ["Найпростіший спосіб — скористатися симетрією. Із кожної характерної точки предмета опустіть перпендикуляр на площину дзеркала (або її продовження) і відкладіть за дзеркалом таку саму відстань. З’єднайте отримані точки — це зображення. Уявні лінії і зображення зображують штриховими.", "Щоб показати, у якій ділянці можна побачити зображення, з’єднайте точку зображення з краями дзеркала: око має бути в області між цими лініями."], "ul": ["Крок 1: перпендикуляр з точки A на дзеркало.", "Крок 2: відкладіть за дзеркалом A₁ на тій самій відстані.", "Крок 3: повторіть для точки B.", "Крок 4: з’єднайте A₁ і B₁ штриховою лінією.", "Перевірка: зображення рівне предмету й симетричне йому."]}, {"h": "Застосування плоских дзеркал", "p": ["Плоскі дзеркала використовують у побуті, у перископах (два дзеркала під кутом 45° дозволяють дивитися з-за перешкоди), у дзеркальних фотоапаратах, проєкторах, оптичних приладах. Система з двох дзеркал під кутом дає кілька зображень — на цьому побудовано калейдоскоп."], "ul": ["Перископ — на підводних човнах і в окопах.", "Калейдоскоп — дзеркала під кутом 60° дають 5 зображень.", "Дзеркало в танцювальному залі зорово збільшує простір.", "Щоб побачити себе на повний зріст, достатньо дзеркала висотою в половину зросту."]}], "formulas": [{"f": "d₁ = d", "d": "d — відстань від предмета до дзеркала, d₁ — відстань від зображення до дзеркала"}, {"f": "h₁ = h", "d": "висота зображення дорівнює висоті предмета"}, {"f": "N = 360°/φ − 1", "d": "кількість зображень у двох дзеркалах, розміщених під кутом φ (якщо 360°/φ — ціле число)"}], "terms": [["Плоске дзеркало", "плоска гладенька поверхня, що дзеркально відбиває світло."], ["Уявне зображення", "зображення, утворене перетином продовжень відбитих променів; його не можна отримати на екрані."], ["Пряме зображення", "зображення, не перевернуте відносно предмета."], ["Симетрія відносно дзеркала", "розташування точки та її зображення на одному перпендикулярі до дзеркала на однакових відстанях від нього."], ["Перископ", "оптичний прилад з двох дзеркал (або призм) для спостереження з-за перешкоди."]], "examples": [{"q": "Дівчинка стоїть на відстані 1,5 м від плоского дзеркала. Потім вона наблизилася до нього на 0,5 м. Якою стала відстань між дівчинкою та її зображенням?", "s": ["Дано: d₀ = 1,5 м, Δd = 0,5 м.", "Розв’язання: нова відстань до дзеркала d = 1,5 − 0,5 = 1 м; зображення на такій самій відстані за дзеркалом: d₁ = 1 м.", "Відстань між дівчинкою і зображенням L = d + d₁ = 2 м.", "Відповідь: 2 м."]}, {"q": "Хлопець іде до дзеркала зі швидкістю 1 м/с. З якою швидкістю він наближається до свого зображення?", "s": ["Дано: v = 1 м/с.", "Розв’язання: зображення симетричне, тому воно наближається до дзеркала з такою самою швидкістю 1 м/с назустріч хлопцю.", "Швидкість зближення v₁ = v + v = 2 м/с.", "Відповідь: 2 м/с."]}], "lab": null, "f": "Щоб побачити себе на повний зріст, достатньо дзеркала висотою вдвічі меншою за ваш зріст, і це не залежить від того, наскільки далеко ви стоїте від дзеркала.", "pr": ["Побудуйте в зошиті зображення відрізка AB довжиною 3 см, розташованого під кутом 45° до дзеркала, і зображення трикутника з вершинами на різних відстанях від дзеркала.", "Виготовте простий перископ з картонної коробки (наприклад, від молока чи соку) і двох маленьких дзеркалець під кутом 45°. Поясніть, як у ньому йде світло."], "qz": [{"q": "Зображення в плоскому дзеркалі є", "o": ["дійсним і перевернутим", "уявним, прямим, рівним предмету", "дійсним і збільшеним", "уявним і зменшеним"], "a": 1, "why": "Плоске дзеркало дає уявне пряме зображення того самого розміру."}, {"q": "Предмет на відстані 40 см від дзеркала. Відстань від предмета до зображення —", "o": ["40 см", "20 см", "80 см", "160 см"], "a": 2, "why": "Зображення за дзеркалом на 40 см, разом 80 см."}, {"q": "Чому зображення в плоскому дзеркалі називають уявним?", "o": ["Воно утворене продовженнями відбитих променів", "Воно перевернуте", "Воно менше за предмет", "Воно кольорове"], "a": 0, "why": "За дзеркалом перетинаються лише продовження променів, а не самі промені."}, {"q": "Людина відійшла від дзеркала на 1 м. Відстань між нею та зображенням", "o": ["збільшилася на 1 м", "не змінилася", "зменшилася на 2 м", "збільшилася на 2 м"], "a": 3, "why": "І людина, і зображення віддалилися від дзеркала на 1 м кожне."}, {"q": "Ви піднімаєте праву руку перед дзеркалом. Зображення піднімає", "o": ["ліву руку", "праву руку", "обидві руки", "нічого не піднімає"], "a": 0, "why": "Дзеркальна симетрія міняє ліве і праве місцями."}, {"q": "Скільки зображень дають два дзеркала під кутом 90°?", "o": ["2", "3", "4", "1"], "a": 1, "why": "N = 360°/90° − 1 = 3."}, {"q": "Учень зростом 1,6 м хоче бачити себе на повний зріст. Мінімальна висота дзеркала —", "o": ["1,6 м", "0,4 м", "0,8 м", "3,2 м"], "a": 2, "why": "Достатньо дзеркала висотою в половину зросту: 0,8 м."}, {"q": "Чому напис на машині швидкої допомоги роблять дзеркальним?", "o": ["Для краси", "Щоб його не можна було прочитати", "Так дешевше", "Щоб водій попереду прочитав його в дзеркалі заднього огляду"], "a": 3, "why": "Дзеркало ще раз міняє ліве й праве, і напис читається правильно."}]}, {"n": "55", "type": "lab", "t": "Лабораторна робота № 6 «Дослідження явища відбивання світла від плоского дзеркала»", "gr": "ГР1", "g": "Експериментально перевірити закони відбивання світла: з’ясувати, як пов’язані кут падіння і кут відбивання та де розташоване зображення в плоскому дзеркалі.", "blocks": [{"h": "Теорія до роботи", "p": ["Коли світло падає на гладку поверхню, воно відбивається за певними правилами. Кут падіння α — це кут між падаючим променем і перпендикуляром до поверхні в точці падіння, кут відбивання β — кут між відбитим променем і тим самим перпендикуляром.", "Плоске дзеркало дає уявне, пряме зображення того самого розміру, що й предмет. Зображення розташоване симетрично предмету відносно площини дзеркала: на тій самій відстані «за» дзеркалом."], "ul": ["Падаючий промінь, відбитий промінь і перпендикуляр до поверхні лежать в одній площині.", "Кут відбивання дорівнює куту падіння: β = α.", "Кути вимірюють від перпендикуляра, а не від поверхні дзеркала.", "Якщо промінь падає перпендикулярно (α = 0°), він відбивається назад сам у себе.", "Зображення в плоскому дзеркалі уявне: його не можна отримати на екрані."]}, {"h": "Як виконати роботу дистанційно", "p": ["Цю роботу можна безпечно виконати вдома: потрібні невелике дзеркальце, аркуш паперу, транспортир, лінійка, олівець і кілька шпильок або канцелярських кнопок. Замість шпильок можна взяти дві однакові свічки чи олівці для перевірки розташування зображення.", "Якщо дзеркальця немає, скористайтеся віртуальною лабораторією PhET «Заломлення світла» (Bending Light): у ній можна поставити однакові середовища або спостерігати відбитий промінь і вимірювати кути вбудованим транспортиром."], "ul": ["Не використовуйте лазерну указку: промінь, відбитий від дзеркала, може потрапити в очі.", "Беріть дзеркало без відколів, тримайте його за краї в рамці або підставці.", "Свічки запалюйте лише в присутності дорослих або замініть їх олівцями.", "Фотографуйте аркуш з побудовами — фото знадобиться для звіту."]}], "formulas": [{"f": "β = α", "d": "α — кут падіння, β — кут відбивання (обидва відраховують від перпендикуляра до поверхні)"}, {"f": "a = a′", "d": "a — відстань від предмета до дзеркала, a′ — відстань від зображення до дзеркала"}], "terms": [["Кут падіння", "кут між падаючим променем і перпендикуляром до відбивної поверхні, проведеним у точці падіння."], ["Кут відбивання", "кут між відбитим променем і перпендикуляром до відбивної поверхні в точці падіння."], ["Уявне зображення", "зображення, утворене перетином продовжень відбитих (заломлених) променів; його не можна отримати на екрані."], ["Дзеркальне відбивання", "відбивання світла від гладкої поверхні, за якого паралельний пучок залишається паралельним."]], "examples": [], "lab": {"goal": "Перевірити, що кут відбивання світла дорівнює куту падіння, і переконатися, що зображення предмета в плоскому дзеркалі розташоване симетрично предмету відносно дзеркала.", "equip": ["плоске дзеркальце на підставці (або закріплене пластиліном вертикально)", "аркуш паперу на картоні чи пінопласті", "транспортир", "лінійка", "олівець", "3–4 шпильки або кнопки"], "safety": ["Обережно поводьтеся зі склом дзеркала, не беріть дзеркало з відколами.", "Шпильки зберігайте в коробці, не залишайте на столі вістрям догори.", "Не направляйте відбите сонячне світло чи світло ліхтарика в очі людям."], "steps": ["Проведіть на аркуші пряму MN і поставте дзеркало вертикально так, щоб його відбивна поверхня збігалася з цією прямою.", "Позначте на MN точку O і проведіть через неї перпендикуляр OK до дзеркала.", "Встроміть шпильку 1 на відстані 5–6 см від дзеркала, а шпильку 2 — у точку O; лінія 1–O зображує падаючий промінь.", "Дивлячись у дзеркало з іншого боку від перпендикуляра, встроміть шпильки 3 і 4 так, щоб вони закривали зображення шпильок 1 і 2 (усі чотири мають виглядати як одна лінія).", "Заберіть дзеркало і шпильки, проведіть промінь через точки 3 і 4 до точки O — це відбитий промінь.", "Виміряйте транспортиром кут падіння α і кут відбивання β, запишіть у таблицю.", "Повторіть досліди ще для двох інших кутів падіння (наприклад, близько 20°, 40° і 60°).", "Для перевірки розташування зображення поставте перед дзеркалом шпильку (олівець), а за дзеркалом знайдіть місце, де друга шпилька «збігається» із зображенням першої; виміряйте відстані від обох шпильок до дзеркала."], "calc": ["Для кожного досліду знайдіть різницю |α − β|.", "Оцініть абсолютну похибку вимірювання кута: Δ = половина ціни поділки транспортира (зазвичай 0,5°) плюс похибка побудови (≈ 1–2°).", "Порівняйте відстані a і a′ від предмета і зображення до дзеркала.", "Зробіть висновок, чи виконується закон β = α в межах похибки."], "table": ["№ досліду", "Кут падіння α, °", "Кут відбивання β, °", "|α − β|, °", "a, см", "a′, см"], "sample": "Очікується, що в кожному досліді кут відбивання відрізнятиметься від кута падіння не більше ніж на 1–3°, а відстані від предмета і від його зображення до дзеркала будуть практично однаковими.", "questions": ["Чому кути падіння й відбивання вимірюють від перпендикуляра, а не від поверхні дзеркала?", "Які причини можуть призвести до того, що виміряні α і β трохи відрізняються?", "Яким буде кут відбивання, якщо промінь падає перпендикулярно до дзеркала?", "Чому зображення в плоскому дзеркалі називають уявним?", "Як зміниться кут між падаючим і відбитим променями, якщо кут падіння збільшити на 10°?"]}, "f": "На капотах автомобілів швидкої допомоги в багатьох країнах слово «AMBULANCE» пишуть дзеркально, щоб водій автомобіля попереду правильно прочитав його в дзеркалі заднього огляду.", "pr": ["Оформіть звіт: мета, обладнання, рисунок ходу променів, таблиця, обчислення похибки й висновок; надішліть фото аркуша з побудовами.", "Якщо немає обладнання — виконайте роботу у віртуальній лабораторії PhET «Заломлення світла» (Bending Light): для трьох кутів падіння виміряйте кут відбивання і заповніть таблицю."], "qz": [{"q": "Кут падіння світла на дзеркало дорівнює 35°. Чому дорівнює кут відбивання?", "o": ["55°", "35°", "70°", "145°"], "a": 1, "why": "За законом відбивання β = α = 35°."}, {"q": "Від чого відраховують кути падіння і відбивання?", "o": ["Від поверхні дзеркала", "Від горизонту", "Від перпендикуляра до поверхні в точці падіння", "Від падаючого променя"], "a": 2, "why": "За означенням обидва кути вимірюють від перпендикуляра до відбивної поверхні."}, {"q": "Кут між падаючим і відбитим променями 90°. Який кут падіння?", "o": ["45°", "90°", "30°", "60°"], "a": 0, "why": "Кут між променями дорівнює α + β = 2α, отже α = 90° : 2 = 45°."}, {"q": "Шпилька стоїть на відстані 6 см від плоского дзеркала. Де її зображення?", "o": ["На поверхні дзеркала", "На відстані 3 см за дзеркалом", "На відстані 12 см за дзеркалом", "На відстані 6 см за дзеркалом"], "a": 3, "why": "Зображення в плоскому дзеркалі симетричне предмету: a′ = a = 6 см."}, {"q": "Яке зображення дає плоске дзеркало?", "o": ["Уявне, пряме, такого самого розміру", "Дійсне, перевернуте, зменшене", "Дійсне, пряме, збільшене", "Уявне, перевернуте, зменшене"], "a": 0, "why": "Плоске дзеркало завжди дає уявне пряме зображення, що дорівнює предмету за розміром."}, {"q": "Чому під час роботи не варто використовувати лазерну указку вдома?", "o": ["Лазер не відбивається від дзеркала", "Відбитий промінь може потрапити в очі й пошкодити зір", "Лазер змінює закон відбивання", "Лазерне світло не видно на папері"], "a": 1, "why": "Відбитий лазерний промінь небезпечний для очей, тому вдома краще працювати зі шпильками."}]}, {"n": "56", "type": "theory", "t": "Заломлення світла на межі поділу двох середовищ. Закони заломлення світла", "gr": "ГР1, ГР3", "g": "Зрозуміти, чому світло змінює напрямок на межі двох прозорих середовищ, і навчитися застосовувати закон заломлення та поняття показника заломлення.", "blocks": [{"h": "Що таке заломлення світла", "p": ["Опустіть ложку в склянку з водою — здається, що вона «зламалася» на поверхні води. Причина в тому, що світло, переходячи з одного прозорого середовища в інше, змінює напрямок поширення. Це явище називають заломленням світла.", "На межі двох середовищ частина світла відбивається, а частина проходить у друге середовище, заломлюючись. Кут між заломленим променем і перпендикуляром до межі в точці падіння називають кутом заломлення γ."], "ul": ["Заломлення відбувається лише тоді, коли світло падає на межу під кутом (α ≠ 0°).", "Якщо промінь падає перпендикулярно до межі, він проходить не заломлюючись.", "Одночасно із заломленням завжди відбувається часткове відбивання.", "Приклади: «зламана» ложка, водойма здається мілкішою, ніж є насправді, міраж над розпеченим асфальтом."]}, {"h": "Чому світло заломлюється", "p": ["Світло в різних середовищах поширюється з різною швидкістю: у вакуумі c ≈ 3·10⁸ м/с, у воді приблизно в 1,33 раза повільніше, у склі — приблизно в 1,5 раза. Саме зміна швидкості на межі середовищ спричиняє зміну напрямку променя.", "Середовище, у якому швидкість світла менша, називають оптично густішим. Оптична густина не обов’язково збігається з густиною речовини: олія легша за воду, але оптично густіша."], "ul": ["Абсолютний показник заломлення n = c/v показує, у скільки разів швидкість світла в середовищі менша, ніж у вакуумі.", "Для повітря n ≈ 1,0003 ≈ 1, для води ≈ 1,33, для скла ≈ 1,5–1,6, для алмазу ≈ 2,42.", "Чим більший n, тим оптично густіше середовище.", "Абсолютний показник заломлення будь-якого середовища більший за 1."]}, {"h": "Закони заломлення світла", "p": ["Досліди показують, що заломлення підпорядковується двом законам. Перший стосується розташування променів, другий — зв’язку між кутами.", "Відношення синуса кута падіння до синуса кута заломлення для двох даних середовищ є сталою величиною — відносним показником заломлення другого середовища відносно першого."], "ul": ["Падаючий промінь, заломлений промінь і перпендикуляр до межі в точці падіння лежать в одній площині.", "sin α / sin γ = n₂₁ = n₂/n₁ = v₁/v₂.", "Під час переходу в оптично густіше середовище (n₂ > n₁) промінь наближається до перпендикуляра: γ < α.", "Під час переходу в оптично менш густе середовище (n₂ < n₁) промінь віддаляється від перпендикуляра: γ > α.", "Світлові промені оборотні: якщо пустити світло назад заломленим шляхом, воно пройде падаючим."]}, {"h": "Заломлення в житті та техніці", "p": ["Через заломлення предмети під водою здаються ближчими до поверхні, тому, заходячи в незнайому водойму, легко помилитися з глибиною. Рибалки, які б’ють рибу острогою, цілять нижче, ніж бачать рибу.", "На заломленні ґрунтується дія лінз, призм, окулярів, фотоапаратів, мікроскопів."], "ul": ["Водойма здається приблизно на чверть мілкішою, ніж є насправді, — це небезпечно для купання.", "Атмосферна рефракція змінює видиме положення зірок і Сонця біля горизонту.", "Скляна призма відхиляє промені до своєї основи.", "Лінзи змінюють хід променів саме завдяки заломленню на їхніх поверхнях."]}], "formulas": [{"f": "sin α / sin γ = n₂₁", "d": "α — кут падіння, γ — кут заломлення, n₂₁ — відносний показник заломлення другого середовища відносно першого"}, {"f": "n₂₁ = n₂/n₁ = v₁/v₂", "d": "n₁, n₂ — абсолютні показники заломлення середовищ, v₁, v₂ — швидкості світла в них"}, {"f": "n = c/v", "d": "n — абсолютний показник заломлення, c ≈ 3·10⁸ м/с — швидкість світла у вакуумі, v — швидкість світла в середовищі"}, {"f": "n₁·sin α = n₂·sin γ", "d": "інша форма запису закону заломлення"}], "terms": [["Заломлення світла", "зміна напрямку поширення світла під час його переходу через межу поділу двох прозорих середовищ."], ["Кут заломлення", "кут між заломленим променем і перпендикуляром до межі поділу середовищ у точці падіння."], ["Абсолютний показник заломлення", "фізична величина, що показує, у скільки разів швидкість світла в середовищі менша, ніж у вакуумі."], ["Відносний показник заломлення", "відношення абсолютних показників заломлення другого і першого середовищ, що дорівнює відношенню синусів кута падіння і кута заломлення."], ["Оптично густіше середовище", "з двох середовищ те, у якому швидкість світла менша, а показник заломлення більший."]], "examples": [{"q": "Промінь світла падає з повітря на скло під кутом 45°. Показник заломлення скла 1,41. Знайдіть кут заломлення.", "s": ["Дано: α = 45°, n₁ = 1, n₂ = 1,41.", "Розв’язання: sin α / sin γ = n₂/n₁, звідки sin γ = sin α · n₁/n₂ = 0,707 · 1/1,41 ≈ 0,5.", "γ = 30°.", "Відповідь: кут заломлення 30°."]}, {"q": "Визначте швидкість світла в склі, показник заломлення якого 1,5.", "s": ["Дано: n = 1,5, c = 3·10⁸ м/с.", "Розв’язання: n = c/v, отже v = c/n = 3·10⁸ м/с : 1,5 = 2·10⁸ м/с.", "Відповідь: v = 2·10⁸ м/с."]}], "lab": null, "f": "Через заломлення світла в атмосфері ми бачимо Сонце над горизонтом ще кілька хвилин після того, як воно геометрично вже зайшло: атмосфера «піднімає» видиме положення світила приблизно на його видимий діаметр.", "pr": ["Покладіть монету на дно непрозорої чашки і відійдіть так, щоб монети не було видно за краєм. Попросіть когось обережно налити води — монета «з’явиться». Поясніть це явище письмово з рисунком ходу променів.", "Розв’яжіть задачу: промінь падає з повітря у воду (n = 1,33) під кутом 30°. Знайдіть кут заломлення і швидкість світла у воді."], "qz": [{"q": "Що відбувається зі світлом на межі двох прозорих середовищ, якщо промінь падає під кутом?", "o": ["Лише поглинається", "Лише відбивається", "Частково відбивається і частково заломлюється", "Зупиняється"], "a": 2, "why": "На межі прозорих середовищ одночасно відбувається відбивання і заломлення."}, {"q": "Промінь переходить з повітря у воду. Як співвідносяться кути?", "o": ["γ < α", "γ > α", "γ = α", "γ = 90°"], "a": 0, "why": "Вода оптично густіша за повітря, тому промінь наближається до перпендикуляра."}, {"q": "Чому дорівнює кут заломлення, якщо промінь падає перпендикулярно до межі?", "o": ["90°", "45°", "Залежить від середовища", "0°"], "a": 3, "why": "При α = 0° світло проходить межу, не змінюючи напрямку, тому γ = 0°."}, {"q": "Швидкість світла в речовині 2,25·10⁸ м/с. Який її показник заломлення?", "o": ["1,5", "1,33", "2,25", "0,75"], "a": 1, "why": "n = c/v = 3·10⁸ : 2,25·10⁸ ≈ 1,33."}, {"q": "Яке середовище оптично найгустіше?", "o": ["Повітря (n ≈ 1)", "Вода (n ≈ 1,33)", "Алмаз (n ≈ 2,42)", "Скло (n ≈ 1,5)"], "a": 2, "why": "Оптично найгустіше середовище має найбільший показник заломлення — алмаз."}, {"q": "Який вираз є законом заломлення?", "o": ["sin α / sin γ = n₂₁", "α = γ", "sin α · sin γ = 1", "α + γ = 90°"], "a": 0, "why": "Відношення синусів кутів падіння і заломлення дорівнює відносному показнику заломлення."}, {"q": "Чому водойма здається мілкішою, ніж є насправді?", "o": ["Через поглинання світла водою", "Через відбивання світла від дна", "Через розсіювання світла", "Через заломлення світла на межі вода–повітря"], "a": 3, "why": "Промені від дна заломлюються на поверхні, і око бачить дно вище, ніж воно є."}, {"q": "Промінь падає з повітря на скло (n = 2) під кутом 30°. Знайдіть sin γ.", "o": ["0,5", "0,25", "1", "0,125"], "a": 1, "why": "sin γ = sin 30° / 2 = 0,5 : 2 = 0,25."}]}, {"n": "57", "type": "theory", "t": "Повне внутрішнє відбивання світла", "gr": "ГР1, ГР3", "g": "З’ясувати, за яких умов світло повністю відбивається від межі двох середовищ, навчитися обчислювати граничний кут і пояснювати застосування цього явища.", "blocks": [{"h": "Перехід світла в оптично менш густе середовище", "p": ["Коли світло переходить з оптично густішого середовища в менш густе (наприклад, зі скла чи води в повітря), кут заломлення більший за кут падіння: γ > α. Якщо поступово збільшувати кут падіння, заломлений промінь дедалі більше «притискається» до межі поділу, а його яскравість зменшується.", "За деякого кута падіння α₀ кут заломлення стає 90°: заломлений промінь ковзає вздовж межі. Цей кут називають граничним кутом повного відбивання."], "ul": ["Із збільшенням α зростає частка відбитого світла і зменшується частка заломленого.", "При α = α₀ кут заломлення γ = 90°.", "При α > α₀ світло зовсім не виходить у друге середовище, а повністю відбивається.", "Явище можливе лише під час переходу з оптично густішого середовища в менш густе."]}, {"h": "Граничний кут", "p": ["Граничний кут знаходять із закону заломлення, підставивши γ = 90° (sin 90° = 1). Для переходу із середовища з показником n у повітря sin α₀ = 1/n.", "Чим більший показник заломлення речовини, тим менший граничний кут, а отже, тим легше в ній досягти повного відбивання."], "ul": ["Для води (n ≈ 1,33) α₀ ≈ 49°.", "Для звичайного скла (n ≈ 1,5) α₀ ≈ 42°.", "Для алмазу (n ≈ 2,42) α₀ ≈ 24°.", "Загалом sin α₀ = n₂/n₁, де n₁ > n₂."]}, {"h": "Застосування повного відбивання", "p": ["Повне внутрішнє відбивання дозволяє «замкнути» світло всередині прозорого тіла. На цьому принципі працюють оптичні волокна (світловоди): тонка скляна нитка, у якій світло відбивається від стінок сотні тисяч разів, проходить великі відстані майже без втрат.", "Відбивні призми з кутом 45° відбивають світло ефективніше за звичайні дзеркала, тому їх використовують у біноклях, перископах і фотоапаратах."], "ul": ["Волоконно-оптичний інтернет і телефонний зв’язок.", "Медичні ендоскопи для огляду внутрішніх органів.", "Призмові біноклі та перископи.", "Світлоповертачі (катафоти) на велосипедах і дорожніх знаках.", "Блиск дорогоцінного каміння, особливо діамантів."]}], "formulas": [{"f": "sin α₀ = 1/n", "d": "α₀ — граничний кут повного відбивання на межі середовища з показником заломлення n і повітря (вакууму)"}, {"f": "sin α₀ = n₂/n₁", "d": "n₁ — показник заломлення оптично густішого середовища, n₂ — менш густого (n₁ > n₂)"}, {"f": "sin α / sin γ = n₂/n₁", "d": "закон заломлення, з якого виводять граничний кут"}], "terms": [["Повне внутрішнє відбивання", "явище, за якого світло, падаючи з оптично густішого середовища на межу з менш густим під кутом, більшим за граничний, повністю відбивається назад."], ["Граничний кут повного відбивання", "найменший кут падіння, за якого заломлений промінь зникає, а кут заломлення досягає 90°."], ["Світловод (оптичне волокно)", "тонка прозора нитка, якою світло передається на великі відстані завдяки повному внутрішньому відбиванню."], ["Відбивна призма", "скляна призма, яка змінює напрямок світла завдяки повному внутрішньому відбиванню на її грані."], ["Ендоскоп", "медичний прилад зі світловодами для огляду внутрішніх органів людини."]], "examples": [{"q": "Знайдіть граничний кут повного відбивання для межі вода–повітря. Показник заломлення води 1,33.", "s": ["Дано: n = 1,33.", "Розв’язання: sin α₀ = 1/n = 1 : 1,33 ≈ 0,752.", "α₀ ≈ 49° (за таблицею синусів або калькулятором).", "Відповідь: α₀ ≈ 49°."]}, {"q": "Промінь у склі (n = 1,5) падає на межу з повітрям під кутом 45°. Чи вийде він у повітря?", "s": ["Дано: n = 1,5, α = 45°.", "Розв’язання: sin α₀ = 1/1,5 ≈ 0,667, тому α₀ ≈ 42°.", "Кут падіння 45° більший за граничний кут 42°, отже світло зазнає повного внутрішнього відбивання.", "Відповідь: не вийде — промінь повністю відіб’ється назад у скло."]}], "lab": null, "f": "Діаманти так «грають» світлом через великий показник заломлення (≈ 2,42) і малий граничний кут (≈ 24°): ювеліри огранюють камінь так, щоб світло багаторазово повністю відбивалося всередині й виходило через верхні грані.", "pr": ["Налийте воду в прозору склянку, підніміть її трохи вище рівня очей і подивіться на поверхню води знизу крізь стінку. Опишіть, що ви бачите, і поясніть, чому поверхня виглядає як дзеркало.", "Обчисліть граничний кут для скла з показником заломлення 1,6 і для межі вода (n = 1,33) – скло (n = 1,5): у якому напрямку має йти світло, щоб на цій межі було можливе повне відбивання?"], "qz": [{"q": "За якої умови можливе повне внутрішнє відбивання?", "o": ["Світло йде з оптично менш густого середовища в густіше", "Світло йде з оптично густішого середовища в менш густе і α > α₀", "Світло падає перпендикулярно до межі", "Середовища мають однаковий показник заломлення"], "a": 1, "why": "Повне відбивання виникає лише при переході в менш густе середовище під кутом, більшим за граничний."}, {"q": "Чому дорівнює кут заломлення, коли кут падіння дорівнює граничному?", "o": ["0°", "45°", "90°", "180°"], "a": 2, "why": "За означенням при α = α₀ заломлений промінь ковзає вздовж межі, тобто γ = 90°."}, {"q": "Показник заломлення речовини 2. Який граничний кут?", "o": ["30°", "45°", "60°", "90°"], "a": 0, "why": "sin α₀ = 1/2 = 0,5, отже α₀ = 30°."}, {"q": "У якій речовині граничний кут найменший?", "o": ["Вода, n = 1,33", "Скло, n = 1,5", "Лід, n = 1,31", "Алмаз, n = 2,42"], "a": 3, "why": "Чим більший n, тим менший sin α₀ = 1/n, тож найменший граничний кут має алмаз."}, {"q": "Яке явище лежить в основі роботи оптичного волокна?", "o": ["Повне внутрішнє відбивання", "Дисперсія", "Поглинання світла", "Розсіювання світла"], "a": 0, "why": "Світло в оптоволокні багаторазово повністю відбивається від його стінок."}, {"q": "Чи може відбутися повне відбивання, коли світло йде з повітря у воду?", "o": ["Так, за будь-якого кута", "Так, якщо кут більший за 49°", "Ні, бо світло йде в оптично густіше середовище", "Так, якщо вода холодна"], "a": 2, "why": "У густішому середовищі заломлений промінь завжди існує, бо γ < α."}, {"q": "Граничний кут для скла 42°. Промінь у склі падає на межу з повітрям під кутом 30°. Що станеться?", "o": ["Повне відбивання", "Світло зупиниться", "Світло пройде без заломлення", "Світло частково вийде в повітря, заломившись"], "a": 3, "why": "30° < 42°, тому повного відбивання немає: частина світла заломлюється й виходить у повітря."}, {"q": "Де НЕ використовують повне внутрішнє відбивання?", "o": ["У призмовому біноклі", "У звичайному плоскому дзеркалі в ванній", "В ендоскопі", "В оптоволоконному кабелі"], "a": 1, "why": "Звичайне дзеркало відбиває світло від металевого покриття, а не завдяки повному внутрішньому відбиванню."}]}, {"n": "58", "type": "lab", "t": "Лабораторна робота № 7 «Дослідження явища заломлення світла»", "gr": "ГР1", "g": "Дослідити заломлення світла на межі повітря–скло (або повітря–вода) і визначити показник заломлення речовини.", "blocks": [{"h": "Теорія до роботи", "p": ["Під час переходу світла з повітря в скло промінь наближається до перпендикуляра. Відношення sin α / sin γ для двох даних середовищ стале і дорівнює показнику заломлення n скла відносно повітря.", "Щоб не користуватися таблицею синусів, можна провести коло з центром у точці падіння і виміряти перпендикуляри, опущені з точок перетину променів з колом на перпендикуляр до межі. Якщо радіус кола однаковий, n дорівнює відношенню довжин цих відрізків."], "ul": ["Кути падіння α і заломлення γ відраховують від перпендикуляра до межі середовищ.", "Промінь, що пройшов крізь плоскопаралельну пластину, виходить паралельно падаючому, але зміщеним.", "Для звичайного скла n ≈ 1,5, для води n ≈ 1,33.", "Чим точніше встромлені шпильки, тим менша похибка."]}, {"h": "Дистанційний формат", "p": ["Роботу можна безпечно виконати вдома, якщо є скляна плоскопаралельна пластинка, прозорий прямокутний контейнер з водою або товстий прозорий пластиковий брусок, а також шпильки, папір, лінійка й транспортир. Краї скла мають бути зашліфовані або заклеєні скотчем.", "Якщо обладнання немає, виконайте роботу у віртуальній лабораторії PhET «Заломлення світла» (Bending Light): оберіть середовища «повітря» і «скло» або «вода», вимірюйте кути вбудованим транспортиром для різних кутів падіння."], "ul": ["Не використовуйте лазерну указку вдома без дорослих і ніколи не дивіться в промінь.", "Не працюйте з розбитим склом.", "Воду наливайте в контейнер на рівній поверхні, далеко від електроприладів.", "Обов’язково сфотографуйте побудови для звіту."]}], "formulas": [{"f": "n = sin α / sin γ", "d": "n — показник заломлення скла відносно повітря, α — кут падіння, γ — кут заломлення"}, {"f": "n = AE/DC", "d": "AE і DC — перпендикуляри, опущені з точок перетину падаючого і заломленого променів з колом (однакового радіуса) на перпендикуляр до межі"}, {"f": "n_сер = (n₁ + n₂ + n₃)/3", "d": "середнє значення показника заломлення за трьома дослідами"}], "terms": [["Плоскопаралельна пластина", "прозоре тіло, обмежене двома паралельними плоскими гранями."], ["Кут заломлення", "кут між заломленим променем і перпендикуляром до межі середовищ у точці падіння."], ["Показник заломлення", "фізична величина, що дорівнює відношенню синуса кута падіння до синуса кута заломлення."], ["Відносна похибка", "відношення абсолютної похибки до виміряного значення величини, виражене у відсотках."]], "examples": [], "lab": {"goal": "Дослідити хід світлового променя через плоскопаралельну скляну пластину і визначити показник заломлення скла.", "equip": ["скляна плоскопаралельна пластина (або прозорий прямокутний контейнер з водою)", "аркуш паперу на картоні чи пінопласті", "4 шпильки", "лінійка", "транспортир", "циркуль", "олівець", "калькулятор"], "safety": ["Тримайте скляну пластину за грані, не проводьте пальцями по краях.", "Шпильки після роботи складіть у коробку.", "Не використовуйте лазерну указку без дорослих, не направляйте промінь в очі.", "Контейнер з водою тримайте далеко від розеток і приладів."], "steps": ["Покладіть пластину на аркуш і обведіть її контури олівцем.", "Встроміть дві шпильки 1 і 2 з одного боку пластини так, щоб лінія 1–2 падала на грань під кутом (30–60°).", "Дивлячись крізь пластину з протилежного боку, встроміть шпильки 3 і 4 так, щоб вони закривали зображення шпильок 1 і 2.", "Заберіть пластину і шпильки. Проведіть падаючий промінь через точки 1 і 2 до грані (точка B), вихідний промінь через точки 3 і 4 до другої грані (точка C) і з’єднайте B і C — це заломлений промінь у склі.", "Проведіть у точці B перпендикуляр до грані.", "Виміряйте транспортиром кут падіння α і кут заломлення γ.", "Як другий спосіб: проведіть коло з центром у B, опустіть перпендикуляри з точок перетину променів з колом на перпендикуляр до грані й виміряйте їх довжини AE і DC.", "Повторіть досліди ще для двох інших кутів падіння."], "calc": ["Обчисліть n = sin α / sin γ для кожного досліду.", "Обчисліть n = AE/DC за другим способом.", "Знайдіть середнє значення n_сер = (n₁ + n₂ + n₃)/3.", "Оцініть відносну похибку ε = |n − n_табл|/n_табл · 100 %, взявши n_табл = 1,5 для скла (1,33 для води).", "Порівняйте напрямки падаючого та вихідного променів."], "table": ["№ досліду", "α, °", "γ, °", "sin α", "sin γ", "n = sin α / sin γ", "n_сер"], "sample": "Для звичайного скла очікується показник заломлення в межах приблизно 1,4–1,6 (для води — близько 1,3), промінь, що вийшов з пластини, має бути паралельним падаючому.", "questions": ["Чому кут заломлення в склі менший за кут падіння?", "Як можна перевірити, що промінь виходить з пластини паралельно падаючому?", "Від чого залежить зміщення променя в пластині?", "Які чинники найбільше впливають на точність результату?", "Чому показник заломлення не залежить від кута падіння?"]}, "f": "Закон заломлення світла експериментально встановив нідерландський учений Віллеброрд Снелліус на початку XVII століття, тому за кордоном його часто називають законом Снелліуса.", "pr": ["Оформіть звіт: мета, обладнання, рисунок ходу променів, таблиця, обчислення n обома способами, похибка і висновок.", "Якщо немає обладнання — виконайте роботу у віртуальній лабораторії PhET «Заломлення світла» (Bending Light) для трьох кутів падіння і визначте показник заломлення скла та води."], "qz": [{"q": "Кут падіння 60°, кут заломлення 35°. Який приблизно показник заломлення (sin 60° ≈ 0,87; sin 35° ≈ 0,57)?", "o": ["1,2", "1,9", "1,5", "0,66"], "a": 2, "why": "n = 0,87 : 0,57 ≈ 1,5."}, {"q": "Як виходить промінь з плоскопаралельної пластини?", "o": ["Паралельно падаючому, але зміщеним", "Перпендикулярно до падаючого", "Під кутом 90° до грані", "Не виходить зовсім"], "a": 0, "why": "Заломлення на двох паралельних гранях компенсується, тому промінь лише зміщується."}, {"q": "Що отримали учні, якщо в досліді вийшло n ≈ 1,33?", "o": ["Звичайне скло", "Алмаз", "Повітря", "Ймовірно, воду"], "a": 3, "why": "Показник заломлення 1,33 має вода."}, {"q": "Навіщо проводити кілька дослідів з різними кутами падіння?", "o": ["Щоб змінити показник заломлення", "Щоб зменшити вплив випадкових похибок і перевірити сталість n", "Щоб скло нагрілося", "Цього робити не потрібно"], "a": 1, "why": "Сталість відношення синусів для різних кутів підтверджує закон, а середнє зменшує похибку."}, {"q": "Учень отримав n = 1,56, табличне n = 1,5. Яка відносна похибка?", "o": ["4 %", "6 %", "0,06 %", "1,56 %"], "a": 0, "why": "ε = |1,56 − 1,5| : 1,5 · 100 % = 0,06 : 1,5 · 100 % = 4 %."}, {"q": "Яку з цих дій НЕ можна виконувати вдома самостійно?", "o": ["Встромлювати шпильки в папір", "Вимірювати кути транспортиром", "Направляти лазерну указку в очі", "Обводити пластину олівцем"], "a": 2, "why": "Лазерне випромінювання небезпечне для очей."}]}, {"n": "59", "type": "theory", "t": "Дисперсія світла. Кольори", "gr": "ГР2, ГР3", "g": "Зрозуміти, чому біле світло розкладається в спектр, від чого залежить колір світла і чому предмети мають різні кольори.", "blocks": [{"h": "Досліди Ньютона", "p": ["Ісаак Ньютон пропустив вузький пучок сонячного світла крізь скляну призму і побачив на екрані різнокольорову смужку — спектр. Коли ж він спрямував кольорові промені на другу, перевернуту призму, вони знову злилися в біле світло.", "Отже, біле світло складне: воно є сумішшю світла різних кольорів. Розкладання білого світла в спектр пояснюється тим, що показник заломлення скла для різних кольорів різний."], "ul": ["Порядок кольорів у спектрі: червоний, оранжевий, жовтий, зелений, блакитний, синій, фіолетовий.", "Червоні промені заломлюються найменше, фіолетові — найбільше.", "Монохроматичне світло (одного кольору) призма вже не розкладає.", "Кольори спектра плавно переходять один в один, межі між ними умовні."]}, {"h": "Що таке дисперсія", "p": ["Дисперсія світла — це залежність показника заломлення речовини від кольору (частоти) світла. Через дисперсію промені різних кольорів після призми йдуть під різними кутами.", "Колір світла визначається його частотою ν. Світло — це електромагнітна хвиля, тому для неї справджується зв’язок λ = v/ν. Під час переходу з одного середовища в інше частота, а отже і колір, не змінюється, змінюються швидкість і довжина хвилі."], "ul": ["Видиме світло у вакуумі має довжини хвиль приблизно від 380–400 нм (фіолетове) до 760 нм (червоне).", "Найбільша частота — у фіолетового світла, найменша — у червоного.", "1 нм = 10⁻⁹ м.", "У склі швидкість червоного світла трохи більша, ніж фіолетового."]}, {"h": "Кольори предметів", "p": ["Предмет здається певного кольору, бо відбиває (або пропускає) світло лише цього кольору, а решту поглинає. Зелений листок відбиває переважно зелене світло, біла скатертина — усі кольори, чорний оксамит майже все поглинає.", "Колір предмета залежить також від освітлення: червона троянда в синьому світлі здається майже чорною, бо їй нічого відбивати."], "ul": ["Білий предмет відбиває всі кольори приблизно однаково.", "Чорний предмет поглинає майже все світло, тому сильніше нагрівається на сонці.", "Кольорове скло пропускає світло свого кольору.", "Основні кольори в екранах: червоний, зелений, синій; їхнє змішування дає решту відтінків."]}, {"h": "Дисперсія в природі", "p": ["Веселка виникає, коли сонячне світло заломлюється, відбивається і знову заломлюється в краплинах дощу; через дисперсію різні кольори виходять під різними кутами. Тому веселку видно, коли Сонце позаду спостерігача, а попереду — дощ.", "Різнокольорові «зайчики» від кришталю, гранованої склянки чи діаманта — теж наслідок дисперсії."], "ul": ["У головній веселці червоний колір зовні, фіолетовий — усередині.", "Іноді видно другу, блідішу веселку з оберненим порядком кольорів.", "Веселку можна отримати і вдома, розпилюючи воду проти сонця.", "У фотоапаратах дисперсія спричиняє кольорові облямівки, тому об’єктиви складають з кількох лінз."]}], "formulas": [{"f": "λ = v/ν", "d": "λ — довжина хвилі, v — швидкість світла в середовищі, ν — частота"}, {"f": "c = λ₀·ν", "d": "c ≈ 3·10⁸ м/с — швидкість світла у вакуумі, λ₀ — довжина хвилі у вакуумі"}, {"f": "λ = λ₀/n", "d": "довжина хвилі в середовищі з показником заломлення n"}], "terms": [["Дисперсія світла", "залежність показника заломлення речовини від частоти (кольору) світла, унаслідок якої біле світло розкладається в спектр."], ["Спектр", "різнокольорова смуга, що утворюється під час розкладання білого світла."], ["Монохроматичне світло", "світло однієї частоти, тобто одного кольору."], ["Біле світло", "суміш світла всіх кольорів видимого спектра."], ["Довжина хвилі", "відстань, на яку поширюється хвиля за один період."]], "examples": [{"q": "Довжина хвилі зеленого світла у вакуумі 500 нм. Знайдіть його частоту.", "s": ["Дано: λ₀ = 500 нм, c = 3·10⁸ м/с.", "СІ: λ₀ = 5·10⁻⁷ м.", "Розв’язання: ν = c/λ₀ = 3·10⁸ м/с : 5·10⁻⁷ м = 6·10¹⁴ Гц.", "Відповідь: ν = 6·10¹⁴ Гц."]}, {"q": "Оранжеве світло з довжиною хвилі 600 нм у повітрі переходить у воду (n = 1,33). Яка
