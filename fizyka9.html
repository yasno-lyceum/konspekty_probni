ртя перетворює частину механічної енергії на внутрішню."}]}, {"n": "95", "type": "repeat", "t": "Температура. Внутрішня енергія. Теплопередача", "gr": "ГР1, ГР2, ГР3", "g": "Повторити поняття температури, внутрішньої енергії, способи її зміни, види теплопередачі та розрахунок кількості теплоти під час нагрівання й охолодження.", "blocks": [{"h": "Температура і тепловий рух", "p": ["Усі речовини складаються з частинок (атомів, молекул, йонів), які безладно рухаються. Цей рух називають тепловим. Температура — фізична величина, що характеризує ступінь нагрітості тіла; вона пов’язана із середньою кінетичною енергією руху частинок.", "Температуру вимірюють термометром. В Україні використовують шкалу Цельсія (°C), у фізиці — також абсолютну шкалу Кельвіна (К): T = t + 273."], "ul": ["За 0 °C тане лід, за 100 °C кипить вода (за нормального атмосферного тиску).", "Абсолютний нуль (0 К ≈ −273 °C) — найнижча можлива температура.", "Тіла, що мають однакову температуру, перебувають у тепловій рівновазі.", "Дифузія відбувається швидше за вищої температури — це доказ залежності теплового руху від температури."]}, {"h": "Внутрішня енергія і способи її зміни", "p": ["Внутрішня енергія тіла — це сума кінетичної енергії теплового руху його частинок і потенціальної енергії їхньої взаємодії. Зі збільшенням температури внутрішня енергія зростає.", "Змінити внутрішню енергію можна двома способами: виконанням роботи (тертя, удар, стиснення) і теплопередачею (без виконання роботи)."], "ul": ["Під час тертя долоні нагріваються — механічна робота перетворюється на внутрішню енергію.", "Під час швидкого стиснення повітря в насосі воно нагрівається.", "Кількість теплоти Q — енергія, яку тіло отримує або віддає під час теплопередачі; одиниця — джоуль.", "Q = cmΔt, де c — питома теплоємність речовини (для води 4200 Дж/(кг·°C))."]}, {"h": "Види теплопередачі", "p": ["Теплопередача відбувається завжди від тіла з вищою температурою до тіла з нижчою, доки температури не зрівняються. Розрізняють три види теплопередачі: теплопровідність, конвекцію і випромінювання.", "Рівняння теплового балансу: у замкненій системі кількість теплоти, віддана гарячими тілами, дорівнює кількості теплоти, отриманій холодними: Q_відд = Q_отр."], "ul": ["Теплопровідність — передача енергії частинками під час їхньої взаємодії без перенесення речовини; добре проводять тепло метали, погано — повітря, вовна, пінопласт.", "Конвекція — перенесення енергії потоками рідини або газу (опалення, вітри, нагрівання води в каструлі).", "Випромінювання — передача енергії електромагнітними хвилями; можлива й у вакуумі (так Сонце нагріває Землю).", "Темні поверхні краще поглинають і випромінюють енергію, світлі — відбивають.", "Термос зменшує всі три види теплопередачі: вакуум між стінками, дзеркальні поверхні, щільна корка."]}], "formulas": [{"f": "T = t + 273", "d": "T — абсолютна температура (К), t — температура за шкалою Цельсія (°C)"}, {"f": "Q = cm(t₂ − t₁) = cmΔt", "d": "Q — кількість теплоти (Дж), c — питома теплоємність (Дж/(кг·°C)), m — маса, Δt — зміна температури"}, {"f": "Q_відд = Q_отр", "d": "рівняння теплового балансу для замкненої системи"}], "terms": [["Температура", "фізична величина, що характеризує ступінь нагрітості тіла і пов’язана з інтенсивністю теплового руху його частинок."], ["Внутрішня енергія", "сума кінетичної енергії теплового руху частинок тіла та потенціальної енергії їхньої взаємодії."], ["Теплопередача", "процес зміни внутрішньої енергії тіла без виконання роботи."], ["Кількість теплоти", "енергія, яку тіло отримує або віддає під час теплопередачі."], ["Питома теплоємність", "фізична величина, що показує, яку кількість теплоти треба передати 1 кг речовини, щоб нагріти її на 1 °C."], ["Конвекція", "вид теплопередачі, за якого енергія переноситься потоками рідини або газу."]], "examples": [{"q": "Яку кількість теплоти треба передати 2 кг води, щоб нагріти її від 20 °C до кипіння (100 °C)? Питома теплоємність води 4200 Дж/(кг·°C).", "s": ["Дано: m = 2 кг, t₁ = 20 °C, t₂ = 100 °C, c = 4200 Дж/(кг·°C). Знайти: Q.", "Розв’язання: Q = cm(t₂ − t₁) = 4200 · 2 · (100 − 20) = 672 000 Дж.", "Відповідь: 672 кДж."]}, {"q": "Змішали 1 кг води за температури 80 °C і 3 кг води за температури 20 °C. Якою буде температура суміші? Втратами енергії знехтувати.", "s": ["Дано: m₁ = 1 кг, t₁ = 80 °C, m₂ = 3 кг, t₂ = 20 °C. Знайти: t.", "Розв’язання: Q_відд = Q_отр; cm₁(t₁ − t) = cm₂(t − t₂); 1 · (80 − t) = 3 · (t − 20); 80 − t = 3t − 60; 4t = 140; t = 35 °C.", "Відповідь: 35 °C."]}], "lab": null, "f": "Вода має одну з найбільших питомих теплоємностей серед звичайних речовин, тому моря й океани влітку повільно нагріваються, а взимку повільно охолоджуються і пом’якшують клімат прибережних територій.", "pr": ["Поясніть, які види теплопередачі ви спостерігаєте вдома: батарея опалення, гаряча чашка чаю, сонячне світло крізь вікно.", "Розв’яжіть задачу: скільки теплоти віддасть алюмінієва деталь масою 0,5 кг, охолоджуючись від 120 °C до 20 °C? Питома теплоємність алюмінію 920 Дж/(кг·°C). (46 кДж)"], "qz": [{"q": "Температура 27 °C за шкалою Кельвіна —", "o": ["246 К", "27 К", "300 К", "327 К"], "a": 2, "why": "T = 27 + 273 = 300 К."}, {"q": "Що відбувається з внутрішньою енергією тіла, коли воно нагрівається?", "o": ["Зростає", "Зменшується", "Не змінюється", "Стає рівною нулю"], "a": 0, "why": "Зростає швидкість теплового руху частинок."}, {"q": "Якими способами можна змінити внутрішню енергію тіла?", "o": ["Лише нагріванням", "Лише тертям", "Зміною маси", "Виконанням роботи і теплопередачею"], "a": 3, "why": "Це два способи зміни внутрішньої енергії."}, {"q": "Який вид теплопередачі можливий у вакуумі?", "o": ["Теплопровідність", "Випромінювання", "Конвекція", "Жоден"], "a": 1, "why": "Електромагнітним хвилям не потрібне середовище."}, {"q": "Чому батареї опалення встановлюють унизу кімнати?", "o": ["Так зручніше", "Щоб нагріте повітря піднімалося вгору (конвекція)", "Щоб посилити випромінювання", "Щоб зменшити теплопровідність"], "a": 1, "why": "Тепле повітря легше й піднімається, а холодне опускається до батареї."}, {"q": "Скільки теплоти треба для нагрівання 1 кг води на 10 °C?", "o": ["420 Дж", "4200 Дж", "42 000 Дж", "420 000 Дж"], "a": 2, "why": "Q = 4200 · 1 · 10 = 42 000 Дж."}, {"q": "Який матеріал має найгіршу теплопровідність?", "o": ["Пінопласт", "Мідь", "Алюміній", "Залізо"], "a": 0, "why": "Пінопласт містить багато повітря, яке погано проводить тепло."}, {"q": "Що показує питома теплоємність речовини?", "o": ["Масу речовини", "Температуру плавлення", "Скільки теплоти виділяється під час згоряння", "Скільки теплоти треба, щоб нагріти 1 кг речовини на 1 °C"], "a": 3, "why": "Це означення питомої теплоємності."}]}, {"n": "96", "type": "repeat", "t": "Зміна агрегатного стану речовини. Теплові двигуни", "gr": "ГР1, ГР2, ГР3", "g": "Повторити процеси плавлення, кристалізації, пароутворення, конденсації, згоряння палива, принцип дії теплових двигунів та обчислення їхнього ККД.", "blocks": [{"h": "Плавлення і кристалізація", "p": ["Плавлення — перехід речовини з твердого стану в рідкий, кристалізація — зворотний процес. Кристалічні тіла плавляться за певної сталої температури — температури плавлення, яка дорівнює температурі кристалізації.", "Під час плавлення температура не змінюється: уся отримана енергія витрачається на руйнування кристалічних ґраток. Кількість теплоти для плавлення Q = λm, де λ — питома теплота плавлення (для льоду ≈ 332 кДж/кг)."], "ul": ["Лід плавиться за 0 °C, свинець — приблизно за 327 °C, залізо — приблизно за 1539 °C.", "Під час кристалізації виділяється така сама кількість теплоти, яка поглинається під час плавлення.", "Аморфні тіла (скло, пластилін, смола) не мають певної температури плавлення — вони розм’якшуються поступово.", "Графік нагрівання кристалічного тіла має горизонтальну ділянку, що відповідає плавленню."]}, {"h": "Пароутворення і конденсація", "p": ["Пароутворення — перехід речовини з рідкого стану в газоподібний. Воно відбувається двома способами: випаровуванням (з поверхні рідини за будь-якої температури) і кипінням (в усьому об’ємі за певної температури).", "Конденсація — перехід пари в рідину, під час якого виділяється енергія. Кількість теплоти для пароутворення Q = rm, де r — питома теплота пароутворення (для води ≈ 2,3 МДж/кг)."], "ul": ["Випаровування прискорюється з підвищенням температури, збільшенням площі поверхні та за наявності вітру.", "Випаровування супроводжується охолодженням рідини — тому після купання стає прохолодно.", "Температура кипіння залежить від зовнішнього тиску: у горах вода кипить за температури, нижчої від 100 °C.", "Роса, туман, хмари утворюються внаслідок конденсації водяної пари."]}, {"h": "Згоряння палива. Теплові двигуни", "p": ["Під час згоряння палива виділяється енергія Q = qm, де q — питома теплота згоряння (для бензину ≈ 46 МДж/кг). Тепловий двигун перетворює частину цієї енергії на механічну роботу.", "Будь-який тепловий двигун має нагрівник, робоче тіло (газ або пару) і холодильник. Лише частина отриманої від нагрівника теплоти Q₁ перетворюється на роботу, решта Q₂ передається холодильнику, тому ККД завжди менший за 100 %: η = A_к/Q₁ · 100 % = (Q₁ − Q₂)/Q₁ · 100 %."], "ul": ["Види теплових двигунів: двигун внутрішнього згоряння, парова і газова турбіни, реактивний двигун.", "Чотиритактний двигун внутрішнього згоряння: впуск, стиснення, робочий хід, випуск.", "ККД бензинових двигунів зазвичай становить близько 20–30 %, дизельних — дещо більше.", "Теплові двигуни забруднюють довкілля, тому розвивають електротранспорт і відновлювану енергетику."]}], "formulas": [{"f": "Q = λm", "d": "плавлення (кристалізація): λ — питома теплота плавлення (Дж/кг)"}, {"f": "Q = rm", "d": "пароутворення (конденсація): r — питома теплота пароутворення (Дж/кг)"}, {"f": "Q = qm", "d": "згоряння палива: q — питома теплота згоряння (Дж/кг)"}, {"f": "η = A_к/Q₁ · 100 %", "d": "ККД теплового двигуна: A_к — корисна робота, Q₁ — теплота, отримана від нагрівника (від згоряння палива)"}, {"f": "η = (Q₁ − Q₂)/Q₁ · 100 %", "d": "Q₂ — теплота, передана холодильнику"}], "terms": [["Плавлення", "перехід речовини з твердого стану в рідкий."], ["Кристалізація", "перехід речовини з рідкого стану в твердий."], ["Випаровування", "пароутворення, що відбувається з поверхні рідини за будь-якої температури."], ["Кипіння", "інтенсивне пароутворення в усьому об’ємі рідини, яке відбувається за певної температури."], ["Питома теплота згоряння палива", "фізична величина, що показує, яка кількість теплоти виділяється під час повного згоряння 1 кг палива."], ["Тепловий двигун", "машина, у якій внутрішня енергія палива перетворюється на механічну роботу."]], "examples": [{"q": "Яку кількість теплоти треба передати 2 кг льоду, взятого за температури 0 °C, щоб повністю його розплавити? Питома теплота плавлення льоду 332 кДж/кг.", "s": ["Дано: m = 2 кг, λ = 332 кДж/кг. Знайти: Q.", "СІ: λ = 332 000 Дж/кг.", "Розв’язання: лід уже має температуру плавлення, тому Q = λm = 332 000 · 2 = 664 000 Дж.", "Відповідь: 664 кДж."]}, {"q": "Двигун автомобіля, спаливши 1 кг бензину, виконав корисну роботу 11,5 МДж. Визначте ККД двигуна. Питома теплота згоряння бензину 46 МДж/кг.", "s": ["Дано: m = 1 кг, A_к = 11,5 МДж, q = 46 МДж/кг. Знайти: η.", "Розв’язання: Q₁ = qm = 46 · 1 = 46 МДж; η = A_к/Q₁ · 100 % = 11,5/46 · 100 % = 25 %.", "Відповідь: 25 %."]}], "lab": null, "f": "На вершині Евересту вода кипить приблизно за 70 °C, тому зварити там яйце в звичайній каструлі дуже важко.", "pr": ["Побудуйте схематичний графік залежності температури від часу для льоду, який нагрівають від −10 °C до 100 °C до початку кипіння, і підпишіть, які процеси відбуваються на кожній ділянці.", "Розв’яжіть задачу: яка кількість теплоти потрібна, щоб перетворити на пару 0,5 кг води, взятої за температури кипіння? (r = 2,3 МДж/кг) (1,15 МДж)"], "qz": [{"q": "Як змінюється температура кристалічного тіла під час плавлення?", "o": ["Зростає", "Не змінюється", "Зменшується", "Спочатку зростає, потім зменшується"], "a": 1, "why": "Енергія витрачається на руйнування кристалічних ґраток, а не на нагрівання."}, {"q": "Перехід пари в рідину називають", "o": ["конденсацією", "кристалізацією", "випаровуванням", "плавленням"], "a": 0, "why": "Конденсація — процес, зворотний пароутворенню."}, {"q": "Яку кількість теплоти треба для плавлення 0,5 кг льоду за 0 °C (λ = 332 кДж/кг)?", "o": ["664 кДж", "332 кДж", "166 кДж", "33,2 кДж"], "a": 2, "why": "Q = 332 · 0,5 = 166 кДж."}, {"q": "Чому після купання навіть у спекотний день стає прохолодно?", "o": ["Вода холодна", "Через вітер", "Шкіра погано проводить тепло", "Випаровування води забирає енергію від тіла"], "a": 3, "why": "Випаровування супроводжується охолодженням."}, {"q": "Яка формула визначає кількість теплоти, що виділяється під час згоряння палива?", "o": ["Q = cmΔt", "Q = λm", "Q = qm", "Q = rm"], "a": 2, "why": "q — питома теплота згоряння палива."}, {"q": "Який такт чотиритактного двигуна є робочим ходом?", "o": ["Третій", "Перший", "Другий", "Четвертий"], "a": 0, "why": "Такти: впуск, стиснення, робочий хід, випуск."}, {"q": "Тепловий двигун отримав від нагрівника 1000 Дж і віддав холодильнику 700 Дж. Його ККД —", "o": ["70 %", "43 %", "100 %", "30 %"], "a": 3, "why": "η = (1000 − 700)/1000 · 100 % = 30 %."}, {"q": "Від чого залежить температура кипіння рідини?", "o": ["Від об’єму рідини", "Від зовнішнього тиску", "Від форми посудини", "Від кольору посудини"], "a": 1, "why": "Зі зменшенням тиску температура кипіння знижується."}]}, {"n": "97", "type": "repeat", "t": "Електричний заряд. Електричне поле", "gr": "ГР1, ГР2, ГР3", "g": "Повторити поняття електричного заряду, електризації, закон збереження заряду, закон Кулона та уявлення про електричне поле.", "blocks": [{"h": "Електричний заряд і електризація", "p": ["Електричний заряд q — фізична величина, що характеризує здатність тіл до електромагнітної взаємодії. Одиниця заряду — кулон (Кл). Існують заряди двох видів: позитивні й негативні. Однойменні заряди відштовхуються, різнойменні — притягуються.", "Електризація — процес набуття тілом електричного заряду. Під час електризації тертям або дотиком електрони переходять з одного тіла на інше: тіло, що отримало електрони, заряджається негативно, а тіло, що їх втратило, — позитивно."], "ul": ["Найменший (елементарний) заряд має електрон: e ≈ 1,6·10⁻¹⁹ Кл (заряд електрона −e).", "Заряд будь-якого тіла кратний елементарному: q = Ne.", "Закон збереження електричного заряду: в електрично замкненій системі алгебраїчна сума зарядів залишається незмінною.", "Електроскоп і електрометр — прилади для виявлення та вимірювання заряду.", "Провідники (метали, розчини солей) пропускають заряд, діелектрики (гума, скло, пластмаса) — майже ні."]}, {"h": "Закон Кулона", "p": ["Сила взаємодії двох нерухомих точкових зарядів прямо пропорційна добутку модулів зарядів і обернено пропорційна квадрату відстані між ними: F = k|q₁||q₂|/r², де k = 9·10⁹ Н·м²/Кл².", "Якщо відстань між зарядами збільшити вдвічі, сила взаємодії зменшиться вчетверо. Закон Кулона подібний до закону всесвітнього тяжіння, але електричні сили можуть бути і силами притягання, і силами відштовхування."], "ul": ["Закон справджується для точкових зарядів — розміри тіл набагато менші за відстань між ними.", "Сила напрямлена вздовж прямої, що сполучає заряди.", "Електричні сили утримують електрони в атомах і атоми в молекулах.", "Шарль Кулон встановив закон у 1785 р. за допомогою крутильних терезів."]}, {"h": "Електричне поле", "p": ["Навколо кожного зарядженого тіла існує електричне поле — особлива форма матерії, через яку здійснюється взаємодія заряджених тіл. Головна властивість поля — діяти з певною силою на заряди, внесені в нього.", "Силовою характеристикою поля є напруженість E = F/q (Н/Кл). Поле зображають силовими лініями, які починаються на позитивних зарядах і закінчуються на негативних."], "ul": ["Що густіше розташовані силові лінії, то сильніше поле.", "Металеві оболонки екранують електричне поле (клітка Фарадея).", "Блискавка — потужний електричний розряд між хмарою і землею або між хмарами.", "Громовідвід захищає будівлі, відводячи заряд у землю."]}], "formulas": [{"f": "q = Ne", "d": "N — кількість елементарних зарядів (електронів), e ≈ 1,6·10⁻¹⁹ Кл — елементарний заряд"}, {"f": "q₁ + q₂ + … + qₙ = const", "d": "закон збереження електричного заряду"}, {"f": "F = k|q₁||q₂|/r²", "d": "закон Кулона: k = 9·10⁹ Н·м²/Кл², r — відстань між зарядами"}, {"f": "E = F/q", "d": "напруженість електричного поля (Н/Кл)"}], "terms": [["Електричний заряд", "фізична величина, що характеризує здатність тіл до електромагнітної взаємодії."], ["Електризація", "процес набуття тілом електричного заряду."], ["Елементарний заряд", "найменший електричний заряд, що існує в природі; його має електрон (зі знаком мінус) і протон."], ["Провідник", "речовина, що добре проводить електричний заряд завдяки наявності вільних заряджених частинок."], ["Діелектрик", "речовина, яка практично не проводить електричний заряд."], ["Електричне поле", "особлива форма матерії, що існує навколо заряджених тіл і діє на внесені в нього заряди."]], "examples": [{"q": "Під час електризації тертям ебонітова паличка отримала 5·10¹⁰ електронів. Який заряд вона має?", "s": ["Дано: N = 5·10¹⁰, e = 1,6·10⁻¹⁹ Кл. Знайти: q.", "Розв’язання: q = −Ne = −5·10¹⁰ · 1,6·10⁻¹⁹ = −8·10⁻⁹ Кл (знак мінус, бо паличка отримала електрони).", "Відповідь: −8·10⁻⁹ Кл = −8 нКл."]}, {"q": "Два точкові заряди по 2·10⁻⁶ Кл розташовані на відстані 0,3 м один від одного. З якою силою вони взаємодіють?", "s": ["Дано: q₁ = q₂ = 2·10⁻⁶ Кл, r = 0,3 м, k = 9·10⁹ Н·м²/Кл². Знайти: F.", "Розв’язання: F = k|q₁||q₂|/r² = 9·10⁹ · 2·10⁻⁶ · 2·10⁻⁶ / 0,09 = 0,036 / 0,09 = 0,4 Н.", "Відповідь: 0,4 Н (заряди однойменні — відштовхуються)."]}], "lab": null, "f": "Слово «електрика» походить від грецького «електрон» — так називали бурштин, який після натирання вовною притягує легкі предмети.", "pr": ["Проведіть безпечний домашній дослід: потріть пластмасовий гребінець об сухе волосся і піднесіть його до тонкого струменя води з крана. Опишіть і поясніть, що спостерігаєте.", "Розв’яжіть задачу: як зміниться сила взаємодії двох зарядів, якщо відстань між ними зменшити втричі? (збільшиться в 9 разів)"], "qz": [{"q": "Одиниця електричного заряду —", "o": ["ампер", "вольт", "кулон", "ом"], "a": 2, "why": "[q] = Кл."}, {"q": "Як взаємодіють два негативно заряджені тіла?", "o": ["Відштовхуються", "Притягуються", "Не взаємодіють", "Спочатку притягуються, потім відштовхуються"], "a": 0, "why": "Однойменні заряди відштовхуються."}, {"q": "Під час електризації тертям між тілами переходять", "o": ["протони", "нейтрони", "атоми", "електрони"], "a": 3, "why": "Електрони найслабше зв’язані з атомом і легко переходять."}, {"q": "Як зміниться сила кулонівської взаємодії, якщо відстань між зарядами збільшити вдвічі?", "o": ["Зменшиться у 2 рази", "Зменшиться в 4 рази", "Збільшиться в 4 рази", "Не зміниться"], "a": 1, "why": "F ~ 1/r², тому 2² = 4."}, {"q": "Яка з речовин є діелектриком?", "o": ["Мідь", "Розчин кухонної солі", "Алюміній", "Гума"], "a": 3, "why": "У гумі майже немає вільних заряджених частинок."}, {"q": "Тіло втратило 10¹⁰ електронів. Його заряд —", "o": ["+1,6·10⁻⁹ Кл", "−1,6·10⁻⁹ Кл", "+1,6·10⁻²⁹ Кл", "−10¹⁰ Кл"], "a": 0, "why": "q = 10¹⁰ · 1,6·10⁻¹⁹ = 1,6·10⁻⁹ Кл, знак плюс, бо електрони втрачено."}, {"q": "Що є головною властивістю електричного поля?", "o": ["Воно має масу", "Воно видиме", "Воно діє з силою на внесені в нього заряди", "Воно існує лише у вакуумі"], "a": 2, "why": "Через поле заряджені тіла діють одне на одне."}, {"q": "Металеву кульку із зарядом +4 нКл торкнулися такою самою незарядженою кулькою. Який заряд матиме кожна кулька?", "o": ["+4 нКл", "+2 нКл", "0", "−2 нКл"], "a": 1, "why": "За законом збереження заряд розподіляється порівну: 4 : 2 = 2 нКл."}]}, {"n": "98", "type": "repeat", "t": "Електричний струм. Сила струму, напруга, опір. Закон Ома для ділянки кола", "gr": "ГР1, ГР2, ГР3", "g": "Повторити поняття електричного струму, його дії, основні величини електричного кола (силу струму, напругу, опір) та закон Ома для ділянки кола.", "blocks": [{"h": "Електричний струм та умови його існування", "p": ["Електричний струм — напрямлений (упорядкований) рух заряджених частинок. У металах це рух вільних електронів. За напрямок струму умовно взято напрямок руху позитивно заряджених частинок — від «+» до «−» джерела.", "Для існування струму потрібні вільні заряджені частинки, електричне поле (його створює джерело струму) і замкнене коло."], "ul": ["Дії струму: теплова (чайник, праска), хімічна (електроліз, заряджання акумулятора), магнітна (електромагніт, двигун).", "Джерела струму: гальванічні елементи, акумулятори, генератори, сонячні батареї.", "Електричне коло складається з джерела, споживачів, з’єднувальних проводів і вимикача.", "На схемах елементи кола зображують умовними позначеннями."]}, {"h": "Сила струму, напруга, опір", "p": ["Сила струму I показує, який заряд проходить через поперечний переріз провідника за одиницю часу: I = q/t, одиниця — ампер (А). Вимірюють амперметром, який вмикають у коло послідовно.", "Напруга U показує, яку роботу виконує електричне поле, переміщуючи одиничний заряд: U = A/q, одиниця — вольт (В). Вольтметр вмикають паралельно до ділянки. Опір R характеризує властивість провідника протидіяти струму, одиниця — ом (Ом): R = ρl/S."], "ul": ["Опір провідника залежить від його довжини l, площі поперечного перерізу S і матеріалу (питомого опору ρ).", "Що довший і тонший провідник, то більший його опір.", "Питомий опір міді ≈ 0,017 Ом·мм²/м — тому з міді роблять дроти.", "Реостат — прилад для плавної зміни опору, а отже, і сили струму в колі."]}, {"h": "Закон Ома для ділянки кола", "p": ["Сила струму на ділянці кола прямо пропорційна напрузі на кінцях цієї ділянки і обернено пропорційна її опору: I = U/R. Закон експериментально встановив Георг Ом у 1827 р.", "З закону Ома випливає: U = IR, R = U/I. Проте опір провідника не залежить від напруги чи сили струму — він визначається лише самим провідником (та його температурою)."], "ul": ["Графік залежності I від U для металевого провідника — пряма, що проходить через початок координат.", "Що більший опір, то менший кут нахилу графіка до осі напруги.", "Безпечною для людини в сухому приміщенні вважають напругу до 36 В; напруга побутової мережі в Україні — 220–230 В.", "Не можна торкатися оголених дротів і користуватися несправними приладами."]}], "formulas": [{"f": "I = q/t", "d": "I — сила струму (А), q — заряд (Кл), t — час (с)"}, {"f": "U = A/q", "d": "U — напруга (В), A — робота електричного поля (Дж)"}, {"f": "R = ρl/S", "d": "R — опір (Ом), ρ — питомий опір (Ом·мм²/м або Ом·м), l — довжина, S — площа поперечного перерізу"}, {"f": "I = U/R", "d": "закон Ома для ділянки кола"}], "terms": [["Електричний струм", "напрямлений рух заряджених частинок."], ["Сила струму", "фізична величина, що дорівнює відношенню заряду, який пройшов через поперечний переріз провідника, до часу його проходження."], ["Напруга", "фізична величина, що дорівнює відношенню роботи електричного поля з переміщення заряду до значення цього заряду."], ["Електричний опір", "фізична величина, що характеризує властивість провідника протидіяти електричному струму."], ["Питомий опір", "опір провідника з даної речовини завдовжки 1 м і площею поперечного перерізу 1 мм² (або 1 м²)."], ["Закон Ома для ділянки кола", "сила струму прямо пропорційна напрузі на ділянці й обернено пропорційна її опору."]], "examples": [{"q": "Через нитку розжарення лампи за 4 хв пройшов заряд 120 Кл. Яка сила струму в лампі?", "s": ["Дано: q = 120 Кл, t = 4 хв. Знайти: I.", "СІ: t = 240 с.", "Розв’язання: I = q/t = 120 / 240 = 0,5 А.", "Відповідь: 0,5 А."]}, {"q": "Мідний дріт завдовжки 100 м має площу поперечного перерізу 0,5 мм². Який його опір і яка сила струму в ньому за напруги 1,7 В? Питомий опір міді 0,017 Ом·мм²/м.", "s": ["Дано: l = 100 м, S = 0,5 мм², ρ = 0,017 Ом·мм²/м, U = 1,7 В. Знайти: R, I.", "Розв’язання: R = ρl/S = 0,017 · 100 / 0,5 = 3,4 Ом; I = U/R = 1,7 / 3,4 = 0,5 А.", "Відповідь: 3,4 Ом; 0,5 А."]}], "lab": null, "f": "Сигнал по провідниках поширюється майже зі швидкістю світла, хоча самі електрони в дроті рухаються впорядковано дуже повільно — лише частки міліметра за секунду.", "pr": ["Накресліть схему кола, що складається з батарейки, лампи, вимикача, амперметра і вольтметра, підключеного до лампи. Поясніть, чому амперметр вмикають послідовно, а вольтметр — паралельно.", "Розв’яжіть задачу: який опір має резистор, якщо за напруги 12 В сила струму в ньому 0,4 А? (30 Ом)"], "qz": [{"q": "Що таке електричний струм?", "o": ["Безладний рух молекул", "Напрямлений рух заряджених частинок", "Рух нейтронів", "Коливання атомів"], "a": 1, "why": "Це означення електричного струму."}, {"q": "Як вмикають амперметр у коло?", "o": ["Паралельно до споживача", "Послідовно зі споживачем", "Безпосередньо до полюсів джерела", "Будь-як"], "a": 1, "why": "Через амперметр має проходити весь струм ділянки."}, {"q": "Одиниця напруги —", "o": ["ампер", "ом", "вольт", "кулон"], "a": 2, "why": "[U] = Дж/Кл = В."}, {"q": "За напруги 6 В сила струму в провіднику 2 А. Який його опір?", "o": ["12 Ом", "0,33 Ом", "8 Ом", "3 Ом"], "a": 3, "why": "R = 6/2 = 3 Ом."}, {"q": "Як зміниться опір дроту, якщо його довжину збільшити вдвічі?", "o": ["Збільшиться вдвічі", "Зменшиться вдвічі", "Не зміниться", "Збільшиться вчетверо"], "a": 0, "why": "R = ρl/S — опір пропорційний довжині."}, {"q": "Яка сила струму в резисторі опором 20 Ом за напруги 4 В?", "o": ["80 А", "5 А", "0,2 А", "2 А"], "a": 2, "why": "I = 4/20 = 0,2 А."}, {"q": "Яку дію струму використовують в електричній прасці?", "o": ["Хімічну", "Магнітну", "Світлову", "Теплову"], "a": 3, "why": "Струм нагріває нагрівальний елемент праски."}, {"q": "Чи зміниться опір провідника, якщо напругу на ньому збільшити вдвічі (температура стала)?", "o": ["Не зміниться", "Збільшиться вдвічі", "Зменшиться вдвічі", "Збільшиться вчетверо"], "a": 0, "why": "Опір залежить від матеріалу і розмірів провідника, а сила струму зросте вдвічі."}]}, {"n": "99", "type": "repeat", "t": "З’єднання споживачів струму. Робота і потужність електричного струму", "gr": "ГР1, ГР2, ГР3", "g": "Повторити закономірності послідовного і паралельного з’єднання провідників, формули роботи та потужності струму і закон Джоуля — Ленца.", "blocks": [{"h": "Послідовне з’єднання", "p": ["У разі послідовного з’єднання провідники вмикають один за одним без розгалужень. Сила струму в усіх провідниках однакова, а загальна напруга дорівнює сумі напруг на окремих провідниках.", "Загальний опір послідовно з’єднаних провідників дорівнює сумі їхніх опорів: R = R₁ + R₂. Для n однакових провідників R = nR₁."], "ul": ["I = I₁ = I₂.", "U = U₁ + U₂.", "R = R₁ + R₂ — загальний опір більший за найбільший з опорів.", "Напруги розподіляються пропорційно опорам: U₁/U₂ = R₁/R₂.", "Якщо один споживач вийде з ладу, коло розімкнеться (старі ялинкові гірлянди)."]}, {"h": "Паралельне з’єднання", "p": ["У разі паралельного з’єднання провідники приєднують до тих самих двох точок (вузлів). Напруга на всіх провідниках однакова, а сила струму в нерозгалуженій частині кола дорівнює сумі сил струмів у відгалуженнях.", "Загальний опір знаходять з формули 1/R = 1/R₁ + 1/R₂; для двох провідників R = R₁R₂/(R₁ + R₂). Загальний опір менший за найменший з опорів."], "ul": ["U = U₁ = U₂.", "I = I₁ + I₂.", "Сили струмів обернено пропорційні опорам: I₁/I₂ = R₂/R₁.", "Усі побутові прилади в квартирі вмикають паралельно, тому вони працюють незалежно один від одного.", "Для n однакових провідників R = R₁/n."]}, {"h": "Робота і потужність струму. Закон Джоуля — Ленца", "p": ["Робота електричного струму A = UIt, одиниця — джоуль; на практиці використовують кіловат-годину: 1 кВт·год = 3,6·10⁶ Дж. Електроенергію в квартирі обліковує електролічильник.", "Потужність струму P = UI = I²R = U²/R, одиниця — ват. Закон Джоуля — Ленца: кількість теплоти, що виділяється в провіднику зі струмом, Q = I²Rt."], "ul": ["На приладах указують номінальну потужність і напругу, наприклад «2000 Вт, 230 В».", "Що потужніший прилад, то більше енергії він споживає за той самий час.", "Коротке замикання — різке зростання сили струму через дуже малий опір кола; від нього захищають запобіжники й автоматичні вимикачі.", "Не вмикайте одночасно багато потужних приладів в одну розетку — проводка може перегрітися."]}], "formulas": [{"f": "I = I₁ = I₂; U = U₁ + U₂; R = R₁ + R₂", "d": "послідовне з’єднання провідників"}, {"f": "U = U₁ = U₂; I = I₁ + I₂; 1/R = 1/R₁ + 1/R₂", "d": "паралельне з’єднання провідників"}, {"f": "A = UIt", "d": "робота струму (Дж), t — час (с)"}, {"f": "P = UI = I²R = U²/R", "d": "потужність струму (Вт)"}, {"f": "Q = I²Rt", "d": "закон Джоуля — Ленца: кількість теплоти, що виділяється в провіднику"}], "terms": [["Послідовне з’єднання", "з’єднання, за якого провідники вмикають один за одним без розгалужень."], ["Паралельне з’єднання", "з’єднання, за якого всі провідники приєднують до однієї пари вузлів."], ["Робота електричного струму", "робота, яку виконує електричне поле, переміщуючи заряди по провіднику."], ["Потужність електричного струму", "фізична величина, що дорівнює відношенню роботи струму до часу, за який її виконано."], ["Закон Джоуля — Ленца", "кількість теплоти, що виділяється в провіднику зі струмом, дорівнює добутку квадрата сили струму, опору провідника і часу проходження струму."], ["Коротке замикання", "з’єднання ділянок кола провідником з дуже малим опором, що спричиняє різке зростання сили струму."]], "examples": [{"q": "Резистори опорами 4 Ом і 6 Ом з’єднали спочатку послідовно, а потім паралельно. Знайдіть загальний опір у кожному випадку.", "s": ["Дано: R₁ = 4 Ом, R₂ = 6 Ом. Знайти: R_посл, R_пар.", "Розв’язання: R_посл = R₁ + R₂ = 4 + 6 = 10 Ом; R_пар = R₁R₂/(R₁ + R₂) = 4 · 6 / 10 = 2,4 Ом.", "Відповідь: 10 Ом; 2,4 Ом."]}, {"q": "Електрочайник потужністю 2000 Вт працював 3 хв. Яку роботу виконав струм? Виразіть її в джоулях і кіловат-годинах.", "s": ["Дано: P = 2000 Вт, t = 3 хв. Знайти: A.", "СІ: t = 180 с.", "Розв’язання: A = Pt = 2000 · 180 = 360 000 Дж; 360 000 / 3 600 000 = 0,1 кВт·год (або A = 2 кВт · 0,05 год = 0,1 кВт·год).", "Відповідь: 360 кДж = 0,1 кВт·год."]}], "lab": null, "f": "Закон теплової дії струму незалежно один від одного відкрили англієць Джеймс Джоуль і Емілій Ленц, тому закон носить імена обох учених.", "pr": ["Перепишіть із паспортів або наліпок трьох побутових приладів їхню потужність і оцініть, скільки кіловат-годин кожен споживає за тиждень вашого звичайного користування.", "Розв’яжіть задачу: дві лампи опорами по 240 Ом з’єднані паралельно й увімкнені в мережу 220 В. Яка сила струму в нерозгалуженій частині кола? (≈ 1,83 А)"], "qz": [{"q": "Яка величина однакова для всіх провідників при послідовному з’єднанні?", "o": ["Напруга", "Сила струму", "Потужність", "Кількість теплоти"], "a": 1, "why": "Струм не має розгалужень, тому I = I₁ = I₂."}, {"q": "Загальний опір двох резисторів по 10 Ом, з’єднаних паралельно, —", "o": ["20 Ом", "10 Ом", "5 Ом", "100 Ом"], "a": 2, "why": "R = 10/2 = 5 Ом."}, {"q": "Як з’єднані прилади в квартирній мережі?", "o": ["Паралельно", "Послідовно", "Змішано по три", "Ніяк не з’єднані"], "a": 0, "why": "Паралельне з’єднання забезпечує однакову напругу і незалежну роботу приладів."}, {"q": "Потужність лампи, через яку за напруги 220 В іде струм 0,5 А, —", "o": ["440 Вт", "220,5 Вт", "44 Вт", "110 Вт"], "a": 3, "why": "P = UI = 220 · 0,5 = 110 Вт."}, {"q": "1 кВт·год дорівнює", "o": ["1000 Дж", "3,6·10⁶ Дж", "3600 Дж", "3,6·10³ Дж"], "a": 1, "why": "1000 Вт · 3600 с = 3,6·10⁶ Дж."}, {"q": "Скільки теплоти виділить резистор 10 Ом за 10 с при силі струму 2 А?", "o": ["200 Дж", "40 Дж", "400 Дж", "4000 Дж"], "a": 2, "why": "Q = I²Rt = 4 · 10 · 10 = 400 Дж."}, {"q": "Резистори 2 Ом і 3 Ом з’єднані послідовно, сила струму 2 А. Загальна напруга —", "o": ["4 В", "6 В", "2,5 В", "10 В"], "a": 3, "why": "U = I(R₁ + R₂) = 2 · 5 = 10 В."}, {"q": "Для чого в електромережі встановлюють запобіжники або автоматичні вимикачі?", "o": ["Для захисту від короткого замикання і перевантаження", "Для збільшення напруги", "Для економії енергії", "Для вимірювання струму"], "a": 0, "why": "Вони розмикають коло, коли сила струму перевищує допустиму."}]}, {"n": "100", "type": "repeat", "t": "Електричний струм у різних середовищах", "gr": "ГР1, ГР2, ГР3", "g": "Повторити природу електричного струму в металах, електролітах, газах і напівпровідниках, закон Фарадея для електролізу та застосування струму в різних середовищах.", "blocks": [{"h": "Струм у металах", "p": ["Носіями струму в металах є вільні електрони. Під дією електричного поля вони рухаються напрямлено, стикаючись з йонами кристалічних ґраток, — це і спричиняє опір металу.", "Зі зростанням температури коливання йонів посилюються, тому опір металів збільшується: R = R₀(1 + αΔt). Цю залежність використовують у термометрах опору."], "ul": ["Під час проходження струму в металах речовина не переноситься.", "Нитка лампи розжарювання в нагрітому стані має опір у кілька разів більший, ніж у холодному.", "За дуже низьких температур деякі метали і сплави переходять у стан надпровідності — їхній опір стає рівним нулю.", "Надпровідники застосовують у потужних електромагнітах (томографи, прискорювачі)."]}, {"h": "Струм в електролітах", "p": ["Електроліти — розчини і розплави солей, кислот, лугів. Під час розчинення молекули розпадаються на позитивні й негативні йони (електролітична дисоціація). Струм в електролітах — напрямлений рух йонів.", "Під час проходження струму на електродах виділяється речовина — це електроліз. Закон Фарадея: m = kIt, де k — електрохімічний еквівалент речовини."], "ul": ["Позитивні йони рухаються до катода (−), негативні — до анода (+).", "Застосування електролізу: гальваностегія (нікелювання, хромування), гальванопластика, добування чистих металів (алюмінію, міді), очищення металів.", "Зі зростанням температури опір електролітів зменшується.", "Електроліз проводять лише в шкільній лабораторії з учителем; удома досліди з розчинами під струмом виконувати не можна."]}, {"h": "Струм у газах і напівпровідниках", "p": ["За звичайних умов гази — діелектрики. Струм у газах (газовий розряд) можливий, коли газ іонізований: його носії — електрони і йони. Розрізняють несамостійний і самостійний розряди; види самостійного розряду — іскровий (блискавка), дуговий (зварювання), тліючий (рекламні трубки), коронний.", "Напівпровідники (кремній, германій) мають провідність, що різко зростає з нагріванням і освітленням. Носії струму — електрони та дірки. Контакт напівпровідників p- і n-типу (p–n-перехід) пропускає струм лише в одному напрямку — на цьому ґрунтується дія діода."], "ul": ["Опір напівпровідників зі зростанням температури зменшується (на відміну від металів).", "Домішки донорні дають n-провідність (електронну), акцепторні — p-провідність (діркову).", "Застосування напівпровідників: діоди, транзистори, світлодіоди, сонячні батареї, мікросхеми.", "Газові розряди дуже небезпечні; вивчайте їх лише теоретично або у віртуальних лабораторіях."]}], "formulas": [{"f": "R = R₀(1 + αΔt)", "d": "R₀ — опір за 0 °C, α — температурний коефіцієнт опору (К⁻¹), Δt — зміна температури"}, {"f": "m = kIt", "d": "закон Фарадея для електролізу: m — маса речовини на електроді, k — електрохімічний еквівалент (кг/Кл), I — сила струму, t — час"}, {"f": "q = It", "d": "заряд, що пройшов через електроліт"}], "terms": [["Електроліт", "речовина, розчин або розплав якої проводить струм завдяки наявності йонів."], ["Електроліз", "виділення речовини на електродах під час проходження струму через електроліт."], ["Газовий розряд", "процес проходження електричного струму крізь газ."], ["Йонізація", "процес утворення йонів з нейтральних атомів чи молекул."], ["Надпровідність", "явище зникнення електричного опору деяких речовин за дуже низьких температур."], ["p–n-перехід", "контактний шар між напівпровідниками p- і n-типу, що має однобічну провідність."]], "examples": [{"q": "Скільки міді виділиться на катоді під час електролізу за 1 год при силі струму 2 А? Електрохімічний еквівалент міді 0,33·10⁻⁶ кг/Кл.", "s": ["Дано: t = 1 год, I = 2 А, k = 0,33·10⁻⁶ кг/Кл. Знайти: m.", "СІ: t = 3600 с.", "Розв’язання: m = kIt = 0,33·10⁻⁶ · 2 · 3600 ≈ 2,4·10⁻³ кг.", "Відповідь: ≈ 2,4 г."]}, {"q": "Опір мідної котушки за 0 °C дорівнює 10 Ом. Яким буде її опір за 100 °C? Температурний коефіцієнт опору міді 4,3·10⁻³ К⁻¹.", "s": ["Дано: R₀ = 10 Ом, Δt = 100 °C, α = 4,3·10⁻³ К⁻¹. Знайти: R.", "Розв’язання: R = R₀(1 + αΔt) = 10 · (1 + 4,3·10⁻³ · 100) = 10 · 1,43 = 14,3 Ом.", "Відповідь: 14,3 Ом."]}], "lab": null, "f": "Алюміній колись був дорожчим за золото; він став дешевим металом лише наприкінці XIX ст., коли винайшли спосіб добувати його електролізом розплаву.", "pr": ["Складіть таблицю «Носії струму в різних середовищах»: метали, електроліти, гази, напівпровідники; для кожного середовища вкажіть носії струму, як опір залежить від температури, і два приклади застосування.", "Розв’яжіть задачу: протягом якого часу треба пропускати струм 5 А через розчин солі нікелю, щоб на виробі виділилося 3 г нікелю? (k = 0,3·10⁻⁶ кг/Кл) (2000 с ≈ 33 хв)"], "qz": [{"q": "Що є носіями струму в металах?", "o": ["Позитивні йони", "Вільні електрони", "Протони", "Електрони і дірки"], "a": 1, "why": "У металах струм створюють вільні електрони."}, {"q": "Як змінюється опір металу з підвищенням температури?", "o": ["Зменшується", "Не змінюється", "Збільшується", "Стає нулем"], "a": 2, "why": "R = R₀(1 + αΔt) — зростає через посилення коливань йонів."}, {"q": "Що є носіями струму в електролітах?", "o": ["Йони", "Електрони", "Дірки", "Нейтрони"], "a": 0, "why": "Під час дисоціації утворюються позитивні та негативні йони."}, {"q": "Яка формула виражає закон Фарадея для електролізу?", "o": ["I = U/R", "Q = I²Rt", "F = BIl", "m = kIt"], "a": 3, "why": "Маса речовини пропорційна заряду, що пройшов через електроліт."}, {"q": "Який вид розряду використовують для електрозварювання?", "o": ["Тліючий", "Коронний", "Дуговий", "Іскровий"], "a": 2, "why": "Електрична дуга дає дуже високу температуру."}, {"q": "Як змінюється опір напівпровідника з підвищенням температури?", "o": ["Збільшується", "Зменшується", "Не змінюється", "Спочатку зростає, потім спадає"], "a": 1, "why": "Із нагріванням утворюється більше вільних носіїв заряду."}, {"q": "Яку властивість має p–n-перехід?", "o": ["Однобічну провідність", "Надпровідність", "Не проводить струм зовсім", "Підсилює напругу без джерела"], "a": 0, "why": "Він пропускає струм лише в одному напрямку."}, {"q": "Скільки речовини виділиться за 100 с при силі струму 3 А, якщо k = 0,3·10⁻⁶ кг/Кл?", "o": ["0,9 мг", "9 г", "0,09 мг", "90 мг"], "a": 3, "why": "m = 0,3·10⁻⁶ · 3 · 100 = 9·10⁻⁵ кг = 90 мг."}]}, {"n": "101", "type": "repeat", "t": "Магнітні та електромагнітні явища", "gr": "ГР1, ГР2, ГР3", "g": "Повторити властивості магнітного поля, правила для визначення напрямку ліній поля та сили Ампера, принцип дії електромагніта, електродвигуна, явище електромагнітної індукції та генератора.", "blocks": [{"h": "Магнітне поле", "p": ["Магнітне поле — форма матерії, що існує навколо постійних магнітів, провідників зі струмом і рухомих заряджених частинок. Воно діє на магнітну стрілку, інші магніти та провідники зі струмом.", "Магніт має два полюси — північний (N) і південний (S). Однойменні полюси відштовхуються, різнойменні — притягуються. Земля також є великим магнітом, тому стрілка компаса орієнтується з півночі на південь."], "ul": ["Дослід Ерстеда (1820 р.) показав, що навколо провідника зі струмом існує магнітне поле.", "Магнітні лінії поза магнітом напрямлені від північного полюса до південного; вони завжди замкнені.", "Напрямок ліній поля прямого провідника і котушки зі струмом визначають за правилом правої руки (свердлика).", "Силова характеристика поля — магнітна індукція B, одиниця — тесла (Тл).", "Магнітне поле Землі захищає живі організми від потоків заряджених частинок із космосу; полярне сяйво — наслідок цієї взаємодії."]}, {"h": "Електромагніт і сила Ампера", "p": ["Електромагніт — котушка зі струмом, усередині якої є залізне осердя. Його магнітна дія посилюється зі збільшенням сили струму та кількості витків; її можна вмикати і вимикати.", "На провідник зі струмом у магнітному полі діє сила Ампера: F_A = BIl·sin α, де α — кут між напрямком струму і вектором магнітної індукції. Напрямок сили визначають за правилом лівої руки."], "ul": ["Електромагніти використовують у підйомних кранах, дверних замках, реле, дзвінках, гучномовцях.", "Сила Ампера найбільша, коли провідник перпендикулярний до ліній поля (sin 90° = 1), і дорівнює нулю, коли він паралельний лініям.", "Дію сили Ампера на рамку зі струмом використовують в електродвигунах.", "Електродвигуни мають високий ККД і не забруднюють повітря на місці роботи."]}, {"h": "Електромагнітна індукція", "p": ["Явище електромагнітної індукції відкрив Майкл Фарадей у 1831 р.: у замкненому провідному контурі виникає електричний (індукційний) струм, якщо змінюється магнітне поле, що пронизує цей контур.", "На цьому явищі ґрунтується дія індукційного генератора, який перетворює механічну енергію на електричну. Так виробляють електроенергію на ТЕС, ГЕС, АЕС і вітрових електростанціях."], "ul": ["Індукційний струм виникає, коли магніт рухається відносно котушки або котушка — відносно магніту.", "Що швидше змінюється магнітне поле, то більший індукційний струм.", "Якщо магніт і котушка нерухомі одне відносно одного, струму немає.", "Трансформатор (на явищі індукції) підвищує або знижує змінну напругу для передавання електроенергії на великі відстані."]}], "formulas": [{"f": "F_A = BIl·sin α", "d": "сила Ампера: B — магнітна індукція (Тл), I — сила струму (А), l — довжина активної частини провідника (м), α — кут між напрямком струму і вектором B"}, {"f": "B = F_A/(Il)", "d": "модуль магнітної індукції (за α = 90°)"}], "terms": [["Магнітне поле", "форма матерії, що існує навколо магнітів, провідників зі струмом і рухомих заряджених частинок та діє на них."], ["Магнітна індукція", "векторна фізична величина, що є силовою характеристикою магнітного поля."], ["Електромагніт", "котушка зі струмом із залізним осердям усередині."], ["Сила Ампера", "сила, з якою магнітне поле діє на провідник зі струмом."], ["Електромагнітна індукція", "явище виникнення електричного струму в замкненому контурі внаслідок зміни магнітного поля, що його пронизує."], ["Генератор", "пристрій, що перетворює механічну енергію на електричну."]], "examples": [{"q": "Провідник завдовжки 0,4 м, у якому сила струму 5 А, розташований перпендикулярно до ліній однорідного магнітного поля з індукцією 0,2 Тл. Знайдіть силу Ампера.", "s": ["Дано: l = 0,4 м, I = 5 А, B = 0,2 Тл, α = 90°. Знайти: F_A.", "Розв’язання: F_A = BIl·sin α = 0,2 · 5 · 0,4 · 1 = 0,4 Н.", "Відповідь: 0,4 Н."]}, {"q": "На провідник завдовжки 20 см зі струмом 3 А у магнітному полі діє сила 0,12 Н. Провідник перпендикулярний до ліній поля. Знайдіть індукцію магнітного поля. Як зміниться сила, якщо провідник повернути під кутом 30° до ліній?", "s": ["Дано: l = 20 см, I = 3 А, F_A = 0,12 Н, α = 90°. Знайти: B.", "СІ: l = 0,2 м.", "Розв’язання: B = F_A/(Il) = 0,12 / (3 · 0,2) = 0,2 Тл. За α = 30°: F_A = BIl·sin 30° = 0,2 · 3 · 0,2 · 0,5 = 0,06 Н — сила зменшиться вдвічі.", "Відповідь: 0,2 Тл; сила стане 0,06 Н."]}], "lab": null, "f": "Деякі птахи, наприклад голуби, здатні відчувати магнітне поле Землі й використовують його для орієнтації під час перельотів.", "pr": ["Зберіть удома простий компас: намагнітьте швейну голку, потерши її магнітом в одному напрямку, проткніть нею шматочок пробки і покладіть на воду в мисці. Опишіть, як орієнтується голка.", "Розв’яжіть задачу: яка сила діє на провідник завдовжки 0,5 м зі струмом 4 А в полі з індукцією 0,1 Тл, якщо провідник перпендикулярний до ліній поля? (0,2 Н)"], "qz": [{"q": "Хто вперше виявив магнітну дію струму?", "o": ["Фарадей", "Ерстед", "Ампер", "Ом"], "a": 1, "why": "Ерстед у 1820 р. помітив, що провідник зі струмом відхиляє магнітну стрілку."}, {"q": "Одиниця магнітної індукції —", "o": ["вебер", "генрі", "тесла", "ньютон"], "a": 2, "why": "[B] = Тл."}, {"q": "Як взаємодіють однойменні полюси магнітів?", "o": ["Відштовхуються", "Притягуються", "Не взаємодіють", "Залежить від розмірів"], "a": 0, "why": "Однойменні полюси відштовхуються, різнойменні — притягуються."}, {"q": "Яким правилом визначають напрямок сили Ампера?", "o": ["Правилом свердлика", "Правилом моментів", "Правилом правої руки для котушки", "Правилом лівої руки"], "a": 3, "why": "Ліва рука: лінії входять у долоню, чотири пальці — за струмом, великий палець показує силу."}, {"q": "Як посилити магнітну дію електромагніта?", "o": ["Збільшити силу струму", "Зменшити кількість витків", "Вийняти осердя", "Замінити залізо на мідь"], "a": 0, "why": "Магнітне поле котушки зростає зі збільшенням сили струму і кількості витків."}, {"q": "Сила Ампера, що діє на провідник 0,5 м зі струмом 2 А в полі 0,3 Тл (α = 90°), —", "o": ["3 Н", "0,03 Н", "1,2 Н", "0,3 Н"], "a": 3, "why": "F = 0,3 · 2 · 0,5 = 0,3 Н."}, {"q": "У якому випадку в котушці виникає індукційний струм?", "o": ["Магніт лежить нерухомо в котушці", "Магніт вносять у котушку або виймають з неї", "Котушка розімкнена", "Магніт лежить поруч із котушкою"], "a": 1, "why": "Індукційний струм виникає лише за зміни магнітного поля в замкненому контурі."}, {"q": "Яке перетворення енергії відбувається в генераторі?", "o": ["Електрична → механічна", "Хімічна → електрична", "Механічна → електрична", "Світлова → теплова"], "a": 2, "why": "Генератор на явищі електромагнітної індукції перетворює механічну енергію обертання на електричну."}]}, {"n": "102", "type": "repeat", "t": "Механічні та електромагнітні хвилі", "gr": "ГР1, ГР2, ГР3", "g": "Повторити види і характеристики механічних хвиль, природу та властивості звуку, шкалу електромагнітних хвиль та їх застосування.", "blocks": [{"h": "Механічні хвилі та їх характеристики", "p": ["Механічна хвиля — це поширення коливань у пружному середовищі. Хвиля переносить енергію, але не переносить речовину: поплавок на хвилях лише гойдається вгору-вниз.", "Хвилі бувають поперечні (частинки коливаються перпендикулярно до напрямку поширення хвилі) і поздовжні (частинки коливаються вздовж напрямку поширення). Основні характеристики хвилі: довжина λ, період T, частота ν, швидкість v; вони пов’язані формулою v = λν = λ/T."], "ul": ["Довжина хвилі — відстань, на яку хвиля поширюється за один період (відстань між сусідніми гребенями).", "Поперечні механічні хвилі поширюються лише у твердих тілах і на поверхні рідини, поздовжні — у твердих тілах, рідинах і газах.", "Частота ν = 1/T вимірюється в герцах (Гц).", "Механічні хвилі не поширюються у вакуумі."]}, {"h": "Звук", "p": ["Звук — механічні поздовжні хвилі частотою приблизно від 20 Гц до 20 000 Гц, які сприймає вухо людини. Хвилі з частотою, меншою за 20 Гц, — інфразвук, більшою за 20 кГц — ультразвук.", "Швидкість звуку в повітрі за кімнатної температури ≈ 340 м/с, у воді — близько 1500 м/с, у сталі — ще більша. Гучність звуку визначається амплітудою коливань, висота тону — частотою."], "ul": ["Луна — звук, відбитий від перешкоди; відстань до перешкоди s = vt/2.", "Ультразвук використовують в ехолотах, медичній діагностиці (УЗД), для очищення деталей.", "Кажани й дельфіни орієнтуються за допомогою ультразвуку (ехолокація).", "Тривалий гучний шум шкодить слуху, тому користуйтеся навушниками на помірній гучності."]}, {"h": "Електромагнітні хвилі", "p": ["Електромагнітна хвиля — поширення в просторі змінного електромагнітного поля. На відміну від механічних, електромагнітні хвилі поширюються і у вакуумі, причому зі швидкістю світла c ≈ 3·10⁸ м/с. Вони є поперечними.", "Залежно від частоти (довжини хвилі) розрізняють: радіохвилі, інфрачервоне випромінювання, видиме світло, ультрафіолетове, рентгенівське і гамма-випромінювання. Що більша частота, то менша довжина хвилі: c = λν."], "ul": ["Радіохвилі — радіо, телебачення, мобільний зв’язок, Wi-Fi, радіолокація.", "Інфрачервоне випромінювання — тепловізори, пульти дистанційного керування, обігрівачі.", "Ультрафіолет спричиняє засмагу і знезаражує, але в надлишку шкідливий для шкіри й очей.", "Рентгенівське випромінювання — медична діагностика, контроль багажу.", "Гамма-випромінювання має найбільшу проникну здатність і є найнебезпечнішим."]}], "formulas": [{"f": "v = λν = λ/T", "d": "v — швидкість хвилі (м/с), λ — довжина хвилі (м), ν — частота (Гц), T — період (с)"}, {"f": "ν = 1/T", "d": "зв’язок частоти і періоду"}, {"f": "s = vt/2", "d": "відстань до перешкоди за часом t повернення луни"}, {"f": "c = λν", "d": "для електромагнітних хвиль, c ≈ 3·10⁸ м/с"}], "terms": [["Механічна хвиля", "поширення механічних коливань у пружному середовищі."], ["Довжина хвилі", "відстань, на яку поширюється хвиля за час, що дорівнює періоду коливань."], ["Поперечна хвиля", "хвиля, у якій коливання відбуваються перпендикулярно до напрямку її поширення."], ["Поздовжня хвиля", "хвиля, у якій коливання відбуваються вздовж напрямку її поширення."], ["Ультразвук", "механічні хвилі з частотою понад 20 000 Гц, яких не чує людина."], ["Електромагнітна хвиля", "поширення в просторі змінного електромагнітного поля."]], "examples": [{"q": "Камертон випромінює звук частотою 680 Гц. Яка довжина звукової хвилі в повітрі, якщо швидкість звуку 340 м/с?", "s": ["Дано: ν = 680 Гц, v = 340 м/с. Знайти: λ.", "Розв’язання: v = λν, звідки λ = v/ν = 340 / 680 = 0,5 м.", "Відповідь: 0,5 м."]}, {"q": "Ехолот корабля зафіксував відбитий від дна ультразвуковий сигнал через 0,4 с після його посилання. Яка глибина моря, якщо швидкість звуку у воді 1500 м/с? Яка довжина радіохвилі станції, що працює на частоті 100 МГц?", "s": ["Дано: t = 0,4 с, v = 1500 м/с; ν = 100 МГц, c = 3·10⁸ м/с. Знайти: h, λ.", "СІ: ν = 1·10⁸ Гц.", "Розв’язання: сигнал пройшов шлях до дна і назад, тому h = vt/2 = 1500 · 0,4 / 2 = 300 м. Для радіохвилі λ = c/ν = 3·10⁸ / 1·10⁸ = 3 м.", "Відповідь: 300 м; 3 м."]}], "lab": null, "f": "Під час грози спочатку видно блискавку, а потім чути грім, бо світло поширюється майже в мільйон разів швидше за звук; за кожні 3 с затримки грому до грози приблизно 1 км.", "pr": ["Наступного разу під час грози (перебуваючи в безпечному приміщенні) виміряйте час між спалахом блискавки і громом та обчисліть відстань до неї; поясніть, чому цей метод працює.", "Розв’яжіть задачу: хвиля поширюється зі швидкістю 6 м/с, частота коливань 2 Гц. Яка довжина хвилі? (3 м)"], "qz": [{"q": "Чи переносить механічна хвиля речовину?", "o": ["Так, завжди", "Ні, переносить лише енергію", "Лише в рідинах", "Лише в газах"], "a": 1, "why": "Частинки середовища лише коливаються біля положень рівноваги."}, {"q": "Звук у повітрі є хвилею", "o": ["поперечною", "електромагнітною", "поздовжньою", "стоячою"], "a": 2, "why": "У газах можуть поширюватися лише поздовжні механічні хвилі."}, {"q": "Довжина хвилі 2 м, частота 5 Гц. Швидкість хвилі —", "o": ["10 м/с", "0,4 м/с", "2,5 м/с", "7 м/с"], "a": 0, "why": "v = λν = 2 · 5 = 10 м/с."}, {"q": "Звук з якою частотою людина НЕ чує?", "o": ["200 Гц", "1000 Гц", "15 000 Гц", "40 000 Гц"], "a": 3, "why": "Це ультразвук — понад 20 000 Гц."}, {"q": "Чим визначається висота тону звуку?", "o": ["Амплітудою", "Частотою", "Швидкістю", "Тривалістю"], "a": 1, "why": "Що більша частота, то вищий звук."}, {"q": "Швидкість електромагнітних хвиль у вакуумі —", "o": ["340 м/с", "3·10⁵ м/с", "1500 м/с", "3·10⁸ м/с"], "a": 3, "why": "Електромагнітні хвилі у вакуумі поширюються зі швидкістю світла."}, {"q": "Яке випромінювання використовують у тепловізорах?", "o": ["Інфрачервоне", "Ультрафіолетове", "Рентгенівське", "Гамма"], "a": 0, "why": "Нагріті тіла інтенсивно випромінюють в інфрачервоному діапазоні."}, {"q": "Яка довжина хвилі радіостанції, що працює на частоті 30 МГц?", "o": ["1 м", "100 м", "10 м", "0,1 м"], "a": 2, "why": "λ = 3·10⁸ / 3·10⁷ = 10 м."}]}, {"n": "103", "type": "repeat", "t": "Світлові явища", "gr": "ГР1, ГР2, ГР3", "g": "Повторити закони прямолінійного поширення, відбивання і заломлення світла, властивості лінз, формулу тонкої лінзи, будову ока та явище дисперсії.", "blocks": [{"h": "Поширення і відбивання світла", "p": ["Світло — електромагнітні хвилі, які сприймає око. В однорідному середовищі світло поширюється прямолінійно — цим пояснюють утворення тіні та півтіні, сонячні й місячні затемнення.", "Закони відбивання: падаючий і відбитий промені та перпендикуляр до поверхні в точці падіння лежать в одній площині; кут відбивання дорівнює куту падіння (γ = α). Зображення в плоскому дзеркалі уявне, пряме, такого самого розміру, розташоване симетрично предмету."], "ul": ["Джерела світла бувають природні (Сонце, блискавка) і штучні (лампи, світлодіоди).", "Тінь — ділянка, куди не потрапляє світло від джерела; півтінь — куди потрапляє світло від частини джерела.", "Дзеркальне відбивання — від гладкої поверхні, розсіяне — від шорсткої (тому ми бачимо предмети з усіх боків).", "Кути падіння і відбивання вимірюють від перпендикуляра до поверхні, а не від самої поверхні."]}, {"h": "Заломлення світла", "p": ["Заломлення — зміна напрямку поширення світла на межі двох прозорих середовищ. Воно відбувається через те, що в різних середовищах світло має різну швидкість.", "Закон заломлення: падаючий і заломлений промені та перпендикуляр лежать в одній площині; sin α / sin γ = n₂₁, де n₂₁ — відносний показник заломлення другого середовища відносно першого. Абсолютний показник заломлення n = c/v."], "ul": ["Під час переходу в оптично густіше середовище (з повітря у воду чи скло) промінь наближається до перпендикуляра.", "Через заломлення ложка в склянці з водою здається «зламаною», а водойма — мілкішою, ніж є насправді.", "Повне внутрішнє відбивання використовують у світловодах (оптоволоконний інтернет).", "Дисперсія — розкладання білого світла призмою на спектр (червоний, оранжевий, жовтий, зелений, блакитний, синій, фіолетовий); веселка — природний приклад дисперсії."]}, {"h": "Лінзи та око", "p": ["Лінза — прозоре тіло, обмежене сферичними поверхнями. Збиральна лінза (опукла) збирає паралельні промені в головному фокусі F, розсіювальна (увігнута) розсіює їх. Оптична сила D = 1/F, одиниця — діоптрія (дптр); для збиральної лінзи D > 0, для розсіювальної D < 0.", "Формула тонкої лінзи: 1/F = 1/d + 1/f, де d — відстань від предмета до лінзи, f — від лінзи до зображення. Лінійне збільшення Γ = f/d. Око — природна оптична система: кришталик утворює на сітківці дійсне, зменшене, перевернуте зображення."], "ul": ["Короткозорість (зображення перед сітківкою) виправляють розсіювальними лінзами.", "Далекозорість (зображення за сітківкою) виправляють збиральними лінзами.", "Якщо предмет розташований між F і 2F збиральної лінзи, зображення дійсне, збільшене, перевернуте (проєктор).", "Якщо предмет ближче за фокус, зображення уявне, збільшене, пряме (лупа).", "Для розсіювальної лінзи у формулі значення F і f беруть зі знаком «мінус»."]}], "formulas": [{"f": "γ = α", "d": "закон відбивання: α — кут падіння, γ — кут відбивання"}, {"f": "sin α / sin γ = n₂₁", "d": "закон заломлення: α — кут падіння, γ — кут заломлення, n₂₁ — відносний показник заломлення"}, {"f": "n = c/v", "d": "абсолютний показник заломлення середовища, v — швидкість світла в ньому"}, {"f": "D = 1/F", "d": "оптична сила лінзи (дптр), F — фокусна відстань (м)"}, {"f": "1/F = 1/d + 1/f; Γ = f/d", "d": "формула тонкої лінзи та лінійне збільшення: d — відстань від предмета, f — відстань до зображення"}], "terms": [["Світловий промінь", "лінія, уздовж якої поширюється енергія світла."], ["Відбивання світла", "явище повернення світла в те саме середовище на межі двох середовищ."], ["Заломлення світла", "зміна напрямку поширення світла під час переходу з одного середовища в інше."], ["Лінза", "прозоре тіло, обмежене двома сферичними поверхнями (або сферичною і плоскою)."], ["Оптична сила лінзи", "фізична величина, обернена до фокусної відстані лінзи."], ["Дисперсія світла", "залежність показника заломлення від кольору (частоти) світла, що спричиняє розкладання білого світла на спектр."]], "examples": [{"q": "Фокусна відстань збиральної лінзи 20 см. Яка її оптична сила?", "s": ["Дано: F = 20 см. Знайти: D.", "СІ: F = 0,2 м.", "Розв’язання: D = 1/F = 1/0,2 = 5 дптр.", "Відповідь: 5 дптр."]}, {"q": "Предмет розташований на відстані 30 см від збиральної лінзи з фокусною відстанню 20 см. На якій відстані від лінзи утвориться зображення? Яке воно?", "s": ["Дано: d = 30 см, F = 20 см. Знайти: f, Γ.", "Розв’язання: 1/f = 1/F − 1/d = 1/20 − 1/30 = 3/60 − 2/60 = 1/60, тож f = 60 см. Γ = f/d = 60/30 = 2.", "Відповідь: 60 см; зображення дійсне, перевернуте, збільшене вдвічі."]}], "lab": null, "f": "Світло від Сонця долає відстань до Землі приблизно за 8 хвилин, тому ми бачимо Сонце таким, яким воно було 8 хвилин тому.", "pr": ["Покладіть монету на дно непрозорої чашки і відійдіть так, щоб монети не стало видно. Попросіть когось обережно налити води — монета «з’явиться». Поясніть дослід за допомогою заломлення світла.", "Розв’яжіть задачу: оптична сила окулярів −2 дптр. Яка фокусна відстань лінз і яку ваду зору вони виправляють? (−0,5 м; короткозорість)"], "qz": [{"q": "Кут падіння світла на дзеркало 35°. Кут відбивання —", "o": ["55°", "35°", "70°", "145°"], "a": 1, "why": "За законом відбивання γ = α."}, {"q": "Яким є зображення в плоскому дзеркалі?", "o": ["Дійсне, перевернуте", "Уявне, зменшене", "Уявне, пряме, такого самого розміру", "Дійсне, збільшене"], "a": 2, "why": "Зображення утворюється продовженнями відбитих променів і симетричне предмету."}, {"q": "Чим пояснюється утворення тіні?", "o": ["Прямолінійним поширенням світла", "Заломленням", "Дисперсією", "Відбиванням"], "a": 0, "why": "Непрозоре тіло затуляє промені, що поширюються прямолінійно."}, {"q": "Оптична сила лінзи з фокусною відстанню 0,25 м —", "o": ["0,25 дптр", "2,5 дптр", "25 дптр", "4 дптр"], "a": 3, "why": "D = 1/0,25 = 4 дптр."}, {"q": "Які лінзи використовують для виправлення короткозорості?", "o": ["Збиральні", "Розсіювальні", "Циліндричні", "Будь-які"], "a": 1, "why": "Розсіювальна лінза відсуває зображення на сітківку."}, {"q": "Яке явище спостерігаємо у веселці?", "o": ["Дисперсію світла", "Відбивання від дзеркала", "Утворення тіні", "Поглинання світла"], "a": 0, "why": "Краплі води розкладають біле світло на спектр."}, {"q": "Предмет на відстані 2F від збиральної лінзи. Де буде зображення?", "o": ["У фокусі", "Між F і 2F", "На відстані 2F з іншого боку", "Зображення не буде"], "a": 2, "why": "1/f = 1/F − 1/(2F) = 1/(2F), тобто f = 2F, Γ = 1."}, {"q": "Чому ложка в склянці з водою здається «зламаною»?", "o": ["Через відбивання", "Через дисперсію", "Через поглинання світла водою", "Через заломлення світла на межі вода — повітря"], "a": 3, "why": "Промені від частини ложки у воді змінюють напрямок, виходячи в повітря."}]}, {"n": "104", "type": "repeat", "t": "Будова атома та атомного ядра", "gr": "ГР1, ГР2, ГР3", "g": "Повторити ядерну модель атома, склад атомного ядра, поняття ізотопів, види радіоактивного випромінювання, закон радіоактивного розпаду, вплив радіації на організм та атомну енергетику.", "blocks": [{"h": "Будова атома і ядра", "p": ["За ядерною (планетарною) моделлю Резерфорда атом складається з маленького позитивно зарядженого ядра, у якому зосереджена майже вся маса атома, і електронів, що рухаються навколо ядра. В цілому атом електрично нейтральний.", "Ядро складається з протонів і нейтронів (нуклонів). Кількість протонів Z — зарядове число (дорівнює порядковому номеру елемента в таблиці Менделєєва), загальна кількість нуклонів A — масове число; кількість нейтронів N = A − Z."], "ul": ["Протон має заряд +e, нейтрон — не має заряду, електрон — заряд −e.", "У нейтральному атомі кількість електронів дорівнює Z.", "Ізотопи — атоми одного елемента з однаковим Z, але різною кількістю нейтронів (наприклад, уран-235 і уран-238).", "Нуклони в ядрі утримують ядерні сили — дуже потужні, але короткодійні."]}, {"h": "Радіоактивність", "p": ["Радіоактивність — здатність ядер деяких атомів самочинно перетворюватися на ядра інших елементів з випромінюванням частинок. Явище відкрив Анрі Беккерель у 1896 р.; велику роль у його дослідженні відіграли Марія та П’єр Кюрі.", "Види випромінювання: α-частинки (ядра Гелію, затримуються аркушем паперу), β-частинки (електрони, затримуються кількома міліметрами алюмінію), γ-випромінювання (електромагнітні хвилі, послаблюються товстим шаром свинцю чи бетону). Під час α-розпаду Z зменшується на 2, а A — на 4; під час β-розпаду Z збільшується на 1, а A не змінюється."], "ul": ["Період піврозпаду T — час, за який розпадається половина наявних радіоактивних ядер.", "Через час t кількість ядер, що не розпалися, N = N₀ / 2^(t/T).", "Активність — кількість розпадів за секунду, одиниця — бекерель (Бк).", "Поглинута доза вимірюється в греях (Гр), еквівалентна — у зівертах (Зв).", "Захист від радіації: відстань, час, екранування; не вживати продукти із забруднених територій."]}, {"h": "Ядерна енергетика", "p": ["Під час поділу важкого ядра урану-235 нейтроном утворюються два легші ядра та 2–3 нейтрони і виділяється велика енергія. Нові нейтрони можуть поділити інші ядра — так виникає ланцюгова ядерна реакція. Керовану ланцюгову реакцію здійснюють у ядерному реакторі АЕС.", "В Україні працюють чотири АЕС: Запорізька (найбільша в Європі, з 2022 р. окупована), Рівненська, Хмельницька і Південноукраїнська. Атомна енергетика дає значну частку електроенергії країни, але потребує суворого дотримання безпеки — про це нагадує Чорнобильська катастрофа 26 квітня 1986 р."], "ul": ["Основні частини реактора: ядерне паливо, сповільнювач, керувальні стрижні, теплоносій, захисна оболонка.", "Керувальні стрижні поглинають нейтрони і регулюють швидкість реакції.", "Переваги АЕС: мало палива, немає викидів вуглекислого газу.", "Проблеми: зберігання радіоактивних відходів, ризик аварій.", "Термоядерний синтез (злиття легких ядер) — джерело енергії Сонця і зірок."]}], "formulas": [{"f": "N = A − Z", "d": "кількість нейтронів у ядрі: A — масове число, Z — зарядове число (кількість протонів)"}, {"f": "N = N₀ / 2^(t/T)", "d": "закон радіоактивного розпаду: N₀ — початкова кількість ядер, T — період піврозпаду, t — час"}, {"f": "α-розпад: A → A − 4, Z → Z − 2", "d": "ядро випромінює ядро Гелію ⁴₂He"}, {"f": "β-розпад: A не змінюється, Z → Z + 1", "d": "ядро випромінює електрон"}], "terms": [["Атомне ядро", "центральна позитивно заряджена частина атома, у якій зосереджена майже вся його маса."], ["Нуклони", "спільна назва протонів і нейтронів, з яких складається ядро."], ["Ізотопи", "різновиди атомів одного хімічного елемента, ядра яких мають однакову кількість протонів, але різну кількість нейтронів."], ["Радіоактивність", "здатність ядер деяких атомів самочинно перетворюватися на інші ядра з випромінюванням частинок."], ["Період піврозпаду", "час, протягом якого розпадається половина наявної кількості радіоактивних ядер."], ["Ланцюгова ядерна реакція", "реакція поділу ядер, у якій нейтрони, що утворюються, спричиняють поділ нових ядер."]], "examples": [{"q": "Скільки протонів, нейтронів і електронів містить нейтральний атом урану ²³⁸₉₂U?", "s": ["Дано: A = 238, Z = 92. Знайти: протони, N, електрони.", "Розв’язання: кількість протонів Z = 92; кількість нейтронів N = A − Z = 238 − 92 = 146; у нейтральному атомі електронів стільки ж, скільки протонів, — 92.", "Відповідь: 92 протони, 146 нейтронів, 92 електрони."]}, {"q": "Період піврозпаду радіоактивного йоду-131 становить приблизно 8 діб. Скільки йоду залишиться через 24 доби з початкових 400 мг?", "s": ["Дано: T = 8 діб, t = 24 доби, m₀ = 400 мг. Знайти: m.", "Розв’язання: t/T = 24/8 = 3 періоди піврозпаду; m = m₀ / 2³ = 400 / 8 = 50 мг.", "Відповідь: 50 мг."]}], "lab": null, "f": "Рівненська АЕС розташована в місті Вараш Рівненської області — це одна з чотирьох атомних електростанцій України.", "pr": ["Складіть порівняльну таблицю видів радіоактивного випромінювання (α, β, γ): що це за частинки, їхній заряд, проникна здатність і чим від них захиститися.", "Розв’яжіть задачу: ядро Радію ²²⁶₈₈Ra зазнає α-розпаду. Які зарядове і масове числа утвореного ядра? (Z = 86, A = 222 — Радон)"], "qz": [{"q": "Хто запропонував ядерну (планетарну) модель атома?", "o": ["Томсон", "Беккерель", "Резерфорд", "Кюрі"], "a": 2, "why": "Резерфорд дійшов висновку про ядро з дослідів розсіювання α-частинок."}, {"q": "З яких частинок складається атомне ядро?", "o": ["Протонів і нейтронів", "Протонів і електронів", "Нейтронів і електронів", "Лише протонів"], "a": 0, "why": "Протони й нейтрони — нуклони."}, {"q": "Скільки нейтронів у ядрі ¹⁴₆C?", "o": ["6", "14", "20", "8"], "a": 3, "why": "N = A − Z = 14 − 6 = 8."}, {"q": "Чим відрізняються ізотопи одного елемента?", "o": ["Кількістю протонів", "Кількістю нейтронів", "Зарядом ядра", "Кількістю електронів у нейтральному атомі"], "a": 1, "why": "Z однакове, а A — різне через різну кількість нейтронів."}, {"q": "Яке випромінювання має найбільшу проникну здатність?", "o": ["α", "β", "γ", "Усі однакову"], "a": 2, "why": "γ-випромінювання — електромагнітні хвилі високої енергії."}, {"q": "Період піврозпаду 2 год. Яка частина ядер залишиться через 6 год?", "o": ["1/8", "1/3", "1/6", "1/4"], "a": 0, "why": "6/2 = 3 періоди; (1/2)³ = 1/8."}, {"q": "Як змінюються A і Z під час β-розпаду?", "o": ["A − 4, Z − 2", "A не змінюється, Z − 1", "A + 1, Z не змінюється", "A не змінюється, Z + 1"], "a": 3, "why": "Нейтрон перетворюється на протон з випромінюванням електрона."}, {"q": "Яка АЕС України є найбільшою в Європі?", "o": ["Рівненська", "Запорізька", "Хмельницька", "Південноукраїнська"], "a": 1, "why": "Запорізька АЕС — найбільша в Європі, з 2022 р. окупована."}]}, {"n": "105", "type": "test", "t": "Комплексна підсумкова робота № 6 з теми «Повторення вивченого матеріалу»", "gr": "ГР1, ГР2, ГР3", "g": "Перевірити, як учні засвоїли основні поняття, закони й формули курсу фізики 7–9 класів та вміють застосовувати їх до розв’язування якісних і розрахункових задач.", "blocks": [{"h": "Що перевіряє підсумкова робота", "p": ["Робота охоплює весь курс фізики 7–9 класів     <svg class="wave" viewBox="0 0 1400 120" preserveAspectRatio="none" aria-hidden="true"><g class="wv"><path d="M0 70 ${Array.from({length:16}, (_, i) => `Q ${i * 100 + 50} ${i % 2 ? 110 : 30} ${i * 100 + 100} 70`).join(" ")}" stroke="#22D3EE" stroke-width="3" fill="none" opacity=".8"/><path d="M0 80 ${Array.from({length:16}, (_, i) => `Q ${i * 100 + 50} ${i % 2 ? 50 : 110} ${i * 100 + 100} 80`).join(" ")}" stroke="#A78BFA" stroke-width="2" fill="none" opacity=".5"/></g></svg>
    <div><div class="kick">// Ліцей «ЯСНО» · 9 клас · Лабораторія</div><h1>Фізика</h1>
      <p>Конспекти за календарно-тематичним плануванням: теорія, формули, задачі з покроковим розв’язанням, лабораторні роботи й тест до кожного уроку.</p>
      <div class="stats"><span class="stat"><b>${SECS.length}</b>розділів</span><span class="stat"><b>${FLAT.length}</b>уроків</span><span class="stat"><b>${FLAT.filter(l => l.type === "lab").length}</b>лабораторних</span><span class="stat"><b>${done}</b>пройдено</span></div></div>
  </section>
  <div class="tools"><input class="search" id="search" type="search" placeholder="Знайти тему, формулу або поняття…" value="${esc(q)}" aria-label="Пошук">
    ${[["", "Усі"], ...Object.entries(TY).map(([k, v]) => [k, v[1] + " " + v[0]])].map(([k, lab]) => `<button class="f" type="button" data-f="${k}" aria-pressed="${filter === k}">${esc(lab)}</button>`).join("")}</div>
  <div class="mods" id="mods"></div>
  <p class="foot">За модельною програмою «Фізика. 7–9 класи» (Кремінський Б. Г. та ін.)<br>Результати тестів і позначки лабораторних зберігаються лише у вашому браузері.</p>`;
  document.getElementById("search").oninput = e => { q = e.target.value; mods(); };
  document.querySelectorAll(".f").forEach(b => b.onclick = () => { filter = b.dataset.f; document.querySelectorAll(".f").forEach(x => x.setAttribute("aria-pressed", x === b)); mods(); });
  mods();
}
function mods(){
  const t = q.trim().toLowerCase(); let any = false;
  document.getElementById("mods").innerHTML = SECS.map(s => {
    const ls = s.lessons.filter(l => (!filter || l.type === filter) && (!t || (l.t + " " + (l.terms || []).map(x => x[0]).join(" ") + " " + (l.formulas || []).map(f => f.f).join(" ")).toLowerCase().includes(t)));
    if (!ls.length) return ""; any = true;
    const d = s.lessons.filter(passed).length;
    return `<section class="mod" id="m${s.i}" style="--k:${s.k}"><div class="mod-h"><span class="ic">${ICON[s.i]}</span><div style="flex:1;min-width:0"><small>Розділ ${s.i + 1}</small><h2>${esc(s.title)}</h2><div class="bar"><i style="width:${100 * d / s.lessons.length}%"></i></div></div><span class="cnt">${d} / ${s.lessons.length}</span></div>
      <ul class="rows">${ls.map(l => `<li><a href="#L${l.n}"><span class="n">${l.n}</span><span class="tt">${esc(l.t)}${passed(l) ? '<span class="ok">✓</span>' : ""}</span><span class="tb" style="--c:${TY[l.type][2]}">${TY[l.type][1]} ${TY[l.type][0]}</span></a></li>`).join("")}</ul></section>`;
  }).join("");
  if (!any) document.getElementById("mods").innerHTML = '<p class="empty">Нічого не знайдено. Спробуйте інше слово або фільтр.</p>';
}
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function lesson(l){
  const s = l.s, i = FLAT.indexOf(l), pv = FLAT[i - 1], nx = FLAT[i + 1], ty = TY[l.type];
  const lab = l.lab, labKey = "fiz9-lab-" + l.n, labState = st.get(labKey, {c:{}, t:{}});
  document.getElementById("app").innerHTML = `<div style="--k:${s.k}">
    <div class="crumb"><a href="#">← Усі уроки</a><span>·</span><a href="#m${s.i}">Розділ ${s.i + 1}. ${esc(s.title)}</a></div>
    <div class="lhead"><span class="ic">${ICON[s.i]}</span><div class="tn">Урок ${l.n} · ${ty[1]} ${ty[0]}</div><h1>${esc(l.t)}</h1>
      <div class="chips">${l.gr ? `<span class="chip">${esc(l.gr)}</span>` : ""}${(l.formulas || []).length ? `<span class="chip">∑ ${(l.formulas || []).length} формул</span>` : ""}${(l.examples || []).length ? `<span class="chip">🧮 ${(l.examples || []).length} задач</span>` : ""}<span class="chip">✓ Тест · ${qn(l)} питань</span>${passed(l) ? '<span class="chip">Пройдено</span>' : ""}</div>
      ${l.g ? `<div class="goal">🎯 ${esc(l.g)}</div>` : ""}</div>
    <div class="lgrid"><div>
      ${(l.blocks || []).length ? `<div class="sec-t">Конспект</div>` + l.blocks.map((b, k) => `<div class="card"><h2><span class="no">${k + 1}</span>${esc(b.h)}</h2>${(b.p || []).map(p => `<p>${esc(p)}</p>`).join("")}${(b.ul || []).length ? `<ul>${b.ul.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}</div>`).join("") : ""}
      ${(l.formulas || []).length ? `<div class="sec-t">Формули</div><div class="fgrid">${l.formulas.map(f => `<div class="fm"><code>${esc(f.f)}</code>${f.d ? `<span>${esc(f.d)}</span>` : ""}</div>`).join("")}</div>` : ""}
      ${lab ? `<div class="sec-t">Лабораторна робота</div><div class="lab"><div class="lab-h">🔬 Протокол роботи</div><div class="lab-b">
        <h3>Мета</h3><p>${esc(lab.goal)}</p>
        ${(lab.equip || []).length ? `<h3>Обладнання</h3><div class="equip">${lab.equip.map(e => `<span>${esc(e)}</span>`).join("")}</div>` : ""}
        ${(lab.safety || []).length ? `<h3>Безпека</h3><div class="warn">⚠️ <b>Обов’язково дотримуйтеся:</b><ul>${lab.safety.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
        ${(lab.steps || []).length ? `<h3>Хід роботи <span style="text-transform:none;letter-spacing:0;font-family:var(--f-u);color:var(--muted);font-weight:600">· позначайте виконані кроки</span></h3><ol class="chk">${lab.steps.map((x, k) => `<li><label><input type="checkbox" data-c="${k}" ${labState.c[k] ? "checked" : ""}><span>${k + 1}. ${esc(x)}</span></label></li>`).join("")}</ol>` : ""}
        ${(lab.table || []).length ? `<h3>Таблиця результатів <span style="text-transform:none;letter-spacing:0;font-family:var(--f-u);color:var(--muted);font-weight:600">· можна заповнити просто тут</span></h3><div class="tblw"><table class="prot"><thead><tr><th>№</th>${lab.table.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${[0, 1, 2, 3, 4].map(r => `<tr><td>${r + 1}</td>${lab.table.map((_, c) => `<td><input data-t="${r}-${c}" value="${esc(labState.t[r + "-" + c] || "")}" aria-label="Рядок ${r + 1}, ${esc(lab.table[c])}"></td>`).join("")}</tr>`).join("")}</tbody></table></div>` : ""}
        ${(lab.calc || []).length ? `<h3>Обробка результатів</h3><ul>${lab.calc.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
        ${lab.sample ? `<h3>Чого очікувати</h3><p>${esc(lab.sample)}</p>` : ""}
        ${(lab.questions || []).length ? `<h3>Контрольні запитання</h3><ol>${lab.questions.map(x => `<li>${esc(x)}</li>`).join("")}</ol>` : ""}
      </div></div>` : ""}
      ${(l.examples || []).length ? `<div class="sec-t">Розв’язані задачі</div>` + l.examples.map((e, k) => `<div class="ex"><div class="q"><b>№${k + 1}</b><span>${esc(e.q)}</span></div><ol class="steps" data-ex="${k}">${(e.s || []).map((x, j) => `<li${j ? " hidden" : ""}>${esc(x)}</li>`).join("")}</ol><div class="exb">${(e.s || []).length > 1 ? `<button class="btn sm" type="button" data-next="${k}">Наступний крок →</button><button class="btn ghost sm" type="button" data-all="${k}">Показати все</button>` : ""}</div></div>`).join("") : ""}
      ${l.f ? `<div class="fact"><span style="font-size:24px">⚛️</span><div><b>Цікаво знати.</b> ${esc(l.f)}</div></div>` : ""}
      <section class="quiz" id="quiz"></section>
      <div class="pager">${pv ? `<a href="#L${pv.n}"><small>← Урок ${pv.n}</small>${esc(pv.t)}</a>` : ""}${nx ? `<a class="next" href="#L${nx.n}"><small>Урок ${nx.n} →</small>${esc(nx.t)}</a>` : ""}</div>
    </div><aside class="side">
      ${(l.terms || []).length ? `<div class="panel"><h3>Ключові поняття <button class="small" id="hideT" type="button">Сховати</button></h3>${l.terms.map(t => `<button class="term" type="button"><b>${esc(t[0])}</b><span>${esc(t[1])}</span></button>`).join("")}</div>` : ""}
      ${(l.pr || []).length ? `<div class="panel"><h3>Завдання вдома</h3><ol class="tasks">${l.pr.map(x => `<li>${esc(x)}</li>`).join("")}</ol></div>` : ""}
      <div class="panel toc"><h3>Розділ ${s.i + 1}</h3>${s.lessons.map(x => `<a href="#L${x.n}" ${x === l ? 'aria-current="true"' : ""}><span class="n">${x.n}</span><span>${TY[x.type][1]} ${esc(x.t)}</span></a>`).join("")}</div>
    </aside></div></div>`;
  // задачі покроково
  document.querySelectorAll("[data-next]").forEach(b => b.onclick = () => { const ol = document.querySelector(`[data-ex="${b.dataset.next}"]`); const h = ol.querySelector("li[hidden]"); if (h) h.hidden = false; if (!ol.querySelector("li[hidden]")) b.remove(); });
  document.querySelectorAll("[data-all]").forEach(b => b.onclick = () => { const k = b.dataset.all; document.querySelectorAll(`[data-ex="${k}"] li`).forEach(x => x.hidden = false); const n = document.querySelector(`[data-next="${k}"]`); if (n) n.remove(); b.remove(); });
  // протокол
  document.querySelectorAll("[data-c]").forEach(c => c.onchange = () => { labState.c[c.dataset.c] = c.checked; st.set(labKey, labState); });
  document.querySelectorAll("[data-t]").forEach(c => c.oninput = () => { labState.t[c.dataset.t] = c.value; st.set(labKey, labState); });
  // поняття
  const T = [...document.querySelectorAll(".term")]; T.forEach(t => t.onclick = () => t.classList.toggle("closed"));
  const h = document.getElementById("hideT"); if (h) h.onclick = () => { const c = !T[0].classList.contains("closed"); T.forEach(t => t.classList.toggle("closed", c)); h.textContent = c ? "Показати" : "Сховати"; };
  quiz(l); window.scrollTo(0, 0); document.title = `${l.t} · Фізика 9`;
}
function quiz(l){
  const Q = document.getElementById("quiz"), N = qn(l);
  const items = shuffle(l.qz || []).slice(0, N).map(x => ({q:x.q, why:x.why || "", opts:shuffle(x.o.map((o, j) => ({o, ok:j === x.a})))}));
  if (!items.length) { Q.remove(); return; }
  const prev = RES[l.n];
  Q.innerHTML = `<h2>✓ Перевір себе</h2><p class="sub">${prev != null ? "Найкращий результат: " + prev + " з " + items.length + ". " : ""}Оберіть одну відповідь у кожному завданні.</p>
    ${items.map((it, k) => `<div class="qi"><div class="qq">${k + 1}. ${esc(it.q)}</div><div class="opts">${it.opts.map((o, j) => `<button class="opt" type="button" data-k="${k}" data-j="${j}"><span class="let">${"АБВГ"[j]}</span><span>${esc(o.o)}</span></button>`).join("")}</div><div class="why" hidden></div></div>`).join("")}
    <div class="qb"><button class="btn" id="chk" type="button" disabled>Перевірити</button><button class="btn ghost" id="again" type="button" hidden>Ще раз</button><span class="score" id="score"></span></div>`;
  const sel = {}, B = document.getElementById("chk");
  Q.querySelectorAll(".opt").forEach(b => b.onclick = () => { if (B.dataset.done) return; const k = b.dataset.k; sel[k] = +b.dataset.j; Q.querySelectorAll(`.opt[data-k="${k}"]`).forEach(x => x.classList.toggle("sel", x === b)); B.disabled = Object.keys(sel).length < items.length; });
  B.onclick = () => { B.dataset.done = 1; B.disabled = true; let ok = 0;
    items.forEach((it, k) => { const qi = Q.querySelectorAll(".qi")[k];
      qi.querySelectorAll(".opt").forEach((x, j) => { if (it.opts[j].ok) x.classList.add("right"); else if (sel[k] === j) x.classList.add("wrong"); });
      if (it.opts[sel[k]].ok) ok++; const w = qi.querySelector(".why"); if (it.why) { w.textContent = "💬 " + it.why; w.hidden = false; } });
    RES[l.n] = Math.max(RES[l.n] || 0, ok); st.set(KEY, RES);
    document.getElementById("score").textContent = `${ok} з ${items.length}` + (ok === items.length ? " · Чудово! 🏆" : ok >= Math.ceil(items.length * .8) ? " · Добре засвоєно 👍" : " · Перечитайте конспект і спробуйте ще раз");
    document.getElementById("again").hidden = false; };
  document.getElementById("again").onclick = () => quiz(l);
}
function route(){
  const h = location.hash.slice(1);
  if (/^m\d+$/.test(h)) { if (!document.getElementById("mods")) home(); const el = document.getElementById(h); if (el) el.scrollIntoView({behavior:"smooth"}); return; }
  const m = h.match(/^L(\d+)$/); const l = m && byN(m[1]); if (l) lesson(l); else { home(); window.scrollTo(0, 0); }
}
window.addEventListener("hashchange", route);
const root = document.documentElement;
try { const t = localStorage.getItem("fiz9-theme"); if (t) root.dataset.theme = t; } catch(e) {}
document.getElementById("themeBtn").onclick = () => { const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; root.dataset.theme = dark ? "light" : "dark"; try { localStorage.setItem("fiz9-theme", root.dataset.theme); } catch(e) {} };
route();
</script>
