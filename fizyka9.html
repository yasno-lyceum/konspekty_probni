<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Фізика · 9 клас</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* «Лабораторія»: міліметровий папір, темна «приладова» шапка з хвилею, модулі-розділи з іконками, формули як картки шпаргалки, задачі з покроковим розв'язанням, лабораторні як інтерактивний протокол */
:root{
  --bg:#F4F7FB; --paper:#FFFFFF; --sunk:#EEF3F9; --ink:#0E1B2C; --muted:#5A6B80; --line:#D9E2EE; --grid:rgba(14,27,44,.05); --grid2:rgba(14,27,44,.09);
  --panel:#0E1B2C; --panel-ink:#E8F0FA;
  --s1:#D97706; --s2:#E11D48; --s3:#0891B2; --s4:#7C3AED; --s5:#059669; --s6:#475569;
  --ok:#15803D; --ok-soft:#DCFCE7; --bad:#B91C1C; --bad-soft:#FEE2E2; --warn:#B45309; --warn-soft:#FEF3C7;
  --f-d:"Space Grotesk",system-ui,sans-serif; --f-u:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --f-m:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --sh:0 1px 2px rgba(14,27,44,.05),0 10px 26px rgba(14,27,44,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A121D; --paper:#101C2B; --sunk:#152437; --ink:#E6EEF8; --muted:#97A9BF; --line:#203248; --grid:rgba(230,238,248,.035); --grid2:rgba(230,238,248,.07);
  --panel:#060C14; --s1:#FBBF24; --s2:#FB7185; --s3:#22D3EE; --s4:#A78BFA; --s5:#34D399; --s6:#94A3B8;
  --ok:#4ADE80; --ok-soft:#14321F; --bad:#FF8A8A; --bad-soft:#3A1D22; --warn:#FBBF24; --warn-soft:#3A2E12; --sh:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A121D; --paper:#101C2B; --sunk:#152437; --ink:#E6EEF8; --muted:#97A9BF; --line:#203248; --grid:rgba(230,238,248,.035); --grid2:rgba(230,238,248,.07);
  --panel:#060C14; --s1:#FBBF24; --s2:#FB7185; --s3:#22D3EE; --s4:#A78BFA; --s5:#34D399; --s6:#94A3B8;
  --ok:#4ADE80; --ok-soft:#14321F; --bad:#FF8A8A; --bad-soft:#3A1D22; --warn:#FBBF24; --warn-soft:#3A2E12; --sh:none; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.62 var(--f-u);
  background-image:linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:60px 60px,60px 60px,12px 12px,12px 12px}
a{color:inherit}
:focus-visible{outline:3px solid var(--s1);outline-offset:2px;border-radius:8px}
.wrap{max-width:1160px;margin:0 auto;padding:0 16px 70px}
.top{position:sticky;top:0;z-index:30;background:var(--panel);color:var(--panel-ink)}
.top-in{max-width:1160px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.top img{width:34px;height:34px;border-radius:9px;background:#fff}
.brand{font:700 15px var(--f-d);text-decoration:none;line-height:1.15;color:#fff}
.brand small{display:block;font:500 12px var(--f-u);opacity:.7}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border:1.5px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:999px;padding:6px 14px;font:700 14px var(--f-u);text-decoration:none;cursor:pointer;white-space:nowrap}
.pill:hover{border-color:var(--s1);color:var(--s1)}
.pill.icon{width:38px;justify-content:center;padding:6px 0}
@media (max-width:520px){.brand small{display:none}.brand{font-size:13px}.top-in{gap:8px}.pill{padding:6px 10px;font-size:13px}}
/* hero */
.hero{position:relative;margin:22px 0;border-radius:28px;background:var(--panel);color:var(--panel-ink);overflow:hidden;padding:30px clamp(18px,4vw,40px) 26px}
.hero svg.wave{position:absolute;inset:auto 0 0 0;width:100%;height:120px;opacity:.9}
.hero svg.atom{position:absolute;right:clamp(10px,5vw,60px);top:18px;width:170px;height:170px;opacity:.95}
@media (max-width:720px){.hero svg.atom{width:110px;height:110px;opacity:.35}}
.hero > div{position:relative;z-index:1}
.kick{font:700 12px var(--f-m);letter-spacing:.12em;text-transform:uppercase;color:var(--s1)}
.hero h1{font:700 clamp(36px,6vw,60px)/1 var(--f-d);margin:10px 0 10px;color:#fff}
.hero p{max-width:600px;opacity:.85;margin:0 0 16px}
.stats{display:flex;flex-wrap:wrap;gap:10px;padding-bottom:70px}
.stat{border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:8px 12px;font:600 13px var(--f-u)}
.stat b{font:700 20px var(--f-m);color:#fff;margin-right:4px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.search{flex:1 1 100%;min-width:230px;padding:12px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);font:16px var(--f-u)}
.f{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 12px;font:700 13px var(--f-u);cursor:pointer}
.f[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* модулі */
.mods{display:grid;gap:18px}
.mod{background:var(--paper);border:1px solid var(--line);border-radius:24px;box-shadow:var(--sh);overflow:hidden;scroll-margin-top:70px}
.mod-h{display:flex;gap:16px;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,color-mix(in srgb,var(--k) 12%,transparent),transparent 70%)}
.mod-h .ic{flex:none;width:58px;height:58px;border-radius:16px;background:var(--k);display:grid;place-items:center}
.mod-h .ic svg{width:34px;height:34px}
.mod-h small{font:700 12px var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--k)}
.mod-h h2{font:700 clamp(20px,2.6vw,26px)/1.15 var(--f-d);margin:2px 0 0}
.mod-h .cnt{margin-left:auto;font:700 13px var(--f-m);color:var(--muted);white-space:nowrap}
.mod-h .bar{height:5px;background:var(--sunk);border-radius:5px;margin-top:8px;overflow:hidden;max-width:320px}
.mod-h .bar i{display:block;height:100%;background:var(--k)}
@media (max-width:560px){.mod-h .cnt{display:none}}
.rows{list-style:none;margin:0;padding:6px}
.rows a{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;text-decoration:none}
.rows a:hover{background:var(--sunk)}
.rows .n{font:700 13px var(--f-m);color:var(--muted);text-align:right}
.rows .tt{font-weight:600;line-height:1.3}
.tb{display:inline-flex;gap:5px;align-items:center;font:700 11px var(--f-u);letter-spacing:.03em;text-transform:uppercase;border-radius:999px;padding:3px 9px;white-space:nowrap;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.rows .ok{color:var(--ok);font-weight:800;margin-left:6px}
@media (max-width:560px){.rows a{grid-template-columns:32px 1fr}.rows .tb{grid-column:2;justify-self:start}}
.empty{text-align:center;color:var(--muted);padding:30px}
/* урок */
.crumb{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 12px;font-weight:700;font-size:14px;color:var(--muted)}
.crumb a{color:var(--k);text-decoration:none}
.lhead{position:relative;border-radius:24px;background:var(--panel);color:var(--panel-ink);padding:26px clamp(18px,4vw,36px) 22px;overflow:hidden}
.lhead::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--k)}
.lhead .ic{position:absolute;right:20px;top:20px;width:74px;height:74px;border-radius:20px;background:var(--k);display:grid;place-items:center;opacity:.95}
.lhead .ic svg{width:44px;height:44px}
.lhead .tn{font:700 12px var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--k);filter:brightness(1.25)}
.lhead h1{font:700 clamp(24px,3.6vw,38px)/1.12 var(--f-d);margin:8px 90px 12px 0;color:#fff;text-wrap:balance}
@media (max-width:560px){.lhead .ic{display:none}.lhead h1{margin-right:0}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:3px 11px;font-weight:600;font-size:13px}
.goal{margin-top:14px;background:rgba(255,255,255,.07);border-radius:12px;padding:10px 14px}
.lgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;margin-top:18px;align-items:start}
@media (max-width:940px){.lgrid{grid-template-columns:minmax(0,1fr)}.side{position:static!important}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px clamp(16px,3vw,26px);margin-bottom:14px;box-shadow:var(--sh)}
.card h2{font:700 20px/1.25 var(--f-d);margin:0 0 8px;display:flex;align-items:center;gap:10px}
.card h2 .no{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--k);color:var(--k);display:grid;place-items:center;font:700 13px var(--f-m)}
.card p{margin:0 0 10px;max-width:72ch}
.card ul,.card ol{margin:0;padding-left:20px}
.card li{margin:4px 0}
.card li::marker{color:var(--k)}
.sec-t{font:700 13px var(--f-m);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 4px 10px;display:flex;align-items:center;gap:8px}
.sec-t::after{content:"";flex:1;height:1px;background:var(--line)}
/* формули */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:6px}
.fm{background:var(--panel);color:#fff;border-radius:16px;padding:14px 16px;position:relative;overflow:hidden}
.fm::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--k)}
.fm code{display:block;font:700 18px/1.35 var(--f-m);color:#fff;white-space:pre-wrap;word-break:break-word}
.fm span{display:block;margin-top:6px;font-size:13.5px;color:#B8C7DA;line-height:1.45}
/* задачі */
.ex{border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px;background:var(--paper)}
.ex .q{font-weight:700;margin-bottom:8px;display:flex;gap:10px}
.ex .q b{flex:none;font:700 13px var(--f-m);color:#fff;background:var(--k);border-radius:8px;padding:2px 8px;height:fit-content}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.steps li{font:500 14.5px/1.5 var(--f-m);background:var(--sunk);border-radius:10px;padding:8px 12px;border-left:3px solid var(--k)}
.btn{border:0;border-radius:12px;padding:10px 16px;font:700 14px var(--f-u);cursor:pointer;background:var(--k);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13px}
.exb{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
/* лабораторна */
.lab{border:2px solid var(--k);border-radius:22px;background:var(--paper);overflow:hidden;margin-bottom:14px;box-shadow:var(--sh)}
.lab-h{background:var(--k);color:#fff;padding:12px 18px;font:700 16px var(--f-d);display:flex;gap:10px;align-items:center}
.lab-b{padding:16px clamp(14px,3vw,22px)}
.lab-b h3{font:700 13px var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--k);margin:14px 0 8px}
.lab-b h3:first-child{margin-top:0}
.equip{display:flex;flex-wrap:wrap;gap:6px}
.equip span{border:1.5px solid var(--line);border-radius:999px;padding:4px 10px;font-size:14px;font-weight:600}
.warn{background:var(--warn-soft);border-left:4px solid var(--warn);border-radius:12px;padding:10px 14px}
.warn ul{margin:4px 0 0;padding-left:18px}
.chk{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.chk label{display:flex;gap:10px;align-items:flex-start;background:var(--sunk);border-radius:12px;padding:9px 12px;cursor:pointer}
.chk input{width:18px;height:18px;margin-top:2px;accent-color:var(--k);flex:none}
.chk input:checked + span{text-decoration:line-through;color:var(--muted)}
.tblw{overflow-x:auto}
table.prot{border-collapse:collapse;width:100%;font-size:14px;min-width:420px}
.prot th,.prot td{border:1px solid var(--line);padding:6px 8px;text-align:center}
.prot th{background:var(--sunk);font-weight:700}
.prot td input{width:100%;min-width:60px;border:0;background:transparent;font:500 14px var(--f-m);color:var(--ink);text-align:center}
.prot td input:focus{outline:2px solid var(--k);border-radius:4px}
/* сайдбар */
.side{position:sticky;top:70px;display:grid;gap:14px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--sh)}
.panel h3{font:700 12px var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.small{border:0;background:none;color:var(--k);font:700 12px var(--f-u);cursor:pointer;padding:0;text-transform:none;letter-spacing:0}
.term{display:block;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:12px;padding:9px 11px;background:var(--paper);font:inherit;color:inherit;cursor:pointer;margin-bottom:7px}
.term b{display:block;color:var(--k);font-weight:800;line-height:1.25}
.term span{display:block;font-size:14px;color:var(--muted);line-height:1.4;margin-top:2px}
.term.closed span{filter:blur(5px);user-select:none}
.tasks{margin:0;padding-left:20px;font-size:15px}
.tasks li{margin:6px 0}
.toc a{display:flex;gap:8px;text-decoration:none;font-size:14px;line-height:1.3;padding:6px 8px;border-radius:10px}
.toc a:hover{background:var(--sunk)}
.toc a[aria-current="true"]{background:var(--k);color:#fff}
.toc a .n{font:700 12px var(--f-m);width:26px;flex:none;opacity:.75;padding-top:2px}
.fact{display:flex;gap:12px;background:color-mix(in srgb,var(--k) 10%,var(--paper));border:1.5px dashed var(--k);border-radius:18px;padding:14px 16px;margin-bottom:14px}
/* тест */
.quiz{background:var(--paper);border:1px solid var(--line);border-top:6px solid var(--k);border-radius:22px;padding:20px clamp(16px,3vw,26px);box-shadow:var(--sh)}
.quiz h2{font:700 22px var(--f-d);margin:0}
.quiz .sub{color:var(--muted);margin:2px 0 10px}
.qi{padding:14px 0;border-bottom:1px dashed var(--line)}
.qi .qq{font-weight:700;margin-bottom:8px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer;background:var(--paper);font:inherit;color:inherit;text-align:left}
.opt:hover{border-color:var(--k)}
.opt .let{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--sunk);font:700 13px var(--f-m)}
.opt.sel{border-color:var(--k)}
.opt.sel .let{background:var(--k);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.why{margin-top:6px;font-size:14px;color:var(--muted)}
.qb{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.score{font:700 17px var(--f-d)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.pager a{text-decoration:none;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
.pager a:hover{border-color:var(--k)}
.pager small{display:block;font:700 12px var(--f-m);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pager .next{grid-column:2;text-align:right}
@media (max-width:560px){.pager{grid-template-columns:1fr}.pager .next{grid-column:1}}
.foot{text-align:center;color:var(--muted);font-size:13.5px;margin-top:30px}
@media (prefers-reduced-motion:no-preference){.hero .wv{animation:sh 9s linear infinite}@keyframes sh{to{transform:translateX(-200px)}}.atom .e{transform-origin:50px 50px;animation:rot 12s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}}
</style>
</head>

<script>
const SECS = [{"title": "Електричний струм у різних середовищах", "lessons": [{"n": "1", "type": "theory", "t": "Електричний струм у металах. Залежність електричного опору металу від температури, температурний коефіцієнт опору. Явище надпровідності", "gr": "ГР2", "g": "З’ясувати, що являє собою струм у металах, чому опір металу зростає під час нагрівання, і познайомитися з явищем надпровідності.", "blocks": [{"h": "Що таке електричний струм у металах", "p": ["Метал складається з кристалічної ґратки, у вузлах якої коливаються позитивні йони, а між ними хаотично рухаються вільні електрони — «електронний газ». Коли до провідника прикладають напругу, всередині виникає електричне поле, і вільні електрони, не припиняючи хаотичного руху, починають повільно дрейфувати в одному напрямку. Це і є електричний струм у металах.", "Швидкість упорядкованого руху електронів дуже мала — частки міліметра за секунду. Проте лампа загоряється одразу після вмикання вимикача, бо електричне поле поширюється вздовж дроту майже зі швидкістю світла і змушує рухатися електрони одразу в усьому колі."], "ul": ["Носії струму в металах — вільні електрони.", "Йони ґратки залишаються на місці, тому під час проходження струму речовина металу не переноситься.", "За напрям струму умовно беруть напрям руху позитивних зарядів — від «+» до «−», тобто протилежно до руху електронів.", "Те, що струм у металах створюють саме електрони, довели досліди Толмена і Стюарта (1916 р.)."]}, {"h": "Чому метал чинить опір струму", "p": ["Рухаючись, електрони постійно зіштовхуються з йонами ґратки, що коливаються, і з дефектами кристала, передаючи їм частину енергії. Саме тому провідник зі струмом нагрівається, а сам провідник має електричний опір.", "Під час нагрівання йони коливаються інтенсивніше, зіткнень стає більше — і опір металу зростає. Кількість вільних електронів у металі при цьому майже не змінюється."], "ul": ["Опір провідника залежить від матеріалу, довжини і площі перерізу: R = ρl/S.", "Опір металів зростає з підвищенням температури.", "Холодна нитка розжарення лампи має опір приблизно в 10–15 разів менший, ніж розжарена.", "Тому лампи розжарення найчастіше перегорають саме в момент вмикання — через великий початковий струм."]}, {"h": "Температурний коефіцієнт опору", "p": ["Для невеликих (порівняно з температурою плавлення) змін температури опір металу зростає майже лінійно: R = R₀(1 + αΔt). Тут R₀ — опір за 0 °C, а α — температурний коефіцієнт опору. Він показує, на яку частину від початкового значення змінюється опір провідника під час нагрівання на 1 К (1 °C).", "Для чистих металів α ≈ 4·10⁻³ К⁻¹: мідь — 4,3·10⁻³ К⁻¹, вольфрам — близько 4,8·10⁻³ К⁻¹. У спеціальних сплавів (константан, манганін) α у сотні разів менший, тому з них виготовляють еталонні резистори, опір яких майже не залежить від температури."], "ul": ["Одиниця α — К⁻¹ (або °C⁻¹, це те саме, бо 1 К = 1 °C для зміни температури).", "Залежність R(t) для металу на графіку — майже пряма лінія.", "На цій залежності працює термометр опору (наприклад, платиновий).", "У побутових нагрівниках використовують ніхром — сплав із великим питомим опором і малим α."]}, {"h": "Надпровідність", "p": ["У 1911 р. нідерландський фізик Гейке Камерлінг-Оннес, охолоджуючи ртуть рідким гелієм, виявив, що за температури близько 4,2 К (≈ −269 °C) її опір стрибком зникає. Це явище назвали надпровідністю, а температуру, за якої воно настає, — критичною.", "У надпровідному кільці струм може циркулювати роками без джерела, бо енергія не витрачається на нагрівання. У 1986 р. відкрили високотемпературні надпровідники — керамічні сполуки, які переходять у надпровідний стан за температур, вищих за температуру кипіння рідкого азоту (77 К). Це значно здешевило їхнє використання."], "ul": ["Опір надпровідника в надпровідному стані дорівнює нулю.", "Надпровідні магніти працюють в апаратах МРТ (магнітно-резонансної томографії).", "Надпровідні магніти утримують пучки частинок у Великому адронному колайдері.", "Надпровідність використовують у потягах на магнітній подушці та в чутливих вимірювальних приладах.", "Головна перешкода для широкого застосування — потреба в сильному охолодженні."]}], "formulas": [{"f": "R = R₀(1 + αΔt)", "d": "R — опір за температури t, R₀ — опір за 0 °C, α — температурний коефіцієнт опору, Δt — зміна температури (від 0 °C)"}, {"f": "α = (R − R₀)/(R₀Δt)", "d": "температурний коефіцієнт опору, К⁻¹"}, {"f": "ρ = ρ₀(1 + αΔt)", "d": "так само від температури залежить питомий опір металу ρ"}, {"f": "R = ρl/S", "d": "ρ — питомий опір, l — довжина провідника, S — площа поперечного перерізу"}, {"f": "I = U/R", "d": "закон Ома для ділянки кола: I — сила струму, U — напруга, R — опір"}], "terms": [["Електричний струм у металах", "упорядкований (напрямлений) рух вільних електронів під дією електричного поля."], ["Кристалічна ґратка", "упорядковане розташування йонів (атомів) у твердому тілі."], ["Температурний коефіцієнт опору", "фізична величина, що показує, на яку частину від початкового значення змінюється опір провідника під час нагрівання на 1 К."], ["Термометр опору", "прилад для вимірювання температури за зміною електричного опору металевого провідника."], ["Надпровідність", "явище зникнення електричного опору речовини під час її охолодження нижче від критичної температури."], ["Критична температура", "температура, нижче від якої речовина переходить у надпровідний стан."]], "examples": [{"q": "Опір мідного дроту за 0 °C дорівнює 20 Ом. Яким буде його опір за 50 °C? Температурний коефіцієнт опору міді α = 4,3·10⁻³ К⁻¹.", "s": ["Дано: R₀ = 20 Ом; Δt = 50 °C; α = 4,3·10⁻³ К⁻¹. Знайти: R.", "Розв’язання: R = R₀(1 + αΔt) = 20 Ом · (1 + 4,3·10⁻³ К⁻¹ · 50 К) = 20 Ом · 1,215 ≈ 24,3 Ом.", "Відповідь: R ≈ 24,3 Ом."]}, {"q": "Опір котушки за 0 °C — 50 Ом, а після нагрівання — 60 Ом. До якої температури нагріли котушку, якщо α = 4·10⁻³ К⁻¹?", "s": ["Дано: R₀ = 50 Ом; R = 60 Ом; α = 4·10⁻³ К⁻¹. Знайти: t.", "Розв’язання: з R = R₀(1 + αΔt) маємо Δt = (R/R₀ − 1)/α = (60/50 − 1)/(4·10⁻³ К⁻¹) = 0,2/(0,004 К⁻¹) = 50 К. Оскільки відлік від 0 °C, t = 50 °C.", "Відповідь: t = 50 °C."]}], "lab": null, "f": "Камерлінг-Оннес першим у світі отримав рідкий гелій (1908 р.), і саме це дозволило йому через три роки відкрити надпровідність. За ці дослідження він отримав Нобелівську премію з фізики 1913 р.", "pr": ["Поясніть своїми словами, чому лампа розжарення найчастіше перегорає в момент вмикання, а не під час роботи.", "Опір алюмінієвого дроту за 0 °C становить 10 Ом. Обчисліть його опір за 100 °C, якщо α = 4,2·10⁻³ К⁻¹."], "qz": [{"q": "Що є носіями електричного струму в металах?", "o": ["Позитивні йони", "Вільні електрони", "Протони", "Негативні йони"], "a": 1, "why": "У металах струм створюють вільні електрони, а йони залишаються у вузлах ґратки."}, {"q": "Чому опір металу зростає під час нагрівання?", "o": ["Зменшується кількість вільних електронів", "Електрони втрачають заряд", "Йони ґратки коливаються сильніше, і зіткнень стає більше", "Метал перетворюється на діелектрик"], "a": 2, "why": "Інтенсивніші коливання йонів частіше гальмують електрони, тому опір зростає."}, {"q": "Яка одиниця температурного коефіцієнта опору?", "o": ["К⁻¹", "Ом·м", "Ом/К", "В/К"], "a": 0, "why": "α = ΔR/(R₀Δt), тобто Ом/(Ом·К) = К⁻¹."}, {"q": "Опір дроту за 0 °C — 10 Ом, α = 4·10⁻³ К⁻¹. Який його опір за 100 °C?", "o": ["10,4 Ом", "4 Ом", "40 Ом", "14 Ом"], "a": 3, "why": "R = 10 · (1 + 0,004 · 100) = 10 · 1,4 = 14 Ом."}, {"q": "Хто відкрив явище надпровідності?", "o": ["Майкл Фарадей", "Гейке Камерлінг-Оннес", "Георг Ом", "Алессандро Вольта"], "a": 1, "why": "Надпровідність ртуті відкрив Камерлінг-Оннес у 1911 р."}, {"q": "Чому дорівнює опір речовини в надпровідному стані?", "o": ["Нулю", "Опору за 0 °C", "Нескінченності", "Половині початкового"], "a": 0, "why": "Надпровідність — це повне зникнення електричного опору."}, {"q": "Чому еталонні резистори виготовляють з константану чи манганіну?", "o": ["Вони найдешевші", "Вони мають найменший питомий опір", "Їхній опір майже не залежить від температури", "Вони є надпровідниками за кімнатної температури"], "a": 2, "why": "У цих сплавів дуже малий температурний коефіцієнт опору."}, {"q": "Чому лампа загоряється майже одразу після вмикання, хоча електрони рухаються дуже повільно?", "o": ["Електрони насправді рухаються зі швидкістю світла", "Струм створюють йони", "Лампа світиться ще до вмикання", "Електричне поле поширюється колом майже зі швидкістю світла і рушає всі електрони одночасно"], "a": 3, "why": "Електрони є в усьому дроті, і поле приводить їх у рух майже одночасно."}]}, {"n": "2", "type": "problems", "t": "Розв’язування задач", "gr": "ГР3", "g": "Навчитися розв’язувати задачі на залежність опору металевого провідника від температури.", "blocks": [{"h": "Алгоритм розв’язування задач", "p": ["Більшість задач цього уроку зводиться до формули R = R₀(1 + αΔt). Важливо пам’ятати, що R₀ — це опір саме за 0 °C. Якщо в умові дано опір за іншої температури (наприклад, кімнатної), спочатку знайдіть R₀, а вже потім — опір за потрібної температури."], "ul": ["Запишіть «Дано» і переведіть величини в СІ (мА → А, кОм → Ом).", "Визначте, що відомо: R₀ чи опір за іншої температури.", "Запишіть потрібну формулу і, якщо треба, виразіть із неї невідому величину.", "Підставте числа з одиницями та обчисліть.", "Перевірте, чи реальна відповідь: під час нагрівання опір металу має зростати, а струм за сталої напруги — зменшуватися."]}, {"h": "Нагадування: формули теми", "p": ["Окрім формули температурної залежності, часто знадобляться закон Ома і формула потужності. Наприклад, знаючи номінальну напругу і потужність лампи, можна знайти її робочий опір: R = U²/P."], "ul": ["R = R₀(1 + αΔt) — опір за температури t.", "α = (R − R₀)/(R₀Δt) — температурний коефіцієнт опору.", "Δt = (R/R₀ − 1)/α — зміна температури.", "I = U/R — закон Ома.", "P = UI = U²/R — потужність струму."]}], "formulas": [{"f": "R = R₀(1 + αΔt)", "d": "R₀ — опір за 0 °C, α — температурний коефіцієнт опору, Δt — зміна температури"}, {"f": "α = (R − R₀)/(R₀Δt)", "d": "температурний коефіцієнт опору, К⁻¹"}, {"f": "R = ρl/S", "d": "опір провідника через питомий опір ρ, довжину l і площу перерізу S"}, {"f": "I = U/R", "d": "закон Ома для ділянки кола"}, {"f": "P = UI = U²/R", "d": "потужність електричного струму"}], "terms": [], "examples": [{"q": "Опір алюмінієвого дроту за 0 °C становить 12 Ом. Яким буде опір за 80 °C? α = 4,2·10⁻³ К⁻¹.", "s": ["Дано: R₀ = 12 Ом; Δt = 80 К; α = 4,2·10⁻³ К⁻¹. Знайти: R.", "Розв’язання: R = R₀(1 + αΔt) = 12 Ом · (1 + 4,2·10⁻³ · 80) = 12 Ом · 1,336 ≈ 16 Ом.", "Відповідь: R ≈ 16 Ом."]}, {"q": "Опір провідника за 0 °C — 25 Ом, а за 100 °C — 35 Ом. Знайдіть температурний коефіцієнт опору матеріалу.", "s": ["Дано: R₀ = 25 Ом; R = 35 Ом; Δt = 100 К. Знайти: α.", "Розв’язання: α = (R − R₀)/(R₀Δt) = (35 Ом − 25 Ом)/(25 Ом · 100 К) = 10/2500 К⁻¹ = 4·10⁻³ К⁻¹.", "Відповідь: α = 4·10⁻³ К⁻¹ (значення, близьке до міді чи алюмінію)."]}, {"q": "Лампа розжарення розрахована на напругу 220 В і потужність 100 Вт. Температура нитки під час роботи — 2500 °C. Знайдіть опір нитки за 0 °C і силу струму в момент вмикання (вважайте нитку холодною). α вольфраму = 4,8·10⁻³ К⁻¹.", "s": ["Дано: U = 220 В; P = 100 Вт; Δt = 2500 К; α = 4,8·10⁻³ К⁻¹. Знайти: R₀, I₀.", "Розв’язання: робочий опір R = U²/P = (220 В)²/100 Вт = 484 Ом.", "R₀ = R/(1 + αΔt) = 484 Ом/(1 + 4,8·10⁻³ · 2500) = 484 Ом/13 ≈ 37 Ом.", "I₀ = U/R₀ = 220 В/37 Ом ≈ 5,9 А (а робочий струм I = P/U ≈ 0,45 А — у 13 разів менший).", "Відповідь: R₀ ≈ 37 Ом; I₀ ≈ 5,9 А."]}, {"q": "Опір мідної обмотки за 20 °C дорівнює 10 Ом. Яким він стане за 70 °C? α = 4,3·10⁻³ К⁻¹.", "s": ["Дано: R₁ = 10 Ом; t₁ = 20 °C; t₂ = 70 °C; α = 4,3·10⁻³ К⁻¹. Знайти: R₂.", "Розв’язання: спочатку знайдемо опір за 0 °C: R₀ = R₁/(1 + αt₁) = 10 Ом/(1 + 4,3·10⁻³ · 20) = 10 Ом/1,086 ≈ 9,21 Ом.", "R₂ = R₀(1 + αt₂) = 9,21 Ом · (1 + 4,3·10⁻³ · 70) = 9,21 Ом · 1,301 ≈ 12,0 Ом.", "Відповідь: R₂ ≈ 12 Ом."]}, {"q": "Мідний провідник під’єднали до джерела з незмінною напругою 6 В. За 0 °C сила струму була 2 А. Якою стане сила струму, коли провідник нагріється до 100 °C? α = 4,3·10⁻³ К⁻¹.", "s": ["Дано: U = 6 В; I₀ = 2 А; Δt = 100 К; α = 4,3·10⁻³ К⁻¹. Знайти: I.", "Розв’язання: R₀ = U/I₀ = 6 В/2 А = 3 Ом.", "R = R₀(1 + αΔt) = 3 Ом · (1 + 0,43) = 4,29 Ом.", "I = U/R = 6 В/4,29 Ом ≈ 1,4 А.", "Відповідь: I ≈ 1,4 А — струм зменшився, бо опір зріс."]}], "lab": null, "f": "", "pr": ["Опір сталевого дроту за 0 °C — 5 Ом. Знайдіть його опір за 200 °C, якщо α = 6·10⁻³ К⁻¹. (11 Ом)", "Опір мідної котушки за 0 °C — 40 Ом, після нагрівання — 48,6 Ом. На скільки градусів нагріли котушку? α = 4,3·10⁻³ К⁻¹. (на 50 °C)", "Опір вольфрамової нитки за 0 °C — 30 Ом, а в робочому стані — 330 Ом. Знайдіть температуру нитки, якщо α = 5·10⁻³ К⁻¹. (2000 °C)", "Платиновий термометр опору має за 0 °C опір 100 Ом. Яку температуру він показує, якщо його опір став 139 Ом? α = 3,9·10⁻³ К⁻¹. (100 °C)"], "qz": [{"q": "Опір дроту за 0 °C — 20 Ом, α = 5·10⁻³ К⁻¹. Який опір за 100 °C?", "o": ["25 Ом", "30 Ом", "20,5 Ом", "120 Ом"], "a": 1, "why": "R = 20 · (1 + 0,005 · 100) = 20 · 1,5 = 30 Ом."}, {"q": "Опір провідника за 0 °C — 50 Ом, за 50 °C — 60 Ом. Чому дорівнює α?", "o": ["2·10⁻³ К⁻¹", "0,2 К⁻¹", "4·10⁻³ К⁻¹", "10 К⁻¹"], "a": 2, "why": "α = (60 − 50)/(50 · 50) = 10/2500 = 4·10⁻³ К⁻¹."}, {"q": "Як зміниться сила струму в металевому провіднику за сталої напруги, якщо його нагріти?", "o": ["Зменшиться", "Збільшиться", "Не зміниться", "Спочатку зросте, потім стане нулем"], "a": 0, "why": "Опір металу під час нагрівання зростає, тому за I = U/R струм зменшується."}, {"q": "Робочий опір лампи 220 В, 60 Вт приблизно дорівнює…", "o": ["3,7 Ом", "60 Ом", "13 200 Ом", "807 Ом"], "a": 3, "why": "R = U²/P = 48 400/60 ≈ 807 Ом."}, {"q": "У формулі R = R₀(1 + αΔt) величина R₀ — це опір…", "o": ["за кімнатної температури", "за 0 °C", "за температури плавлення", "у надпровідному стані"], "a": 1, "why": "R₀ — опір провідника за 0 °C."}, {"q": "На скільки градусів нагріли провідник, якщо його опір зріс від 10 Ом до 12 Ом, а α = 4·10⁻³ К⁻¹?", "o": ["50 °C", "20 °C", "5 °C", "200 °C"], "a": 0, "why": "Δt = (12/10 − 1)/0,004 = 0,2/0,004 = 50 °C."}, {"q": "Опір якого провідника найменше зміниться під час нагрівання на 100 °C?", "o": ["Мідного", "Алюмінієвого", "Вольфрамового", "Константанового"], "a": 3, "why": "У константану температурний коефіцієнт опору найменший."}, {"q": "Опір дроту за 0 °C — 4 Ом, α = 4·10⁻³ К⁻¹. Яка сила струму за 250 °C при напрузі 8 В?", "o": ["2 А", "0,5 А", "1 А", "4 А"], "a": 2, "why": "R = 4 · (1 + 0,004 · 250) = 8 Ом; I = 8 В/8 Ом = 1 А."}]}, {"n": "3", "type": "lab", "t": "Лабораторна робота № 1 «Дослідження залежності електричного опору металевого провідника від температури»", "gr": "ГР1", "g": "Експериментально дослідити, як змінюється опір металевого провідника під час нагрівання, і визначити його температурний коефіцієнт опору.", "blocks": [{"h": "Теорія до роботи", "p": ["Під час нагрівання металу йони кристалічної ґратки коливаються інтенсивніше, тому вільні електрони частіше з ними зіштовхуються, і опір зростає. Для невеликих змін температури ця залежність лінійна: R = R₀(1 + αt), де t — температура в градусах Цельсія.", "Якщо виміряти опір R₁ за температури t₁ і R₂ за t₂, то, розв’язавши систему двох рівнянь, отримаємо α = (R₂ − R₁)/(R₁t₂ − R₂t₁). Для міді очікуємо α ≈ 4,3·10⁻³ К⁻¹."], "ul": ["Для досліду потрібен провідник із помітним опором — котушка з тонкого довгого мідного дроту в лаковій ізоляції (десятки ом).", "Опір можна виміряти мультиметром у режимі омметра або обчислити за R = U/I.", "Перед кожним вимірюванням треба зачекати, щоб котушка набула температури води.", "Графік R(t) має бути майже прямою лінією; продовживши його до t = 0 °C, отримаємо R₀."]}, {"h": "Як виконати роботу дистанційно", "p": ["Цю роботу можна безпечно виконати вдома, якщо є мультиметр: котушку з мідного дроту (наприклад, обмотку зі старого трансформатора чи дріт, намотаний на олівець) занурюють у воду різної температури. Гарячу воду з чайника наливає дорослий. Жодних приладів, увімкнених у мережу 220 В, у воду не занурюють."], "ul": ["Вдома: мультиметр, котушка мідного дроту, склянка, кухонний термометр, гаряча й холодна вода.", "Нагрівати воду електроприладами в процесі досліду не можна — лише доливати гарячу воду.", "Якщо мультиметра немає — опрацюйте дані, які надасть учитель, або віртуальну лабораторію.", "Звіт оформіть у зошиті й надішліть фото вчителеві."]}], "formulas": [{"f": "R = R₀(1 + αt)", "d": "R₀ — опір за 0 °C, α — температурний коефіцієнт опору, t — температура, °C"}, {"f": "α = (R₂ − R₁)/(R₁t₂ − R₂t₁)", "d": "α за двома вимірюваннями: R₁ за t₁ і R₂ за t₂"}, {"f": "α ≈ (R₂ − R₁)/(R₁(t₂ − t₁))", "d": "наближена формула (похибка невелика, якщо t₁ близька до 0–20 °C)"}, {"f": "R = U/I", "d": "обчислення опору за показами вольтметра й амперметра"}, {"f": "ε = |α − α_табл|/α_табл · 100 %", "d": "відносна похибка вимірювання"}], "terms": [["Температурний коефіцієнт опору", "величина, що показує, на яку частину від R₀ змінюється опір провідника під час нагрівання на 1 К."], ["Омметр", "прилад для вимірювання електричного опору."], ["Мультиметр", "комбінований вимірювальний прилад, що працює як вольтметр, амперметр і омметр."], ["Відносна похибка", "відношення відхилення виміряного значення від точного до точного значення, виражене у відсотках."]], "examples": [], "lab": {"goal": "Дослідити залежність опору металевого (мідного) провідника від температури та визначити температурний коефіцієнт опору міді.", "equip": ["Котушка з тонкого мідного дроту в лаковій ізоляції", "Посудина з водою (склянка або калориметр)", "Термометр (0–100 °C)", "Мультиметр (омметр) або джерело струму, амперметр і вольтметр", "Холодна і гаряча вода", "З’єднувальні проводи"], "safety": ["Гарячу воду наливає вчитель або дорослий; працюйте обережно, щоб не обпектися.", "Не занурюйте у воду прилади, увімкнені в мережу 220 В.", "Мультиметр у режимі омметра не під’єднуйте до джерела струму.", "Кінці дроту мають бути над водою, а ізоляція котушки — непошкодженою.", "Скляний термометр не використовуйте для перемішування води."], "steps": ["Зачистіть кінці дроту котушки й під’єднайте їх до мультиметра (режим вимірювання опору).", "Занурте котушку і термометр у холодну воду, зачекайте 1–2 хв.", "Запишіть температуру t₁ і опір R₁ у таблицю.", "Долийте трохи гарячої води, перемішайте, зачекайте 1–2 хв і запишіть нові t і R.", "Повторіть попередній крок ще 4–5 разів, доводячи температуру приблизно до 70–80 °C.", "Побудуйте графік залежності R від t і продовжте його до перетину з віссю R (t = 0 °C), щоб знайти R₀.", "Обчисліть α для кількох пар вимірювань і знайдіть середнє значення.", "Порівняйте результат із табличним значенням для міді та обчисліть відносну похибку."], "calc": ["α = (R₂ − R₁)/(R₁t₂ − R₂t₁) для кожної пари вимірювань.", "α_сер = (α₁ + α₂ + … + αₙ)/n.", "ε = |α_сер − α_табл|/α_табл · 100 %, де α_табл = 4,3·10⁻³ К⁻¹."], "table": ["№ досліду", "Температура t, °C", "Опір R, Ом", "α, К⁻¹"], "sample": "Графік R(t) для міді має вийти майже прямою лінією; під час нагрівання від кімнатної температури до 80 °C опір зростає приблизно на 15–20 %, а обчислене значення α — близько 4·10⁻³ К⁻¹.", "questions": ["Чому опір металу зростає з підвищенням температури?", "Чому перед вимірюванням треба зачекати 1–2 хвилини після доливання гарячої води?", "Що показує нахил графіка R(t)?", "Чому для досліду беруть тонкий довгий дріт, а не товстий короткий?", "Які причини могли спричинити похибку вашого результату?"]}, "f": "", "pr": ["Оформіть звіт: мета, обладнання, таблиця результатів, графік R(t), обчислення α, відносна похибка, висновок.", "Якщо обладнання немає, опрацюйте віртуальну лабораторію PhET «Опір дроту»: дослідіть, як опір залежить від питомого опору, довжини й площі перерізу, і поясніть, чому під час нагрівання змінюється саме питомий опір ρ."], "qz": [{"q": "Як залежить опір металевого провідника від температури?", "o": ["Зменшується з нагріванням", "Не залежить", "Зростає з нагріванням", "Спочатку зростає, потім зменшується"], "a": 2, "why": "З нагріванням коливання йонів посилюються, і опір металу зростає."}, {"q": "Який вигляд має графік R(t) для металу в досліді?", "o": ["Майже пряма лінія, що піднімається", "Горизонтальна пряма", "Гіпербола", "Пряма, що опускається"], "a": 0, "why": "Залежність R = R₀(1 + αt) лінійна, і опір зростає."}, {"q": "Чому для досліду беруть котушку з тонкого довгого дроту?", "o": ["Вона легша", "Її опір більший, тому зміни опору легше виміряти", "Вона не нагрівається", "Вона краще проводить струм"], "a": 1, "why": "R = ρl/S: тонкий довгий дріт має більший опір, і його зміну помітно на приладі."}, {"q": "R₁ = 20 Ом за 0 °C, R₂ = 24 Ом за 50 °C. Чому дорівнює α?", "o": ["2·10⁻³ К⁻¹", "8·10⁻³ К⁻¹", "0,4 К⁻¹", "4·10⁻³ К⁻¹"], "a": 3, "why": "α = (24 − 20)/(20 · 50) = 4/1000 = 4·10⁻³ К⁻¹."}, {"q": "Що з наведеного НЕ можна робити під час досліду вдома?", "o": ["Доливати гарячу воду з чайника за допомогою дорослого", "Занурювати у воду прилад, увімкнений у мережу 220 В", "Вимірювати опір мультиметром", "Перемішувати воду ложкою"], "a": 1, "why": "Електроприлад у воді — небезпека ураження струмом."}, {"q": "Як знайти R₀ за графіком R(t)?", "o": ["Продовжити графік до перетину з віссю R (t = 0 °C)", "Узяти найбільше значення R", "Поділити R на t", "Узяти середнє всіх R"], "a": 0, "why": "R₀ — опір за 0 °C, тобто точка графіка при t = 0."}]}, {"n": "4", "type": "theory", "t": "Електричний струм в електролітах. Електроліз. Перший закон Фарадея", "gr": "ГР2", "g": "З’ясувати природу електричного струму в електролітах, суть електролізу та навчитися обчислювати масу речовини, що виділяється на електроді.", "blocks": [{"h": "Електроліти та електролітична дисоціація", "p": ["Дистильована вода і сухі кристали кухонної солі майже не проводять струм. Але якщо розчинити сіль у воді, розчин стає провідником. Речовини, розчини або розплави яких проводять струм, називають електролітами: це розчини солей, кислот і лугів.", "Молекули води послаблюють зв’язки між йонами речовини, і та розпадається на позитивні йони (катіони) та негативні йони (аніони). Цей процес називають електролітичною дисоціацією. Одночасно частина йонів, зустрічаючись, знову з’єднується — відбувається рекомбінація."], "ul": ["Носії струму в електролітах — позитивні й негативні йони.", "Приклад: CuSO₄ → Cu²⁺ + SO₄²⁻.", "Із підвищенням температури дисоціація посилюється, тому опір електроліту зменшується (на відміну від металів).", "Чиста (дистильована) вода — поганий провідник, але звичайна вода з домішками солей проводить струм, тому з мокрими руками до електроприладів не торкаються."]}, {"h": "Електроліз", "p": ["Якщо в розчин електроліту занурити два електроди й під’єднати їх до джерела постійного струму, катіони рухатимуться до катода (−), а аніони — до анода (+). Біля електродів йони віддають або приєднують електрони і перетворюються на нейтральні атоми чи молекули. Тому під час проходження струму на електродах виділяється речовина.", "Наприклад, під час електролізу розчину мідного купоросу з мідними електродами на катоді осідає чиста мідь, а мідний анод поступово розчиняється. На відміну від металів, струм в електролітах супроводжується перенесенням речовини."], "ul": ["Електроліз — виділення речовини на електродах під час проходження струму через електроліт.", "Катод — електрод, з’єднаний з негативним полюсом джерела; до нього рухаються катіони.", "Анод — електрод, з’єднаний з позитивним полюсом; до нього рухаються аніони.", "Метали й водень завжди виділяються на катоді.", "Посудину з електролітом та електродами називають електролітичною ванною."]}, {"h": "Перший закон Фарадея", "p": ["У 1833 р. Майкл Фарадей експериментально встановив: маса речовини, що виділяється на електроді, прямо пропорційна заряду, який пройшов через електроліт: m = kq = kIt.", "Коефіцієнт k називають електрохімічним еквівалентом речовини. Він показує, яка маса речовини виділяється на електроді, коли через електроліт проходить заряд 1 Кл. Одиниця k — кг/Кл. Його значення беруть із таблиці: для міді (Cu²⁺) k ≈ 0,33·10⁻⁶ кг/Кл, для срібла — 1,118·10⁻⁶ кг/Кл, для нікелю — 0,30·10⁻⁶ кг/Кл, для цинку — 0,34·10⁻⁶ кг/Кл."], "ul": ["Що більший струм і довший час — то більше речовини виділяється.", "k залежить лише від виду речовини (і заряду її йона).", "k = m₀/q₀, де m₀ — маса одного йона, q₀ — його заряд.", "Для допитливих: другий закон Фарадея пов’язує k з молярною масою M і валентністю n: k = M/(Fn), де F ≈ 96 500 Кл/моль — стала Фарадея."]}], "formulas": [{"f": "m = kIt", "d": "перший закон Фарадея: m — маса речовини, k — електрохімічний еквівалент, I — сила струму, t — час"}, {"f": "m = kq", "d": "q = It — заряд, що пройшов через електроліт"}, {"f": "k = m₀/q₀", "d": "m₀ — маса йона, q₀ — заряд йона"}, {"f": "k = M/(Fn)", "d": "M — молярна маса, n — валентність, F ≈ 96 500 Кл/моль — стала Фарадея"}], "terms": [["Електроліт", "речовина, розчин або розплав якої проводить електричний струм завдяки йонам."], ["Електролітична дисоціація", "розпад молекул речовини на йони під дією розчинника."], ["Рекомбінація", "з’єднання позитивних і негативних йонів у нейтральні молекули."], ["Електроліз", "процес виділення речовини на електродах під час проходження струму через електроліт."], ["Катод", "електрод, з’єднаний з негативним полюсом джерела струму."], ["Анод", "електрод, з’єднаний з позитивним полюсом джерела струму."], ["Електрохімічний еквівалент", "величина, що дорівнює масі речовини, яка виділяється на електроді під час проходження через електроліт заряду 1 Кл."]], "examples": [{"q": "Яка маса міді виділиться на катоді за 1 год, якщо сила струму 2 А? k = 0,33·10⁻⁶ кг/Кл.", "s": ["Дано: I = 2 А; t = 1 год; k = 0,33·10⁻⁶ кг/Кл. Знайти: m.", "СІ: t = 3600 с.", "Розв’язання: m = kIt = 0,33·10⁻⁶ кг/Кл · 2 А · 3600 с ≈ 2,4·10⁻³ кг.", "Відповідь: m ≈ 2,4 г."]}, {"q": "Скільки часу триває сріблення, якщо за сили струму 0,5 А на виробі осіло 0,56 г срібла? k = 1,118·10⁻⁶ кг/Кл.", "s": ["Дано: m = 0,56 г; I = 0,5 А; k = 1,118·10⁻⁶ кг/Кл. Знайти: t.", "СІ: m = 0,56·10⁻³ кг.", "Розв’язання: t = m/(kI) = 0,56·10⁻³ кг/(1,118·10⁻⁶ кг/Кл · 0,5 А) ≈ 1000 с.", "Відповідь: t ≈ 1000 с ≈ 17 хв."]}], "lab": null, "f": "Слова «електроліт», «електрод», «анод», «катод», «йон» запровадив у науку Майкл Фарадей разом із філологом Вільямом Г’юеллом. «Йон» грецькою означає «той, що йде», «анод» — «шлях угору», «катод» — «шлях униз».", "pr": ["Поясніть, чим відрізняється струм в електролітах від струму в металах (носії, перенесення речовини, залежність опору від температури).", "Яка маса нікелю виділиться на катоді за 30 хв за сили струму 1 А? k = 0,30·10⁻⁶ кг/Кл."], "qz": [{"q": "Що є носіями струму в електролітах?", "o": ["Тільки електрони", "Позитивні й негативні йони", "Тільки протони", "Нейтральні молекули"], "a": 1, "why": "В електролітах заряд переносять катіони й аніони."}, {"q": "До якого електрода рухаються позитивні йони?", "o": ["До анода", "До обох однаково", "До катода", "Залишаються на місці"], "a": 2, "why": "Катіони притягуються до негативного електрода — катода."}, {"q": "Як змінюється опір електроліту під час нагрівання?", "o": ["Зменшується", "Зростає", "Не змінюється", "Стає нескінченним"], "a": 0, "why": "З нагріванням посилюється дисоціація, носіїв стає більше, опір зменшується."}, {"q": "Хто встановив закони електролізу?", "o": ["Ампер", "Ерстед", "Кулон", "Фарадей"], "a": 3, "why": "Закони електролізу відкрив Майкл Фарадей у 1833 р."}, {"q": "Яка одиниця електрохімічного еквівалента?", "o": ["Кл/кг", "кг/Кл", "кг·А", "А/с"], "a": 1, "why": "k = m/q, тому одиниця — кг/Кл."}, {"q": "Яка маса речовини з k = 0,3·10⁻⁶ кг/Кл виділиться при заряді 1000 Кл?", "o": ["0,3 г", "3 г", "0,03 г", "30 г"], "a": 0, "why": "m = kq = 0,3·10⁻⁶ · 1000 = 0,3·10⁻³ кг = 0,3 г."}, {"q": "Як зміниться маса виділеної речовини, якщо силу струму збільшити вдвічі, а час зменшити вдвічі?", "o": ["Збільшиться вдвічі", "Зменшиться вдвічі", "Збільшиться вчетверо", "Не зміниться"], "a": 3, "why": "m = kIt: добуток It залишається тим самим."}, {"q": "Де виділяється мідь під час електролізу розчину CuSO₄?", "o": ["На аноді", "У розчині", "На катоді", "Не виділяється"], "a": 2, "why": "Йони Cu²⁺ рухаються до катода і там осідають як мідь."}]}, {"n": "5", "type": "problems", "t": "Розв’язування задач", "gr": "ГР3", "g": "Навчитися застосовувати перший закон Фарадея для обчислення маси речовини, сили струму, часу та електрохімічного еквівалента.", "blocks": [{"h": "Алгоритм розв’язування задач на закон Фарадея", "p": ["Основна формула уроку — m = kIt. З неї можна виразити будь-яку величину: I = m/(kt), t = m/(kI), k = m/(It). Значення k беріть із таблиці електрохімічних еквівалентів. Найчастіша помилка — забути перевести масу в кілограми, а час — у секунди."], "ul": ["Запишіть «Дано», знайдіть у таблиці k потрібної речовини.", "Переведіть у СІ: г → кг (·10⁻³), мг → кг (·10⁻⁶), хв → с (·60), год → с (·3600).", "Виразіть невідому величину з формули m = kIt.", "Якщо треба знайти товщину покриття, використайте m = ρV = ρSd.", "Якщо ванни з’єднані послідовно, сила струму і заряд через них однакові."]}, {"h": "Таблиця електрохімічних еквівалентів (для задач)", "p": ["Ці значення використовуйте в задачах уроку, якщо в умові не вказано інше."], "ul": ["Мідь (Cu²⁺): k = 0,33·10⁻⁶ кг/Кл.", "Срібло (Ag⁺): k = 1,118·10⁻⁶ кг/Кл.", "Нікель (Ni²⁺): k = 0,30·10⁻⁶ кг/Кл.", "Цинк (Zn²⁺): k = 0,34·10⁻⁶ кг/Кл.", "Хром (Cr³⁺): k = 0,18·10⁻⁶ кг/Кл.", "Алюміній (Al³⁺): k = 0,093·10⁻⁶ кг/Кл."]}], "formulas": [{"f": "m = kIt", "d": "перший закон Фарадея"}, {"f": "q = It", "d": "заряд, що пройшов через електроліт"}, {"f": "k = m₀/q₀", "d": "m₀ — маса одного йона, q₀ — заряд йона"}, {"f": "m = ρSd", "d": "маса покриття: ρ — густина металу, S — площа, d — товщина шару"}, {"f": "N = q/q₀", "d": "кількість йонів, що розрядилися на електроді"}], "terms": [], "examples": [{"q": "Яка маса нікелю виділиться на катоді за 10 хв за сили струму 3 А?", "s": ["Дано: t = 10 хв; I = 3 А; k = 0,30·10⁻⁶ кг/Кл. Знайти: m.", "СІ: t = 600 с.", "Розв’язання: m = kIt = 0,30·10⁻⁶ кг/Кл · 3 А · 600 с = 5,4·10⁻⁴ кг.", "Відповідь: m = 0,54 г."]}, {"q": "За 30 хв за сили струму 2 А на катоді виділилося 1,19 г металу. Визначте його електрохімічний еквівалент. Що це за метал?", "s": ["Дано: t = 30 хв; I = 2 А; m = 1,19 г. Знайти: k.", "СІ: t = 1800 с; m = 1,19·10⁻³ кг.", "Розв’язання: k = m/(It) = 1,19·10⁻³ кг/(2 А · 1800 с) ≈ 0,33·10⁻⁶ кг/Кл.", "За таблицею це мідь.", "Відповідь: k ≈ 0,33·10⁻⁶ кг/Кл, мідь."]}, {"q": "Під час хромування за 50 хв на деталі осіло 1,08 г хрому. Якою була сила струму?", "s": ["Дано: t = 50 хв; m = 1,08 г; k = 0,18·10⁻⁶ кг/Кл. Знайти: I.", "СІ: t = 3000 с; m = 1,08·10⁻³ кг.", "Розв’язання: I = m/(kt) = 1,08·10⁻³ кг/(0,18·10⁻⁶ кг/Кл · 3000 с) = 1,08·10⁻³/5,4·10⁻⁴ А = 2 А.", "Відповідь: I = 2 А."]}, {"q": "Пластинку площею 100 см² нікелюють протягом 1 год за сили струму 2 А. Якої товщини шар нікелю утвориться? Густина нікелю 8900 кг/м³.", "s": ["Дано: S = 100 см²; t = 1 год; I = 2 А; k = 0,30·10⁻⁶ кг/Кл; ρ = 8900 кг/м³. Знайти: d.", "СІ: S = 0,01 м²; t = 3600 с.", "Розв’язання: m = kIt = 0,30·10⁻⁶ · 2 · 3600 кг = 2,16·10⁻³ кг.", "m = ρSd ⇒ d = m/(ρS) = 2,16·10⁻³ кг/(8900 кг/м³ · 0,01 м²) ≈ 2,4·10⁻⁵ м.", "Відповідь: d ≈ 24 мкм."]}, {"q": "Який заряд треба пропустити через розчин солі срібла, щоб виділилося 1 г срібла? Скільки йонів Ag⁺ при цьому розрядиться? Заряд йона Ag⁺ дорівнює e = 1,6·10⁻¹⁹ Кл.", "s": ["Дано: m = 1 г; k = 1,118·10⁻⁶ кг/Кл; q₀ = 1,6·10⁻¹⁹ Кл. Знайти: q, N.", "СІ: m = 1·10⁻³ кг.", "Розв’язання: q = m/k = 1·10⁻³ кг/1,118·10⁻⁶ кг/Кл ≈ 894 Кл.", "N = q/q₀ = 894 Кл/1,6·10⁻¹⁹ Кл ≈ 5,6·10²¹.", "Відповідь: q ≈ 894 Кл; N ≈ 5,6·10²¹ йонів."]}], "lab": null, "f": "", "pr": ["Яка маса цинку виділиться на катоді за 2 год за сили струму 5 А? (≈ 12 г)", "Скільки часу потрібно, щоб за сили струму 1 А на катоді виділилося 0,66 г міді? (2000 с ≈ 33 хв)", "За 10 хв на катоді виділилося 0,67 г срібла. Якою була сила струму? (≈ 1 А)", "Дві електролітичні ванни з розчинами солей міді та срібла з’єднано послідовно. У першій виділилося 1 г міді. Скільки срібла виділилося в другій? (≈ 3,4 г)"], "qz": [{"q": "Яка маса міді виділиться за 1000 с за сили струму 3 А? k = 0,33·10⁻⁶ кг/Кл.", "o": ["0,33 г", "3,3 г", "0,99 г", "9,9 г"], "a": 2, "why": "m = 0,33·10⁻⁶ · 3 · 1000 = 0,99·10⁻³ кг = 0,99 г."}, {"q": "За якою формулою знаходять час електролізу?", "o": ["t = m/(kI)", "t = mkI", "t = kI/m", "t = mI/k"], "a": 0, "why": "З m = kIt випливає t = m/(kI)."}, {"q": "За 500 с при струмі 2 А виділилося 0,3 г речовини. Чому дорівнює k?", "o": ["0,6·10⁻⁶ кг/Кл", "0,15·10⁻⁶ кг/Кл", "3·10⁻⁶ кг/Кл", "0,3·10⁻⁶ кг/Кл"], "a": 3, "why": "k = m/(It) = 0,3·10⁻³/1000 = 0,3·10⁻⁶ кг/Кл."}, {"q": "Дві ванни з’єднано послідовно. Що однакове для обох ванн?", "o": ["Маса виділеної речовини", "Заряд, що пройшов через ванну", "Електрохімічний еквівалент", "Опір ванни"], "a": 1, "why": "За послідовного з’єднання струм, а отже, і заряд за той самий час однакові."}, {"q": "Якою має бути сила струму, щоб за 1000 с виділилося 1,118 г срібла? k = 1,118·10⁻⁶ кг/Кл.", "o": ["0,1 А", "10 А", "1 А", "100 А"], "a": 2, "why": "I = m/(kt) = 1,118·10⁻³/(1,118·10⁻⁶ · 1000) = 1 А."}, {"q": "Скільки секунд в 1,5 год?", "o": ["5400 с", "90 с", "150 с", "3600 с"], "a": 0, "why": "1,5 · 3600 с = 5400 с."}, {"q": "Через ванну з цинком і ванну зі сріблом пройшов однаковий заряд. Де виділилось більше металу?", "o": ["У ванні з цинком", "Однаково", "Залежить від напруги", "У ванні зі сріблом"], "a": 3, "why": "У срібла більший k (1,118·10⁻⁶ проти 0,34·10⁻⁶ кг/Кл), отже, за однакового q його маса більша."}, {"q": "Яку масу речовини переносить заряд 1 Кл, якщо k = 0,33·10⁻⁶ кг/Кл?", "o": ["0,33 г", "0,33 мг", "33 мг", "3,3 г"], "a": 1, "why": "m = kq = 0,33·10⁻⁶ кг = 0,33 мг — саме це і показує k."}]}, {"n": "6", "type": "theory", "t": "Застосування електролізу", "gr": "ГР2, ГР3", "g": "Ознайомитися з основними галузями застосування електролізу в промисловості й побуті та навчитися оцінювати потрібні для нього заряд і енергію.", "blocks": [{"h": "Гальваностегія — захисні й декоративні покриття", "p": ["Гальваностегія — нанесення електролізом тонкого шару металу на поверхню виробу. Виріб роблять катодом, а анодом — пластину з металу покриття. Так деталі захищають від корозії, роблять твердішими або гарнішими.", "Добре знайомі приклади: хромовані змішувачі й дверні ручки, нікельовані інструменти, оцинковані деталі, позолочені прикраси та контакти в електроніці. Шар покриття зазвичай має товщину від частки мікрометра до кількох десятків мікрометрів."], "ul": ["Хромування — блискучі, тверді, стійкі до зношування поверхні.", "Нікелювання — захист сталі від іржі.", "Цинкування — захист сталевих деталей і кріплень.", "Золочення і сріблення — прикраси, електричні контакти.", "Перед покриттям поверхню ретельно очищають і знежирюють, інакше шар відшаровуватиметься."]}, {"h": "Гальванопластика — точні копії", "p": ["Гальванопластика — отримання електролізом точних металевих копій рельєфних предметів. Із предмета роблять відбиток (наприклад, з воску чи гіпсу), покривають його струмопровідним шаром графіту і використовують як катод. На ньому наростає шар міді, який точно повторює всі дрібниці рельєфу.", "Метод винайшов у 1838 р. Борис Якобі. Гальванопластикою виготовляли друкарські форми, копії скульптур, медалей і монет, а також деталі складної форми."], "ul": ["Копіювання барельєфів, медалей, скульптур.", "Виготовлення матриць і друкарських форм.", "Виготовлення тонкостінних деталей складної форми.", "Метод дозволяє відтворити найдрібніші деталі поверхні."]}, {"h": "Отримання й очищення металів", "p": ["Електролізом отримують чисті метали. Під час рафінування міді анодом слугує неочищена мідь, катодом — тонка пластина чистої міді. Мідь з анода переходить у розчин і осідає на катоді, а домішки залишаються в розчині чи осаді. Так отримують мідь чистотою понад 99,9 %, потрібну для електричних проводів.", "Алюміній отримують електролізом розплаву глинозему (оксиду алюмінію) у кріоліті за температури близько 950 °C. Цей спосіб дуже енергоємний: на 1 кг алюмінію витрачають приблизно 13–15 кВт·год електроенергії."], "ul": ["Рафінування (очищення) міді, нікелю, срібла.", "Отримання алюмінію, магнію, натрію з розплавів.", "Отримання водню, кисню, хлору та лугів.", "Електрополірування — згладжування поверхні металу.", "Зарядження акумуляторів — теж хімічні процеси під дією струму."]}, {"h": "Енергія, потрібна для електролізу", "p": ["Щоб оцінити витрати енергії, поєднаємо закон Фарадея з формулою роботи струму: W = qU = UIt. Знаючи масу речовини, знаходимо заряд q = m/k, а потім — енергію W = (m/k)·U. Звідси видно: що менший k у речовини, то більше енергії треба для отримання 1 кг."], "ul": ["Заряд: q = m/k.", "Робота струму: W = qU = UIt.", "1 кВт·год = 3,6·10⁶ Дж.", "Тому алюмінієві заводи будують поблизу потужних електростанцій.", "Переробка алюмінієвого брухту потребує в рази менше енергії, ніж отримання нового металу."]}], "formulas": [{"f": "m = kIt", "d": "перший закон Фарадея"}, {"f": "W = qU = UIt", "d": "енергія (робота струму), витрачена на електроліз"}, {"f": "m = ρSd", "d": "маса шару покриття: ρ — густина металу, S — площа, d — товщина"}, {"f": "P = UI", "d": "потужність установки для електролізу"}, {"f": "1 кВт·год = 3,6·10⁶ Дж", "d": "позасистемна одиниця енергії"}], "terms": [["Гальваностегія", "нанесення методом електролізу тонкого шару металу на поверхню виробу."], ["Гальванопластика", "отримання методом електролізу точних металевих копій рельєфних предметів."], ["Рафінування", "очищення металу від домішок, зокрема методом електролізу."], ["Електрополірування", "згладжування поверхні металевого виробу, що слугує анодом під час електролізу."], ["Корозія", "руйнування металу внаслідок хімічної чи електрохімічної взаємодії з довкіллям."]], "examples": [{"q": "Оцініть енергію, потрібну для отримання 1 кг алюмінію електролізом за напруги 5 В. k = 0,093·10⁻⁶ кг/Кл.", "s": ["Дано: m = 1 кг; U = 5 В; k = 0,093·10⁻⁶ кг/Кл. Знайти: W.", "Розв’язання: q = m/k = 1 кг/0,093·10⁻⁶ кг/Кл ≈ 1,08·10⁷ Кл.", "W = qU = 1,08·10⁷ Кл · 5 В ≈ 5,4·10⁷ Дж ≈ 15 кВт·год.", "Відповідь: W ≈ 5,4·10⁷ Дж ≈ 15 кВт·год."]}, {"q": "Відбиток медалі в гальванопластичній ванні мідять 5 год за сили струму 0,8 А. Яка маса міді наросте? k = 0,33·10⁻⁶ кг/Кл.", "s": ["Дано: t = 5 год; I = 0,8 А; k = 0,33·10⁻⁶ кг/Кл. Знайти: m.", "СІ: t = 18 000 с.", "Розв’язання: m = kIt = 0,33·10⁻⁶ кг/Кл · 0,8 А · 18 000 с ≈ 4,75·10⁻³ кг.", "Відповідь: m ≈ 4,8 г."]}], "lab": null, "f": "До винайдення електролітичного способу (1886 р., Чарлз Голл і Поль Еру незалежно один від одного) алюміній був рідкісним і коштував дорожче за срібло. Після цього він став одним із найпоширеніших металів у техніці.", "pr": ["Знайдіть удома 3–4 предмети з гальванічним покриттям (хромовані, нікельовані, позолочені) і поясніть, для чого їм таке покриття.", "Скільки енергії потрібно для отримання 1 кг міді, якщо напруга на ванні 0,5 В? k = 0,33·10⁻⁶ кг/Кл."], "qz": [{"q": "Як називають нанесення електролізом тонкого шару металу на виріб?", "o": ["Гальванопластика", "Рафінування", "Гальваностегія", "Дисоціація"], "a": 2, "why": "Гальваностегія — це металеві покриття, отримані електролізом."}, {"q": "Яким електродом слугує виріб під час нікелювання?", "o": ["Катодом", "Анодом", "Будь-яким", "Він не є електродом"], "a": 0, "why": "Метал (Ni²⁺) осідає на катоді, тому виріб з’єднують з негативним полюсом."}, {"q": "Хто винайшов гальванопластику?", "o": ["Майкл Фарадей", "Алессандро Вольта", "Гейке Камерлінг-Оннес", "Борис Якобі"], "a": 3, "why": "Гальванопластику винайшов Борис Якобі в 1838 р."}, {"q": "Що відбувається з неочищеною мідною пластиною (анодом) під час рафінування міді?", "o": ["Вона товщає", "Вона поступово розчиняється", "Вона перетворюється на алюміній", "Нічого"], "a": 1, "why": "Мідь з анода переходить у розчин і осідає на катоді чистою."}, {"q": "Чому алюмінієві заводи будують біля потужних електростанцій?", "o": ["Отримання алюмінію електролізом дуже енергоємне", "Алюміній добувають із води", "Так дешевше перевозити руду", "Електростанціям потрібен алюміній"], "a": 0, "why": "На 1 кг алюмінію потрібно близько 13–15 кВт·год енергії."}, {"q": "Яка енергія витрачається, якщо через ванну за напруги 2 В пройшов заряд 1000 Кл?", "o": ["500 Дж", "2000 Дж", "1002 Дж", "0,002 Дж"], "a": 1, "why": "W = qU = 1000 Кл · 2 В = 2000 Дж."}, {"q": "Для чого перед нанесенням покриття поверхню виробу знежирюють?", "o": ["Щоб він важив менше", "Щоб збільшити струм", "Щоб змінити колір", "Щоб покриття міцно трималося"], "a": 3, "why": "На брудній поверхні шар металу відшаровується."}, {"q": "Що з переліченого НЕ є застосуванням електролізу?", "o": ["Отримання алюмінію", "Хромування деталей", "Плавлення сталі в доменній печі", "Очищення міді"], "a": 2, "why": "У доменній печі метал отримують хімічним відновленням за високої температури, без електролізу."}]}, {"n": "7", "type": "lab", "t": "Лабораторна робота № 2 «Визначення електрохімічного еквівалента речовини»", "gr": "ГР1", "g": "Експериментально визначити електрохімічний еквівалент міді, використовуючи перший закон Фарадея.", "blocks": [{"h": "Теорія до роботи", "p": ["Під час електролізу розчину мідного купоросу (CuSO₄) з мідними електродами на катоді осідає мідь. За першим законом Фарадея m = kIt. Отже, якщо зважити катод до і після досліду, виміряти силу струму та час, можна обчислити k = m/(It), де m = m₂ − m₁ — приріст маси катода.", "Табличне значення для міді: k = 0,33·10⁻⁶ кг/Кл. Щоб результат був точним, силу струму треба підтримувати сталою реостатом, а катод після досліду ретельно висушити."], "ul": ["Катод під’єднують до «−» джерела, анод — до «+».", "Силу струму підтримують сталою (наприклад, 1 А) протягом усього досліду.", "Час досліду — 15–20 хв, щоб приріст маси був помітним на терезах.", "Мокрий катод важить більше, тому перед зважуванням його обережно сушать."]}, {"h": "Як виконати роботу дистанційно", "p": ["Електроліз удома самостійно не виконують: розчин мідного купоросу токсичний, а дослід потребує лабораторного обладнання. Цю роботу виконують лише в класі з учителем. На дистанційному навчанні учні обробляють дані досліду, які надає вчитель (або з відеодемонстрації), і роблять усі обчислення та висновки самостійно."], "ul": ["Вдома електроліз не проводимо — лише теоретично або віртуально.", "Отримайте від учителя значення m₁, m₂, I і t.", "Виконайте обчислення, оцініть похибку, дайте відповіді на контрольні запитання.", "Для розуміння, як йони проводять струм, можна використати віртуальну лабораторію."]}], "formulas": [{"f": "m = kIt", "d": "перший закон Фарадея"}, {"f": "k = (m₂ − m₁)/(It)", "d": "m₁ і m₂ — маса катода до і після досліду, I — сила струму, t — час"}, {"f": "ε = |k − k_табл|/k_табл · 100 %", "d": "відносна похибка; k_табл = 0,33·10⁻⁶ кг/Кл для міді"}], "terms": [["Електрохімічний еквівалент", "маса речовини, що виділяється на електроді під час проходження через електроліт заряду 1 Кл."], ["Електролітична ванна", "посудина з електролітом і зануреними в нього електродами."], ["Реостат", "прилад для плавної зміни опору, а отже, і сили струму в колі."], ["Катод", "електрод, з’єднаний з негативним полюсом джерела, на якому виділяється метал."]], "examples": [], "lab": {"goal": "Визначити електрохімічний еквівалент міді та порівняти його з табличним значенням.", "equip": ["Електролітична ванна з розчином мідного купоросу (CuSO₄)", "Дві мідні пластини (електроди)", "Джерело постійного струму", "Амперметр", "Реостат", "Ключ", "Терези з важками (або електронні терези з точністю до 0,01 г)", "Секундомір (годинник)", "Дрібний наждачний папір, паперові серветки", "З’єднувальні проводи"], "safety": ["Роботу виконують лише в кабінеті фізики під наглядом учителя.", "Розчин мідного купоросу токсичний: не куштуйте його, уникайте потрапляння на шкіру й в очі, працюйте в рукавичках, після роботи вимийте руки.", "Коло збирайте й розбирайте лише за розімкненого ключа.", "Не торкайтеся електродів під час досліду.", "Розлитий розчин одразу повідомте вчителеві."], "steps": ["Очистіть пластину-катод наждачним папером, протріть серветкою і зважте її (m₁).", "Закріпіть електроди у ванні; катод під’єднайте до «−» джерела, анод — до «+».", "Зберіть коло: джерело, ключ, реостат, амперметр, ванна — послідовно.", "Замкніть ключ, одночасно запустіть секундомір і реостатом встановіть силу струму близько 1 А.", "Підтримуйте силу струму сталою протягом 15–20 хв.", "Розімкніть ключ, зафіксуйте час t.", "Обережно вийміть катод, промийте водою, висушіть (не стираючи осад) і зважте (m₂).", "Обчисліть k і відносну похибку, запишіть висновок."], "calc": ["Приріст маси катода: m = m₂ − m₁ (перевести в кг).", "Заряд: q = It (t — у секундах).", "k = m/(It).", "ε = |k − k_табл|/k_табл · 100 %."], "table": ["m₁, кг", "m₂, кг", "m, кг", "I, А", "t, с", "k, кг/Кл", "ε, %"], "sample": "За сили струму близько 1 А протягом 20 хв маса катода зростає приблизно на 0,4 г, а обчислене k має бути близьким до 0,33·10⁻⁶ кг/Кл.", "questions": ["Чому мідь осідає саме на катоді?", "Що відбувається з анодом під час досліду?", "Чому силу струму треба підтримувати сталою?", "Як вплине на результат, якщо зважити катод мокрим?", "Які ще чинники могли спричинити похибку?"]}, "f": "", "pr": ["Опрацюйте дані досліду: маса катода до досліду 42,15 г, після — 42,62 г, сила струму 1,2 А, час 20 хв. Обчисліть k міді, відносну похибку й оформіть звіт з висновком.", "Якщо можливо, опрацюйте віртуальну лабораторію PhET «Розчини цукру і солі»: за допомогою вбудованого вимірювача провідності поясніть, чому розчин солі проводить струм, а розчин цукру — ні."], "qz": [{"q": "Що треба виміряти, щоб визначити k?", "o": ["Напругу і опір", "Масу катода до і після досліду, силу струму і час", "Тільки силу струму", "Температуру розчину"], "a": 1, "why": "k = (m₂ − m₁)/(It)."}, {"q": "До якого полюса джерела під’єднують катод?", "o": ["До негативного", "До позитивного", "До будь-якого", "До заземлення"], "a": 0, "why": "Катод з’єднують з «−», і до нього рухаються йони Cu²⁺."}, {"q": "За 1000 с при струмі 1 А маса катода зросла на 0,33 г. Чому дорівнює k?", "o": ["0,033·10⁻⁶ кг/Кл", "3,3·10⁻⁶ кг/Кл", "0,33 кг/Кл", "0,33·10⁻⁶ кг/Кл"], "a": 3, "why": "k = 0,33·10⁻³ кг/(1 А · 1000 с) = 0,33·10⁻⁶ кг/Кл."}, {"q": "Як вплине на результат зважування мокрого катода?", "o": ["Не вплине", "k вийде меншим", "k вийде більшим, ніж насправді", "k стане від’ємним"], "a": 2, "why": "Вода додає масу, тому m і k завищуються."}, {"q": "Чому цей дослід не виконують удома самостійно?", "o": ["Розчин мідного купоросу токсичний і потрібне лабораторне обладнання", "Мідь удома не осідає", "Дослід триває кілька діб", "Потрібна напруга 220 В"], "a": 0, "why": "Електроліз виконують лише з учителем у кабінеті фізики."}, {"q": "Для чого в колі реостат?", "o": ["Для вимірювання часу", "Для вимірювання маси", "Для підтримання сталої сили струму", "Для нагрівання розчину"], "a": 2, "why": "Реостатом регулюють силу струму, щоб вона не змінювалася."}]}, {"n": "8", "type": "problems", "t": "Розв’язування задач", "gr": "ГР3", "g": "Навчитися розв’язувати комбіновані задачі на електроліз: з урахуванням енергії, потужності, товщини покриття та змінної сили струму.", "blocks": [{"h": "Алгоритм розв’язування комбінованих задач", "p": ["На цьому уроці закон Фарадея поєднуємо з іншими формулами: роботи й потужності струму, густини, закону Ома. Зручно спершу знайти «місточок» між величинами — найчастіше це заряд q = It або маса m."], "ul": ["Якщо дано енергію чи потужність, знайдіть силу струму: I = P/U або q = W/U.", "Якщо дано товщину покриття, знайдіть масу: m = ρSd.", "Якщо сила струму змінюється, обчисліть заряд на кожному етапі й додайте: q = I₁t₁ + I₂t₂.", "Маса одного йона: m₀ = kq₀, де q₀ = ne (n — валентність йона).", "Не забувайте переводити мкм, см², хв і год у СІ."]}], "formulas": [{"f": "m = kIt = kq", "d": "перший закон Фарадея"}, {"f": "W = qU = UIt", "d": "енергія, витрачена на електроліз"}, {"f": "P = UI", "d": "потужність струму"}, {"f": "m = ρSd", "d": "маса шару покриття товщиною d на площі S"}, {"f": "k = m₀/q₀", "d": "зв’язок електрохімічного еквівалента з масою і зарядом йона"}], "terms": [], "examples": [{"q": "Яку енергію витрачають на рафінування 1 кг міді, якщо напруга на ванні 0,4 В? k = 0,33·10⁻⁶ кг/Кл.", "s": ["Дано: m = 1 кг; U = 0,4 В; k = 0,33·10⁻⁶ кг/Кл. Знайти: W.", "Розв’язання: q = m/k = 1 кг/0,33·10⁻⁶ кг/Кл ≈ 3,03·10⁶ Кл.", "W = qU = 3,03·10⁶ Кл · 0,4 В ≈ 1,2·10⁶ Дж ≈ 0,34 кВт·год.", "Відповідь: W ≈ 1,2 МДж."]}, {"q": "Скільки часу потрібно, щоб покрити деталь площею 200 см² шаром нікелю завтовшки 10 мкм за сили струму 1 А? ρ нікелю = 8900 кг/м³, k = 0,30·10⁻⁶ кг/Кл.", "s": ["Дано: S = 200 см²; d = 10 мкм; I = 1 А; ρ = 8900 кг/м³; k = 0,30·10⁻⁶ кг/Кл. Знайти: t.", "СІ: S = 0,02 м²; d = 1·10⁻⁵ м.", "Розв’язання: m = ρSd = 8900 · 0,02 · 1·10⁻⁵ кг = 1,78·10⁻³ кг.", "t = m/(kI) = 1,78·10⁻³ кг/(0,30·10⁻⁶ кг/Кл · 1 А) ≈ 5930 с.", "Відповідь: t ≈ 5900 с ≈ 1 год 39 хв."]}, {"q": "Перші 10 хв сила струму через ванну з розчином солі міді була 2 А, наступні 20 хв — 1 А. Яка маса міді виділилася? k = 0,33·10⁻⁶ кг/Кл.", "s": ["Дано: I₁ = 2 А; t₁ = 10 хв; I₂ = 1 А; t₂ = 20 хв. Знайти: m.", "СІ: t₁ = 600 с; t₂ = 1200 с.", "Розв’язання: q = I₁t₁ + I₂t₂ = 2 · 600 + 1 · 1200 = 2400 Кл.", "m = kq = 0,33·10⁻⁶ кг/Кл · 2400 Кл ≈ 7,9·10⁻⁴ кг.", "Відповідь: m ≈ 0,79 г."]}, {"q": "Ванна для цинкування працює за напруги 4 В і споживає потужність 20 Вт. Яка маса цинку виділиться за 1 год? k = 0,34·10⁻⁶ кг/Кл.", "s": ["Дано: U = 4 В; P = 20 Вт; t = 1 год; k = 0,34·10⁻⁶ кг/Кл. Знайти: m.", "СІ: t = 3600 с.", "Розв’язання: I = P/U = 20 Вт/4 В = 5 А.", "m = kIt = 0,34·10⁻⁶ · 5 · 3600 кг ≈ 6,1·10⁻³ кг.", "Відповідь: m ≈ 6,1 г."]}, {"q": "Знайдіть масу одного йона міді Cu²⁺, якщо k = 0,33·10⁻⁶ кг/Кл, а елементарний заряд e = 1,6·10⁻¹⁹ Кл.", "s": ["Дано: k = 0,33·10⁻⁶ кг/Кл; q₀ = 2e = 3,2·10⁻¹⁹ Кл. Знайти: m₀.", "Розв’язання: k = m₀/q₀ ⇒ m₀ = kq₀ = 0,33·10⁻⁶ кг/Кл · 3,2·10⁻¹⁹ Кл ≈ 1,06·10⁻²⁵ кг.", "Відповідь: m₀ ≈ 1,06·10⁻²⁵ кг (це добре узгоджується з масою атома міді)."]}], "lab": null, "f": "", "pr": ["Яка маса алюмінію виділяється за 1 год у промисловому електролізері за сили струму 100 кА? k = 0,093·10⁻⁶ кг/Кл. (≈ 33 кг)", "Яку енергію треба витратити, щоб отримати 1 кг цинку електролізом за напруги 3 В? k = 0,34·10⁻⁶ кг/Кл. (≈ 8,8 МДж ≈ 2,5 кВт·год)", "Скільки часу сріблять ложку площею 50 см² шаром завтовшки 5 мкм за сили струму 0,5 А? ρ срібла = 10 500 кг/м³, k = 1,118·10⁻⁶ кг/Кл. (≈ 470 с ≈ 8 хв)", "Яка маса хрому осяде на деталі за 30 хв за сили струму 4 А? k = 0,18·10⁻⁶ кг/Кл. (≈ 1,3 г)"], "qz": [{"q": "Через ванну пройшов заряд 2000 Кл за напруги 3 В. Яку енергію витрачено?", "o": ["667 Дж", "6000 Дж", "2003 Дж", "6 Дж"], "a": 1, "why": "W = qU = 2000 · 3 = 6000 Дж."}, {"q": "Ванна споживає 12 Вт за напруги 6 В. Яка сила струму?", "o": ["72 А", "0,5 А", "2 А", "18 А"], "a": 2, "why": "I = P/U = 12/6 = 2 А."}, {"q": "5 хв струм 2 А, потім 5 хв струм 4 А. Який загальний заряд?", "o": ["1800 Кл", "30 Кл", "600 Кл", "3600 Кл"], "a": 0, "why": "q = 2 · 300 + 4 · 300 = 1800 Кл."}, {"q": "Як знайти масу покриття, знаючи його товщину d і площу S?", "o": ["m = ρ/(Sd)", "m = Sd/ρ", "m = kSd", "m = ρSd"], "a": 3, "why": "Маса = густина × об’єм, а об’єм шару V = Sd."}, {"q": "Щоб удвічі збільшити товщину покриття за того самого струму, час електролізу треба…", "o": ["зменшити вдвічі", "збільшити вдвічі", "збільшити вчетверо", "не змінювати"], "a": 1, "why": "Маса (і товщина) шару пропорційна часу: m = kIt."}, {"q": "Чому для отримання 1 кг алюмінію потрібно більше заряду, ніж для 1 кг міді?", "o": ["Алюміній легший", "Алюміній має більшу густину", "У алюмінію менший електрохімічний еквівалент", "Мідь не проводить струм"], "a": 2, "why": "q = m/k, а k алюмінію (0,093·10⁻⁶) менший, ніж у міді (0,33·10⁻⁶ кг/Кл)."}, {"q": "Яка маса міді (k = 0,33·10⁻⁶ кг/Кл) виділиться за заряду 3000 Кл?", "o": ["0,99 г", "9,9 г", "0,099 г", "99 г"], "a": 0, "why": "m = 0,33·10⁻⁶ · 3000 = 0,99·10⁻³ кг."}, {"q": "Скільки джоулів в 1 кВт·год?", "o": ["1000 Дж", "3600 Дж", "3,6·10⁵ Дж", "3,6·10⁶ Дж"], "a": 3, "why": "1 кВт·год = 1000 Вт · 3600 с = 3,6·10⁶ Дж."}]}, {"n": "9", "type": "theory", "t": "Електричний струм у газах", "gr": "ГР2", "g": "З’ясувати, за яких умов газ стає провідником, що таке йонізація газу та чим відрізняються несамостійний і самостійний газові розряди.", "blocks": [{"h": "Газ — діелектрик чи провідник?", "p": ["За звичайних умов гази, зокрема повітря, — добрі діелектрики: вони складаються з нейтральних атомів і молекул, тому вільних заряджених частинок у них майже немає. Саме тому ми безпечно користуємося електроприладами, а повітря між проводами ліній електропередачі не проводить струм.", "Проте якщо газ нагріти полум’ям або опромінити ультрафіолетовим, рентгенівським чи радіоактивним випромінюванням, він починає проводити струм. Наприклад, заряджений електроскоп швидко розряджається, якщо біля нього запалити свічку."], "ul": ["За звичайних умов газ майже не проводить струм.", "Щоб газ став провідником, у ньому мають з’явитися вільні заряджені частинки.", "Чинники, що створюють такі частинки, називають йонізаторами.", "Йонізатори: полум’я (нагрівання), ультрафіолетове, рентгенівське, радіоактивне випромінювання."]}, {"h": "Йонізація і рекомбінація", "p": ["Під дією йонізатора від нейтрального атома (молекули) газу відривається електрон. Атом стає позитивним йоном, а вільний електрон може приєднатися до іншого атома й утворити негативний йон. Цей процес називають йонізацією газу. Енергію, яку треба витратити, щоб відірвати електрон, називають енергією йонізації.", "Одночасно з йонізацією відбувається й зворотний процес — рекомбінація: позитивні йони та електрони, зустрічаючись, знову утворюють нейтральні атоми. Якщо йонізатор прибрати, через рекомбінацію газ невдовзі знову стає діелектриком."], "ul": ["Носії струму в газах — електрони, позитивні й негативні йони.", "Енергію йонізації зручно вимірювати в електрон-вольтах: 1 еВ = 1,6·10⁻¹⁹ Дж.", "Енергія йонізації атомів газів становить кілька — кілька десятків електрон-вольтів.", "Газ, у якому значна частина атомів йонізована, називають плазмою."]}, {"h": "Несамостійний газовий розряд", "p": ["Проходження струму через газ називають газовим розрядом. Якщо струм існує лише завдяки зовнішньому йонізатору і припиняється, щойно йонізатор прибирають, такий розряд називають несамостійним.", "Якщо поступово збільшувати напругу між електродами, сила струму спершу зростає, а потім перестає зростати: усі заряджені частинки, які утворює йонізатор за секунду, доходять до електродів. Такий найбільший струм називають струмом насичення."], "ul": ["Несамостійний розряд потребує зовнішнього йонізатора.", "Струм насичення залежить від потужності йонізатора, а не від напруги.", "На несамостійному розряді ґрунтується робота йонізаційних камер — приладів для реєстрації випромінювань.", "Закон Ома для газового розряду не виконується."]}, {"h": "Самостійний газовий розряд", "p": ["Якщо напругу збільшувати далі, електрони між зіткненнями з атомами набувають у полі такої енергії, що самі вибивають електрони з атомів — відбувається ударна йонізація. Нові електрони теж розганяються і йонізують інші атоми: кількість заряджених частинок зростає лавиноподібно (електронна лавина).", "Крім того, позитивні йони, вдаряючись у катод, вибивають з нього нові електрони. Тоді розряд підтримує сам себе і не згасає навіть без зовнішнього йонізатора. Такий розряд називають самостійним, а напругу, за якої він виникає, — напругою пробою."], "ul": ["Самостійний розряд існує без зовнішнього йонізатора.", "Головна причина — ударна йонізація електронами.", "Важливу роль відіграє вибивання електронів із катода позитивними йонами.", "Самостійні розряди супроводжуються світінням газу.", "Їхні види — тліючий, іскровий, коронний і дуговий — розглянемо на наступному уроці."]}], "formulas": [{"f": "E_k = eU", "d": "енергія, якої набуває електрон (заряд e = 1,6·10⁻¹⁹ Кл), пройшовши різницю потенціалів U"}, {"f": "1 еВ = 1,6·10⁻¹⁹ Дж", "d": "електрон-вольт — енергія, якої набуває електрон, пройшовши різницю потенціалів 1 В"}, {"f": "E_k ≥ W_й", "d": "умова ударної йонізації: енергія електрона має бути не меншою за енергію йонізації атома W_й"}], "terms": [["Газовий розряд", "процес проходження електричного струму через газ."], ["Йонізація газу", "процес утворення позитивних і негативних йонів та вільних електронів з нейтральних атомів і молекул газу."], ["Йонізатор", "чинник, що спричиняє йонізацію газу (нагрівання, випромінювання)."], ["Рекомбінація", "утворення нейтральних атомів і молекул під час з’єднання йонів та електронів протилежного знака."], ["Несамостійний розряд", "газовий розряд, що існує лише під дією зовнішнього йонізатора."], ["Самостійний розряд", "газовий розряд, що існує без дії зовнішнього йонізатора."], ["Ударна йонізація", "йонізація атомів газу внаслідок їхнього зіткнення з електронами, які набули достатньої енергії в електричному полі."]], "examples": [{"q": "Енергія йонізації атома азоту — близько 14,5 еВ. Чи зможе електрон йонізувати атом азоту, якщо між зіткненнями він проходить у полі різницю потенціалів 20 В?", "s": ["Дано: U = 20 В; W_й = 14,5 еВ; e = 1,6·10⁻¹⁹ Кл. Знайти: E_k, порівняти з W_й.", "СІ: W_й = 14,5 · 1,6·10⁻¹⁹ Дж ≈ 2,3·10⁻¹⁸ Дж.", "Розв’язання: E_k = eU = 1,6·10⁻¹⁹ Кл · 20 В = 3,2·10⁻¹⁸ Дж (тобто 20 еВ).", "E_k > W_й, отже, ударна йонізація можлива.", "Відповідь: так, зможе."]}], "lab": null, "f": "Слово «плазма» для йонізованого газу запропонував американський фізик Ірвінг Ленгмюр у 1928 р. Плазма — найпоширеніший стан речовини у Всесвіті: з неї складаються Сонце та інші зорі.", "pr": ["Поясніть, чому заряджений електроскоп розряджається, якщо біля нього запалити сірник або свічку.", "Складіть порівняльну таблицю «Несамостійний і самостійний розряди»: умова існування, причина утворення носіїв, приклади."], "qz": [{"q": "Чому повітря за звичайних умов є діелектриком?", "o": ["У ньому майже немає вільних заряджених частинок", "Воно занадто холодне", "Його молекули дуже великі", "Воно містить воду"], "a": 0, "why": "Атоми і молекули газу нейтральні, вільних зарядів майже немає."}, {"q": "Що є носіями струму в газах?", "o": ["Тільки позитивні йони", "Тільки протони", "Електрони, позитивні й негативні йони", "Нейтральні молекули"], "a": 2, "why": "Під час йонізації утворюються і йони обох знаків, і вільні електрони."}, {"q": "Що з переліченого НЕ є йонізатором газу?", "o": ["Полум’я", "Ультрафіолетове випромінювання", "Рентгенівське випромінювання", "Охолодження газу"], "a": 3, "why": "Охолодження не відриває електрони від атомів, а навпаки — сприяє рекомбінації."}, {"q": "Як називають розряд, що зникає, коли прибирають йонізатор?", "o": ["Самостійний", "Несамостійний", "Дуговий", "Іскровий"], "a": 1, "why": "Несамостійний розряд існує лише за дії зовнішнього йонізатора."}, {"q": "Що таке струм насичення?", "o": ["Найбільший струм несамостійного розряду, коли до електродів доходять усі утворені йони", "Струм у надпровіднику", "Струм за напруги 0 В", "Струм у металі за 0 °C"], "a": 0, "why": "Далі струм не зростає, бо йонізатор не створює більше носіїв за секунду."}, {"q": "Яку енергію набуває електрон, пройшовши різницю потенціалів 10 В?", "o": ["1,6·10⁻¹⁸ Дж", "1,6·10⁻²⁰ Дж", "10 Дж", "1,6·10⁻¹⁹ Дж"], "a": 0, "why": "E = eU = 1,6·10⁻¹⁹ · 10 = 1,6·10⁻¹⁸ Дж (10 еВ)."}, {"q": "Яке явище є головною причиною самостійного розряду?", "o": ["Рекомбінація", "Електроліз", "Ударна йонізація", "Надпровідність"], "a": 2, "why": "Розігнані полем електрони вибивають нові електрони з атомів — виникає лавина."}, {"q": "Що таке рекомбінація?", "o": ["Відрив електрона від атома", "Розпад молекули на йони у воді", "Нагрівання газу", "Утворення нейтральних атомів з йонів та електронів"], "a": 3, "why": "Рекомбінація — процес, зворотний до йонізації."}]}, {"n": "10", "type": "theory", "t": "Види самостійних газових розрядів", "gr": "ГР1, ГР3", "g": "Ознайомитися з тліючим, іскровим, коронним і дуговим розрядами, їхніми особливостями та застосуванням, а також із правилами безпеки під час грози.", "blocks": [{"h": "Тліючий розряд", "p": ["Тліючий розряд виникає в газах за низького тиску (десяті й соті частки міліметра ртутного стовпчика). Газ у трубці світиться рівномірним світлом, колір якого залежить від роду газу: неон — червоно-помаранчевий, аргон — синьо-фіолетовий.", "Цей розряд використовують у газосвітних (неонових) рекламних трубках і в лампах денного світла (люмінесцентних), де розряд у парах ртуті створює ультрафіолет, а люмінофор на стінках трубки перетворює його на видиме світло."], "ul": ["Умова: знижений тиск газу.", "Колір світіння залежить від газу.", "Застосування: рекламні трубки, індикаторні лампи, люмінесцентні лампи.", "Оскільки люмінесцентні лампи містять ртуть, їх не можна викидати разом зі звичайним сміттям."]}, {"h": "Іскровий розряд і блискавка", "p": ["Іскровий розряд виникає за атмосферного тиску й дуже сильного електричного поля. Він має вигляд яскравих розгалужених каналів і супроводжується тріском: газ у каналі різко нагрівається й розширюється. Маленькі іскри виникають, коли знімаєте синтетичний светр, а найбільший природний іскровий розряд — блискавка.", "Сила струму в блискавці сягає десятків тисяч ампер, температура в каналі — близько 30 000 °C, а тривалість — частки секунди. Грім — це звукова хвиля від різкого розширення нагрітого повітря. Від ударів блискавки будівлі захищають блискавковідводами, які винайшов Бенджамін Франклін."], "ul": ["Застосування: запалювання пальної суміші свічками в двигунах, електроіскрова обробка металів, п’єзозапальнички.", "Відстань до грози можна оцінити: s ≈ vt, де v ≈ 340 м/с — швидкість звуку, t — час між спалахом і громом.", "Під час грози не стійте під поодинокими деревами й на відкритому місці, не купайтеся.", "Удома під час грози краще не користуватися дротовими пристроями, увімкненими в мережу."]}, {"h": "Коронний розряд", "p": ["Коронний розряд виникає біля загострених провідників або тонких дротів, де електричне поле дуже сильне. Газ біля вістря світиться слабким сяйвом, схожим на корону, і чути тихе потріскування чи гудіння.", "Корона виникає біля проводів високовольтних ліній електропередачі й спричиняє втрати енергії. Моряки здавна спостерігали її на верхівках щогл перед грозою і називали «вогнями святого Ельма»."], "ul": ["Умова: дуже неоднорідне сильне поле біля вістря.", "Шкідлива дія: втрати енергії на лініях електропередачі.", "Корисне застосування: електрофільтри для очищення димових газів від пилу.", "Також використовують у копіювальних апаратах і лазерних принтерах для заряджання барабана."]}, {"h": "Дуговий розряд", "p": ["Якщо два вугільні стрижні, під’єднані до потужного джерела, звести до дотику, а потім трохи розвести, між ними виникає яскраве сліпуче полум’я — електрична дуга. Її відкрив у 1802 р. Василь Петров. Дуга підтримується завдяки термоелектронній емісії: розжарений катод інтенсивно випускає електрони.", "Дуга має температуру в кілька тисяч градусів і дає дуже яскраве світло. Її використовують для зварювання й різання металів, у дугових сталеплавильних печах, у потужних прожекторах."], "ul": ["Умова: великий струм, розжарений катод.", "Застосування: електрозварювання, дугові печі, прожектори.", "Дуга випромінює сильний ультрафіолет, тому на зварювання не можна дивитися без захисної маски.", "Дуга може виникнути і шкідливо — під час розмикання потужних кіл у вимикачах."]}], "formulas": [{"f": "s ≈ vt", "d": "відстань до грози: v ≈ 340 м/с — швидкість звуку, t — час між спалахом і громом"}, {"f": "q = It", "d": "заряд, перенесений розрядом"}, {"f": "W = qU", "d": "енергія розряду"}], "terms": [["Тліючий розряд", "самостійний розряд у газі за низького тиску, що супроводжується рівномірним світінням газу."], ["Іскровий розряд", "короткочасний самостійний розряд у вигляді яскравих розгалужених каналів за високої напруги."], ["Блискавка", "потужний природний іскровий розряд в атмосфері."], ["Коронний розряд", "самостійний розряд
