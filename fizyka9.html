довжина хвилі у воді? Чи зміниться колір?", "s": ["Дано: λ₀ = 600 нм, n = 1,33.", "Розв’язання: частота не змінюється, швидкість зменшується в n разів, тому λ = λ₀/n = 600 нм : 1,33 ≈ 451 нм.", "Колір визначається частотою, тому він не змінюється.", "Відповідь: λ ≈ 451 нм, колір залишається оранжевим."]}], "lab": null, "f": "Ньютон поділив спектр саме на сім кольорів значною мірою за аналогією із сімома нотами музичної гами; насправді кольори в спектрі переходять один в один неперервно.", "pr": ["Отримайте вдома спектр: поставте на підвіконня в сонячний день склянку з водою або покладіть у воду дзеркальце під кутом і спрямуйте «зайчик» на білу стіну. Запишіть порядок кольорів і поясніть результат.", "Подивіться на кілька різнокольорових предметів крізь кольорову плівку (наприклад, червону обгортку). Опишіть, як змінилися їхні кольори, і поясніть чому."], "qz": [{"q": "Що таке дисперсія світла?", "o": ["Відбивання світла від дзеркала", "Залежність показника заломлення від частоти світла", "Поглинання світла чорними тілами", "Поширення світла по прямій"], "a": 1, "why": "Саме залежність n від частоти (кольору) світла називають дисперсією."}, {"q": "Який колір призма відхиляє найбільше?", "o": ["Червоний", "Жовтий", "Фіолетовий", "Зелений"], "a": 2, "why": "Для фіолетового світла показник заломлення скла найбільший."}, {"q": "Чому листок рослини зелений?", "o": ["Він відбиває переважно зелене світло", "Він поглинає зелене світло", "Він випромінює зелене світло", "Він заломлює всі кольори однаково"], "a": 0, "why": "Колір непрозорого предмета визначається світлом, яке він відбиває."}, {"q": "Що не змінюється під час переходу світла з повітря у воду?", "o": ["Швидкість", "Довжина хвилі", "Напрямок (при α ≠ 0°)", "Частота"], "a": 3, "why": "Частота визначається джерелом і на межі середовищ не змінюється."}, {"q": "Довжина хвилі червоного світла 750 нм. Яка частота?", "o": ["4·10¹⁴ Гц", "2,25·10¹⁴ Гц", "4·10⁸ Гц", "7,5·10¹⁴ Гц"], "a": 0, "why": "ν = 3·10⁸ : 7,5·10⁻⁷ = 4·10¹⁴ Гц."}, {"q": "Якого кольору здасться білий папір у червоному світлі?", "o": ["Білим", "Червоним", "Зеленим", "Синім"], "a": 1, "why": "Білий папір відбиває все, що на нього падає, тобто лише червоне світло."}, {"q": "Коли можна побачити веселку?", "o": ["Коли Сонце попереду, а дощ позаду", "Лише вночі", "Коли Сонце позаду спостерігача, а попереду краплини води", "Лише взимку"], "a": 2, "why": "Краплини повертають світло назад до спостерігача, тому Сонце має бути за спиною."}, {"q": "Чому в спеку краще носити світлий одяг?", "o": ["Він поглинає більше світла", "Він легший", "Він випромінює холод", "Він відбиває більшу частину світла і менше нагрівається"], "a": 3, "why": "Світлі тканини відбивають більшість світла, а темні поглинають і нагріваються."}]}, {"n": "60", "type": "problems", "t": "Розв’язування задач", "gr": "ГР2", "g": "Закріпити вміння розв’язувати задачі на відбивання, заломлення, повне внутрішнє відбивання світла та дисперсію.", "blocks": [{"h": "Алгоритм розв’язування задач з геометричної оптики", "p": ["Більшість задач на відбивання і заломлення починаються з рисунка: зобразіть межу середовищ, перпендикуляр у точці падіння, падаючий, відбитий і заломлений промені. Кути завжди відкладайте від перпендикуляра.", "Далі запишіть потрібний закон, виразіть невідому величину і підставте числа. Для синусів користуйтеся калькулятором або таблицею: sin 30° = 0,5; sin 45° ≈ 0,707; sin 60° ≈ 0,866; sin 90° = 1."], "ul": ["Прочитайте умову, запишіть «Дано» і переведіть одиниці в СІ.", "Виконайте рисунок, позначте кути α, β, γ від перпендикуляра.", "Визначте, у яке середовище йде світло — оптично густіше чи менш густе.", "Запишіть формулу закону, виразіть невідоме.", "Підставте числа, обчисліть, перевірте, чи має відповідь фізичний сенс (sin не може перевищувати 1).", "Запишіть відповідь з одиницями."]}, {"h": "Нагадування формул теми", "p": ["Кут відбивання дорівнює куту падіння, зображення в плоскому дзеркалі симетричне предмету. Закон заломлення пов’язує синуси кутів з показниками заломлення, а показник заломлення — зі швидкістю світла.", "Граничний кут повного відбивання знаходять для переходу з оптично густішого середовища в менш густе."], "ul": ["β = α", "sin α / sin γ = n₂/n₁", "n = c/v", "sin α₀ = 1/n", "λ = v/ν; c = λ₀·ν"]}], "formulas": [{"f": "β = α", "d": "закон відбивання: α — кут падіння, β — кут відбивання"}, {"f": "sin α / sin γ = n₂₁ = n₂/n₁", "d": "закон заломлення: γ — кут заломлення, n₁, n₂ — абсолютні показники заломлення"}, {"f": "n = c/v", "d": "c ≈ 3·10⁸ м/с — швидкість світла у вакуумі, v — у середовищі"}, {"f": "sin α₀ = 1/n", "d": "α₀ — граничний кут повного відбивання на межі з повітрям"}, {"f": "c = λ₀·ν", "d": "λ₀ — довжина хвилі у вакуумі, ν — частота"}], "terms": [], "examples": [{"q": "Кут між падаючим і відбитим променями дорівнює 80°. Чому дорівнює кут падіння?", "s": ["Дано: α + β = 80°.", "Розв’язання: за законом відбивання β = α, тому 2α = 80°, α = 40°.", "Відповідь: α = 40°."]}, {"q": "Учень стоїть на відстані 1,5 м від плоского дзеркала, потім підходить до нього на 0,5 м. Якою стала відстань між учнем і його зображенням? На скільки вона зменшилася?", "s": ["Дано: a₁ = 1,5 м, Δa = 0,5 м.", "Розв’язання: зображення на такій самій відстані за дзеркалом, тому L₁ = 2a₁ = 3 м.", "a₂ = 1,5 м − 0,5 м = 1 м; L₂ = 2a₂ = 2 м.", "ΔL = 3 м − 2 м = 1 м.", "Відповідь: 2 м; зменшилася на 1 м."]}, {"q": "Промінь падає з повітря на скло (n = 1,5) під кутом 30°. Знайдіть кут заломлення.", "s": ["Дано: α = 30°, n = 1,5.", "Розв’язання: sin γ = sin α / n = 0,5 : 1,5 ≈ 0,333.", "γ ≈ 19,5°.", "Відповідь: γ ≈ 19,5°."]}, {"q": "Визначте швидкість світла у воді, якщо її показник заломлення 1,33.", "s": ["Дано: n = 1,33, c = 3·10⁸ м/с.", "Розв’язання: v = c/n = 3·10⁸ м/с : 1,33 ≈ 2,26·10⁸ м/с.", "Відповідь: v ≈ 2,26·10⁸ м/с."]}, {"q": "Граничний кут повного відбивання для деякого скла 38,7°. Знайдіть показник заломлення цього скла (sin 38,7° ≈ 0,625) і швидкість світла в ньому.", "s": ["Дано: α₀ = 38,7°, sin α₀ ≈ 0,625.", "Розв’язання: sin α₀ = 1/n, тому n = 1/sin α₀ = 1 : 0,625 = 1,6.", "v = c/n = 3·10⁸ м/с : 1,6 ≈ 1,9·10⁸ м/с.", "Відповідь: n = 1,6; v ≈ 1,9·10⁸ м/с."]}], "lab": null, "f": "", "pr": ["Кут падіння світла на дзеркало 35°. Знайдіть кут між падаючим і відбитим променями. (70°)", "Промінь переходить з повітря у воду (n = 1,33) під кутом 60°. Знайдіть кут заломлення. (≈ 41°)", "Знайдіть показник заломлення середовища, у якому швидкість світла 2·10⁸ м/с. (1,5)", "Обчисліть граничний кут повного відбивання для алмазу (n = 2,42). (≈ 24°)"], "qz": [{"q": "Кут падіння збільшили з 20° до 30°. На скільки збільшився кут між падаючим і відбитим променями?", "o": ["10°", "20°", "30°", "5°"], "a": 1, "why": "Кут між променями дорівнює 2α: 60° − 40° = 20°."}, {"q": "Промінь падає з повітря на речовину з n = 1,41 під кутом 45°. Який кут заломлення?", "o": ["45°", "60°", "30°", "15°"], "a": 2, "why": "sin γ = 0,707 : 1,41 ≈ 0,5, отже γ = 30°."}, {"q": "Предмет наблизили до плоского дзеркала на 20 см. На скільки наблизилося зображення до предмета?", "o": ["На 40 см", "На 20 см", "На 10 см", "Не змінилося"], "a": 0, "why": "Відстань предмет–зображення дорівнює 2a, тож вона зменшилася на 2 · 20 см = 40 см."}, {"q": "У якому середовищі швидкість світла 1,24·10⁸ м/с (n — ?)", "o": ["n ≈ 1,33", "n ≈ 1,5", "n ≈ 1,24", "n ≈ 2,42"], "a": 3, "why": "n = 3·10⁸ : 1,24·10⁸ ≈ 2,42 (алмаз)."}, {"q": "Промінь іде з води в повітря під кутом 60°. Граничний кут для води ≈ 49°. Що відбудеться?", "o": ["Повне внутрішнє відбивання", "Промінь заломиться до перпендикуляра", "Промінь пройде без заломлення", "Світло поглинеться"], "a": 0, "why": "60° > 49°, тому світло повністю відбивається."}, {"q": "Частота світла 5·10¹⁴ Гц. Яка довжина хвилі у вакуумі?", "o": ["500 нм", "300 нм", "600 нм", "1,5 мкм"], "a": 2, "why": "λ = 3·10⁸ : 5·10¹⁴ = 6·10⁻⁷ м = 600 нм."}, {"q": "Під яким кутом має падати промінь на дзеркало, щоб відбитий промінь був перпендикулярним до падаючого?", "o": ["90°", "30°", "60°", "45°"], "a": 3, "why": "2α = 90°, отже α = 45°."}, {"q": "Як зміниться кут заломлення, якщо скло замінити алмазом (кут падіння той самий)?", "o": ["Збільшиться", "Зменшиться", "Не зміниться", "Стане 90°"], "a": 1, "why": "Більший n дає менший sin γ = sin α / n, тож промінь сильніше наближається до перпендикуляра."}]}, {"n": "61", "type": "theory", "t": "Лінзи. Оптична сила лінзи", "gr": "ГР2, ГР3", "g": "Ознайомитися з видами лінз, їхніми основними характеристиками та навчитися обчислювати оптичну силу лінзи.", "blocks": [{"h": "Що таке лінза", "p": ["Лінза — це прозоре тіло, обмежене двома сферичними поверхнями (або сферичною і плоскою). Лінзи виготовляють зі скла, пластику, кварцу; лінзою є навіть крапля води чи кришталик ока.", "Лінзу називають тонкою, якщо її товщина значно менша за радіуси поверхонь. У 9 класі ми розглядаємо саме тонкі лінзи."], "ul": ["Опуклі лінзи посередині товщі, ніж біля країв: двоопукла, плоскоопукла, увігнуто-опукла.", "Увігнуті лінзи посередині тонші, ніж біля країв: двоввігнута, плоскоувігнута, опукло-увігнута.", "У повітрі опукла скляна лінза є збиральною, увігнута — розсіювальною.", "Лінзи змінюють хід променів завдяки заломленню на обох поверхнях."]}, {"h": "Основні елементи лінзи", "p": ["Пряму, що проходить через центри сферичних поверхонь лінзи, називають головною оптичною віссю. Точку лінзи, крізь яку промені проходять не змінюючи напрямку, називають оптичним центром O.", "Якщо на збиральну лінзу спрямувати пучок променів, паралельних головній оптичній осі, після лінзи вони зберуться в одній точці — головному фокусі F. У розсіювальної лінзи в головному фокусі перетинаються продовження розбіжних променів, тому її фокус уявний."], "ul": ["Будь-яка тонка лінза має два головні фокуси, симетричні відносно лінзи.", "Фокусна відстань F — відстань від оптичного центру до головного фокуса.", "Фокальна площина — площина, що проходить через фокус перпендикулярно до головної осі.", "Фокус збиральної лінзи дійсний, розсіювальної — уявний.", "Збиральну лінзу на схемах позначають відрізком зі стрілками назовні, розсіювальну — зі стрілками всередину."]}, {"h": "Оптична сила лінзи", "p": ["Чим сильніше лінза заломлює промені, тим ближче до неї фокус. Тому заломлювальну здатність лінзи характеризують оптичною силою D — величиною, оберненою до фокусної відстані.", "Одиниця оптичної сили — діоптрія (дптр): 1 дптр — оптична сила лінзи з фокусною відстанню 1 м. Для збиральної лінзи D > 0, для розсіювальної — D < 0."], "ul": ["D = 1/F, F обов’язково в метрах.", "Окуляри «+2» мають збиральні лінзи з F = 0,5 м.", "Окуляри «−3» мають розсіювальні лінзи з F ≈ 0,33 м.", "Оптична сила системи тонких лінз, складених впритул, дорівнює сумі їхніх оптичних сил: D = D₁ + D₂.", "Чим більший модуль D, тим «сильніша» лінза."]}], "formulas": [{"f": "D = 1/F", "d": "D — оптична сила лінзи (дптр), F — фокусна відстань (м); для розсіювальної лінзи F і D від’ємні"}, {"f": "D = D₁ + D₂", "d": "оптична сила системи двох тонких лінз, складених впритул"}], "terms": [["Лінза", "прозоре тіло, обмежене двома сферичними поверхнями або сферичною і плоскою поверхнями."], ["Головна оптична вісь", "пряма, що проходить через центри сферичних поверхонь лінзи."], ["Оптичний центр лінзи", "точка на головній оптичній осі, крізь яку промені проходять не заломлюючись."], ["Головний фокус", "точка на головній оптичній осі, у якій після заломлення в лінзі перетинаються промені (або їх продовження), що падали паралельно цій осі."], ["Фокусна відстань", "відстань від оптичного центру лінзи до її головного фокуса."], ["Оптична сила лінзи", "фізична величина, обернена до фокусної відстані лінзи."]], "examples": [{"q": "Фокусна відстань збиральної лінзи 20 см. Знайдіть її оптичну силу.", "s": ["Дано: F = 20 см.", "СІ: F = 0,2 м.", "Розв’язання: D = 1/F = 1 : 0,2 м = 5 дптр.", "Відповідь: D = 5 дптр."]}, {"q": "Оптична сила лінзи окулярів −2 дптр. Яка це лінза і яка її фокусна відстань?", "s": ["Дано: D = −2 дптр.", "Розв’язання: D < 0, отже лінза розсіювальна. F = 1/D = 1 : (−2 дптр) = −0,5 м.", "Відповідь: розсіювальна лінза, |F| = 0,5 м = 50 см (фокус уявний)."]}], "lab": null, "f": "Перші окуляри з’явилися в Італії наприкінці XIII століття; це були збиральні лінзи для людей, яким важко читати зблизька.", "pr": ["Знайдіть удома лупу або окуляри для читання. У сонячний день обережно отримайте на аркуші паперу зображення вікна чи віддаленого дерева, виміряйте відстань від лінзи до паперу (≈ F) та обчисліть D. Увага: не спрямовуйте лупу на Сонце і не тримайте світлу пляму на папері — він може зайнятися.", "Дві лінзи з оптичною силою +4 дптр і −1,5 дптр склали впритул. Обчисліть оптичну силу і фокусну відстань системи та визначте, збиральна вона чи розсіювальна."], "qz": [{"q": "Яка лінза в повітрі є збиральною?", "o": ["Двоввігнута", "Плоскоувігнута", "Двоопукла", "Опукло-увігнута, тонша посередині"], "a": 2, "why": "Лінзи, товщі посередині, у повітрі збирають промені."}, {"q": "Фокусна відстань лінзи 50 см. Яка її оптична сила?", "o": ["2 дптр", "0,5 дптр", "50 дптр", "5 дптр"], "a": 0, "why": "D = 1/F = 1 : 0,5 м = 2 дптр."}, {"q": "Що відбувається з променем, який проходить крізь оптичний центр лінзи?", "o": ["Заломлюється до осі", "Відбивається", "Поглинається", "Не змінює напрямку"], "a": 3, "why": "Крізь оптичний центр тонкої лінзи промені проходять, не заломлюючись."}, {"q": "Оптична сила лінзи −4 дптр. Яка її фокусна відстань?", "o": ["4 м", "−25 см", "25 см", "−4 см"], "a": 1, "why": "F = 1/D = 1 : (−4) = −0,25 м = −25 см; знак «−» означає розсіювальну лінзу."}, {"q": "Чим відрізняється фокус розсіювальної лінзи?", "o": ["Він уявний: у ньому перетинаються продовження променів", "Його немає", "Він завжди на відстані 1 м", "Він збігається з оптичним центром"], "a": 0, "why": "Після розсіювальної лінзи промені розходяться, і перетинаються лише їх продовження."}, {"q": "Яка одиниця оптичної сили в СІ?", "o": ["Метр", "Ньютон", "Люкс", "Діоптрія"], "a": 3, "why": "Оптичну силу вимірюють у діоптріях: 1 дптр = 1 м⁻¹."}, {"q": "Лінзи +5 дптр і −2 дптр склали впритул. Яка оптична сила системи?", "o": ["7 дптр", "−10 дптр", "3 дптр", "2,5 дптр"], "a": 2, "why": "D = D₁ + D₂ = 5 + (−2) = 3 дптр."}, {"q": "Яка лінза сильніше заломлює промені?", "o": ["F = 1 м", "F = 10 см", "F = 50 см", "F = 25 см"], "a": 1, "why": "Найкоротша фокусна відстань дає найбільшу оптичну силу: D = 1 : 0,1 = 10 дптр."}]}, {"n": "62", "type": "theory", "t": "Побудова зображень у лінзах. Найпростіші оптичні прилади", "gr": "ГР1, ГР3", "g": "Навчитися будувати зображення предметів у збиральній і розсіювальній лінзах, характеризувати їх і пояснювати будову найпростіших оптичних приладів.", "blocks": [{"h": "Зручні промені для побудови", "p": ["Щоб побудувати зображення точки, достатньо знайти перетин двох променів, що вийшли з неї, після лінзи. Зручно брати промені, хід яких відомий заздалегідь.", "Для зображення предмета-стрілки, що стоїть на головній осі, будують зображення її верхньої точки, а потім опускають перпендикуляр на вісь."], "ul": ["Промінь, що йде через оптичний центр, не заломлюється.", "Промінь, паралельний головній осі, після збиральної лінзи проходить через фокус F (після розсіювальної — так, ніби вийшов з фокуса з боку предмета).", "Промінь, що йде через фокус збиральної лінзи (або напрямлений на дальній фокус розсіювальної), після лінзи йде паралельно головній осі.", "Якщо перетинаються самі промені — зображення дійсне, якщо їх продовження — уявне.", "Уявні промені й продовження креслять штриховою лінією."]}, {"h": "Зображення в збиральній лінзі", "p": ["Характер зображення в збиральній лінзі залежить від відстані d від предмета до лінзи. Зображення характеризують трьома ознаками: дійсне чи уявне, пряме чи перевернуте, збільшене, зменшене чи такого самого розміру.", "Запам’ятайте: дійсне зображення завжди перевернуте і лежить по інший бік лінзи; уявне — пряме і з того самого боку, що й предмет."], "ul": ["d > 2F: дійсне, перевернуте, зменшене (фотоапарат, око).", "d = 2F: дійсне, перевернуте, такого самого розміру, f = 2F.", "F < d < 2F: дійсне, перевернуте, збільшене (проєктор).", "d = F: зображення немає, промені після лінзи паралельні.", "d < F: уявне, пряме, збільшене (лупа)."]}, {"h": "Зображення в розсіювальній лінзі", "p": ["Розсіювальна лінза за будь-якого положення предмета дає одне й те саме за характером зображення. Воно розташоване між фокусом і лінзою з того самого боку, що й предмет.", "Тому розсіювальні лінзи самостійно не використовують для отримання зображення на екрані, але вони важливі в окулярах для короткозорих і в складних об’єктивах."], "ul": ["Зображення завжди уявне.", "Зображення завжди пряме.", "Зображення завжди зменшене.", "Чим далі предмет, тим ближче зображення до фокуса."]}, {"h": "Найпростіші оптичні прилади", "p": ["Лупа — збиральна лінза з малою фокусною відстанню; предмет розміщують між лупою і фокусом і бачать уявне збільшене зображення. Фотоапарат (і камера смартфона) — це об’єктив, що дає на матриці дійсне зменшене перевернуте зображення.", "Проєктор утворює на екрані дійсне збільшене зображення; кадр розташовують між F і 2F, а щоб на екрані картинка була прямою, кадр ставлять «догори ногами». Мікроскоп і телескоп складаються з об’єктива та окуляра."], "ul": ["Лупа: d < F, уявне збільшене пряме зображення.", "Фотоапарат: d > 2F, дійсне зменшене перевернуте зображення.", "Проєктор: F < d < 2F, дійсне збільшене зображення.", "Мікроскоп: об’єктив дає дійсне збільшене зображення, окуляр працює як лупа.", "Телескоп-рефрактор: об’єктив з великою фокусною відстанню й окуляр."]}], "formulas": [{"f": "Γ = H/h", "d": "Γ — лінійне збільшення, H — висота зображення, h — висота предмета"}, {"f": "D = 1/F", "d": "оптична сила лінзи"}], "terms": [["Дійсне зображення", "зображення, утворене перетином самих променів; його можна отримати на екрані."], ["Уявне зображення", "зображення, утворене перетином продовжень променів; його не можна отримати на екрані."], ["Лінійне збільшення", "фізична величина, що показує, у скільки разів розмір зображення відрізняється від розміру предмета."], ["Лупа", "збиральна лінза з малою фокусною відстанню для розглядання дрібних предметів."], ["Об’єктив", "лінза або система лінз оптичного приладу, обернена до предмета."], ["Окуляр", "лінза або система лінз оптичного приладу, до якої прикладають око."]], "examples": [{"q": "Предмет розташований на відстані 30 см від збиральної лінзи з фокусною відстанню 10 см. Охарактеризуйте зображення, не обчислюючи.", "s": ["Дано: d = 30 см, F = 10 см, отже 2F = 20 см.", "Розв’язання: d = 30 см > 2F, тому, як для фотоапарата, зображення лежить між F і 2F по інший бік лінзи.", "Побудова: промінь, паралельний осі, після лінзи йде через F; промінь через оптичний центр не заломлюється; точка їх перетину — зображення верхівки предмета.", "Відповідь: зображення дійсне, перевернуте, зменшене."]}], "lab": null, "f": "Найдавніший «фотоапарат» — камера-обскура, темна кімната з маленьким отвором у стіні, на протилежній стіні якої з’являється перевернуте зображення вулиці. Її описували ще давні вчені, а художники пізніше використовували для замальовок.", "pr": ["Побудуйте в зошиті зображення предмета в збиральній лінзі (F = 2 см) для трьох випадків: d = 5 см, d = 3 см, d = 1 см. Охарактеризуйте кожне зображення й назвіть прилад, у якому використовують такий випадок.", "Розгляньте крізь лупу (або краплю води на прозорій плівці) дрібний шрифт. З’ясуйте дослідно, на якій відстані від тексту лупа дає збільшене пряме зображення, а на якій зображення стає перевернутим, і поясніть результат."], "qz": [{"q": "Яке зображення дає збиральна лінза, якщо d > 2F?", "o": ["Уявне, пряме, збільшене", "Дійсне, перевернуте, збільшене", "Дійсне, перевернуте, зменшене", "Уявне, пряме, зменшене"], "a": 2, "why": "Для d > 2F зображення лежить між F і 2F і є дійсним зменшеним перевернутим."}, {"q": "Де розташувати предмет, щоб збиральна лінза працювала як лупа?", "o": ["Між лінзою і фокусом", "За подвійним фокусом", "У подвійному фокусі", "Між F і 2F"], "a": 0, "why": "При d < F лінза дає уявне пряме збільшене зображення."}, {"q": "Яке зображення завжди дає розсіювальна лінза?", "o": ["Дійсне, перевернуте, зменшене", "Уявне, перевернуте, збільшене", "Дійсне, пряме, такого самого розміру", "Уявне, пряме, зменшене"], "a": 3, "why": "Промені після розсіювальної лінзи розходяться, перетинаються лише продовження ближче за фокус."}, {"q": "Який хід має промінь, паралельний головній осі, після збиральної лінзи?", "o": ["Іде через оптичний центр", "Проходить через головний фокус", "Іде паралельно осі", "Повертає назад"], "a": 1, "why": "Паралельні осі промені після збиральної лінзи збираються в головному фокусі."}, {"q": "У якому приладі предмет розташовують між F і 2F збиральної лінзи?", "o": ["Фотоапарат", "Лупа", "Проєктор", "Окуляри для короткозорих"], "a": 2, "why": "У цьому випадку зображення дійсне збільшене — саме воно потрібне на екрані проєктора."}, {"q": "Предмет розташований у фокусі збиральної лінзи. Де буде зображення?", "o": ["Зображення не утвориться", "У подвійному фокусі", "У фокусі з іншого боку", "В оптичному центрі"], "a": 0, "why": "Промені з фокуса після лінзи йдуть паралельно й не перетинаються."}, {"q": "Чому зображення на матриці фотоапарата перевернуте?", "o": ["Через відбивання від матриці", "Через дисперсію", "Через повне внутрішнє відбивання", "Бо об’єктив дає дійсне зображення, а воно завжди перевернуте"], "a": 3, "why": "Дійсні зображення в лінзі завжди перевернуті; електроніка камери потім «перевертає» картинку."}, {"q": "Предмет на відстані 2F від збиральної лінзи. Яке збільшення?", "o": ["Γ = 2", "Γ = 1", "Γ = 0,5", "Γ = 4"], "a": 1, "why": "При d = 2F зображення таке саме за розміром, як предмет, тобто Γ = 1."}]}, {"n": "63", "type": "theory", "t": "Формула тонкої лінзи", "gr": "ГР2, ГР3", "g": "Навчитися застосовувати формулу тонкої лінзи та формулу лінійного збільшення для обчислення положення і розміру зображення.", "blocks": [{"h": "Формула тонкої лінзи", "p": ["Положення предмета, положення зображення і фокусна відстань тонкої лінзи пов’язані простим співвідношенням — формулою тонкої лінзи. Її можна вивести з подібності трикутників на рисунку побудови зображення.", "Тут d — відстань від предмета до лінзи, f — відстань від лінзи до зображення, F — фокусна відстань. Формула дає змогу знайти одну з величин, знаючи дві інші, без побудови."], "ul": ["1/F = 1/d + 1/f.", "Оскільки D = 1/F, формулу можна записати як D = 1/d + 1/f.", "Усі відстані відраховують від оптичного центру лінзи.", "Для розрахунку D відстані беруть у метрах."]}, {"h": "Правило знаків", "p": ["Щоб формула працювала для всіх випадків, деяким величинам приписують знак. Фокусна відстань збиральної лінзи додатна, розсіювальної — від’ємна. Відстань до дійсного зображення додатна, до уявного — від’ємна.", "Отже, якщо в розрахунку вийшло f < 0, зображення уявне і розташоване з того самого боку від лінзи, що й предмет."], "ul": ["Збиральна лінза: F > 0, D > 0.", "Розсіювальна лінза: F < 0, D < 0.", "Дійсне зображення: f > 0.", "Уявне зображення: f < 0.", "Для дійсного предмета d > 0 завжди."]}, {"h": "Лінійне збільшення", "p": ["Лінійне збільшення Γ показує, у скільки разів зображення більше (або менше) за предмет. З подібності трикутників випливає, що воно дорівнює відношенню відстаней від лінзи до зображення і до предмета.", "Якщо Γ > 1 — зображення збільшене, Γ < 1 — зменшене, Γ = 1 — такого самого розміру."], "ul": ["Γ = H/h = |f|/d.", "Для d = 2F маємо f = 2F і Γ = 1.", "Що ближче предмет до фокуса збиральної лінзи, то більше зображення.", "Для розсіювальної лінзи завжди Γ < 1."]}, {"h": "Порядок розв’язування", "p": ["Запишіть дані з урахуванням знаків, виразіть з формули невідому величину й обчисліть. Корисно звести дроби до спільного знаменника, працюючи в сантиметрах, а для D — перевести результат у метри.", "Наприкінці охарактеризуйте зображення за знаком f і значенням Γ та перевірте відповідь побудовою."], "ul": ["1/f = 1/F − 1/d — щоб знайти положення зображення.", "1/d = 1/F − 1/f — щоб знайти положення предмета.", "F = d·f/(d + f) — щоб знайти фокусну відстань.", "Перевірте знак f і зробіть висновок про тип зображення."]}], "formulas": [{"f": "1/F = 1/d + 1/f", "d": "F — фокусна відстань, d — відстань від предмета до лінзи, f — відстань від лінзи до зображення (з урахуванням знаків)"}, {"f": "D = 1/F = 1/d + 1/f", "d": "D — оптична сила лінзи, дптр"}, {"f": "Γ = H/h = |f|/d", "d": "Γ — лінійне збільшення, H — висота зображення, h — висота предмета"}, {"f": "F = d·f/(d + f)", "d": "фокусна відстань, виражена з формули тонкої лінзи"}], "terms": [["Формула тонкої лінзи", "співвідношення 1/F = 1/d + 1/f між фокусною відстанню, відстанню від предмета до лінзи та відстанню від лінзи до зображення."], ["Відстань до предмета", "відстань від предмета до оптичного центру лінзи, позначається d."], ["Відстань до зображення", "відстань від оптичного центру лінзи до зображення, позначається f."], ["Лінійне збільшення", "відношення висоти зображення до висоти предмета."]], "examples": [{"q": "Предмет розташований на відстані 60 см від збиральної лінзи з фокусною відстанню 20 см. Знайдіть відстань до зображення і збільшення.", "s": ["Дано: d = 60 см, F = 20 см.", "Розв’язання: 1/f = 1/F − 1/d = 1/20 − 1/60 = 3/60 − 1/60 = 2/60 = 1/30, отже f = 30 см.", "Γ = f/d = 30 см : 60 см = 0,5.", "f > 0 — зображення дійсне, Γ < 1 — зменшене (і перевернуте).", "Відповідь: f = 30 см, Γ = 0,5."]}, {"q": "Предмет розташований на відстані 15 см від розсіювальної лінзи з фокусною відстанню 10 см. Де буде зображення і яке збільшення?", "s": ["Дано: d = 15 см, F = −10 см (лінза розсіювальна).", "Розв’язання: 1/f = 1/F − 1/d = −1/10 − 1/15 = −3/30 − 2/30 = −5/30 = −1/6, отже f = −6 см.", "Γ = |f|/d = 6 см : 15 см = 0,4.", "Відповідь: зображення уявне, на відстані 6 см від лінзи з боку предмета, зменшене в 2,5 раза (Γ = 0,4)."]}], "lab": null, "f": "Оптична сила оптичної системи ока людини становить приблизно 60 дптр, тобто її фокусна відстань — менше двох сантиметрів.", "pr": ["Предмет розташований на відстані 25 см від збиральної лінзи з оптичною силою 5 дптр. Знайдіть, де буде зображення, яке воно і в скільки разів збільшене.", "Користуючись формулою тонкої лінзи, доведіть, що при d = 2F зображення розташоване також на відстані 2F і має такий самий розмір, як предмет."], "qz": [{"q": "Яка з формул — формула тонкої лінзи?", "o": ["1/F = 1/d + 1/f", "F = d + f", "D = F", "Γ = d·f"], "a": 0, "why": "Саме 1/F = 1/d + 1/f пов’язує фокусну відстань з відстанями до предмета і зображення."}, {"q": "Що означає від’ємне значення f?", "o": ["Лінза зламана", "Зображення дійсне", "Зображення уявне", "Предмет у фокусі"], "a": 2, "why": "За правилом знаків f < 0 відповідає уявному зображенню."}, {"q": "d = 30 см, F = 15 см. Знайдіть f.", "o": ["15 см", "10 см", "45 см", "30 см"], "a": 3, "why": "1/f = 1/15 − 1/30 = 1/30, f = 30 см (d = 2F)."}, {"q": "Висота предмета 2 см, висота зображення 6 см. Яке збільшення?", "o": ["Γ = 12", "Γ = 3", "Γ = 1/3", "Γ = 4"], "a": 1, "why": "Γ = H/h = 6 : 2 = 3."}, {"q": "Який знак має фокусна відстань розсіювальної лінзи у формулі?", "o": ["Від’ємний", "Додатний", "Залежить від предмета", "Нульовий"], "a": 0, "why": "За правилом знаків F < 0 для розсіювальної лінзи."}, {"q": "d = 20 см, f = 20 см. Яка фокусна відстань лінзи?", "o": ["20 см", "40 см", "5 см", "10 см"], "a": 3, "why": "F = d·f/(d + f) = 400 : 40 = 10 см."}, {"q": "d = 40 см, f = 10 см. Яке збільшення?", "o": ["4", "0,25", "2,5", "30"], "a": 1, "why": "Γ = f/d = 10 : 40 = 0,25."}, {"q": "Зображення предмета в лінзі уявне і більше за предмет. Яка це лінза і де предмет?", "o": ["Розсіювальна, будь-де", "Збиральна, d > 2F", "Збиральна, d < F", "Розсіювальна, d < F"], "a": 2, "why": "Уявне збільшене зображення дає лише збиральна лінза, коли предмет між лінзою та фокусом."}]}, {"n": "64", "type": "problems", "t": "Розв’язування задач", "gr": "ГР2, ГР3", "g": "Навчитися розв’язувати задачі на оптичну силу лінзи, формулу тонкої лінзи та лінійне збільшення для збиральних і розсіювальних лінз.", "blocks": [{"h": "Алгоритм розв’язування задач на лінзи", "p": ["У задачах на лінзи найважливіше — правильно врахувати знаки. Спочатку визначте тип лінзи: збиральна (F > 0, D > 0) чи розсіювальна (F < 0, D < 0). Якщо дано оптичну силу, знайдіть F = 1/D у метрах і за потреби переведіть у сантиметри.", "Далі запишіть формулу тонкої лінзи, виразіть невідоме, обчисліть. За знаком f визначте, дійсне чи уявне зображення, а за Γ — збільшене чи зменшене."], "ul": ["Запишіть «Дано», вкажіть знак F.", "Переведіть D у F (м) або навпаки.", "1/f = 1/F − 1/d — знаходимо положення зображення.", "Γ = |f|/d, H = Γ·h — знаходимо збільшення і розмір зображення.", "f > 0 — дійсне перевернуте, f < 0 — уявне пряме.", "Перевірте відповідь побудовою зображення."]}, {"h": "Нагадування формул", "p": ["Усі формули цієї теми випливають з означення оптичної сили та подібності трикутників на рисунку ходу променів."], "ul": ["D = 1/F", "1/F = 1/d + 1/f", "Γ = H/h = |f|/d", "F = d·f/(d + f)"]}], "formulas": [{"f": "D = 1/F", "d": "D — оптична сила (дптр), F — фокусна відстань (м)"}, {"f": "1/F = 1/d + 1/f", "d": "формула тонкої лінзи: d — відстань до предмета, f — до зображення (f < 0 для уявного), F < 0 для розсіювальної лінзи"}, {"f": "Γ = H/h = |f|/d", "d": "Γ — лінійне збільшення, H — висота зображення, h — висота предмета"}, {"f": "D = D₁ + D₂", "d": "оптична сила двох тонких лінз, складених впритул"}], "terms": [], "examples": [{"q": "Фокусна відстань лінзи 25 см. Знайдіть її оптичну силу.", "s": ["Дано: F = 25 см.", "СІ: F = 0,25 м.", "Розв’язання: D = 1/F = 1 : 0,25 м = 4 дптр.", "Відповідь: D = 4 дптр."]}, {"q": "Предмет розташований на відстані 30 см від збиральної лінзи з фокусною відстанню 20 см. Знайдіть відстань до зображення та збільшення. Охарактеризуйте зображення.", "s": ["Дано: d = 30 см, F = 20 см.", "Розв’язання: 1/f = 1/F − 1/d = 1/20 − 1/30 = 3/60 − 2/60 = 1/60, f = 60 см.", "Γ = f/d = 60 : 30 = 2.", "Відповідь: f = 60 см, Γ = 2; зображення дійсне, перевернуте, збільшене."]}, {"q": "Оптична сила розсіювальної лінзи −5 дптр. Предмет розташований на відстані 30 см від неї. Де буде зображення і яке збільшення?", "s": ["Дано: D = −5 дптр, d = 30 см.", "Розв’язання: F = 1/D = −0,2 м = −20 см.", "1/f = 1/F − 1/d = −1/20 − 1/30 = −3/60 − 2/60 = −5/60 = −1/12, f = −12 см.", "Γ = |f|/d = 12 : 30 = 0,4.", "Відповідь: зображення уявне, пряме, на відстані 12 см від лінзи з боку предмета, Γ = 0,4."]}, {"q": "Лупа має фокусну відстань 5 см. Предмет розташували на відстані 4 см від неї. Знайдіть положення зображення і збільшення.", "s": ["Дано: F = 5 см, d = 4 см.", "Розв’язання: 1/f = 1/5 − 1/4 = 4/20 − 5/20 = −1/20, f = −20 см.", "Γ = |f|/d = 20 : 4 = 5.", "Відповідь: зображення уявне, пряме, у 5 разів збільшене, на відстані 20 см від лупи з боку предмета."]}, {"q": "На рецепті окулярів написано «−2,5 дптр». Яка це лінза і яка її фокусна відстань? Для якої вади зору такі окуляри?", "s": ["Дано: D = −2,5 дптр.", "Розв’язання: D < 0 — лінза розсіювальна. F = 1/D = 1 : (−2,5) = −0,4 м = −40 см.", "Розсіювальні лінзи виправляють короткозорість.", "Відповідь: розсіювальна лінза, F = −40 см, для короткозорих."]}], "lab": null, "f": "", "pr": ["Фокусна відстань лінзи 50 см. Яка її оптична сила? (2 дптр)", "Предмет розташований на відстані 40 см від збиральної лінзи з фокусною відстанню 10 см. Знайдіть відстань до зображення і збільшення. (f ≈ 13,3 см; Γ ≈ 0,33)", "Оптична сила лінзи −4 дптр. Знайдіть фокусну відстань і вкажіть тип лінзи. (F = −25 см; розсіювальна)", "Предмет розташований на відстані 15 см від збиральної лінзи з фокусною відстанню 10 см. Знайдіть відстань до зображення і збільшення. (f = 30 см; Γ = 2)"], "qz": [{"q": "Оптична сила лінзи 8 дптр. Яка її фокусна відстань?", "o": ["8 см", "12,5 см", "80 см", "1,25 м"], "a": 1, "why": "F = 1/D = 1 : 8 = 0,125 м = 12,5 см."}, {"q": "d = 12 см, F = 6 см. Знайдіть f.", "o": ["6 см", "18 см", "3 см", "12 см"], "a": 3, "why": "1/f = 1/6 − 1/12 = 1/12, f = 12 см."}, {"q": "Розсіювальна лінза дала зображення на відстані 5 см від лінзи. Яке значення f слід підставити у формулу?", "o": ["−5 см", "5 см", "10 см", "0"], "a": 0, "why": "Розсіювальна лінза дає уявне зображення, тому f = −5 см."}, {"q": "Предмет висотою 4 см дає зображення висотою 1 см. Яке збільшення?", "o": ["4", "0,4", "0,25", "5"], "a": 2, "why": "Γ = H/h = 1 : 4 = 0,25."}, {"q": "Предмет на відстані 20 см від збиральної лінзи дає зображення на відстані 20 см з іншого боку. Яка оптична сила лінзи?", "o": ["5 дптр", "10 дптр", "20 дптр", "2 дптр"], "a": 1, "why": "1/F = 1/20 + 1/20 = 1/10 см⁻¹, F = 0,1 м, D = 10 дптр."}, {"q": "У розрахунку вийшло f = −30 см. Яке зображення?", "o": ["Дійсне, перевернуте", "Дійсне, пряме", "Уявне, перевернуте", "Уявне, пряме"], "a": 3, "why": "f < 0 — зображення уявне, а уявні зображення в лінзах прямі."}, {"q": "Предмет розташований на відстані 10 см від збиральної лінзи з F = 10 см. Що станеться із зображенням?", "o": ["Зображення не утвориться", "f = 10 см", "f = 20 см", "f = 5 см"], "a": 0, "why": "1/f = 1/10 − 1/10 = 0, тобто промені паралельні й зображення немає."}, {"q": "Чому для лупи потрібна лінза з малою фокусною відстанню?", "o": ["Щоб зображення було дійсним", "Щоб отримати велике збільшення при розміщенні предмета ближче за фокус", "Щоб зменшити зображення", "Щоб змінити колір"], "a": 1, "why": "Що коротша F, то більше збільшення дає лупа на зручній відстані від ока."}]}, {"n": "65", "type": "problems", "t": "Розв’язування задач", "gr": "ГР3", "g": "Удосконалити вміння розв’язувати складніші задачі на лінзи: знаходити фокусну відстань за збільшенням, працювати із системами лінз і оптичними приладами.", "blocks": [{"h": "Як розв’язувати задачі з кількома умовами", "p": ["У складніших задачах часто відома не відстань до зображення, а збільшення або відстань між предметом і екраном. Тоді спочатку з умови виражають f через d (наприклад, f = Γ·d або d + f = L), а вже потім підставляють у формулу тонкої лінзи.", "Якщо лінзи складено впритул, спочатку знаходять загальну оптичну силу D = D₁ + D₂, а далі працюють з системою як з однією лінзою."], "ul": ["Дійсне зображення на екрані: f > 0, предмет і екран по різні боки лінзи, L = d + f.", "Уявне зображення в лупі: f < 0, |f| = Γ·d.", "Відома висота предмета: H = Γ·h.", "Система лінз впритул: D = D₁ + D₂, F = 1/D.", "Наприкінці перевірте, чи узгоджується відповідь з побудовою (d > 2F — зменшене, F < d < 2F — збільшене)."]}], "formulas": [{"f": "1/F = 1/d + 1/f", "d": "формула тонкої лінзи"}, {"f": "D = 1/F", "d": "оптична сила лінзи, дптр"}, {"f": "Γ = H/h = |f|/d", "d": "лінійне збільшення"}, {"f": "D = D₁ + D₂", "d": "оптична сила системи тонких лінз, складених впритул"}, {"f": "L = d + f", "d": "відстань між предметом і його дійсним зображенням (екраном)"}], "terms": [], "examples": [{"q": "Предмет розташований на відстані 12 см від лінзи. Дійсне зображення втричі більше за предмет. Знайдіть фокусну відстань і оптичну силу лінзи.", "s": ["Дано: d = 12 см, Γ = 3, зображення дійсне.", "Розв’язання: f = Γ·d = 3 · 12 см = 36 см.", "1/F = 1/d + 1/f = 1/12 + 1/36 = 3/36 + 1/36 = 4/36 = 1/9, F = 9 см = 0,09 м.", "D = 1/F = 1 : 0,09 м ≈ 11 дптр.", "Відповідь: F = 9 см, D ≈ 11 дптр."]}, {"q": "Відстань між предметом і екраном 90 см. Лінза дає на екрані зображення, удвічі більше за предмет. Знайдіть фокусну відстань і оптичну силу лінзи.", "s": ["Дано: L = 90 см, Γ = 2.", "Розв’язання: d + f = 90 см і f = 2d, отже 3d = 90 см, d = 30 см, f = 60 см.", "1/F = 1/30 + 1/60 = 2/60 + 1/60 = 3/60 = 1/20, F = 20 см = 0,2 м.", "D = 1 : 0,2 м = 5 дптр.", "Відповідь: F = 20 см, D = 5 дптр."]}, {"q": "Дві тонкі лінзи з оптичними силами 5 дптр і −2 дптр склали впритул. Знайдіть оптичну силу і фокусну відстань системи.", "s": ["Дано: D₁ = 5 дптр, D₂ = −2 дптр.", "Розв’язання: D = D₁ + D₂ = 5 − 2 = 3 дптр.", "F = 1/D = 1 : 3 ≈ 0,33 м = 33 см.", "Відповідь: D = 3 дптр (система збиральна), F ≈ 33 см."]}, {"q": "Предмет висотою 2 см розташований на відстані 25 см від збиральної лінзи з фокусною відстанню 20 см. Знайдіть висоту зображення.", "s": ["Дано: h = 2 см, d = 25 см, F = 20 см.", "Розв’язання: 1/f = 1/20 − 1/25 = 5/100 − 4/100 = 1/100, f = 100 см.", "Γ = f/d = 100 : 25 = 4; H = Γ·h = 4 · 2 см = 8 см.", "Відповідь: H = 8 см (зображення дійсне, перевернуте)."]}, {"q": "Проєктор дає на екрані, розташованому на відстані 5 м від об’єктива, зображення в 50 разів більше за кадр. Знайдіть оптичну силу об’єктива.", "s": ["Дано: f = 5 м, Γ = 50.", "Розв’язання: d = f/Γ = 5 м : 50 = 0,1 м.", "D = 1/d + 1/f = 1/0,1 + 1/5 = 10 + 0,2 = 10,2 дптр.", "F = 1/D ≈ 0,098 м ≈ 9,8 см.", "Відповідь: D = 10,2 дптр (F ≈ 9,8 см)."]}], "lab": null, "f": "", "pr": ["Предмет розташований на відстані 20 см від лінзи, яка дає уявне зображення, удвічі більше за предмет. Знайдіть фокусну відстань і оптичну силу лінзи. (F = 40 см; D = 2,5 дптр)", "Лінзи з оптичними силами 8 дптр і −3 дптр склали впритул. Знайдіть оптичну силу і фокусну відстань системи. (D = 5 дптр; F = 20 см)", "Відстань між предметом і екраном 100 см. Лінза дає на екрані зображення такого самого розміру, як предмет. Знайдіть фокусну відстань і оптичну силу лінзи. (F = 25 см; D = 4 дптр)", "Предмет висотою 3 см розташований на відстані 60 см від збиральної лінзи з фокусною відстанню 20 см. Знайдіть відстань до зображення і його висоту. (f = 30 см; H = 1,5 см)"], "qz": [{"q": "Дійсне зображення вчетверо більше за предмет, d = 10 см. Яке f?", "o": ["2,5 см", "14 см", "40 см", "4 см"], "a": 2, "why": "f = Γ·d = 4 · 10 см = 40 см."}, {"q": "Лінзи +10 дптр і −4 дптр склали впритул. Яка фокусна відстань системи?", "o": ["≈ 16,7 см", "6 см", "14 см", "−25 см"], "a": 0, "why": "D = 10 − 4 = 6 дптр, F = 1 : 6 ≈ 0,167 м."}, {"q": "Відстань предмет–екран 80 см, зображення такого самого розміру. Яка фокусна відстань?", "o": ["40 см", "80 см", "10 см", "20 см"], "a": 3, "why": "d = f = 40 см, F = d·f/(d + f) = 1600 : 80 = 20 см."}, {"q": "Предмет висотою 5 см, Γ = 0,2. Яка висота зображення?", "o": ["25 см", "1 см", "5,2 см", "0,04 см"], "a": 1, "why": "H = Γ·h = 0,2 · 5 см = 1 см."}, {"q": "d = 30 см, F = 20 см. Яке збільшення?", "o": ["2", "1,5", "0,5", "3"], "a": 0, "why": "1/f = 1/20 − 1/30 = 1/60, f = 60 см, Γ = 60 : 30 = 2."}, {"q": "Лупа з F = 10 см дає уявне зображення в 2 рази більше. Де предмет?", "o": ["20 см", "10 см", "5 см", "15 см"], "a": 2, "why": "f = −2d: 1/10 = 1/d − 1/(2d) = 1/(2d), отже d = 5 см."}, {"q": "Чи можна з лінз +3 дптр і −3 дптр, складених впритул, отримати зображення на екрані?", "o": ["Так, збільшене", "Так, зменшене", "Так, такого самого розміру", "Ні, система має D = 0 і майже не змінює хід променів"], "a": 3, "why": "D = 3 + (−3) = 0, така система діє як плоска пластинка."}, {"q": "Предмет наближають до збиральної лінзи від 2F до F. Як змінюється дійсне зображення?", "o": ["Зменшується і наближається до лінзи", "Збільшується і віддаляється від лінзи", "Не змінюється", "Стає уявним"], "a": 1, "why": "За формулою тонкої лінзи зі зменшенням d (при d > F) f і Γ зростають."}]}, {"n": "66", "type": "lab", "t": "Лабораторна робота № 8 «Визначення фокусної відстані та оптичної сили збиральної лінзи»", "gr": "ГР1", "g": "Експериментально визначити фокусну відстань і оптичну силу збиральної лінзи двома способами та порівняти результати.", "blocks": [{"h": "Теорія до роботи", "p": ["Якщо предмет дуже далеко від збиральної лінзи (d ≫ F), промені від кожної його точки падають на лінзу майже паралельно, тому зображення утворюється майже у фокальній площині: f ≈ F. Це найпростіший спосіб оцінити фокусну відстань.", "Точніше F знаходять за формулою тонкої лінзи, вимірявши відстань d від предмета (наприклад, світної лампочки чи ліхтарика) до лінзи та відстань f від лінзи до екрана, на якому видно чітке зображення."], "ul": ["1/F = 1/d + 1/f, D = 1/F (у метрах).", "Чітке зображення на екрані — дійсне і перевернуте.", "Для перевірки корисно виконати 2–3 вимірювання з різними d.", "Як збиральну лінзу вдома можна використати лупу або лінзу від окулярів «+»."]}, {"h": "Дистанційний формат і безпека", "p": ["Роботу можна безпечно виконати вдома: як предмет — вікно, освітлене денним світлом, або ввімкнений ліхтарик з наклеєною на скло фігуркою з паперу; як екран — білий аркуш картону; відстані вимірюйте лінійкою чи рулеткою.", "Якщо лінзи немає, виконайте роботу у віртуальній лабораторії PhET «Геометрична оптика» (Geometric Optics): переміщуйте предмет, фіксуйте d і f та обчислюйте F."], "ul": ["Ніколи не дивіться крізь лінзу на Сонце — можна пошкодити очі.", "Не фокусуйте сонячне світло на папері, тканині, руці — це спричиняє опік або займання.", "Свічку як предмет використовуйте лише в присутності дорослих; краще замінити її ліхтариком.", "Не залишайте лінзу на підвіконні під прямими сонячними променями."]}], "formulas": [{"f": "1/F = 1/d + 1/f", "d": "d — відстань від предмета до лінзи, f — від лінзи до екрана з чітким зображенням"}, {"f": "F = d·f/(d + f)", "d": "фокусна відстань, виражена з формули тонкої лінзи"}, {"f": "D = 1/F", "d": "оптична сила, дптр (F у метрах)"}, {"f": "ε = |F₁ − F₂|/F₂ · 100 %", "d": "відносна розбіжність результатів, отриманих двома способами"}], "terms": [["Фокусна відстань", "відстань від оптичного центру лінзи до її головного фокуса."], ["Оптична сила лінзи", "величина, обернена до фокусної відстані, вимірюється в діоптріях."], ["Дійсне зображення", "зображення, яке можна отримати на екрані, бо його утворюють самі промені."], ["Фокальна площина", "площина, що проходить через головний фокус перпендикулярно до головної оптичної осі."]], "examples": [], "lab": {"goal": "Визначити фокусну відстань і оптичну силу збиральної лінзи за зображенням віддаленого предмета та за формулою тонкої лінзи.", "equip": ["збиральна лінза (лупа) на підставці або в тримачі з пластиліну", "екран (білий картон)", "джерело світла: ліхтарик з фігуркою на склі або освітлене вікно", "лінійка або рулетка", "олівець, зошит, калькулятор"], "safety": ["Не дивіться крізь лінзу на Сонце і не фокусуйте сонячні промені.", "Не користуйтеся відкритим вогнем без дорослих.", "Скляну лінзу тримайте за оправу, не впустіть її.", "Працюйте на стійкій поверхні."], "steps": ["Спосіб 1. Станьте в кімнаті якомога далі від вікна. Тримаючи лінзу паралельно екрану, переміщуйте екран, доки на ньому не з’явиться чітке зображення рами вікна чи дерев за вікном.", "Виміряйте відстань від лінзи до екрана — це приблизно F₁. Повторіть 3 рази й знайдіть середнє.", "Спосіб 2. Поставте джерело світла (ліхтарик з фігуркою) на столі, на відстані d понад 2F₁ від лінзи; за лінзою розташуйте екран.", "Переміщуючи екран, отримайте чітке зображення фігурки; виміряйте d і f.", "Змініть відстань d (ще двічі, наприклад, ≈ 2,5F₁ і ≈ 1,5F₁), щоразу знаходьте чітке зображення і вимірюйте f.", "Занотуйте, яким було зображення (збільшене чи зменшене) у кожному досліді."], "calc": ["Для способу 2 обчисліть F = d·f/(d + f) у кожному досліді та знайдіть середнє F₂.", "Обчисліть оптичну силу D = 1/F₂ (F₂ у метрах).", "Порівняйте F₁ і F₂: ε = |F₁ − F₂|/F₂ · 100 %.", "Поясніть, чому спосіб 1 дає трохи більше значення, ніж справжня F (адже d не нескінченно велике)."], "table": ["№ досліду", "d, м", "f, м", "F = d·f/(d + f), м", "F_сер, м", "D, дптр"], "sample": "Для звичайної шкільної лінзи або лупи очікується фокусна відстань від кількох сантиметрів до кількох десятків сантиметрів, а значення, отримані обома способами, мають відрізнятися не більше ніж на 5–10 %.", "questions": ["Чому зображення віддаленого предмета утворюється майже у фокусі лінзи?", "Яким було зображення фігурки при d > 2F і при F < d < 2F?", "Чому неможливо отримати зображення на екрані, якщо предмет ближче до лінзи, ніж фокус?", "Який спосіб визначення F точніший і чому?", "Яка оптична сила лінзи, якщо F = 12,5 см?"]}, "f": "Ще в давнину знали, що опукле скло чи наповнена водою скляна куля можуть запалити вогонь, сфокусувавши сонячні промені, — тому розкидані в лісі пляшки і скло можуть спричинити пожежу.", "pr": ["Оформіть звіт: мета, обладнання, схема досліду, таблиця, обчислення F і D двома способами, порівняння результатів, висновок.", "Якщо немає обладнання — виконайте роботу у віртуальній лабораторії PhET «Геометрична оптика» (Geometric Optics): для трьох положень предмета запишіть d і f, обчисліть F і D та порівняйте з фокусною відстанню, заданою в симуляції."], "qz": [{"q": "d = 30 см, f = 15 см. Яка фокусна відстань лінзи?", "o": ["45 см", "15 см", "10 см", "20 см"], "a": 2, "why": "F = d·f/(d + f) = 450 : 45 = 10 см."}, {"q": "Фокусна відстань лінзи 0,2 м. Яка оптична сила?", "o": ["5 дптр", "0,2 дптр", "2 дптр", "20 дптр"], "a": 0, "why": "D = 1/F = 1 : 0,2 = 5 дптр."}, {"q": "Чому зображення віддаленого вікна з’являється майже у фокусі лінзи?", "o": ["Бо вікно яскраве", "Бо лінза розсіювальна", "Бо скло вікна заломлює світло", "Бо промені від далекого предмета падають майже паралельно"], "a": 3, "why": "Паралельні промені після збиральної лінзи сходяться у фокальній площині."}, {"q": "Яке зображення ви отримаєте на екрані, якщо d > 2F?", "o": ["Уявне, пряме", "Дійсне, перевернуте, зменшене", "Дійсне, пряме, збільшене", "Зображення не буде"], "a": 1, "why": "При d > 2F збиральна лінза дає дійсне зменшене перевернуте зображення."}, {"q": "Що з наведеного НЕБЕЗПЕЧНО під час роботи?", "o": ["Фокусувати сонячне світло на папері", "Вимірювати відстань лінійкою", "Використовувати ліхтарик", "Переміщувати екран"], "a": 0, "why": "Сфокусоване сонячне світло може спричинити займання чи опік."}, {"q": "Учень отримав F₁ = 10,5 см і F₂ = 10 см. Яка відносна розбіжність?", "o": ["0,5 %", "10 %", "1,05 %", "5 %"], "a": 3, "why": "ε = 0,5 : 10 · 100 % = 5 %."}]}, {"n": "67", "type": "lab", "t": "Лабораторна робота № 9 «Визначення фокусної відстані та оптичної сили розсіювальної лінзи»", "gr": "ГР1", "g": "Визначити фокусну відстань і оптичну силу розсіювальної лінзи, використавши її у системі зі збиральною лінзою.", "blocks": [{"h": "Теорія до роботи", "p": ["Розсіювальна лінза дає лише уявні зображення, тому безпосередньо отримати зображення на екрані й виміряти f неможливо. Розв’язок — скласти впритул розсіювальну лінзу зі збиральною, оптична сила якої за модулем більша. Така система є збиральною і дає дійсне зображення.", "Оптична сила системи тонких лінз, складених впритул, дорівнює сумі їхніх оптичних сил: D = D₁ + D₂. Знаючи D₁ збиральної лінзи (з попередньої роботи) і вимірявши D системи, знаходимо D₂ = D − D₁ — вона має вийти від’ємною."], "ul": ["Збиральна лінза має бути «сильнішою»: |D₁| > |D₂|, інакше система не дасть дійсного зображення.", "D системи визначають так само, як для збиральної лінзи: 1/F = 1/d + 1/f.", "F₂ = 1/D₂ — від’ємна, бо фокус розсіювальної лінзи уявний.", "Вдома розсіювальну лінзу можна взяти з окулярів для короткозорих (позначка «−»)."]}, {"h": "Дистанційний формат і безпека", "p": ["Роботу можна безпечно виконати вдома, якщо є лупа (сильна збиральна лінза) і окуляри з розсіювальними лінзами, наприклад старі окуляри когось із родини (обов’язково з дозволу власника). Лінзи тримайте впритул одна до одної.", "Якщо таких лінз немає, виконайте роботу у віртуальній лабораторії PhET «Геометрична оптика» (Geometric Optics), обравши увігнуту лінзу, і з’ясуйте положення уявного зображення."], "ul": ["Не дивіться крізь лінзи на Сонце і не фокусуйте сонячне світло.", "Не дряпайте лінзи окулярів, тримайте їх за оправу, кладіть лінзами догори.", "Свічку замінюйте ліхтариком.", "Перед роботою протріть лінзи м’якою серветкою."]}], "formulas": [{"f": "D = D₁ + D₂", "d": "D — оптична сила системи, D₁ — збиральної лінзи, D₂ — розсіювальної"}, {"f": "D₂ = D − D₁", "d": "оптична сила розсіювальної лінзи (має бути від’ємною)"}, {"f": "D = 1/d + 1/f", "d": "оптична сила системи за вимірюваннями d і f (у метрах)"}, {"f": "F₂ = 1/D₂", "d": "фокусна відстань розсіювальної лінзи, від’ємна"}], "terms": [["Розсіювальна лінза", "лінза, після якої паралельний пучок променів стає розбіжним."], ["Уявний фокус", "точка, у якій перетинаються продовження променів, що після розсіювальної лінзи розходяться."], ["Система лінз", "кілька лінз, розташованих на спільній головній оптичній осі."], ["Діоптрія", "одиниця оптичної сили; 1 дптр — оптична сила лінзи з фокусною відстанню 1 м."]], "examples": [], "lab": {"goal": "Визначити оптичну силу і фокусну відстань розсіювальної лінзи методом складання її впритул зі збиральною лінзою відомої оптичної сили.", "equip": ["збиральна лінза з відомою оптичною силою D₁ (лупа з попередньої роботи)", "розсіювальна лінза (лінза окулярів для короткозорих)", "екран (білий картон)", "ліхтарик з паперовою фігуркою на склі", "лінійка або рулетка", "калькулятор"], "safety": ["Не дивіться крізь лінзи на Сонце, не фокусуйте сонячні промені.", "Тримайте лінзи за оправу, не впустіть скло.", "Окуляри беріть лише з дозволу власника й обережно поверніть після роботи.", "Працюйте на стійкому столі."], "steps": ["Якщо D₁ збиральної лінзи невідома, визначте її, як у лабораторній роботі № 8.", "Складіть впритул збиральну і розсіювальну лінзи (наприклад, прикладіть лупу до лінзи окулярів).", "Розташуйте ліхтарик з фігуркою перед системою, а екран — за нею.", "Переміщуючи екран, отримайте чітке зображення фігурки; виміряйте відстані d і f.", "Повторіть вимірювання для ще двох значень d.", "Переконайтеся, що зображення системи розташоване далі від лінзи, ніж для однієї збиральної лінзи за того самого d, — система «слабша»."], "calc": ["Обчисліть оптичну силу системи D = 1/d + 1/f для кожного досліду (d і f у метрах) і знайдіть середнє.", "Знайдіть оптичну силу розсіювальної лінзи D₂ = D − D₁.", "Обчисліть фокусну відстань F₂ = 1/D₂.", "Якщо лінза з окулярів, порівняйте D₂ зі значенням у рецепті (якщо воно відоме)."], "table": ["№ досліду", "d, м", "f, м", "D, дптр", "D_сер, дптр", "D₁, дптр", "D₂ = D − D₁, дптр", "F₂, м"], "sample": "Очікується, що оптична сила системи буде меншою за оптичну силу самої збиральної лінзи, а обчислене D₂ вийде від’ємним; для лінз окулярів від короткозорості зазвичай це кілька діоптрій зі знаком «−».", "questions": ["Чому зображення, утворене однією розсіювальною лінзою, не можна отримати на екрані?", "Навіщо збиральна лінза в системі має бути сильнішою за розсіювальну?", "Чому значення D₂ вийшло від’ємним?", "Як зміниться положення зображення, якщо прибрати розсіювальну лінзу?", "Окуляри мають D = −3 дптр. Яка їхня фокусна відстань?"]}, "f": "Числа на рецептах окулярів — це саме оптична сила лінз у діоптріях: знак «−» означає розсіювальні лінзи для короткозорих, знак «+» — збиральні для далекозорих.", "pr": ["Оформіть звіт: мета, обладнання, схема, таблиця, обчислення D, D₂ і F₂, висновок.", "Якщо немає обладнання — виконайте роботу у віртуальній лабораторії PhET «Геометрична оптика» (Geometric Optics): оберіть увігнуту лінзу, для трьох положень предмета запишіть положення уявного зображення та перевірте формулу тонкої лінзи зі знаком «−»."], "qz": [{"q": "Оптична сила системи 2 дптр, збиральної лінзи 6 дптр. Яка оптична сила розсіювальної лінзи?", "o": ["8 дптр", "−4 дптр", "4 дптр", "−8 дптр"], "a": 1, "why": "D₂ = D − D₁ = 2 − 6 = −4 дптр."}, {"q": "Чому для визначення D₂ потрібна збиральна лінза?", "o": ["Щоб система давала дійсне зображення на екрані", "Щоб лінза не розбилася", "Щоб змінити колір світла", "Збиральна лінза не потрібна"], "a": 0, "why": "Розсіювальна лінза сама дає лише уявні зображення."}, {"q": "D₂ = −5 дптр. Яка фокусна відстань розсіювальної лінзи?", "o": ["5 м", "20 см", "−5 см", "−20 см"], "a": 3, "why": "F₂ = 1/D₂ = 1 : (−5) = −0,2 м = −20 см."}, {"q": "Система лінз: d = 0,5 м, f = 0,5 м. Яка її оптична сила?", "o": ["1 дптр", "2 дптр", "4 дптр", "0,25 дптр"], "a": 2, "why": "D = 1/0,5 + 1/0,5 = 2 + 2 = 4 дптр."}, {"q": "Що станеться, якщо |D₂| > D₁?", "o": ["Система стане розсіювальною і не дасть зображення на екрані", "Зображення стане більшим", "Нічого не зміниться", "Система дасть дійсне зображення ближче до лінзи"], "a": 0, "why": "Сума D₁ + D₂ стане від’ємною, а розсіювальна система не дає дійсних зображень."}, {"q": "Окуляри з позначкою «−2» — це…", "o": ["збиральні лінзи для далекозорих", "лінзи без оптичної сили", "збиральні лінзи з F = 2 м", "розсіювальні лінзи для короткозорих"], "a": 3, "why": "Знак «−» означає розсіювальну лінзу (D < 0), її використовують при короткозорості."}]}, {"n": "68", "type": "theory", "t": "Око як оптичний прилад, зір і бачення. Вади зору та їх корекція", "gr": "ГР2", "g": "З’ясувати, як влаштоване око, як воно утворює зображення, які бувають вади зору та як їх виправляють лінзами.", "blocks": [{"h": "Будова ока", "p": ["Око — природний оптичний прилад. Світло проходить крізь прозору рогівку, зіницю (отвір у райдужній оболонці), кришталик і склисте тіло та потрапляє на сітківку — шар світлочутливих клітин на задній стінці ока.", "Рогівка й кришталик разом діють як збиральна лінза: на сітківці утворюється дійсне, зменшене і перевернуте зображення. Сигнали від сітківки зоровим нервом ідуть до мозку, який «перевертає» картинку і поєднує зображення з обох очей."], "ul": ["Рогівка — прозора опукла передня оболонка, найбільше заломлює світло.", "Райдужна оболонка визначає колір очей і змінює розмір зіниці залежно від освітленості.", "Кришталик — еластична двоопукла лінза, яка може змінювати кривизну.", "Сітківка містить палички (сутінковий зір) і колбочки (кольоровий зір).", "Жовта пляма — місце найчіткішого бачення, сліпа пляма — місце виходу зорового нерва, де світлочутливих клітин немає."]}, {"h": "Акомодація і бачення", "p": ["Відстань від кришталика до сітківки стала, тому, щоб чітко бачити і далекі, і близькі предмети, око змінює оптичну силу кришталика. Цю здатність називають акомодацією: м’язи роблять кришталик опуклішим, коли ми дивимося зблизька, і пласкішим — коли вдалину.", "Нормальне око без напруження бачить далекі предмети; найзручніше розглядати дрібні деталі на відстані найкращого зору — близько 25 см."], "ul": ["Відстань найкращого зору для нормального ока ≈ 25 см.", "Двома очима ми бачимо об’ємно (бінокулярний зір) і оцінюємо відстані.", "Зорове відчуття зберігається приблизно 0,1 с — тому кадри фільму зливаються в рух.", "Тривала робота зблизька перевтомлює м’язи ока."]}, {"h": "Короткозорість і далекозорість", "p": ["У короткозорого ока зображення далеких предметів утворюється перед сітківкою: око надто сильно заломлює світло або має видовжену форму. Людина добре бачить зблизька, а вдалину — розмито. Короткозорість виправляють окулярами або контактними лінзами з розсіювальними лінзами (D < 0).", "У далекозорого ока зображення утворюється за сітківкою: людині важко розглядати близькі предмети. Її виправляють збиральними лінзами (D > 0). З віком кришталик втрачає еластичність, і в багатьох людей після 40–45 років розвивається вікова далекозорість."], "ul": ["Короткозорість — фокус перед сітківкою, окуляри «−».", "Далекозорість — фокус за сітківкою, окуляри «+».", "Вади зору також виправляють лазерною корекцією рогівки (за рішенням лікаря).", "Окуляри підбирає лише лікар-офтальмолог або оптометрист."]}, {"h": "Гігієна зору", "p": ["Зір легко зіпсувати, особливо під час навчання за комп’ютером. Дотримання простих правил допомагає зберегти його надовго.", "Регулярно перевіряйте зір у лікаря: вади, виявлені рано, легше виправити."], "ul": ["Тримайте книжку або екран на відстані 30–40 см від очей.", "Робіть перерви: кожні 20 хвилин подивіться на щось далеке хоча б 20 секунд.", "Працюйте за доброго освітлення, без відблисків на екрані.", "Не читайте лежачи і в транспорті, що трясеться.", "Більше бувайте надворі, особливо вдень."]}], "formulas": [{"f": "D = 1/F", "d": "оптична сила лінзи окулярів, дптр"}, {"f": "D = −1/d_дал", "d": "оптична сила окулярів для короткозорого ока, де d_дал (м) — найбільша відстань, на якій людина бачить чітко (наближена оцінка)"}], "terms": [["Сітківка", "внутрішня оболонка ока зі світлочутливими клітинами, на якій утворюється зображення."], ["Кришталик", "прозоре еластичне тіло ока у формі двоопуклої лінзи, що може змінювати свою оптичну силу."], ["Акомодація", "здатність ока змінювати оптичну силу кришталика для чіткого бачення предметів на різних відстанях."], ["Відстань найкращого зору", "відстань, на якій нормальне око розглядає дрібні деталі з найменшим напруженням, ≈ 25 см."], ["Короткозорість", "вада зору, за якої зображення далеких предметів утворюється перед сітківкою."], ["Далекозорість", "вада зору, за якої зображення близьких предметів утворюється за сітківкою."], ["Сліпа пляма", "ділянка сітківки в місці виходу зорового нерва, нечутлива до світла."]], "examples": [{"q": "Короткозора людина чітко бачить предмети не далі ніж на 50 см. Окуляри якої оптичної сили їй потрібні, щоб бачити далекі предмети?", "s": ["Дано: d_дал = 50 см = 0,5 м.", "Розв’язання: розсіювальна лінза має давати уявне зображення далеких предметів на відстані 0,5 м, тобто її фокус F = −0,5 м.", "D = 1/F = 1 : (−0,5 м) = −2 дптр.", "Відповідь: окуляри −2 дптр (розсіювальні лінзи)."]}, {"q": "Окуляри для читання мають оптичну силу +2,5 дптр. Знайдіть фокусну відстань лінз і вкажіть ваду зору.", "s": ["Дано: D = 2,5 дптр.", "Розв’язання: F = 1/D = 1 : 2,5 = 0,4 м = 40 см.", "D > 0 — лінзи збиральні, вони виправляють далекозорість.", "Відповідь: F = 40 см; окуляри для далекозорих."]}], "lab": null, "f": "Сліпу пляму легко виявити самостійно: намалюйте на папері хрестик і на відстані 7–8 см праворуч крапку, закрийте ліве око, дивіться правим на хрестик і повільно наближайте аркуш — на певній відстані крапка зникне.", "pr": ["Виконайте дослід зі сліпою плямою (див. «Цікавий факт»). Виміряйте, на якій відстані від очей зникає крапка, і поясніть, чому в повсякденному житті ми не помічаємо сліпої плями.", "Запитайте в рідних, які окуляри вони носять (оптична сила). Визначте тип лінз, їхню фокусну відстань і ваду зору, яку вони виправляють. Оформіть у вигляді таблиці."], "qz": [{"q": "Яке зображення утворюється на сітківці ока?", "o": ["Уявне, пряме, збільшене", "Дійсне, пряме, збільшене", "Уявне, перевернуте, зменшене", "Дійсне, перевернуте, зменшене"], "a": 3, "why": "Оптична система ока діє як збиральна лінза з d > 2F."}, {"q": "Що таке акомодація?", "o": ["Здатність ока змінювати оптичну силу кришталика", "Зміна кольору очей", "Звуження зіниці в темряві", "Сльозовиділення"], "a": 0, "why": "Акомодація — це зміна кривизни (оптичної сили) кришталика."}, {"q": "Де утворюється зображення далеких предметів у короткозорому оці?", "o": ["На сітківці", "За сітківкою", "Перед сітківкою", "На рогівці"], "a": 2, "why": "Короткозоре око надто сильно заломлює світло, і фокус опиняється перед сітківкою."}, {"q": "Які лінзи виправляють далекозорість?", "o": ["Розсіювальні", "Збиральні", "Плоскі", "Будь-які"], "a": 1, "why": "Збиральна лінза додає оптичної сили, і зображення переміщується на сітківку."}, {"q": "Окуляри −4 дптр. Яка фокусна відстань лінз?", "o": ["−25 см", "−4 см", "40 см", "4 м"], "a": 0, "why": "F = 1/D = 1 : (−4) = −0,25 м."}, {"q": "Яка відстань найкращого зору для нормального ока?", "o": ["5 см", "1 м", "10 м", "≈ 25 см"], "a": 3, "why": "Нормальне око найзручніше розглядає дрібні деталі на відстані близько 25 см."}, {"q": "Які клітини сітківки відповідають за кольоровий зір?", "o": ["Палички", "Нейрони мозку", "Колбочки", "Клітини рогівки"], "a": 2, "why": "Кольори сприймають колбочки, а палички працюють у сутінках."}, {"q": "Чому в сутінках погано розрізняємо кольори?", "o": ["Зіниця закривається", "В умовах слабкого освітлення працюють переважно палички, які не розрізняють кольорів", "Кришталик мутніє", "Світло стає монохроматичним"], "a": 1, "why": "Колбочкам потрібно більше світла, тому в сутінках зір стає майже «чорно-білим»."}]}, {"n": "69", "type": "lab", "t": "Лабораторна робота № 10 «Виготовлення моделі оптичного пристрою (перископа, калейдоскопа, мікроскопа тощо)»", "gr": "ГР1", "g": "Виготовити діючу модель простого оптичного пристрою, пояснити хід променів у ній і застосувати знання про відбивання та заломлення світла.", "blocks": [{"h": "Теорія до роботи", "p": ["Перископ складається з двох плоских дзеркал, розташованих паралельно одне одному під кутом 45° до осі труби. Світло, відбившись від верхнього дзеркала, іде вниз, відбивається від нижнього і потрапляє в око — так можна бачити через перешкоду. Калейдоскоп — це два-три дзеркала, складені під кутом; багаторазове відбивання від них створює симетричні візерунки з кольорових скелець.", "Найпростіший мікроскоп і телескоп складаються з двох збиральних лінз — об’єктива та окуляра. У мікроскопі об’єктив має малу фокусну відстань і дає дійсне збільшене зображення, яке розглядають крізь окуляр, як крізь лупу; у телескопі-рефракторі об’єктив має велику фокусну відстань."], "ul": ["Перископ: два дзеркала під кутом 45°, зображення пряме.", "Калейдоскоп: кількість зображень між двома дзеркалами N = 360°/φ − 1; при φ = 60° — 5 зображень плюс предмет утворюють шестипроменеву симетрію.", "Мікроскоп: короткофокусний об’єктив + окуляр-лупа.", "Телескоп Кеплера: довгофокусний об’єктив + короткофокусний окуляр; зображення перевернуте.", "Вибирайте модель залежно від наявних матеріалів."]}, {"h": "Дистанційний формат і безпека", "p": ["Перископ і калейдоскоп повністю безпечно виготовити вдома з картону, скотчу та невеликих дзеркалець або дзеркальної плівки. Модель телескопа можна зробити з двох лінз (лінза від окулярів «+» як об’єктив і лупа як окуляр) та двох картонних трубок, що вставляються одна в одну.", "Роботу з ножем для паперу або склом виконуйте лише під наглядом дорослих. Якщо немає матеріалів, змоделюйте хід променів у віртуальній лабораторії PhET «Геометрична оптика» (Geometric Optics) і виконайте детальне креслення моделі."], "ul": ["Замість скляних дзеркал краще використовувати дзеркальний пластик або фольгований картон.", "Краї скляних дзеркал обклеюйте скотчем.", "Різати картон ножем — лише з дорослими, ножицями — обережно.", "Ніколи не дивіться у саморобний телескоп чи перископ на Сонце."]}], "formulas": [{"f": "β = α", "d": "закон відбивання; у перископі α = 45°, тому промінь повертає на 90°"}, {"f": "N = 360°/φ − 1", "d": "N — кількість зображень предмета між двома дзеркалами, φ — кут між дзеркалами"}, {"f": "D = 1/F", "d": "оптична сила лінз об’єктива й окуляра"}, {"f": "Γ ≈ F_об/F_ок", "d": "кутове збільшення телескопа: F_об — фокусна відстань об’єктива, F_ок — окуляра"}], "terms": [["Перископ", "оптичний прилад з двох дзеркал або призм для спостереження через перешкоду."], ["Калейдоскоп", "оптична іграшка з кількох дзеркал, у якій багаторазове відбивання створює симетричні візерунки."], ["Об’єктив", "лінза або система лінз приладу, звернена до предмета."], ["Окуляр", "лінза або система лінз приладу, крізь яку дивиться спостерігач."]], "examples": [], "lab": {"goal": "Виготовити діючу модель оптичного пристрою (перископа, калейдоскопа або телескопа), перевірити її роботу та пояснити хід променів.", "equip": ["щільний картон або коробка з-під соку чи молока", "2–3 невеликі дзеркальця або дзеркальна плівка", "для телескопа: лінза від окулярів «+» та лупа, дві картонні трубки", "ножиці, скотч, клей, лінійка, транспортир, олівець", "кольорові намистинки чи шматочки прозорого кольорового пластику (для калейдоскопа)"], "safety": ["Працюйте з ножицями і ножем обережно; ніж — лише з дорослими.", "Не використовуйте розбиті дзеркала, обклейте краї скотчем.", "Не дивіться крізь модель на Сонце.", "Прибирайте дрібні деталі, щоб їх не проковтнули молодші діти чи тварини."], "steps": ["Оберіть пристрій і накресліть його схему з ходом променів.", "Перископ: виріжте з картону трубу-коробку довжиною 30–40 см; на протилежних боках зверху і знизу зробіть віконця.", "Закріпіть дзеркала всередині під кутом 45° до осі труби паралельно одне одному (кут перевірте транспортиром) так, щоб світло з верхнього віконця відбивалося вниз до нижнього.", "Калейдоскоп: складіть три однакові смужки дзеркального пластику у трикутну призму (кут 60°) дзеркальним боком усередину, обмотайте скотчем; один кінець закрийте прозорою кришечкою з кольоровими намистинками і калькою, на другий — картон з отвором для ока.", "Телескоп: закріпіть лінзу з більшою фокусною відстанню в торці ширшої трубки (об’єктив), лупу — у вужчій трубці (окуляр); вставте трубки одна в одну так, щоб відстань між лінзами була приблизно F_об + F_ок.", "Перевірте роботу моделі: роздивіться предмет через перешкоду (перископ), візерунки (калейдоскоп) чи віддалений будинок або дерево (телескоп); за потреби відрегулюйте кути чи відстань між лінзами.", "Сфотографуйте модель і запишіть свої спостереження."], "calc": ["Для перископа: перевірте, що α = β = 45° і промінь повертає на 90° на кожному дзеркалі.", "Для калейдоскопа: обчисліть N = 360°/φ − 1 і порівняйте з кількістю зображень, яку бачите.", "Для телескопа: визначте фокусні відстані лінз (як у ЛР № 8) і оцініть збільшення Γ ≈ F_об/F_ок.", "Опишіть характер зображення в моделі (пряме чи перевернуте, збільшене чи ні)."], "table": ["Пристрій", "Основні елементи", "Кут між дзеркалами або фокусні відстані", "Розрахунок", "Характер зображення", "Спостереження"], "sample": "Очікується, що перископ даватиме пряме зображення предметів, розташованих вище перешкоди; калейдоскоп із кутом 60° — візерунок із шестипроменевою симетрією; модель телескопа — перевернуте збільшене зображення віддалених предметів.", "questions": ["Чому дзеркала в перископі розташовують під кутом 45°?", "Скільки зображень дадуть два дзеркала під кутом 90°?", "Чому зображення в моделі телескопа Кеплера перевернуте?", "Де використовують перископи в сучасному житті?", "Які недоліки має ваша модель і як її можна вдосконалити?"]}, "f": "Перископи використовують не лише на підводних човнах: у бронетехніці перископічні прилади дають змогу екіпажу спостерігати за місцевістю, не висовуючись з-під броні.", "pr": ["Оформіть звіт: обраний пристрій, схема з ходом променів, фото моделі, розрахунки, опис роботи моделі та висновок.", "Якщо немає матеріалів — у віртуальній лабораторії PhET «Геометрична оптика» (Geometric Optics) дослідіть, як лінза дає дійсне збільшене зображення, і виконайте в зошиті детальне креслення перископа з ходом двох променів."], "qz": [{"q": "Під яким кутом до осі труби розташовують дзеркала в перископі?", "o": ["30°", "45°", "60°", "90°"], "a": 1, "why": "При куті 45° кожне дзеркало повертає промінь на 90°."}, {"q": "Скільки зображень предмета дають два дзеркала під кутом 60°?", "o": ["5", "6", "3", "2"], "a": 0, "why": "N = 360°/60° − 1 = 5."}, {"q": "Яке зображення дає перископ з двох плоских дзеркал?", "o": ["Перевернуте", "Зменшене вдвічі", "Збільшене", "Пряме"], "a": 3, "why": "Два відбивання від паралельних дзеркал зберігають пряме положення зображення."}, {"q": "З яких лінз складається найпростіший мікроскоп?", "o": ["Із двох розсіювальних", "З однієї розсіювальної", "Із двох збиральних — об’єктива та окуляра", "З дзеркала і лінзи"], "a": 2, "why": "Об’єктив дає дійсне збільшене зображення, а окуляр працює як лупа."}, {"q": "Фокусна відстань об’єктива 50 см, окуляра 5 см. Яке приблизно збільшення телескопа?", "o": ["10", "55", "250", "0,1"], "a": 0, "why": "Γ ≈ F_об/F_ок = 50 : 5 = 10."}, {"q": "Що НЕ можна робити з саморобним телескопом?", "o": ["Дивитися на віддалені дерева", "Дивитися на Сонце", "Регулювати відстань між лінзами", "Фотографувати модель"], "a": 1, "why": "Сфокусоване сонячне світло може миттєво пошкодити око."}]}, {"n": "70", "type": "review", "t": "Узагальнення та систематизація знань", "gr": "ГР3", "g": "Узагальнити знання про світлові явища: поширення, відбивання, заломлення і дисперсію світла, лінзи та оптичні прилади, і підготуватися до підсумкової роботи.", "blocks": [{"h": "Поширення світла", "p": ["В однорідному середовищі світло поширюється прямолінійно; це пояснює утворення тіні й півтіні, сонячні та місячні затемнення. Швидкість світла у вакуумі c ≈ 3·10⁸ м/с — найбільша можлива швидкість.", "Джерела світла бувають природні й штучні, точкові та протяжні. Світловий промінь — лінія, уздовж якої поширюється енергія світла."], "ul": ["Тінь — область, куди світло від джерела не потрапляє.", "Півтінь — область, куди потрапляє світло лише від частини протяжного джерела.", "Сонячне затемнення — Місяць між Сонцем і Землею; місячне — Земля між Сонцем і Місяцем.", "Точкове джерело дає лише тінь, протяжне — тінь і півтінь."]}, {"h": "Відбивання світла", "p": ["Падаючий і відбитий промені та перпендикуляр до поверхні лежать в одній площині, кут відбивання дорівнює куту падіння. Від гладких поверхонь відбивання дзеркальне, від шорсткої — розсіяне.", "Плоске дзеркало дає уявне, пряме зображення такого самого розміру, симетричне предмету відносно дзеркала."], "ul": ["β = α.", "Кути відраховують від перпендикуляра.", "Зображення в плоскому дзеркалі на тій самій відстані за дзеркалом.", "Розсіяне відбивання дає змогу бачити предмети з різних боків."]}, {"h": "Заломлення, повне відбивання, дисперсія", "p": ["На межі двох середовищ світло заломлюється: sin α / sin γ = n₂/n₁. У оптично густішому середовищі промінь наближається до перпендикуляра. Під час переходу в менш густе середовище під кутом, більшим за граничний, відбувається повне внутрішнє відбивання.", "Показник заломлення залежить від кольору світла — це дисперсія. Через неї біле світло розкладається призмою в спектр, а в краплинах дощу утворюється веселка."], "ul": ["n = c/v.", "sin α₀ = 1/n.", "Червоне світло заломлюється найменше, фіолетове — найбільше.", "Колір предмета визначається світлом, яке він відбиває або пропускає.", "Оптоволокно працює завдяки повному внутрішньому відбиванню."]}, {"h": "Лінзи та оптичні прилади", "p": ["Збиральна лінза має дійсний фокус і додатну оптичну силу, розсіювальна — уявний фокус і від’ємну оптичну силу. Положення зображення знаходять побудовою або за формулою тонкої лінзи.", "Око, фотоапарат, проєктор, лупа, мікроскоп, телескоп — оптичні системи з лінз. Вади зору виправляють окулярами: короткозорість — розсіювальними, далекозорість — збиральними."], "ul": ["D = 1/F; 1/F = 1/d + 1/f; Γ = |f|/d.", "d > 2F — зменшене дійсне; F < d < 2F — збільшене дійсне; d < F — уявне збільшене.", "Розсіювальна лінза завжди дає уявне, пряме, зменшене зображення.", "Акомодація — зміна оптичної сили кришталика."]}, {"h": "Типові помилки", "p": ["Більшість помилок у задачах з оптики пов’язані з неправильним відліком кутів, забутими знаками і переведенням одиниць.", "Звіряйте відповідь із побудовою: вона швидко покаже, чи правильно визначено тип зображення."], "ul": ["Кути відраховують від поверхні, а не від перпендикуляра.", "Для розсіювальної лінзи забувають знак «−» у F і D.", "Обчислюють D, підставляючи F у сантиметрах, а не в метрах.", "Плутають: дійсне зображення завжди перевернуте, уявне — пряме.", "Вважають, що повне відбивання можливе при переході в оптично густіше середовище.", "Думають, що під час переходу в інше середовище змінюється частота (колір) світла."]}], "formulas": [{"f": "β = α", "d": "закон відбивання світла"}, {"f": "sin α / sin γ = n₂₁ = n₂/n₁", "d": "закон заломлення світла"}, {"f": "n = c/v", "d": "абсолютний показник заломлення; c ≈ 3·10⁸ м/с"}, {"f": "sin α₀ = 1/n", "d": "граничний кут повного відбивання на межі з повітрям"}, {"f": "c = λ₀·ν; λ = λ₀/n", "d": "зв’язок довжини хвилі і частоти; довжина хвилі в середовищі"}, {"f": "D = 1/F", "d": "оптична сила лінзи"}, {"f": "1/F = 1/d + 1/f", "d": "формула тонкої лінзи"}, {"f": "Γ = H/h = |f|/d", "d": "лінійне збільшення"}, {"f": "D = D₁ + D₂", "d": "оптична сила системи лінз, складених впритул"}], "terms": [["Світловий промінь", "лінія, уздовж якої поширюється енергія світла."], ["Тінь", "область простору, куди не потрапляє світло від джерела."], ["Відбивання світла", "повернення світла в те саме середовище на межі поділу двох середовищ."], ["Заломлення світла", "зміна напрямку поширення світла на межі поділу двох прозорих середовищ."], ["Показник заломлення", "величина, що показує, у скільки разів швидкість світла в середовищі менша, ніж у вакуумі."], ["Повне внутрішнє відбивання", "відбивання всього світла на межі з оптично менш густим середовищем при кутах падіння, більших за граничний."], ["Дисперсія світла", "залежність показника заломлення від частоти (кольору) світла."], ["Фокус лінзи", "точка, у якій після лінзи перетинаються промені (або їх продовження), що падали паралельно головній оптичній осі."], ["Оптична сила лінзи", "величина, обернена до фокусної відстані лінзи."], ["Акомодація", "здатність ока змінювати оптичну силу кришталика."]], "examples": [{"q": "Промінь падає з повітря на скляну пластину (n = 1,5) під кутом 60°. Знайдіть кут заломлення і кут між відбитим і заломленим променями.", "s": ["Дано: α = 60°, n = 1,5.", "Розв’язання: sin γ = sin α / n = 0,866 : 1,5 ≈ 0,577, γ ≈ 35°.", "Кут відбивання β = α = 60°. Відбитий промінь утворює з поверхнею кут 90° − 60° = 30°, заломлений — 90° − 35° = 55°.", "Кут між відбитим і заломленим променями: 30° + 55° ≈ 85° (або 180° − 60° − 35°).", "Відповідь: γ ≈ 35°; кут між променями ≈ 85°."]}, {"q": "Предмет висотою 2 см розташований на відстані 15 см від збиральної лінзи з фокусною відстанню 10 см. Знайдіть оптичну силу лінзи, положення зображення, його висоту та охарактеризуйте його.", "s": ["Дано: h = 2 см, d = 15 см, F = 10 см.", "СІ: F = 0,1 м.", "Розв’язання: D = 1/F = 1 : 0,1 м = 10 дптр.", "1/f = 1/10 − 1/15 = 3/30 − 2/30 = 1/30, f = 30 см.", "Γ = f/d = 30 : 15 = 2; H = Γ·h = 4 см.", "Відповідь: D = 10 дптр, f = 30 см, H = 4 см; зображення дійсне, перевернуте, збільшене (F < d < 2F)."]}], "lab": null, "f": "Світло від Сонця досягає Землі приблизно за 8 хвилин 20 секунд, тож ми завжди бачимо Сонце таким, яким воно було кілька хвилин тому.", "pr": ["Складіть опорну схему (інтелект-карту) розділу «Світлові явища»: поширення, відбивання, заломлення, дисперсія, лінзи, око й оптичні прилади — з формулами та прикладами.", "Розв’яжіть задачу: світло переходить зі скла (n = 1,6) у воду (n = 1,33). Чи можливе на цій межі повне внутрішнє відбивання? Якщо так, обчисліть граничний кут."], "qz": [{"q": "Яке явище пояснює утворення тіні?", "o": ["Дисперсія", "Прямолінійне поширення світла", "Заломлення", "Повне відбивання"], "a": 1, "why": "Непрозоре тіло затримує промені, що поширюються прямолінійно."}, {"q": "Кут між падаючим променем і дзеркалом 30°. Чому дорівнює кут відбивання?", "o": ["30°", "120°", "60°", "90°"], "a": 2, "why": "Кут падіння відраховують від перпендикуляра: 90° − 30° = 60° = β."}, {"q": "Швидкість світла в склі 2·10⁸ м/с. Який показник заломлення?", "o": ["1,5", "2", "0,67", "6"], "a": 0, "why": "n = c/v = 3·10⁸ : 2·10⁸ = 1,5."}, {"q": "Граничний кут для середовища 30°. Який його показник заломлення?", "o": ["1,5", "3", "0,5", "2"], "a": 3, "why": "n = 1/sin α₀ = 1 : 0,5 = 2."}, {"q": "Чому біле світло розкладається призмою в спектр?", "o": ["Призма фарбує світло", "Через повне відбивання", "Показник заломлення скла різний для різних кольорів", "Через поглинання"], "a": 2, "why": "Це дисперсія: різні кольори заломлюються під різними кутами."}, {"q": "Оптична сила лінзи −2,5 дптр. Що це за лінза і яка її фокусна відстань?", "o": ["Розсіювальна, −40 см", "Збиральна, 40 см", "Розсіювальна, −2,5 см", "Збиральна, 25 см"], "a": 0, "why": "D < 0 — розсіювальна; F = 1 : (−2,5) = −0,4 м."}, {"q": "d = 20 см, F = 10 см. Яке зображення дає збиральна лінза?", "o": ["Уявне, збільшене", "Дійсне, перевернуте, такого самого розміру", "Дійсне, зменшене", "Зображення немає"], "a": 1, "why": "d = 2F, тому f = 2F = 20 см і Γ = 1."}, {"q": "Яку ваду зору виправляють збиральними лінзами?", "o": ["Короткозорість", "Дальтонізм", "Сліпу пляму", "Далекозорість"], "a": 3, "why": "Збиральні лінзи додають оптичної сили, переміщуючи зображення на сітківку."}, {"q": "Що не змінюється під час переходу світла з повітря в скло?", "o": ["Частота", "Швидкість", "Довжина хвилі", "Напрямок при α ≠ 0"], "a": 0, "why": "Частота визначається джерелом і не змінюється на межі середовищ."}, {"q": "Лінзи +6 дптр і −2 дптр склали впритул. Яка фокусна відстань системи?", "o": ["4 см", "25 см", "12,5 см", "−50 см"], "a": 1, "why": "D = 6 − 2 = 4 дптр, F = 1 : 4 = 0,25 м."}]}, {"n": "71", "type": "test", "t": "Комплексна підсумкова робота № 4 з теми «Світлові явища»", "gr": "ГР1, ГР2, ГР3", "g": "Перевірити знання і вміння з теми «Світлові явища» та підготуватися до підсумкової роботи за тренувальними завданнями.", "blocks": [{"h": "Що перевіряє підсумкова робота", "p": ["Робота перевіряє, наскільки ви розумієте світлові явища і вмієте застосовувати закони геометричної оптики. Завдання охоплюють увесь розділ — від прямолінійного поширення світла до оптичних приладів і ока.", "Потрібно не лише знати означення та формули, а й пояснювати явища з життя, будувати зображення і розв’язувати розрахункові задачі."], "ul": ["Прямолінійне поширення світла, тінь, затемнення.", "Закони відбивання, плоске дзеркало.", "Закони заломлення, показник заломлення, повне внутрішнє відбивання.", "Дисперсія світла, кольори.", "Лінзи, оптична сила, побудова зображень, формула тонкої лінзи.", "Око, вади зору, оптичні прилади."]}, {"h": "Структура роботи", "p": ["Робота зазвичай складається з трьох частин зростаючої складності. Остаточну кількість завдань і час виконання повідомляє вчитель на платформі."], "ul": ["Тестові завдання з однією правильною відповіддю — означення, закони, якісні питання.", "Завдання на встановлення відповідності — наприклад, «положення предмета — характер зображення» або «величина — одиниця».", "Завдання з короткою відповіддю — прості обчислення за однією формулою.", "Розрахункові задачі з повним оформленням: Дано, СІ, розв’язання, відповідь.", "Завдання на побудову ходу променів або зображення в лінзі."]}, {"h": "Як готуватися", "p": ["Повторіть конспекти уроків 50–70 і узагальнювальний урок, особливо таблицю формул і типові помилки. Розв’яжіть тренувальні задачі нижче та тест для самоперевірки.", "Підготуйте до роботи лінійку, олівець, транспортир і калькулятор; таблиця синусів знадобиться для задач на заломлення."], "ul": ["Вивчіть формули: β = α; sin α / sin γ = n₂/n₁; n = c/v; sin α₀ = 1/n; D = 1/F; 1/F = 1/d + 1/f; Γ = |f|/d.", "Потренуйтеся будувати зображення в збиральній лінзі для d > 2F, F < d < 2F, d < F і в розсіювальній лінзі.", "Запам’ятайте правило знаків для F і f.", "Перевіряйте одиниці: F у метрах для обчислення D.", "Розв’яжіть ще раз задачі уроків 60, 64 і 65."]}, {"h": "Критерії оцінювання", "p": ["Тестові завдання оцінюються за правильну відповідь. Розрахункові задачі — за повноту розв’язання: правильна формула, підстановка, обчислення, одиниці та відповідь.", "Навіть якщо остаточна відповідь неправильна через арифметичну помилку, бали за правильний хід розв’язання зберігаються, тому завжди записуйте всі кроки."], "ul": ["Правильно записано «Дано» і переведено одиниці в СІ.", "Обрано потрібний закон або формулу.", "Виконано правильні перетворення та обчислення.", "Відповідь записано з одиницями й охарактеризовано зображення (якщо треба).", "Побудова виконана акуратно, з позначенням променів і фокусів."]}], "formulas": [{"f": "β = α", "d": "закон відбивання"}, {"f": "sin α / sin γ = n₂/n₁", "d": "закон заломлення"}, {"f": "n = c/v", "d": "абсолютний показник заломлення"}, {"f": "sin α₀ = 1/n", "d": "граничний кут повного відбивання"}, {"f": "c = λ₀·ν", "d": "зв’язок швидкості світла, довжини хвилі та частоти"}, {"f": "D = 1/F", "d": "оптична сила лінзи"}, {"f": "1/F = 1/d + 1/f", "d": "формула тонкої лінзи"}, {"f": "Γ = H/h = |f|/d", "d": "лінійне збільшення"}], "terms": [], "examples": [{"q": "Швидкість світла в деякій рідині 2,25·10⁸ м/с. Знайдіть показник заломлення рідини.", "s": ["Дано: v = 2,25·10⁸ м/с, c = 3·10⁸ м/с.", "Розв’язання: n = c/v = 3·10⁸ : 2,25·10⁸ ≈ 1,33.", "Відповідь: n ≈ 1,33 (як у води)."]}, {"q": "Показник заломлення речовини 1,41. Знайдіть граничний кут повного відбивання на межі цієї речовини з повітрям.", "s": ["Дано: n = 1,41.", "Розв’язання: sin α₀ = 1/n = 1 : 1,41 ≈ 0,709.", "α₀ ≈ 45°.", "Відповідь: α₀ ≈ 45°."]}, {"q": "Предмет розташований на відстані 20 см від збиральної лінзи з фокусною відстанню 15 см. Знайдіть відстань до зображення, збільшення та оптичну си
