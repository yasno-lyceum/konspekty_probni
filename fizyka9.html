 біля загострених провідників у сильному неоднорідному полі."], ["Дуговий розряд", "самостійний розряд із великою силою струму, що підтримується термоелектронною емісією з розжареного катода."], ["Блискавковідвід", "заземлений металевий стрижень, що захищає будівлю від удару блискавки."]], "examples": [{"q": "Грім почули через 6 с після спалаху блискавки. На якій відстані відбувся розряд? Швидкість звуку — 340 м/с.", "s": ["Дано: t = 6 с; v = 340 м/с. Знайти: s.", "Розв’язання: світло доходить майже миттєво, тому s ≈ vt = 340 м/с · 6 с = 2040 м.", "Відповідь: s ≈ 2 км."]}, {"q": "Оцініть заряд, що переносить блискавка, якщо середня сила струму 30 кА, а тривалість розряду 1 мс.", "s": ["Дано: I = 30 кА; t = 1 мс. Знайти: q.", "СІ: I = 3·10⁴ А; t = 1·10⁻³ с.", "Розв’язання: q = It = 3·10⁴ А · 1·10⁻³ с = 30 Кл.", "Відповідь: q ≈ 30 Кл."]}], "lab": null, "f": "Електричну дугу в 1802 р. відкрив Василь Петров, а незалежно від нього — англійський учений Гемфрі Деві, який і дав їй назву «дуга»: гарячий газ піднімається вгору і вигинає світний канал.", "pr": ["Заповніть таблицю «Види самостійних розрядів»: умови виникнення, зовнішній вигляд, застосування (для кожного з чотирьох видів).", "Складіть пам’ятку з 5 правил безпечної поведінки під час грози на вулиці та вдома."], "qz": [{"q": "За якої умови виникає тліючий розряд?", "o": ["За дуже високого тиску", "За низького тиску газу", "Лише у воді", "Лише у вакуумі без газу"], "a": 1, "why": "Тліючий розряд виникає в розріджених газах."}, {"q": "Яким розрядом є блискавка?", "o": ["Іскровим", "Тліючим", "Коронним", "Несамостійним"], "a": 0, "why": "Блискавка — потужний природний іскровий розряд."}, {"q": "Хто відкрив електричну дугу в 1802 р.?", "o": ["Майкл Фарадей", "Бенджамін Франклін", "Василь Петров", "Томас Едісон"], "a": 2, "why": "Дугу відкрив Василь Петров."}, {"q": "Де використовують коронний розряд?", "o": ["У зварюванні", "У лампах розжарення", "В акумуляторах", "В електрофільтрах для очищення газів"], "a": 3, "why": "Коронний розряд заряджає частинки пилу, які потім осідають на електродах."}, {"q": "Грім почули через 3 с після спалаху. Яка відстань до блискавки?", "o": ["≈ 1 км", "≈ 340 м", "≈ 3 км", "≈ 100 м"], "a": 0, "why": "s = 340 · 3 = 1020 м ≈ 1 км."}, {"q": "Що є причиною грому?", "o": ["Зіткнення хмар", "Різке розширення сильно нагрітого повітря в каналі блискавки", "Падіння дощу", "Звук від удару в землю"], "a": 1, "why": "Нагріте до десятків тисяч градусів повітря різко розширюється, утворюючи звукову хвилю."}, {"q": "Чому не можна дивитися на зварювальну дугу без маски?", "o": ["Вона дуже гучна", "Від неї летять іскри у вічі завжди", "Вона випромінює сильний ультрафіолет, що шкодить очам", "Вона створює магнітне поле"], "a": 2, "why": "Ультрафіолет дуги спричиняє опіки сітківки та рогівки."}, {"q": "Що таке «вогні святого Ельма»?", "o": ["Дуговий розряд", "Полярне сяйво", "Тліючий розряд у лампі", "Коронний розряд на загострених предметах"], "a": 3, "why": "Це світіння корони на щоглах і шпилях перед грозою."}]}, {"n": "11", "type": "theory", "t": "Електричний струм у вакуумі. Електронно-вакуумні пристрої", "gr": "ГР2", "g": "З’ясувати, як можна отримати струм у вакуумі, що таке термоелектронна емісія, та ознайомитися з будовою і застосуванням вакуумного діода й електронно-променевої трубки.", "blocks": [{"h": "Чому вакуум не проводить струм і як це змінити", "p": ["Вакуум — це стан газу, за якого тиск настільки малий, що молекули майже не зіштовхуються одна з одною. У вакуумі немає заряджених частинок, тому він — ідеальний ізолятор.", "Щоб отримати струм у вакуумі, туди треба «доставити» заряджені частинки. Найпростіший спосіб — нагріти металевий електрод. Вільні електрони в металі за високої температури мають достатню енергію, щоб вилетіти з його поверхні. Це явище називають термоелектронною емісією."], "ul": ["Носії струму у вакуумі — електрони, випущені катодом.", "Термоелектронна емісія — випромінювання електронів нагрітим металом.", "Що вища температура катода, то більше електронів він випускає.", "Явище спостерігав Томас Едісон у 1883 р., працюючи над лампами розжарення."]}, {"h": "Вакуумний діод", "p": ["Вакуумний діод — скляний або металевий балон, з якого відкачано повітря, а всередині є два електроди: катод (нитка, яку розжарюють) і анод. Якщо анод з’єднати з «+» джерела, електрони від катода летять до анода — у колі є струм. Якщо полярність змінити, анод відштовхує електрони, і струму немає.", "Отже, вакуумний діод пропускає струм лише в одному напрямку. Його використовували для випрямлення змінного струму. Діод винайшов Джон Флемінг у 1904 р., а в 1906 р. Лі де Форест створив тріод, який міг підсилювати сигнали — це заклало основу радіотехніки."], "ul": ["Катод — розжарений електрод, що випускає електрони.", "Анод — електрод, що збирає електрони.", "Одностороння провідність — головна властивість діода.", "Для діода, як і для газового розряду, існує струм насичення.", "Нині вакуумні лампи майже повністю замінили напівпровідникові прилади, але їх і досі використовують у деяких підсилювачах звуку і потужних передавачах."]}, {"h": "Електронні пучки та їхні властивості", "p": ["Електрони, що вилітають з катода, можна розігнати електричним полем і сформувати вузький пучок. Пройшовши прискорювальну напругу U, електрон набуває кінетичної енергії E_k = eU = mv²/2.", "Електронні пучки мають цікаві властивості: вони відхиляються електричним і магнітним полями, спричиняють світіння деяких речовин (люмінофорів), нагрівають тіла, у які влучають, а під час різкого гальмування створюють рентгенівське випромінювання."], "ul": ["Відхиляються електричним полем (до позитивної пластини).", "Відхиляються магнітним полем.", "Спричиняють світіння люмінофорів.", "Нагрівають речовину — застосовують для електронно-променевого зварювання та плавлення.", "Під час гальмування на аноді виникає рентгенівське випромінювання (рентгенівська трубка)."]}, {"h": "Електронно-променева трубка", "p": ["Електронно-променева трубка — вакуумна колба, у вузькій частині якої розміщено електронну гармату (катод і прискорювальні аноди), далі — дві пари відхильних пластин, а на широкому торці — екран, вкритий люмінофором. Керуючи напругою на пластинах, промінь можна спрямувати в будь-яку точку екрана.", "Такі трубки десятиліттями були основою телевізорів (кінескопів), моніторів і осцилографів. Тепер їх замінили рідкокристалічні та світлодіодні екрани, але принцип керування електронним пучком використовують в електронних мікроскопах і прискорювачах."], "ul": ["Електронна гармата створює вузький пучок електронів.", "Відхильні пластини (або котушки) керують напрямком променя.", "Екран з люмінофором світиться там, куди влучає промінь.", "Застосування: осцилографи, старі телевізори й монітори, електронні мікроскопи."]}], "formulas": [{"f": "E_k = eU", "d": "кінетична енергія електрона, прискореного напругою U"}, {"f": "eU = mv²/2", "d": "m = 9,1·10⁻³¹ кг — маса електрона, e = 1,6·10⁻¹⁹ Кл — його заряд"}, {"f": "v = √(2eU/m)", "d": "швидкість електрона після прискорення (якщо початкова швидкість ≈ 0)"}, {"f": "N = It/e", "d": "кількість електронів, що пройшли через переріз за час t при силі струму I"}], "terms": [["Вакуум", "стан сильно розрідженого газу, за якого молекули майже не зіштовхуються одна з одною."], ["Термоелектронна емісія", "явище випромінювання електронів поверхнею нагрітого металу."], ["Вакуумний діод", "електронно-вакуумний прилад із катодом і анодом, що пропускає струм лише в одному напрямку."], ["Електронно-променева трубка", "вакуумний прилад, у якому керований пучок електронів створює зображення на екрані з люмінофором."], ["Люмінофор", "речовина, яка світиться під дією електронів або випромінювання."]], "examples": [{"q": "Якої швидкості набуде електрон, пройшовши прискорювальну напругу 100 В? Початкову швидкість вважайте нульовою.", "s": ["Дано: U = 100 В; e = 1,6·10⁻¹⁹ Кл; m = 9,1·10⁻³¹ кг. Знайти: v.", "Розв’язання: eU = mv²/2 ⇒ v = √(2eU/m) = √(2 · 1,6·10⁻¹⁹ · 100/9,1·10⁻³¹) м/с = √(3,52·10¹³) м/с ≈ 5,9·10⁶ м/с.", "Відповідь: v ≈ 5,9·10⁶ м/с (майже 6000 км/с)."]}, {"q": "Анодний струм вакуумного діода — 10 мА. Скільки електронів щосекунди досягає анода?", "s": ["Дано: I = 10 мА; t = 1 с; e = 1,6·10⁻¹⁹ Кл. Знайти: N.", "СІ: I = 0,01 А.", "Розв’язання: q = It = 0,01 Кл; N = q/e = 0,01 Кл/1,6·10⁻¹⁹ Кл ≈ 6,25·10¹⁶.", "Відповідь: N ≈ 6,3·10¹⁶ електронів."]}], "lab": null, "f": "Деякі сучасні виробники гітарних підсилювачів і досі використовують вакуумні лампи: музиканти цінують особливе «тепле» звучання, яке вони дають під час перевантаження.", "pr": ["Поясніть, чому вакуумний діод пропускає струм лише в одному напрямку. Що станеться, якщо не розжарювати катод?", "Обчисліть кінетичну енергію електрона (у джоулях та електрон-вольтах), прискореного напругою 1000 В."], "qz": [{"q": "Що є носіями струму у вакуумі?", "o": ["Йони газу", "Електрони, випущені катодом", "Протони", "Дірки"], "a": 1, "why": "У вакуумі струм створюють електрони, які випускає катод."}, {"q": "Як називають випромінювання електронів нагрітим металом?", "o": ["Електроліз", "Йонізація", "Термоелектронна емісія", "Рекомбінація"], "a": 2, "why": "Це явище — термоелектронна емісія."}, {"q": "Чому вакуумний діод має односторонню провідність?", "o": ["Електрони випускає лише розжарений катод, і рухаються вони лише до позитивного анода", "Анод не проводить струм", "Вакуум проводить струм лише в один бік", "У ньому є йони"], "a": 0, "why": "Холодний анод електронів не випускає, тому за зворотної полярності струму немає."}, {"q": "Яку енергію набуває електрон, прискорений напругою 50 В?", "o": ["50 Дж", "3,2·10⁻²⁰ Дж", "1,6·10⁻¹⁹ Дж", "8·10⁻¹⁸ Дж"], "a": 3, "why": "E = eU = 1,6·10⁻¹⁹ · 50 = 8·10⁻¹⁸ Дж."}, {"q": "Для чого в електронно-променевій трубці відхильні пластини?", "o": ["Щоб розжарювати катод", "Щоб керувати напрямком електронного пучка", "Щоб відкачати повітря", "Щоб охолоджувати екран"], "a": 1, "why": "Електричне поле пластин відхиляє пучок у потрібну точку екрана."}, {"q": "Що спостерігається, коли швидкі електрони різко гальмують на аноді?", "o": ["Виникає рентгенівське випромінювання", "Електрони зникають", "Утворюються протони", "Анод охолоджується"], "a": 0, "why": "На цьому принципі працює рентгенівська трубка."}, {"q": "Хто винайшов вакуумний діод?", "o": ["Василь Петров", "Майкл Фарадей", "Георг Ом", "Джон Флемінг"], "a": 3, "why": "Вакуумний діод створив Джон Флемінг у 1904 р."}, {"q": "Як зміниться кількість випущених катодом електронів, якщо підвищити його температуру?", "o": ["Зменшиться", "Не зміниться", "Збільшиться", "Стане нульовою"], "a": 2, "why": "Що вища температура, то більше електронів мають енергію для вильоту."}]}, {"n": "12", "type": "theory", "t": "Електричний струм у напівпровідниках. Власна провідність напівпровідників", "gr": "ГР2", "g": "З’ясувати, які речовини належать до напівпровідників, як у них виникає струм і чому їхній опір зменшується під час нагрівання та освітлення.", "blocks": [{"h": "Що таке напівпровідники", "p": ["Напівпровідники — речовини, питомий опір яких більший, ніж у металів, але значно менший, ніж у діелектриків. До них належать кремній, германій, селен, деякі сполуки (наприклад, арсенід галію).", "Головна особливість напівпровідників: їхній опір сильно залежить від зовнішніх умов — температури, освітлення, наявності домішок. Під час нагрівання опір напівпровідника зменшується, тоді як у металів — зростає. Саме ця чутливість зробила напівпровідники основою сучасної електроніки."], "ul": ["Приклади: кремній (Si), германій (Ge), селен, арсенід галію.", "Питомий опір — проміжний між металами і діелектриками.", "Під час нагрівання опір зменшується.", "Під час освітлення опір зменшується.", "Невелика кількість домішок різко змінює провідність."]}, {"h": "Будова кристала кремнію", "p": ["Атом кремнію має чотири валентні (зовнішні) електрони. У кристалі кожен атом пов’язаний із чотирма сусідами: кожна пара сусідніх атомів має два спільні електрони. Такий зв’язок називають ковалентним. За дуже низьких температур усі електрони «зайняті» в зв’язках, і кремній є діелектриком.", "Під час нагрівання або освітлення частина електронів отримує достатньо енергії, щоб розірвати зв’язок і стати вільною. На місці, де був електрон, залишається вакансія з нестачею негативного заряду — дірка. Дірка поводиться як позитивний заряд."], "ul": ["Кремній і германій — чотиривалентні елементи.", "Зв’язок між атомами — ковалентний (парно-електронний).", "Розрив зв’язку дає одразу два носії: вільний електрон і дірку.", "Дірка має позитивний заряд, що за модулем дорівнює заряду електрона."]}, {"h": "Власна провідність", "p": ["У чистому напівпровіднику вільних електронів і дірок однакова кількість. Якщо прикласти напругу, електрони рухаються до «+», а дірки — до «−»: сусідній електрон перескакує в дірку, і дірка ніби «переміщується» у протилежний бік. Провідність чистого напівпровідника, створену рівною кількістю електронів і дірок, називають власною.", "Що вища температура, то більше розірваних зв’язків, а отже, більше носіїв заряду — і менший опір. Одночасно відбувається рекомбінація: вільний електрон заповнює дірку."], "ul": ["Носії струму — електрони і дірки.", "У власному напівпровіднику n(електронів) = n(дірок).", "Власна провідність за кімнатної температури мала.", "З нагріванням кількість носіїв швидко зростає, опір зменшується."]}, {"h": "Терморезистори й фоторезистори", "p": ["Залежність опору напівпровідників від температури використовують у терморезисторах (термісторах). Їх ставлять в електронні термометри, системи керування нагрівачами, датчики температури двигунів, у зарядні пристрої для захисту від перегрівання.", "Залежність опору від освітлення використовують у фоторезисторах. Вони вмикають вуличне освітлення ввечері, працюють у датчиках освітленості й охоронних системах."], "ul": ["Терморезистор — напівпровідниковий прилад, опір якого різко змінюється з температурою.", "Фоторезистор — прилад, опір якого зменшується під час освітлення.", "Електронні медичні термометри працюють завдяки терморезисторам.", "Автоматичні сутінкові вимикачі вуличних ліхтарів працюють завдяки фоторезисторам."]}], "formulas": [{"f": "I = U/R", "d": "закон Ома: за сталої напруги зменшення опору терморезистора збільшує силу струму"}, {"f": "R = ρl/S", "d": "опір провідника: у напівпровідника ρ сильно залежить від температури й освітлення"}], "terms": [["Напівпровідник", "речовина, питомий опір якої проміжний між металами й діелектриками та сильно залежить від температури, освітлення й домішок."], ["Ковалентний зв’язок", "зв’язок між атомами за допомогою спільних пар валентних електронів."], ["Дірка", "вакантне місце в ковалентному зв’язку, що поводиться як позитивний заряд."], ["Власна провідність", "провідність чистого напівпровідника, що створюється однаковою кількістю вільних електронів і дірок."], ["Терморезистор", "напівпровідниковий прилад, опір якого істотно залежить від температури."], ["Фоторезистор", "напівпровідниковий прилад, опір якого зменшується під час освітлення."]], "examples": [{"q": "Терморезистор під’єднано до батарейки з напругою 4 В. За 20 °C його опір — 2000 Ом, а за 60 °C — 500 Ом. У скільки разів зросте сила струму під час нагрівання?", "s": ["Дано: U = 4 В; R₁ = 2000 Ом; R₂ = 500 Ом. Знайти: I₂/I₁.", "Розв’язання: I₁ = U/R₁ = 4 В/2000 Ом = 0,002 А = 2 мА.", "I₂ = U/R₂ = 4 В/500 Ом = 0,008 А = 8 мА.", "I₂/I₁ = 8 мА/2 мА = 4.", "Відповідь: сила струму зросте в 4 рази."]}], "lab": null, "f": "Кремній — другий за поширеністю хімічний елемент у земній корі після кисню: його сполуки становлять основу звичайного піску. Саме з дуже чистого кремнію виготовляють мікросхеми смартфонів і комп’ютерів.", "pr": ["Порівняйте залежність опору від температури для металів і напівпровідників; поясніть причину відмінності.", "Наведіть 3 приклади приладів у вашому домі, у яких, на вашу думку, є терморезистори або фоторезистори, і поясніть їхню роль."], "qz": [{"q": "Що з переліченого є напівпровідником?", "o": ["Мідь", "Скло", "Кремній", "Срібло"], "a": 2, "why": "Кремній — найпоширеніший напівпровідник."}, {"q": "Як змінюється опір напівпровідника під час нагрівання?", "o": ["Зменшується", "Зростає", "Не змінюється", "Стає нульовим"], "a": 0, "why": "Розривається більше зв’язків, з’являється більше носіїв, опір зменшується."}, {"q": "Що таке дірка в напівпровіднику?", "o": ["Отвір у кристалі", "Вільний протон", "Негативний йон", "Вакантне місце в зв’язку, що поводиться як позитивний заряд"], "a": 3, "why": "Дірка — місце, звідки пішов електрон; вона має позитивний заряд."}, {"q": "Що є носіями струму в чистому напівпровіднику?", "o": ["Лише йони", "Електрони і дірки", "Лише дірки", "Лише протони"], "a": 1, "why": "Власна провідність створюється електронами і дірками."}, {"q": "Скільки валентних електронів має атом кремнію?", "o": ["Один", "Три", "Чотири", "П’ять"], "a": 2, "why": "Кремній — елемент IV групи, має 4 валентні електрони."}, {"q": "Який прилад вмикає вуличне освітлення, коли темніє?", "o": ["Фоторезистор", "Терморезистор", "Реостат", "Запобіжник"], "a": 0, "why": "Опір фоторезистора залежить від освітленості."}, {"q": "Терморезистор із напругою 6 В має опір 3000 Ом. Яка сила струму?", "o": ["18 кА", "500 мА", "0,5 мА", "2 мА"], "a": 3, "why": "I = 6/3000 = 0,002 А = 2 мА."}, {"q": "У чистому напівпровіднику кількість вільних електронів…", "o": ["більша за кількість дірок", "дорівнює кількості дірок", "менша за кількість дірок", "дорівнює нулю за будь-якої температури"], "a": 1, "why": "Кожен розрив зв’язку дає одну пару «електрон — дірка»."}]}, {"n": "13", "type": "theory", "t": "Домішкова провідність напівпровідників. Електронно-дірковий перехід", "gr": "ГР2, ГР3", "g": "З’ясувати, як домішки змінюють провідність напівпровідників, що таке p–n-перехід і як працює напівпровідниковий діод.", "blocks": [{"h": "Донорні домішки: напівпровідник n-типу", "p": ["Якщо в кристал кремнію додати трохи п’ятивалентного елемента (фосфору, арсену чи сурми), то чотири його електрони утворять зв’язки із сусідами, а п’ятий залишиться «зайвим» і легко стане вільним. Такі домішки називають донорними (вони «дарують» електрони).", "У такому напівпровіднику вільних електронів набагато більше, ніж дірок. Електрони є основними носіями, дірки — неосновними. Це напівпровідник n-типу (від лат. negativus — негативний)."], "ul": ["Донорна домішка — п’ятивалентна (P, As, Sb).", "Основні носії — електрони.", "Неосновні носії — дірки.", "Навіть дуже мала частка домішки (один атом на мільйони атомів кремнію) у багато разів збільшує провідність."]}, {"h": "Акцепторні домішки: напівпровідник p-типу", "p": ["Якщо додати тривалентний елемент (бор, алюміній, галій, індій), то для одного зі зв’язків йому бракуватиме електрона — утвориться дірка. Такі домішки «забирають» електрони від сусідніх атомів, тому їх називають акцепторними.", "У такому напівпровіднику основні носії — дірки, а неосновні — електрони. Це напівпровідник p-типу (від лат. positivus — позитивний). Важливо: і n-, і p-напівпровідник загалом електрично нейтральні."], "ul": ["Акцепторна домішка — тривалентна (B, Al, Ga, In).", "Основні носії — дірки.", "Неосновні носії — електрони.", "Домішкова провідність значно більша за власну."]}, {"h": "Електронно-дірковий (p–n) перехід", "p": ["Якщо в одному кристалі створити дві області — p- і n-типу, на межі між ними утвориться p–n-перехід. Електрони з n-області дифундують у p-область, а дірки — у n-область і рекомбінують. У результаті біля межі майже не залишається вільних носіїв — виникає запірний шар з великим опором.", "Якщо до p-області під’єднати «+», а до n-області «−» (пряме вмикання), запірний шар звужується, і через перехід іде великий струм. Якщо полярність змінити (зворотне вмикання), запірний шар розширюється, і струм майже відсутній. Отже, p–n-перехід має односторонню провідність."], "ul": ["Пряме вмикання: «+» на p, «−» на n — опір малий, струм великий.", "Зворотне вмикання: «+» на n, «−» на p — опір дуже великий, струм дуже малий.", "Прилад з одним p–n-переходом — напівпровідниковий діод.", "На схемах діод позначають трикутником зі смужкою: трикутник показує напрям струму."]}, {"h": "Застосування напівпровідникових приладів", "p": ["Діоди випрямляють змінний струм у зарядних пристроях і блоках живлення. Світлодіоди під час проходження прямого струму світяться і майже витіснили лампи розжарення. Сонячні батареї перетворюють світло на електричну енергію завдяки p–n-переходу.", "У 1947 р. Джон Бардін, Волтер Браттейн і Вільям Шоклі створили транзистор — прилад із двома p–n-переходами, який підсилює й перемикає сигнали. Сучасний процесор містить мільярди мікроскопічних транзисторів."], "ul": ["Випрямні діоди — блоки живлення, зарядні пристрої.", "Світлодіоди — освітлення, екрани, індикатори.", "Фотоелементи та сонячні батареї.", "Транзистори — основа мікросхем і комп’ютерів.", "Світлодіод вмикають послідовно з резистором, щоб обмежити струм."]}], "formulas": [{"f": "R = U/I", "d": "опір діода в прямому або зворотному напрямку"}, {"f": "R_обм = (U − U_д)/I", "d": "опір обмежувального резистора для світлодіода: U — напруга джерела, U_д — напруга на діоді, I — потрібний струм"}], "terms": [["Донорна домішка", "домішка, атоми якої віддають електрони і створюють електронну провідність."], ["Акцепторна домішка", "домішка, атоми якої захоплюють електрони і створюють діркову провідність."], ["Напівпровідник n-типу", "напівпровідник з донорною домішкою, у якому основні носії — електрони."], ["Напівпровідник p-типу", "напівпровідник з акцепторною домішкою, у якому основні носії — дірки."], ["p–n-перехід", "межа між областями напівпровідника p- і n-типу, що має односторонню провідність."], ["Напівпровідниковий діод", "прилад з одним p–n-переходом, що пропускає струм переважно в одному напрямку."], ["Світлодіод", "напівпровідниковий діод, який світиться під час проходження через нього прямого струму."]], "examples": [{"q": "За прямого вмикання на діоді напруга 0,7 В і сила струму 70 мА, за зворотного — напруга 10 В і сила струму 1 мкА. Знайдіть опір діода в обох випадках.", "s": ["Дано: U₁ = 0,7 В; I₁ = 70 мА; U₂ = 10 В; I₂ = 1 мкА. Знайти: R₁, R₂.", "СІ: I₁ = 0,07 А; I₂ = 1·10⁻⁶ А.", "Розв’язання: R₁ = U₁/I₁ = 0,7 В/0,07 А = 10 Ом.", "R₂ = U₂/I₂ = 10 В/1·10⁻⁶ А = 1·10⁷ Ом = 10 МОм.", "Відповідь: у прямому напрямку 10 Ом, у зворотному — 10 МОм (у мільйон разів більше)."]}, {"q": "Світлодіод розрахований на струм 20 мА, напруга на ньому 2 В. Який резистор треба ввімкнути послідовно, щоб живити світлодіод від джерела 5 В?", "s": ["Дано: U = 5 В; U_д = 2 В; I = 20 мА. Знайти: R.", "СІ: I = 0,02 А.", "Розв’язання: на резисторі має бути напруга U − U_д = 3 В; R = (U − U_д)/I = 3 В/0,02 А = 150 Ом.", "Відповідь: R = 150 Ом."]}], "lab": null, "f": "За створення транзистора Бардін, Браттейн і Шоклі отримали Нобелівську премію з фізики 1956 р. Джон Бардін згодом отримав ще одну — за теорію надпровідності (1972 р.) і став єдиною людиною з двома Нобелівськими преміями з фізики.", "pr": ["Намалюйте схему: батарейка, діод, лампочка. Покажіть, за якої полярності вмикання діода лампочка світиться, а за якої — ні, і поясніть чому.", "Обчисліть опір резистора, потрібного для живлення світлодіода (напруга 3 В, струм 15 мА) від джерела 9 В."], "qz": [{"q": "Яка домішка в кремнії створює напівпровідник n-типу?", "o": ["Бор", "Фосфор", "Алюміній", "Індій"], "a": 1, "why": "Фосфор п’ятивалентний — донорна домішка."}, {"q": "Які носії є основними в напівпровіднику p-типу?", "o": ["Дірки", "Електрони", "Позитивні йони", "Протони"], "a": 0, "why": "Акцепторна домішка створює надлишок дірок."}, {"q": "Як треба під’єднати діод, щоб через нього йшов великий струм?", "o": ["«+» до n-області, «−» до p-області", "Однаково за будь-якої полярності", "«+» до p-області, «−» до n-області", "Обидва виводи до «+»"], "a": 2, "why": "Це пряме вмикання: запірний шар звужується."}, {"q": "Що утворюється на межі p- і n-областей?", "o": ["Надпровідний шар", "Електроліт", "Вакуум", "Запірний шар з малою кількістю носіїв"], "a": 3, "why": "Електрони й дірки рекомбінують біля межі, і утворюється запірний шар."}, {"q": "Яка головна властивість напівпровідникового діода?", "o": ["Підсилює звук", "Одностороння провідність", "Накопичує заряд", "Нагріває коло"], "a": 1, "why": "Діод пропускає струм переважно в одному напрямку."}, {"q": "Опір діода в зворотному напрямку порівняно з прямим…", "o": ["значно більший", "значно менший", "однаковий", "дорівнює нулю"], "a": 0, "why": "У зворотному напрямку запірний шар розширюється, і опір дуже великий."}, {"q": "Який резистор потрібен для світлодіода (2 В, 10 мА) від джерела 6 В?", "o": ["600 Ом", "200 Ом", "40 Ом", "400 Ом"], "a": 3, "why": "R = (6 − 2)/0,01 = 400 Ом."}, {"q": "Хто створив перший транзистор у 1947 р.?", "o": ["Едісон і Тесла", "Фарадей і Максвелл", "Бардін, Браттейн і Шоклі", "Флемінг і де Форест"], "a": 2, "why": "Транзистор винайшли Бардін, Браттейн і Шоклі."}]}, {"n": "14", "type": "lab", "t": "Лабораторна робота № 3 «Дослідження електричного опору кола з напівпровідниковим діодом»", "gr": "ГР1", "g": "Експериментально дослідити, як залежить опір напівпровідникового діода від напрямку струму та від прикладеної напруги.", "blocks": [{"h": "Теорія до роботи", "p": ["Напівпровідниковий діод містить p–n-перехід. За прямого вмикання («+» до p-області, тобто до анода) його опір малий, за зворотного — дуже великий. Опір діода не є сталим: він залежить від прикладеної напруги, тому закон Ома для діода не виконується так, як для резистора.", "Щоб це побачити, вимірюють силу струму I за різних напруг U у прямому та зворотному напрямках і обчислюють R = U/I. За отриманими даними будують вольт-амперну характеристику — графік I(U)."], "ul": ["Анод діода — вивід p-області, катод — n-області (на корпусі катод зазвичай позначено смужкою).", "Послідовно з діодом обов’язково вмикають обмежувальний резистор.", "У прямому напрямку струм помітно зростає, коли напруга на кремнієвому діоді сягає приблизно 0,5–0,7 В.", "У зворотному напрямку струм дуже малий (мікроампери або менше)."]}, {"h": "Як виконати роботу дистанційно", "p": ["Цю роботу можна безпечно виконати вдома, бо вона потребує лише низької напруги батарейки. Знадобиться мультиметр, діод (або світлодіод), резистор на кілька сотень ом і батарейка 4,5 В чи кілька батарейок АА. Багато мультиметрів мають режим перевірки діода — він показує напругу на діоді в прямому напрямку."], "ul": ["Можна вдома: батарейки до 9 В, мультиметр, діод, світлодіод, резистор.", "Не можна: використовувати мережу 220 В, блоки живлення без корпусу, розбирати побутові прилади.", "Світлодіод — наочний діод: світиться лише за прямого вмикання.", "Без обладнання — віртуальна лабораторія або дані від учителя."]}], "formulas": [{"f": "R = U/I", "d": "опір діода за напруги U і сили струму I"}, {"f": "U_д = U − IR_обм", "d": "напруга на діоді, якщо відомі напруга джерела U і опір обмежувального резистора R_обм"}, {"f": "k = R_зв/R_пр", "d": "у скільки разів опір діода у зворотному напрямку більший, ніж у прямому"}], "terms": [["Напівпровідниковий діод", "прилад з одним p–n-переходом, що має односторонню провідність."], ["Пряме вмикання діода", "вмикання, за якого анод (p-область) з’єднано з «+» джерела, а катод (n-область) — з «−»."], ["Зворотне вмикання діода", "вмикання, за якого анод з’єднано з «−» джерела, а катод — з «+»."], ["Вольт-амперна характеристика", "графік залежності сили струму через прилад від напруги на ньому."]], "examples": [], "lab": {"goal": "Дослідити залежність сили струму через напівпровідниковий діод від напруги в прямому і зворотному напрямках, обчислити опір діода і побудувати його вольт-амперну характеристику.", "equip": ["Джерело постійного струму (батарея 4,5 В або регульоване низьковольтне джерело)", "Напівпровідниковий діод (або світлодіод)", "Обмежувальний резистор (200–500 Ом)", "Потенціометр або реостат для зміни напруги", "Міліамперметр (мультиметр у режимі амперметра)", "Вольтметр (другий мультиметр)", "Ключ", "З’єднувальні проводи"], "safety": ["Використовуйте лише низьковольтні джерела (до 9 В); мережу 220 В не використовують.", "Коло збирайте й змінюйте лише за розімкненого ключа.", "Діод обов’язково вмикайте послідовно з обмежувальним резистором, інакше він перегріється.", "Не торкайтеся діода й резистора, якщо вони нагрілися.", "Стежте, щоб міліамперметр був увімкнений послідовно, а вольтметр — паралельно діоду."], "steps": ["Зберіть коло: джерело, ключ, потенціометр, резистор, міліамперметр і діод — послідовно; вольтметр — паралельно діоду.", "Увімкніть діод у прямому напрямку (анод до «+»).", "Потенціометром поступово збільшуйте напругу на діоді (наприклад, 0,2; 0,4; 0,5; 0,6; 0,7 В) і щоразу записуйте U та I.", "Розімкніть ключ і змініть полярність увімкнення діода.", "У зворотному напрямку виміряйте силу струму за кількох напруг (наприклад, 1, 2, 3, 4 В).", "Для кожного вимірювання обчисліть опір R = U/I.", "Побудуйте вольт-амперну характеристику I(U) для обох напрямків на одному графіку.", "Порівняйте опір діода в прямому і зворотному напрямках, зробіть висновок."], "calc": ["R = U/I для кожного вимірювання (струм — в амперах).", "Порівняйте R у прямому й зворотному напрямках: k = R_зв/R_пр.", "За графіком визначте напругу, з якої прямий струм починає різко зростати."], "table": ["№ досліду", "Напрямок вмикання", "Напруга U, В", "Сила струму I, мА", "Опір R, Ом"], "sample": "У прямому напрямку струм майже відсутній до напруги близько 0,5 В, а потім різко зростає, і опір діода зменшується до десятків ом; у зворотному напрямку струм такий малий, що мультиметр може показувати нуль, тобто опір становить сотні кілоом і більше.", "questions": ["Чому опір діода в прямому і зворотному напрямках різний?", "Чому опір діода залежить від напруги і для нього не виконується закон Ома так, як для резистора?", "Для чого в коло вмикають обмежувальний резистор?", "Як за вольт-амперною характеристикою визначити, у якому напрямку діод пропускає струм?", "Де в побутових приладах використовують односторонню провідність діода?"]}, "f": "", "pr": ["Оформіть звіт: мета, обладнання, схема кола, таблиця, обчислення опору, графік I(U), висновок.", "Якщо обладнання немає, опрацюйте віртуальну лабораторію PhET «Напівпровідники»: зберіть p–n-перехід, змініть полярність джерела та опишіть, що відбувається з електронами, дірками й струмом у кожному випадку."], "qz": [{"q": "За якого вмикання опір діода малий?", "o": ["Зворотного", "Прямого", "За будь-якого", "Діод не має опору"], "a": 1, "why": "За прямого вмикання запірний шар звужується, і опір малий."}, {"q": "Як увімкнути вольтметр для вимірювання напруги на діоді?", "o": ["Послідовно з діодом", "Замість діода", "Паралельно діоду", "Послідовно з джерелом"], "a": 2, "why": "Вольтметр завжди вмикають паралельно ділянці, на якій вимірюють напругу."}, {"q": "Для чого в коло з діодом вмикають резистор?", "o": ["Щоб обмежити силу струму і захистити діод", "Щоб збільшити струм", "Щоб діод світився яскравіше", "Щоб змінити полярність"], "a": 0, "why": "Без обмежувального резистора струм через діод може бути надто великим."}, {"q": "На діоді напруга 0,6 В, струм 30 мА. Який його опір?", "o": ["18 Ом", "0,02 Ом", "50 Ом", "20 Ом"], "a": 3, "why": "R = 0,6 В/0,03 А = 20 Ом."}, {"q": "Що таке вольт-амперна характеристика?", "o": ["Графік залежності опору від температури", "Графік залежності сили струму від напруги", "Таблиця потужностей", "Схема кола"], "a": 1, "why": "ВАХ — це залежність I(U)."}, {"q": "Що з переліченого безпечно для виконання роботи вдома?", "o": ["Живити діод від мережі 220 В", "Розібрати зарядний пристрій", "Під’єднати діод напряму до розетки через резистор", "Батарейка 4,5 В, резистор, світлодіод і мультиметр"], "a": 3, "why": "Робота з низькою напругою батарейки безпечна."}]}, {"n": "15", "type": "problems", "t": "Розв’язування задач", "gr": "ГР2, ГР3", "g": "Навчитися розв’язувати задачі на струм у газах, вакуумі й напівпровідниках: рух електронів у полі, кола з діодами, світлодіодами й терморезисторами.", "blocks": [{"h": "Алгоритм розв’язування задач", "p": ["Задачі цього уроку поєднують кілька тем. Для задач про електрони у вакуумі використовують закон збереження енергії: робота поля eU дорівнює кінетичній енергії електрона mv²/2. Для кіл з діодами й терморезисторами — закон Ома й закони послідовного з’єднання."], "ul": ["Визначте, про яке середовище задача: вакуум, газ чи напівпровідник.", "Для електрона: eU = mv²/2, e = 1,6·10⁻¹⁹ Кл, m = 9,1·10⁻³¹ кг.", "Кількість електронів: N = q/e = It/e.", "Для діода: з’ясуйте, пряме чи зворотне вмикання; у зворотному напрямку струм ≈ 0.", "Для послідовного з’єднання: U = U₁ + U₂, I однакова, R = R₁ + R₂."]}, {"h": "Нагадування: формули теми", "p": ["Для перевірки відповіді корисно пам’ятати порядки величин: електрон, прискорений напругою в сотні вольтів, рухається зі швидкістю мільйони метрів за секунду; струм у кілька міліампер — це вже понад 10¹⁶ електронів щосекунди."], "ul": ["E_k = eU; 1 еВ = 1,6·10⁻¹⁹ Дж.", "v = √(2eU/m).", "N = It/e.", "R_обм = (U − U_д)/I.", "P = I²R = UI."]}], "formulas": [{"f": "E_k = eU", "d": "енергія електрона, прискореного напругою U"}, {"f": "v = √(2eU/m)", "d": "швидкість електрона після прискорення з нульової початкової швидкості"}, {"f": "N = It/e", "d": "кількість електронів, що пройшли за час t"}, {"f": "R_обм = (U − U_д)/I", "d": "опір обмежувального резистора для світлодіода"}, {"f": "I = U/(R₁ + R₂)", "d": "закон Ома для послідовного з’єднання двох елементів"}, {"f": "s ≈ vt", "d": "відстань до грози за часом запізнення грому (v ≈ 340 м/с)"}], "terms": [], "examples": [{"q": "Якої швидкості набуває електрон в електронно-променевій трубці, пройшовши прискорювальну напругу 500 В?", "s": ["Дано: U = 500 В; e = 1,6·10⁻¹⁹ Кл; m = 9,1·10⁻³¹ кг. Знайти: v.", "Розв’язання: v = √(2eU/m) = √(2 · 1,6·10⁻¹⁹ · 500/9,1·10⁻³¹) м/с = √(1,76·10¹⁴) м/с ≈ 1,3·10⁷ м/с.", "Відповідь: v ≈ 1,3·10⁷ м/с."]}, {"q": "Анодний струм вакуумного діода — 5 мА. Скільки електронів досягає анода за 1 хв?", "s": ["Дано: I = 5 мА; t = 1 хв. Знайти: N.", "СІ: I = 5·10⁻³ А; t = 60 с.", "Розв’язання: N = It/e = 5·10⁻³ А · 60 с/1,6·10⁻¹⁹ Кл = 0,3/1,6·10⁻¹⁹ ≈ 1,9·10¹⁸.", "Відповідь: N ≈ 1,9·10¹⁸ електронів."]}, {"q": "Світлодіод (напруга 3 В, струм 15 мА) живлять від батареї 9 В через резистор. Знайдіть опір резистора та потужність, що на ньому виділяється.", "s": ["Дано: U = 9 В; U_д = 3 В; I = 15 мА. Знайти: R, P.", "СІ: I = 0,015 А.", "Розв’язання: R = (U − U_д)/I = 6 В/0,015 А = 400 Ом.", "P = I²R = (0,015 А)² · 400 Ом = 0,09 Вт.", "Відповідь: R = 400 Ом; P = 0,09 Вт."]}, {"q": "Батарея 4,5 В, резистор 150 Ом і кремнієвий діод з’єднані послідовно. За прямого вмикання напруга на діоді 0,6 В. Яка сила струму в колі? Що зміниться, якщо діод перевернути?", "s": ["Дано: U = 4,5 В; R = 150 Ом; U_д = 0,6 В. Знайти: I.", "Розв’язання: на резисторі напруга U − U_д = 3,9 В; I = 3,9 В/150 Ом = 0,026 А = 26 мА.", "Якщо діод перевернути, він буде ввімкнений у зворотному напрямку, його опір дуже великий, тому струм у колі майже нульовий.", "Відповідь: I = 26 мА; за зворотного вмикання I ≈ 0."]}, {"q": "Терморезистор увімкнено послідовно з резистором 1 кОм до джерела 6 В. За 20 °C опір терморезистора — 2 кОм, а за 80 °C — 200 Ом. Як зміниться сила струму в колі?", "s": ["Дано: U = 6 В; R = 1000 Ом; R_т1 = 2000 Ом; R_т2 = 200 Ом. Знайти: I₁, I₂.", "Розв’язання: I₁ = U/(R + R_т1) = 6 В/3000 Ом = 0,002 А = 2 мА.", "I₂ = U/(R + R_т2) = 6 В/1200 Ом = 0,005 А = 5 мА.", "Відповідь: сила струму зросте від 2 мА до 5 мА, тобто в 2,5 раза."]}], "lab": null, "f": "", "pr": ["Яку швидкість має електрон, прискорений напругою 200 В? (≈ 8,4·10⁶ м/с)", "Яку кінетичну енергію (у джоулях) набуває електрон, пройшовши напругу 2 кВ? (3,2·10⁻¹⁶ Дж)", "Який резистор треба ввімкнути послідовно з червоним світлодіодом (2 В, 10 мА), щоб живити його від джерела 12 В? (1 кОм)", "Грім почули через 6 с після спалаху блискавки. Оцініть відстань до неї (v = 340 м/с). (≈ 2 км)"], "qz": [{"q": "Яку енергію набуває електрон, пройшовши напругу 100 В?", "o": ["100 Дж", "1,6·10⁻¹⁷ Дж", "1,6·10⁻²¹ Дж", "6,25·10¹⁸ Дж"], "a": 1, "why": "E = eU = 1,6·10⁻¹⁹ · 100 = 1,6·10⁻¹⁷ Дж."}, {"q": "Як зміниться швидкість електрона, якщо прискорювальну напругу збільшити в 4 рази?", "o": ["Збільшиться в 2 рази", "Збільшиться в 4 рази", "Збільшиться в 16 разів", "Не зміниться"], "a": 0, "why": "v = √(2eU/m), тому v ∼ √U: √4 = 2."}, {"q": "Струм 1,6 мА. Скільки електронів проходить щосекунди?", "o": ["1,6·10⁻¹⁹", "10¹⁹", "10¹⁶", "1,6·10¹⁶"], "a": 2, "why": "N = 1,6·10⁻³/1,6·10⁻¹⁹ = 10¹⁶."}, {"q": "Світлодіод 2 В, 20 мА живлять від 6 В. Який потрібен резистор?", "o": ["300 Ом", "100 Ом", "400 Ом", "200 Ом"], "a": 3, "why": "R = (6 − 2)/0,02 = 200 Ом."}, {"q": "Діод у колі з лампою ввімкнули у зворотному напрямку. Що буде з лампою?", "o": ["Світитиме яскравіше", "Не світитиме", "Перегорить", "Світитиме так само"], "a": 1, "why": "У зворотному напрямку діод майже не пропускає струм."}, {"q": "Що станеться зі струмом у колі з терморезистором, якщо його нагріти (напруга стала)?", "o": ["Зменшиться", "Не зміниться", "Збільшиться", "Стане нульовим"], "a": 2, "why": "Опір напівпровідника з нагріванням зменшується, тому струм зростає."}, {"q": "Яка енергія в електрон-вольтах в електрона, прискореного напругою 1 кВ?", "o": ["1000 еВ", "1 еВ", "1,6·10⁻¹⁶ еВ", "1,6 еВ"], "a": 0, "why": "Електрон, що пройшов 1 В, набуває 1 еВ, отже, 1000 В — 1000 еВ."}, {"q": "Через резистор 500 Ом іде струм 10 мА. Яка потужність на ньому?", "o": ["5 Вт", "0,5 Вт", "0,005 Вт", "0,05 Вт"], "a": 3, "why": "P = I²R = 0,0001 · 500 = 0,05 Вт."}]}, {"n": "16", "type": "review", "t": "Узагальнення та систематизація знань", "gr": "ГР3", "g": "Узагальнити знання про природу електричного струму в металах, електролітах, газах, вакуумі й напівпровідниках та підготуватися до підсумкової роботи.", "blocks": [{"h": "Струм у металах", "p": ["У металах струм — напрямлений рух вільних електронів. Опір виникає через зіткнення електронів з йонами ґратки, і під час нагрівання він зростає: R = R₀(1 + αΔt). За дуже низьких температур деякі речовини переходять у надпровідний стан, і їхній опір зникає."], "ul": ["Носії — вільні електрони; речовина не переноситься.", "Опір зростає з нагріванням.", "α для чистих металів ≈ 4·10⁻³ К⁻¹.", "Надпровідність: R = 0 нижче від критичної температури.", "Застосування: термометри опору, надпровідні магніти."]}, {"h": "Струм в електролітах", "p": ["В електролітах струм — напрямлений рух позитивних і негативних йонів, що утворюються внаслідок електролітичної дисоціації. Струм супроводжується електролізом — виділенням речовини на електродах, масу якої визначає закон Фарадея m = kIt."], "ul": ["Носії — катіони (до катода) та аніони (до анода).", "Опір з нагріванням зменшується.", "Перший закон Фарадея: m = kIt.", "Застосування: гальваностегія, гальванопластика, рафінування, отримання алюмінію."]}, {"h": "Струм у газах і вакуумі", "p": ["Гази стають провідниками внаслідок йонізації. Несамостійний розряд потребує йонізатора, самостійний підтримується ударною йонізацією. У вакуумі носіями є електрони, які випускає розжарений катод (термоелектронна емісія); вакуумний діод має односторонню провідність."], "ul": ["У газах носії — електрони та йони обох знаків.", "Види самостійних розрядів: тліючий, іскровий, коронний, дуговий.", "У вакуумі носії — електрони; eU = mv²/2.", "Пристрої: вакуумний діод, електронно-променева трубка, рентгенівська трубка."]}, {"h": "Струм у напівпровідниках", "p": ["У напівпровідниках носії — електрони й дірки. Власна провідність чистого напівпровідника мала і зростає з нагріванням та освітленням. Донорні домішки дають n-тип (основні носії — електрони), акцепторні — p-тип (основні носії — дірки). p–n-перехід має односторонню провідність."], "ul": ["Опір з нагріванням і освітленням зменшується.", "n-тип: п’ятивалентна домішка (P, As).", "p-тип: тривалентна домішка (B, In).", "Пряме вмикання діода — «+» до p-області.", "Прилади: терморезистори, фоторезистори, діоди, світлодіоди, транзистори, сонячні батареї."]}, {"h": "Типові помилки", "p": ["Під час підготовки до підсумкової роботи перевірте себе за списком помилок, які трапляються найчастіше."], "ul": ["Плутають залежність опору від температури: у металів опір зростає, а в електролітів і напівпровідників — зменшується.", "Вважають, що R₀ — опір за кімнатної температури, хоча це опір за 0 °C.", "Забувають переводити масу в кілограми, а час — у секунди в задачах на закон Фарадея.", "Плутають катод і анод: катод з’єднаний з «−», і на ньому виділяються метали.", "Думають, що дірка — це частинка; насправді це вакантне місце в зв’язку.", "Плутають пряме і зворотне вмикання діода."]}], "formulas": [{"f": "R = R₀(1 + αΔt)", "d": "залежність опору металу від температури"}, {"f": "α = (R − R₀)/(R₀Δt)", "d": "температурний коефіцієнт опору"}, {"f": "m = kIt", "d": "перший закон Фарадея"}, {"f": "k = m₀/q₀", "d": "електрохімічний еквівалент через масу і заряд йона"}, {"f": "W = UIt = qU", "d": "робота (енергія) струму"}, {"f": "E_k = eU = mv²/2", "d": "енергія електрона, прискореного полем"}, {"f": "N = It/e", "d": "кількість електронів"}, {"f": "R_обм = (U − U_д)/I", "d": "опір обмежувального резистора для світлодіода"}, {"f": "I = U/R", "d": "закон Ома для ділянки кола"}], "terms": [["Температурний коефіцієнт опору", "величина, що показує, на яку частину від R₀ змінюється опір провідника під час нагрівання на 1 К."], ["Надпровідність", "явище зникнення електричного опору речовини нижче від критичної температури."], ["Електроліз", "виділення речовини на електродах під час проходження струму через електроліт."], ["Електрохімічний еквівалент", "маса речовини, що виділяється на електроді під час проходження заряду 1 Кл."], ["Йонізація газу", "утворення йонів та вільних електронів з нейтральних атомів і молекул газу."], ["Самостійний розряд", "газовий розряд, що існує без зовнішнього йонізатора."], ["Термоелектронна емісія", "випромінювання електронів нагрітим металом."], ["Дірка", "вакантне місце в ковалентному зв’язку, що поводиться як позитивний заряд."], ["p–n-перехід", "межа між областями p- і n-типу з односторонньою провідністю."]], "examples": [{"q": "Через електролітичну ванну з розчином мідного купоросу 30 хв проходив струм 2 А за напруги 3 В. Яка маса міді виділилася і скільки енергії витрачено? k = 0,33·10⁻⁶ кг/Кл.", "s": ["Дано: t = 30 хв; I = 2 А; U = 3 В; k = 0,33·10⁻⁶ кг/Кл. Знайти: m, W.", "СІ: t = 1800 с.", "Розв’язання: m = kIt = 0,33·10⁻⁶ · 2 · 1800 кг ≈ 1,19·10⁻³ кг.", "W = UIt = 3 В · 2 А · 1800 с = 10 800 Дж.", "Відповідь: m ≈ 1,19 г; W = 10,8 кДж."]}, {"q": "У вакуумному діоді анодна напруга 400 В, а анодний струм 8 мА. З якою швидкістю електрони підлітають до анода і скільки їх досягає анода щосекунди? Початкову швидкість електронів вважайте нульовою.", "s": ["Дано: U = 400 В; I = 8 мА; t = 1 с; e = 1,6·10⁻¹⁹ Кл; m = 9,1·10⁻³¹ кг. Знайти: v, N.", "СІ: I = 8·10⁻³ А.", "Розв’язання: v = √(2eU/m) = √(2 · 1,6·10⁻¹⁹ · 400/9,1·10⁻³¹) м/с = √(1,41·10¹⁴) м/с ≈ 1,2·10⁷ м/с.", "N = It/e = 8·10⁻³ · 1/1,6·10⁻¹⁹ = 5·10¹⁶.", "Відповідь: v ≈ 1,2·10⁷ м/с; N = 5·10¹⁶ електронів."]}], "lab": null, "f": "", "pr": ["Складіть підсумкову таблицю «Електричний струм у різних середовищах»: середовище, носії струму, як утворюються носії, залежність опору від температури, застосування.", "Розв’яжіть задачу: опір мідного дроту за 0 °C — 8 Ом. Яким він буде за 50 °C (α = 4,3·10⁻³ К⁻¹) і яка сила струму піде через нього за напруги 4,6 В?"], "qz": [{"q": "У якому середовищі струм створюють лише вільні електрони і не відбувається перенесення речовини?", "o": ["В електролітах", "У газах", "У металах", "У розчинах солей"], "a": 2, "why": "У металах носії — електрони, йони ґратки нерухомі."}, {"q": "У якого середовища опір зростає під час нагрівання?", "o": ["Метал", "Електроліт", "Напівпровідник", "Йонізований газ"], "a": 0, "why": "Лише в металів опір з нагріванням зростає."}, {"q": "Яка маса речовини (k = 0,3·10⁻⁶ кг/Кл) виділиться за 2000 с при струмі 0,5 А?", "o": ["3 г", "0,03 г", "0,6 г", "0,3 г"], "a": 3, "why": "m = 0,3·10⁻⁶ · 0,5 · 2000 = 0,3·10⁻³ кг = 0,3 г."}, {"q": "Що є носіями струму в напівпровідниках?", "o": ["Йони", "Електрони і дірки", "Протони", "Молекули"], "a": 1, "why": "Провідність напівпровідника — електронна й діркова."}, {"q": "Яке явище забезпечує носії струму у вакуумному діоді?", "o": ["Електроліз", "Ударна йонізація", "Надпровідність", "Термоелектронна емісія"], "a": 3, "why": "Розжарений катод випускає електрони."}, {"q": "Опір дроту за 0 °C — 10 Ом, α = 5·10⁻³ К⁻¹. Яким він буде за 40 °C?", "o": ["12 Ом", "10,2 Ом", "20 Ом", "14 Ом"], "a": 0, "why": "R = 10 · (1 + 0,005 · 40) = 12 Ом."}, {"q": "Який вид розряду використовують для зварювання металів?", "o": ["Тліючий", "Коронний", "Дуговий", "Несамостійний"], "a": 2, "why": "Дуга має температуру в тисячі градусів і плавить метал."}, {"q": "Яку домішку треба додати до кремнію, щоб отримати p-тип?", "o": ["Фосфор", "Бор", "Арсен", "Сурму"], "a": 1, "why": "Бор тривалентний — акцепторна домішка, що створює дірки."}, {"q": "Енергія електрона, прискореного напругою 25 В, дорівнює…", "o": ["25 Дж", "1,6·10⁻¹⁹ Дж", "4·10⁻¹⁸ Дж", "6,4·10⁻²¹ Дж"], "a": 2, "why": "E = 1,6·10⁻¹⁹ · 25 = 4·10⁻¹⁸ Дж."}, {"q": "Де під час електролізу виділяються метали?", "o": ["На катоді", "На аноді", "На обох електродах порівну", "У розчині"], "a": 0, "why": "Позитивні йони металів рухаються до катода й там нейтралізуються."}]}, {"n": "17", "type": "test", "t": "Комплексна підсумкова робота № 1 з теми «Електричний струм у різних середовищах»", "gr": "ГР1, ГР2, ГР3", "g": "Перевірити й оцінити знання та вміння з теми «Електричний струм у різних середовищах» і підготуватися до підсумкової роботи.", "blocks": [{"h": "Що перевіряє підсумкова робота", "p": ["Робота перевіряє, чи розумієте ви природу електричного струму в металах, електролітах, газах, вакуумі й напівпровідниках, чи вмієте пояснювати явища та розв’язувати розрахункові задачі теми."], "ul": ["Знання носіїв струму в кожному середовищі.", "Розуміння залежності опору від температури для металів, електролітів і напівпровідників.", "Уміння застосовувати формули R = R₀(1 + αΔt) і m = kIt.", "Знання видів газових розрядів та їхнього застосування.", "Розуміння будови й дії вакуумного та напівпровідникового діодів."]}, {"h": "Структура роботи", "p": ["Підсумкова робота зазвичай містить завдання кількох типів — від простих до складніших. Точну кількість завдань і балів за кожне повідомить учитель."], "ul": ["Тестові завдання з вибором однієї правильної відповіді.", "Завдання на встановлення відповідності (наприклад, «середовище — носії струму», «розряд — застосування»).", "Якісні запитання, де треба пояснити явище.", "Розрахункові задачі з повним оформленням: Дано, СІ, Розв’язання, Відповідь."]}, {"h": "Як готуватися", "p": ["Повторіть конспекти уроків розділу та урок узагальнення, перевірте себе за тестами і розв’яжіть тренувальні задачі нижче. Особливу увагу зверніть на переведення одиниць у СІ."], "ul": ["Складіть таблицю «Середовище — носії — залежність опору від температури — застосування».", "Випишіть усі формули розділу на одну картку і вивчіть позначення.", "Розв’яжіть по 2–3 задачі на кожну формулу.", "Повторіть список типових помилок з уроку узагальнення.", "Перевірте себе на тренувальному тесті цього уроку."]}, {"h": "Критерії оцінювання", "p": ["Роботу оцінюють за 12-бальною шкалою. Розрахункову задачу вважають повністю розв’язаною, якщо правильно записано умову, переведено одиниці, наведено формулу, підстановку з одиницями та відповідь."], "ul": ["Тестове завдання: правильна відповідь — бал, неправильна — 0.", "Відповідність: бали за кожну правильно встановлену пару.", "Задача: частину балів можна отримати за правильну формулу і хід розв’язання навіть з арифметичною помилкою.", "Охайне оформлення і правильні одиниці вимірювання обов’язкові."]}], "formulas": [{"f": "R = R₀(1 + αΔt)", "d": "залежність опору металу від температури"}, {"f": "α = (R − R₀)/(R₀Δt)", "d": "температурний коефіцієнт опору"}, {"f": "m = kIt", "d": "перший закон Фарадея"}, {"f": "W = UIt = qU", "d": "робота струму"}, {"f": "E_k = eU = mv²/2", "d": "енергія електрона, прискореного напругою U"}, {"f": "N = It/e", "d": "кількість електронів"}, {"f": "R_обм = (U − U_д)/I", "d": "резистор для світлодіода"}, {"f": "I = U/R", "d": "закон Ома"}], "terms": [], "examples": [{"q": "Опір алюмінієвого дроту за 0 °C — 8 Ом. Яким буде опір за 150 °C? α = 4,2·10⁻³ К⁻¹.", "s": ["Дано: R₀ = 8 Ом; Δt = 150 К; α = 4,2·10⁻³ К⁻¹. Знайти: R.", "Розв’язання: R = R₀(1 + αΔt) = 8 Ом · (1 + 4,2·10⁻³ · 150) = 8 Ом · 1,63 ≈ 13 Ом.", "Відповідь: R ≈ 13 Ом."]}, {"q": "За 25 хв на катоді виділилося 0,99 г міді. Якою була сила струму? k = 0,33·10⁻⁶ кг/Кл.", "s": ["Дано: t = 25 хв; m = 0,99 г; k = 0,33·10⁻⁶ кг/Кл. Знайти: I.", "СІ: t = 1500 с; m = 0,99·10⁻³ кг.", "Розв’язання: I = m/(kt) = 0,99·10⁻³ кг/(0,33·10⁻⁶ кг/Кл · 1500 с) = 0,99·10⁻³/4,95·10⁻⁴ А = 2 А.", "Відповідь: I = 2 А."]}, {"q": "Світлодіод з’єднаний послідовно з резистором 200 Ом і під’єднаний до джерела 6 В. Напруга на світлодіоді — 2 В. Яка сила струму в колі?", "s": ["Дано: U = 6 В; R = 200 Ом; U_д = 2 В. Знайти: I.", "Розв’язання: напруга на резисторі U − U_д = 4 В; I = 4 В/200 Ом = 0,02 А.", "Відповідь: I = 20 мА."]}], "lab": null, "f": "", "pr": ["Складіть власну картку з усіма формулами розділу, підписавши кожну величину та одиницю вимірювання.", "Розв’яжіть: скільки часу потрібно, щоб за сили струму 4 А на катоді виділилося 2,24 г срібла? k = 1,118·10⁻⁶ кг/Кл."], "qz": [{"q": "Носії струму в електролітах — це…", "o": ["вільні електрони", "позитивні й негативні йони", "електрони і дірки", "лише позитивні йони"], "a": 1, "why": "В електролітах струм створюють йони обох знаків."}, {"q": "Опір дроту за 0 °C — 30 Ом, α = 4·10⁻³ К⁻¹. Який опір за 50 °C?", "o": ["36 Ом", "30,2 Ом", "60 Ом", "34 Ом"], "a": 0, "why": "R = 30 · (1 + 0,004 · 50) = 30 · 1,2 = 36 Ом."}, {"q": "Яка маса цинку (k = 0,34·10⁻⁶ кг/Кл) виділиться за 1000 с при струмі 1 А?", "o": ["3,4 г", "34 мг", "340 мг", "0,34 мг"], "a": 2, "why": "m = 0,34·10⁻⁶ · 1 · 1000 = 0,34·10⁻³ кг = 340 мг."}, {"q": "Який розряд виникає за низького тиску газу?", "o": ["Іскровий", "Дуговий", "Коронний", "Тліючий"], "a": 3, "why": "Тліючий розряд характерний для розріджених газів."}, {"q": "Що відбувається з опором напівпровідника під час освітлення?", "o": ["Зменшується", "Зростає", "Не змінюється", "Стає нескінченним"], "a": 0, "why": "Світло розриває зв’язки і створює нові носії."}, {"q": "Хто відкрив надпровідність?", "o": ["Фарадей", "Петров", "Камерлінг-Оннес", "Едісон"], "a": 2, "why": "Надпровідність ртуті відкрив Камерлінг-Оннес у 1911 р."}, {"q": "Яку енергію набуває електрон, пройшовши напругу 200 В?", "o": ["3,2·10⁻¹⁷ Дж", "200 Дж", "8·10⁻²² Дж", "1,6·10⁻¹⁹ Дж"], "a": 0, "why": "E = 1,6·10⁻¹⁹ · 200 = 3,2·10⁻¹⁷ Дж."}, {"q": "Що утворює напівпровідник n-типу?", "o": ["Тривалентна домішка", "Нагрівання чистого кремнію", "Охолодження", "П’ятивалентна (донорна) домішка"], "a": 3, "why": "Донорна домішка дає надлишок вільних електронів."}, {"q": "Як називають отримання металевих копій предметів електролізом?", "o": ["Гальваностегія", "Гальванопластика", "Рафінування", "Дисоціація"], "a": 1, "why": "Гальванопластика — копіювання рельєфних предметів електролізом."}, {"q": "Який резистор потрібен для світлодіода (3 В, 20 мА) від джерела 5 В?", "o": ["250 Ом", "150 Ом", "100 Ом", "400 Ом"], "a": 2, "why": "R = (5 − 3)/0,02 = 100 Ом."}]}, {"n": "18", "type": "project", "t": "Захист навчальних проєктів", "gr": "ГР1, ГР2, ГР3", "g": "Навчитися готувати, оформлювати й захищати навчальний проєкт з теми «Електричний струм у різних середовищах».", "blocks": [{"h": "Як підготувати проєкт", "p": ["Навчальний проєкт — це ваше невелике дослідження: ви ставите запитання, шукаєте інформацію в надійних джерелах, за можливості проводите безпечний дослід і робите висновки. Проєкт можна виконувати самостійно або в парі.", "Працюйте поетапно: оберіть тему, сформулюйте мету й завдання, зберіть і перевірте інформацію, виконайте практичну частину, підготуйте презентацію (8–12 слайдів) і виступ на 5–7 хвилин."], "ul": ["Обрати тему і погодити її з учителем.", "Сформулювати мету, завдання і проблемне запитання.", "Опрацювати джерела: підручники, енциклопедії, сайти наукових установ; вказати їх наприкінці.", "Виконати практичну частину: безпечний дослід, модель, розрахунки, опитування.", "Підготувати презентацію і текст виступу.", "Відрепетирувати виступ і підготуватися до запитань."]}, {"h": "Теми проєктів за розділом", "p": ["Оберіть одну з тем або запропонуйте власну, пов’язану з електричним струмом у різних середовищах. Досліди з електролізом, високою напругою чи газовими розрядами вдома не виконуйте — їх описують теоретично або показують з учителем."], "ul": ["Надпровідність: історія відкриття і застосування (МРТ, колайдери, потяги на магнітній подушці).", "Гальванічні покриття навколо нас: дослідження предметів побуту з металевими покриттями.", "Блискавка: фізика явища, рекорди та правила безпеки під час грози.", "Від вакуумної лампи до мікросхеми: історія розвитку електроніки.", "Світлодіоди: як вони працюють і чому економлять електроенергію (порівняння з лампою розжарення).", "Сонячні батареї: принцип дії та перспективи сонячної енергетики в Україні.", "Терморезистори й фоторезистори в сучасних приладах: електронний термометр, датчики освітлення.", "Електроліз у промисловості: отримання алюмінію, очищення міді, виробництво водню."]}, {"h": "Структура виступу і критерії оцінювання", "p": ["Під час захисту вас оцінюватимуть не лише за зміст, а й за вміння пояснити фізику своїми словами та відповісти на запитання однокласників і вчителя."], "ul": ["Відповідність змісту темі, наукова точність.", "Наявність власної практичної частини (дослід, розрахунок, модель).", "Логічність і зрозумілість викладу.", "Якість презентації: мало тексту, зрозумілі схеми, підписані джерела.", "Дотримання регламенту (5–7 хв).", "Відповіді на запитання."]}, {"h": "Приклад плану виступу", "p": ["Ось як може виглядати план виступу на тему «Світлодіоди: як вони працюють і чому економлять електроенергію»."], "ul": ["Вступ: чому лампи розжарення замінюють на світлодіодні (актуальність).", "Мета і завдання проєкту.", "Теорія: напівпровідники p- і n-типу, p–n-перехід, чому світлодіод світиться.", "Практична частина: порівняння потужності світлодіодної лампи та лампи розжарення з однаковою яскравістю (за написами на упаковках), розрахунок річної економії енергії.", "Висновки: що з’ясовано, наскільки вигідні світлодіоди.", "Джерела інформації та відповіді на запитання."]}], "formulas": [], "terms": [["Навчальний проєкт", "самостійне дослідження учня з певної теми, що завершується створенням продукту і його публічним захистом."], ["Актуальність", "пояснення, чому обрана тема важлива й цікава саме зараз."], ["Гіпотеза", "припущення, яке перевіряють під час дослідження."]], "examples": [], "lab": null, "f": "", "pr": ["Оберіть тему проєкту, сформулюйте мету й 3 завдання та надішліть учителеві для погодження.", "Складіть план своєї презентації (назви 8–12 слайдів)."], "qz": [{"q": "Чому світлодіод світиться лише за прямого вмикання?", "o": ["Він має односторонню провідність завдяки p–n-переходу", "Він містить нитку розжарення", "Він заповнений неоном", "Він працює лише на змінному струмі"], "a": 0, "why": "Струм через p–n-перехід іде лише в прямому напрямку."}, {"q": "Що є основою роботи сонячної батареї?", "o": ["Електроліз", "Термоелектронна емісія", "p–n-перехід у напівпровіднику", "Коронний розряд"], "a": 2, "why": "У сонячній батареї світло створює носії, які розділяє p–n-перехід."}, {"q": "Для чого в апаратах МРТ використовують надпровідники?", "o": ["Для нагрівання пацієнта", "Для освітлення", "Для зменшення ваги апарата", "Для створення сильного магнітного поля без втрат енергії на нагрівання"], "a": 3, "why": "Надпровідні котушки мають нульовий опір і не нагріваються."}, {"q": "Яким способом отримують алюміній у промисловості?", "o": ["Виплавлянням у доменній печі", "Електролізом розплаву глинозему", "Тліючим розрядом", "Видобуванням у чистому вигляді"], "a": 1, "why": "Алюміній отримують електролізом розплаву оксиду алюмінію в кріоліті."}, {"q": "Що з наведеного є правилом безпеки під час грози?", "o": ["Не ховатися під поодиноким деревом", "Підійматися на пагорб", "Купатися у водоймі", "Тримати в руках металеву парасолю на відкритому полі"], "a": 0, "why": "Блискавка найчастіше влучає у високі поодинокі об’єкти."}]}]}, {"title": "Магнітні та електромагнітні явища", "lessons": [{"n": "19", "type": "theory", "t": "Постійні магніти. Магнітні явища. Дослід Ерстеда. Магнітне поле", "gr": "ГР2", "g": "Ознайомитися з властивостями постійних магнітів, дослідом Ерстеда та поняттям магнітного поля як особливої форми матерії.", "blocks": [{"h": "Постійні магніти та їхні властивості", "p": ["Постійний магніт — це тіло, яке тривалий час зберігає намагніченість і саме створює навколо себе магнітне поле. Магніти бувають природні (мінерал магнетит, або магнітний залізняк) і штучні — виготовлені зі сталі, феритів, сплавів неодиму, заліза й бору тощо.", "Кожен магніт має два полюси: північний (N) і південний (S). Найсильніше магнітна дія проявляється біля полюсів, а посередині смугового магніту є нейтральна зона, де він майже не притягує залізних предметів."], "ul": ["Однойменні полюси магнітів відштовхуються, різнойменні — притягуються.", "Магніт має завжди два полюси: якщо його розрізати, кожна частина стане окремим магнітом зі своїми N і S.", "Магніти помітно притягують залізо, нікель, кобальт і їхні сплави; мідь, алюміній, дерево, пластик — практично ні.", "Магнітна дія передається крізь папір, скло, дерево, воду.", "Під час сильного нагрівання або ударів постійний магніт може частково втратити намагніченість."]}, {"h": "Магнітні явища навколо нас", "p": ["Магнітні явища — це явища, пов’язані з взаємодією магнітів, провідників зі струмом і рухомих заряджених частинок. Ми стикаємося з ними щодня, часто навіть не помічаючи цього."], "ul": ["Компас: магнітна стрілка встановлюється вздовж магнітного поля Землі.", "Магнітні застібки сумок, дверцят шаф, магніти на холодильнику.", "Гучномовці та навушники містять постійні магніти.", "Електродвигуни у пральних машинах, вентиляторах, електросамокатах.", "Банківські картки з магнітною смугою, жорсткі диски комп’ютерів."]}, {"h": "Дослід Ерстеда", "p": ["1820 року данський фізик Ганс Крістіан Ерстед помітив, що магнітна стрілка, розташована біля провідника, повертається, коли в провіднику з’являється електричний струм. Коли струм вимикали, стрілка поверталася у вихідне положення.", "Цей дослід уперше показав, що електричні й магнітні явища тісно пов’язані: електричний струм створює магнітне поле."], "ul": ["Над провідником розміщують магнітну стрілку, паралельну провіднику.", "Під час замикання кола стрілка відхиляється і стає майже перпендикулярною до провідника.", "Якщо змінити напрям струму, стрілка відхиляється в протилежний бік.", "Чим більша сила струму, тим помітніше відхилення стрілки.", "Висновок: навколо провідника зі струмом існує магнітне поле."]}, {"h": "Магнітне поле", "p": ["Магнітне поле — це особлива форма матерії, яка існує навколо намагнічених тіл, провідників зі струмом і рухомих заряджених частинок. Ми не бачимо і не відчуваємо його безпосередньо, але виявляємо за дією на магнітну стрілку, залізні тирсу чи інший провідник зі струмом.", "Джерелом магнітного поля завжди є рухомі заряджені частинки: у провіднику — це упорядкований рух електронів, у постійному магніті — рух електронів в атомах речовини."], "ul": ["Магнітне поле створюють рухомі заряди (струми) і постійні магніти.", "Магнітне поле діє на магніти, на провідники зі струмом і на рухомі заряджені частинки.", "На нерухомі заряди магнітне поле не діє (на них діє електричне поле).", "Для виявлення поля використовують магнітну стрілку або залізну тирсу.", "Магнітна стрілка в магнітному полі повертається так, що встановлюється вздовж поля."]}], "formulas": [], "terms": [["Постійний магніт", "тіло, яке тривалий час зберігає намагніченість і створює власне магнітне поле."], ["Магнітні полюси", "ділянки магніту, біля яких його магнітна дія найсильніша; позначаються N (північний) і S (південний)."], ["Магнітна взаємодія", "притягання різнойменних і відштовхування однойменних полюсів магнітів, а також взаємодія магнітів і провідників зі струмом."], ["Магнітна стрілка", "невеликий легкий постійний магніт, який може вільно обертатися навколо вертикальної осі."], ["Дослід Ерстеда", "дослід, який показав, що провідник зі струмом діє на магнітну стрілку, тобто струм створює магнітне поле."], ["Магнітне поле", "особлива форма матерії, що існує навколо рухомих заряджених частинок і намагнічених тіл та діє на рухомі заряди й магніти."]], "examples": [{"q": "Якісна задача. Як за допомогою компаса з’ясувати, чи тече струм у дроті, захованому під тонкою пластиковою панеллю?", "s": ["Розв’язання: навколо провідника зі струмом існує магнітне поле (дослід Ерстеда). Пластик не екранує магнітне поле.", "Повільно ведемо компас уздовж панелі. Якщо над дротом стрілка помітно відхиляється від напрямку «північ — південь», а після вимкнення приладу повертається назад, то в дроті тече струм.", "Відповідь: за відхиленням магнітної стрілки поблизу дроту."]}], "lab": null, "f": "Найдавніші компаси з’явилися в Китаї, а в Європі магнітний компас почали використовувати в мореплавстві приблизно у XII–XIII століттях.", "pr": ["Візьміть будь-який магніт (наприклад, з холодильника) і з’ясуйте, які з 8–10 домашніх предметів він притягує. Запишіть результати в таблицю «притягує / не притягує» і поясніть їх.", "Поясніть письмово (5–6 речень), чому дослід Ерстеда вважають одним із найважливіших відкриттів в історії фізики."], "qz": [{"q": "Як взаємодіють однойменні полюси двох магнітів?", "o": ["Притягуються", "Відштовхуються", "Не взаємодіють", "Спочатку притягуються, потім відштовхуються"], "a": 1, "why": "Однойменні полюси магнітів завжди відштовхуються."}, {"q": "Смуговий магніт розрізали навпіл посередині. Що отримали?", "o": ["Окремо північний і окремо південний полюс", "Два ненамагнічені шматки", "Два магніти, кожен із двома полюсами", "Один магніт і один ненамагнічений шматок"], "a": 2, "why": "Магніт завжди має два полюси, тому кожна частина стає окремим магнітом."}, {"q": "Що довів дослід Ерстеда?", "o": ["Навколо провідника зі струмом існує магнітне поле", "Магніт створює електричний струм", "Струм у металах — це рух електронів", "Магнітна стрілка завжди показує на північ"], "a": 0, "why": "Відхилення стрілки біля провідника зі струмом показало, що струм створює магнітне поле."}, {"q": "Який із матеріалів магніт притягує помітно?", "o": ["Мідь", "Алюміній", "Скло", "Залізо"], "a": 3, "why": "Залізо — феромагнетик, тому сильно притягується магнітом."}, {"q": "Що є джерелом магнітного поля?", "o": ["Лише нерухомі заряди", "Рухомі заряджені частинки та намагнічені тіла", "Лише нагріті тіла", "Будь-які незаряджені тіла"], "a": 1, "why": "Магнітне поле створюють рухомі заряди (струми) і постійні магніти."}, {"q": "Що станеться зі стрілкою в досліді Ерстеда, якщо змінити напрям струму на протилежний?", "o": ["Нічого не зміниться", "Стрілка перестане рухатися", "Стрілка відхилиться в протилежний бік", "Стрілка розмагнітиться"], "a": 2, "why": "Напрям магнітного поля залежить від напрямку струму, тому стрілка відхилиться в інший бік."}, {"q": "Де магнітна дія смугового магніту найслабша?", "o": ["У його середній частині", "Біля північного полюса", "Біля південного полюса", "Однакова в усіх точках"], "a": 0, "why": "Посередині смугового магніту розташована нейтральна зона."}, {"q": "На яке тіло магнітне поле НЕ діє?", "o": ["На магнітну стрілку", "На провідник зі струмом", "На рухомий електрон", "На нерухому заряджену кульку"], "a": 3, "why": "Магнітне поле діє лише на рухомі заряди та магніти, нерухомий заряд воно не відчуває."}]}, {"n": "20", "type": "theory", "t": "Індукція магнітного поля. Лінії магнітного поля. Магнітне поле Землі", "gr": "ГР1, ГР3", "g": "Зрозуміти, що таке індукція магнітного поля, як зображувати магнітне поле лініями та які особливості має магнітне поле Землі.", "blocks": [{"h": "Індукція магнітного поля", "p": ["Щоб порівнювати магнітні поля, потрібна фізична величина, яка показує, наскільки сильно поле діє в певній точці. Такою силовою характеристикою є магнітна індукція B. Це векторна величина: вона має значення і напрям.", "За напрям вектора магнітної індукції в певній точці беруть напрям, який показує північний полюс магнітної стрілки, вміщеної в цю точку. Одиниця магнітної індукції в СІ — тесла (Тл), названа на честь сербсько-американського винахідника Ніколи Тесли."], "ul": ["Магнітна індукція — векторна величина, позначається B.", "Одиниця — 1 Тл (тесла).", "Модуль B можна визначити за максимальною силою, з якою поле діє на провідник зі струмом: B = F_max/(Il).", "1 Тл — дуже сильне поле: індукція поля Землі приблизно у 20 000 разів менша.", "Напрям B збігається з напрямком, у який вказує північний полюс магнітної стрілки."]}, {"h": "Лінії магнітного поля", "p": ["Магнітне поле зручно зображувати лініями магнітної індукції (магнітними лініями). Це уявні лінії, дотичні до яких у кожній точці збігаються з напрямком вектора B. Магнітні стрілки, розставлені вздовж такої лінії, вишиковуються ланцюжком уздовж неї.", "Картину магнітних ліній можна побачити, якщо насипати залізну тирсу на аркуш картону над магнітом і злегка постукати по картону: тирсинки намагнічуються і вишиковуються вздовж ліній поля."], "ul": ["Магнітні лінії завжди замкнені: вони не мають ні початку, ні кінця.", "Поза магнітом лінії виходять із північного полюса і входять у південний.", "Магнітні лінії ніколи не перетинаються.", "Там, де лінії густіші, поле сильніше (B більша).", "Однорідне магнітне поле — поле, у якому B однакова в усіх точках; його лінії паралельні й розташовані з однаковою густотою (наприклад, між полюсами підковоподібного магніту)."]}, {"h": "Магнітне поле Землі", "p": ["Земля — величезний магніт. Саме тому стрілка компаса встановлюється приблизно в напрямку «північ — південь». Біля північного географічного полюса розташований південний магнітний полюс Землі, а біля південного географічного — північний магнітний. Тому північний полюс стрілки компаса й показує на північ.", "Магнітні полюси не збігаються з географічними і повільно переміщуються. Магнітне поле Землі утворює навколо планети магнітосферу, яка відхиляє потоки заряджених частинок від Сонця (сонячний вітер) і захищає живі організми."], "ul": ["Індукція магнітного поля Землі біля поверхні — приблизно від 25 до 65 мікротесла.", "Магнітні полюси Землі поступово дрейфують, тому мапи для навігації регулярно уточнюють.", "Полярні сяйва виникають, коли заряджені частинки від Сонця, спрямовані магнітним полем, вторгаються у верхні шари атмосфери поблизу полюсів.", "Магнітні бурі — швидкі зміни магнітного поля Землі, спричинені спалахами на Сонці; вони можуть порушувати радіозв’язок і роботу супутників.", "Перелітні птахи, морські черепахи та деякі інші тварини здатні орієнтуватися за магнітним полем Землі."]}], "formulas": [{"f": "B = F_max/(Il)", "d": "B — модуль магнітної індукції (Тл), F_max — максимальна сила, з якою поле діє на провідник зі струмом (Н), I — сила струму (А), l — довжина активної частини провідника (м)"}], "terms": [["Магнітна індукція", "векторна фізична величина, яка є силовою характеристикою магнітного поля в певній точці."], ["Тесла", "одиниця магнітної індукції в СІ: 1 Тл = 1 Н/(А·м)."], ["Лінії магнітної індукції", "уявні лінії, дотичні до яких у кожній точці збігаються з напрямком вектора магнітної індукції."], ["Однорідне магнітне поле", "поле, у кожній точці якого магнітна індукція однакова за значенням і напрямком."], ["Магнітосфера", "область навколо Землі, у якій рух заряджених частинок визначається магнітним полем планети."], ["Магнітна буря", "короткочасна значна зміна магнітного поля Землі, спричинена сонячною активністю."]], "examples": [{"q": "На прямий провідник завдовжки 20 см, по якому тече струм 5 А, в однорідному магнітному полі діє максимальна сила 0,05 Н. Визначте індукцію магнітного поля.", "s": ["Дано: l = 20 см, I = 5 А, F_max = 0,05 Н. Знайти: B.", "СІ: l = 0,2 м.", "Розв’язання: B = F_max/(Il) = 0,05 Н / (5 А · 0,2 м) = 0,05 Тл.", "Відповідь: B = 0,05 Тл (50 мТл)."]}], "lab": null, "f": "Північний магнітний полюс Землі за останні десятиліття помітно змістився від канадської Арктики в бік Сибіру — саме тому світові магнітні моделі для навігації оновлюють кожні кілька років.", "pr": ["Намалюйте картини магнітних ліній: а) смугового магніту; б) двох смугових магнітів, повернутих один до одного однойменними полюсами; в) різнойменними полюсами. Позначте напрям ліній стрілками.", "Поясніть, чому північний полюс стрілки компаса показує на північ, хоча однойменні полюси відштовхуються."], "qz": [{"q": "Яка одиниця магнітної індукції в СІ?", "o": ["Вебер", "Тесла", "Генрі", "Ампер"], "a": 1, "why": "Магнітну індукцію вимірюють у теслах (Тл)."}, {"q": "Куди спрямовані магнітні лінії поза смуговим магнітом?", "o": ["Від S до N", "Від середини до полюсів", "Від N до S", "Вони не мають напрямку"], "a": 2, "why": "Поза магнітом лінії виходять із північного полюса і входять у південний."}, {"q": "Де магнітне поле магніту сильніше?", "o": ["Там, де магнітні лінії розташовані густіше", "Там, де ліній немає", "Там, де лінії рідші", "Сила поля всюди однакова"], "a": 0, "why": "Густота ліній показує модуль магнітної індукції."}, {"q": "Яка властивість НЕ стосується магнітних ліній?", "o": ["Вони замкнені", "Вони не перетинаються", "Вони показують напрям вектора B", "Вони починаються на зарядах"], "a": 3, "why": "Магнітні лінії замкнені й не мають ні початку, ні кінця."}, {"q": "Біля північного географічного полюса Землі розташований…", "o": ["південний магнітний полюс", "північний магнітний полюс", "екватор магнітного поля", "нейтральна зона"], "a": 0, "why": "Північний полюс стрілки притягується до південного магнітного полюса Землі, що лежить на півночі."}, {"q": "На провідник завдовжки 0,5 м зі струмом 2 А діє максимальна сила 0,1 Н. Яка індукція поля?", "o": ["1 Тл", "0,1 Тл", "0,05 Тл", "0,4 Тл"], "a": 1, "why": "B = F/(Il) = 0,1/(2·0,5) = 0,1 Тл."}, {"q": "Що захищає живі організми на Землі від потоків заряджених частинок із Сонця?", "o": ["Озоновий шар", "Хмари", "Магнітосфера Землі", "Гравітаційне поле Місяця"], "a": 2, "why": "Магнітне поле Землі відхиляє заряджені частинки сонячного вітру."}, {"q": "Магнітне поле називають однорідним, якщо…", "o": ["його лінії замкнені", "поле існує лише всередині магніту", "поле діє тільки на залізо", "магнітна індукція в усіх його точках однакова"], "a": 3, "why": "Однорідне поле має однакову B в усіх точках, лінії паралельні й рівномірні."}]}, {"n": "21", "type": "theory", "t": "Магнітне поле прямого провідника зі струмом. Правило свердлика та правило правої руки для прямого провідника зі струмом", "gr": "ГР2", "g": "Вивчити, яку форму мають лінії магнітного поля прямого провідника зі струмом, і навчитися визначати їхній напрям за правилом свердлика та правилом правої руки.", "blocks": [{"h": "Картина магнітного поля прямого провідника", "p": ["Якщо пропустити вертикальний провідник крізь горизонтальний картон, насипати на картон залізну тирсу і ввімкнути сильний струм, тирса вишикується концентричними колами навколо провідника. Отже, лінії магнітного поля прямого провідника — це кола, центри яких лежать на провіднику, а площини перпендикулярні до нього.", "Чим далі від провідника, тим рідше розташовані лінії, тобто поле слабшає. Зі збільшенням сили струму поле в кожній точці посилюється."], "ul": ["Лінії поля — замкнені кола навколо провідника.", "Площини ліній перпендикулярні до провідника.", "Поле найсильніше поблизу провідника і слабшає з віддаленням від нього.", "Більша сила струму — сильніше магнітне поле.", "Зміна напрямку струму змінює напрям магнітних ліній на протилежний."]}, {"h": "Правило свердлика", "p": ["Напрям ліній магнітного поля залежить від напрямку струму. Його зручно визначати за правилом свердлика (буравчика): якщо поступальний рух свердлика збігається з напрямком струму в провіднику, то напрям обертання його ручки збігається з напрямком ліній магнітного поля.", "Замість свердлика можна уявити звичайний гвинт або шуруп із правою різьбою: його закручують за годинниковою стрілкою, і він рухається вперед, від нас."], "ul": ["Свердлик розміщують уздовж провідника.", "Свердлик «вкручують» у напрямку струму.", "Напрям обертання ручки показує напрям магнітних ліній.", "Струм, напрямлений від нас (за площину рисунка), позначають ⊗ — хрестиком, як «оперення стріли».", "Струм, напрямлений до нас, позначають ⊙ — крапкою, як «вістря стріли».", "Для струму ⊗ лінії йдуть за годинниковою стрілкою, для ⊙ — проти."]}, {"h": "Правило правої руки", "p": ["Те саме можна визначити й рукою: якщо обхопити провідник правою рукою так, щоб відставлений великий палець показував напрям струму, то чотири зігнуті пальці покажуть напрям ліній магнітного поля.", "Обидва правила дають однаковий результат, тож використовуйте те, яке вам зручніше. Головне — завжди саме права рука!"], "ul": ["Великий палець правої руки — за напрямком струму.", "Зігнуті пальці — за напрямком магнітних ліній.", "Знаючи напрям ліній, можна визначити напрям струму і навпаки.", "Північний полюс магнітної стрілки біля провідника встановлюється за дотичною до магнітної лінії в напрямку цієї лінії.", "Типова помилка — використати ліву руку; ліва рука знадобиться пізніше, для сили Ампера."]}, {"h": "Взаємодія провідників зі струмом", "p": ["Андре-Марі Ампер одразу після досліду Ерстеда 1820 року встановив, що два паралельні провідники зі струмом взаємодіють між собою: кожен перебуває в магнітному полі іншого."], "ul": ["Провідники зі струмами одного напрямку притягуються.", "Провідники зі струмами протилежних напрямків відштовхуються.", "Сила взаємодії тим більша, чим більші струми і чим ближче провідники.", "Цю взаємодію використовували для визначення одиниці сили струму — ампера."]}], "formulas": [], "terms": [["Магнітне поле прямого струму", "поле, лінії якого є концентричними колами з центрами на провіднику, розташованими в площинах, перпендикулярних до провідника."], ["Правило свердлика", "якщо поступальний рух свердлика збігається з напрямком струму, то напрям обертання його ручки збігається з напрямком ліній магнітного поля."], ["Правило правої руки (для прямого провідника)", "якщо великий палець правої руки показує напрям струму, то зігнуті пальці вказують напрям магнітних ліній."], ["Позначення ⊗", "струм або вектор, напрямлений від спостерігача, за площину рисунка."], ["Позначення ⊙", "струм або вектор, напрямлений до спостерігача, з площини рисунка."]], "examples": [{"q": "Якісна задача. По вертикальному провіднику струм тече вгору. Магнітна стрілка розташована на північ від провідника. Куди буде показувати її північний полюс (на схід чи на захід)?", "s": ["Розв’язання: дивимося на провідник згори. Струм тече до нас (⊙), отже за правилом свердлика лінії поля напрямлені проти годинникової стрілки.", "На карті при погляді згори північ — угорі, схід — праворуч. У точці на північ від провідника рух проти годинникової стрілки напрямлений справа наліво, тобто на захід.", "Відповідь: північний полюс стрілки покаже на захід."]}], "lab": null, "f": "Ампер повідомив про взаємодію паралельних провідників зі струмом Паризькій академії наук лише через кілька тижнів після того, як дізнався про дослід Ерстеда.", "pr": ["Намалюйте переріз провідника для двох випадків (⊗ і ⊙), покажіть по три магнітні лінії навколо кожного і стрілками вкажіть їхній напрям.", "Поясніть, як за допомогою магнітної стрілки визначити напрям струму в прямому провіднику, якщо полюси джерела струму не позначено."], "qz": [{"q": "Яку форму мають лінії магнітного поля прямого провідника зі струмом?", "o": ["Прямі, паралельні провіднику", "Концентричні кола навколо провідника", "Промені, що виходять із провідника", "Спіралі вздовж провідника"], "a": 1, "why": "Лінії поля прямого струму — кола з центрами на провіднику."}, {"q": "Струм у провіднику напрямлений від нас (⊗). Як напрямлені магнітні лінії?", "o": ["Від провідника", "До провідника", "Проти годинникової стрілки", "За годинниковою стрілкою"], "a": 3, "why": "Свердлик, що вкручується від нас, обертається за годинниковою стрілкою."}, {"q": "Що показує великий палець правої руки в правилі правої руки для прямого провідника?", "o": ["Напрям струму", "Напрям магнітних ліній", "Напрям сили Ампера", "Північний полюс"], "a": 0, "why": "Великий палець — уздовж струму, зігнуті пальці — уздовж ліній."}, {"q": "Як змінюється магнітне поле прямого провідника з віддаленням від нього?", "o": ["Посилюється", "Не змінюється", "Слабшає", "Змінює напрям"], "a": 2, "why": "Лінії стають рідшими, отже поле слабшає з віддаленням."}, {"q": "Що означає позначення ⊙ на рисунку?", "o": ["Струм від нас", "Струм до нас", "Провідник без струму", "Північний полюс"], "a": 1, "why": "Крапка — вістря стріли, що летить до нас."}, {"q": "Два паралельні провідники зі струмами одного напрямку…", "o": ["притягуються", "відштовхуються", "не взаємодіють", "обертаються"], "a": 0, "why": "Однаково напрямлені струми притягуються, протилежні — відштовхуються."}, {"q": "Як зміниться напрям магнітних ліній, якщо змінити напрям струму?", "o": ["Не зміниться", "Стане радіальним", "Лінії зникнуть", "Зміниться на протилежний"], "a": 3, "why": "Напрям ліній однозначно визначається напрямком струму."}, {"q": "Як посилити магнітне поле поблизу прямого провідника?", "o": ["Зменшити силу струму", "Збільшити силу струму", "Замінити провідник на ізолятор", "Віддалитися від провідника"], "a": 1, "why": "Магнітна індукція поля прямого струму пропорційна силі струму."}]}, {"n": "22", "type": "theory", "t": "Магнітне поле котушки зі струмом. Правило свердлика та правило правої руки для котушки зі струмом", "gr": "ГР1, ГР3", "g": "З’ясувати, яке магнітне поле створює котушка зі струмом, від чого залежить його дія, і навчитися визначати її полюси за правилом свердлика та правилом правої руки.", "blocks": [{"h": "Котушка зі струмом — штучний магніт", "p": ["Котушка (соленоїд) — це ізольований провідник, намотаний спіраллю на циліндричний каркас. Магнітні поля окремих витків додаються, тому поле котушки значно сильніше, ніж поле одного прямого провідника.", "Картина ліній поля котушки зі струмом дуже схожа на картину поля смугового магніту: котушка має північний і південний полюси, а підвішена на нитці — повертається, як стрілка компаса."], "ul": ["Усередині довгої котушки поле майже однорідне: лінії паралельні осі.", "Поза котушкою лінії виходять із північного полюса і входять у південний, як у смугового магніту.", "Котушка зі струмом притягує залізні предмети.", "Дві котушки зі струмом взаємодіють між собою, як два магніти.", "Коли струм вимикають, магнітне поле котушки зникає."]}, {"h": "Від чого залежить магнітна дія котушки", "p": ["Магнітну дію котушки можна регулювати, і саме це робить її такою корисною в техніці. Досліди показують три головні способи посилити поле котушки."], "ul": ["Збільшити силу струму в котушці (наприклад, реостатом).", "Збільшити кількість витків, не змінюючи довжини котушки.", "Вставити всередину залізне осердя — поле посилюється в сотні й тисячі разів.", "Зменшити силу струму або вийняти осердя — поле послабиться.", "Змінити напрям струму — полюси котушки поміняються місцями."]}, {"h": "Як визначити полюси котушки", "p": ["Правило правої руки для котушки: якщо обхопити котушку правою рукою так, щоб чотири зігнуті пальці показували напрям струму у витках, то відставлений великий палець покаже напрям ліній магнітного поля всередині котушки, тобто на її північний полюс.", "Правило свердлика для котушки: якщо обертати ручку свердлика за напрямком струму у витках, то поступальний рух свердлика покаже напрям ліній магнітного поля всередині котушки."], "ul": ["Зігнуті пальці правої руки — за струмом у витках.", "Великий палець — на північний полюс N котушки.", "Простий сп
