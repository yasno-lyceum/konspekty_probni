шин, Хмельницька обл.) — 2 енергоблоки.", "Південноукраїнська АЕС (м. Южноукраїнськ, Миколаївська обл.) — 3 енергоблоки.", "Чорнобильська АЕС остаточно зупинена 2000 року; над зруйнованим 4-м енергоблоком споруджено нове безпечне укриття (арку)."]}, {"h": "Переваги та ризики атомної енергетики", "p": ["Атомні станції виробляють багато електроенергії і майже не викидають в атмосферу вуглекислого газу та попелу. Невелика маса палива забезпечує енергією місто протягом тривалого часу.", "Водночас аварії на АЕС мають тяжкі й довготривалі наслідки, як показали катастрофи на Чорнобильській АЕС (26 квітня 1986 року) і на АЕС «Фукусіма-1» в Японії (2011 рік). Окупація Запорізької АЕС уперше в історії створила загрозу ядерної аварії через воєнні дії."], "ul": ["Переваги: висока потужність, стабільна робота незалежно від погоди, мала витрата палива, низькі викиди парникових газів.", "Недоліки: проблема зберігання відпрацьованого палива та радіоактивних відходів.", "Теплове забруднення водойм-охолоджувачів.", "Високі вимоги до безпеки, великі витрати на будівництво і виведення з експлуатації.", "Ризик тяжких аварій із радіоактивним забрудненням великих територій."]}, {"h": "Ядерна безпека", "p": ["Безпеку АЕС забезпечують кілька послідовних бар’єрів, автоматичні системи захисту та постійний контроль. Роботу АЕС України контролює Державна інспекція ядерного регулювання, а міжнародний нагляд здійснює МАГАТЕ — Міжнародне агентство з атомної енергії.", "Навколо кожної АЕС є санітарно-захисна зона і зона спостереження, де постійно вимірюють радіаційний фон. Жителі поблизу станцій мають знати, як діяти в разі радіаційної аварії."], "ul": ["Принцип глибокоешелонованого захисту: таблетка палива, оболонка твела, корпус реактора, герметична захисна оболонка.", "Автоматична аварійна зупинка реактора керувальними стрижнями.", "Резервні системи охолодження і резервне електроживлення (дизель-генератори).", "Постійний радіаційний моніторинг довкола станції.", "Навчання персоналу та регулярні перевірки обладнання."]}], "formulas": [{"f": "η = P_ел / P_т · 100 %", "d": "ККД енергоблока АЕС"}, {"f": "W = P·t", "d": "електроенергія, вироблена за час t; 1 кВт·год = 3,6·10⁶ Дж"}, {"f": "Q = qm", "d": "теплота згоряння органічного палива — для порівняння з ядерним"}], "terms": [["Ядерний паливний цикл", "сукупність етапів від видобування уранової руди до зберігання або переробки відпрацьованого палива."], ["Збагачення урану", "процес підвищення частки ізотопу ²³⁵U в урані."], ["Твел (тепловидільний елемент)", "герметична трубка, заповнена таблетками ядерного палива."], ["Відпрацьоване ядерне паливо", "паливо, вивантажене з реактора після використання; дуже радіоактивне і потребує тривалої ізоляції."], ["Атомна електростанція", "електростанція, на якій енергію, що виділяється в ядерному реакторі, перетворюють на електричну."], ["Енергоблок", "частина електростанції, що включає реактор, турбіну, генератор і допоміжне обладнання та може працювати самостійно."]], "examples": [{"q": "Скільки електроенергії виробляє за добу енергоблок електричною потужністю 1000 МВт? Відповідь подайте в кіловат-годинах.", "s": ["Дано: P = 1000 МВт = 10⁶ кВт; t = 24 год.", "Розв’язання: W = P·t = 10⁶ кВт · 24 год = 2,4·10⁷ кВт·год.", "Відповідь: 24 млн кВт·год."]}, {"q": "Реактор тепловою потужністю 3000 МВт витрачає за добу близько 3,2 кг ²³⁵U. Скільки кам’яного вугілля (q = 2,7·10⁷ Дж/кг) знадобилося б для такої самої кількості теплоти?", "s": ["Дано: P_т = 3·10⁹ Вт; t = 86 400 с; q = 2,7·10⁷ Дж/кг.", "Розв’язання: Q = P_т·t = 3·10⁹ · 86 400 ≈ 2,6·10¹⁴ Дж. m = Q/q = 2,6·10¹⁴ / 2,7·10⁷ ≈ 9,6·10⁶ кг.", "Відповідь: майже 10 000 т вугілля за добу (понад сотню залізничних вагонів) проти кількох кілограмів урану."]}], "lab": null, "f": "На Рівненській АЕС працюють реактори двох типів: на 1-му і 2-му енергоблоках — ВВЕР-440, на 3-му і 4-му — потужніші ВВЕР-1000.", "pr": ["Підготуйте коротку довідку (8–10 речень) про Рівненську АЕС: розташування, кількість енергоблоків, типи реакторів, значення для енергосистеми, заходи безпеки.", "Складіть таблицю «Переваги й недоліки атомної енергетики порівняно з тепловими, гідро- та сонячними електростанціями» (щонайменше по 3 пункти для кожного типу)."], "qz": [{"q": "Скільки атомних електростанцій працює в Україні?", "o": ["2", "4", "6", "15"], "a": 1, "why": "Запорізька, Рівненська, Хмельницька і Південноукраїнська."}, {"q": "Яка АЕС є найбільшою в Європі?", "o": ["Рівненська", "Хмельницька", "Запорізька", "Південноукраїнська"], "a": 2, "why": "Запорізька АЕС має 6 енергоблоків; з 2022 року вона окупована."}, {"q": "У якому місті розташована Рівненська АЕС?", "o": ["Вараш", "Нетішин", "Енергодар", "Южноукраїнськ"], "a": 0, "why": "Рівненська АЕС розташована у м. Вараш Рівненської області."}, {"q": "Що таке збагачення урану?", "o": ["Видобування руди", "Очищення від домішок заліза", "Перетворення урану на плутоній", "Підвищення частки ²³⁵U"], "a": 3, "why": "У природному урані лише 0,7 % ²³⁵U; для реакторів його частку підвищують."}, {"q": "Що відбувається з відпрацьованим паливом одразу після вивантаження з реактора?", "o": ["Його відразу закопують", "Його витримують у басейнах біля реактора", "Його спалюють", "Його повертають у реактор"], "a": 1, "why": "У басейнах паливо охолоджується, і його активність зменшується."}, {"q": "Коли сталася аварія на Чорнобильській АЕС?", "o": ["26 квітня 1986 року", "24 серпня 1991 року", "11 березня 2011 року", "1 січня 2000 року"], "a": 0, "why": "Аварія на 4-му енергоблоці ЧАЕС сталася 26 квітня 1986 року."}, {"q": "Яка з наведених рис є перевагою АЕС?", "o": ["Утворення радіоактивних відходів", "Ризик аварій", "Теплове забруднення водойм", "Майже відсутні викиди вуглекислого газу"], "a": 3, "why": "АЕС не спалюють органічне паливо, тому майже не викидають CO₂."}, {"q": "Яка міжнародна організація здійснює нагляд за ядерною безпекою?", "o": ["ЮНЕСКО", "ВООЗ", "МАГАТЕ", "ФІФА"], "a": 2, "why": "МАГАТЕ — Міжнародне агентство з атомної енергії."}]}, {"n": "84", "type": "theory", "t": "Термоядерні реакції. Зорі як природні термоядерні реактори", "gr": "ГР2, ГР3", "g": "Зрозуміти, що таке термоядерні реакції, за яких умов вони відбуваються, чому світять Сонце й зорі та які перспективи керованого термоядерного синтезу.", "blocks": [{"h": "Що таке термоядерна реакція", "p": ["Легкі ядра мають меншу питому енергію зв’язку, ніж ядра середньої маси. Тому під час злиття легких ядер у важче виділяється енергія. Таку реакцію називають реакцією синтезу.", "Щоб ядра злилися, їх треба зблизити на відстань дії ядерних сил — близько 10⁻¹⁵ м. Але ядра заряджені позитивно і сильно відштовхуються. Подолати це відштовхування вони можуть, лише рухаючись з величезними швидкостями, тобто за температури в десятки і сотні мільйонів кельвінів. Тому реакції синтезу називають термоядерними."], "ul": ["Приклад реакції: ²₁H + ³₁H → ⁴₂He + ¹₀n + 17,6 МеВ.", "За такої температури речовина перебуває у стані плазми — суміші ядер і вільних електронів.", "У розрахунку на один нуклон синтез дає в кілька разів більше енергії, ніж поділ Урану.", "Паливо для синтезу — ізотопи Гідрогену; дейтерій є у звичайній воді, тобто його запаси величезні.", "Продукт синтезу — Гелій — нерадіоактивний."]}, {"h": "Зорі — природні термоядерні реактори", "p": ["Сонце світить уже близько 4,6 млрд років завдяки термоядерним реакціям у його надрах. Температура в центрі Сонця — близько 15 млн K, а величезний тиск утримує плазму силами гравітації.", "Основний процес — протон-протонний цикл: через кілька проміжних реакцій чотири протони перетворюються на ядро Гелію. Маса продуктів менша за масу протонів, і різниця перетворюється на енергію за формулою E = mc²."], "ul": ["Сумарно: 4¹₁H → ⁴₂He + 2⁰₊₁e + 2ν + ≈ 26,7 МеВ (⁰₊₁e — позитрон, ν — нейтрино).", "Щосекунди Сонце втрачає приблизно 4 млн тонн маси, що перетворюється на випромінювання.", "Запасів Гідрогену Сонцю вистачить ще приблизно на 5 млрд років.", "У масивніших зорях відбувається синтез важчих елементів — аж до Феруму.", "Елементи, важчі за Ферум, утворюються під час вибухів наднових і зіткнень нейтронних зір; атоми нашого тіла колись утворилися в надрах зір."]}, {"h": "Керований термоядерний синтез", "p": ["Неконтрольовану термоядерну реакцію люди здійснили в термоядерній (водневій) бомбі, де потрібну температуру створює вибух атомного заряду. Набагато складніше зробити реакцію керованою, щоб отримувати з неї електроенергію.", "Найпоширеніша установка — токамак: тороїдальна («бублик») камера, у якій плазму утримує сильне магнітне поле, не даючи їй торкатися стінок. У Франції за участі багатьох країн споруджують міжнародний експериментальний реактор ITER."], "ul": ["Плазму треба нагріти до понад 100 млн K.", "Плазму треба втримати достатньо довго і достатньо густою.", "Жоден матеріал не витримує контакту з такою плазмою — тому її утримують магнітним полем.", "Стінки реактора зазнають потужного нейтронного опромінення.", "Поки що на жодній установці не отримано стабільного виробництва електроенергії — це завдання майбутніх десятиліть."]}], "formulas": [{"f": "²₁H + ³₁H → ⁴₂He + ¹₀n + 17,6 МеВ", "d": "реакція синтезу дейтерію і тритію — основна для майбутніх термоядерних електростанцій"}, {"f": "4¹₁H → ⁴₂He + 2⁰₊₁e + 2ν", "d": "сумарний результат протон-протонного циклу в Сонці; виділяється ≈ 26,7 МеВ"}, {"f": "E = Δm·c²", "d": "енергія, що відповідає зменшенню маси Δm під час реакції"}, {"f": "Δm = P / c²", "d": "втрата маси зорею за 1 с при потужності випромінювання P"}], "terms": [["Термоядерна реакція", "реакція злиття легких ядер у важче, яка відбувається за дуже високої температури."], ["Плазма", "стан речовини, у якому атоми йонізовані і речовина складається з ядер (йонів) і вільних електронів."], ["Протон-протонний цикл", "ланцюжок термоядерних реакцій, у результаті якого чотири протони перетворюються на ядро Гелію; головне джерело енергії Сонця."], ["Токамак", "установка для керованого термоядерного синтезу, у якій плазма утримується магнітним полем у тороїдальній камері."], ["Керований термоядерний синтез", "здійснення термоядерних реакцій у контрольованих умовах з метою отримання енергії."]], "examples": [{"q": "Перевірте, що в реакції ²₁H + ³₁H → ⁴₂He + ¹₀n виділяється близько 17,6 МеВ. Маси: ядро дейтерію 2,01355 а. о. м., тритію 3,01550 а. о. м., гелію 4,00151 а. о. м., нейтрон 1,00866 а. о. м.", "s": ["Дано: m_D = 2,01355 а. о. м.; m_T = 3,01550 а. о. м.; m_He = 4,00151 а. о. м.; m_n = 1,00866 а. о. м.", "Розв’язання: маса до реакції: 2,01355 + 3,01550 = 5,02905 а. о. м.; після: 4,00151 + 1,00866 = 5,01017 а. о. м. Δm = 5,02905 − 5,01017 = 0,01888 а. о. м. E = 931,5 · 0,01888 ≈ 17,6 МеВ.", "Відповідь: ≈ 17,6 МеВ."]}, {"q": "Потужність випромінювання Сонця становить 3,8·10²⁶ Вт. На скільки зменшується маса Сонця щосекунди?", "s": ["Дано: P = 3,8·10²⁶ Вт; t = 1 с; c = 3·10⁸ м/с.", "Розв’язання: E = P·t = 3,8·10²⁶ Дж. Δm = E/c² = 3,8·10²⁶ / (9·10¹⁶) ≈ 4,2·10⁹ кг.", "Відповідь: ≈ 4,2·10⁹ кг, тобто понад 4 млн тонн щосекунди."]}], "lab": null, "f": "Енергія, що виділяється в ядрі Сонця, дуже повільно «просочується» назовні: на шлях від центру до поверхні в неї йдуть десятки тисяч років, а від поверхні Сонця до Землі світло долітає лише приблизно за 8 хвилин.", "pr": ["Порівняйте в таблиці реакції поділу і синтезу: які ядра беруть участь, умови перебігу, енергія на один нуклон, паливо, відходи, де відбуваються в природі та техніці.", "Обчисліть, скільки енергії виділиться, якщо в реакції ²₁H + ³₁H → ⁴₂He + ¹₀n утвориться 10²³ ядер Гелію (1 МеВ = 1,6·10⁻¹³ Дж)."], "qz": [{"q": "Що таке термоядерна реакція?", "o": ["Поділ важких ядер", "Злиття легких ядер за високої температури", "Радіоактивний розпад", "Хімічне горіння водню"], "a": 1, "why": "Термоядерна реакція — синтез легких ядер, що потребує мільйонів кельвінів."}, {"q": "Чому для синтезу потрібна дуже висока температура?", "o": ["Щоб розплавити ядра", "Щоб ядра стали нейтральними", "Щоб подолати електричне відштовхування ядер", "Щоб утворилися електрони"], "a": 2, "why": "Лише дуже швидкі ядра можуть зблизитися на відстань дії ядерних сил."}, {"q": "Яка температура в центрі Сонця?", "o": ["Близько 6000 K", "Близько 15 млн K", "Близько 100 K", "Близько 1 млрд K"], "a": 1, "why": "У ядрі Сонця близько 15 млн K; 6000 K — температура його поверхні."}, {"q": "На яке ядро перетворюються протони в протон-протонному циклі?", "o": ["⁴₂He", "¹²₆C", "⁵⁶₂₆Fe", "²³⁵₉₂U"], "a": 0, "why": "Чотири протони зрештою утворюють ядро Гелію-4."}, {"q": "Як утримують плазму в токамаку?", "o": ["Стінками з вольфраму", "Водою", "Гравітацією", "Магнітним полем"], "a": 3, "why": "Жоден матеріал не витримає контакту з плазмою, тому її утримує магнітне поле."}, {"q": "Де споруджують міжнародний експериментальний термоядерний реактор ITER?", "o": ["У США", "У Японії", "У Франції", "В Україні"], "a": 2, "why": "ITER будують на півдні Франції спільними зусиллями багатьох країн."}, {"q": "Яка перевага термоядерного синтезу над поділом?", "o": ["Майже необмежені запаси палива й нерадіоактивний продукт синтезу", "Не потрібна висока температура", "Простота технічної реалізації", "Він уже широко використовується на електростанціях"], "a": 0, "why": "Дейтерію у воді дуже багато, а Гелій нерадіоактивний."}, {"q": "Де в техніці людство вже здійснило неконтрольовану термоядерну реакцію?", "o": ["У ядерному реакторі ВВЕР", "У сонячній батареї", "У двигуні автомобіля", "У водневій (термоядерній) бомбі"], "a": 3, "why": "Водневу бомбу підриває атомний заряд, що створює потрібну температуру."}]}, {"n": "85", "type": "review", "t": "Узагальнення та систематизація знань", "gr": "ГР3", "g": "Узагальнити й систематизувати знання з теми «Будова атома та атомного ядра», повторити формули, типові задачі та виправити поширені помилки.", "blocks": [{"h": "Будова атома і атомного ядра", "p": ["Досліди Резерфорда з розсіюванням α-частинок довели: атом складається з маленького масивного позитивно зарядженого ядра і електронів навколо нього. Ядро складається з протонів і нейтронів (нуклонів).", "Склад ядра визначають два числа: зарядове Z (кількість протонів) і масове A (кількість нуклонів). Ізотопи одного елемента мають однакове Z і різну кількість нейтронів."], "ul": ["Модель Томсона → планетарна модель Резерфорда (1911) → модель Бора (1913) → квантова модель.", "Розмір атома ~10⁻¹⁰ м, ядра ~10⁻¹⁵–10⁻¹⁴ м.", "A = Z + N; кількість електронів у нейтральному атомі = Z.", "Ізотопи мають однакові хімічні, але різні ядерні властивості."]}, {"h": "Ядерні сили та енергія зв’язку", "p": ["Нуклони в ядрі утримують ядерні сили — дуже сильні, короткодійні, зарядово незалежні сили притягання.", "Маса ядра менша за суму мас нуклонів на дефект мас Δm; енергія зв’язку E_зв = Δm·c². Найміцніші — ядра середньої маси, тому енергія виділяється і під час поділу важких ядер, і під час синтезу легких."], "ul": ["Радіус дії ядерних сил ~10⁻¹⁵ м.", "1 а. о. м. ↔ 931,5 МеВ; 1 МеВ = 1,6·10⁻¹³ Дж.", "Питома енергія зв’язку максимальна (≈ 8,8 МеВ/нуклон) поблизу ⁵⁶Fe.", "Енергія ядерних реакцій у мільйони разів більша за енергію хімічних."]}, {"h": "Радіоактивність і закон розпаду", "p": ["Радіоактивність — самочинне перетворення ядер з випромінюванням α-частинок (ядер Гелію), β-частинок (електронів) і γ-квантів (електромагнітних хвиль). Перетворення підпорядковуються правилам зміщення.", "Розпад окремого ядра випадковий, але для великої кількості ядер діє закон радіоактивного розпаду: за кожен період піврозпаду кількість ядер і активність зменшуються вдвічі."], "ul": ["α-розпад: A − 4, Z − 2; β-розпад: A не змінюється, Z + 1; γ: A і Z не змінюються.", "Проникна здатність: α < β < γ; йонізувальна: α > β > γ.", "N = N₀/2ⁿ, n = t/T; A = λN; [A] = Бк.", "Застосування: медицина, дефектоскопія, мічені атоми, радіовуглецеве датування."]}, {"h": "Дія випромінювання і дозиметрія", "p": ["Йонізувальне випромінювання руйнує молекули клітин, зокрема ДНК. Його дію оцінюють поглинутою дозою (Гр) та еквівалентною дозою (Зв), яка враховує вид випромінювання.", "Природний радіаційний фон дає людині близько 2–3 мЗв на рік; найбільший внесок робить радон. Захищаються часом, відстанню, екранами і недопущенням потрапляння радіонуклідів в організм."], "ul": ["D = W/m, 1 Гр = 1 Дж/кг.", "H = K·D; K = 1 (γ, β, рентген), K = 20 (α).", "H = P·t — накопичена доза за сталої потужності.", "Додаткове опромінення населення обмежують 1 мЗв на рік."]}, {"h": "Ядерна енергетика: поділ і синтез", "p": ["Ядро ²³⁵U, поглинувши нейтрон, ділиться на два уламки, 2–3 нейтрони і виділяє ≈ 200 МеВ. За маси, більшої за критичну, виникає ланцюгова реакція; у реакторі її підтримують за k = 1 за допомогою сповільнювача і керувальних стрижнів.", "В Україні 4 АЕС: Запорізька (найбільша в Європі, з 2022 р. окупована), Рівненська, Хмельницька, Південноукраїнська. Термоядерний синтез легких ядер — джерело енергії зір; керований синтез досліджують на токамаках."], "ul": ["k < 1 — реакція згасає; k = 1 — стаціонарна; k > 1 — наростає.", "Повний поділ 1 г ²³⁵U дає ≈ 8,2·10¹⁰ Дж (як згоряння ≈ 3 т вугілля).", "Ядерний паливний цикл: видобування → збагачення → твели → реактор → витримка → зберігання.", "²₁H + ³₁H → ⁴₂He + ¹₀n + 17,6 МеВ."]}, {"h": "Типові помилки", "p": ["Більшість помилок у цій темі — це плутанина з індексами в рівняннях реакцій і з одиницями вимірювання. Перед здачею роботи завжди перевіряйте суми верхніх і нижніх індексів та одиниці у відповіді.", "Ще одна поширена помилка — вважати, що за два періоди піврозпаду розпадаються всі ядра. Насправді залишається чверть."], "ul": ["Плутають A і Z: масове число — угорі, зарядове — унизу.", "Вважають, що під час β-розпаду Z зменшується; насправді він зростає на 1.", "Забувають, що кількість нейтронів N = A − Z, а не A.", "Плутають грей (поглинута доза) і зіверт (еквівалентна доза), а також Бк (активність) з одиницями доз.", "Не переводять МеВ у джоулі (×1,6·10⁻¹³) і доби в секунди (×86 400).", "Вважають, що за час 2T розпадаються всі ядра (насправді — 3/4)."]}], "formulas": [{"f": "A = Z + N", "d": "склад ядра"}, {"f": "q_я = Z·e", "d": "заряд ядра, e = 1,6·10⁻¹⁹ Кл"}, {"f": "Δm = (Z·m_p + N·m_n) − m_я", "d": "дефект мас"}, {"f": "E_зв = Δm·c² ≈ 931,5 МеВ · Δm (а. о. м.)", "d": "енергія зв’язку ядра"}, {"f": "E_пит = E_зв / A", "d": "питома енергія зв’язку"}, {"f": "ᴬ_Z X → ᴬ⁻⁴_(Z−2) Y + ⁴₂He", "d": "α-розпад"}, {"f": "ᴬ_Z X → ᴬ_(Z+1) Y + ⁰₋₁e + ν̃", "d": "β-розпад"}, {"f": "N = N₀ / 2ⁿ, n = t/T", "d": "закон радіоактивного розпаду"}, {"f": "A = λN, λ ≈ 0,69/T", "d": "активність радіоактивної речовини"}, {"f": "D = W / m", "d": "поглинута доза, Гр"}, {"f": "H = K·D", "d": "еквівалентна доза, Зв"}, {"f": "H = P·t", "d": "доза, накопичена за час t"}, {"f": "E = N·E₁, E₁ ≈ 200 МеВ", "d": "енергія поділу N ядер ²³⁵U"}, {"f": "η = P_ел / P_т · 100 %", "d": "ККД АЕС"}], "terms": [["Атомне ядро", "позитивно заряджена центральна частина атома, що складається з протонів і нейтронів."], ["Ізотопи", "атоми одного елемента з однаковою кількістю протонів і різною кількістю нейтронів у ядрі."], ["Ядерні сили", "короткодійні сили притягання між нуклонами, що утримують їх у ядрі."], ["Енергія зв’язку ядра", "енергія, потрібна для розщеплення ядра на окремі нуклони."], ["Радіоактивність", "самочинне перетворення одних ядер на інші з випромінюванням частинок."], ["Період піврозпаду", "час, за який розпадається половина наявних радіоактивних ядер."], ["Активність", "кількість розпадів ядер за одиницю часу."], ["Еквівалентна доза", "поглинута доза, помножена на коефіцієнт якості випромінювання."], ["Ланцюгова ядерна реакція", "реакція поділу, у якій нейтрони одних поділів спричиняють поділ інших ядер."], ["Термоядерна реакція", "злиття легких ядер у важче за дуже високої температури."]], "examples": [{"q": "Ядро ²²⁶₈₈Ra зазнає α-розпаду. Запишіть рівняння. Утворене ядро радіоактивне з періодом піврозпаду 3,8 доби. Яка частка цих ядер розпадеться за 15,2 доби?", "s": ["Дано: ²²⁶₈₈Ra, α-розпад; T = 3,8 доби; t = 15,2 доби.", "Розв’язання: A = 226 − 4 = 222; Z = 88 − 2 = 86 — Радон: ²²⁶₈₈Ra → ²²²₈₆Rn + ⁴₂He. n = t/T = 15,2/3,8 = 4. Залишиться 1/2⁴ = 1/16 ядер, розпадеться 1 − 1/16 = 15/16 ≈ 94 %.", "Відповідь: утворюється ²²²₈₆Rn; за 15,2 доби розпадеться 15/16 (≈ 94 %) ядер Радону."]}, {"q": "Енергоблок АЕС має теплову потужність 3000 МВт і ККД 33 %. Яку електроенергію він виробляє за рік і скільки Урану-235 при цьому витрачає? (1 рік ≈ 3,15·10⁷ с ≈ 8760 год; поділ 1 г ²³⁵U дає 8,2·10¹⁰ Дж.)", "s": ["Дано: P_т = 3000 МВт = 3·10⁹ Вт; η = 33 %; t = 3,15·10⁷ с.", "Розв’язання: P_ел = η·P_т = 0,33 · 3000 МВт ≈ 1000 МВт = 10⁶ кВт. W = P_ел·t = 10⁶ кВт · 8760 год ≈ 8,8·10⁹ кВт·год. Теплова енергія Q = P_т·t = 3·10⁹ · 3,15·10⁷ ≈ 9,5·10¹⁶ Дж. m = Q / (8,2·10¹⁰ Дж/г) ≈ 1,2·10⁶ г.", "Відповідь: ≈ 8,8 млрд кВт·год електроенергії; ≈ 1,2 т Урану-235 за рік."]}], "lab": null, "f": "За відкриття, пов’язані з будовою атома і радіоактивністю, Нобелівські премії отримали Беккерель і подружжя Кюрі, Резерфорд, Бор, Чедвік, Фермі та багато інших. Марія Склодовська-Кюрі — єдина людина, яка отримала Нобелівські премії у двох різних природничих науках: фізиці (1903) і хімії (1911).", "pr": ["Складіть опорну схему (інтелект-карту) теми «Будова атома та атомного ядра» з гілками: будова атома, ядро, радіоактивність, дозиметрія, ядерна енергетика. До кожної гілки — головні терміни й формули.", "Розв’яжіть: скільки α- і β-розпадів відбувається під час перетворення ²³⁸₉₂U на ²²⁶₈₈Ra? Яка частка ядер ⁶⁰Co (T = 5,3 року) залишиться через 21,2 року?"], "qz": [{"q": "Що довели досліди Резерфорда?", "o": ["Атом неподільний", "Позитивний заряд рівномірно розподілений в атомі", "Існування маленького масивного ядра", "Існування нейтрона"], "a": 2, "why": "Відхилення α-частинок на великі кути пояснюється лише наявністю ядра."}, {"q": "Скільки протонів і нейтронів у ядрі ¹⁹⁷₇₉Au?", "o": ["79 і 118", "118 і 79", "79 і 197", "197 і 79"], "a": 0, "why": "Z = 79; N = 197 − 79 = 118."}, {"q": "Яка властивість НЕ притаманна ядерним силам?", "o": ["Короткодійність", "Зарядова незалежність", "Насичення", "Дія на необмежених відстанях"], "a": 3, "why": "Ядерні сили діють лише на відстанях ~10⁻¹⁵ м."}, {"q": "Яке ядро утворюється в результаті β-розпаду ¹³¹₅₃I?", "o": ["¹²⁷₅₁Sb", "¹³¹₅₄Xe", "¹³¹₅₂Te", "¹³²₅₃I"], "a": 1, "why": "A = 131 не змінюється, Z = 53 + 1 = 54 — Ксенон."}, {"q": "Т = 10 хв. Яка частка ядер залишиться через 40 хв?", "o": ["1/4", "1/8", "1/40", "1/16"], "a": 3, "why": "n = 4; 1/2⁴ = 1/16."}, {"q": "Яке випромінювання найнебезпечніше, коли його джерело потрапило всередину організму?", "o": ["α", "β", "γ", "Видиме світло"], "a": 0, "why": "α-частинки мають найбільшу йонізувальну здатність, K = 20."}, {"q": "Поглинута доза γ-випромінювання 4 мГр. Яка еквівалентна доза?", "o": ["80 мЗв", "0,2 мЗв", "4 мЗв", "40 мЗв"], "a": 2, "why": "Для γ-випромінювання K = 1, H = 4 мЗв."}, {"q": "Що використовують як сповільнювач нейтронів у реакторах ВВЕР?", "o": ["Кадмій", "Воду", "Бор", "Свинець"], "a": 1, "why": "У ВВЕР вода — і сповільнювач, і теплоносій."}, {"q": "Що є джерелом енергії Сонця?", "o": ["Горіння водню в кисні", "Поділ ядер Урану", "Радіоактивний розпад Радію", "Термоядерний синтез Гелію з Гідрогену"], "a": 3, "why": "У надрах Сонця протони зливаються в ядра Гелію."}, {"q": "Яка АЕС України розташована на Рівненщині?", "o": ["Запорізька", "Хмельницька", "Рівненська", "Південноукраїнська"], "a": 2, "why": "Рівненська АЕС — у м. Вараш Рівненської області."}]}, {"n": "86", "type": "test", "t": "Комплексна підсумкова робота № 5 з теми «Будова атома та атомного ядра»", "gr": "ГР1, ГР2, ГР3", "g": "Підготуватися до комплексної підсумкової роботи: зрозуміти її структуру й критерії оцінювання, повторити ключові формули й потренуватися на типових завданнях.", "blocks": [{"h": "Що перевіряє підсумкова робота", "p": ["Робота перевіряє, наскільки ви розумієте будову атома і ядра, природу радіоактивності, вмієте записувати рівняння ядерних реакцій, застосовувати закон радіоактивного розпаду, обчислювати дози опромінення та енергію ядерних реакцій.", "Оцінюються всі три групи результатів: знання фактів і понять, уміння розв’язувати задачі та здатність пояснювати явища й оцінювати їхнє значення для людини (зокрема радіаційну безпеку та атомну енергетику України)."], "ul": ["Моделі атома, досліди Резерфорда, склад ядра, ізотопи.", "Ядерні сили, дефект мас, енергія зв’язку.", "Види радіоактивного випромінювання, правила зміщення.", "Період піврозпаду, активність, застосування ізотопів.", "Дозиметричні величини, радіаційний фон, захист.", "Поділ ядер, ланцюгова реакція, реактор, АЕС України, термоядерний синтез."]}, {"h": "Структура роботи", "p": ["Типова робота складається із завдань трьох видів, розташованих від простіших до складніших. Тестові завдання перевіряють знання означень, одиниць і фактів; завдання на відповідність — уміння пов’язувати величини, одиниці та явища; розрахункові — уміння розв’язувати задачі з повним оформленням.", "У дистанційному форматі роботу виконують у визначений учителем час; розрахункові задачі оформлюють на аркуші й надсилають фото розв’язання."], "ul": ["Тестові завдання з однією правильною відповіддю (наприклад, «Яке випромінювання не відхиляється магнітним полем?»).", "Завдання на встановлення відповідності (величина — одиниця; вид випромінювання — його природа).", "Завдання на запис рівнянь ядерних реакцій і визначення невідомої частинки.", "Розрахункові задачі: закон розпаду, дози, енергія зв’язку або енергія поділу.", "Можливе якісне завдання: пояснити явище чи правило безпеки."]}, {"h": "Як готуватися", "p": ["Повторіть конспекти уроків 73–85, особливо узагальнювальний урок. Випишіть усі формули на одну сторінку і переконайтеся, що розумієте зміст кожної літери та її одиницю.", "Розв’яжіть по 2–3 задачі кожного типу з уроків розв’язування задач, не підглядаючи у відповіді, а потім перевірте себе."], "ul": ["Вивчіть таблицю α, β, γ: природа, заряд, проникна здатність.", "Потренуйтеся записувати рівняння α- і β-розпадів і перевіряти суми індексів.", "Запам’ятайте степені двійки: 2, 4, 8, 16, 32, 64 — вони потрібні для задач на піврозпад.", "Повторіть префікси: м = 10⁻³, мк = 10⁻⁶, М = 10⁶ і перехід МеВ → Дж.", "Пройдіть тренувальний тест нижче та розберіть помилки за поясненнями."]}, {"h": "Критерії оцінювання", "p": ["Кожне завдання має свою кількість балів, яку зазначають у варіанті. У тестових завданнях оцінюється лише правильність відповіді, у розрахункових — повнота й правильність розв’язання.", "Навіть якщо остаточна відповідь неправильна через арифметичну помилку, правильно записані дані, формули й хід розв’язання оцінюються частиною балів."], "ul": ["Повний бал за задачу: є «Дано», переведення в СІ (за потреби), формула, підстановка з одиницями, обчислення і відповідь.", "Частковий бал: правильно обрано формулу, але є помилка в обчисленнях або одиницях.", "Рівняння реакції зараховується, якщо правильно знайдено і A, і Z та названо елемент.", "Якісне завдання: оцінюється фізично правильне пояснення з використанням термінів.", "Самостійність виконання обов’язкова; списані роботи не зараховуються."]}], "formulas": [{"f": "A = Z + N", "d": "склад ядра"}, {"f": "E_зв = Δm·c² ≈ 931,5 МеВ · Δm (а. о. м.)", "d": "енергія зв’язку ядра"}, {"f": "α: A → A − 4, Z → Z − 2; β: A → A, Z → Z + 1", "d": "правила зміщення"}, {"f": "N = N₀ / 2ⁿ, n = t/T", "d": "закон радіоактивного розпаду"}, {"f": "A = λN", "d": "активність"}, {"f": "D = W / m; H = K·D", "d": "поглинута та еквівалентна дози"}, {"f": "H = P·t", "d": "накопичена доза"}, {"f": "E = N·E₁; η = P_ел / P_т · 100 %", "d": "енергія поділу ядер і ККД АЕС"}], "terms": [], "examples": [{"q": "Скільки α- і β-розпадів відбувається в ланцюжку перетворень ²³⁵₉₂U → ²⁰⁷₈₂Pb?", "s": ["Дано: A₁ = 235, Z₁ = 92; A₂ = 207, Z₂ = 82.", "Розв’язання: n_α = (235 − 207)/4 = 28/4 = 7. Після 7 α-розпадів Z = 92 − 14 = 78. n_β = 82 − 78 = 4.", "Відповідь: 7 α-розпадів і 4 β-розпади."]}, {"q": "У зразку було 4,8·10¹² ядер ізотопу з періодом піврозпаду 2 год. Скільки ядер розпадеться за 8 год?", "s": ["Дано: N₀ = 4,8·10¹²; T = 2 год; t = 8 год.", "Розв’язання: n = 8/2 = 4. N = N₀/2⁴ = 4,8·10¹²/16 = 3·10¹¹. ΔN = N₀ − N = 4,8·10¹² − 0,3·10¹² = 4,5·10¹².", "Відповідь: 4,5·10¹² ядер."]}, {"q": "Тканина масою 0,4 кг поглинула 2·10⁻⁴ Дж енергії α-випромінювання і 4·10⁻⁴ Дж енергії γ-випромінювання. Визначте сумарну еквівалентну дозу.", "s": ["Дано: m = 0,4 кг; W_α = 2·10⁻⁴ Дж, K_α = 20; W_γ = 4·10⁻⁴ Дж, K_γ = 1.", "Розв’язання: D_α = 2·10⁻⁴/0,4 = 5·10⁻⁴ Гр; D_γ = 4·10⁻⁴/0,4 = 1·10⁻³ Гр. H = 20 · 5·10⁻⁴ + 1 · 1·10⁻³ = 1·10⁻² + 1·10⁻³ = 1,1·10⁻² Зв.", "Відповідь: 11 мЗв."]}], "lab": null, "f": "", "pr": ["Складіть власну «шпаргалку-формульник» на одну сторінку з усіма формулами теми, одиницями і значеннями сталих (e, c, N_A, 1 МеВ, 1 а. о. м.).", "Розв’яжіть: активність препарату ¹³¹I (T = 8 діб) становить 3,2·10⁸ Бк. Через скільки діб вона зменшиться до 2·10⁷ Бк? Запишіть рівняння β-розпаду ¹³¹₅₃I."], "qz": [{"q": "З яких частинок складається атомне ядро?", "o": ["З протонів і електронів", "З протонів і нейтронів", "З нейтронів і електронів", "Лише з протонів"], "a": 1, "why": "Ядро складається з нуклонів — протонів і нейтронів."}, {"q": "Чим відрізняються ізотопи ³⁵₁₇Cl і ³⁷₁₇Cl?", "o": ["Кількістю протонів", "Кількістю електронів", "Кількістю нейтронів", "Хімічними властивостями"], "a": 2, "why": "Z однакове (17), нейтронів — 18 і 20."}, {"q": "Яке ядро утворюється під час α-розпаду ²²²₈₆Rn?", "o": ["²¹⁸₈₄Po", "²²²₈₇Fr", "²¹⁸₈₆Rn", "²²⁶₈₈Ra"], "a": 0, "why": "A = 222 − 4 = 218, Z = 86 − 2 = 84 — Полоній."}, {"q": "Визначте X: ²⁷₁₃Al + ⁴₂He → ³⁰₁₅P + X.", "o": ["¹₁p", "⁰₋₁e", "⁴₂He", "¹₀n"], "a": 3, "why": "A: 31 − 30 = 1; Z: 15 − 15 = 0 — нейтрон."}, {"q": "Активність 6400 Бк, T = 3 доби. Якою буде активність через 12 діб?", "o": ["400 Бк", "1600 Бк", "800 Бк", "200 Бк"], "a": 0, "why": "n = 4; 6400/16 = 400 Бк."}, {"q": "Установіть відповідність: «зіверт» — одиниця…", "o": ["активності", "поглинутої дози", "еквівалентної дози", "енергії"], "a": 2, "why": "Зіверт — одиниця еквівалентної дози."}, {"q": "Дефект мас ядра 0,05 а. о. м. Енергія зв’язку становить…", "o": ["4,66 МеВ", "46,6 МеВ", "466 МеВ", "0,466 МеВ"], "a": 1, "why": "931,5 · 0,05 ≈ 46,6 МеВ."}, {"q": "Тіло масою 40 кг поглинуло 0,02 Дж енергії β-випромінювання. Яка еквівалентна доза?", "o": ["0,8 мЗв", "2 мЗв", "5 мЗв", "0,5 мЗв"], "a": 3, "why": "D = 0,02/40 = 5·10⁻⁴ Гр; H = 0,5 мЗв."}, {"q": "Яке твердження про ланцюгову реакцію правильне?", "o": ["За k < 1 вона наростає", "Для неї потрібна маса палива, не менша за критичну", "Вона можлива лише в зорях", "Її спричиняють електрони"], "a": 1, "why": "Якщо маса менша за критичну, забагато нейтронів вилітає назовні."}, {"q": "Чому синтез легких ядер супроводжується виділенням енергії?", "o": ["Бо продукт має більшу питому енергію зв’язку", "Бо легкі ядра радіоактивні", "Бо зменшується температура", "Бо поглинаються нейтрони"], "a": 0, "why": "Ядро Гелію міцніше за ядра Гідрогену, різниця енергій зв’язку виділяється."}]}, {"n": "87", "type": "project", "t": "Захист навчальних проєктів", "gr": "ГР1, ГР2, ГР3", "g": "Підготувати й захистити навчальний проєкт з теми «Будова атома та атомного ядра», навчитися представляти результати дослідження і відповідати на запитання.", "blocks": [{"h": "Як підготувати проєкт", "p": ["Навчальний проєкт — це ваше власне невелике дослідження: ви ставите запитання, шукаєте відповідь у надійних джерелах, робите розрахунки чи порівняння і формулюєте висновки. Працювати можна самостійно або в парі.", "Обирайте тему, яка вам справді цікава, і звужуйте її: краще глибоко розкрити одне питання, ніж поверхово — п’ять. Користуйтеся науково-популярними виданнями, сайтами наукових установ і офіційних організацій, зазначайте джерела в кінці роботи."], "ul": ["Титульна сторінка: тема, автор, клас, керівник.", "Вступ: актуальність теми, мета і завдання проєкту.", "Основна частина: теоретичні відомості, факти, розрахунки, порівняльні таблиці або схеми.", "Висновки: відповіді на поставлені завдання, власна думка.", "Список використаних джерел.", "Презентація для захисту: 8–12 слайдів, мінімум тексту, графіки, схеми."]}, {"h": "Теми проєктів за розділом", "p": ["Оберіть одну з тем або запропонуйте власну, погодивши її з учителем. Кожна тема передбачає не лише опис, а й власну розрахункову чи аналітичну частину.", "Для тем про Україну використовуйте лише офіційні та перевірені дані."], "ul": ["Історія відкриття будови атома: від Демокріта до Бора.", "Марія Склодовська-Кюрі: життя і відкриття.", "Радіоактивні ізотопи в медицині: діагностика і лікування.", "Радіовуглецевий метод: як визначають вік археологічних знахідок.", "Радон у наших домівках: звідки береться і як зменшити його вплив.", "Рівненська АЕС і атомна енергетика України: переваги, ризики, безпека.", "Чорнобильська катастрофа: причини, наслідки, уроки для людства.", "Термоядерний синтез: енергія зір на Землі."]}, {"h": "Як проходить захист і критерії оцінювання", "p": ["На захист відводиться 5–7 хвилин виступу і 2–3 хвилини на запитання. У дистанційному форматі захист відбувається на онлайн-уроці з демонстрацією екрана; презентацію заздалегідь надсилають учителеві.", "Оцінюють не лише зміст, а й те, як ви розумієте матеріал: чи можете пояснити своїми словами, відповісти на запитання однокласників і вчителя."], "ul": ["Відповідність змісту темі та фізична правильність.", "Наявність власної частини: розрахунку, порівняння, опитування чи аналізу даних.", "Логічність і зрозумілість викладу, дотримання часу.", "Якість презентації: наочність, грамотність, посилання на джерела.", "Уміння відповідати на запитання й обстоювати власні висновки."]}, {"h": "Приклад плану виступу", "p": ["Нижче — приклад плану виступу на тему «Радон у наших домівках». За таким самим зразком можна побудувати виступ на будь-яку тему.", "Говоріть, а не читайте зі слайдів: слайди лише ілюструють вашу розповідь."], "ul": ["1. Привітання, тема, чому я її обрав (30 с).", "2. Що таке радон: ізотоп ²²²Rn, α-розпад, T ≈ 3,8 доби (1 хв).", "3. Звідки радон потрапляє в будинки: ґрунт, будматеріали, вода (1 хв).", "4. Чому він небезпечний: внутрішнє α-опромінення легень, K = 20 (1 хв).", "5. Власний розрахунок або опитування: як часто родини провітрюють приміщення (1,5 хв).", "6. Поради, як зменшити вплив радону (1 хв).", "7. Висновки і подяка за увагу (30 с)."]}], "formulas": [], "terms": [["Навчальний проєкт", "самостійне дослідження учня, що має мету, завдання, результат і публічний захист."], ["Актуальність", "обґрунтування того, чому тема важлива для людей і суспільства сьогодні."]], "examples": [], "lab": null, "f": "", "pr": ["Оберіть тему проєкту, сформулюйте мету і 3–4 завдання та надішліть їх учителеві.", "Підготуйте презентацію (8–12 слайдів) і план виступу на 5–7 хвилин за поданим зразком."], "qz": [{"q": "Який ізотоп використовують для радіовуглецевого датування?", "o": ["¹²C", "¹³¹I", "¹⁴C", "²³⁵U"], "a": 2, "why": "Вік органічних решток визначають за розпадом ¹⁴C."}, {"q": "Хто запропонував планетарну модель атома?", "o": ["Е. Резерфорд", "Дж. Дж. Томсон", "А. Беккерель", "Е. Фермі"], "a": 0, "why": "Модель Резерфорд запропонував 1911 року за результатами дослідів з α-частинками."}, {"q": "Який вид випромінювання створює радон, потрапляючи в легені?", "o": ["γ", "Рентгенівське", "β", "α"], "a": 3, "why": "²²²Rn зазнає α-розпаду, і α-частинки опромінюють тканини легень."}, {"q": "Коли сталася Чорнобильська катастрофа?", "o": ["1979 р.", "1986 р.", "1991 р.", "2011 р."], "a": 1, "why": "Аварія на ЧАЕС сталася 26 квітня 1986 року."}, {"q": "Що є джерелом енергії зір?", "o": ["Термоядерний синтез", "Поділ Урану", "Хімічне горіння", "Радіоактивний розпад Радію"], "a": 0, "why": "У надрах зір легкі ядра зливаються у важчі з виділенням енергії."}]}]}, {"title": "Повторення вивченого матеріалу", "lessons": [{"n": "88", "type": "repeat", "t": "Механічний рух", "gr": "ГР1, ГР2, ГР3", "g": "Повторити основні поняття кінематики з 7 класу: механічний рух, його відносність, шлях, швидкість, рівномірний рух, рух по колу та коливання.", "blocks": [{"h": "Механічний рух і його відносність", "p": ["Механічний рух — це зміна положення тіла в просторі відносно інших тіл з часом. Щоб описати рух, обирають тіло відліку, пов’язують з ним систему координат і прилад для вимірювання часу — разом це система відліку.", "Рух відносний: пасажир у потязі нерухомий відносно вагона, але рухається відносно перону. Тому завжди треба вказувати, відносно якого тіла розглядаємо рух."], "ul": ["Матеріальна точка — тіло, розмірами якого в цій задачі можна знехтувати.", "Траєкторія — лінія, вздовж якої рухається тіло (пряма або крива).", "Шлях l — довжина траєкторії; скалярна величина.", "Переміщення — напрямлений відрізок, що з’єднує початкове і кінцеве положення тіла.", "За один повний оберт по колу шлях дорівнює довжині кола, а переміщення — нулю."]}, {"h": "Швидкість. Рівномірний і нерівномірний рух", "p": ["Рух називають рівномірним прямолінійним, якщо тіло за будь-які однакові інтервали часу проходить однакові відстані вздовж прямої. Швидкість такого руху v = l/t стала.", "У реальному житті рух зазвичай нерівномірний: автомобіль розганяється, гальмує, зупиняється. Тоді користуються середньою швидкістю — відношенням усього шляху до всього часу руху (а не середнім арифметичним швидкостей!)."], "ul": ["Одиниця швидкості в СІ — 1 м/с.", "1 км/год = 1000 м / 3600 с ≈ 0,28 м/с; 36 км/год = 10 м/с.", "Графік швидкості рівномірного руху — пряма, паралельна осі часу.", "Графік шляху рівномірного руху — пряма, що виходить з початку координат; що крутіша пряма, то більша швидкість.", "Площа під графіком швидкості чисельно дорівнює пройденому шляху."]}, {"h": "Рух по колу", "p": ["Рівномірний рух по колу — рух, за якого тіло за будь-які однакові інтервали часу проходить однакові дуги. Його характеризують періодом обертання T (час одного оберту) та обертовою частотою n (кількість обертів за секунду).", "Хоча модуль швидкості при цьому не змінюється, її напрямок постійно змінюється: швидкість спрямована по дотичній до кола. Саме тому бризки з-під колеса летять по дотичній."], "ul": ["T = t/N, де N — кількість обертів за час t; [T] = 1 с.", "n = N/t = 1/T; [n] = 1 об/с = 1 с⁻¹.", "Швидкість руху по колу: v = 2πR/T.", "Приклади: обертання стрілок годинника, колеса велосипеда, Землі навколо своєї осі (T = 1 доба)."]}, {"h": "Механічні коливання", "p": ["Коливання — рух, який точно або приблизно повторюється через однакові інтервали часу. Приклади: гойдалка, маятник годинника, тягарець на пружині, струна гітари.", "Коливання характеризують амплітудою (найбільшим відхиленням від положення рівноваги), періодом T (час одного повного коливання) і частотою ν = 1/T, яку вимірюють у герцах."], "ul": ["Амплітуда A — вимірюють у метрах.", "Період T = t/N — у секундах.", "Частота ν = N/t = 1/T, 1 Гц = 1 коливання за секунду.", "Період математичного маятника не залежить від маси тягарця і (за малих відхилень) від амплітуди, а залежить від довжини нитки."]}], "formulas": [{"f": "v = l / t", "d": "швидкість рівномірного руху: l — шлях, t — час"}, {"f": "v_сер = l_заг / t_заг", "d": "середня швидкість нерівномірного руху"}, {"f": "T = t / N", "d": "період обертання (коливань): N — кількість обертів (коливань) за час t"}, {"f": "n = N / t = 1/T", "d": "обертова частота; для коливань — частота ν = 1/T, Гц"}, {"f": "v = 2πR / T", "d": "швидкість рівномірного руху по колу радіусом R"}], "terms": [["Механічний рух", "зміна положення тіла в просторі відносно інших тіл з часом."], ["Система відліку", "тіло відліку, пов’язана з ним система координат і прилад для вимірювання часу."], ["Траєкторія", "уявна лінія, вздовж якої рухається тіло."], ["Шлях", "довжина траєкторії, яку описало тіло за певний час."], ["Швидкість рівномірного руху", "фізична величина, що дорівнює відношенню шляху до часу, за який цей шлях пройдено."], ["Період", "час одного повного оберту або одного повного коливання."]], "examples": [{"q": "Автобус проїхав 120 км за 2 год, потім 30 хв стояв на зупинці, а далі проїхав ще 60 км за 1 год. Визначте середню швидкість автобуса на всьому шляху.", "s": ["Дано: l₁ = 120 км, t₁ = 2 год; t₂ = 0,5 год (стоянка, l₂ = 0); l₃ = 60 км, t₃ = 1 год.", "Розв’язання: v_сер = (l₁ + l₂ + l₃)/(t₁ + t₂ + t₃) = (120 + 0 + 60) км / (2 + 0,5 + 1) год = 180/3,5 ≈ 51 км/год.", "Відповідь: ≈ 51 км/год (≈ 14 м/с). Зверніть увагу: на обох ділянках автобус їхав зі швидкістю 60 км/год, але середня швидкість менша, бо враховано час стоянки."]}, {"q": "Карусель радіусом 5 м робить 6 обертів за 1 хв. Визначте період, обертову частоту та швидкість руху крайніх сидінь.", "s": ["Дано: R = 5 м; N = 6; t = 1 хв = 60 с.", "Розв’язання: T = t/N = 60/6 = 10 с. n = 1/T = 0,1 об/с. v = 2πR/T = 2 · 3,14 · 5 / 10 ≈ 3,14 м/с.", "Відповідь: T = 10 с; n = 0,1 об/с; v ≈ 3,1 м/с."]}], "lab": null, "f": "Сидячи на місці, ви рухаєтеся разом із Землею навколо Сонця зі швидкістю близько 30 км/с, тобто за час одного уроку (45 хв) пролітаєте приблизно 80 000 км.", "pr": ["Виміряйте за допомогою телефона-секундоміра час, за який ви проходите 100 кроків, виміряйте довжину кроку та обчисліть свою швидкість ходьби в м/с і км/год.", "Підвісьте невеликий тягарець на нитці довжиною близько 1 м, виміряйте час 20 коливань і обчисліть період і частоту. Повторіть з ниткою 0,25 м і порівняйте результати."], "qz": [{"q": "Відносно якого тіла нерухомий пасажир потяга, що їде?", "o": ["Відносно рейок", "Відносно вагона", "Відносно перону", "Відносно дерев за вікном"], "a": 1, "why": "Пасажир не змінює положення відносно вагона."}, {"q": "Велосипедист проїхав 3 км за 10 хв. Яка його швидкість?", "o": ["0,3 м/с", "30 м/с", "3 м/с", "5 м/с"], "a": 3, "why": "v = 3000 м / 600 с = 5 м/с."}, {"q": "72 км/год — це…", "o": ["20 м/с", "72 м/с", "7,2 м/с", "2 м/с"], "a": 0, "why": "72 · 1000 / 3600 = 20 м/с."}, {"q": "Тіло пройшло коло радіусом R і повернулося в початкову точку. Чому дорівнює переміщення?", "o": ["2πR", "πR", "Нулю", "R"], "a": 2, "why": "Початкове і кінцеве положення збігаються."}, {"q": "Колесо робить 120 обертів за 1 хв. Який період обертання?", "o": ["2 с", "0,5 с", "120 с", "60 с"], "a": 1, "why": "T = 60 с / 120 = 0,5 с."}, {"q": "Частота коливань струни 440 Гц. Що це означає?", "o": ["Струна робить 440 коливань за хвилину", "Одне коливання триває 440 с", "Амплітуда 440 мм", "Струна робить 440 коливань за секунду"], "a": 3, "why": "1 Гц — одне коливання за секунду."}, {"q": "Що показує площа під графіком швидкості рівномірного руху?", "o": ["Пройдений шлях", "Швидкість", "Час руху", "Прискорення"], "a": 0, "why": "Площа прямокутника v·t дорівнює шляху."}, {"q": "Як напрямлена швидкість тіла, що рівномірно рухається по колу?", "o": ["До центра кола", "Від центра кола", "По дотичній до кола", "Вертикально вгору"], "a": 2, "why": "У кожній точці швидкість напрямлена по дотичній до траєкторії."}]}, {"n": "89", "type": "repeat", "t": "Явище інерції. Інертність та маса тіла. Густина речовини", "gr": "ГР1, ГР2, ГР3", "g": "Повторити явище інерції, поняття інертності й маси тіла, густини речовини та навчитися розв’язувати задачі на обчислення маси, об’єму й густини.", "blocks": [{"h": "Явище інерції", "p": ["Чому тіла рухаються або зупиняються? Ще Галілео Галілей встановив: якщо на тіло не діють інші тіла (або їхні дії скомпенсовані), воно зберігає стан спокою чи рівномірного прямолінійного руху. Це явище називають інерцією.", "Ісаак Ньютон узагальнив це твердження як перший закон механіки (закон інерції). Тіло зупиняється або змінює швидкість лише тоді, коли на нього діють інші тіла: сила тертя, опір повітря, удар."], "ul": ["У разі різкого гальмування автобуса пасажири нахиляються вперед — за інерцією вони продовжують рух.", "Під час різкого старту пасажирів притискає до спинок сидінь.", "Пасок безпеки та подушки безпеки захищають від небезпечних наслідків інерції під час зіткнення.", "Щоб насадити молоток на ручку, ручкою б’ють об тверду поверхню.", "Струшуючи термометр чи килим, також використовують інерцію."]}, {"h": "Інертність і маса тіла", "p": ["Тіла по-різному змінюють свою швидкість під час взаємодії: важка вантажівка розганяється значно повільніше, ніж легкий велосипед. Властивість тіла, яка полягає в тому, що для зміни його швидкості потрібен певний час, називають інертністю.", "Мірою інертності тіла є його маса. Чим більша маса, тим інертніше тіло. Під час взаємодії двох тіл (наприклад, двох візків, відштовхнутих пружиною) швидкості, яких вони набувають, обернено пропорційні їхнім масам."], "ul": ["Одиниця маси в СІ — 1 кілограм (кг).", "1 т = 1000 кг; 1 г = 0,001 кг; 1 мг = 10⁻⁶ кг.", "Масу тіла вимірюють зважуванням на терезах.", "m₁/m₂ = v₂/v₁ — співвідношення під час взаємодії тіл, що спочатку були в спокої.", "Маса тіла не залежить від того, де воно перебуває: на Землі, на Місяці чи в космосі."]}, {"h": "Густина речовини", "p": ["Однакові за об’ємом тіла з різних речовин мають різну масу: залізна кулька важча за алюмінієву такого самого розміру. Цю відмінність характеризує густина речовини — маса одиниці об’єму речовини: ρ = m/V.", "Густина залежить від речовини та її стану: лід має меншу густину, ніж вода, тому він плаває. Знаючи густину, можна визначити масу тіла за його об’ємом або об’єм за масою."], "ul": ["Одиниця густини в СІ — 1 кг/м³; часто вживають г/см³: 1 г/см³ = 1000 кг/м³.", "Вода — 1000 кг/м³, лід — 900 кг/м³, повітря — ≈ 1,29 кг/м³.", "Алюміній — 2700 кг/м³, залізо (сталь) — 7800 кг/м³, мідь — 8900 кг/м³, золото — 19 300 кг/м³.", "Густина 1000 кг/м³ означає, що 1 м³ речовини має масу 1000 кг.", "За густиною можна визначити, з якої речовини виготовлено тіло (порівнявши з таблицею)."]}], "formulas": [{"f": "ρ = m / V", "d": "ρ — густина речовини, m — маса тіла, V — об’єм тіла"}, {"f": "m = ρV", "d": "маса тіла за відомими густиною і об’ємом"}, {"f": "V = m / ρ", "d": "об’єм тіла за відомими масою і густиною"}, {"f": "m₁ / m₂ = v₂ / v₁", "d": "співвідношення мас і швидкостей двох тіл, які взаємодіяли (спочатку в спокої)"}, {"f": "1 г/см³ = 1000 кг/м³", "d": "переведення одиниць густини"}], "terms": [["Інерція", "явище збереження тілом стану спокою або рівномірного прямолінійного руху, якщо на нього не діють інші тіла або їхні дії скомпенсовані."], ["Інертність", "властивість тіла, яка полягає в тому, що для зміни його швидкості потрібен певний час."], ["Маса", "фізична величина, яка є мірою інертності тіла."], ["Густина речовини", "фізична величина, що дорівнює відношенню маси тіла до його об’єму."], ["Взаємодія", "дія тіл одне на одне, унаслідок якої змінюються їхні швидкості або форма."]], "examples": [{"q": "Брусок масою 540 г має об’єм 200 см³. Визначте густину речовини і з’ясуйте, з чого виготовлено брусок.", "s": ["Дано: m = 540 г; V = 200 см³.", "Розв’язання: ρ = m/V = 540 г / 200 см³ = 2,7 г/см³ = 2700 кг/м³. За таблицею густин це алюміній.", "Відповідь: 2700 кг/м³; брусок алюмінієвий."]}, {"q": "Класна кімната має розміри 10 м × 6 м × 3 м. Яка маса повітря в ній (ρ = 1,29 кг/м³)?", "s": ["Дано: a = 10 м; b = 6 м; c = 3 м; ρ = 1,29 кг/м³.", "Розв’язання: V = a·b·c = 10 · 6 · 3 = 180 м³. m = ρV = 1,29 · 180 ≈ 232 кг.", "Відповідь: ≈ 232 кг — більше, ніж маса трьох дорослих людей."]}], "lab": null, "f": "Найщільніший метал за нормальних умов — осмій: його густина близько 22 600 кг/м³. Кубик осмію з ребром 10 см мав би масу понад 22 кг.", "pr": ["Визначте густину картоплини або яблука вдома: виміряйте масу на кухонних вагах, а об’єм — за підняттям рівня води в мірній склянці. Порівняйте з густиною води і поясніть, чи потоне цей овоч (фрукт).", "Наведіть 5 прикладів прояву інерції з власного життя (транспорт, спорт, побут) і поясніть кожен одним-двома реченнями."], "qz": [{"q": "Чому пасажири нахиляються вперед під час різкого гальмування автобуса?", "o": ["Через тертя об сидіння", "За інерцією продовжують рух", "Їх штовхає повітря", "Через притягання до водія"], "a": 1, "why": "Тіло пасажира за інерцією зберігає швидкість, коли автобус гальмує."}, {"q": "Що є мірою інертності тіла?", "o": ["Об’єм", "Густина", "Маса", "Швидкість"], "a": 2, "why": "Чим більша маса, тим інертніше тіло."}, {"q": "Яка одиниця густини в СІ?", "o": ["кг/м³", "г/см³", "кг", "м³/кг"], "a": 0, "why": "ρ = m/V, у СІ — кг/м³."}, {"q": "Тіло масою 2 кг має об’єм 0,001 м³. Яка густина речовини?", "o": ["200 кг/м³", "20 кг/м³", "0,002 кг/м³", "2000 кг/м³"], "a": 3, "why": "ρ = 2 / 0,001 = 2000 кг/м³."}, {"q": "7,8 г/см³ — це…", "o": ["780 кг/м³", "7800 кг/м³", "78 кг/м³", "0,0078 кг/м³"], "a": 1, "why": "1 г/см³ = 1000 кг/м³, тому 7,8 г/см³ = 7800 кг/м³."}, {"q": "Яка маса 2 л води?", "o": ["2 кг", "0,2 кг", "20 кг", "2 г"], "a": 0, "why": "m = ρV = 1000 кг/м³ · 0,002 м³ = 2 кг."}, {"q": "Два візки відштовхнулися. Перший набув швидкості 2 м/с, другий — 1 м/с. Як співвідносяться їхні маси?", "o": ["m₁ = m₂", "m₁ = 2m₂", "m₂ = 3m₁", "m₂ = 2m₁"], "a": 3, "why": "m₁/m₂ = v₂/v₁ = 1/2, отже m₂ = 2m₁."}, {"q": "Чому лід плаває у воді?", "o": ["Бо він холодний", "Бо в ньому є повітря", "Бо його густина менша за густину води", "Бо він легший за будь-яку рідину"], "a": 2, "why": "ρ_льоду = 900 кг/м³ < ρ_води = 1000 кг/м³."}]}, {"n": "90", "type": "repeat", "t": "Імпульс тіла. Закон збереження імпульсу. Реактивний рух", "gr": "ГР1, ГР2, ГР3", "g": "Повторити поняття імпульсу тіла та імпульсу сили, закон збереження імпульсу й принцип реактивного руху та навчитися застосовувати їх до розв’язування задач.", "blocks": [{"h": "Імпульс тіла та імпульс сили", "p": ["Імпульс тіла — векторна фізична величина, що дорівнює добутку маси тіла на його швидкість: p = mv. Напрямок імпульсу завжди збігається з напрямком швидкості. Імпульс показує, наскільки «важко» зупинити тіло: вантажівку, що повільно котиться, зупинити складніше, ніж м’яч, що швидко летить.", "Щоб змінити імпульс тіла, на нього має діяти сила протягом певного часу. Добуток сили на час її дії FΔt називають імпульсом сили, і він дорівнює зміні імпульсу тіла: FΔt = Δp."], "ul": ["Одиниця імпульсу в СІ — кілограм-метр за секунду (кг·м/с).", "Імпульс — вектор: для тіл, що рухаються назустріч, проєкції імпульсів мають різні знаки.", "Чим довше триває удар, тим менша сила для тієї самої зміни імпульсу — тому подушки безпеки та м’які мати рятують від травм.", "Під час ловлі м’яча руку відводять назад, щоб збільшити час гальмування."]}, {"h": "Закон збереження імпульсу", "p": ["Систему тіл називають замкненою, якщо на неї не діють зовнішні сили (або їхня дія скомпенсована). У замкненій системі тіла можуть взаємодіяти лише одне з одним.", "Закон збереження імпульсу: векторна сума імпульсів тіл замкненої системи залишається незмінною під час будь-яких взаємодій тіл цієї системи. Для двох тіл: m₁v₁ + m₂v₂ = m₁v₁′ + m₂v₂′."], "ul": ["Закон виконується для зіткнень, пострілів, розривів снарядів, відштовхування.", "Віддача рушниці під час пострілу — наслідок закону збереження імпульсу.", "Якщо тіла після удару рухаються разом (непружний удар), їхня спільна швидкість v = (m₁v₁ + m₂v₂)/(m₁ + m₂).", "Перед розв’язуванням задачі обирайте вісь і враховуйте знаки проєкцій швидкостей."]}, {"h": "Реактивний рух", "p": ["Реактивний рух — це рух, який виникає, коли від тіла з певною швидкістю відокремлюється якась його частина. Тіло отримує імпульс, протилежний імпульсу частини, що відокремилася.", "Так рухаються ракети: розпечені гази викидаються із сопла назад, а ракета рухається вперед. Для ракети, що спочатку перебувала у спокої, m_г v_г = m_р v_р."], "ul": ["Реактивний рух не потребує опори чи повітря — тому ракети літають у космосі.", "У природі реактивно рухаються кальмари, восьминоги, медузи, виштовхуючи воду.", "Повітряна кулька, з якої виходить повітря, — найпростіша «ракета».", "Видатний внесок у теорію ракет зробили Юрій Кондратюк і Сергій Корольов, пов’язані з Україною."]}], "formulas": [{"f": "p = mv", "d": "p — імпульс тіла (кг·м/с), m — маса (кг), v — швидкість (м/с)"}, {"f": "FΔt = Δp = mv − mv₀", "d": "FΔt — імпульс сили, Δp — зміна імпульсу тіла"}, {"f": "m₁v₁ + m₂v₂ = m₁v₁′ + m₂v₂′", "d": "закон збереження імпульсу для двох тіл; v₁, v₂ — швидкості до взаємодії, v₁′, v₂′ — після"}, {"f": "m_г v_г = m_р v_р", "d": "реактивний рух зі стану спокою: m_г, v_г — маса і швидкість газів (частини, що відокремилася), m_р, v_р — маса і швидкість ракети"}], "terms": [["Імпульс тіла", "векторна величина, що дорівнює добутку маси тіла на його швидкість."], ["Імпульс сили", "добуток сили на час її дії, що дорівнює зміні імпульсу тіла."], ["Замкнена система", "система тіл, які взаємодіють лише одне з одним, а дія зовнішніх сил відсутня або скомпенсована."], ["Закон збереження імпульсу", "векторна сума імпульсів тіл замкненої системи не змінюється під час їх взаємодії."], ["Реактивний рух", "рух, що виникає внаслідок відокремлення від тіла його частини з певною швидкістю."]], "examples": [{"q": "Із гвинтівки масою 4 кг вилітає куля масою 9 г зі швидкістю 800 м/с. З якою швидкістю гвинтівка відкочується назад (віддача)?", "s": ["Дано: m_г = 4 кг, m_к = 9 г, v_к = 800 м/с. Знайти: v_г.", "СІ: m_к = 0,009 кг.", "Розв’язання: до пострілу система нерухома, сумарний імпульс дорівнює нулю. За законом збереження імпульсу m_к v_к = m_г v_г, звідки v_г = m_к v_к / m_г = 0,009 · 800 / 4 = 1,8 м/с.", "Відповідь: 1,8 м/с, у бік, протилежний руху кулі."]}, {"q": "Візок масою 2 кг, що рухається зі швидкістю 3 м/с, наздоганяє нерухомий візок масою 1 кг і зчіплюється з ним. Знайдіть швидкість візків після зчеплення.", "s": ["Дано: m₁ = 2 кг, v₁ = 3 м/с, m₂ = 1 кг, v₂ = 0. Знайти: v.", "Розв’язання: m₁v₁ + m₂v₂ = (m₁ + m₂)v, отже v = (m₁v₁ + m₂v₂)/(m₁ + m₂) = (2 · 3 + 0)/(2 + 1) = 2 м/с.", "Відповідь: 2 м/с."]}], "lab": null, "f": "Кальмари — одні з найшвидших мешканців моря: виштовхуючи воду з мантійної порожнини, вони рухаються реактивно і можуть навіть вистрибувати з води.", "pr": ["Поясніть за допомогою закону збереження імпульсу, чому човен відпливає від берега, коли людина стрибає з нього на берег.", "Розв’яжіть задачу: хлопчик масою 50 кг, стоячи на ковзанах, кидає вперед камінь масою 2 кг зі швидкістю 5 м/с. З якою швидкістю відкотиться хлопчик? (0,2 м/с)"], "qz": [{"q": "Яка формула визначає імпульс тіла?", "o": ["p = mg", "p = mv", "p = F/S", "p = mv²/2"], "a": 1, "why": "Імпульс дорівнює добутку маси тіла на його швидкість."}, {"q": "Одиниця імпульсу в СІ —", "o": ["кг·м/с", "Н/м", "Дж", "кг·м/с²"], "a": 0, "why": "[p] = кг · м/с."}, {"q": "Яким є імпульс м’яча масою 0,5 кг, що летить зі швидкістю 10 м/с?", "o": ["20 кг·м/с", "0,05 кг·м/с", "5 кг·м/с", "50 кг·м/с"], "a": 2, "why": "p = 0,5 · 10 = 5 кг·м/с."}, {"q": "Для якої системи тіл виконується закон збереження імпульсу?", "o": ["Для будь-якої", "Лише для тіл, що перебувають у спокої", "Лише для тіл однакової маси", "Для замкненої"], "a": 3, "why": "Закон справджується, коли на систему не діють зовнішні сили або їхня дія скомпенсована."}, {"q": "Чому під час стрибка на землю з висоти треба згинати ноги в колінах?", "o": ["Щоб зменшити масу тіла", "Щоб зменшити імпульс до удару", "Щоб збільшити час гальмування і зменшити силу удару", "Щоб збільшити швидкість приземлення"], "a": 2, "why": "Із FΔt = Δp випливає: більший час Δt — менша сила F."}, {"q": "На якому явищі ґрунтується рух ракети?", "o": ["Реактивний рух", "Інерція", "Тертя", "Дифузія"], "a": 0, "why": "Ракета рухається внаслідок викидання газів із сопла у протилежному напрямку."}, {"q": "Куля масою 10 г вилітає з рушниці масою 5 кг зі швидкістю 600 м/с. Швидкість віддачі рушниці —", "o": ["12 м/с", "0,12 м/с", "3 м/с", "1,2 м/с"], "a": 3, "why": "v = 0,01 · 600 / 5 = 1,2 м/с."}, {"q": "Тіло масою 2 кг змінило швидкість з 2 м/с до 6 м/с. Чому дорівнює імпульс сили, що подіяла на тіло?", "o": ["4 Н·с", "8 Н·с", "12 Н·с", "16 Н·с"], "a": 1, "why": "FΔt = m(v − v₀) = 2 · (6 − 2) = 8 Н·с."}]}, {"n": "91", "type": "repeat", "t": "Сили в природі. Виштовхувальна сила", "gr": "ГР1, ГР2, ГР3", "g": "Повторити основні види сил (тяжіння, пружності, тертя, вагу тіла) та закон Архімеда й умови плавання тіл.", "blocks": [{"h": "Сила та її характеристики", "p": ["Сила — векторна фізична величина, яка є мірою дії одного тіла на інше. Сила характеризується значенням (модулем), напрямком і точкою прикладання. Одиниця сили — ньютон (Н). Вимірюють силу динамометром.", "Якщо на тіло діє кілька сил, їх можна замінити однією — рівнодійною. Сили, напрямлені вздовж однієї прямої в один бік, додають, а в протилежні — віднімають."], "ul": ["Сила тяжіння F_тяж = mg напрямлена вертикально вниз, до центра Землі; g ≈ 9,8 Н/кг (у задачах часто 10 Н/кг).", "Сила пружності виникає під час деформації тіла; для малих деформацій виконується закон Гука F_пруж = kx.", "Вага тіла P — сила, з якою тіло тисне на опору або розтягує підвіс; для тіла у спокої P = mg.", "Сила тертя ковзання F_тер = μN напрямлена проти руху; μ — коефіцієнт тертя.", "Невагомість — стан, коли вага тіла дорівнює нулю (вільне падіння, орбітальна станція)."]}, {"h": "Виштовхувальна (архімедова) сила", "p": ["На тіло, занурене в рідину або газ, діє виштовхувальна сила, напрямлена вертикально вгору. Вона виникає тому, що тиск рідини на нижню частину тіла більший, ніж на верхню.", "Закон Архімеда: на тіло, занурене в рідину (газ), діє виштовхувальна сила, що дорівнює вазі рідини (газу) в об’ємі зануреної частини тіла: F_A = ρ_р g V_зан."], "ul": ["Архімедова сила залежить від густини рідини і об’єму зануреної частини тіла.", "Вона не залежить від густини і маси самого тіла.", "У солоній воді виштовхувальна сила більша, ніж у прісній, — у Мертвому морі людина не тоне.", "Повітроплавання (повітряні кулі, дирижаблі) можливе завдяки архімедовій силі в повітрі."]}, {"h": "Умови плавання тіл", "p": ["Поведінка тіла в рідині визначається співвідношенням сили тяжіння та архімедової сили, а отже — співвідношенням густин тіла і рідини.", "Судна мають велику водотоннажність, бо їхній корпус витісняє великий об’єм води, хоча сталь густіша за воду."], "ul": ["F_тяж > F_A (ρ_т > ρ_р) — тіло тоне.", "F_тяж = F_A (ρ_т = ρ_р) — тіло плаває всередині рідини.", "F_тяж < F_A (ρ_т < ρ_р) — тіло спливає, а потім плаває на поверхні, частково занурившись.", "Підводний човен змінює глибину, заповнюючи цистерни водою або продуваючи їх повітрям."]}], "formulas": [{"f": "F_тяж = mg", "d": "m — маса тіла, g ≈ 9,8 Н/кг — прискорення вільного падіння"}, {"f": "F_пруж = kx", "d": "закон Гука: k — жорсткість (Н/м), x — видовження (деформація), м"}, {"f": "F_тер = μN", "d": "μ — коефіцієнт тертя ковзання, N — сила нормальної реакції опори"}, {"f": "P = mg", "d": "вага тіла, що перебуває у спокої на горизонтальній опорі"}, {"f": "F_A = ρ_р g V_зан", "d": "ρ_р — густина рідини (газу), V_зан — об’єм зануреної частини тіла"}], "terms": [["Сила", "векторна фізична величина, що є мірою дії одного тіла на інше."], ["Сила пружності", "сила, що виникає під час деформації тіла і прагне повернути його до початкової форми."], ["Вага тіла", "сила, з якою тіло внаслідок притягання до Землі тисне на опору або розтягує підвіс."], ["Сила тертя", "сила, що виникає під час руху (або спроби руху) одного тіла по поверхні іншого і напрямлена проти руху."], ["Рівнодійна", "сила, яка чинить на тіло таку саму дію, як кілька одночасно прикладених сил."], ["Архімедова сила", "виштовхувальна сила, що діє на тіло, занурене в рідину або газ, і дорівнює вазі витісненої рідини (газу)."]], "examples": [{"q": "Пружину жорсткістю 200 Н/м розтягнули на 5 см. Яка сила пружності виникла?", "s": ["Дано: k = 200 Н/м, x = 5 см. Знайти: F_пруж.", "СІ: x = 0,05 м.", "Розв’язання: F_пруж = kx = 200 · 0,05 = 10 Н.", "Відповідь: 10 Н."]}, {"q": "Брусок об’ємом 2 дм³ і масою 1,5 кг повністю занурили у воду. Знайдіть архімедову силу. Спливе брусок чи потоне? (g = 10 Н/кг)", "s": ["Дано: V = 2 дм³, m = 1,5 кг, ρ_в = 1000 кг/м³. Знайти: F_A.", "СІ: V = 0,002 м³.", "Розв’язання: F_A = ρ_в g V = 1000 · 10 · 0,002 = 20 Н. F_тяж = mg = 1,5 · 10 = 15 Н. Оскільки F_A > F_тяж, брусок спливе.", "Відповідь: 20 Н; брусок спливе."]}], "lab": null, "f": "За легендою, Архімед відкрив свій закон, коли занурився у ванну, і з вигуком «Еврика!» («Знайшов!») побіг перевіряти, чи чиста корона царя Гієрона.", "pr": ["Наведіть по два приклади корисної та шкідливої дії сили тертя в побуті й техніці та запропонуйте способи її збільшення чи зменшення.", "Розв’яжіть задачу: камінь об’ємом 0,004 м³ лежить на дні річки. Яка архімедова сила на нього діє? (40 Н при g = 10 Н/кг)"], "qz": [{"q": "У яких одиницях вимірюють силу?", "o": ["кг", "Дж", "Н", "Па"], "a": 2, "why": "Одиниця сили в СІ — ньютон (Н)."}, {"q": "Чому дорівнює сила тяжіння, що діє на тіло масою 3 кг (g = 10 Н/кг)?", "o": ["30 Н", "3 Н", "0,3 Н", "300 Н"], "a": 0, "why": "F = mg = 3 · 10 = 30 Н."}, {"q": "Який закон описує залежність сили пружності від деформації?", "o": ["Закон Архімеда", "Закон Паскаля", "Закон Ома", "Закон Гука"], "a": 3, "why": "Закон Гука: F_пруж = kx."}, {"q": "Від чого НЕ залежить архімедова сила?", "o": ["Від густини рідини", "Від густини тіла", "Від об’єму зануреної частини тіла", "Від значення g"], "a": 1, "why": "F_A = ρ_р g V_зан — густини тіла у формулі немає."}, {"q": "Тіло тоне в рідині, якщо", "o": ["ρ_т < ρ_р", "ρ_т = ρ_р", "ρ_т > ρ_р", "маса тіла мала"], "a": 2, "why": "Якщо густина тіла більша за густину рідини, сила тяжіння перевищує архімедову силу."}, {"q": "Куди напрямлена сила тертя ковзання?", "o": ["Протилежно до напрямку руху тіла", "Вертикально вгору", "У напрямку руху", "Вертикально вниз"], "a": 0, "why": "Сила тертя протидіє руху тіла відносно поверхні."}, {"q": "На тіло, повністю занурене у воду, діє архімедова сила 50 Н. Який об’єм тіла (g = 10 Н/кг)?", "o": ["0,05 м³", "0,5 м³", "5 дм³", "50 дм³"], "a": 2, "why": "V = F_A/(ρg) = 50/(1000 · 10) = 0,005 м³ = 5 дм³."}, {"q": "Коли вага тіла дорівнює нулю?", "o": ["Коли тіло лежить на столі", "Під час вільного падіння", "Коли тіло у воді", "Ніколи"], "a": 1, "why": "У вільному падінні тіло не тисне на опору — це стан невагомості."}]}, {"n": "92", "type": "repeat", "t": "Тиск твердих тіл, рідин і газів", "gr": "ГР1, ГР2, ГР3", "g": "Повторити поняття тиску, способи його зміни, закон Паскаля, гідростатичний та атмосферний тиск і принцип дії гідравлічних машин.", "blocks": [{"h": "Тиск твердих тіл", "p": ["Тиск — фізична величина, що дорівнює відношенню сили, яка діє перпендикулярно до поверхні, до площі цієї поверхні: p = F/S. Одиниця тиску — паскаль (Па): 1 Па = 1 Н/м².", "Той самий вантаж може створювати різний тиск залежно від площі опори. Саме тому лижник не провалюється в сніг, а гострий ніж ріже легко."], "ul": ["Щоб збільшити тиск, зменшують площу опори (леза, голки, цвяхи, ікла тварин).", "Щоб зменшити тиск, збільшують площу опори (гусениці тракторів, широкі фундаменти, лижі).", "1 кПа = 1000 Па, 1 МПа = 1 000 000 Па.", "Тиск твердого тіла передається в напрямку дії сили."]}, {"h": "Тиск рідин і газів. Закон Паскаля", "p": ["Тиск газу зумовлений ударами його молекул об стінки посудини. Він зростає зі збільшенням температури і зменшенням об’єму.", "Закон Паскаля: тиск, що чиниться на рідину або газ, передається без змін у кожну точку рідини чи газу. Рідина тисне і на дно, і на стінки посудини, а на тій самій глибині — однаково в усіх напрямках."], "ul": ["Гідростатичний тиск p = ρgh залежить лише від густини рідини і глибини, а не від форми посудини.", "У сполучених посудинах однорідна рідина встановлюється на одному рівні (чайник, водопровід, шлюзи).", "Гідравлічний прес дає виграш у силі: F₂/F₁ = S₂/S₁.", "На принципі гідравлічної машини працюють гальма автомобілів, домкрати, екскаватори."]}, {"h": "Атмосферний тиск", "p": ["Атмосферний тиск — тиск повітряної оболонки Землі на всі тіла, що в ній перебувають. Уперше його виміряв Еванджеліста Торрічеллі за допомогою трубки з ртуттю.", "Нормальний атмосферний тиск дорівнює 760 мм рт. ст., що приблизно становить 101 325 Па (≈ 101 кПа). Із підйомом угору атмосферний тиск зменшується."], "ul": ["Прилади для вимірювання атмосферного тиску — ртутний барометр і барометр-анероїд.", "Манометри вимірюють тиск газів і рідин, більший чи менший за атмосферний.", "Поблизу поверхні Землі при підйомі на кожні 12 м тиск зменшується приблизно на 1 мм рт. ст.", "Завдяки атмосферному тиску працюють піпетки, шприци, присоски, поршневі насоси."]}], "formulas": [{"f": "p = F/S", "d": "p — тиск (Па), F — сила тиску (Н), S — площа поверхні (м²)"}, {"f": "p = ρgh", "d": "гідростатичний тиск: ρ — густина рідини, h — глибина (висота стовпа рідини)"}, {"f": "F₂/F₁ = S₂/S₁", "d": "гідравлічний прес: F₁, F₂ — сили на малому й великому поршнях, S₁, S₂ — їхні площі"}, {"f": "760 мм рт. ст. ≈ 101 325 Па", "d": "нормальний атмосферний тиск"}], "terms": [["Тиск", "фізична величина, що дорівнює відношенню сили тиску до площі поверхні, на яку ця сила діє перпендикулярно."], ["Закон Паскаля", "тиск, створений на рідину або газ, передається без змін у кожну точку рідини чи газу."], ["Гідростатичний тиск", "тиск нерухомої рідини, зумовлений її вагою."], ["Сполучені посудини", "посудини, з’єднані між собою знизу, у яких однорідна рідина встановлюється на одному рівні."], ["Атмосферний тиск", "тиск, який атмосфера Землі чинить на всі тіла в ній."], ["Барометр", "прилад для вимірювання атмосферного тиску."]], "examples": [{"q": "Учень масою 60 кг стоїть на підлозі. Площа обох підошв 400 см². Який тиск він чинить на підлогу? (g = 10 Н/кг)", "s": ["Дано: m = 60 кг, S = 400 см². Знайти: p.", "СІ: S = 0,04 м².", "Розв’язання: F = mg = 60 · 10 = 600 Н; p = F/S = 600 / 0,04 = 15 000 Па.", "Відповідь: 15 кПа."]}, {"q": "Який тиск чинить вода на водолаза на глибині 10 м (без урахування атмосферного тиску)? (g = 10 Н/кг)", "s": ["Дано: h = 10 м, ρ = 1000 кг/м³. Знайти: p.", "Розв’язання: p = ρgh = 1000 · 10 · 10 = 100 000 Па.", "Відповідь: 100 кПа — приблизно стільки ж, скільки нормальний атмосферний тиск."]}], "lab": null, "f": "У Маріанському жолобі на глибині близько 11 км тиск води перевищує атмосферний приблизно в тисячу разів, проте там живуть риби та інші організми.", "pr": ["Поясніть, чому вода в чайнику та в його носику завжди стоїть на одному рівні, і наведіть ще два приклади сполучених посудин.", "Розв’яжіть задачу: на малий поршень гідравлічного преса площею 5 см² діє сила 100 Н. Яка сила діє на великий поршень площею 500 см²? (10 000 Н)"], "qz": [{"q": "Одиниця тиску в СІ —", "o": ["ньютон", "паскаль", "джоуль", "ват"], "a": 1, "why": "1 Па = 1 Н/м²."}, {"q": "Як зменшити тиск тіла на опору?", "o": ["Зменшити площу опори", "Збільшити масу тіла", "Збільшити площу опори", "Загострити опору"], "a": 2, "why": "За p = F/S більша площа дає менший тиск."}, {"q": "Сила 200 Н діє на площу 0,5 м². Який тиск?", "o": ["100 Па", "400 Па", "200,5 Па", "40 Па"], "a": 1, "why": "p = 200 / 0,5 = 400 Па."}, {"q": "Від чого залежить тиск рідини на дно посудини?", "o": ["Від форми посудини", "Від площі дна", "Від маси посудини", "Від густини рідини і висоти її стовпа"], "a": 3, "why": "p = ρgh."}, {"q": "Який закон пояснює дію гідравлічного преса?", "o": ["Закон Паскаля", "Закон Гука", "Закон Архімеда", "Закон збереження імпульсу"], "a": 0, "why": "Тиск, створений малим поршнем, передається без змін на великий поршень."}, {"q": "Нормальний атмосферний тиск становить приблизно", "o": ["1 000 Па", "10 кПа", "1 МПа", "101 кПа"], "a": 3, "why": "760 мм рт. ст. ≈ 101 325 Па."}, {"q": "Тиск води на глибині 2 м (g = 10 Н/кг, без атмосферного) —", "o": ["20 кПа", "2 кПа", "200 кПа", "20 Па"], "a": 0, "why": "p = 1000 · 10 · 2 = 20 000 Па."}, {"q": "Як змінюється атмосферний тиск із підйомом угору?", "o": ["Зростає", "Не змінюється", "Зменшується", "Спочатку зростає, потім спадає"], "a": 2, "why": "Що вище, то менший стовп повітря над нами і менша густина повітря."}]}, {"n": "93", "type": "repeat", "t": "Прості механізми. Момент сили", "gr": "ГР1, ГР2, ГР3", "g": "Повторити види простих механізмів, поняття моменту сили, умову рівноваги важеля, «золоте правило» механіки та коефіцієнт корисної дії.", "blocks": [{"h": "Прості механізми", "p": ["Прості механізми — пристрої, що слугують для перетворення сили: змінюють її значення або напрямок. Основні прості механізми — важіль і похила площина; їхні різновиди — блок, комір, клин, гвинт.", "Прості механізми люди використовують із давніх часів: важелі допомагали будувати піраміди, блоки — піднімати вантажі на кораблях."], "ul": ["Важіль — тверде тіло, що може обертатися навколо нерухомої осі (опори).", "Нерухомий блок не дає виграшу в силі, а лише змінює її напрямок.", "Рухомий блок дає виграш у силі в 2 рази (без урахування тертя та ваги блока).", "Похила площина дає виграш у силі в стільки разів, у скільки її довжина більша за висоту.", "Ножиці, плоскогубці, лопата, весло — приклади важелів у побуті."]}, {"h": "Момент сили. Умова рівноваги важеля", "p": ["Плече сили l — найкоротша відстань від осі обертання до лінії дії сили. Момент сили M дорівнює добутку сили на її плече: M = Fl, одиниця — ньютон-метр (Н·м).", "Важіль перебуває в рівновазі, якщо момент сили, що обертає його за годинниковою стрілкою, дорівнює моменту сили, що обертає проти годинникової стрілки: F₁l₁ = F₂l₂. Звідси F₁/F₂ = l₂/l₁ — сили обернено пропорційні плечам."], "ul": ["Що довше плече, то меншу силу треба прикласти — тому гайки відкручують довгим ключем.", "Двері відчиняти легше, натискаючи далі від завіс.", "Правило моментів справджується для будь-якого тіла з віссю обертання.", "Якщо лінія дії сили проходить через вісь, плече дорівнює нулю й сила не обертає тіло."]}, {"h": "«Золоте правило» механіки та ККД", "p": ["«Золоте правило» механіки: жоден простий механізм не дає виграшу в роботі. У скільки разів виграємо в силі, у стільки ж разів програємо у відстані.", "Через тертя і вагу частин механізму повна (витрачена) робота завжди більша за корисну. Коефіцієнт корисної дії η показує, яку частину повної роботи становить корисна: η = A_к/A_повн · 100 %."], "ul": ["ККД будь-якого механізму менший за 100 %.", "Корисна робота під час підіймання вантажу A_к = mgh.", "Повна робота на похилій площині A_повн = Fl, де l — довжина площини.", "Щоб підвищити ККД, зменшують тертя (змащування, підшипники) і масу рухомих частин."]}], "formulas": [{"f": "M = Fl", "d": "M — момент сили (Н·м), F — сила (Н), l — плече сили (м)"}, {"f": "F₁l₁ = F₂l₂", "d": "умова рівноваги важеля (правило моментів)"}, {"f": "F₁/F₂ = l₂/l₁", "d": "сили, що діють на важіль, обернено пропорційні їхнім плечам"}, {"f": "η = A_к/A_повн · 100 %", "d": "ККД: A_к — корисна робота, A_повн — повна (витрачена) робота"}, {"f": "A_к = mgh, A_повн = Fl", "d": "для похилої площини: h — висота, l — довжина площини, F — прикладена сила"}], "terms": [["Простий механізм", "пристрій, що слугує для перетворення сили (зміни її значення або напрямку)."], ["Важіль", "тверде тіло, яке може обертатися навколо нерухомої осі."], ["Плече сили", "найкоротша відстань від осі обертання до лінії дії сили."], ["Момент сили", "фізична величина, що дорівнює добутку сили на її плече."], ["«Золоте правило» механіки", "жоден простий механізм не дає виграшу в роботі: виграючи в силі, програємо у відстані."], ["Коефіцієнт корисної дії", "фізична величина, що показує, яку частину повної роботи становить корисна робота."]], "examples": [{"q": "На коротке плече важеля завдовжки 0,2 м діє сила 300 Н. Яку силу треба прикласти до довгого плеча завдовжки 1,2 м, щоб важіль був у рівновазі?", "s": ["Дано: l₁ = 0,2 м, F₁ = 300 Н, l₂ = 1,2 м. Знайти: F₂.", "Розв’язання: F₁l₁ = F₂l₂, звідси F₂ = F₁l₁/l₂ = 300 · 0,2 / 1,2 = 50 Н.", "Відповідь: 50 Н (виграш у силі в 6 разів)."]}, {"q": "Ящик масою 50 кг рівномірно затягують на висоту 1 м похилою площиною завдовжки 2,5 м, прикладаючи силу 250 Н. Знайдіть ККД похилої площини. (g = 10 Н/кг)", "s": ["Дано: m = 50 кг, h = 1 м, l = 2,5 м, F = 250 Н. Знайти: η.", "Розв’язання: A_к = mgh = 50 · 10 · 1 = 500 Дж; A_повн = Fl = 250 · 2,5 = 625 Дж; η = 500/625 · 100 % = 80 %.", "Відповідь: 80 %."]}], "lab": null, "f": "Архімедові приписують слова: «Дайте мені точку опори — і я переверну Землю», якими він показував силу важеля.", "pr": ["Знайдіть удома три предмети, що є важелями (наприклад, ножиці, відкривачка, щипці), і для кожного вкажіть вісь обертання та плечі сил.", "Розв’яжіть задачу: за допомогою рухомого блока піднімають вантаж вагою 400 Н. Яку силу прикладають, якщо тертям і вагою блока знехтувати? (200 Н)"], "qz": [{"q": "Що таке плече сили?", "o": ["Довжина важеля", "Найкоротша відстань від осі обертання до лінії дії сили", "Відстань між двома силами", "Довжина вектора сили"], "a": 1, "why": "Плече вимірюють по перпендикуляру від осі до лінії дії сили."}, {"q": "Одиниця моменту сили —", "o": ["Н/м", "Дж/с", "Н·м", "кг·м"], "a": 2, "why": "M = Fl, отже [M] = Н·м."}, {"q": "Яку силу треба прикласти на відстані 0,5 м від осі, щоб зрівноважити силу 20 Н на відстані 0,25 м?", "o": ["40 Н", "5 Н", "20 Н", "10 Н"], "a": 3, "why": "F₂ = 20 · 0,25 / 0,5 = 10 Н."}, {"q": "Який простий механізм змінює лише напрямок сили?", "o": ["Нерухомий блок", "Рухомий блок", "Похила площина", "Клин"], "a": 0, "why": "Нерухомий блок — рівноплечий важіль, виграшу в силі він не дає."}, {"q": "Що стверджує «золоте правило» механіки?", "o": ["Прості механізми дають виграш у роботі", "Жоден механізм не дає виграшу в роботі", "ККД механізму завжди 100 %", "Сила і відстань завжди рівні"], "a": 1, "why": "Виграш у силі завжди супроводжується таким самим програшем у відстані."}, {"q": "Корисна робота 300 Дж, повна — 400 Дж. ККД механізму —", "o": ["133 %", "25 %", "75 %", "70 %"], "a": 2, "why": "η = 300/400 · 100 % = 75 %."}, {"q": "Чому ККД реального механізму завжди менший за 100 %?", "o": ["Через тертя і вагу частин механізму", "Через атмосферний тиск", "Бо вантаж важкий", "Бо механізм нерухомий"], "a": 0, "why": "Частина роботи витрачається на подолання тертя і переміщення частин механізму."}, {"q": "У скільки разів рухомий блок дає виграш у силі?", "o": ["У 4 рази", "Не дає", "У 1,5 раза", "У 2 рази"], "a": 3, "why": "Вантаж утримують дві частини мотузки, тому сила вдвічі менша за вагу вантажу."}]}, {"n": "94", "type": "repeat", "t": "Механічна робота. Потужність. Механічна енергія", "gr": "ГР1, ГР2, ГР3", "g": "Повторити поняття механічної роботи, потужності, кінетичної та потенціальної енергії й закон збереження механічної енергії.", "blocks": [{"h": "Механічна робота і потужність", "p": ["Механічна робота виконується, коли на тіло діє сила і тіло переміщується під дією цієї сили. Якщо сила напрямлена вздовж переміщення, A = Fs. Одиниця роботи — джоуль (Дж): 1 Дж = 1 Н · 1 м.", "Потужність показує, як швидко виконується робота: N = A/t. Одиниця потужності — ват (Вт): 1 Вт = 1 Дж/с. Якщо тіло рухається рівномірно, N = Fv."], "ul": ["Якщо тіло не переміщується (людина тримає сумку на місці), механічна робота дорівнює нулю.", "Якщо сила перпендикулярна до переміщення, робота цієї сили дорівнює нулю.", "Сила тертя виконує від’ємну роботу, бо напрямлена проти руху.", "1 кВт = 1000 Вт, 1 МВт = 1 000 000 Вт.", "Два підйомні крани виконують однакову роботу, але потужніший — за менший час."]}, {"h": "Кінетична і потенціальна енергія", "p": ["Енергія — фізична величина, що характеризує здатність тіла виконати роботу. Одиниця енергії, як і роботи, — джоуль.", "Кінетична енергія — енергія руху: E_k = mv²/2. Потенціальна енергія — енергія взаємодії: для тіла, піднятого над Землею, E_p = mgh; для пружно деформованого тіла E_p = kx²/2."], "ul": ["Кінетична енергія залежить від маси і квадрата швидкості: якщо швидкість зросте вдвічі, E_k зросте вчетверо.", "Потенціальна енергія залежить від вибору нульового рівня (найчастіше — поверхня Землі).", "Стиснута пружина, натягнута тятива лука, вода у водосховищі ГЕС мають потенціальну енергію.", "Повна механічна енергія E = E_k + E_p."]}, {"h": "Закон збереження механічної енергії", "p": ["Якщо в системі тіл діють лише сили тяжіння і пружності (немає тертя й опору), повна механічна енергія системи не змінюється: E_k + E_p = const. Енергія лише перетворюється з одного виду на інший.", "Наприклад, м’яч, що падає, втрачає потенціальну енергію і набуває кінетичної; під час руху вгору — навпаки. За наявності тертя частина механічної енергії перетворюється на внутрішню (тіла нагріваються)."], "ul": ["Гойдалка, маятник, американські гірки — приклади перетворення E_p ↔ E_k.", "Швидкість тіла, що вільно падає з висоти h без початкової швидкості: v = √(2gh).", "Енергія не виникає з нічого і не зникає безслідно — вона лише переходить з одного виду в інший.", "На ГЕС потенціальна енергія води перетворюється на кінетичну, а потім на електричну."]}], "formulas": [{"f": "A = Fs", "d": "A — робота (Дж), F — сила, напрямлена вздовж переміщення (Н), s — переміщення (м)"}, {"f": "N = A/t = Fv", "d": "N — потужність (Вт), t — час (с), v — швидкість рівномірного руху"}, {"f": "E_k = mv²/2", "d": "кінетична енергія тіла масою m, що рухається зі швидкістю v"}, {"f": "E_p = mgh", "d": "потенціальна енергія тіла, піднятого на висоту h"}, {"f": "E_k + E_p = const", "d": "закон збереження механічної енергії (без тертя та опору)"}], "terms": [["Механічна робота", "фізична величина, що дорівнює добутку сили на переміщення тіла в напрямку дії сили."], ["Потужність", "фізична величина, що характеризує швидкість виконання роботи і дорівнює відношенню роботи до часу її виконання."], ["Енергія", "фізична величина, що характеризує здатність тіла (системи тіл) виконати роботу."], ["Кінетична енергія", "енергія, якою володіє тіло внаслідок свого руху."], ["Потенціальна енергія", "енергія, зумовлена взаємодією тіл або частин тіла."], ["Повна механічна енергія", "сума кінетичної та потенціальної енергій тіла (системи тіл)."]], "examples": [{"q": "Підйомник рівномірно піднімає вантаж масою 200 кг на висоту 10 м за 20 с. Яку роботу він виконує і яка його потужність? (g = 10 Н/кг)", "s": ["Дано: m = 200 кг, h = 10 м, t = 20 с. Знайти: A, N.", "Розв’язання: F = mg = 200 · 10 = 2000 Н; A = Fh = 2000 · 10 = 20 000 Дж; N = A/t = 20 000 / 20 = 1000 Вт.", "Відповідь: 20 кДж; 1 кВт."]}, {"q": "М’яч вільно падає з висоти 5 м без початкової швидкості. З якою швидкістю він торкнеться землі? Опором повітря знехтувати. (g = 10 м/с²)", "s": ["Дано: h = 5 м, v₀ = 0. Знайти: v.", "Розв’язання: за законом збереження енергії mgh = mv²/2, звідки v = √(2gh) = √(2 · 10 · 5) = √100 = 10 м/с.", "Відповідь: 10 м/с."]}], "lab": null, "f": "Одиницю потужності «кінська сила» запровадив Джеймс Ватт, щоб порівнювати парові машини з кіньми; 1 кінська сила ≈ 736 Вт.", "pr": ["Оцініть свою потужність під час підйому сходами: виміряйте висоту поверху та час підйому, обчисліть роботу A = mgh і потужність N = A/t.", "Розв’яжіть задачу: автомобіль масою 1000 кг рухається зі швидкістю 20 м/с. Знайдіть його кінетичну енергію. (200 кДж)"], "qz": [{"q": "У якому випадку виконується механічна робота?", "o": ["Людина тримає важку сумку на місці", "Кран піднімає вантаж", "Книжка лежить на столі", "Учень сидить за партою"], "a": 1, "why": "Робота виконується, коли тіло переміщується під дією сили."}, {"q": "Одиниця потужності —", "o": ["джоуль", "ньютон", "паскаль", "ват"], "a": 3, "why": "[N] = Дж/с = Вт."}, {"q": "Яку роботу виконує сила 50 Н, переміщуючи тіло на 4 м у напрямку дії сили?", "o": ["200 Дж", "12,5 Дж", "54 Дж", "46 Дж"], "a": 0, "why": "A = 50 · 4 = 200 Дж."}, {"q": "Двигун виконав роботу 6000 Дж за 30 с. Його потужність —", "o": ["180 кВт", "200 Вт", "2000 Вт", "20 Вт"], "a": 1, "why": "N = 6000/30 = 200 Вт."}, {"q": "Як зміниться кінетична енергія тіла, якщо його швидкість збільшиться у 2 рази?", "o": ["Збільшиться у 2 рази", "Не зміниться", "Збільшиться в 4 рази", "Зменшиться у 2 рази"], "a": 2, "why": "E_k ~ v², тому 2² = 4."}, {"q": "Потенціальна енергія тіла масою 2 кг на висоті 3 м (g = 10 Н/кг) —", "o": ["6 Дж", "0,6 Дж", "600 Дж", "60 Дж"], "a": 3, "why": "E_p = 2 · 10 · 3 = 60 Дж."}, {"q": "Яке перетворення енергії відбувається, коли тіло падає?", "o": ["Потенціальна → кінетична", "Кінетична → потенціальна", "Внутрішня → потенціальна", "Енергія не змінюється"], "a": 0, "why": "Висота зменшується, а швидкість зростає."}, {"q": "За якої умови виконується закон збереження механічної енергії?", "o": ["Завжди", "Лише для нерухомих тіл", "Лише за наявності тертя", "Коли немає тертя і опору"], "a": 3, "why": "Те
