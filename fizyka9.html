осіб перевірки: якщо, дивлячись на торець котушки, бачимо струм проти годинникової стрілки, цей торець — північний полюс.", "Якщо струм за годинниковою стрілкою — перед нами південний полюс.", "Порівняйте з прямим провідником: там великий палець — струм, а для котушки великий палець — поле."]}], "formulas": [], "terms": [["Котушка (соленоїд)", "ізольований провідник, намотаний спіраллю на циліндричну поверхню."], ["Осердя", "стрижень із феромагнітного матеріалу (заліза, спеціальної сталі), який вставляють у котушку для посилення її магнітного поля."], ["Полюси котушки", "торці котушки зі струмом, з одного з яких магнітні лінії виходять (N), а в інший входять (S)."], ["Правило правої руки (для котушки)", "якщо зігнуті пальці правої руки показують напрям струму у витках, то великий палець вказує напрям магнітних ліній усередині котушки."], ["Виток", "один оберт провідника навколо каркаса котушки."]], "examples": [{"q": "Якісна задача. Котушку зі струмом підвісили на тонких гнучких проводах. Коли до її правого торця піднесли північний полюс магніту, котушка відштовхнулася. Як тече струм у витках, якщо дивитися з боку правого торця?", "s": ["Розв’язання: однойменні полюси відштовхуються, тож правий торець котушки — північний полюс N.", "Великий палець правої руки має показувати на правий торець (на спостерігача). Тоді зігнуті пальці, якщо дивитися з цього торця, обертаються проти годинникової стрілки.", "Відповідь: струм тече проти годинникової стрілки."]}], "lab": null, "f": "У медичних апаратах МРТ надпровідні котушки створюють магнітне поле з індукцією зазвичай 1,5–3 Тл — це в десятки тисяч разів більше, ніж індукція магнітного поля Землі.", "pr": ["Намалюйте котушку зі струмом, позначте напрям струму у витках, визначте за правилом правої руки її полюси і покажіть кілька магнітних ліній усередині та зовні.", "Запропонуйте три способи збільшити підіймальну силу котушки зі струмом і один спосіб поміняти її полюси місцями. Поясніть кожен."], "qz": [{"q": "Магнітне поле котушки зі струмом схоже на поле…", "o": ["прямого провідника", "смугового магніту", "нерухомого заряду", "Місяця"], "a": 1, "why": "Картини ліній котушки і смугового магніту майже однакові."}, {"q": "Що показує великий палець правої руки в правилі для котушки?", "o": ["Напрям струму у витках", "Південний полюс", "Напрям магнітних ліній усередині котушки", "Напрям сили тяжіння"], "a": 2, "why": "Зігнуті пальці — струм, великий палець — поле всередині, тобто на N."}, {"q": "Як НЕ можна посилити магнітне поле котушки?", "o": ["Збільшити силу струму", "Збільшити кількість витків", "Вставити залізне осердя", "Замінити залізне осердя на дерев’яне"], "a": 3, "why": "Дерево не посилює поле, на відміну від заліза."}, {"q": "Дивлячись на торець котушки, бачимо струм за годинниковою стрілкою. Цей торець є…", "o": ["південним полюсом", "північним полюсом", "нейтральною зоною", "полюс визначити неможливо"], "a": 0, "why": "Для струму за годинниковою стрілкою великий палець напрямлений від нас, тож перед нами S."}, {"q": "Що станеться з полюсами котушки, якщо змінити напрям струму?", "o": ["Нічого", "Котушка розмагнітиться назавжди", "Поле стане однорідним зовні", "Полюси поміняються місцями"], "a": 3, "why": "Напрям поля визначається напрямком струму."}, {"q": "Яке поле всередині довгої котушки зі струмом?", "o": ["Відсутнє", "Майже однорідне", "Найслабше біля осі", "Електричне, а не магнітне"], "a": 1, "why": "Лінії всередині довгої котушки паралельні й розташовані рівномірно."}, {"q": "Навіщо в котушку вставляють залізне осердя?", "o": ["Щоб значно посилити магнітне поле", "Щоб зменшити силу струму", "Щоб охолодити котушку", "Щоб поле зникло"], "a": 0, "why": "Залізо намагнічується і багаторазово посилює поле котушки."}, {"q": "Коли струм у котушці вимикають, її магнітне поле…", "o": ["зростає", "зберігається назавжди", "зникає", "перетворюється на електричне"], "a": 2, "why": "Поле котушки створюється струмом, тож без струму його немає."}]}, {"n": "23", "type": "problems", "t": "Розв’язування задач", "gr": "ГР3", "g": "Навчитися розв’язувати розрахункові та якісні задачі на магнітну індукцію, магнітне поле прямого провідника і котушки зі струмом.", "blocks": [{"h": "Алгоритм розв’язування задач", "p": ["Задачі цього уроку бувають двох видів: розрахункові (на магнітну індукцію, силу струму, опір котушки) і якісні (на напрям магнітних ліній, полюси котушки, взаємодію магнітів). Для кожного виду є свій порядок дій."], "ul": ["Уважно прочитайте умову, запишіть «Дано» і що треба знайти.", "Переведіть усі величини в СІ (см → м, мА → А, мТл → Тл).", "Запишіть потрібну формулу, за потреби виразіть із неї невідому величину.", "Підставте числа з одиницями, обчисліть і перевірте одиницю відповіді.", "У якісних задачах спершу зробіть рисунок, позначте напрям струму (⊗ або ⊙) і лише потім застосовуйте правило свердлика чи правої руки.", "Оцініть, чи реальна відповідь (наприклад, B у шкільних дослідах — соті чи десяті частки тесла)."]}, {"h": "Нагадування: формули та правила теми", "p": ["Модуль магнітної індукції визначають за максимальною силою дії поля на провідник зі струмом. Для котушок часто знадобляться закон Ома й формула опору провідника з 8 класу."], "ul": ["B = F_max/(Il) — модуль магнітної індукції.", "I = U/R — закон Ома для ділянки кола.", "R = ρl/S — опір провідника.", "Прямий провідник: великий палець правої руки — струм, зігнуті пальці — магнітні лінії.", "Котушка: зігнуті пальці правої руки — струм у витках, великий палець — північний полюс.", "Поза магнітом лінії йдуть від N до S, однойменні полюси відштовхуються."]}], "formulas": [{"f": "B = F_max/(Il)", "d": "B — магнітна індукція (Тл), F_max — максимальна сила дії поля на провідник (Н), I — сила струму (А), l — довжина провідника в полі (м)"}, {"f": "I = U/R", "d": "I — сила струму (А), U — напруга (В), R — опір (Ом)"}, {"f": "R = ρl/S", "d": "ρ — питомий опір (Ом·мм²/м), l — довжина дроту (м), S — площа поперечного перерізу (мм²)"}], "terms": [], "examples": [{"q": "На провідник завдовжки 15 см, по якому тече струм 4 А, в однорідному магнітному полі діє максимальна сила 0,12 Н. Визначте магнітну індукцію поля.", "s": ["Дано: l = 15 см, I = 4 А, F_max = 0,12 Н. Знайти: B.", "СІ: l = 0,15 м.", "Розв’язання: B = F_max/(Il) = 0,12 Н / (4 А · 0,15 м) = 0,12 / 0,6 = 0,2 Тл.", "Відповідь: B = 0,2 Тл."]}, {"q": "Провідник завдовжки 50 см розташований перпендикулярно до ліній однорідного магнітного поля з індукцією 0,4 Тл. Поле діє на нього із силою 1 Н. Яка сила струму в провіднику?", "s": ["Дано: l = 50 см, B = 0,4 Тл, F_max = 1 Н. Знайти: I.", "СІ: l = 0,5 м.", "Розв’язання: з формули B = F_max/(Il) отримуємо I = F_max/(Bl) = 1 Н / (0,4 Тл · 0,5 м) = 1 / 0,2 = 5 А.", "Відповідь: I = 5 А."]}, {"q": "Котушку електромагніта намотано мідним дротом завдовжки 50 м з площею поперечного перерізу 0,5 мм². Котушку підключили до джерела напругою 3,4 В. Яка сила струму в котушці? Питомий опір міді 0,017 Ом·мм²/м.", "s": ["Дано: l = 50 м, S = 0,5 мм², U = 3,4 В, ρ = 0,017 Ом·мм²/м. Знайти: I.", "Розв’язання: опір котушки R = ρl/S = 0,017 · 50 / 0,5 = 1,7 Ом.", "Сила струму I = U/R = 3,4 В / 1,7 Ом = 2 А.", "Відповідь: I = 2 А."]}, {"q": "Якісна задача. Горизонтальний провідник лежить на столі, струм у ньому тече з півночі на південь. Над провідником (вище за нього) розмістили магнітну стрілку. Куди повернеться її північний полюс — на схід чи на захід?", "s": ["Розв’язання: станемо з північного боку і подивимося вздовж провідника на південь. Струм тече від нас (⊗), отже за правилом свердлика магнітні лінії напрямлені за годинниковою стрілкою.", "Коли ми дивимося на південь, схід — ліворуч, захід — праворуч. У верхній точці кола (над провідником) рух за годинниковою стрілкою напрямлений зліва направо, тобто на захід.", "Відповідь: північний полюс стрілки повернеться на захід."]}, {"q": "Якісна задача. Котушку зі струмом розташували горизонтально, а до її лівого торця піднесли південний полюс магнітної стрілки — стрілка притягнулася. Як зміниться взаємодія, якщо змінити напрям струму, і чому?", "s": ["Розв’язання: південний полюс стрілки притягується до північного полюса, отже лівий торець котушки — N.", "Зі зміною напрямку струму, за правилом правої руки, полюси котушки міняються місцями: лівий торець стане S.", "Однойменні полюси відштовхуються, тож південний полюс стрілки відштовхнеться від лівого торця.", "Відповідь: стрілка буде відштовхуватися, бо лівий торець стане південним полюсом."]}], "lab": null, "f": "", "pr": ["На провідник завдовжки 40 см зі струмом 2,5 А в однорідному магнітному полі діє максимальна сила 0,2 Н. Визначте індукцію поля. (0,2 Тл)", "Яка максимальна сила діє на провідник завдовжки 10 см зі струмом 3 А в магнітному полі з індукцією 0,5 Тл? Скористайтеся формулою B = F_max/(Il). (0,15 Н)", "Котушка має опір 6 Ом. Яку напругу треба подати на неї, щоб сила струму становила 1,5 А? (9 В)", "Якісна задача: дивлячись на правий торець котушки, ви бачите, що струм у витках тече за годинниковою стрілкою. Який полюс у правого торця і який у лівого? (правий — S, лівий — N)"], "qz": [{"q": "На провідник завдовжки 0,2 м зі струмом 5 А діє максимальна сила 0,5 Н. Яка магнітна індукція?", "o": ["0,05 Тл", "0,5 Тл", "2 Тл", "5 Тл"], "a": 1, "why": "B = 0,5/(5·0,2) = 0,5 Тл."}, {"q": "Яка сила струму в провіднику завдовжки 1 м, якщо поле з індукцією 0,2 Тл діє на нього з максимальною силою 0,4 Н?", "o": ["0,08 А", "0,5 А", "8 А", "2 А"], "a": 3, "why": "I = F/(Bl) = 0,4/(0,2·1) = 2 А."}, {"q": "Переведіть 30 мТл у тесли.", "o": ["0,03 Тл", "0,3 Тл", "3 Тл", "30 000 Тл"], "a": 0, "why": "1 мТл = 0,001 Тл, тому 30 мТл = 0,03 Тл."}, {"q": "Котушка опором 4 Ом підключена до напруги 12 В. Яка сила струму?", "o": ["48 А", "0,33 А", "3 А", "16 А"], "a": 2, "why": "I = U/R = 12/4 = 3 А."}, {"q": "Струм у прямому провіднику тече до нас (⊙). Як напрямлені магнітні лінії?", "o": ["Проти годинникової стрілки", "За годинниковою стрілкою", "Вздовж провідника", "Від провідника"], "a": 0, "why": "Для струму до нас свердлик викручується, обертаючись проти годинникової стрілки."}, {"q": "Як зміниться B, визначена за формулою B = F_max/(Il), якщо при тій самій силі F_max струм збільшити вдвічі?", "o": ["Збільшиться вдвічі", "Зменшиться вдвічі", "Не зміниться", "Збільшиться вчетверо"], "a": 1, "why": "B обернено пропорційна I при сталих F і l."}, {"q": "До торця котушки зі струмом піднесли північний полюс магніту, і він відштовхнувся. Що це за торець?", "o": ["Південний полюс", "Нейтральна зона", "Полюса там немає", "Північний полюс"], "a": 3, "why": "Відштовхуються однойменні полюси, отже торець — N."}, {"q": "Що відбудеться з магнітним полем котушки, якщо з неї вийняти залізне осердя?", "o": ["Посилиться", "Послабиться", "Зникне назавжди", "Змінить полюси"], "a": 1, "why": "Залізне осердя посилює поле, без нього поле слабшає."}]}, {"n": "24", "type": "theory", "t": "Дія магнітного поля на провідник зі струмом. Сила Ампера (правило лівої руки)", "gr": "ГР2", "g": "З’ясувати, як магнітне поле діє на провідник зі струмом, від чого залежить сила Ампера, і навчитися визначати її напрям за правилом лівої руки.", "blocks": [{"h": "Дослід: провідник зі струмом у магнітному полі", "p": ["Підвісимо легкий провідник на гнучких проводах між полюсами підковоподібного магніту. Поки струму немає, провідник висить нерухомо. Щойно замикаємо коло — провідник відхиляється: його або втягує всередину магніту, або виштовхує назовні.", "Силу, з якою магнітне поле діє на провідник зі струмом, називають силою Ампера (F_A) на честь французького фізика Андре-Марі Ампера."], "ul": ["Без струму магнітне поле на провідник не діє.", "Зі зміною напрямку струму провідник відхиляється в протилежний бік.", "Якщо перевернути магніт (поміняти полюси), напрям відхилення також змінюється.", "Що більша сила струму, то сильніше відхиляється провідник.", "Якщо провідник розташувати вздовж магнітних ліній, сила Ампера дорівнює нулю."]}, {"h": "Від чого залежить сила Ампера", "p": ["Досліди показують, що значення сили Ампера визначається чотирма чинниками. Кількісний зв’язок (формулу) ми розглянемо на наступному уроці, а зараз зафіксуємо якісні залежності."], "ul": ["Від магнітної індукції B: сильніше поле — більша сила.", "Від сили струму I: більший струм — більша сила.", "Від довжини активної частини провідника l (тієї, що перебуває в полі).", "Від кута між провідником і магнітними лініями: найбільша сила — коли провідник перпендикулярний до ліній.", "Сила Ампера завжди перпендикулярна і до провідника, і до магнітних ліній."]}, {"h": "Правило лівої руки", "p": ["Напрям сили Ампера визначають за правилом лівої руки: якщо ліву руку розташувати так, щоб лінії магнітного поля входили в долоню, а чотири витягнуті пальці вказували напрям струму, то відставлений на 90° великий палець покаже напрям сили Ампера.", "Запам’ятайте: права рука — щоб знайти напрям магнітного поля струму, ліва — щоб знайти напрям сили, з якою поле діє на струм."], "ul": ["Магнітні лінії «входять у долоню» лівої руки.", "Чотири пальці — за напрямком струму.", "Великий палець, відставлений на 90°, — напрям сили Ампера.", "Якщо змінити напрям струму або напрям поля — сила змінить напрям на протилежний.", "Якщо змінити обидва напрями одночасно — напрям сили не зміниться."]}, {"h": "Де застосовують дію поля на струм", "p": ["Сила Ампера — основа роботи багатьох приладів, що перетворюють електричну енергію на механічну."], "ul": ["Електродвигуни: від іграшкових машинок до трамваїв і електромобілів.", "Гучномовці та навушники: котушка зі змінним струмом коливається в полі постійного магніту і рухає мембрану.", "Стрілкові електровимірювальні прилади (амперметри, вольтметри магнітоелектричної системи).", "Взаємодія паралельних провідників зі струмом теж пояснюється силою Ампера."]}], "formulas": [], "terms": [["Сила Ампера", "сила, з якою магнітне поле діє на провідник зі струмом."], ["Правило лівої руки", "якщо магнітні лінії входять у долоню лівої руки, а чотири пальці напрямлені за струмом, то відставлений на 90° великий палець покаже напрям сили Ампера."], ["Активна частина провідника", "частина провідника, що перебуває в магнітному полі."], ["Підковоподібний магніт", "постійний магніт у формі дуги, між полюсами якого поле близьке до однорідного."], ["Гучномовець", "пристрій, у якому котушка зі струмом під дією сили Ампера коливається в полі магніту й створює звук."]], "examples": [{"q": "Якісна задача. Горизонтальний провідник лежить у площині рисунка, струм у ньому тече зліва направо. Магнітне поле напрямлене від нас, за рисунок (⊗). Куди напрямлена сила Ампера?", "s": ["Розв’язання: розташовуємо ліву руку так, щоб лінії, які йдуть від нас за рисунок, входили в долоню — долоня повернута до нас.", "Чотири пальці спрямовуємо праворуч, за струмом.", "Відставлений великий палець показує вгору.", "Відповідь: сила Ампера напрямлена вгору, у площині рисунка."]}], "lab": null, "f": "Майкл Фарадей ще 1821 року продемонстрував пристрій, у якому провідник зі струмом безперервно обертався навколо постійного магніту, — це був прообраз електродвигуна.", "pr": ["Намалюйте три схеми: провідник зі струмом у полі підковоподібного магніту з різними напрямками струму і поля. Для кожної визначте напрям сили Ампера за правилом лівої руки.", "Поясніть, чому провідник, розташований уздовж магнітних ліній, не відхиляється під час замикання кола."], "qz": [{"q": "Як називають силу, з якою магнітне поле діє на провідник зі струмом?", "o": ["Сила Кулона", "Сила пружності", "Сила Ампера", "Сила тяжіння"], "a": 2, "why": "Це сила Ампера."}, {"q": "Яку руку використовують для визначення напрямку сили Ампера?", "o": ["Ліву", "Праву", "Будь-яку", "Жодну, тільки свердлик"], "a": 0, "why": "Напрям сили Ампера визначають за правилом лівої руки."}, {"q": "Що показують чотири пальці в правилі лівої руки?", "o": ["Напрям сили", "Напрям струму", "Напрям магнітних ліній", "Південний полюс"], "a": 1, "why": "Пальці — за струмом, лінії — у долоню, великий палець — сила."}, {"q": "Коли сила Ампера дорівнює нулю?", "o": ["Коли провідник перпендикулярний до ліній", "Коли струм дуже великий", "Коли поле однорідне", "Коли провідник розташований уздовж ліній поля"], "a": 3, "why": "Сила Ампера зникає, якщо провідник паралельний магнітним лініям."}, {"q": "Як зміниться напрям сили Ампера, якщо одночасно змінити напрям струму і напрям поля?", "o": ["Не зміниться", "Зміниться на протилежний", "Повернеться на 90°", "Сила зникне"], "a": 0, "why": "Дві зміни напрямку компенсують одна одну."}, {"q": "Струм тече вгору у площині рисунка, поле напрямлене до нас (⊙). Куди напрямлена сила Ампера?", "o": ["Ліворуч", "Праворуч", "Вниз", "До нас"], "a": 1, "why": "Лінії до нас входять у долоню (долоня від нас), пальці вгору — великий палець лівої руки праворуч."}, {"q": "У якому з приладів використовують дію магнітного поля на провідник зі струмом?", "o": ["Лампа розжарювання", "Електрочайник", "Термометр", "Електродвигун"], "a": 3, "why": "Ротор двигуна обертається під дією сили Ампера."}, {"q": "Як напрямлена сила Ампера щодо провідника й магнітних ліній?", "o": ["Уздовж провідника", "Уздовж ліній", "Перпендикулярно і до провідника, і до ліній", "Під кутом 45°"], "a": 2, "why": "Сила Ампера перпендикулярна до провідника і до вектора B."}]}, {"n": "25", "type": "theory", "t": "Сила Ампера (формула). Модуль магнітної індукції", "gr": "ГР1, ГР3", "g": "Опанувати формулу сили Ампера, з’ясувати фізичний зміст модуля магнітної індукції та навчитися обчислювати ці величини.", "blocks": [{"h": "Формула сили Ампера", "p": ["Досліди показують, що сила Ампера прямо пропорційна магнітній індукції поля, силі струму в провіднику та довжині активної частини провідника, а також залежить від кута α між напрямком струму і напрямком магнітних ліній. Усі ці залежності об’єднує формула F_A = BIl·sin α.", "Множник sin α враховує, як розташований провідник: якщо α = 90° (провідник перпендикулярний до ліній), sin α = 1 і сила максимальна; якщо α = 0° (провідник уздовж ліній), sin α = 0 і сила дорівнює нулю."], "ul": ["F_A = BIl·sin α — формула сили Ампера.", "При α = 90°: F_A = BIl (максимальне значення).", "При α = 30°: sin α = 0,5, тож сила вдвічі менша від максимальної.", "При α = 0° або 180°: F_A = 0.", "Сила Ампера вимірюється в ньютонах (Н)."]}, {"h": "Модуль магнітної індукції", "p": ["З формули сили Ампера для випадку α = 90° випливає означення модуля магнітної індукції: B = F_max/(Il). Модуль магнітної індукції чисельно дорівнює максимальній силі, з якою поле діє на провідник завдовжки 1 м при силі струму 1 А.", "Звідси й одиниця: 1 Тл — це індукція такого однорідного поля, яке діє з максимальною силою 1 Н на провідник завдовжки 1 м, коли в ньому тече струм 1 А. Тобто 1 Тл = 1 Н/(А·м)."], "ul": ["Магнітна індукція характеризує саме поле і не залежить від провідника, яким її вимірюють.", "Якщо збільшити струм удвічі, удвічі зросте сила, а відношення F_max/(Il) залишиться тим самим.", "1 мТл = 10⁻³ Тл, 1 мкТл = 10⁻⁶ Тл.", "Поле Землі — десятки мікротесла, поле магніту на холодильнику — кілька мілітесла.", "Поле біля полюсів сильних неодимових магнітів може сягати десятих часток тесла і більше."]}, {"h": "Як розв’язувати задачі на силу Ампера", "p": ["Більшість задач зводиться до того, щоб записати формулу F_A = BIl·sin α, виразити невідому величину і підставити значення в СІ. Кут α завжди вимірюють між провідником (напрямком струму) і магнітними лініями."], "ul": ["Переведіть довжину в метри, струм — в ампери, індукцію — в тесли.", "Визначте кут між провідником і лініями поля (не плутайте з кутом до площини!).", "Виразіть невідоме: B = F_A/(Il·sin α), I = F_A/(Bl·sin α), l = F_A/(BI·sin α).", "Напрям сили знайдіть за правилом лівої руки.", "Перевірте одиницю відповіді."]}], "formulas": [{"f": "F_A = BIl·sin α", "d": "F_A — сила Ампера (Н), B — магнітна індукція (Тл), I — сила струму (А), l — довжина активної частини провідника (м), α — кут між напрямком струму і магнітними лініями"}, {"f": "B = F_max/(Il)", "d": "модуль магнітної індукції через максимальну силу Ампера (при α = 90°)"}, {"f": "1 Тл = 1 Н/(А·м)", "d": "зв’язок одиниці магнітної індукції з основними одиницями"}], "terms": [["Модуль магнітної індукції", "фізична величина, що дорівнює відношенню максимальної сили, з якою поле діє на провідник зі струмом, до добутку сили струму і довжини провідника."], ["Сила Ампера", "сила дії магнітного поля на провідник зі струмом, що обчислюється за формулою F_A = BIl·sin α."], ["Кут α у формулі сили Ампера", "кут між напрямком струму в провіднику і напрямком ліній магнітної індукції."], ["Тесла", "індукція однорідного поля, яке діє з максимальною силою 1 Н на провідник завдовжки 1 м зі струмом 1 А."], ["Мілітесла", "одна тисячна тесли: 1 мТл = 0,001 Тл."]], "examples": [{"q": "Провідник завдовжки 40 см, по якому тече струм 3 А, розташований перпендикулярно до ліній однорідного магнітного поля з індукцією 0,25 Тл. Визначте силу Ампера.", "s": ["Дано: l = 40 см, I = 3 А, B = 0,25 Тл, α = 90°. Знайти: F_A.", "СІ: l = 0,4 м.", "Розв’язання: F_A = BIl·sin α = 0,25 Тл · 3 А · 0,4 м · 1 = 0,3 Н.", "Відповідь: F_A = 0,3 Н."]}, {"q": "Провідник завдовжки 0,5 м зі струмом 8 А розташований в однорідному магнітному полі під кутом 30° до ліній індукції. Поле діє на провідник із силою 0,4 Н. Визначте модуль магнітної індукції.", "s": ["Дано: l = 0,5 м, I = 8 А, α = 30°, F_A = 0,4 Н. Знайти: B.", "Розв’язання: з F_A = BIl·sin α маємо B = F_A/(Il·sin α).", "B = 0,4 Н / (8 А · 0,5 м · 0,5) = 0,4 / 2 = 0,2 Тл.", "Відповідь: B = 0,2 Тл."]}], "lab": null, "f": "Одиницю «тесла» затвердили в Міжнародній системі одиниць 1960 року на честь Ніколи Тесли — винахідника, з ім’ям якого пов’язане поширення систем змінного струму.", "pr": ["Обчисліть силу Ампера, що діє на провідник завдовжки 25 см зі струмом 2 А в полі з індукцією 0,8 Тл, якщо кут між провідником і лініями поля: а) 90°; б) 30°; в) 0°.", "Поясніть своїми словами, чому магнітна індукція не залежить від сили струму в провіднику, яким її вимірюють, хоча в формулу B = F_max/(Il) сила струму входить."], "qz": [{"q": "Яка формула сили Ампера?", "o": ["F_A = BIl·sin α", "F_A = qE", "F_A = mg", "F_A = kq₁q₂/r²"], "a": 0, "why": "Сила Ампера обчислюється за формулою F_A = BIl·sin α."}, {"q": "За якого кута між провідником і лініями поля сила Ампера максимальна?", "o": ["0°", "30°", "90°", "180°"], "a": 2, "why": "sin 90° = 1 — найбільше значення синуса."}, {"q": "B = 0,5 Тл, I = 2 А, l = 0,3 м, α = 90°. Яка сила Ампера?", "o": ["3 Н", "0,3 Н", "0,03 Н", "1,2 Н"], "a": 1, "why": "F = 0,5·2·0,3 = 0,3 Н."}, {"q": "B = 0,4 Тл, I = 5 А, l = 1 м, α = 30°. Яка сила Ампера?", "o": ["2 Н", "0,2 Н", "4 Н", "1 Н"], "a": 3, "why": "F = 0,4·5·1·0,5 = 1 Н."}, {"q": "Як зміниться сила Ампера, якщо силу струму збільшити втричі?", "o": ["Збільшиться втричі", "Зменшиться втричі", "Збільшиться в 9 разів", "Не зміниться"], "a": 0, "why": "F_A прямо пропорційна I."}, {"q": "Чому дорівнює 1 Тл в інших одиницях СІ?", "o": ["1 Н·А·м", "1 Н/(А·м)", "1 А/(Н·м)", "1 Н·м/А"], "a": 1, "why": "З B = F/(Il) випливає 1 Тл = 1 Н/(А·м)."}, {"q": "Чи зміниться магнітна індукція поля, якщо в провіднику, яким її вимірюють, удвічі збільшити струм?", "o": ["Збільшиться вдвічі", "Зменшиться вдвічі", "Збільшиться вчетверо", "Не зміниться"], "a": 3, "why": "Сила зросте вдвічі, а відношення F/(Il), тобто B, залишиться тим самим."}, {"q": "На провідник завдовжки 0,2 м зі струмом 10 А діє максимальна сила 0,4 Н. Яка індукція поля?", "o": ["0,8 Тл", "2 Тл", "0,2 Тл", "0,02 Тл"], "a": 2, "why": "B = 0,4/(10·0,2) = 0,2 Тл."}]}, {"n": "26", "type": "problems", "t": "Розв’язування задач", "gr": "ГР3", "g": "Закріпити вміння обчислювати силу Ампера й магнітну індукцію та визначати напрям сили Ампера в різних ситуаціях.", "blocks": [{"h": "Алгоритм розв’язування задач на силу Ампера", "p": ["Задачі на силу Ампера бувають прямими (знайти силу), оберненими (знайти B, I, l чи кут) і комбінованими — коли силу Ампера треба порівняти з силою тяжіння, обчислити її роботу або спершу знайти струм за законом Ома."], "ul": ["Запишіть «Дано», переведіть величини в СІ (г → кг, см → м, мТл → Тл).", "Визначте кут α між провідником і лініями поля.", "Запишіть формулу F_A = BIl·sin α і виразіть невідоме.", "Якщо провідник перебуває в рівновазі — прирівняйте сили (наприклад, F_A = mg).", "Якщо провідник переміщується вздовж дії сили — робота A = F_A·s.", "Напрям сили визначте за правилом лівої руки."]}], "formulas": [{"f": "F_A = BIl·sin α", "d": "сила Ампера (Н)"}, {"f": "B = F_max/(Il)", "d": "модуль магнітної індукції (Тл)"}, {"f": "F = mg", "d": "сила тяжіння, g ≈ 10 Н/кг"}, {"f": "A = F·s", "d": "механічна робота сили, напрямленої вздовж переміщення (Дж)"}, {"f": "I = U/R", "d": "закон Ома для ділянки кола"}], "terms": [], "examples": [{"q": "Провідник завдовжки 30 см зі струмом 4 А розташований перпендикулярно до ліній однорідного магнітного поля з індукцією 0,5 Тл. Яка сила Ампера діє на провідник?", "s": ["Дано: l = 30 см, I = 4 А, B = 0,5 Тл, α = 90°. Знайти: F_A.", "СІ: l = 0,3 м.", "Розв’язання: F_A = BIl·sin 90° = 0,5 · 4 · 0,3 · 1 = 0,6 Н.", "Відповідь: F_A = 0,6 Н."]}, {"q": "Провідник завдовжки 50 см зі струмом 10 А розташований під кутом 30° до ліній магнітного поля з індукцією 0,2 Тл. Визначте силу Ампера.", "s": ["Дано: l = 0,5 м, I = 10 А, B = 0,2 Тл, α = 30°. Знайти: F_A.", "Розв’язання: F_A = BIl·sin α = 0,2 · 10 · 0,5 · 0,5 = 0,5 Н.", "Відповідь: F_A = 0,5 Н."]}, {"q": "На провідник завдовжки 20 см зі струмом 6 А, розміщений під кутом 30° до ліній поля, діє сила Ампера 0,3 Н. Визначте індукцію магнітного поля.", "s": ["Дано: l = 20 см, I = 6 А, α = 30°, F_A = 0,3 Н. Знайти: B.", "СІ: l = 0,2 м.", "Розв’язання: B = F_A/(Il·sin α) = 0,3 / (6 · 0,2 · 0,5) = 0,3 / 0,6 = 0,5 Тл.", "Відповідь: B = 0,5 Тл."]}, {"q": "Горизонтальний провідник масою 10 г і завдовжки 20 см підвішено на тонких гнучких проводах у горизонтальному магнітному полі з індукцією 0,25 Тл, перпендикулярному до провідника. Яку силу струму треба пропустити, щоб провідник «зависнув» і проводи не були натягнуті?", "s": ["Дано: m = 10 г, l = 20 см, B = 0,25 Тл, α = 90°, g ≈ 10 Н/кг. Знайти: I.", "СІ: m = 0,01 кг, l = 0,2 м.", "Розв’язання: проводи не натягнуті, якщо сила Ампера напрямлена вгору і врівноважує силу тяжіння: BIl = mg.", "I = mg/(Bl) = 0,01 · 10 / (0,25 · 0,2) = 0,1 / 0,05 = 2 А.", "Відповідь: I = 2 А (напрям струму має бути таким, щоб за правилом лівої руки сила Ампера йшла вгору)."]}, {"q": "Провідник завдовжки 0,5 м зі струмом 5 А перебуває в однорідному полі з індукцією 0,4 Тл перпендикулярно до ліній. Під дією сили Ампера він перемістився на 20 см у напрямку сили. Яку роботу виконала сила Ампера?", "s": ["Дано: l = 0,5 м, I = 5 А, B = 0,4 Тл, α = 90°, s = 20 см. Знайти: A.", "СІ: s = 0,2 м.", "Розв’язання: F_A = BIl = 0,4 · 5 · 0,5 = 1 Н.", "A = F_A · s = 1 Н · 0,2 м = 0,2 Дж.", "Відповідь: A = 0,2 Дж."]}], "lab": null, "f": "", "pr": ["Провідник опором 2 Ом підключено до джерела напругою 6 В. Провідник завдовжки 40 см розташований перпендикулярно до ліній поля з індукцією 0,5 Тл. Знайдіть силу Ампера. (0,6 Н)", "На провідник завдовжки 25 см в полі з індукцією 0,4 Тл під кутом 90° діє сила 0,5 Н. Яка сила струму в провіднику? (5 А)", "Провідник масою 20 г і завдовжки 40 см «висить» у горизонтальному магнітному полі, перпендикулярному до провідника, коли по ньому тече струм 5 А. Визначте індукцію поля (g ≈ 10 Н/кг). (0,1 Тл)", "Сила Ампера 2 Н перемістила провідник на 15 см у напрямку своєї дії. Яку роботу вона виконала? (0,3 Дж)"], "qz": [{"q": "B = 0,2 Тл, I = 5 А, l = 0,4 м, α = 90°. Яка сила Ампера?", "o": ["0,04 Н", "0,4 Н", "4 Н", "2 Н"], "a": 1, "why": "F = 0,2·5·0,4 = 0,4 Н."}, {"q": "B = 1 Тл, I = 2 А, l = 0,5 м, α = 30°. Яка сила Ампера?", "o": ["0,5 Н", "1 Н", "2 Н", "0,25 Н"], "a": 0, "why": "F = 1·2·0,5·0,5 = 0,5 Н."}, {"q": "Яку силу струму треба пропустити через провідник завдовжки 0,1 м у полі 0,5 Тл (α = 90°), щоб сила Ампера дорівнювала 0,2 Н?", "o": ["0,01 А", "1 А", "10 А", "4 А"], "a": 3, "why": "I = F/(Bl) = 0,2/(0,5·0,1) = 4 А."}, {"q": "Провідник масою 5 г і довжиною 0,1 м у полі 0,5 Тл (α = 90°) зависає. Яка сила струму? (g ≈ 10 Н/кг)", "o": ["1 А", "0,1 А", "10 А", "5 А"], "a": 0, "why": "I = mg/(Bl) = 0,05/0,05 = 1 А."}, {"q": "Як зміниться сила Ампера, якщо довжину провідника в полі зменшити вдвічі, а силу струму збільшити вдвічі?", "o": ["Зросте вдвічі", "Зменшиться вдвічі", "Не зміниться", "Зросте вчетверо"], "a": 2, "why": "F ~ I·l, а добуток I·l не змінився."}, {"q": "Сила Ампера 0,5 Н перемістила провідник на 0,4 м у напрямку дії. Яка робота?", "o": ["1,25 Дж", "0,8 Дж", "0,9 Дж", "0,2 Дж"], "a": 3, "why": "A = F·s = 0,5·0,4 = 0,2 Дж."}, {"q": "Провідник розташований уздовж ліній поля 0,8 Тл, струм 3 А, довжина 0,5 м. Яка сила Ампера?", "o": ["1,2 Н", "0", "0,6 Н", "2,4 Н"], "a": 1, "why": "При α = 0° sin α = 0, тож сила дорівнює нулю."}, {"q": "Чому під час розв’язування задач на рівновагу провідника в полі прирівнюють F_A і mg?", "o": ["Бо ці сили завжди однакові", "Бо так записано в законі Ома", "Бо при рівновазі рівнодійна сил дорівнює нулю", "Бо сила Ампера — різновид сили тяжіння"], "a": 2, "why": "У рівновазі сили, що діють на тіло, взаємно компенсуються."}]}, {"n": "27", "type": "theory", "t": "Магнітні властивості речовини. Гіпотеза Ампера", "gr": "ГР2", "g": "З’ясувати, як різні речовини поводяться в магнітному полі, чим відрізняються діамагнетики, парамагнетики та феромагнетики, і як намагнічування пояснює гіпотеза Ампера.", "blocks": [{"h": "Речовина в магнітному полі", "p": ["Будь-яка речовина, вміщена в магнітне поле, намагнічується, тобто сама починає створювати власне магнітне поле. У результаті поле всередині речовини B відрізняється від поля у вакуумі B₀.", "Щоб порівняти магнітні властивості речовин, використовують магнітну проникність μ — величину, яка показує, у скільки разів індукція поля в речовині відрізняється від індукції поля у вакуумі: μ = B/B₀. Магнітна проникність не має одиниці."], "ul": ["Намагнічування — набуття речовиною власного магнітного поля під дією зовнішнього.", "μ = B/B₀ — магнітна проникність речовини.", "Якщо μ < 1, речовина трохи послаблює поле.", "Якщо μ трохи більша за 1, речовина трохи посилює поле.", "Якщо μ ≫ 1 (сотні, тисячі й більше), речовина значно посилює поле."]}, {"h": "Діамагнетики, парамагнетики, феромагнетики", "p": ["За магнітними властивостями речовини поділяють на три групи. Діамагнетики й парамагнетики намагнічуються дуже слабко, тому в побуті їх уважають «немагнітними». Феромагнетики намагнічуються сильно — саме їх притягує магніт."], "ul": ["Діамагнетики (μ трохи менша за 1): мідь, срібло, золото, вода, вісмут, графіт — слабко виштовхуються з магнітного поля.", "Парамагнетики (μ трохи більша за 1): алюміній, платина, кисень — слабко втягуються в поле.", "Феромагнетики (μ ≫ 1): залізо, нікель, кобальт, деякі сплави — сильно намагнічуються і притягуються магнітом.", "Феромагнетики можуть залишатися намагніченими й після зникнення зовнішнього поля — так виготовляють постійні магніти.", "Магнітно-м’які матеріали (м’яке залізо, електротехнічна сталь) легко намагнічуються й розмагнічуються; магнітно-тверді (спеціальні сталі, ферити, неодимові сплави) довго зберігають намагніченість."]}, {"h": "Гіпотеза Ампера", "p": ["Андре-Марі Ампер припустив, що всередині кожної частинки речовини циркулюють маленькі колові струми — молекулярні струми. Кожен такий струм подібний до крихітного витка зі струмом і створює власне магнітне поле.", "Якщо молекулярні струми зорієнтовані хаотично, їхні поля взаємно компенсуються і тіло не намагнічене. Під дією зовнішнього поля струми частково впорядковуються — і тіло намагнічується. Сучасна фізика підтвердила ідею Ампера: магнітні властивості речовини пов’язані з рухом і власними магнітними властивостями електронів в атомах."], "ul": ["Молекулярні струми — колові струми всередині атомів і молекул.", "Хаотична орієнтація струмів — тіло не намагнічене.", "Упорядкована орієнтація — тіло намагнічене.", "Гіпотеза пояснює, чому магніт неможливо розділити на окремі полюси: кожен «виток» має і N, і S.", "Отже, і в магніті, і в провіднику магнітне поле створюють рухомі заряди."]}, {"h": "Домени і температура Кюрі", "p": ["Феромагнетик складається з дуже маленьких ділянок — доменів, кожна з яких намагнічена до насичення. Без зовнішнього поля домени орієнтовані безладно; у зовнішньому полі вони повертаються вздовж поля, і тіло стає сильним магнітом.", "Якщо нагріти феромагнетик до певної температури — точки (температури) Кюрі, — доменна структура руйнується і він втрачає феромагнітні властивості. Для заліза температура Кюрі становить приблизно 770 °C."], "ul": ["Домен — ділянка феромагнетику з однаковою орієнтацією магнітних моментів.", "Намагнічування феромагнетику — це переорієнтація доменів уздовж зовнішнього поля.", "Удари й сильне нагрівання «збивають» орієнтацію доменів і розмагнічують тіло.", "Вище від температури Кюрі феромагнетик стає парамагнетиком.", "Після охолодження нижче від точки Кюрі феромагнітні властивості відновлюються."]}], "formulas": [{"f": "μ = B/B₀", "d": "μ — магнітна проникність речовини, B — індукція магнітного поля в речовині, B₀ — індукція поля у вакуумі"}], "terms": [["Магнітна проникність", "фізична величина, яка показує, у скільки разів індукція магнітного поля в речовині відрізняється від індукції поля у вакуумі."], ["Діамагнетики", "речовини, які намагнічуються слабко і трохи послаблюють зовнішнє поле (μ < 1)."], ["Парамагнетики", "речовини, які намагнічуються слабко і трохи посилюють зовнішнє поле (μ > 1)."], ["Феромагнетики", "речовини, які сильно намагнічуються і значно посилюють зовнішнє поле (μ ≫ 1)."], ["Молекулярні струми", "за гіпотезою Ампера, колові струми всередині атомів і молекул, що створюють магнітні поля частинок речовини."], ["Домен", "мала ділянка феромагнетику, намагнічена до насичення."], ["Температура Кюрі", "температура, вище від якої феромагнетик втрачає феромагнітні властивості."]], "examples": [{"q": "Котушка без осердя створює всередині поле з індукцією 2 мТл. Коли в неї вставили залізне осердя, індукція поля всередині стала 1,2 Тл. Визначте магнітну проникність заліза в цих умовах.", "s": ["Дано: B₀ = 2 мТл, B = 1,2 Тл. Знайти: μ.", "СІ: B₀ = 0,002 Тл.", "Розв’язання: μ = B/B₀ = 1,2 Тл / 0,002 Тл = 600.", "Відповідь: μ = 600, тобто осердя посилило поле в 600 разів."]}], "lab": null, "f": "Діамагнетики виштовхуються з дуже сильного магнітного поля: у відомому досліді в полі з індукцією близько 16 Тл живу жабу (яка складається переважно з води) змусили левітувати — цей дослід 2000 року відзначили жартівливою Шнобелівською премією.", "pr": ["Поясніть письмово (без проведення досліду — нагрівання до таких температур небезпечне), що станеться з намагніченим сталевим цвяхом, якщо його нагріти до 800 °C, а потім охолодити, і чому. Скористайтеся поняттями «домен» і «температура Кюрі».", "Розподіліть речовини на діамагнетики, парамагнетики й феромагнетики: мідь, залізо, алюміній, вода, нікель, кисень, золото, кобальт. Поясніть, як за допомогою звичайного магніту можна відрізнити лише одну з цих груп."], "qz": [{"q": "До якої групи речовин належить залізо?", "o": ["Діамагнетики", "Парамагнетики", "Феромагнетики", "Діелектрики"], "a": 2, "why": "Залізо сильно намагнічується, тож це феромагнетик."}, {"q": "Що показує магнітна проникність μ?", "o": ["У скільки разів поле в речовині відрізняється від поля у вакуумі", "Силу струму в речовині", "Масу речовини в полі", "Швидкість електронів"], "a": 0, "why": "μ = B/B₀ порівнює поле в речовині з полем у вакуумі."}, {"q": "Яка речовина є діамагнетиком?", "o": ["Нікель", "Алюміній", "Кобальт", "Мідь"], "a": 3, "why": "Мідь трохи послаблює поле, μ < 1."}, {"q": "Що, за гіпотезою Ампера, є причиною намагніченості тіл?", "o": ["Електричні заряди на поверхні", "Молекулярні колові струми", "Сила тяжіння", "Тепловий рух атомів"], "a": 1, "why": "Ампер пояснив намагніченість упорядкованими молекулярними струмами."}, {"q": "Що відбувається з феромагнетиком вище від температури Кюрі?", "o": ["Він плавиться", "Він стає надпровідником", "Він втрачає феромагнітні властивості", "Він сильніше намагнічується"], "a": 2, "why": "Нагрівання руйнує доменну структуру феромагнетику."}, {"q": "Індукція поля у вакуумі 0,01 Тл, у речовині 0,5 Тл. Яка магнітна проникність?", "o": ["0,02", "5", "500", "50"], "a": 3, "why": "μ = 0,5/0,01 = 50."}, {"q": "Що таке домен?", "o": ["Мала ділянка феромагнетику, намагнічена до насичення", "Окремий атом заліза", "Полюс магніту", "Виток котушки"], "a": 0, "why": "Домени — ділянки однорідної намагніченості феромагнетику."}, {"q": "З якого матеріалу краще виготовити осердя електромагніта, який треба часто вмикати й вимикати?", "o": ["З магнітно-твердої сталі", "З магнітно-м’якого заліза", "З міді", "З пластику"], "a": 1, "why": "М’яке залізо легко намагнічується і розмагнічується після вимкнення струму."}]}, {"n": "28", "type": "theory", "t": "Електромагніти та їх застосування", "gr": "ГР2, ГР3", "g": "Дізнатися, як улаштований електромагніт, які він має переваги над постійним магнітом і де застосовується.", "blocks": [{"h": "Будова електромагніта", "p": ["Електромагніт — це котушка з великою кількістю витків ізольованого дроту, усередині якої розміщене осердя з магнітно-м’якого феромагнетику. Коли по котушці тече струм, осердя намагнічується і поле котушки посилюється в сотні й тисячі разів.", "Осердя часто роблять підковоподібним: тоді обидва полюси працюють разом, а якір (залізна пластина, яку притягує електромагніт) замикає магнітне коло, і підіймальна сила зростає."], "ul": ["Котушка з ізольованого мідного дроту.", "Осердя з магнітно-м’якого заліза або електротехнічної сталі.", "Джерело струму та вимикач (ключ).", "Якір — рухома залізна деталь, яку притягує електромагніт.", "Часто — реостат для регулювання сили струму."]}, {"h": "Переваги електромагнітів", "p": ["На відміну від постійного магніту, електромагнітом можна легко керувати. Саме тому електромагніти стали основою багатьох автоматичних пристроїв."], "ul": ["Магнітну дію можна вмикати й вимикати, замикаючи й розмикаючи коло.", "Силу притягання можна плавно регулювати, змінюючи силу струму.", "Полюси можна поміняти місцями, змінивши напрям струму.", "Можна створити набагато сильніше поле, ніж у звичайних постійних магнітів.", "Розмір і форму можна підібрати для конкретного завдання."]}, {"h": "Де застосовують електромагніти", "p": ["Електромагніти працюють навколо нас: від дверного дзвінка до величезних кранів на металобрухті та наукових прискорювачів частинок."], "ul": ["Підіймальні електромагніти на складах металу та сміттєпереробних заводах.", "Електромагнітні реле — вмикають потужні кола за допомогою слабкого струму.", "Електричні дзвінки та електромагнітні замки домофонів.", "Магнітні сепаратори — відокремлюють залізну руду чи металеві домішки від сипких матеріалів.", "Медичні томографи (МРТ) та прискорювачі частинок.", "Поїзди на магнітній подушці (маглеви)."]}, {"h": "Електромагнітне реле", "p": ["Реле — це електромагнітний вимикач. Коло керування містить слабке джерело струму та котушку електромагніта; робоче коло — потужне джерело і споживач (двигун, потужна лампа). Коли в колі керування з’являється струм, електромагніт притягує якір, і контакти робочого кола замикаються.", "Так можна безпечно керувати потужним обладнанням на відстані або автоматично — від датчика освітленості, температури, тиску."], "ul": ["Коло керування: слабке джерело, ключ, обмотка електромагніта.", "Робоче коло: потужне джерело, контакти реле, споживач.", "Якір на пружині: без струму пружина відводить його і контакти розмикаються.", "Реле використовують у системах автоматики, автомобілях, ліфтах, охоронних системах."]}], "formulas": [{"f": "I = U/R", "d": "сила струму в обмотці електромагніта: U — напруга на обмотці (В), R — опір обмотки (Ом)"}], "terms": [["Електромагніт", "котушка зі струмом із феромагнітним осердям усередині."], ["Якір", "рухома залізна деталь, яку притягує електромагніт."], ["Електромагнітне реле", "пристрій, у якому електромагніт, увімкнений у слабке коло керування, замикає або розмикає контакти потужного робочого кола."], ["Магнітний сепаратор", "пристрій, що за допомогою електромагніта відокремлює феромагнітні частинки від немагнітних."], ["Маглев", "поїзд, який утримується над колією і рухається завдяки магнітним силам, без дотику коліс до рейок."]], "examples": [{"q": "Обмотка електромагнітного реле має опір 60 Ом. Реле спрацьовує, коли сила струму в обмотці досягає 0,1 А. Чи спрацює реле, якщо коло керування живиться від батарейки напругою 4,5 В?", "s": ["Дано: R = 60 Ом, I_спр = 0,1 А, U = 4,5 В. Знайти: I, порівняти з I_спр.", "Розв’язання: сила струму в обмотці I = U/R = 4,5 В / 60 Ом = 0,075 А.", "0,075 А < 0,1 А — струму недостатньо, щоб електромагніт притягнув якір.", "Відповідь: не спрацює; потрібне джерело напругою щонайменше 6 В (I = 6/60 = 0,1 А)."]}], "lab": null, "f": "Японський поїзд на магнітній подушці SCMaglev 2015 року під час випробувань розігнався до 603 км/год — це світовий рекорд швидкості для залізничного транспорту.", "pr": ["Намалюйте схему електричного дзвінка з електромагнітом і поясніть покроково, чому молоточок постійно б’є по чашці, поки натиснуто кнопку.", "Знайдіть удома або в найближчому оточенні 3 пристрої, що містять електромагніт чи реле (наприклад, домофон, пральна машина, автомобіль). Для кожного опишіть, яку функцію виконує електромагніт."], "qz": [{"q": "З чого складається електромагніт?", "o": ["З котушки зі струмом і феромагнітного осердя", "З двох постійних магнітів", "З мідного стрижня", "З конденсатора й резистора"], "a": 0, "why": "Електромагніт — котушка з осердям, по якій тече струм."}, {"q": "Яка перевага електромагніта над постійним магнітом?", "o": ["Він не потребує струму", "Він легший за будь-який магніт", "Його дію можна вмикати, вимикати й регулювати", "Він притягує мідь"], "a": 2, "why": "Магнітною дією електромагніта керують за допомогою струму."}, {"q": "Як поміняти полюси електромагніта?", "o": ["Збільшити кількість витків", "Вийняти осердя", "Збільшити напругу", "Змінити напрям струму"], "a": 3, "why": "Полюси котушки визначаються напрямком струму у витках."}, {"q": "Для чого використовують електромагнітне реле?", "o": ["Для вимірювання напруги", "Для керування потужним колом за допомогою слабкого струму", "Для нагрівання води", "Для зберігання заряду"], "a": 1, "why": "Слабкий струм у котушці реле замикає контакти потужного кола."}, {"q": "Чому осердя електромагніта роблять із магнітно-м’якого заліза?", "o": ["Щоб після вимкнення струму воно швидко розмагнічувалося", "Щоб воно не проводило струм", "Щоб воно було легшим", "Щоб воно не нагрівалося"], "a": 0, "why": "Магнітно-м’який матеріал не зберігає намагніченість, тож вантаж відпадає при вимкненні."}, {"q": "Обмотка опором 20 Ом підключена до 12 В. Яка сила струму?", "o": ["240 А", "1,67 А", "0,6 А", "32 А"], "a": 2, "why": "I = 12/20 = 0,6 А."}, {"q": "Що відбувається з вантажем на підіймальному електромагніті, якщо вимкнути струм?", "o": ["Він притягується сильніше", "Нічого не змінюється", "Він нагрівається", "Він відпадає"], "a": 3, "why": "Без струму поле зникає, і вантаж відпадає."}, {"q": "Де НЕ використовують електромагніт?", "o": ["У магнітному сепараторі", "У скляній склянці", "В електричному дзвінку", "В апараті МРТ"], "a": 1, "why": "У склянці немає ні котушки, ні струму."}]}, {"n": "29", "type": "lab", "t": "Лабораторна робота № 4 «Виготовлення електромагніта та вивчення його магнітного поля»", "gr": "ГР1", "g": "Виготовити простий електромагніт і дослідити, як його магнітна дія залежить від сили струму, кількості витків і наявності осердя.", "blocks": [{"h": "Теорія до роботи", "p": ["Електромагніт — це котушка зі струмом із залізним осердям. Його магнітну дію можна оцінити за кількістю однакових сталевих скріпок, які він утримує. Чим сильніше поле електромагніта, тим більше скріпок він підіймає.", "Поле котушки посилюється, якщо збільшити силу струму, кількість витків або вставити залізне осердя. Полюси електромагніта визначають за правилом правої руки або за допомогою компаса: до північного полюса електромагніта притягується південний полюс стрілки."], "ul": ["Чим більша сила струму, тим сильніший електромагніт.", "Чим більше витків, тим сильніший електромагніт (при тому самому струмі).", "Залізне осердя значно посилює поле котушки.", "Зміна напрямку струму міняє полюси місцями.", "Обмотка нагрівається під час роботи, тому коло замикають лише на час вимірювання."]}, {"h": "Дистанційний формат і безпека", "p": ["Цю роботу можна безпечно виконати вдома, бо використовується лише низьковольтне джерело — батарейка 1,5–4,5 В. Мережу 220 В використовувати категорично заборонено! Якщо немає дроту чи батарейки, роботу виконують у віртуальній лабораторії."], "ul": ["Удома: великий сталевий цвях, 2–3 м тонкого лакованого або ізольованого мідного дроту, батарейка, скріпки, компас.", "Не замикайте батарейку дротом надовго: дріт і батарейка нагріваються.", "Кінці лакованого дроту зачищають від лаку дрібним наждачним папером (обережно, з дорослими).", "Вимірювання сили струму амперметром і регулювання реостатом — у шкільному кабінеті з учителем або у віртуальній лабораторії."]}], "formulas": [{"f": "I = U/R", "d": "сила струму в обмотці (А): U — напруга (В), R — опір кола (Ом)"}, {"f": "μ = B/B₀", "d": "магнітна проникність: у скільки разів осердя посилює поле котушки"}], "terms": [["Електромагніт", "котушка зі струмом із феромагнітним осердям."], ["Осердя", "стрижень із магнітно-м’якого заліза всередині котушки, який посилює її поле."], ["Підіймальна сила електромагніта", "найбільша вага вантажу, яку може утримувати електромагніт."], ["Реостат", "прилад для плавної зміни опору кола і, отже, сили струму."]], "examples": [], "lab": {"goal": "Виготовити електромагніт і дослідити залежність його магнітної дії (кількості утримуваних скріпок) від сили струму, кількості витків і наявності залізного осердя; визначити полюси електромагніта.", "equip": ["джерело струму низької напруги (батарейка 4,5 В або лабораторне джерело)", "ізольований мідний дріт (2–3 м)", "залізний стрижень або великий сталевий цвях (осердя)", "ключ", "реостат", "амперметр", "з’єднувальні проводи", "однакові сталеві скріпки (20–30 шт.)", "компас або магнітна стрілка"], "safety": ["Працювати лише з джерелами низької напруги (до 4,5–6 В); мережу 220 В не використовувати.", "Збирати і змінювати коло тільки при розімкненому ключі.", "Не залишати коло замкненим надовго: обмотка і джерело нагріваються.", "Під час зачищення дроту від ізоляції бути обережним з гострими предметами.", "Після роботи розібрати коло і прибрати робоче місце."], "steps": ["Намотайте на цвях (осердя) 30 витків ізольованого дроту щільно, в один бік, залишивши вільні кінці по 20–30 см.", "Зберіть коло: джерело струму, ключ, реостат, амперметр і котушку послідовно.", "Встановіть повзунок реостата на максимальний опір. Замкніть ключ і запишіть силу струму.", "Піднесіть електромагніт до купки скріпок і порахуйте, скільки скріпок він утримує. Розімкніть ключ.", "Зменшіть опір реостата, щоб збільшити силу струму, і повторіть дослід. Зробіть 2–3 вимірювання з різним струмом.", "Домотайте ще 30 витків (разом 60) і повторіть дослід за тієї самої сили струму, що й у п. 3.", "Обережно вийміть осердя з котушки (якщо котушка намотана на каркас) і повторіть дослід без осердя.", "Піднесіть до торців електромагніта компас і визначте його полюси. Змініть напрям струму (поміняйте місцями проводи на клемах джерела) і знову визначте полюси.", "Перевірте полюси за правилом правої руки для котушки."], "calc": ["Порівняйте кількість скріпок за різних значень сили струму: зробіть висновок, як магнітна дія залежить від I.", "Порівняйте результати для 30 і 60 витків за однакового струму.", "Порівняйте результати з осердям і без нього; оцініть, у скільки разів осердя посилює дію електромагніта (відношення кількості скріпок — лише приблизна оцінка).", "Для домашнього варіанта без амперметра оцініть силу струму за законом Ома I = U/R, якщо відомий опір кола."], "table": ["№ досліду", "Кількість витків N", "Осердя (є / немає)", "Сила струму I, А", "Кількість скріпок, шт.", "Полюс біля вістря цвяха"], "sample": "Очікується, що зі збільшенням сили струму і кількості витків кількість утримуваних скріпок зростає, без осердя котушка утримує лише кілька скріпок або жодної, а зі зміною напрямку струму полюси електромагніта міняються місцями.", "questions": ["Як магнітна дія електромагніта залежить від сили струму в його обмотці?", "Як і чому впливає на поле котушки залізне осердя?", "Як визначити полюси електромагніта без компаса?", "Чому скріпки відпадають після розмикання кола? Як зміниться результат, якщо осердя зроблене з загартованої сталі?", "Наведіть три приклади застосування електромагнітів."]}, "f": "", "pr": ["Оформіть звіт про лабораторну роботу: тема, мета, обладнання, схема кола, заповнена таблиця, висновки та відповіді на контрольні запитання.", "Якщо немає обладнання — виконайте роботу у віртуальній лабораторії PhET «Магніти та електромагніти» (або «Електромагнітна лабораторія Фарадея», вкладка «Електромагніт»): змінюйте напругу батареї та кількість витків і за показами вбудованого вимірювача поля опишіть, як змінюється індукція поля електромагніта."], "qz": [{"q": "Як змінюється кількість скріпок, які утримує електромагніт, зі збільшенням сили струму?", "o": ["Зменшується", "Збільшується", "Не змінюється", "Спочатку зростає, потім спадає до нуля"], "a": 1, "why": "Більший струм створює сильніше магнітне поле."}, {"q": "Що станеться, якщо вийняти залізне осердя з котушки?", "o": ["Магнітна дія різко послабиться", "Магнітна дія посилиться", "Полюси поміняються", "Струм зникне"], "a": 0, "why": "Без осердя поле котушки в сотні разів слабше."}, {"q": "Чому під час досліду коло не можна залишати замкненим надовго?", "o": ["Скріпки розмагнітяться", "Компас зламається", "Осердя стане діамагнетиком", "Обмотка і джерело нагріваються"], "a": 3, "why": "Струм нагріває провідники і розряджає батарейку."}, {"q": "Як змінити полюси електромагніта?", "o": ["Додати скріпок", "Зменшити кількість витків", "Змінити напрям струму", "Вимкнути амперметр"], "a": 2, "why": "Напрям струму визначає полюси котушки."}, {"q": "Яку величину в цій роботі тримають сталою, порівнюючи котушки з 30 і 60 витками?", "o": ["Кількість скріпок", "Силу струму", "Масу цвяха", "Колір дроту"], "a": 1, "why": "Щоб з’ясувати вплив кількості витків, інші умови (струм, осердя) мають бути однаковими."}, {"q": "Яке джерело струму можна використовувати для домашнього виконання роботи?", "o": ["Розетку 220 В", "Автомобільний акумулятор без запобіжника", "Батарейку 1,5–4,5 В", "Подовжувач"], "a": 2, "why": "Для домашніх дослідів безпечні лише низьковольтні джерела."}]}, {"n": "30", "type": "theory", "t": "Дія магнітного поля на рамку зі струмом, її застосування", "gr": "ГР1, ГР3", "g": "З’ясувати, чому рамка зі струмом обертається в магнітному полі, і як це використовують в електродвигунах та електровимірювальних приладах.", "blocks": [{"h": "Рамка зі струмом у магнітному полі", "p": ["Візьмемо прямокутну рамку з провідника і розмістимо її між полюсами магніту так, щоб вона могла обертатися навколо осі. Коли по рамці тече струм, на дві її сторони, перпендикулярні до ліній поля, діють сили Ампера. Оскільки струм у цих сторонах тече в протилежних напрямках, сили також протилежні — і вони повертають рамку.", "Рамка повертається доти, доки її площина не стане перпендикулярною до магнітних ліній. У цьому положенні сили Ампера розтягують рамку, але не обертають її — це положення рівноваги."], "ul": ["На протилежні сторони рамки діють протилежно напрямлені сили Ампера.", "Ці сили створюють обертальну дію (обертальний момент).", "Обертальна дія найбільша, коли площина рамки паралельна лініям поля.", "У положенні, коли площина рамки перпендикулярна до ліній, обертальна дія дорівнює нулю.", "Обертальна дія зростає зі збільшенням сили струму, індукції поля, площі рамки та кількості витків."]}, {"h": "Електродвигун постійного струму", "p": ["Щоб рамка оберталася безперервно, а не зупинялася в положенні рівноваги, напрям струму в ній треба змінювати щопівоберта. Це робить колектор — два півкільця, з’єднані з кінцями рамки, до яких притискаються ковзні контакти — щітки.", "Реальний електродвигун має не одну рамку, а обмотку з багатьох витків на залізному осерді (якір, або ротор), а магнітне поле створює статор — постійні магніти або електромагніти. Електродвигун перетворює електричну енергію на механічну."], "ul": ["Статор — нерухома частина, що створює магнітне поле.", "Ротор (якір) — рухома частина з обмоткою.", "Колектор — пристрій, що щопівоберта змінює напрям струму в обмотці.", "Щітки — ковзні контакти, через які струм надходить до колектора.", "Переваги: високий ККД, немає вихлопних газів, малий шум, легко регулювати швидкість.", "Застосування: електротранспорт, побутова техніка, інструменти, вентилятори, дрони."]}, {"h": "Електровимірювальні прилади", "p": ["Дію магнітного поля на рамку зі струмом використовують також у стрілкових амперметрах і вольтметрах магнітоелектричної системи. Легка рамка з багатьма витками розміщена в полі постійного магніту; її повороту перешкоджає спіральна пружина, а до рамки прикріплена стрілка.", "Що більша сила струму в рамці, то на більший кут вона повертається, доки сила пружності пружини не зрівноважить обертальну дію поля. Кут повороту пропорційний силі струму, тому шкала такого приладу рівномірна."], "ul": ["Постійний магніт створює поле.", "Рамка з тонкого дроту повертається під дією сил Ампера.", "Спіральна пружина протидіє повороту і підводить струм.", "Стрілка показує значення на шкалі.", "Кут відхилення стрілки пропорційний силі струму."]}, {"h": "Енергія і ККД електродвигуна", "p": ["Частина електричної енергії в двигуні неминуче перетворюється на внутрішню (обмотка нагрівається, є тертя в підшипниках). Тому корисна механічна потужність двигуна менша за спожиту електричну. Ефективність характеризують коефіцієнтом корисної дії."], "ul": ["Спожита потужність P = UI.", "ККД η = P_кор/P_спож · 100 %.", "ККД сучасних потужних електродвигунів може перевищувати 90 %.", "Невеликі іграшкові двигуни мають значно нижчий ККД."]}], "formulas": [{"f": "P = UI", "d": "P — електрична потужність, яку споживає двигун (Вт), U — напруга (В), I — сила струму (А)"}, {"f": "η = P_кор/P_спож · 100 %", "d": "η — ККД двигуна, P_кор — корисна механічна потужність, P_спож — спожита електрична потужність"}, {"f": "F_A = BIl·sin α", "d": "сила Ампера, що діє на кожну сторону рамки"}], "terms": [["Електродвигун", "пристрій, який перетворює електричну енергію на механічну завдяки дії магнітного поля на провідники зі струмом."], ["Статор", "нерухома частина електродвигуна, що створює магнітне поле."], ["Ротор (якір)", "обертова частина електродвигуна з обмоткою."], ["Колектор", "пристрій із півкілець, який щопівоберта змінює напрям струму в обмотці ротора."], ["Щітки", "ковзні контакти, через які струм підводиться до колектора."], ["Прилад магнітоелектричної системи", "стрілковий прилад, у якому рамка зі струмом повертається в полі постійного магніту."]], "examples": [{"q": "Електродвигун ручного міксера працює від напруги 220 В при силі струму 1,5 А. Його корисна механічна потужність 264 Вт. Визначте ККД двигуна.", "s": ["Дано: U = 220 В, I = 1,5 А, P_кор = 264 Вт. Знайти: η.", "Розв’язання: спожита потужність P_спож = UI = 220 В · 1,5 А = 330 Вт.", "η = P_кор/P_спож · 100 % = 264/330 · 100 % = 80 %.", "Відповідь: η = 80 %."]}], "lab": null, "f": "Перший прилад, у якому провідник зі струмом безперервно обертався під дією магнітного поля, продемонстрував Майкл Фарадей ще 1821 року, задовго до появи практичних електродвигунів.", "pr": ["Намалюйте рамку зі струмом між полюсами магніту (вигляд згори) і за правилом лівої руки визначте напрям сил Ампера, що діють на її сторони. Покажіть, у який бік повернеться рамка.", "Двигун електросамоката споживає струм 10 А від акумулятора напругою 36 В, корисна потужність 288 Вт. Обчисліть ККД двигуна і поясніть, куди «зникає» решта енергії."], "qz": [{"q": "Чому рамка зі струмом обертається в магнітному полі?", "o": ["На протилежні сторони діють протилежно напрямлені сили Ампера", "Рамку притягує північний полюс", "Рамка нагрівається", "Струм створює силу тяжіння"], "a": 0, "why": "Протилежні сили Ампера на двох сторонах створюють обертальну дію."}, {"q": "У якому положенні рамка зі струмом перебуває в рівновазі?", "o": ["Площина рамки паралельна лініям поля", "Площина рамки перпендикулярна до ліній поля", "Під кутом 45° до ліній", "Рамка ніколи не зупиняється"], "a": 1, "why": "Коли площина перпендикулярна до ліній, сили Ампера лише розтягують рамку."}, {"q": "Яку функцію виконує колектор у двигуні постійного струму?", "o": ["Створює магнітне поле", "Охолоджує обмотку", "Щопівоберта змінює напрям струму в обмотці", "Вимірює швидкість"], "a": 2, "why": "Колектор забезпечує безперервне обертання, змінюючи напрям струму."}, {"q": "Яке перетворення енергії відбувається в електродвигуні?", "o": ["Механічна → електрична", "Внутрішня → електрична", "Світлова → механічна", "Електрична → механічна"], "a": 3, "why": "Двигун перетворює електричну енергію на механічну."}, {"q": "Двигун споживає 200 Вт, корисна потужність 150 Вт. Який ККД?", "o": ["75 %", "133 %", "50 %", "25 %"], "a": 0, "why": "η = 150/200·100 % = 75 %."}, {"q": "Яку потужність споживає двигун при U = 12 В і I = 3 А?", "o": ["4 Вт", "15 Вт", "36 Вт", "9 Вт"], "a": 2, "why": "P = UI = 12·3 = 36 Вт."}, {"q": "Що протидіє повороту рамки в стрілковому амперметрі?", "o": ["Колектор", "Спіральна пружина", "Щітки", "Сила тяжіння стрілки"], "a": 1, "why": "Пружина зрівноважує обертальну дію сил Ампера."}, {"q": "Як називається нерухома частина двигуна, що створює магнітне поле?", "o": ["Ротор", "Колектор", "Якір", "Статор"], "a": 3, "why": "Статор — нерухома частина двигуна."}]}, {"n": "31", "type": "theory", "t": "Досліди Фарадея. Явище електромагнітної індукції", "gr": "ГР2, ГР3", "g": "Ознайомитися з дослідами Фарадея, зрозуміти суть явища електромагнітної індукції та умови виникнення індукційного струму.", "blocks": [{"h": "Чи може магнітне поле створити струм?", "p": ["Після досліду Ерстеда вчені знали, що струм створює магнітне поле. Майкл Фарадей поставив обернене запитання: чи може магнітне поле створити електричний струм? Понад десять років досліджень привели його 1831 року до відкриття явища електромагнітної індукції.", "Виявилося, що нерухомий магніт біля котушки струму не створює. Струм виникає лише тоді, коли магнітне поле, що пронизує котушку, змінюється."], "ul": ["Струм створює магнітне поле — дослід Ерстеда (1820).", "Змінне магнітне поле створює струм — досліди Фарадея (1831).", "Електромагнітна індукція пов’язала електрику і магнетизм у єдине вчення.", "На цьому явищі ґрунтується робота генераторів, трансформаторів, індукційних плит, бездротових зарядних пристроїв."]}, {"h": "Досліди Фарадея", "p": ["Фарадей використовував котушку, з’єднану з гальванометром, — чутливим приладом для виявлення слабких струмів. В інших дослідах він намотував дві котушки на спільне залізне кільце: одну підключав до батареї, іншу — до гальванометра."], "ul": ["Магніт вводять у котушку — стрілка гальванометра відхиляється; виймають — відхиляється в протилежний бік.", "Магніт нерухомий у котушці — струму немає.", "Що швидше рухається магніт, то більший індукційний струм.", "Рухати можна й котушку відносно магніту — результат той самий.", "Замикання і розмикання кола першої котушки спричиняють короткочасний струм у другій.", "Зміна сили струму в першій котушці реостатом також створює струм у другій."]}, {"h": "Явище електромагнітної індукції", "p": ["Електромагнітна індукція — це явище виникнення електричного струму в замкненому провідному контурі під час зміни магнітного поля, яке пронизує цей контур. Такий струм називають індукційним.", "Кількісно «кількість магнітного поля», що пронизує контур, описує магнітний потік Ф. Для однорідного поля Ф = BS·cos α, де α — кут між вектором B і перпендикуляром (нормаллю) до площини контуру. Одиниця магнітного потоку — вебер (Вб). Індукційний струм виникає тоді й лише тоді, коли магнітний потік крізь контур змінюється."], "ul": ["Магнітний потік можна змінити, змінюючи B (рух магніту, зміна струму в іншій котушці).", "Магнітний потік можна змінити, змінюючи площу контуру S, що перебуває в полі.", "Магнітний потік можна змінити, повертаючи контур (змінюючи кут α), — так працює генератор.", "Сила індукційного струму тим більша, чим швидше змінюється магнітний потік і чим більше витків у котушці.", "Правило Ленца: індукційний струм має такий напрям, що його магнітне поле протидіє зміні магнітного потоку, яка цей струм спричинила."]}, {"h": "Електромагнітна індукція в повсякденні", "p": ["Без електромагнітної індукції не було б сучасної енергетики: майже вся електроенергія у світі виробляється генераторами, у яких обертаються котушки в магнітному полі або магніти біля котушок."], "ul": ["Генератори електростанцій.", "Трансформатори, що підвищують або знижують напругу.", "Індукційні плити: змінне магнітне поле створює струми в дні посуду.", "Бездротові зарядні пристрої для смартфонів.", "Металошукачі, безконтактні банківські картки та пропуски."]}], "formulas": [{"f": "Ф = BS·cos α", "d": "Ф — магнітний потік (Вб), B — магнітна індукція (Тл), S — площа контуру (м²), α — кут між вектором B і нормаллю до площини контуру"}, {"f": "1 Вб = 1 Тл·м²", "d": "одиниця магнітного потоку — вебер"}], "terms": [["Електромагнітна індукція", "явище виникнення електричного струму в замкненому провідному контурі під час зміни магнітного потоку, що пронизує цей контур."], ["Індукційний струм", "електричний струм, що виникає внаслідок електромагнітної індукції."], ["Гальванометр", "чутливий прилад для виявлення і вимірювання слабких струмів."], ["Магнітний потік", "фізична величина, що характеризує магнітне поле, яке пронизує поверхню, обмежену контуром."], ["Вебер", "одиниця магнітного потоку в СІ: 1 Вб = 1 Тл·м²."], ["Правило Ленца", "індукційний струм має такий напрям, що його магнітне поле протидіє зміні магнітного потоку, яка спричинила цей струм."]], "examples": [{"q": "Плоский виток площею 50 см² розміщено в однорідному магнітному полі з індукцією 0,2 Тл так, що лінії поля перпендикулярні до площини витка. Визначте магнітний потік. Чи виникне в витку індукційний струм, якщо його нерухомо тримати в цьому полі?", "s": ["Дано: S = 50 см², B = 0,2 Тл, α = 0° (лінії перпендикулярні до площини, тобто паралельні нормалі). Знайти: Ф.", "СІ: S = 0,005 м².", "Розв’язання: Ф = BS·cos 0° = 0,2 Тл · 0,005 м² · 1 = 0,001 Вб = 1 мВб.", "Якщо виток нерухомий і поле не змінюється, магнітний потік сталий — індукційного струму немає.", "Відповідь: Ф = 1 мВб; струм не виникне."]}], "lab": null, "f": "Майкл Фарадей не мав систематичної математичної освіти — він починав палітурником-підмайстром, — але його уявлення про силові лінії поля стали основою електромагнітної теорії, яку згодом математично сформулював Джеймс Клерк Максвелл.", "pr": ["Опишіть письмово три різні способи отримати індукційний струм у котушці, з’єднаній із гальванометром, маючи лише смуговий магніт. Для кожного поясніть, що саме змінюється.", "Плоский контур площею 0,02 м² розташований у полі 0,5 Тл перпендикулярно до ліній. Обчисліть магнітний потік. Яким стане потік, якщо контур повернути так, щоб лінії поля ковзали вздовж його площини? Поясніть, чи виникав струм під час повороту."], "qz": [{"q": "Хто і коли відкрив явище електромагнітної індукції?", "o": ["Ерстед, 1820 р.", "Фарадей, 1831 р.", "Ампер, 1820 р.", "Тесла, 1888 р."], "a": 1, "why": "Явище електромагнітної індукції відкрив Майкл Фарадей 1831 року."}, {"q": "Коли в котушці, з’єднаній з гальванометром, виникає індукційний струм?", "o": ["Коли магніт нерухомо лежить у котушці", "Коли магніт лежить на столі поруч", "Лише коли котушка нагріта", "Коли магніт рухається відносно котушки"], "a": 3, "why": "Струм виникає лише під час зміни магнітного потоку крізь котушку."}, {"q": "Що станеться зі стрілкою гальванометра, якщо магніт не вводити, а виймати з котушки?", "o": ["Відхилиться в протилежний бік", "Відхилиться в той самий бік", "Не відхилиться", "Покаже вдвічі більший струм"], "a": 0, "why": "Зміна потоку протилежна, тому і струм має протилежний напрям."}, {"q": "Як збільшити силу індукційного струму?", "o": ["Тримати магніт нерухомо", "Рухати магніт швидше", "Зменшити кількість витків", "Використати мідний стрижень замість магніту"], "a": 1, "why": "Сила струму тим більша, чим швидше змінюється магнітний потік."}, {"q": "Яка одиниця магнітного потоку?", "o": ["Тесла", "Генрі", "Вебер", "Ампер"], "a": 2, "why": "Магнітний потік вимірюють у веберах (Вб)."}, {"q": "B = 0,4 Тл, S = 0,05 м², лінії перпендикулярні до площини контуру. Який магнітний потік?", "o": ["8 Вб", "0,8 Вб", "0,2 Вб", "0,02 Вб"], "a": 3, "why": "Ф = BS = 0,4·0,05 = 0,02 Вб."}, {"q": "Що стверджує правило Ленца?", "o": ["Індукційний струм протидіє зміні магнітного потоку, яка його спричинила", "Індукційний струм завжди посилює зміну потоку", "Індукційний струм не має напрямку", "Магнітний потік завжди сталий"], "a": 0, "why": "За правилом Ленца поле індукційного струму протидіє причині його виникнення."}, {"q": "У якому пристрої НЕ використовують явище електромагнітної індукції?", "o": ["Генератор електростанції", "Індукційна плита", "Лампа розжарювання, увімкнена в батарейку", "Бездротовий зарядний пристрій"], "a": 2, "why": "Лампа від батарейки працює на тепловій дії постійного струму."}]}, {"n": "32", "type": "theory", "t": "Промислові джерела електричної енергії. Поняття про альтернативні та відновлювальні джерела енергії", "gr": "ГР1, ГР3", "g": "Зрозуміти, як працює індукційний генератор, як виробляють електроенергію на різних типах електростанцій і які джерела енергії вважають альтернативними та відновлювальними.", "blocks": [{"h": "Індукційний генератор", "p": ["Майже всю електроенергію у світі виробляють індукційні генератори. Їхня робота ґрунтується на явищі електромагнітної індукції: коли магніт (або електромагніт) обертається всередині нерухомих обмоток, магнітний потік крізь обмотки безперервно змінюється, і в них виникає індукційний струм.", "Оскільки потік то зростає, то спадає, напрям струму періодично змінюється — генератор виробляє змінний струм. В енергосистемі України, як і всієї Європи, частота змінного струму становить 50 Гц."], "ul": ["Ротор — обертова частина (електромагніт, що створює поле).", "Статор — нерухома частина з обмотками, у яких індукується струм.", "Генератор перетворює механічну енергію обертання на електричну.", "Ротор обертає турбіна, яку рухає пара, вода або вітер.", "Частота змінного струму в мережі — 50 Гц."]}, {"h": "Теплові та атомні електростанції", "p": ["На теплових електростанціях (ТЕС) спалюють вугілля, природний газ або мазут. Отримана теплота нагріває воду і перетворює її на пару під високим тиском, пара обертає турбіну, з’єднану з генератором. Теплоелектроцентралі (ТЕЦ) додатково постачають гарячу воду для опалення міст.", "Атомні електростанції (АЕС) працюють за тим самим принципом, але теплоту для отримання пари дає реакція поділу ядер Урану в ядерному реакторі. В Україні чотири АЕС: Запорізька (найбільша в Європі, з 2022 року окупована), Рівненська, Хмельницька та Південноукраїнська."], "ul": ["Ланцюжок перетворень на ТЕС: хімічна енергія палива → внутрішня енергія пари → механічна енергія турбіни → електрична енергія.", "На АЕС: енергія ядер → внутрішня енергія пари → механічна → електрична.", "ТЕС забруднюють атмосферу продуктами згоряння і викидають вуглекислий газ.", "АЕС не викидають продуктів згоряння, але потребують суворої безпеки і зберігання радіоактивних відходів.", "Велика частина теплоти на ТЕС і АЕС неминуче передається довкіллю (градирні, водойми-охолоджувачі)."]}, {"h": "Гідроелектростанції", "p": ["На гідроелектростанціях (ГЕС) вода з водосховища падає з висоти, обертає гідротурбіну, а та — генератор. Механічна енергія води перетворюється на електричну без спалювання палива.", "Гідроакумулювальні електростанції (ГАЕС) мають два басейни на різних висотах. Коли електроенергії в мережі надлишок (уночі), вони перекачують воду вгору, а в години найбільшого споживання — спускають її і виробляють електроенергію. В Україні працює Дністровська ГАЕС — одна з найпотужніших у Європі."], "ul": ["Енергія води — відновлювальна: кругообіг води підтримує Сонце.", "ГЕС швидко вмикаються і вимикаються, тому допомагають балансувати енергосистему.", "ГЕС не забруднюють повітря, але водосховища затоплюють землі й змінюють екосистеми річок.", "В Україні основні ГЕС розташовані на Дніпрі та Дністрі."]}, {"h": "Альтернативні та відновлювальні джерела енергії", "p": ["Відновлювальні джерела енергії — це джерела, запаси яких поповнюються природними процесами: сонячне випромінювання, вітер, течія річок, припливи, тепло надр Землі, біомаса. Альтернативними називають джерела, що можуть замінити традиційне викопне паливо (вугілля, нафту, газ).", "Їхні переваги — невичерпність і невеликий вплив на клімат, а недоліки — залежність від погоди й пори доби та потреба в накопичувачах енергії. Тому розвиток сонячної і вітрової енергетики йде разом із розвитком акумуляторних систем."], "ul": ["Сонячні електростанції: фотоелектричні панелі перетворюють енергію світла безпосередньо на електричну (без генератора).", "Вітрові електростанції: вітер обертає лопаті вітроустановки, з’єднані з генератором.", "Геотермальні станції використовують тепло надр Землі.", "Біоенергетика: спалювання або переробка відходів сільського господарства, деревини, біогазу.", "Приливні станції використовують енергію морських припливів.", "Енергозбереження — найдешевше «джерело» енергії: світлодіодні лампи, утеплення будинків, вимикання непотрібних приладів."]}], "formulas": [{"f": "P = UI", "d": "електрична потужність (Вт): U — напруга (В), I — сила струму (А)"}, {"f": "E = Pt", "d": "вироблена або спожита електроенергія: P — потужність (Вт або кВт), t — час (с або год); 1 кВт·год = 3,6·10⁶ Дж"}, {"f": "η = E_кор/E_повн · 100 %", "d": "ККД електростанції або установки"}], "terms": [["Індукційний генератор", "пристрій, який перетворює механічну енергію на електричну завдяки явищу електромагнітної індукції."], ["Змінний струм", "струм, напрям і сила якого періодично змінюються."], ["Теплова електростанція (ТЕС)", "електростанція, на якій електроенергію отримують завдяки спалюванню викопного палива."], ["Атомна електростанція (АЕС)", "електростанція, на якій теплоту для отримання пари дає ядерний реактор."], ["Гідроакумулювальна електростанція (ГАЕС)", "станція, що накопичує енергію, перекачуючи воду у верхній басейн, і виробляє електроенергію, спускаючи її вниз."], ["Відновлювальні джерела енергії", "джерела, запаси яких безперервно поповнюються природними процесами (Сонце, вітер, вода, тепло Землі, біомаса)."], ["Фотоелектрична панель", "пристрій, що перетворює енергію світла безпосередньо на електричну."]], "examples": [{"q": "Сонячні панелі на даху будинку мають сумарну потужність 3 кВт. Скільки електроенергії вони вироблять за 5 годин роботи на повну потужність? Скільки днів працюватиме від цієї енергії холодильник, який споживає 1,5 кВт·год на добу?", "s": ["Дано: P = 3 кВт, t = 5 год, E_доб = 1,5 кВт·год. Знайти: E, кількість днів n.", "Розв’язання: E = Pt = 3 кВт · 5 год = 15 кВт·год.", "n = E/E_доб = 15 / 1,5 = 10 діб.", "Відповідь: 15 кВт·год; цієї енергії холодильнику вистачить на 10 діб."]}, {"q": "Генератор вітроустановки дає струм 20 А за напруги 400 В. Яка його електрична потужність? Яку механічну потужність отримує генератор від вітроколеса, якщо ККД генератора 80 %?", "s": ["Дано: I = 20 А, U = 400 В, η = 80 %. Знайти: P_ел, P_мех.", "Розв’язання: P_ел = UI = 400 В · 20 А = 8000 Вт = 8 кВт.", "η = P_ел/P_мех · 100 %, тож P_мех = P_ел/0,8 = 8 кВт / 0,8 = 10 кВт.", "Відповідь: 8 кВт; 10 кВт."]}], "lab": null, "f": "Рівненська АЕС розташована поблизу міста Вараш на Рівненщині — це одна з чотирьох атомних електростанцій України.", "pr": ["Складіть таблицю «Тип електростанції — джерело енергії — ланцюжок перетворень енергії — переваги — недоліки» для ТЕС, АЕС, ГЕС, сонячної та вітрової електростанцій.", "Обчисліть, скільки електроенергії за місяць (30 днів) споживає ваш роутер потужністю 10 Вт, що працює цілодобово. Запропонуйте 3 способи заощадження електроенергії вдома. (Довідка: результат має бути 7,2 кВт·год.)"], "qz": [{"q": "На якому явищі ґрунтується робота індукційного генератора?", "o": ["Теплова дія струму", "Електромагнітна індукція", "Електроліз", "Фотоефект"], "a": 1, "why": "У генераторі змінний магнітний потік індукує струм в обмотках."}, {"q": "Яка частота змінного струму в енергосистемі України?", "o": ["60 Гц", "100 Гц", "220 Гц", "50 Гц"], "a": 3, "why": "Стандартна частота мережі в Україні та Європі — 50 Гц."}, {"q": "Яке джерело енергії НЕ є відновлювальним?", "o": ["Вітер", "Сонячне випромінювання", "Природний газ", "Течія річок"], "a": 2, "why": "Запаси природного газу не поповнюються в історично доступні строки."}, {"q": "Що є джерелом теплоти на АЕС?", "o": ["Поділ ядер Урану", "Спалювання вугілля", "Енергія вітру", "Тепло Сонця"], "a": 0, "why": "У ядерному реакторі виділяється енергія поділу ядер."}, {"q": "Яка українська АЕС є найбільшою в Європі?", "o": ["Рівненська", "Хмельницька", "Південноукраїнська", "Запорізька"], "a": 3, "why": "Запорізька АЕС — найбільша в Європі, з 2022 року окупована."}, {"q": "Для чого потрібні гідроакумулювальні електростанції?", "o": ["Для очищення води", "Для накопичення енергії в години надлишку та її віддачі в години пікового споживання", "Для зрошення полів", "Для охолодження АЕС"], "a": 1, "why": "ГАЕС перекачують воду вгору, коли енергії надлишок, і виробляють енергію, коли її бракує."}, {"q": "Який пристрій перетворює енергію світла безпосередньо на електричну, без генератора?", "o": ["Фотоелектрична панель", "Гідротурбіна", "Парова турбіна", "Вітроколесо"], "a": 0, "why": "Фотоелектричні панелі не мають обертових частин і генератора."}, {"q": "Прилад потужністю 2 кВт працював 3 год. Скільки енергії він спожив?", "o": ["1,5 кВт·год", "5 кВт·год", "6 кВт·год", "0,67 кВт·год"], "a": 2, "why": "E = Pt = 2·3 = 6 кВт·год."}]}, {"n": "33", "type": "lab", "t": "Лабораторна робота № 5 «Дослідження явища електромагнітної індукції»", "gr": "ГР1", "g": "Експериментально дослідити умови виникнення індукційного струму та з’ясувати, від чого залежать його напрям і сила.", "blocks": [{"h": "Теорія до роботи", "p": ["Індукційний струм виникає в замкненій котушці лише тоді, коли змінюється магнітний потік, що пронизує її витки. Змінити потік можна, рухаючи магніт відносно котушки, рухаючи котушку відносно магніту або змінюючи силу струму в іншій котушці, розміщеній поруч.", "Напрям індукційного струму залежить від того, який полюс магніту наближається і чи потік зростає, чи спадає. Сила індукційного струму тим більша, чим швидше змінюється магнітний потік і чим більше витків має котушка."], "ul": ["Нерухомий магніт у котушці — струму немає.", "Вводимо магніт — стрілка міліамперметра відхиляється в один бік, виймаємо — в інший.", "Змінюємо полюс магніту — напрям струму змінюється.", "Швидший рух магніту — більший струм.", "Сильніший магніт або більше витків — більший струм."]}, {"h": "Дистанційний формат і безпека", "p": ["Робота безпечна, бо в колі немає джерела струму: струм у котушці створює лише рух магніту. Удома її можна виконати, якщо є котушка з дроту, сильний магніт і чутливий прилад (мультиметр у режимі вимірювання малих струмів або напруги в мілівольтах). Якщо приладів немає — використайте віртуальну лабораторію."], "ul": ["Неодимові магніти дуже сильні: тримайте їх подалі від смартфонів, банківських карток, кардіостимуляторів; не допускайте, щоб два магніти зіткнулися з пальцями між ними.", "Не підключайте котушку до розетки чи інших джерел.", "Чутливий міліамперметр або гальванометр — із шкільного кабінету, разом з учителем.", "Варіант із двома котушками й джерелом струму виконують лише з учителем у класі."]}], "formulas": [{"f": "Ф = BS·cos α", "d": "магнітний потік крізь контур: B — магнітна індукція (Тл), S — площа контуру (м²), α — кут між B і нормаллю до площини контуру"}], "terms": [["Електромагнітна індукція", "явище виникнення струму в замкненому контурі під час зміни магнітного потоку, що пронизує цей контур."], ["Індукційний струм", "струм, що виникає внаслідок електромагнітної індукції."], ["Міліамперметр", "прилад для вимірювання малих сил струму (тисячних часток ампера)."], ["Магнітний потік", "величина, що характеризує магнітне поле, яке пронизує поверхню контуру."]], "examples": [], "lab": {"goal": "Дослідити умови виникнення індукційного струму в котушці та з’ясувати, як напрям і сила цього струму залежать від напрямку руху магніту, його полюса та швидкості руху.", "equip": ["котушка-моток (або котушка з великою кількістю витків)", "міліамперметр або гальванометр з нулем посередині шкали", "смуговий (або дугоподібний) постійний магніт", "з’єднувальні проводи", "(з учителем) друга котушка, джерело струму, ключ, реостат"], "safety": ["Не підключати котушку до розетки або інших сторонніх джерел.", "Обережно поводитися з сильними магнітами: не затискати пальці, тримати подалі від електроніки.", "Не кидати й не вдаряти магніт — він може тріснути і частково розмагнітитися.", "Збирати коло з джерелом струму (варіант із двома котушками) лише з дозволу вчителя і при розімкненому ключі."], "steps": ["Під’єднайте котушку до міліамперметра.", "Швидко введіть північний полюс магніту в котушку. Спостерігайте, у який бік відхиляється стрілка. Запишіть.", "Залиште магніт нерухомо всередині котушки. Чи є струм?", "Швидко вийміть магніт із котушки. Зафіксуйте напрям відхилення стрілки.", "Повторіть пп. 2–4 для південного полюса магніту.", "Тримайте магніт нерухомо, а котушку насуньте на нього. Порівняйте результат із п. 2.", "Повторіть введення магніту повільно і швидко. Порівняйте максимальне відхилення стрілки.", "(З учителем) Розмістіть дві котушки поруч, одну підключіть через ключ і реостат до джерела, другу — до міліамперметра. Спостерігайте за стрілкою під час замикання і розмикання ключа та під час переміщення повзунка реостата."], "calc": ["Для кожного досліду зафіксуйте: чи виникає струм, у який бік відхиляється стрілка, яке приблизне максимальне відхилення (у поділках).", "Порівняйте результати і сформулюйте умову виникнення індукційного струму через зміну магнітного потоку Ф = BS·cos α.", "Сформулюйте, від чого залежить напрям і від чого — сила індукційного струму.", "Перевірте висновки щодо напрямку струму за правилом Ленца."], "table": ["№ досліду", "Дія з магнітом (котушкою)", "Полюс магніту", "Швидкість руху (повільно / швидко)", "Напрям відхилення стрілки", "Максимальне відхилення, поділок"], "sample": "Очікується, що струм виникає лише під час відносного руху магніту і котушки (або під час зміни струму в сусідній котушці), напрям відхилення стрілки змінюється при зміні напрямку руху чи полюса магніту, а за швидшого руху стрілка відхиляється сильніше.", "questions": ["За якої умови в котушці виникає індукційний струм?", "Чому струму немає, коли магніт нерухомо лежить усередині котушки?", "Від чого залежить напрям індукційного струму?", "Як можна збільшити силу індукційного струму?", "Чому стрілка відхиляється в момент замикання та розмикання кола сусідньої котушки, але не відхиляється, коли струм у ній сталий?"]}, "f": "", "pr": ["Оформіть звіт про лабораторну роботу: тема, мета, обладнання, схема, таблиця спостережень, висновки та відповіді на контрольні запитання.", "Якщо немає обладнання — виконайте роботу у віртуальній лабораторії PhET «Закон Фарадея» (або «Електромагнітна лабораторія Фарадея», вкладка «Котушка»): рухайте магніт з різною швидкістю, змінюйте полюс і кількість витків, спостерігайте за вольтметром і лампочкою та заповніть таблицю спостережень."], "qz": [{"q": "Що відбувається зі стрілкою міліамперметра, коли магніт нерухомо лежить у котушці?", "o": ["Відхиляється максимально", "Коливається", "Перебуває на нулі", "Відх
