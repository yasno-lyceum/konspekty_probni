лу лінзи.", "s": ["Дано: d = 20 см, F = 15 см.", "СІ: F = 0,15 м.", "Розв’язання: 1/f = 1/15 − 1/20 = 4/60 − 3/60 = 1/60, f = 60 см.", "Γ = f/d = 60 : 20 = 3; D = 1 : 0,15 м ≈ 6,7 дптр.", "Відповідь: f = 60 см, Γ = 3, D ≈ 6,7 дптр; зображення дійсне, перевернуте, збільшене."]}], "lab": null, "f": "", "pr": ["Розв’яжіть тренувальний тест нижче, для кожної помилки знайдіть у конспектах відповідну тему і перепишіть потрібну формулу чи правило.", "Побудуйте в зошиті зображення предмета в збиральній лінзі для d = 3F, d = 1,5F і d = 0,5F та в розсіювальній лінзі для d = 2|F|; охарактеризуйте кожне."], "qz": [{"q": "Що є причиною сонячного затемнення?", "o": ["Земля опиняється між Сонцем і Місяцем", "Місяць опиняється між Сонцем і Землею", "Сонце ховається за хмари", "Дисперсія світла"], "a": 1, "why": "Тінь Місяця падає на Землю, коли він між Сонцем і Землею."}, {"q": "Кут падіння 40°. Чому дорівнює кут між падаючим і відбитим променями?", "o": ["40°", "50°", "80°", "100°"], "a": 2, "why": "α + β = 2 · 40° = 80°."}, {"q": "Людина віддаляється від дзеркала зі швидкістю 1 м/с. З якою швидкістю віддаляється від неї зображення?", "o": ["2 м/с", "1 м/с", "0,5 м/с", "0 м/с"], "a": 0, "why": "Зображення віддаляється від дзеркала теж на 1 м/с, тож від людини — на 2 м/с."}, {"q": "Промінь з повітря падає на скло під кутом 30°, sin γ = 0,3. Який показник заломлення?", "o": ["0,6", "1,5", "1,33", "≈ 1,67"], "a": 3, "why": "n = sin α / sin γ = 0,5 : 0,3 ≈ 1,67."}, {"q": "У якому випадку можливе повне внутрішнє відбивання?", "o": ["Повітря → вода", "Повітря → скло", "Вода → повітря", "Вода → скло"], "a": 2, "why": "Потрібен перехід з оптично густішого в менш густе середовище."}, {"q": "Яке світло має найбільшу частоту?", "o": ["Фіолетове", "Червоне", "Зелене", "Жовте"], "a": 0, "why": "У видимому спектрі найбільша частота і найменша довжина хвилі — у фіолетового світла."}, {"q": "Фокусна відстань лінзи 4 см. Яка її оптична сила?", "o": ["4 дптр", "0,25 дптр", "40 дптр", "25 дптр"], "a": 3, "why": "D = 1 : 0,04 м = 25 дптр."}, {"q": "Встановіть правильну пару: «проєктор — …»", "o": ["d < F, уявне зображення", "F < d < 2F, дійсне збільшене", "d > 2F, дійсне зменшене", "d = F, зображення немає"], "a": 1, "why": "Проєктор дає на екрані дійсне збільшене зображення, тому кадр між F і 2F."}, {"q": "d = 60 см, f = 30 см. Яка оптична сила лінзи?", "o": ["5 дптр", "2 дптр", "0,05 дптр", "20 дптр"], "a": 0, "why": "D = 1/0,6 + 1/0,3 ≈ 1,67 + 3,33 = 5 дптр."}, {"q": "Чому в короткозорого ока погано видно далекі предмети?", "o": ["Зображення утворюється за сітківкою", "Кришталика немає", "Зображення утворюється перед сітківкою", "Зіниця завелика"], "a": 2, "why": "Короткозоре око надто сильно заломлює світло, тому фокус перед сітківкою."}]}, {"n": "72", "type": "project", "t": "Захист навчальних проєктів", "gr": "ГР1, ГР2, ГР3", "g": "Підготувати та захистити навчальний проєкт з теми «Світлові явища», навчитися досліджувати, презентувати результати й оцінювати роботи однокласників.", "blocks": [{"h": "Як підготувати проєкт", "p": ["Навчальний проєкт — це самостійне невелике дослідження: ви ставите питання, шукаєте інформацію, проводите дослід або виготовляєте модель і робите висновки. Добрий проєкт поєднує теорію з власним експериментом чи спостереженням.", "Під час дистанційного навчання проєкт захищають онлайн: презентація 7–10 слайдів, відео досліду або демонстрація моделі на камеру. Усі досліди мають бути безпечними — без відкритого вогню без дорослих, без лазерних указок, спрямованих в очі, і без фокусування сонячного світла."], "ul": ["Мета і завдання: що саме ви хочете з’ясувати.", "Теоретична частина: короткий виклад фізики явища.", "Практична частина: дослід, модель, спостереження, вимірювання.", "Результати: таблиці, фото, графіки, розрахунки.", "Висновки: що з’ясували, чи досягнуто мети.", "Список використаних джерел (назви книжок і сайтів)."]}, {"h": "Критерії оцінювання", "p": ["Проєкт оцінюють за змістом, власним внеском і якістю захисту. Тривалість виступу — 5–7 хвилин, ще 2–3 хвилини — відповіді на запитання."], "ul": ["Фізична правильність і повнота змісту.", "Наявність власного досліду, моделі чи вимірювань.", "Логічність і наочність презентації.", "Уміння пояснити результати й відповісти на запитання.", "Дотримання часу та правил безпеки.", "Самостійність і творчий підхід."]}, {"h": "Теми проєктів", "p": ["Оберіть одну з тем або запропонуйте власну, погодивши її з учителем. Можна працювати індивідуально чи в парі."], "ul": ["Камера-обскура своїми руками: як отримати зображення без лінзи.", "Перископ і калейдоскоп: виготовлення та дослідження моделей.", "Веселка вдома: дослідження дисперсії світла за допомогою води та дзеркала.", "Як працює оптоволокно: дослід зі струменем води та ліхтариком.", "Оптичні ілюзії та особливості людського зору.", "Вади зору в моєму класі: опитування та поради щодо гігієни зору.", "Від лупи до телескопа: історія оптичних приладів і саморобна модель телескопа.", "Чому небо блакитне, а захід Сонця червоний."]}, {"h": "Приклад плану виступу", "p": ["Нижче — орієнтовний план виступу на тему «Камера-обскура своїми руками». За таким самим принципом можна побудувати будь-який виступ."], "ul": ["Вступ: що таке камера-обскура і навіщо вона була потрібна художникам (1 слайд).", "Фізика явища: прямолінійне поширення світла, чому зображення перевернуте (1–2 слайди).", "Виготовлення: матеріали, етапи, фото (2 слайди).", "Досліди: як розмір отвору і відстань до екрана впливають на яскравість і чіткість (2 слайди).", "Висновки та відповіді на запитання (1 слайд)."]}], "formulas": [], "terms": [["Навчальний проєкт", "самостійна дослідницька або творча робота учня з певною метою і завершеним результатом."], ["Гіпотеза", "припущення, яке перевіряють під час дослідження."], ["Презентація", "наочний виклад результатів роботи перед аудиторією."]], "examples": [], "lab": null, "f": "Струмінь води, що витікає з пляшки, може «вести» світло ліхтарика, як оптоволокно, — цей дослід уперше публічно показав швейцарський учений Даніель Колладон у XIX столітті.", "pr": ["Оберіть тему проєкту, сформулюйте мету й гіпотезу та складіть план роботи з термінами.", "Підготуйте презентацію (7–10 слайдів) і, за можливості, відео свого досліду чи моделі для онлайн-захисту."], "qz": [{"q": "Яке явище пояснює роботу камери-обскури?", "o": ["Дисперсія", "Заломлення в лінзі", "Прямолінійне поширення світла", "Повне внутрішнє відбивання"], "a": 2, "why": "Промені від кожної точки предмета проходять крізь отвір прямолінійно і дають перевернуте зображення."}, {"q": "Чому струмінь води може «вести» світло?", "o": ["Через повне внутрішнє відбивання на межі вода–повітря", "Через дисперсію", "Через поглинання світла", "Через розсіювання"], "a": 0, "why": "Світло всередині струменя падає на межу з повітрям під кутом, більшим за граничний."}, {"q": "Якою лінзою виправляють короткозорість?", "o": ["Збиральною", "Циліндричною", "Плоскою", "Розсіювальною"], "a": 3, "why": "Розсіювальна лінза зменшує оптичну силу ока й переносить зображення на сітківку."}, {"q": "Що спричиняє утворення веселки?", "o": ["Прямолінійне поширення світла", "Дисперсія і заломлення світла в краплинах води", "Відбивання від хмар", "Поглинання світла"], "a": 1, "why": "У краплинах різні кольори заломлюються по-різному і виходять під різними кутами."}, {"q": "Чому захід Сонця має червоний відтінок?", "o": ["Сонце ввечері холоне", "Червоне світло заломлюється найбільше", "Атмосфера випромінює червоне світло", "Світло проходить довший шлях в атмосфері, і синє розсіюється сильніше, ніж червоне"], "a": 3, "why": "Короткохвильове (синє) світло розсіюється сильніше, тож до спостерігача доходить переважно червоне."}]}]}, {"title": "Будова атома та атомного ядра", "lessons": [{"n": "73", "type": "theory", "t": "Моделі атома та атомного ядра. Досліди Резерфорда. Ізотопи", "gr": "ГР2", "g": "З’ясувати, як учені дійшли до ядерної (планетарної) моделі атома, з чого складається атомне ядро і що таке ізотопи.", "blocks": [{"h": "Від «пудингу з родзинками» до ядерної моделі", "p": ["Наприкінці XIX століття стало зрозуміло, що атом не є неподільним: 1897 року Джозеф Джон Томсон відкрив електрон — частинку з негативним зарядом, яка входить до складу всіх атомів. Оскільки атом загалом електрично нейтральний, у ньому має бути й позитивний заряд.", "Томсон запропонував модель, яку жартома назвали «пудингом з родзинками»: атом — це позитивно заряджена куля, у яку вкраплені електрони. Щоб перевірити цю модель, потрібен був експеримент, який дав би змогу «зазирнути» всередину атома."], "ul": ["1897 р. — Дж. Дж. Томсон відкрив електрон.", "1903 р. — модель Томсона: позитивний заряд рівномірно розподілений по всьому об’єму атома.", "1911 р. — Е. Резерфорд запропонував ядерну (планетарну) модель атома.", "1913 р. — Н. Бор доповнив модель Резерфорда: електрони рухаються лише певними (стаціонарними) орбітами і при цьому не випромінюють енергії.", "Сучасна фізика описує рух електронів в атомі за допомогою квантової механіки — як «електронну хмару»."]}, {"h": "Досліди Резерфорда", "p": ["У 1909–1911 роках у лабораторії Ернеста Резерфорда тонку золоту фольгу «обстрілювали» α-частинками — швидкими позитивно зарядженими частинками, які вилітають з радіоактивних речовин. Частинки після проходження фольги реєстрували за спалахами на екрані.", "Майже всі α-частинки пролітали крізь фольгу, майже не відхиляючись. Але дуже мала частка (приблизно одна з кількох тисяч) відхилялася на великі кути, а деякі навіть відскакували назад. Резерфорд порівняв це з тим, ніби артилерійський снаряд відбився від аркуша паперу. Пояснити такий результат моделлю Томсона неможливо."], "ul": ["Висновок 1: більша частина об’єму атома — порожнеча, тому більшість α-частинок пролітає без відхилення.", "Висновок 2: увесь позитивний заряд і майже вся маса атома (понад 99,9 %) зосереджені в дуже малому ядрі.", "Висновок 3: розмір ядра (10⁻¹⁵–10⁻¹⁴ м) приблизно в 10 000–100 000 разів менший за розмір атома (близько 10⁻¹⁰ м).", "Навколо ядра рухаються електрони, як планети навколо Сонця, — звідси назва «планетарна модель».", "Сили, які відхиляють α-частинки, — це сили електричного відштовхування від позитивно зарядженого ядра."]}, {"h": "Склад атомного ядра", "p": ["1919 року Резерфорд виявив, що з ядер Нітрогену під час бомбардування α-частинками вилітають протони — ядра атома Гідрогену. 1932 року Джеймс Чедвік відкрив нейтрон — електрично нейтральну частинку з масою, майже такою самою, як у протона. Відтоді відомо, що ядро складається з протонів і нейтронів, які разом називають нуклонами.", "Ядро позначають символом хімічного елемента з двома числами: угорі зліва — масове число A, унизу зліва — зарядове число Z. Наприклад, ²³⁸₉₂U — ядро Урану, яке містить 92 протони і 238 − 92 = 146 нейтронів."], "ul": ["Протон (¹₁p): заряд +e = +1,6·10⁻¹⁹ Кл, маса ≈ 1,673·10⁻²⁷ кг.", "Нейтрон (¹₀n): заряду не має, маса ≈ 1,675·10⁻²⁷ кг.", "Зарядове число Z — кількість протонів у ядрі; воно збігається з порядковим номером елемента в періодичній системі.", "Масове число A — загальна кількість нуклонів у ядрі: A = Z + N.", "У нейтральному атомі кількість електронів дорівнює кількості протонів, тобто Z."]}, {"h": "Ізотопи", "p": ["Ядра одного хімічного елемента завжди мають однакову кількість протонів, але кількість нейтронів у них може бути різною. Такі різновиди атомів називають ізотопами. Хімічні властивості ізотопів практично однакові, бо їх визначає кількість електронів, тобто Z, а от маси й ядерні властивості (зокрема радіоактивність) різні.", "Більшість хімічних елементів у природі є сумішшю кількох ізотопів. Тому відносна атомна маса в періодичній системі зазвичай дробова: це середнє значення з урахуванням поширеності ізотопів."], "ul": ["Ізотопи Гідрогену: протій ¹₁H (ядро — 1 протон), дейтерій ²₁H (1 протон і 1 нейтрон), тритій ³₁H (1 протон і 2 нейтрони).", "Ізотопи Карбону: ¹²₆C (стабільний, найпоширеніший) і ¹⁴₆C (радіоактивний, використовується для визначення віку знахідок).", "Ізотопи Урану: ²³⁸₉₂U (понад 99 % природного урану) і ²³⁵₉₂U (менше 1 %), саме ²³⁵U є основним паливом АЕС.", "Важка вода — вода, у якій замість протію міститься дейтерій.", "Ізотопи одного елемента займають одну клітинку періодичної системи (грецьке «ізос топос» — «однакове місце»)."]}], "formulas": [{"f": "A = Z + N", "d": "A — масове число (кількість нуклонів), Z — зарядове число (кількість протонів), N — кількість нейтронів"}, {"f": "N = A − Z", "d": "кількість нейтронів у ядрі"}, {"f": "q_я = Z·e", "d": "q_я — заряд ядра, e = 1,6·10⁻¹⁹ Кл — елементарний заряд"}], "terms": [["Атомне ядро", "позитивно заряджена центральна частина атома, у якій зосереджена майже вся його маса."], ["Нуклони", "спільна назва протонів і нейтронів — частинок, з яких складається ядро."], ["Зарядове число (Z)", "кількість протонів у ядрі, що дорівнює порядковому номеру елемента в періодичній системі."], ["Масове число (A)", "загальна кількість протонів і нейтронів у ядрі."], ["Ізотопи", "різновиди атомів одного хімічного елемента, ядра яких мають однакову кількість протонів, але різну кількість нейтронів."], ["Планетарна (ядерна) модель атома", "модель, за якою в центрі атома розташоване маленьке масивне позитивне ядро, а навколо нього рухаються електрони."]], "examples": [{"q": "Визначте склад ядер і кількість електронів в атомах ізотопів Урану ²³⁵₉₂U і ²³⁸₉₂U.", "s": ["Дано: ²³⁵₉₂U: A₁ = 235, Z = 92; ²³⁸₉₂U: A₂ = 238, Z = 92.", "Розв’язання: кількість протонів дорівнює Z = 92 для обох ізотопів. Кількість нейтронів N = A − Z: N₁ = 235 − 92 = 143; N₂ = 238 − 92 = 146. У нейтральному атомі кількість електронів дорівнює Z.", "Відповідь: ²³⁵U — 92 протони, 143 нейтрони, 92 електрони; ²³⁸U — 92 протони, 146 нейтронів, 92 електрони."]}, {"q": "Обчисліть заряд ядра атома Оксигену ¹⁶₈O.", "s": ["Дано: Z = 8; e = 1,6·10⁻¹⁹ Кл. Знайти: q_я.", "Розв’язання: q_я = Z·e = 8 · 1,6·10⁻¹⁹ Кл = 1,28·10⁻¹⁸ Кл.", "Відповідь: q_я ≈ 1,3·10⁻¹⁸ Кл."]}], "lab": null, "f": "Якби ядро атома збільшили до розмірів горошини, то сам атом мав би розмір у кілька сотень метрів — більший за стадіон. Тобто речовина, з якої складаємося ми й усе навколо, — це переважно порожнеча.", "pr": ["Визначте кількість протонів, нейтронів і електронів в атомах ²⁷₁₃Al, ⁴⁰₂₀Ca і ¹⁹⁷₇₉Au. Результати запишіть у таблицю.", "Поясніть письмово (5–7 речень), чому результати дослідів Резерфорда не можна було пояснити моделлю Томсона і які висновки з них випливають."], "qz": [{"q": "Що спостерігали в дослідах Резерфорда?", "o": ["Усі α-частинки поглиналися фольгою", "Більшість α-частинок пролітала крізь фольгу, а деякі відхилялися на великі кути", "Усі α-частинки відбивалися назад", "α-частинки перетворювалися на електрони"], "a": 1, "why": "Саме рідкісні відхилення на великі кути довели існування маленького масивного ядра."}, {"q": "Хто відкрив нейтрон?", "o": ["Е. Резерфорд", "Дж. Дж. Томсон", "Н. Бор", "Дж. Чедвік"], "a": 3, "why": "Нейтрон відкрив Джеймс Чедвік 1932 року."}, {"q": "Скільки нейтронів містить ядро ⁵⁶₂₆Fe?", "o": ["30", "26", "56", "82"], "a": 0, "why": "N = A − Z = 56 − 26 = 30."}, {"q": "Чим відрізняються ядра ізотопів одного елемента?", "o": ["Кількістю протонів", "Зарядом ядра", "Кількістю нейтронів", "Кількістю електронів в атомі"], "a": 2, "why": "У ізотопів однакове Z, але різна кількість нейтронів."}, {"q": "Що визначає зарядове число Z?", "o": ["Кількість нуклонів", "Кількість протонів у ядрі", "Кількість нейтронів", "Масу атома в кілограмах"], "a": 1, "why": "Z — це кількість протонів, вона ж — порядковий номер елемента."}, {"q": "Де зосереджена майже вся маса атома?", "o": ["У ядрі", "В електронній оболонці", "Рівномірно по всьому об’єму атома", "У просторі між атомами"], "a": 0, "why": "Маса протонів і нейтронів набагато більша за масу електронів, тому понад 99,9 % маси атома — у ядрі."}, {"q": "Яке ядро є ядром ізотопу Гідрогену дейтерію?", "o": ["¹₁H", "³₁H", "⁴₂He", "²₁H"], "a": 3, "why": "Дейтерій має 1 протон і 1 нейтрон, тобто A = 2, Z = 1."}, {"q": "Чому α-частинки відхилялися, пролітаючи поблизу ядра?", "o": ["Через гравітаційне притягання до ядра", "Через магнітне поле електронів", "Через електричне відштовхування від позитивного ядра", "Через тертя об атоми золота"], "a": 2, "why": "І α-частинка, і ядро заряджені позитивно, тому вони відштовхуються."}]}, {"n": "74", "type": "theory", "t": "Ядерні сили", "gr": "ГР2", "g": "Зрозуміти, які сили утримують нуклони в ядрі, які в них властивості та що таке дефект мас і енергія зв’язку ядра.", "blocks": [{"h": "Чому ядро не розлітається?", "p": ["Протони в ядрі заряджені однойменно й перебувають на відстанях близько 10⁻¹⁵ м, тому сили електричного відштовхування між ними величезні. Гравітаційне притягання нуклонів надто слабке, щоб їм протидіяти. Отже, має існувати особлива сила притягання, значно сильніша за електричну.", "Таку взаємодію назвали сильною, а сили, що утримують нуклони в ядрі, — ядерними. Сильна взаємодія — одна з чотирьох фундаментальних взаємодій у природі (разом з гравітаційною, електромагнітною і слабкою)."], "ul": ["Гравітаційна взаємодія — найслабша, але діє на будь-яких відстанях між будь-якими тілами.", "Електромагнітна взаємодія — діє між зарядженими частинками, утримує електрони в атомах.", "Сильна (ядерна) взаємодія — найсильніша, утримує нуклони в ядрі.", "Слабка взаємодія — відповідає, зокрема, за β-розпад ядер."]}, {"h": "Властивості ядерних сил", "p": ["Ядерні сили мають незвичні властивості. Вони дуже великі, але діють лише на дуже малих відстанях — порядку розміру самого ядра. Уже на відстані кількох діаметрів нуклона вони практично зникають, тому ядро не притягує електрони чи сусідні атоми ядерними силами.", "Через те що ядерні сили короткодійні, кожен нуклон взаємодіє лише з найближчими сусідами. А електричне відштовхування діє між усіма протонами ядра. Тому у великих ядрах відштовхування стає дедалі відчутнішим — і важкі ядра менш стабільні."], "ul": ["Є силами притягання (на відстанях близько 10⁻¹⁵ м).", "Приблизно у 100 разів сильніші за електричне відштовхування протонів на цих відстанях.", "Короткодійні: радіус дії — близько 10⁻¹⁵ м.", "Зарядово незалежні: однаково діють між двома протонами, двома нейтронами, протоном і нейтроном.", "Мають властивість насичення: нуклон взаємодіє лише з обмеженою кількістю найближчих нуклонів."]}, {"h": "Дефект мас та енергія зв’язку", "p": ["Точні вимірювання показали дивовижну річ: маса ядра завжди менша, ніж сума мас вільних протонів і нейтронів, з яких воно складається. Цю різницю Δm називають дефектом мас.", "Пояснення дає формула Ейнштейна E = mc²: маса і енергія пов’язані. Коли нуклони об’єднуються в ядро, виділяється енергія, і маса системи зменшується. Щоб розщепити ядро на окремі нуклони, треба затратити таку саму енергію — її називають енергією зв’язку ядра: E_зв = Δm·c²."], "ul": ["Енергію в ядерній фізиці зручно вимірювати в мегаелектронвольтах: 1 еВ = 1,6·10⁻¹⁹ Дж, 1 МеВ = 1,6·10⁻¹³ Дж.", "Маси частинок зручно вимірювати в атомних одиницях маси: 1 а. о. м. ≈ 1,66·10⁻²⁷ кг.", "Дефекту мас 1 а. о. м. відповідає енергія ≈ 931,5 МеВ.", "Маса протона m_p ≈ 1,00728 а. о. м., маса нейтрона m_n ≈ 1,00866 а. о. м.", "Енергія зв’язку ядер у мільйони разів більша за енергію хімічних зв’язків, які вимірюються кількома електронвольтами."]}, {"h": "Питома енергія зв’язку", "p": ["Щоб порівняти міцність різних ядер, обчислюють питому енергію зв’язку — енергію зв’язку, що припадає на один нуклон. Чим вона більша, тим міцніше ядро.", "Найбільшу питому енергію зв’язку (близько 8,8 МеВ на нуклон) мають ядра середньої маси, наприклад Феруму ⁵⁶Fe. У легких і дуже важких ядер вона менша. Звідси два способи отримати ядерну енергію: розділити важке ядро на середні (поділ) або об’єднати легкі ядра у важче (синтез)."], "ul": ["У дейтерію питома енергія зв’язку ≈ 1,1 МеВ/нуклон — це дуже нестійке ядро.", "У гелію ⁴He ≈ 7,1 МеВ/нуклон — воно надзвичайно міцне.", "У Урану ²³⁸U ≈ 7,6 МеВ/нуклон — менше, ніж у середніх ядер.", "Поділ важких ядер — основа роботи атомних електростанцій.", "Синтез легких ядер — джерело енергії Сонця й інших зір."]}], "formulas": [{"f": "E = mc²", "d": "зв’язок маси та енергії; c ≈ 3·10⁸ м/с — швидкість світла у вакуумі"}, {"f": "Δm = (Z·m_p + N·m_n) − m_я", "d": "Δm — дефект мас, m_p і m_n — маси протона і нейтрона, m_я — маса ядра"}, {"f": "E_зв = Δm·c²", "d": "E_зв — енергія зв’язку ядра; якщо Δm в а. о. м., то E_зв (МеВ) ≈ 931,5·Δm"}, {"f": "E_пит = E_зв / A", "d": "питома енергія зв’язку — енергія зв’язку на один нуклон"}], "terms": [["Ядерні сили", "сили притягання між нуклонами, що утримують їх у ядрі."], ["Сильна взаємодія", "фундаментальна взаємодія, яка проявляється як ядерні сили; найсильніша з відомих взаємодій."], ["Дефект мас", "різниця між сумою мас вільних нуклонів і масою ядра, яке з них складається."], ["Енергія зв’язку ядра", "мінімальна енергія, яку треба затратити, щоб розщепити ядро на окремі нуклони."], ["Питома енергія зв’язку", "енергія зв’язку, що припадає на один нуклон ядра."], ["Електронвольт", "позасистемна одиниця енергії, що дорівнює 1,6·10⁻¹⁹ Дж."]], "examples": [{"q": "Обчисліть енергію зв’язку ядра дейтерію ²₁H, якщо його маса 2,01355 а. о. м. Маса протона 1,00728 а. о. м., нейтрона — 1,00866 а. о. м.", "s": ["Дано: Z = 1, N = 1; m_я = 2,01355 а. о. м.; m_p = 1,00728 а. о. м.; m_n = 1,00866 а. о. м.", "Розв’язання: Δm = (m_p + m_n) − m_я = (1,00728 + 1,00866) − 2,01355 = 0,00239 а. о. м. E_зв = 931,5 МеВ · 0,00239 ≈ 2,2 МеВ.", "Відповідь: E_зв ≈ 2,2 МеВ ≈ 3,5·10⁻¹³ Дж."]}, {"q": "Маса ядра гелію ⁴₂He дорівнює 4,00151 а. о. м. Обчисліть енергію зв’язку та питому енергію зв’язку цього ядра.", "s": ["Дано: Z = 2, N = 2, A = 4; m_я = 4,00151 а. о. м.", "Розв’язання: Δm = 2·1,00728 + 2·1,00866 − 4,00151 = 4,03188 − 4,00151 = 0,03037 а. о. м. E_зв = 931,5 · 0,03037 ≈ 28,3 МеВ. E_пит = E_зв / A = 28,3 / 4 ≈ 7,1 МеВ/нуклон.", "Відповідь: E_зв ≈ 28,3 МеВ; E_пит ≈ 7,1 МеВ на нуклон."]}], "lab": null, "f": "Щоб «розібрати» на нуклони лише 4 г гелію (один моль ядер), треба затратити близько 2,7·10¹² Дж — приблизно стільки ж енергії виділяється під час згоряння майже 100 т кам’яного вугілля.", "pr": ["Складіть таблицю «Чотири фундаментальні взаємодії»: назва, між якими частинками діє, відносна сила, радіус дії, приклад прояву.", "Маса ядра Літію ⁷₃Li дорівнює 7,01436 а. о. м. Обчисліть дефект мас і енергію зв’язку цього ядра."], "qz": [{"q": "Яка сила утримує протони і нейтрони в ядрі?", "o": ["Гравітаційна", "Електрична", "Ядерна", "Сила пружності"], "a": 2, "why": "Нуклони утримують ядерні сили — прояв сильної взаємодії."}, {"q": "Який радіус дії ядерних сил?", "o": ["Близько 10⁻¹⁵ м", "Близько 10⁻¹⁰ м", "Близько 1 м", "Необмежений"], "a": 0, "why": "Ядерні сили короткодійні — діють на відстанях порядку розміру ядра."}, {"q": "Ядерні сили між двома нейтронами порівняно із силами між двома протонами…", "o": ["відсутні", "приблизно такі самі", "значно слабші", "є силами відштовхування"], "a": 1, "why": "Ядерні сили зарядово незалежні."}, {"q": "Що таке дефект мас?", "o": ["Маса електронів атома", "Різниця між масою атома і масою ядра", "Маса нейтронів у ядрі", "Різниця між сумою мас вільних нуклонів і масою ядра"], "a": 3, "why": "Маса ядра менша за суму мас нуклонів, ця різниця — дефект мас."}, {"q": "Дефект мас ядра 0,01 а. о. м. Яка енергія зв’язку?", "o": ["93,15 МеВ", "0,9315 МеВ", "9,315 МеВ", "931,5 МеВ"], "a": 2, "why": "E_зв = 931,5 · 0,01 ≈ 9,3 МеВ."}, {"q": "Ядра якої групи елементів найміцніші?", "o": ["Найлегші (Гідроген, Гелій)", "Середньої маси (поблизу Феруму)", "Найважчі (Уран, Плутоній)", "Усі ядра однаково міцні"], "a": 1, "why": "Найбільшу питому енергію зв’язку (≈ 8,8 МеВ/нуклон) мають ядра поблизу ⁵⁶Fe."}, {"q": "Скільки джоулів в 1 МеВ?", "o": ["1,6·10⁻¹³ Дж", "1,6·10⁻¹⁹ Дж", "1,6·10⁶ Дж", "9·10¹⁶ Дж"], "a": 0, "why": "1 МеВ = 10⁶ · 1,6·10⁻¹⁹ Дж = 1,6·10⁻¹³ Дж."}, {"q": "Чому дуже важкі ядра менш стабільні?", "o": ["Бо в них немає нейтронів", "Бо ядерні сили в них зникають", "Бо електрони притягуються до ядра", "Бо електричне відштовхування діє між усіма протонами, а ядерне притягання — лише між сусідніми нуклонами"], "a": 3, "why": "Ядерні сили короткодійні і насичуються, а кулонівське відштовхування діє на всіх відстанях у ядрі."}]}, {"n": "75", "type": "theory", "t": "Радіоактивність. Види радіоактивних випромінювань", "gr": "ГР1, ГР3", "g": "Дізнатися, що таке радіоактивність, які існують види радіоактивного випромінювання, чим вони відрізняються і як змінюються ядра під час розпаду.", "blocks": [{"h": "Відкриття радіоактивності", "p": ["1896 року французький фізик Анрі Беккерель виявив, що солі Урану самі собою, без жодного зовнішнього впливу, випромінюють невидимі промені, які засвічують фотопластинку, загорнуту в чорний папір. 1898 року Марія Склодовська-Кюрі та П’єр Кюрі відкрили ще два елементи з таким випромінюванням — Полоній і Радій — і запропонували термін «радіоактивність».", "Подальші дослідження показали: радіоактивність — це властивість ядер, а не атомів чи молекул. Її не можна прискорити або сповільнити нагріванням, тиском чи хімічними реакціями."], "ul": ["Радіоактивність — здатність ядер деяких атомів самочинно перетворюватися на інші ядра з випромінюванням частинок.", "Природна радіоактивність притаманна, зокрема, Урану, Торію, Радію, Радону, ізотопу Калію ⁴⁰K.", "Штучну радіоактивність отримують у ядерних реакціях (перше відкриття — І. Жоліо-Кюрі та Ф. Жоліо-Кюрі, 1934 р.).", "Усі елементи з порядковим номером, більшим за 83 (після Бісмуту), не мають стабільних ізотопів.", "Радіоактивне випромінювання йонізує речовину, тому його називають йонізувальним."]}, {"h": "Три види випромінювання", "p": ["Резерфорд пропускав радіоактивне випромінювання через магнітне поле і виявив, що пучок розділяється на три частини. Одна відхилялася як позитивно заряджені частинки, друга — як негативно заряджені, третя не відхилялася зовсім. Їх назвали першими літерами грецької абетки: α, β і γ.", "Кожен вид випромінювання має свою природу, а отже — різну йонізувальну і проникну здатність."], "ul": ["α-випромінювання — потік ядер Гелію ⁴₂He (2 протони і 2 нейтрони), заряд +2e.", "β-випромінювання — потік швидких електронів ⁰₋₁e, що вилітають з ядер.", "γ-випромінювання — електромагнітні хвилі дуже малої довжини (менше 10⁻¹¹ м), потік фотонів великої енергії; заряду не мають.", "α-частинки мають найбільшу йонізувальну здатність, γ-промені — найменшу.", "γ-випромінювання часто супроводжує α- і β-розпади."]}, {"h": "Проникна здатність і захист", "p": ["Що сильніше частинка йонізує речовину, то швидше вона втрачає енергію і то менший шлях проходить. Тому α-частинки, хоч і дуже «руйнівні», затримуються навіть аркушем паперу, а γ-випромінювання проходить крізь товсті шари речовини.", "Для людини небезпечне будь-яке з цих випромінювань. α-випромінювання особливо шкідливе, коли джерело потрапило всередину організму (з їжею, водою, повітрям)."], "ul": ["α-частинки: у повітрі пролітають кілька сантиметрів, затримуються аркушем паперу або верхнім шаром шкіри.", "β-частинки: у повітрі — до кількох метрів, затримуються кількома міліметрами алюмінію.", "γ-промені: послаблюються лише товстим шаром свинцю, бетону або ґрунту.", "Найкращий захист від γ-випромінювання — свинцеві та бетонні екрани.", "Від α- і β-частинок рятують одяг, окуляри, респіратор і недопущення потрапляння радіоактивних речовин усередину організму."]}, {"h": "Правила зміщення", "p": ["Під час радіоактивного розпаду ядро одного елемента перетворюється на ядро іншого. У ядерних перетвореннях виконуються закон збереження заряду (сума зарядових чисел зберігається) і закон збереження кількості нуклонів (сума масових чисел зберігається).", "Під час β-розпаду в ядрі нейтрон перетворюється на протон, електрон і антинейтрино: ¹₀n → ¹₁p + ⁰₋₁e + ν̃. Електрон і антинейтрино вилітають, а протон залишається в ядрі, тому Z зростає на 1."], "ul": ["α-розпад: A зменшується на 4, Z — на 2; елемент зміщується на дві клітинки до початку періодичної системи.", "Приклад α-розпаду: ²²⁶₈₈Ra → ²²²₈₆Rn + ⁴₂He.", "β-розпад: A не змінюється, Z збільшується на 1; елемент зміщується на одну клітинку до кінця таблиці.", "Приклад β-розпаду: ¹⁴₆C → ¹⁴₇N + ⁰₋₁e + ν̃.", "γ-випромінювання не змінює ні A, ні Z: ядро лише переходить у стан з меншою енергією."]}], "formulas": [{"f": "ᴬ_Z X → ᴬ⁻⁴_(Z−2) Y + ⁴₂He", "d": "правило зміщення для α-розпаду: масове число зменшується на 4, зарядове — на 2"}, {"f": "ᴬ_Z X → ᴬ_(Z+1) Y + ⁰₋₁e + ν̃", "d": "правило зміщення для β-розпаду: масове число не змінюється, зарядове зростає на 1; ν̃ — антинейтрино"}, {"f": "¹₀n → ¹₁p + ⁰₋₁e + ν̃", "d": "перетворення нейтрона на протон під час β-розпаду"}], "terms": [["Радіоактивність", "здатність ядер деяких атомів самочинно перетворюватися на інші ядра з випромінюванням частинок."], ["α-випромінювання", "потік ядер атома Гелію, які вилітають з радіоактивних ядер."], ["β-випромінювання", "потік швидких електронів, які утворюються в ядрі під час його розпаду."], ["γ-випромінювання", "короткохвильове електромагнітне випромінювання, що виникає під час переходу ядра у стан з меншою енергією."], ["Йонізувальна здатність", "здатність випромінювання утворювати йони під час проходження крізь речовину."], ["Проникна здатність", "товщина шару речовини, який може пройти випромінювання."], ["Правило зміщення", "правило, яке визначає, на яку кількість клітинок у періодичній системі зміщується елемент під час α- або β-розпаду."]], "examples": [{"q": "Ядро Урану ²³⁸₉₂U зазнає α-розпаду. На ядро якого елемента воно перетворюється? Запишіть рівняння реакції.", "s": ["Дано: ²³⁸₉₂U, α-розпад.", "Розв’язання: під час α-розпаду A зменшується на 4: 238 − 4 = 234; Z зменшується на 2: 92 − 2 = 90. Елемент з Z = 90 — Торій. ²³⁸₉₂U → ²³⁴₉₀Th + ⁴₂He.", "Відповідь: утворюється ядро Торію ²³⁴₉₀Th."]}, {"q": "Ядро Торію ²³⁴₉₀Th зазнає β-розпаду. Яке ядро утворюється?", "s": ["Дано: ²³⁴₉₀Th, β-розпад.", "Розв’язання: під час β-розпаду A не змінюється (234), Z зростає на 1: 90 + 1 = 91. Елемент з Z = 91 — Протактиній. ²³⁴₉₀Th → ²³⁴₉₁Pa + ⁰₋₁e + ν̃.", "Відповідь: утворюється ядро Протактинію ²³⁴₉₁Pa."]}], "lab": null, "f": "Лабораторні записники Марії Склодовської-Кюрі досі радіоактивні: їх зберігають у свинцевих контейнерах, а дослідники, які хочуть з ними працювати, мають підписати згоду і користуватися захисним одягом.", "pr": ["Складіть порівняльну таблицю α-, β- і γ-випромінювання за планом: природа, заряд, йонізувальна здатність, проникна здатність, чим можна затримати.", "Запишіть рівняння: α-розпаду ²¹⁰₈₄Po; β-розпаду ⁶⁰₂₇Co; β-розпаду ¹³¹₅₃I. Назвіть ядра, що утворюються."], "qz": [{"q": "Хто відкрив явище радіоактивності?", "o": ["А. Беккерель", "Е. Резерфорд", "Н. Бор", "А. Ейнштейн"], "a": 0, "why": "Радіоактивність відкрив Анрі Беккерель 1896 року, досліджуючи солі Урану."}, {"q": "Що являє собою α-випромінювання?", "o": ["Потік електронів", "Електромагнітні хвилі", "Потік ядер атома Гелію", "Потік нейтронів"], "a": 2, "why": "α-частинка — це ядро ⁴₂He."}, {"q": "Яке випромінювання не відхиляється магнітним полем?", "o": ["α", "β", "Усі три відхиляються", "γ"], "a": 3, "why": "γ-випромінювання — електромагнітні хвилі, заряду не має."}, {"q": "Яке випромінювання має найбільшу проникну здатність?", "o": ["α", "γ", "β", "Усі однакову"], "a": 1, "why": "γ-промені послаблюються лише товстими шарами свинцю або бетону."}, {"q": "Як змінюється зарядове число Z під час β-розпаду?", "o": ["Збільшується на 1", "Зменшується на 2", "Не змінюється", "Зменшується на 1"], "a": 0, "why": "Нейтрон перетворюється на протон, тому Z зростає на 1."}, {"q": "Яке ядро утворюється в результаті α-розпаду ²²⁶₈₈Ra?", "o": ["²²⁶₈₉Ac", "²²²₈₆Rn", "²²²₈₈Ra", "²³⁰₉₀Th"], "a": 1, "why": "A = 226 − 4 = 222, Z = 88 − 2 = 86 — Радон."}, {"q": "Що з наведеного може прискорити радіоактивний розпад?", "o": ["Нагрівання", "Підвищення тиску", "Ніщо з переліченого", "Хімічна реакція"], "a": 2, "why": "Радіоактивність — властивість ядра, на неї не впливають звичайні фізичні та хімічні умови."}, {"q": "Чим можна затримати α-частинки?", "o": ["Лише товстим шаром свинцю", "Лише бетонною стіною", "Їх неможливо затримати", "Аркушем паперу"], "a": 3, "why": "α-частинки мають малий пробіг і затримуються навіть папером."}]}, {"n": "76", "type": "problems", "t": "Розв’язування задач", "gr": "ГР3", "g": "Навчитися визначати склад ядер, записувати рівняння радіоактивних розпадів і ядерних реакцій та обчислювати енергію зв’язку ядер.", "blocks": [{"h": "Алгоритм розв’язування задач на ядерні перетворення", "p": ["У всіх ядерних реакціях і розпадах зберігаються дві величини: сума масових чисел (кількість нуклонів) і сума зарядових чисел (заряд). Тому невідому частинку завжди знаходимо, «зрівнюючи» верхні і нижні індекси ліворуч і праворуч від стрілки.", "Для задач на енергію зв’язку спочатку обчислюємо дефект мас в атомних одиницях маси, а потім множимо його на 931,5 МеВ."], "ul": ["Крок 1. Запишіть рівняння реакції, позначивши невідоме ядро чи частинку як ᴬ_Z X.", "Крок 2. Складіть рівняння для масових чисел (верхні індекси) і знайдіть A.", "Крок 3. Складіть рівняння для зарядових чисел (нижні індекси) і знайдіть Z.", "Крок 4. За значенням Z визначте елемент у періодичній системі (Z = 0, A = 1 — нейтрон; Z = 1, A = 1 — протон; Z = −1, A = 0 — електрон).", "Корисні позначення: α = ⁴₂He, β = ⁰₋₁e, n = ¹₀n, p = ¹₁p, γ — без індексів (A = 0, Z = 0).", "Кількість α-розпадів у ланцюжку = (A₁ − A₂)/4; кількість β-розпадів знаходимо із заряду: Z₂ = Z₁ − 2·n_α + n_β."]}], "formulas": [{"f": "A = Z + N", "d": "A — масове число, Z — кількість протонів, N — кількість нейтронів"}, {"f": "ᴬ_Z X → ᴬ⁻⁴_(Z−2) Y + ⁴₂He", "d": "α-розпад"}, {"f": "ᴬ_Z X → ᴬ_(Z+1) Y + ⁰₋₁e + ν̃", "d": "β-розпад"}, {"f": "Δm = (Z·m_p + N·m_n) − m_я", "d": "дефект мас; m_p ≈ 1,00728 а. о. м., m_n ≈ 1,00866 а. о. м."}, {"f": "E_зв = Δm·c² ≈ 931,5 МеВ · Δm (а. о. м.)", "d": "енергія зв’язку ядра"}, {"f": "E_пит = E_зв / A", "d": "питома енергія зв’язку"}], "terms": [], "examples": [{"q": "Визначте склад ядра Алюмінію ²⁷₁₃Al і кількість електронів у його атомі.", "s": ["Дано: A = 27, Z = 13.", "Розв’язання: кількість протонів Z = 13; кількість нейтронів N = A − Z = 27 − 13 = 14; кількість електронів у нейтральному атомі дорівнює Z = 13.", "Відповідь: 13 протонів, 14 нейтронів, 13 електронів."]}, {"q": "Ядро Плутонію ²³⁹₉₄Pu зазнає α-розпаду. Запишіть рівняння і визначте ядро, що утворюється.", "s": ["Дано: ²³⁹₉₄Pu, α-розпад.", "Розв’язання: ²³⁹₉₄Pu → ᴬ_Z X + ⁴₂He. Масові числа: 239 = A + 4, A = 235. Зарядові числа: 94 = Z + 2, Z = 92 — Уран.", "Відповідь: ²³⁹₉₄Pu → ²³⁵₉₂U + ⁴₂He."]}, {"q": "Яку частинку випустило ядро Нітрогену під час першої в історії штучної ядерної реакції (Резерфорд, 1919 р.): ¹⁴₇N + ⁴₂He → ¹⁷₈O + ?", "s": ["Дано: ¹⁴₇N + ⁴₂He → ¹⁷₈O + ᴬ_Z X.", "Розв’язання: масові числа: 14 + 4 = 17 + A, A = 1. Зарядові числа: 7 + 2 = 8 + Z, Z = 1. Частинка з A = 1, Z = 1 — протон ¹₁p.", "Відповідь: протон."]}, {"q": "Скільки α- і β-розпадів відбувається в ланцюжку перетворень ядра ²³⁸₉₂U на стабільне ядро Плюмбуму ²⁰⁶₈₂Pb?", "s": ["Дано: ²³⁸₉₂U → ²⁰⁶₈₂Pb.", "Розв’язання: масове число змінюють лише α-розпади: n_α = (238 − 206)/4 = 32/4 = 8. Після 8 α-розпадів Z = 92 − 2·8 = 76. Але кінцеве Z = 82, отже, відбулося n_β = 82 − 76 = 6 β-розпадів (кожен збільшує Z на 1).", "Відповідь: 8 α-розпадів і 6 β-розпадів."]}, {"q": "Обчисліть енергію зв’язку і питому енергію зв’язку ядра Літію ⁷₃Li, маса якого 7,01436 а. о. м.", "s": ["Дано: Z = 3, A = 7, N = 4; m_я = 7,01436 а. о. м.; m_p = 1,00728 а. о. м.; m_n = 1,00866 а. о. м.", "Розв’язання: Δm = 3·1,00728 + 4·1,00866 − 7,01436 = 3,02184 + 4,03464 − 7,01436 = 0,04212 а. о. м. E_зв = 931,5 · 0,04212 ≈ 39,2 МеВ. E_пит = 39,2 / 7 ≈ 5,6 МеВ/нуклон.", "Відповідь: E_зв ≈ 39,2 МеВ; E_пит ≈ 5,6 МеВ на нуклон."]}], "lab": null, "f": "", "pr": ["Визначте кількість протонів і нейтронів у ядрі ⁵⁶₂₆Fe. (26 протонів, 30 нейтронів)", "Запишіть рівняння α-розпаду ядра Полонію ²¹⁰₈₄Po. (²¹⁰₈₄Po → ²⁰⁶₈₂Pb + ⁴₂He)", "Скільки α- і β-розпадів відбувається під час перетворення ²³²₉₀Th на ²⁰⁸₈₂Pb? (6 α-розпадів і 4 β-розпади)", "Визначте невідому частинку в реакції, за допомогою якої було відкрито нейтрон: ⁹₄Be + ⁴₂He → ¹²₆C + ? (нейтрон ¹₀n)"], "qz": [{"q": "Скільки нейтронів у ядрі ²³⁵₉₂U?", "o": ["92", "235", "143", "327"], "a": 2, "why": "N = 235 − 92 = 143."}, {"q": "Яке ядро утворюється під час β-розпаду ⁶⁰₂₇Co?", "o": ["⁶⁰₂₈Ni", "⁵⁶₂₅Mn", "⁶⁰₂₆Fe", "⁶¹₂₇Co"], "a": 0, "why": "A не змінюється (60), Z = 27 + 1 = 28 — Нікол."}, {"q": "Визначте X у реакції ²⁷₁₃Al + ¹₀n → ²⁴₁₁Na + X.", "o": ["¹₁p", "⁰₋₁e", "¹₀n", "⁴₂He"], "a": 3, "why": "A: 27 + 1 − 24 = 4; Z: 13 − 11 = 2 — α-частинка."}, {"q": "Ядро зазнало двох α-розпадів. Як змінилося масове число?", "o": ["Зменшилося на 4", "Зменшилося на 8", "Зменшилося на 2", "Не змінилося"], "a": 1, "why": "Кожен α-розпад зменшує A на 4: 2·4 = 8."}, {"q": "Ядро зазнало одного α- і двох β-розпадів. Як змінилося зарядове число?", "o": ["Зменшилося на 2", "Збільшилося на 2", "Не змінилося", "Зменшилося на 4"], "a": 2, "why": "ΔZ = −2 + 2·1 = 0."}, {"q": "Дефект мас ядра 0,1 а. о. м. Яка його енергія зв’язку?", "o": ["9,3 МеВ", "0,93 МеВ", "9315 МеВ", "93 МеВ"], "a": 3, "why": "E_зв = 931,5 · 0,1 ≈ 93 МеВ."}, {"q": "Які величини обов’язково зберігаються в будь-якій ядерній реакції?", "o": ["Сума масових і сума зарядових чисел", "Лише кількість протонів", "Лише кількість нейтронів", "Кількість ядер"], "a": 0, "why": "Зберігаються кількість нуклонів і електричний заряд."}, {"q": "Енергія зв’язку ядра ⁴₂He становить 28,3 МеВ. Яка питома енергія зв’язку?", "o": ["14,2 МеВ/нуклон", "7,1 МеВ/нуклон", "28,3 МеВ/нуклон", "113 МеВ/нуклон"], "a": 1, "why": "E_пит = 28,3 / 4 ≈ 7,1 МеВ/нуклон."}]}, {"n": "77", "type": "theory", "t": "Активність радіоактивної речовини. Застосування радіоактивних ізотопів", "gr": "ГР2", "g": "Ознайомитися із законом радіоактивного розпаду, поняттями періоду піврозпаду й активності та з тим, як радіоактивні ізотопи використовують у медицині, техніці й науці.", "blocks": [{"h": "Період піврозпаду", "p": ["Неможливо передбачити, коли саме розпадеться окреме радіоактивне ядро: це випадкова подія. Але для великої кількості ядер діє чітка закономірність: за певний час розпадається половина наявних ядер, ще за такий самий час — половина від решти і так далі.", "Цей час називають періодом піврозпаду T. Для кожного радіоактивного ізотопу він свій і не залежить від зовнішніх умов. Через час t = nT кількість нерозпалих ядер становитиме N = N₀/2ⁿ — це закон радіоактивного розпаду."], "ul": ["Уран ²³⁸U — T ≈ 4,5 млрд років.", "Радій ²²⁶Ra — T ≈ 1600 років.", "Карбон ¹⁴C — T ≈ 5730 років.", "Цезій ¹³⁷Cs — T ≈ 30 років; Кобальт ⁶⁰Co — T ≈ 5,3 року.", "Йод ¹³¹I — T ≈ 8 діб; Радон ²²²Rn — T ≈ 3,8 доби.", "Через 10 періодів піврозпаду залишається лише близько 0,1 % (1/1024) початкової кількості ядер."]}, {"h": "Активність радіоактивної речовини", "p": ["Активність A показує, скільки ядер розпадається за одиницю часу. Одиниця активності в СІ — бекерель (Бк): 1 Бк = 1 розпад за секунду. Застаріла позасистемна одиниця — кюрі: 1 Кі = 3,7·10¹⁰ Бк (приблизно активність 1 г Радію).", "Активність пропорційна кількості радіоактивних ядер: A = λN, де λ — стала радіоактивного розпаду, яка показує ймовірність розпаду ядра за 1 с. Що менший період піврозпаду, то більша стала λ і то активніша речовина за однакової кількості ядер. Оскільки N з часом зменшується, активність теж спадає: A = A₀/2ⁿ."], "ul": ["[A] = 1 Бк = 1 с⁻¹.", "[λ] = 1 с⁻¹; λ ≈ 0,69/T.", "Ізотопи з малим T «горять яскраво, але недовго», з великим T — слабко, але дуже довго.", "Активність харчових продуктів, води, будівельних матеріалів вимірюють у Бк/кг або Бк/л і порівнюють із допустимими нормами.", "Активність людського тіла через природні ізотопи ⁴⁰K і ¹⁴C становить кілька тисяч бекерелів."]}, {"h": "Застосування в медицині", "p": ["Радіоактивні ізотопи допомагають і діагностувати, і лікувати. Для діагностики пацієнтові вводять дуже малу кількість короткоживучого ізотопу, який накопичується в певному органі, а спеціальна камера фіксує його випромінювання й будує зображення.", "Для лікування пухлин використовують променеву терапію: потужний пучок γ-випромінювання спрямовують точно на хворі клітини, які гинуть від йонізації."], "ul": ["Технецій ⁹⁹ᵐTc (T ≈ 6 год) — найпоширеніший ізотоп для діагностики органів.", "Йод ¹³¹I накопичується в щитоподібній залозі — його використовують для діагностики та лікування її захворювань.", "Кобальт ⁶⁰Co — джерело γ-випромінювання для «кобальтових гармат» у променевій терапії.", "Радіаційна стерилізація медичних інструментів, шприців і перев’язувальних матеріалів у герметичних упаковках.", "Позитронна емісійна томографія (ПЕТ) показує, як працюють клітини органів."]}, {"h": "Застосування в техніці, сільському господарстві й науці", "p": ["Метод мічених атомів полягає в тому, що до речовини додають невелику кількість радіоактивного ізотопу. За його випромінюванням можна простежити, куди і як швидко рухається речовина — у трубопроводі, рослині чи організмі тварини.", "Радіовуглецевий метод дає змогу визначити вік решток живих організмів. Поки організм живий, частка ¹⁴C у ньому стала; після смерті ¹⁴C розпадається, і за залишком активності визначають, скільки часу минуло."], "ul": ["Гамма-дефектоскопія — пошук тріщин і порожнин у зварних швах, литих деталях.", "Радіоізотопні товщиноміри й рівнеміри на заводах.", "Детектори диму з ізотопом Америцію ²⁴¹Am.", "Опромінення зерна та продуктів для знищення шкідників і бактерій; виведення нових сортів рослин.", "Радіоізотопні джерела енергії для космічних апаратів, що летять далеко від Сонця.", "Датування гірських порід за ізотопами Урану і Калію (вік Землі — близько 4,5 млрд років)."]}], "formulas": [{"f": "N = N₀ / 2ⁿ, n = t/T", "d": "закон радіоактивного розпаду: N₀ — початкова кількість ядер, N — кількість нерозпалих ядер через час t, T — період піврозпаду"}, {"f": "ΔN = N₀ − N", "d": "кількість ядер, що розпалися"}, {"f": "A = λN", "d": "A — активність (Бк), λ — стала радіоактивного розпаду (с⁻¹), N — кількість радіоактивних ядер"}, {"f": "λ ≈ 0,69 / T", "d": "зв’язок сталої розпаду з періодом піврозпаду (T — у секундах)"}, {"f": "A = A₀ / 2ⁿ", "d": "зменшення активності з часом; A₀ — початкова активність"}], "terms": [["Період піврозпаду", "час, за який розпадається половина наявної кількості радіоактивних ядер."], ["Активність", "фізична величина, що дорівнює кількості розпадів ядер за одиницю часу."], ["Бекерель", "одиниця активності в СІ, що дорівнює одному розпаду за секунду."], ["Стала радіоактивного розпаду", "величина, що характеризує ймовірність розпаду ядра за одиницю часу."], ["Мічені атоми", "радіоактивні ізотопи, які додають до речовини, щоб за їхнім випромінюванням простежити її рух і перетворення."], ["Радіовуглецевий метод", "спосіб визначення віку органічних решток за вмістом у них радіоактивного ізотопу ¹⁴C."]], "examples": [{"q": "Пацієнтові ввели препарат, що містить 80 мг ізотопу ¹³¹I (T = 8 діб). Скільки цього ізотопу залишиться через 24 доби?", "s": ["Дано: m₀ = 80 мг; T = 8 діб; t = 24 доби.", "Розв’язання: n = t/T = 24/8 = 3. Маса нерозпалого ізотопу пропорційна кількості ядер: m = m₀/2ⁿ = 80 мг / 2³ = 80/8 = 10 мг.", "Відповідь: 10 мг."]}, {"q": "Активність зразка ізотопу ¹³⁷Cs (T = 30 років) становить 4·10⁴ Бк. Якою вона буде через 90 років?", "s": ["Дано: A₀ = 4·10⁴ Бк; T = 30 років; t = 90 років.", "Розв’язання: n = 90/30 = 3; A = A₀/2³ = 4·10⁴ / 8 = 5·10³ Бк.", "Відповідь: 5·10³ Бк."]}], "lab": null, "f": "Вік «крижаної людини» Еці, тіло якої 1991 року знайшли в Альпах, визначили радіовуглецевим методом: він жив понад 5000 років тому.", "pr": ["Побудуйте графік залежності N від t для N₀ = 1000 ядер і T = 2 год (точки t = 0, 2, 4, 6, 8, 10 год). Опишіть форму графіка.", "Підготуйте коротке повідомлення (6–8 речень) про одне із застосувань радіоактивних ізотопів: у медицині, археології, промисловості або сільському господарстві."], "qz": [{"q": "Що таке період піврозпаду?", "o": ["Час, за який розпадаються всі ядра", "Час, за який розпадається половина наявних ядер", "Час одного розпаду", "Половина часу життя ядра"], "a": 1, "why": "За період піврозпаду кількість радіоактивних ядер зменшується вдвічі."}, {"q": "Яка одиниця активності в СІ?", "o": ["Грей", "Зіверт", "Бекерель", "Кюрі"], "a": 2, "why": "1 Бк = 1 розпад за секунду."}, {"q": "Яка частка ядер залишиться через три періоди піврозпаду?", "o": ["1/8", "1/3", "1/6", "1/9"], "a": 0, "why": "N/N₀ = 1/2³ = 1/8."}, {"q": "Від чого залежить період піврозпаду ізотопу?", "o": ["Від температури", "Від тиску", "Від маси зразка", "Лише від виду ізотопу"], "a": 3, "why": "T — характеристика ядра, на нього не впливають зовнішні умови."}, {"q": "Активність зразка 800 Бк, T = 1 год. Якою буде активність через 2 год?", "o": ["400 Бк", "200 Бк", "100 Бк", "0 Бк"], "a": 1, "why": "n = 2, A = 800/4 = 200 Бк."}, {"q": "Який ізотоп використовують для визначення віку археологічних знахідок органічного походження?", "o": ["¹⁴C", "⁶⁰Co", "¹³¹I", "²⁴¹Am"], "a": 0, "why": "Радіовуглецевий метод ґрунтується на розпаді ¹⁴C."}, {"q": "Для чого в медицині використовують γ-випромінювання ⁶⁰Co?", "o": ["Для вимірювання температури", "Для виготовлення ліків", "Для променевої терапії пухлин", "Для лікування застуди"], "a": 2, "why": "Потужне γ-випромінювання ⁶⁰Co руйнує клітини пухлини."}, {"q": "У двох зразках однакова кількість ядер. У якого ізотопу більша активність?", "o": ["У того, в якого більший T", "Активності однакові", "Залежить від температури", "У того, в якого менший T"], "a": 3, "why": "A = λN, а λ ≈ 0,69/T — що менший T, то більша λ."}]}, {"n": "78", "type": "problems", "t": "Розв’язування задач", "gr": "ГР3", "g": "Навчитися застосовувати закон радіоактивного розпаду та формулу активності для розрахункових задач.", "blocks": [{"h": "Як розв’язувати задачі на закон радіоактивного розпаду", "p": ["Більшість шкільних задач цієї теми зводяться до однієї ідеї: за кожен період піврозпаду кількість ядер, маса радіоактивної речовини і її активність зменшуються вдвічі. Тому спочатку завжди знаходимо, скільки періодів піврозпаду минуло: n = t/T.", "Якщо треба знайти T чи t, визначте, у скільки разів зменшилася величина: зменшення у 2, 4, 8, 16, 32 рази відповідає n = 1, 2, 3, 4, 5. Для задач з λ час обов’язково переводьте в секунди."], "ul": ["N = N₀/2ⁿ; m = m₀/2ⁿ; A = A₀/2ⁿ, де n = t/T.", "Розпалося: ΔN = N₀ − N; частка розпалих ядер: 1 − 1/2ⁿ.", "A = λN, λ ≈ 0,69/T.", "1 доба = 86 400 с; 1 рік ≈ 3,15·10⁷ с.", "Перевірка: залишок завжди менший за початкову кількість, а розпалі й нерозпалі ядра разом дають N₀."]}], "formulas": [{"f": "N = N₀ / 2ⁿ, n = t/T", "d": "закон радіоактивного розпаду"}, {"f": "m = m₀ / 2ⁿ", "d": "маса нерозпалої радіоактивної речовини"}, {"f": "ΔN = N₀ − N = N₀(1 − 1/2ⁿ)", "d": "кількість ядер, що розпалися"}, {"f": "A = λN", "d": "активність"}, {"f": "λ ≈ 0,69 / T", "d": "стала радіоактивного розпаду"}, {"f": "A = A₀ / 2ⁿ", "d": "зміна активності з часом"}], "terms": [], "examples": [{"q": "У зразку 8·10⁸ ядер Радону ²²²Rn (T = 3,8 доби). Скільки ядер залишиться і скільки розпадеться через 11,4 доби?", "s": ["Дано: N₀ = 8·10⁸; T = 3,8 доби; t = 11,4 доби.", "Розв’язання: n = t/T = 11,4/3,8 = 3. N = N₀/2³ = 8·10⁸/8 = 1·10⁸. ΔN = N₀ − N = 8·10⁸ − 1·10⁸ = 7·10⁸.", "Відповідь: залишиться 1·10⁸ ядер, розпадеться 7·10⁸ ядер."]}, {"q": "За 6 год активність радіоактивного препарату зменшилася в 4 рази. Визначте період піврозпаду.", "s": ["Дано: t = 6 год; A₀/A = 4.", "Розв’язання: A₀/A = 2ⁿ = 4, отже n = 2. T = t/n = 6 год / 2 = 3 год.", "Відповідь: T = 3 год."]}, {"q": "Який відсоток ядер радіоактивного ізотопу розпадеться за час, що дорівнює трьом періодам піврозпаду?", "s": ["Дано: t = 3T.", "Розв’язання: n = 3; залишиться N/N₀ = 1/2³ = 1/8 = 12,5 %. Розпадеться 100 % − 12,5 % = 87,5 %.", "Відповідь: 87,5 %."]}, {"q": "Визначте активність препарату, який містить 2·10¹⁵ ядер ¹³¹I (T = 8 діб).", "s": ["Дано: N = 2·10¹⁵; T = 8 діб.", "СІ: T = 8 · 86 400 с = 691 200 с ≈ 6,9·10⁵ с.", "Розв’язання: λ ≈ 0,69/T = 0,69 / 6,9·10⁵ с ≈ 1,0·10⁻⁶ с⁻¹. A = λN = 1,0·10⁻⁶ с⁻¹ · 2·10¹⁵ = 2·10⁹ Бк.", "Відповідь: A ≈ 2·10⁹ Бк."]}, {"q": "Активність ¹⁴C у шматку деревини з давнього поселення в 4 рази менша, ніж у свіжої деревини такої самої маси. Скільки років знахідці (T = 5730 років)?", "s": ["Дано: A₀/A = 4; T = 5730 років.", "Розв’язання: 2ⁿ = 4, n = 2. t = nT = 2 · 5730 = 11 460 років.", "Відповідь: приблизно 11 500 років."]}], "lab": null, "f": "", "pr": ["Період піврозпаду ⁶⁰Co — 5,3 року. Яка частка ядер залишиться через 15,9 року? (1/8, тобто 12,5 %)", "Активність препарату 6,4·10⁶ Бк. Якою вона стане через п’ять періодів піврозпаду? (2·10⁵ Бк)", "За 30 діб розпалося 75 % ядер радіоактивного ізотопу. Визначте період піврозпаду. (15 діб)", "Зразок містить 4·10¹⁸ радіоактивних ядер, стала розпаду 5·10⁻⁸ с⁻¹. Обчисліть активність зразка. (2·10¹¹ Бк)"], "qz": [{"q": "T = 2 доби. Скільки ядер з 1600 залишиться через 8 діб?", "o": ["400", "200", "800", "100"], "a": 3, "why": "n = 8/2 = 4; 1600/16 = 100."}, {"q": "Маса ізотопу зменшилася з 64 г до 8 г за 15 год. Чому дорівнює T?", "o": ["5 год", "3 год", "7,5 год", "2 год"], "a": 0, "why": "64/8 = 8 = 2³, n = 3; T = 15/3 = 5 год."}, {"q": "Яка частка ядер розпадеться за два періоди піврозпаду?", "o": ["1/4", "1/2", "3/4", "Усі"], "a": 2, "why": "Залишиться 1/4, отже, розпадеться 3/4."}, {"q": "Чи можна передбачити, коли розпадеться конкретне ядро?", "o": ["Так, через один період піврозпаду", "Ні, розпад окремого ядра — випадкова подія", "Так, через два періоди піврозпаду", "Так, якщо нагріти зразок"], "a": 1, "why": "Закон розпаду статистичний і описує лише велику кількість ядер."}, {"q": "N = 10²⁰, λ = 10⁻¹⁰ с⁻¹. Яка активність?", "o": ["10¹⁰ Бк", "10³⁰ Бк", "10⁻¹⁰ Бк", "10¹⁰ Кі"], "a": 0, "why": "A = λN = 10⁻¹⁰ · 10²⁰ = 10¹⁰ Бк."}, {"q": "Активність зменшилася у 32 рази. Скільки періодів піврозпаду минуло?", "o": ["4", "16", "32", "5"], "a": 3, "why": "32 = 2⁵, n = 5."}, {"q": "Початкова активність 1200 Бк, T = 10 хв. Якою буде активність через 30 хв?", "o": ["400 Бк", "300 Бк", "150 Бк", "600 Бк"], "a": 2, "why": "n = 3; 1200/8 = 150 Бк."}, {"q": "Як зміниться активність зразка, якщо взяти вдвічі більшу масу того самого ізотопу?", "o": ["Не зміниться", "Збільшиться вдвічі", "Зменшиться вдвічі", "Збільшиться вчетверо"], "a": 1, "why": "A = λN, а кількість ядер N пропорційна масі."}]}, {"n": "79", "type": "theory", "t": "Дія радіоактивного випромінювання. Природний радіоактивний фон", "gr": "ГР2, ГР3", "g": "З’ясувати, як йонізувальне випромінювання діє на живі організми, якими величинами оцінюють цю дію, з чого складається природний радіаційний фон і як захиститися від опромінення.", "blocks": [{"h": "Як випромінювання діє на живі організми", "p": ["Проходячи крізь тканини, радіоактивне випромінювання йонізує атоми і молекули: вибиває з них електрони, руйнує хімічні зв’язки. Найнебезпечніше — пошкодження молекул ДНК, які зберігають спадкову інформацію клітини.", "Невеликі пошкодження організм здатен відновлювати. Але великі дози спричиняють загибель клітин і променеву хворобу, а навіть помірні — підвищують ризик ракових захворювань і генетичних змін у нащадків. Найчутливіші до опромінення клітини, що швидко діляться: кровотворні, клітини слизових оболонок, статеві клітини, а також організм дитини."], "ul": ["Соматичні наслідки проявляються в самої опроміненої людини (променева хвороба, опіки, пухлини).", "Генетичні наслідки можуть проявитися в наступних поколіннях.", "Зовнішнє опромінення — джерело поза тілом; найнебезпечніші γ-промені.", "Внутрішнє опромінення — радіоактивні речовини потрапили в організм з повітрям, водою, їжею; тут особливо шкідливі α-частинки.", "Ступінь шкоди залежить від дози, виду випромінювання, тривалості опромінення і того, які органи опромінено."]}, {"h": "Дозиметричні величини", "p": ["Поглинута доза D показує, яку енергію випромінювання поглинув кожен кілограм речовини: D = W/m. Її одиниця — грей (Гр): 1 Гр = 1 Дж/кг.", "Однакова поглинута доза різних видів випромінювання завдає різної шкоди. Тому вводять еквівалентну дозу H = K·D, де K — коефіцієнт якості випромінювання. Одиниця еквівалентної дози — зіверт (Зв). На практиці частіше користуються мілізівертами (1 мЗв = 10⁻³ Зв) і мікрозівертами (1 мкЗв = 10⁻⁶ Зв)."], "ul": ["K = 1 для γ-, β- і рентгенівського випромінювання.", "K = 20 для α-випромінювання.", "K = 5–20 для нейтронів (залежно від їхньої енергії).", "Потужність дози — доза за одиницю часу; радіаційний фон зазвичай подають у мкЗв/год.", "Прилади для вимірювання доз і потужності доз називають дозиметрами."]}, {"h": "Природний радіаційний фон", "p": ["Ми постійно перебуваємо під дією слабкого йонізувального випромінювання, яке існувало на Землі завжди. Це природний радіаційний фон. У середньому він дає людині близько 2–3 мЗв на рік; потужність дози на відкритій місцевості в Україні зазвичай становить 0,1–0,2 мкЗв/год.", "До природних джерел додаються штучні: медичні обстеження (рентген, комп’ютерна томографія), наслідки ядерних випробувань і аварій. Після аварії на Чорнобильській АЕС 1986 року радіоактивного забруднення зазнали значні території України, зокрема північні райони Рівненщини."], "ul": ["Космічне випромінювання — зростає з висотою: у горах і під час авіаперельотів доза більша.", "Земне випромінювання — від Урану, Торію, Калію-40 у ґрунті та будівельних матеріалах.", "Радон — радіоактивний газ, що виходить з ґрунту й може накопичуватися в підвалах і непровітрюваних приміщеннях; він дає найбільшу частку природного опромінення.", "Внутрішнє опромінення від ізотопів ⁴⁰K і ¹⁴C, які є в кожному організмі.", "Для населення додаткове опромінення понад природний фон обмежують 1 мЗв на рік."]}, {"h": "Як захиститися від опромінення", "p": ["Існує три головні способи захисту від зовнішнього опромінення: часом (менше перебувати поблизу джерела), відстанню (що далі від джерела, то менша доза) і екранами (свинець, бетон, ґрунт, вода).", "Щоб уникнути внутрішнього опромінення, важливо не допускати потрапляння радіоактивних речовин в організм. Це особливо актуально для регіонів, які постраждали від Чорнобильської аварії."], "ul": ["Регулярно провітрюйте приміщення, особливо підвальні та перші поверхи — так зменшується концентрація радону.", "Не збирайте гриби та ягоди в зонах радіоактивного забруднення і не купуйте їх на стихійних ринках.", "Користуйтеся перевіреними продуктами, які пройшли радіологічний контроль.", "Медичні рентгенівські обстеження проходьте лише за призначенням лікаря.", "У разі радіаційної аварії діяти за вказівками ДСНС: укриття в приміщенні, щільно зачинені вікна, захист органів дихання."]}], "formulas": [{"f": "D = W / m", "d": "D — поглинута доза (Гр), W — енергія випромінювання, поглинута тілом (Дж), m — маса тіла (кг)"}, {"f": "H = K·D", "d": "H — еквівалентна доза (Зв), K — коефіцієнт якості випромінювання"}, {"f": "P = H / t", "d": "P — потужність еквівалентної дози (наприклад, мкЗв/год), t — час опромінення"}, {"f": "H = P·t", "d": "доза, накопичена за час t за сталої потужності дози"}], "terms": [["Поглинута доза", "фізична величина, що дорівнює відношенню енергії йонізувального випромінювання, поглинутої речовиною, до маси цієї речовини."], ["Грей", "одиниця поглинутої дози в СІ: 1 Гр = 1 Дж/кг."], ["Еквівалентна доза", "поглинута доза, помножена на коефіцієнт якості випромінювання; характеризує біологічну дію опромінення."], ["Зіверт", "одиниця еквівалентної дози в СІ."], ["Коефіцієнт якості", "число, яке показує, у скільки разів певний вид випромінювання біологічно небезпечніший за γ-випромінювання за однакової поглинутої дози."], ["Природний радіаційний фон", "йонізувальне випромінювання від природних джерел — космосу, земних порід і радіоактивних ізотопів у повітрі, воді, їжі та організмі."], ["Дозиметр", "прилад для вимірювання дози або потужності дози йонізувального випромінювання."]], "examples": [{"q": "Тіло людини масою 60 кг поглинуло 0,03 Дж енергії γ-випромінювання. Визначте поглинуту та еквівалентну дози.", "s": ["Дано: m = 60 кг; W = 0,03 Дж; K = 1.", "Розв’язання: D = W/m = 0,03 Дж / 60 кг = 5·10⁻⁴ Гр = 0,5 мГр. H = K·D = 1 · 5·10⁻⁴ = 5·10⁻⁴ Зв = 0,5 мЗв.", "Відповідь: D = 0,5 мГр; H = 0,5 мЗв."]}, {"q": "Потужність дози зовнішнього γ-фону становить 0,15 мкЗв/год. Яку дозу людина отримає від цього джерела за рік?", "s": ["Дано: P = 0,15 мкЗв/год; t = 1 рік = 365 · 24 год = 8760 год.", "Розв’язання: H = P·t = 0,15 мкЗв/год · 8760 год ≈ 1314 мкЗв ≈ 1,3 мЗв.", "Відповідь: ≈ 1,3 мЗв (без урахування радону та внутрішнього опромінення)."]}], "lab": null, "f": "Банан містить природний радіоактивний ізотоп Калію ⁴⁰K. Фізики жартома запровадили «бананову еквівалентну дозу» — приблизно 0,1 мкЗв: щоб отримати річну норму природного фону, довелося б з’їсти кілька десятків тисяч бананів.", "pr": ["Складіть пам’ятку для родини «Як зменшити радіаційне навантаження вдома і в побуті» (6–8 порад).", "Обчисліть еквівалентну дозу, якщо тканина масою 2 кг поглинула 0,004 Дж енергії α-випромінювання. Порівняйте з дозою від γ-випромінювання тієї самої енергії."], "qz": [{"q": "Яка одиниця поглинутої дози в СІ?", "o": ["Зіверт", "Бекерель", "Грей", "Кюрі"], "a": 2, "why": "Поглинута доза вимірюється в греях: 1 Гр = 1 Дж/кг."}, {"q": "Чому дорівнює коефіцієнт якості α-випромінювання?", "o": ["1", "20", "5", "0"], "a": 1, "why": "α-частинки за однакової поглинутої дози у 20 разів небезпечніші за γ-промені."}, {"q": "Тіло масою 50 кг поглинуло 0,1 Дж енергії. Яка поглинута доза?", "o": ["2 мГр", "5 Гр", "0,5 мГр", "20 мГр"], "a": 0, "why": "D = 0,1/50 = 0,002 Гр = 2 мГр."}, {"q": "Яке природне джерело дає найбільшу частку опромінення людини?", "o": ["Космічні промені", "Банани", "Телефони", "Радон"], "a": 3, "why": "Радіоактивний газ радон з ґрунту дає найбільший внесок у природну дозу."}, {"q": "Що НЕ є способом захисту від зовнішнього опромінення?", "o": ["Збільшення відстані до джерела", "Скорочення часу перебування", "Нагрівання джерела", "Захисний екран"], "a": 2, "why": "Температура не впливає на радіоактивність; захищають час, відстань і екрани."}, {"q": "Поглинута доза α-випромінювання 1 мГр. Яка еквівалентна доза?", "o": ["20 мЗв", "1 мЗв", "0,05 мЗв", "2 мЗв"], "a": 0, "why": "H = K·D = 20 · 1 мГр = 20 мЗв."}, {"q": "Які клітини найчутливіші до опромінення?", "o": ["Клітини нігтів", "Клітини волосся, що вже випало", "Клітини, що швидко діляться (кровотворні, статеві)", "Усі клітини однаково чутливі"], "a": 2, "why": "Найуразливіші клітини, які активно діляться."}, {"q": "Яким приладом вимірюють потужність дози радіаційного фону?", "o": ["Амперметром", "Барометром", "Термометром", "Дозиметром"], "a": 3, "why": "Дози і потужність дози вимірюють дозиметром."}]}, {"n": "80", "type": "problems", "t": "Розв’язування задач", "gr": "ГР3", "g": "Навчитися обчислювати поглинуту й еквівалентну дози, потужність дози та оцінювати безпечний час перебування в зоні опромінення.", "blocks": [{"h": "Алгоритм розв’язування задач з дозиметрії", "p": ["У задачах цього типу важливо не плутати поглинуту дозу (у греях) з еквівалентною (у зівертах). Поглинута доза — це лише фізика: енергія на кілограм. Еквівалентна враховує ще й біологічну небезпеку виду випромінювання через коефіцієнт якості K.", "Якщо на тіло діє кілька видів випромінювання, еквівалентні дози від кожного обчислюють окремо, а потім додають."], "ul": ["Переведіть усе в СІ: масу — у кг, енергію — у Дж, префікси: м = 10⁻³, мк = 10⁻⁶.", "D = W/m → H = K·D (K: γ, β, рентген — 1; α — 20; для нейтронів K дається в умові).", "Для змішаного опромінення: H = K₁D₁ + K₂D₂ + …", "Для задач на час: H = P·t, звідси t = H/P (стежте, щоб одиниці часу в P і t збігалися).", "Оцінюйте результат: природний фон — близько 2–3 мЗв на рік, ліміт додаткового опромінення для населення — 1 мЗв на рік."]}], "formulas": [{"f": "D = W / m", "d": "поглинута доза, Гр = Дж/кг"}, {"f": "H = K·D", "d": "еквівалентна доза, Зв"}, {"f": "H = K₁D₁ + K₂D₂", "d": "еквівалентна доза змішаного опромінення"}, {"f": "P = H / t", "d": "потужність дози"}, {"f": "W = D·m", "d": "енергія, поглинута тілом"}], "terms": [], "examples": [{"q": "Людина масою 50 кг поглинула 0,6 Дж енергії рентгенівського випромінювання. Визначте поглинуту і еквівалентну дози.", "s": ["Дано: m = 50 кг; W = 0,6 Дж; K = 1.", "Розв’язання: D = W/m = 0,6/50 = 0,012 Гр = 12 мГр. H = K·D = 1 · 0,012 = 0,012 Зв = 12 мЗв.", "Відповідь: 12 мГр; 12 мЗв."]}, {"q": "Внаслідок потрапляння радону в легені тканина отримала поглинуту дозу α-випромінювання 2 мГр. Яка еквівалентна доза?", "s": ["Дано: D = 2 мГр = 2·10⁻³ Гр; K = 20.", "Розв’язання: H = K·D = 20 · 2·10⁻³ Гр = 4·10⁻² Зв = 40 мЗв.", "Відповідь: 40 мЗв."]}, {"q": "Працівник лабораторії отримав поглинуту дозу γ-випромінювання 1 мГр і нейтронного випромінювання 0,1 мГр (K = 10). Яка сумарна еквівалентна доза?", "s": ["Дано: D_γ = 1 мГр, K_γ = 1; D_n = 0,1 мГр, K_n = 10.", "Розв’язання: H = K_γ·D_γ + K_n·D_n = 1·1 мГр + 10·0,1 мГр = 1 мЗв + 1 мЗв = 2 мЗв.", "Відповідь: 2 мЗв."]}, {"q": "Потужність дози в приміщенні 0,2 мкЗв/год. За який час людина отримає тут дозу 1 мЗв?", "s": ["Дано: P = 0,2 мкЗв/год; H = 1 мЗв = 1000 мкЗв.", "Розв’язання: t = H/P = 1000 мкЗв / 0,2 мкЗв/год = 5000 год ≈ 208 діб.", "Відповідь: 5000 год, тобто приблизно 7 місяців."]}, {"q": "Людина масою 70 кг отримала еквівалентну дозу γ-випромінювання 20 мЗв. Яку енергію поглинуло її тіло? Порівняйте з енергією, потрібною для нагрівання склянки води (0,2 кг) на 1 °C (c = 4200 Дж/(кг·°C)).", "s": ["Дано: m = 70 кг; H = 20 мЗв = 0,02 Зв; K = 1; m_в = 0,2 кг; Δt = 1 °C.", "Розв’язання: D = H/K = 0,02 Гр. W = D·m = 0,02 · 70 = 1,4 Дж. Q = c·m_в·Δt = 4200 · 0,2 · 1 = 840 Дж. Q/W = 840/1,4 = 600.", "Відповідь: 1,4 Дж — у 600 разів менше, ніж потрібно, щоб нагріти склянку води на 1 °C. Шкода опромінення пов’язана не з нагріванням, а з йонізацією молекул."]}], "lab": null, "f": "", "pr": ["Тіло масою 80 кг поглинуло 0,016 Дж енергії γ-випромінювання. Визначте поглинуту дозу. (2·10⁻⁴ Гр = 0,2 мГр)", "Поглинута доза α-випромінювання становить 0,5 мГр. Обчисліть еквівалентну дозу. (10 мЗв)", "Потужність дози 0,12 мкЗв/год. Яку дозу людина отримає за 30 діб? (≈ 86 мкЗв)", "Скільки годин можна перебувати в зоні з потужністю дози 2,5 мкЗв/год, щоб отримати дозу не більше 1 мЗв? (400 год)"], "qz": [{"q": "Поглинута доза β-випромінювання 3 мГр. Яка еквівалентна доза?", "o": ["60 мЗв", "3 мЗв", "0,15 мЗв", "30 мЗв"], "a": 1, "why": "Для β-випромінювання K = 1, H = 3 мЗв."}, {"q": "Тканина масою 0,5 кг поглинула 0,001 Дж. Яка поглинута доза?", "o": ["0,5 мГр", "5 мГр", "2 мГр", "0,2 мГр"], "a": 2, "why": "D = 0,001/0,5 = 0,002 Гр = 2 мГр."}, {"q": "Що враховує еквівалентна доза порівняно з поглинутою?", "o": ["Біологічну небезпеку виду випромінювання", "Масу тіла", "Час опромінення", "Температуру тіла"], "a": 0, "why": "H = K·D, де K — коефіцієнт якості виду випромінювання."}, {"q": "Потужність дози 0,5 мкЗв/год. Яку дозу отримає людина за 10 год?", "o": ["0,05 мкЗв", "50 мкЗв", "20 мкЗв", "5 мкЗв"], "a": 3, "why": "H = P·t = 0,5 · 10 = 5 мкЗв."}, {"q": "Скільки мкЗв у 1 мЗв?", "o": ["10", "1000", "100", "1 000 000"], "a": 1, "why": "1 мЗв = 10⁻³ Зв = 10³ мкЗв."}, {"q": "α- і γ-випромінювання дали однакову поглинуту дозу. У скільки разів еквівалентна доза від α більша?", "o": ["У 20 разів", "Однакові", "У 2 рази", "У 10 разів"], "a": 0, "why": "K_α/K_γ = 20/1 = 20."}, {"q": "Тіло масою 60 кг отримало поглинуту дозу 0,01 Гр. Яку енергію воно поглинуло?", "o": ["6000 Дж", "0,6 мДж", "6 Дж", "0,6 Дж"], "a": 3, "why": "W = D·m = 0,01 · 60 = 0,6 Дж."}, {"q": "Чому навіть дуже мала поглинута енергія випромінювання може бути небезпечною?", "o": ["Бо вона сильно нагріває тіло", "Бо вона руйнує молекули, зокрема ДНК, через йонізацію", "Бо вона збільшує масу тіла", "Бо вона намагнічує кров"], "a": 1, "why": "Шкода спричинена йонізацією та руйнуванням важливих молекул, а не нагріванням."}]}, {"n": "81", "type": "theory", "t": "Поділ важких ядер. Ланцюгова ядерна реакція поділу. Ядерний реактор", "gr": "ГР2", "g": "З’ясувати, як відбувається поділ ядер Урану, за яких умов виникає ланцюгова реакція та як улаштований і працює ядерний реактор.", "blocks": [{"h": "Поділ ядер Урану", "p": ["1938 року німецькі хіміки Отто Ган і Фріц Штрассман, опромінюючи Уран нейтронами, виявили серед продуктів реакції Барій — елемент із середини періодичної системи. Ліза Мейтнер і Отто Фріш пояснили: ядро Урану, поглинувши нейтрон, розділилося на дві приблизно однакові частини.", "Механізм поділу зручно уявити за краплинною моделлю. Ядро ²³⁵U, захопивши нейтрон, збуджується, починає коливатися і витягується. Коли воно набуває форми «гантелі», сили електричного відштовхування переважають короткодійні ядерні сили, і ядро розривається на два уламки, які розлітаються з величезною швидкістю."], "ul": ["Приклад реакції: ²³⁵₉₂U + ¹₀n → ¹⁴¹₅₆Ba + ⁹²₃₆Kr + 3¹₀n.", "Під час кожного поділу вилітають 2–3 нові нейтрони.", "Під час поділу одного ядра ²³⁵U виділяється близько 200 МеВ енергії.", "Більша частина енергії — кінетична енергія уламків, яка в речовині перетворюється на внутрішню (речовина нагрівається).", "Уламки поділу радіоактивні — звідси небезпека відпрацьованого ядерного палива."]}, {"h": "Ланцюгова ядерна реакція", "p": ["Нейтрони, що вилетіли під час поділу, можуть спричинити поділ інших ядер, а ті — ще інших. Так виникає ланцюгова реакція. Її перебіг характеризує коефіцієнт розмноження нейтронів k — відношення кількості нейтронів у наступному поколінні до кількості в попередньому.", "Не кожен нейтрон спричиняє поділ: частина вилітає за межі шматка урану, частину поглинають домішки. Щоб реакція не згасла, маса урану має бути не меншою за критичну. Для чистого ²³⁵U у формі кулі критична маса становить близько 50 кг."], "ul": ["k < 1 — реакція згасає.", "k = 1 — реакція стаціонарна, кількість поділів за секунду стала (так працює реактор).", "k > 1 — реакція наростає лавиноподібно; неконтрольована реакція — ядерний вибух.", "Повільні (теплові) нейтрони значно ефективніше спричиняють поділ ²³⁵U, ніж швидкі.", "Природний уран містить менше 1 % ²³⁵U, тому для більшості реакторів його збагачують до кількох відсотків."]}, {"h": "Будова ядерного реактора", "p": ["Ядерний реактор — пристрій, у якому підтримується керована ланцюгова реакція поділу. Перший реактор запустила група Енріко Фермі 1942 року в Чикаго.", "В Україні працюють водо-водяні енергетичні реактори (ВВЕР): у них звичайна вода є одночасно і сповільнювачем нейтронів, і теплоносієм."], "ul": ["Ядерне паливо — збагачений уран у вигляді таблеток у герметичних трубках (тепловидільних елементах, твелах).", "Сповільнювач (вода, графіт) — зменшує швидкість нейтронів, щоб вони ефективніше спричиняли поділ.", "Теплоносій (вода під високим тиском) — відводить теплоту з активної зони.", "Керувальні стрижні з Бору чи Кадмію — поглинають нейтрони; занурюючи або виводячи їх, регулюють k.", "Відбивач нейтронів і біологічний захист (товсті бетонні стіни) — зменшують втрати нейтронів і захищають людей від випромінювання."]}, {"h": "Як працює атомна електростанція", "p": ["Теплоносій першого контуру нагрівається в активній зоні реактора й передає теплоту воді другого контуру в парогенераторі. Вода другого контуру перетворюється на пару, яка обертає турбіну, з’єднану з електрогенератором. Відпрацьовану пару охолоджують і знову повертають у парогенератор.", "Контури розділені, тому радіоактивна вода першого контуру не потрапляє до турбіни. Через обмеження теплових машин лише близько третини теплоти перетворюється на електроенергію."], "ul": ["Ланцюжок перетворень: ядерна енергія → внутрішня енергія теплоносія → енергія пари → механічна енергія турбіни → електрична енергія.", "Типовий енергоблок ВВЕР-1000 має електричну потужність 1000 МВт за теплової близько 3000 МВт.", "Для охолодження пари використовують градирні або водойми-охолоджувачі.", "Безпеку забезпечують кілька бар’єрів: паливна таблетка, оболонка твела, корпус реактора, захисна оболонка (контейнмент).", "Автоматичний захист у разі небезпеки швидко вводить у зону всі керувальні стрижні й зупиняє реакцію."]}], "formulas": [{"f": "²³⁵₉₂U + ¹₀n → ¹⁴¹₅₆Ba + ⁹²₃₆Kr + 3¹₀n", "d": "один із можливих варіантів поділу ядра Урану-235"}, {"f": "k = N_i / N_(i−1)", "d": "коефіцієнт розмноження нейтронів: N_i — кількість нейтронів у поколінні i"}, {"f": "E = N·E₁", "d": "E — енергія, що виділяється під час поділу N ядер, E₁ ≈ 200 МеВ — енергія поділу одного ядра ²³⁵U"}, {"f": "N = (m / M)·N_A", "d": "кількість ядер у зразку масою m; M — молярна маса (для ²³⁵U — 0,235 кг/моль), N_A = 6,02·10²³ моль⁻¹"}, {"f": "Q = qm", "d": "теплота згоряння палива — для порівняння з ядерним паливом; q — питома теплота згоряння"}], "terms": [["Поділ ядра", "ядерна реакція, під час якої важке ядро, захопивши нейтрон, розпадається на два уламки середньої маси з випромінюванням кількох нейтронів."], ["Ланцюгова ядерна реакція", "реакція поділу, у якій нейтрони, що вилетіли з одних ядер, спричиняють поділ інших ядер."], ["Коефіцієнт розмноження нейтронів", "відношення кількості нейтронів наступного покоління до кількості нейтронів попереднього."], ["Критична маса", "найменша маса ядерного палива, за якої можлива самопідтримувана ланцюгова реакція."], ["Ядерний реактор", "установка, у якій здійснюється керована ланцюгова ядерна реакція поділу."], ["Сповільнювач нейтронів", "речовина, що зменшує швидкість нейтронів, не поглинаючи їх (вода, графіт)."], ["Керувальні стрижні", "стрижні з речовини, яка добре поглинає нейтрони; ними регулюють швидкість ланцюгової реакції."]], "examples": [{"q": "Яка енергія виділиться під час поділу всіх ядер в 1 г Урану-235? Скільки кам’яного вугілля (q = 2,7·10⁷ Дж/кг) треба спалити, щоб отримати таку саму енергію?", "s": ["Дано: m = 1 г = 10⁻³ кг; M = 0,235 кг/моль; N_A = 6,02·10²³ моль⁻¹; E₁ = 200 МеВ; q = 2,7·10⁷ Дж/кг.", "СІ: E₁ = 200 · 1,6·10⁻¹³ Дж = 3,2·10⁻¹¹ Дж.", "Розв’язання: N = (m/M)·N_A = (10⁻³ / 0,235) · 6,02·10²³ ≈ 2,56·10²¹. E = N·E₁ = 2,56·10²¹ · 3,2·10⁻¹¹ ≈ 8,2·10¹⁰ Дж. m_в = E/q = 8,2·10¹⁰ / 2,7·10⁷ ≈ 3000 кг.", "Відповідь: ≈ 8,2·10¹⁰ Дж; це енергія згоряння приблизно 3 т вугілля."]}, {"q": "Скільки нейтронів утворюється в реакції ²³⁵₉₂U + ¹₀n → ¹⁴⁰₅₄Xe + ⁹⁴₃₈Sr + x¹₀n?", "s": ["Дано: рівняння реакції з невідомою кількістю нейтронів x.", "Розв’язання: зарядові числа: 92 + 0 = 54 + 38 = 92 — збігаються. Масові числа: 235 + 1 = 140 + 94 + x, звідси x = 236 − 234 = 2.", "Відповідь: 2 нейтрони."]}], "lab": null, "f": "Приблизно два мільярди років тому в районі Окло (Габон, Африка) в покладах урану самочинно діяли природні ядерні реактори: ланцюгова реакція там то запускалася, то згасала сотні тисяч років.", "pr": ["Намалюйте спрощену схему двоконтурної АЕС і підпишіть: реактор, керувальні стрижні, парогенератор, турбіна, генератор, конденсатор. Стрілками покажіть рух теплоносія і пари.", "Поясніть письмово, чим відрізняється ланцюгова реакція в ядерному реакторі від реакції в атомній бомбі (значення k, керованість, швидкість виділення енергії)."], "qz": [{"q": "Що відбувається з ядром ²³⁵U після захоплення нейтрона?", "o": ["Воно перетворюється на ядро Гелію", "Воно ділиться на два уламки й кілька нейтронів", "Воно випромінює лише γ-квант", "З ним нічого не відбувається"], "a": 1, "why": "Збуджене ядро Урану ділиться на два уламки середньої маси та 2–3 нейтрони."}, {"q": "Яка приблизна енергія виділяється під час поділу одного ядра ²³⁵U?", "o": ["2 еВ", "20 кеВ", "200 МеВ", "2 Дж"], "a": 2, "why": "Енергія поділу ядра ²³⁵U — близько 200 МеВ."}, {"q": "За якого коефіцієнта розмноження нейтронів працює реактор у сталому режимі?", "o": ["k = 1", "k = 0", "k < 1", "k = 3"], "a": 0, "why": "За k = 1 кількість поділів за секунду не змінюється."}, {"q": "Для чого в реакторі керувальні стрижні?", "o": ["Для сповільнення нейтронів", "Для відведення теплоти", "Для виробництва пари", "Для поглинання нейтронів і регулювання реакції"], "a": 3, "why": "Стрижні з Бору чи Кадмію поглинають нейтрони й змінюють k."}, {"q": "Яку роль у реакторі ВВЕР виконує вода?", "o": ["Лише охолоджує турбіну", "Сповільнювача і теплоносія", "Палива", "Поглинача нейтронів"], "a": 1, "why": "У ВВЕР вода і сповільнює нейтрони, і відводить теплоту."}, {"q": "Що таке критична маса?", "o": ["Маса, за якої ядро ділиться", "Маса одного ядра Урану", "Найменша маса палива, за якої можлива ланцюгова реакція", "Маса реактора"], "a": 2, "why": "Якщо маса менша за критичну, забагато нейтронів вилітає назовні і реакція згасає."}, {"q": "Які нейтрони найефективніше спричиняють поділ ядер ²³⁵U?", "o": ["Повільні (теплові)", "Дуже швидкі", "Нейтрони не спричиняють поділу", "Будь-які однаково"], "a": 0, "why": "Тому в реакторах використовують сповільнювачі."}, {"q": "Яке перетворення енергії відбувається в генераторі АЕС?", "o": ["Ядерна → внутрішня", "Внутрішня → механічна", "Електрична → механічна", "Механічна → електрична"], "a": 3, "why": "Генератор перетворює механічну енергію обертання турбіни на електричну."}]}, {"n": "82", "type": "problems", "t": "Розв’язування задач", "gr": "ГР3", "g": "Навчитися розв’язувати задачі на ядерні реакції поділу, енергію поділу, витрату ядерного палива та ККД атомних електростанцій.", "blocks": [{"h": "Алгоритм розв’язування задач на поділ ядер", "p": ["Задачі цього уроку поєднують кілька тем: закони збереження в ядерних реакціях, кількість речовини з хімії, енергію і потужність з механіки, ККД з теплових машин. Головне — правильно знайти кількість ядер, що розділилися, і пам’ятати, що кожен поділ ядра ²³⁵U дає близько 200 МеВ.", "Енергію в МеВ обов’язково переводьте в джоулі, а час — у секунди."], "ul": ["Невідомий уламок або кількість нейтронів знаходимо із збереження масових і зарядових чисел.", "Кількість ядер: N = (m/M)·N_A; для ²³⁵U M = 0,235 кг/моль.", "Енергія: E = N·E₁, E₁ = 200 МеВ = 3,2·10⁻¹¹ Дж; повний поділ 1 г ²³⁵U дає ≈ 8,2·10¹⁰ Дж.", "Теплова енергія реактора за час t: Q = P_т·t; маса палива: m = Q / (8,2·10¹⁰ Дж/г).", "ККД АЕС: η = P_ел / P_т · 100 %.", "Кількість нейтронів через n поколінь: N_n = N₀·kⁿ."]}], "formulas": [{"f": "²³⁵₉₂U + ¹₀n → ᴬ¹_Z¹ X + ᴬ²_Z² Y + x¹₀n", "d": "загальний вигляд реакції поділу; 236 = A₁ + A₂ + x, 92 = Z₁ + Z₂"}, {"f": "N = (m / M)·N_A", "d": "кількість ядер у зразку"}, {"f": "E = N·E₁", "d": "енергія поділу N ядер, E₁ ≈ 200 МеВ = 3,2·10⁻¹¹ Дж"}, {"f": "Q = P·t", "d": "енергія, вироблена за час t за потужності P"}, {"f": "η = P_ел / P_т · 100 %", "d": "ККД атомної електростанції"}, {"f": "N_n = N₀·kⁿ", "d": "кількість нейтронів через n поколінь за коефіцієнта розмноження k"}], "terms": [], "examples": [{"q": "Визначте невідомий уламок у реакції ²³⁵₉₂U + ¹₀n → ¹³⁹₅₆Ba + X + 3¹₀n.", "s": ["Дано: рівняння реакції з невідомим ядром ᴬ_Z X.", "Розв’язання: масові числа: 235 + 1 = 139 + A + 3, A = 94. Зарядові числа: 92 + 0 = 56 + Z + 0, Z = 36 — Криптон.", "Відповідь: ⁹⁴₃₆Kr."]}, {"q": "Яка енергія виділяється під час поділу 5·10²⁰ ядер Урану-235?", "s": ["Дано: N = 5·10²⁰; E₁ = 200 МеВ.", "СІ: E₁ = 3,2·10⁻¹¹ Дж.", "Розв’язання: E = N·E₁ = 5·10²⁰ · 3,2·10⁻¹¹ Дж = 1,6·10¹⁰ Дж.", "Відповідь: 1,6·10¹⁰ Дж."]}, {"q": "Теплова потужність реактора ВВЕР-1000 становить 3000 МВт. Скільки Урану-235 витрачається за добу?", "s": ["Дано: P_т = 3000 МВт; t = 1 доба; енергія поділу 1 г ²³⁵U — 8,2·10¹⁰ Дж.", "СІ: P_т = 3·10⁹ Вт; t = 86 400 с.", "Розв’язання: Q = P_т·t = 3·10⁹ · 86 400 ≈ 2,6·10¹⁴ Дж. m = Q / (8,2·10¹⁰ Дж/г) ≈ 3,2·10³ г.", "Відповідь: ≈ 3,2 кг Урану-235 за добу."]}, {"q": "Електрична потужність енергоблока АЕС 1000 МВт, теплова потужність реактора 3000 МВт. Визначте ККД енергоблока.", "s": ["Дано: P_ел = 1000 МВт; P_т = 3000 МВт.", "Розв’язання: η = P_ел / P_т · 100 % = 1000/3000 · 100 % ≈ 33 %.", "Відповідь: ≈ 33 %."]}, {"q": "У початковому поколінні 100 нейтронів, коефіцієнт розмноження k = 1,05. Скільки нейтронів буде через 3 покоління? Що відбуватиметься з реакцією, якщо стрижні не опустити?", "s": ["Дано: N₀ = 100; k = 1,05; n = 3.", "Розв’язання: N₃ = N₀·k³ = 100 · 1,05³ ≈ 100 · 1,158 ≈ 116. Оскільки k > 1, кількість нейтронів, а отже й поділів, постійно зростає — потужність реактора збільшується.", "Відповідь: ≈ 116 нейтронів; реакція наростатиме, тому автоматика має ввести стрижні й повернути k = 1."]}], "lab": null, "f": "", "pr": ["Скільки нейтронів утворюється в реакції ²³⁵₉₂U + ¹₀n → ¹⁴⁴₅₆Ba + ⁸⁹₃₆Kr + x¹₀n? (3 нейтрони)", "Яка енергія виділиться під час повного поділу ядер у 2 г Урану-235? (≈ 1,6·10¹¹ Дж)", "Теплова потужність реактора 1500 МВт. Скільки Урану-235 він витрачає за добу? (≈ 1,6 кг)", "Електрична потужність енергоблока 950 МВт, теплова — 3000 МВт. Визначте ККД. (≈ 32 %)"], "qz": [{"q": "Визначте Z уламка X у реакції ²³⁵₉₂U + ¹₀n → ¹⁴²₅₅Cs + X + 2¹₀n.", "o": ["37", "35", "92", "55"], "a": 0, "why": "Z = 92 − 55 = 37 (Рубідій)."}, {"q": "Визначте A уламка X у тій самій реакції ²³⁵₉₂U + ¹₀n → ¹⁴²₅₅Cs + X + 2¹₀n.", "o": ["94", "92", "90", "93"], "a": 2, "why": "A = 236 − 142 − 2 = 92."}, {"q": "Скільки джоулів виділяється під час поділу 10²⁰ ядер ²³⁵U (E₁ = 3,2·10⁻¹¹ Дж)?", "o": ["3,2·10⁻⁹ Дж", "3,2·10⁹ Дж", "3,2·10³¹ Дж", "3,2·10²⁰ Дж"], "a": 1, "why": "E = 10²⁰ · 3,2·10⁻¹¹ = 3,2·10⁹ Дж."}, {"q": "Реактор тепловою потужністю 1000 МВт працює 1000 с. Скільки теплоти він виділяє?", "o": ["10⁶ Дж", "10⁹ Дж", "10¹⁵ Дж", "10¹² Дж"], "a": 3, "why": "Q = P·t = 10⁹ Вт · 10³ с = 10¹² Дж."}, {"q": "Теплова потужність 2000 МВт, електрична — 600 МВт. Який ККД АЕС?", "o": ["30 %", "60 %", "33 %", "20 %"], "a": 0, "why": "η = 600/2000 · 100 % = 30 %."}, {"q": "У скільки разів більше енергії дає поділ 1 г ²³⁵U, ніж згоряння 1 г вугілля (8,2·10¹⁰ Дж проти 2,7·10⁴ Дж)?", "o": ["Приблизно в 30 разів", "Приблизно в 3 тис. разів", "Приблизно в 3 млн разів", "Однаково"], "a": 2, "why": "8,2·10¹⁰ / 2,7·10⁴ ≈ 3·10⁶."}, {"q": "k = 2, початково 1 нейтрон. Скільки нейтронів у 10-му поколінні?", "o": ["20", "1024", "100", "10"], "a": 1, "why": "N = 2¹⁰ = 1024 — так наростає неконтрольована реакція."}, {"q": "Що відбуватиметься з потужністю реактора, якщо k стане 0,98?", "o": ["Зростатиме", "Залишиться сталою", "Реактор вибухне", "Поступово зменшуватиметься"], "a": 3, "why": "За k < 1 кількість нейтронів у кожному поколінні меншає, реакція згасає."}]}, {"n": "83", "type": "theory", "t": "Ядерний цикл. Атомна енергетика України", "gr": "ГР2", "g": "Ознайомитися з етапами ядерного паливного циклу, атомними електростанціями України, перевагами й ризиками атомної енергетики.", "blocks": [{"h": "Ядерний паливний цикл", "p": ["Ядерне паливо проходить довгий шлях від руди до сховища. Усю цю послідовність етапів називають ядерним паливним циклом. Він починається з видобування уранової руди: Україна має власні поклади урану, зокрема на Кіровоградщині.", "Після використання в реакторі паливо стає дуже радіоактивним і ще довго виділяє теплоту. Тому кінцеві етапи циклу — найвідповідальніші: відпрацьоване паливо треба надійно ізолювати від людей і довкілля на дуже тривалий час."], "ul": ["Видобування уранової руди і виготовлення уранового концентрату.", "Збагачення — підвищення частки ²³⁵U з 0,7 % до кількох відсотків.", "Виготовлення паливних таблеток, твелів і тепловидільних збірок (ТВЗ).", "Використання палива в реакторі (зазвичай кілька років).", "Витримування відпрацьованого палива в басейнах біля реактора, доки не зменшиться його активність і тепловиділення.", "Тривале зберігання (в Україні — централізоване сховище відпрацьованого ядерного палива в Чорнобильській зоні відчуження) або переробка й захоронення радіоактивних відходів."]}, {"h": "Атомні електростанції України", "p": ["В Україні чотири атомні електростанції, якими керує державна компанія «Енергоатом». До повномасштабного вторгнення Росії вони виробляли близько половини всієї електроенергії країни. В усіх енергоблоках працюють реактори типу ВВЕР.", "Для нашої області особливо важлива Рівненська АЕС у місті Вараш — найближча до Рівного атомна станція."], "ul": ["Запорізька АЕС (м. Енергодар) — найбільша атомна електростанція в Європі, 6 енергоблоків; з 2022 року окупована російськими військами, що створює загрозу ядерній безпеці.", "Рівненська АЕС (м. Вараш, Рівненська обл.) — 4 енергоблоки.", "Хмельницька АЕС (м. Неті
