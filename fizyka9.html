иляється то в один, то в інший бік"], "a": 2, "why": "Магнітний потік не змінюється — індукційного струму немає."}, {"q": "Як змінюється напрям індукційного струму, якщо магніт не вводити, а виймати з котушки?", "o": ["Змінюється на протилежний", "Не змінюється", "Струм зникає", "Струм стає постійним"], "a": 0, "why": "Потік спадає замість зростати, тому струм протилежний."}, {"q": "Як збільшити силу індукційного струму в цій роботі?", "o": ["Рухати магніт повільніше", "Тримати магніт нерухомо", "Рухати магніт швидше", "Взяти котушку з меншою кількістю витків"], "a": 2, "why": "Що швидше змінюється потік, то більший струм."}, {"q": "Чи виникне струм, якщо рухати котушку, а магніт тримати нерухомо?", "o": ["Ні, рухати треба лише магніт", "Так, важливий відносний рух", "Тільки якщо котушка мідна", "Тільки за наявності батарейки"], "a": 1, "why": "Потік змінюється за будь-якого відносного руху магніту і котушки."}, {"q": "Чому цю лабораторну роботу безпечно виконувати вдома?", "o": ["Бо магніт слабкий", "Бо котушка ізольована", "Бо прилади пластикові", "Бо в колі немає зовнішнього джерела напруги"], "a": 3, "why": "Струм створюється лише рухом магніту, він дуже малий."}, {"q": "У сусідній котушці тече сталий струм. Чи буде індукційний струм у котушці з міліамперметром?", "o": ["Ні", "Так, постійний", "Так, змінний", "Так, але лише в мідних котушках"], "a": 0, "why": "Сталий струм створює незмінний магнітний потік."}]}, {"n": "34", "type": "review", "t": "Узагальнення та систематизація знань", "gr": "ГР3", "g": "Узагальнити й систематизувати знання розділу «Магнітні та електромагнітні явища», повторити основні закони, правила, формули та типові помилки.", "blocks": [{"h": "Магнітне поле та його характеристики", "p": ["Магнітне поле — особлива форма матерії, яку створюють рухомі заряди (струми) і намагнічені тіла. Його силова характеристика — магнітна індукція B, вимірюється в теслах. Поле зображують лініями магнітної індукції, які завжди замкнені."], "ul": ["Однойменні полюси відштовхуються, різнойменні — притягуються.", "Дослід Ерстеда: струм створює магнітне поле.", "B = F_max/(Il); 1 Тл = 1 Н/(А·м).", "Поза магнітом лінії йдуть від N до S; густіші лінії — сильніше поле.", "Біля північного географічного полюса Землі — південний магнітний полюс."]}, {"h": "Магнітне поле струму", "p": ["Лінії поля прямого струму — концентричні кола навколо провідника; поле котушки подібне до поля смугового магніту. Напрям ліній визначають за правилом свердлика або правої руки."], "ul": ["Прямий провідник: великий палець правої руки — струм, зігнуті пальці — лінії.", "Котушка: зігнуті пальці — струм у витках, великий палець — північний полюс.", "⊗ — струм від нас (лінії за годинниковою стрілкою), ⊙ — до нас (проти).", "Поле котушки посилюють: більший струм, більше витків, залізне осердя."]}, {"h": "Сила Ампера та її застосування", "p": ["Магнітне поле діє на провідник зі струмом із силою Ампера F_A = BIl·sin α, напрям якої визначають за правилом лівої руки. На цьому ґрунтується робота електродвигунів, гучномовців, стрілкових вимірювальних приладів."], "ul": ["Правило лівої руки: лінії — у долоню, пальці — за струмом, великий палець — сила.", "F_A максимальна при α = 90° і дорівнює нулю при α = 0°.", "Рамка зі струмом обертається в полі; колектор забезпечує безперервне обертання.", "Електродвигун перетворює електричну енергію на механічну; η = P_кор/P_спож · 100 %."]}, {"h": "Магнітні властивості речовини. Електромагніти", "p": ["Речовини поділяють на діамагнетики (μ < 1), парамагнетики (μ > 1) і феромагнетики (μ ≫ 1). Ампер пояснив намагнічування молекулярними струмами. Котушка з феромагнітним осердям — електромагніт, магнітною дією якого легко керувати."], "ul": ["μ = B/B₀ — магнітна проникність.", "Феромагнетики: залізо, нікель, кобальт; вище від температури Кюрі втрачають феромагнетизм.", "Електромагніт: можна вмикати, вимикати, регулювати силу, змінювати полюси.", "Застосування: крани, реле, дзвінки, замки, сепаратори, МРТ, маглеви."]}, {"h": "Електромагнітна індукція та енергетика", "p": ["Змінний магнітний потік крізь замкнений контур створює в ньому індукційний струм (Фарадей, 1831). Це явище — основа індукційних генераторів, що виробляють електроенергію на ТЕС, АЕС, ГЕС і вітрових станціях."], "ul": ["Ф = BS·cos α; 1 Вб = 1 Тл·м².", "Струм виникає лише під час зміни потоку; сила струму зростає зі швидкістю зміни потоку і кількістю витків.", "Правило Ленца: індукційний струм протидіє зміні потоку, що його спричинила.", "Генератор: механічна енергія → електрична; частота мережі в Україні — 50 Гц.", "Відновлювальні джерела: Сонце, вітер, вода, тепло Землі, біомаса."]}, {"h": "Типові помилки", "p": ["Більшість помилок у цьому розділі пов’язані з плутаниною правил і кутів. Перевірте себе за цим списком перед підсумковою роботою."], "ul": ["Плутають руки: права — для напрямку поля струму, ліва — для напрямку сили Ампера.", "Для котушки великий палець показує поле (полюс N), а не струм.", "У формулі F_A = BIl·sin α беруть кут до площини, а не між провідником і лініями поля.", "Забувають перевести см у м, мТл у Тл, г у кг.", "Вважають, що нерухомий магніт у котушці створює струм.", "Плутають магнітні й географічні полюси Землі."]}], "formulas": [{"f": "B = F_max/(Il)", "d": "модуль магнітної індукції (Тл)"}, {"f": "F_A = BIl·sin α", "d": "сила Ампера (Н); α — кут між провідником і лініями поля"}, {"f": "μ = B/B₀", "d": "магнітна проникність речовини"}, {"f": "Ф = BS·cos α", "d": "магнітний потік (Вб); α — кут між B і нормаллю до контуру"}, {"f": "P = UI", "d": "електрична потужність (Вт)"}, {"f": "η = P_кор/P_спож · 100 %", "d": "ККД двигуна чи генератора"}, {"f": "I = U/R", "d": "закон Ома для ділянки кола"}], "terms": [["Магнітне поле", "особлива форма матерії, що існує навколо рухомих заряджених частинок і намагнічених тіл."], ["Магнітна індукція", "векторна силова характеристика магнітного поля, одиниця — тесла."], ["Лінії магнітної індукції", "уявні замкнені лінії, дотичні до яких збігаються з напрямком вектора B."], ["Правило свердлика", "якщо поступальний рух свердлика збігається з напрямком струму, напрям обертання його ручки збігається з напрямком ліній поля."], ["Сила Ампера", "сила, з якою магнітне поле діє на провідник зі струмом."], ["Феромагнетики", "речовини, що сильно намагнічуються і значно посилюють магнітне поле."], ["Електромагніт", "котушка зі струмом із феромагнітним осердям."], ["Електродвигун", "пристрій, що перетворює електричну енергію на механічну."], ["Електромагнітна індукція", "виникнення струму в замкненому контурі під час зміни магнітного потоку крізь нього."], ["Індукційний генератор", "пристрій, що перетворює механічну енергію на електричну завдяки електромагнітній індукції."]], "examples": [{"q": "Горизонтальний мідний провідник завдовжки 0,5 м і опором 0,2 Ом підвішено в горизонтальному однорідному магнітному полі з індукцією 0,4 Тл перпендикулярно до ліній. Провідник підключено до джерела напругою 0,6 В. Визначте силу Ампера і масу провідника, якщо сила Ампера, напрямлена вгору, повністю врівноважує силу тяжіння (g ≈ 10 Н/кг).", "s": ["Дано: l = 0,5 м, R = 0,2 Ом, B = 0,4 Тл, α = 90°, U = 0,6 В. Знайти: F_A, m.", "Розв’язання: сила струму I = U/R = 0,6 В / 0,2 Ом = 3 А.", "F_A = BIl·sin 90° = 0,4 · 3 · 0,5 = 0,6 Н.", "Рівновага: F_A = mg, отже m = F_A/g = 0,6 / 10 = 0,06 кг = 60 г.", "Відповідь: F_A = 0,6 Н; m = 60 г."]}, {"q": "Двигун підйомного механізму працює від напруги 220 В при силі струму 5 А і рівномірно піднімає вантаж масою 80 кг на висоту 10 м за 10 с. Визначте ККД двигуна (g ≈ 10 Н/кг).", "s": ["Дано: U = 220 В, I = 5 А, m = 80 кг, h = 10 м, t = 10 с. Знайти: η.", "Розв’язання: спожита потужність P_спож = UI = 220 · 5 = 1100 Вт.", "Корисна робота A_кор = mgh = 80 · 10 · 10 = 8000 Дж; корисна потужність P_кор = A_кор/t = 8000/10 = 800 Вт.", "η = P_кор/P_спож · 100 % = 800/1100 · 100 % ≈ 73 %.", "Відповідь: η ≈ 73 %."]}], "lab": null, "f": "", "pr": ["Складіть опорну схему (інтелект-карту) розділу «Магнітні та електромагнітні явища»: магнітне поле → поле струму → сила Ампера → магнітні властивості речовини → електромагнітна індукція → енергетика. Біля кожного вузла запишіть головну формулу або правило.", "Розв’яжіть задачу: провідник завдовжки 20 см зі струмом 5 А розташований під кутом 30° до ліній поля з індукцією 0,6 Тл. Знайдіть силу Ампера і поясніть, за якого кута вона буде вдвічі більшою. (0,3 Н; при 90°)"], "qz": [{"q": "Що є джерелом магнітного поля?", "o": ["Нерухомі заряди", "Рухомі заряди та намагнічені тіла", "Лише постійні магніти", "Будь-які нейтральні тіла"], "a": 1, "why": "Магнітне поле створюють струми і намагнічені тіла."}, {"q": "Яке правило використовують для визначення напрямку сили Ампера?", "o": ["Правило лівої руки", "Правило свердлика", "Правило правої руки", "Правило Ленца"], "a": 0, "why": "Напрям сили Ампера визначають лівою рукою."}, {"q": "B = 0,5 Тл, I = 4 А, l = 0,2 м, α = 90°. Яка сила Ампера?", "o": ["0,1 Н", "1 Н", "0,4 Н", "4 Н"], "a": 2, "why": "F = 0,5·4·0,2 = 0,4 Н."}, {"q": "Дивлячись на торець котушки, бачимо струм проти годинникової стрілки. Цей торець є…", "o": ["південним полюсом", "нейтральною зоною", "полюса немає", "північним полюсом"], "a": 3, "why": "Великий палець правої руки напрямлений на нас — це N."}, {"q": "Яка речовина — феромагнетик?", "o": ["Мідь", "Нікель", "Алюміній", "Вода"], "a": 1, "why": "Нікель сильно намагнічується."}, {"q": "Коли в котушці виникає індукційний струм?", "o": ["Коли змінюється магнітний потік крізь котушку", "Коли магніт нерухомий у котушці", "Коли котушку нагрівають", "Коли котушка мідна"], "a": 0, "why": "Причина індукційного струму — зміна магнітного потоку."}, {"q": "Магнітний потік крізь контур площею 0,1 м² у полі 0,3 Тл (лінії перпендикулярні до площини) дорівнює…", "o": ["3 Вб", "0,3 Вб", "0,003 Вб", "0,03 Вб"], "a": 3, "why": "Ф = BS = 0,3·0,1 = 0,03 Вб."}, {"q": "Що перетворює механічну енергію на електричну?", "o": ["Електродвигун", "Електромагніт", "Генератор", "Реле"], "a": 2, "why": "Генератор працює на основі електромагнітної індукції і виробляє електроенергію."}, {"q": "Що відбувається з феромагнетиком вище від температури Кюрі?", "o": ["Втрачає феромагнітні властивості", "Стає надпровідником", "Плавиться", "Намагнічується сильніше"], "a": 0, "why": "Нагрівання руйнує доменну структуру."}, {"q": "Двигун споживає 500 Вт, корисна потужність 400 Вт. Який ККД?", "o": ["125 %", "20 %", "40 %", "80 %"], "a": 3, "why": "η = 400/500·100 % = 80 %."}]}, {"n": "35", "type": "test", "t": "Комплексна підсумкова робота № 2 з теми «Магнітні та електромагнітні явища»", "gr": "ГР1, ГР2, ГР3", "g": "Підготуватися до комплексної підсумкової роботи та перевірити рівень засвоєння знань і вмінь з теми «Магнітні та електромагнітні явища».", "blocks": [{"h": "Що перевіряє підсумкова робота", "p": ["Робота перевіряє, чи розумієте ви основні поняття розділу, чи вмієте застосовувати правила для визначення напрямків і чи можете розв’язувати розрахункові задачі на магнітну індукцію, силу Ампера, магнітний потік і ККД."], "ul": ["Знання понять: магнітне поле, магнітна індукція, лінії поля, сила Ампера, магнітна проникність, електромагнітна індукція, магнітний потік.", "Уміння застосовувати правило свердлика, правило правої руки (для провідника і котушки) та правило лівої руки.", "Розуміння будови і принципу дії електромагніта, реле, електродвигуна, генератора.", "Уміння розв’язувати задачі за формулами розділу.", "Знання про промислові та відновлювальні джерела енергії."]}, {"h": "Структура роботи", "p": ["Робота складається із завдань різних типів і рівнів складності. Типова структура (точну кількість завдань визначає вчитель)."], "ul": ["Тестові завдання з вибором однієї правильної відповіді (поняття, одиниці, явища).", "Завдання на відповідність (наприклад, «величина — одиниця», «прилад — явище, на якому ґрунтується»).", "Якісні завдання на визначення напрямку ліній поля, полюсів котушки, сили Ампера.", "Розрахункові задачі: B = F_max/(Il), F_A = BIl·sin α, μ = B/B₀, Ф = BS·cos α, η.", "Комбінована задача підвищеної складності (наприклад, рівновага провідника в полі)."]}, {"h": "Як готуватися", "p": ["Найкраща підготовка — повторити конспект уроку «Узагальнення та систематизація знань», ще раз розв’язати задачі з уроків розв’язування задач і пройти тренувальний тест нижче."], "ul": ["Вивчіть напам’ять усі формули розділу та одиниці величин.", "Потренуйтеся показувати правила правою і лівою рукою на рисунках з ⊗ і ⊙.", "Розв’яжіть по 2–3 задачі кожного типу, звертаючи увагу на переведення в СІ.", "Повторіть типові помилки (кут у формулі сили Ампера, плутанина рук).", "Повторіть будову двигуна, генератора, реле і ланцюжки перетворень енергії на електростанціях."]}, {"h": "Критерії оцінювання", "p": ["Роботу оцінюють за 12-бальною шкалою. Кожне завдання має свою кількість балів залежно від складності; сумарний бал переводять в оцінку."], "ul": ["Тестові завдання оцінюють за правильність вибраної відповіді.", "Завдання на відповідність — за кожну правильно встановлену пару.", "Якісні завдання — за правильний напрям і коротке пояснення (яке правило застосовано).", "Розрахункові задачі — за повний розв’язок: «Дано», СІ, формула, підстановка, обчислення, відповідь з одиницею.", "Часткові бали можна отримати за правильно записану формулу і хід розв’язання навіть із арифметичною помилкою."]}], "formulas": [{"f": "B = F_max/(Il)", "d": "модуль магнітної індукції (Тл)"}, {"f": "F_A = BIl·sin α", "d": "сила Ампера (Н)"}, {"f": "μ = B/B₀", "d": "магнітна проникність"}, {"f": "Ф = BS·cos α", "d": "магнітний потік (Вб)"}, {"f": "P = UI", "d": "електрична потужність (Вт)"}, {"f": "η = P_кор/P_спож · 100 %", "d": "ККД"}], "terms": [], "examples": [{"q": "Провідник завдовжки 60 см зі струмом 2 А розміщено в однорідному магнітному полі під кутом 30° до ліній індукції. Сила Ампера 0,18 Н. Визначте індукцію поля.", "s": ["Дано: l = 60 см, I = 2 А, α = 30°, F_A = 0,18 Н. Знайти: B.", "СІ: l = 0,6 м.", "Розв’язання: B = F_A/(Il·sin α) = 0,18 / (2 · 0,6 · 0,5) = 0,18 / 0,6 = 0,3 Тл.", "Відповідь: B = 0,3 Тл."]}, {"q": "Котушка без осердя створює поле з індукцією 0,5 мТл. Після введення осердя індукція зросла до 0,4 Тл. Яка магнітна проникність осердя? До якої групи речовин воно належить?", "s": ["Дано: B₀ = 0,5 мТл, B = 0,4 Тл. Знайти: μ.", "СІ: B₀ = 0,0005 Тл.", "Розв’язання: μ = B/B₀ = 0,4 / 0,0005 = 800.", "μ ≫ 1, отже осердя виготовлене з феромагнетику.", "Відповідь: μ = 800; феромагнетик."]}, {"q": "Рамка площею 200 см² розташована в однорідному магнітному полі з індукцією 0,5 Тл так, що лінії поля перпендикулярні до її площини. Рамку повернули на 90°, і лінії стали паралельні до її площини. Знайдіть магнітний потік до і після повороту. Чи виникав у рамці індукційний струм?", "s": ["Дано: S = 200 см², B = 0,5 Тл; α₁ = 0°, α₂ = 90° (кут між B і нормаллю). Знайти: Ф₁, Ф₂.", "СІ: S = 0,02 м².", "Розв’язання: Ф₁ = BS·cos 0° = 0,5 · 0,02 · 1 = 0,01 Вб.", "Ф₂ = BS·cos 90° = 0.", "Потік змінився від 0,01 Вб до 0, тому під час повороту в замкненій рамці виникав індукційний струм.", "Відповідь: 0,01 Вб і 0; струм виникав під час повороту."]}], "lab": null, "f": "", "pr": ["Розв’яжіть ще раз усі задачі з уроків «Розв’язування задач» цього розділу, не підглядаючи в розв’язання, і перевірте відповіді.", "Складіть для себе картку-шпаргалку з усіма формулами, одиницями і трьома «правилами рук» (правило свердлика, правило правої руки, правило лівої руки) з рисунками."], "qz": [{"q": "Яка одиниця магнітної індукції?", "o": ["Вебер", "Тесла", "Ватт", "Вольт"], "a": 1, "why": "Магнітну індукцію вимірюють у теслах."}, {"q": "Який дослід довів, що навколо провідника зі струмом існує магнітне поле?", "o": ["Дослід Ерстеда", "Дослід Фарадея", "Дослід Резерфорда", "Дослід Кулона"], "a": 0, "why": "Ерстед 1820 року виявив дію струму на магнітну стрілку."}, {"q": "Струм у провіднику тече до нас (⊙). Як напрямлені магнітні лінії?", "o": ["За годинниковою стрілкою", "Від провідника", "Проти годинникової стрілки", "До провідника"], "a": 2, "why": "Для струму до нас лінії напрямлені проти годинникової стрілки."}, {"q": "Провідник завдовжки 0,4 м зі струмом 5 А в полі 0,3 Тл, α = 90°. Сила Ампера дорівнює…", "o": ["6 Н", "0,06 Н", "0,375 Н", "0,6 Н"], "a": 3, "why": "F = 0,3·5·0,4 = 0,6 Н."}, {"q": "Як зміниться сила Ампера, якщо індукцію поля збільшити вдвічі, а силу струму зменшити вдвічі?", "o": ["Не зміниться", "Збільшиться вдвічі", "Зменшиться вдвічі", "Збільшиться вчетверо"], "a": 0, "why": "F ~ B·I, добуток не змінився."}, {"q": "Яка речовина посилює магнітне поле в сотні й тисячі разів?", "o": ["Алюміній", "Мідь", "Залізо", "Скло"], "a": 2, "why": "Залізо — феромагнетик, μ ≫ 1."}, {"q": "Що забезпечує безперервне обертання ротора двигуна постійного струму?", "o": ["Статор", "Колектор", "Осердя", "Пружина"], "a": 1, "why": "Колектор щопівоберта змінює напрям струму в обмотці."}, {"q": "За якої умови виникає індукційний струм у замкненому контурі?", "o": ["Контур перебуває в сильному полі", "Контур виготовлений із міді", "Контур нагрітий", "Змінюється магнітний потік крізь контур"], "a": 3, "why": "Індукційний струм виникає лише під час зміни магнітного потоку."}, {"q": "Установіть відповідність: «реле» — …", "o": ["керування потужним колом за допомогою слабкого струму", "перетворення механічної енергії на електричну", "вимірювання магнітного потоку", "нагрівання води"], "a": 0, "why": "Реле — електромагнітний вимикач."}, {"q": "Двигун споживає 2 кВт, а корисна потужність 1,7 кВт. Який ККД?", "o": ["17 %", "85 %", "3,7 %", "118 %"], "a": 1, "why": "η = 1,7/2·100 % = 85 %."}]}, {"n": "36", "type": "project", "t": "Захист навчальних проєктів", "gr": "ГР1, ГР2, ГР3", "g": "Підготувати і захистити навчальний проєкт за темою розділу «Магнітні та електромагнітні явища», продемонструвавши вміння досліджувати, пояснювати й презентувати.", "blocks": [{"h": "Як підготувати проєкт", "p": ["Навчальний проєкт — це самостійне невелике дослідження або виготовлення пристрою з поясненням фізики його роботи. Працювати можна індивідуально або в парі. На дистанційному навчанні проєкт захищають онлайн: доповідь із презентацією, відео досліду чи демонстрацією моделі в камеру."], "ul": ["Оберіть тему, яка вам справді цікава, і узгодьте її з учителем.", "Сформулюйте мету і 2–3 завдання проєкту.", "Опрацюйте 3–4 надійні джерела (підручники, наукові довідники, сайти наукових установ).", "Проведіть дослід, спостереження або виготовте модель (лише з низьковольтними джерелами!).", "Зробіть висновки і підготуйте презентацію на 7–10 слайдів.", "Відрепетируйте виступ: тривалість — 5–7 хвилин."]}, {"h": "Структура і критерії оцінювання", "p": ["Проєкт оцінюють за змістом, самостійністю та якістю захисту. Важливо не просто переказати інформацію, а показати власний внесок: дослід, розрахунок, модель або порівняння."], "ul": ["Структура: титульний слайд → актуальність і мета → теорія → дослід / модель / розрахунки → результати → висновки → джерела.", "Фізична правильність пояснень і використання термінів.", "Самостійність: власний дослід, модель, розрахунки або опитування.", "Наочність: схеми, фото, відео власного досліду.", "Якість виступу: логіка, вільне володіння матеріалом, дотримання регламенту.", "Відповіді на запитання вчителя й однокласників."]}, {"h": "Теми проєктів", "p": ["Нижче — орієнтовні теми. Можна запропонувати власну, якщо вона стосується магнітних та електромагнітних явищ."], "ul": ["Магнітне поле Землі та його значення для життя: як орієнтуються птахи і тварини.", "Виготовлення найпростішого електродвигуна (з батарейки, магніту і мідного дроту) та дослідження його роботи.", "Електромагніти навколо нас: де вони працюють у нашому домі та школі.", "Поїзди на магнітній подушці: принцип дії, переваги і недоліки.", "Як працює гучномовець: модель гучномовця з паперової тарілки, котушки та магніту.", "Електромагнітна індукція в побуті: індукційні плити, бездротові зарядки, металошукачі.", "Відновлювальна енергетика України: сонячні та вітрові електростанції, порівняння з традиційними.", "Компас своїми руками: намагнічування голки та дослідження магнітного поля навколо провідника."]}, {"h": "Приклад плану виступу", "p": ["Приклад для теми «Виготовлення найпростішого електродвигуна». Кожен пункт — 1–2 слайди."], "ul": ["Вступ: навіщо людству електродвигуни і де вони працюють (30 с).", "Мета: виготовити модель двигуна і з’ясувати, від чого залежить швидкість обертання (20 с).", "Теорія: сила Ампера, правило лівої руки, рамка зі струмом у полі (1,5 хв).", "Виготовлення: матеріали, кроки, фото або відео (1,5 хв).", "Досліди: як впливають кількість витків і сила магніту на обертання (1 хв).", "Висновки та відповіді на запитання (1 хв)."]}], "formulas": [], "terms": [["Навчальний проєкт", "самостійна дослідницька або практична робота учня з чітко визначеною метою, результатом і захистом."], ["Актуальність", "пояснення, чому тема проєкту важлива і цікава сьогодні."], ["Гіпотеза", "припущення, яке перевіряють під час дослідження."]], "examples": [], "lab": null, "f": "", "pr": ["Оберіть тему проєкту, сформулюйте мету й завдання та складіть план роботи з датами виконання кожного етапу.", "Підготуйте презентацію на 7–10 слайдів і відрепетируйте виступ тривалістю 5–7 хвилин."], "qz": [{"q": "Яку дію магнітного поля використовують в електродвигуні?", "o": ["Дію на нерухомі заряди", "Дію на провідник зі струмом (сила Ампера)", "Теплову дію", "Хімічну дію"], "a": 1, "why": "Ротор двигуна обертається під дією сил Ампера."}, {"q": "На якому явищі ґрунтується робота індукційної плити?", "o": ["Електроліз", "Теплове розширення", "Дослід Ерстеда", "Електромагнітна індукція"], "a": 3, "why": "Змінне магнітне поле індукує струми в дні посуду."}, {"q": "Що відбувається з голкою, яку кілька разів провели в одному напрямку вздовж магніту?", "o": ["Вона намагнічується", "Вона стає діамагнетиком", "Вона нагрівається до температури Кюрі", "Нічого"], "a": 0, "why": "Домени сталевої голки впорядковуються, і вона стає магнітом."}, {"q": "Чому для домашніх дослідів з електромагнітами використовують лише батарейки?", "o": ["Бо від розетки не буде магнітного поля", "Бо батарейки сильніші", "Бо низька напруга безпечна для людини", "Бо так дешевше"], "a": 2, "why": "Робота з мережею 220 В небезпечна для життя."}, {"q": "Що утримує поїзд на магнітній подушці над колією?", "o": ["Сила тяжіння", "Сила тертя", "Повітряний потік", "Магнітні сили взаємодії"], "a": 3, "why": "Маглев піднімають і рухають магнітні сили."}]}]}, {"title": "Механічні та електромагнітні хвилі", "lessons": [{"n": "37", "type": "theory", "t": "Коливальний рух. Амплітуда, період і частота коливань", "gr": "ГР2", "g": "Зрозуміти, що таке механічні коливання, та навчитися описувати їх амплітудою, періодом і частотою.", "blocks": [{"h": "Що таке коливання", "p": ["Коливання — це рух, який точно або приблизно повторюється через однакові проміжки часу. Гойдалка, маятник годинника, струна гітари, крила комахи, поршень у двигуні — усе це приклади коливального руху.", "Тіло коливається навколо положення рівноваги — точки, у якій сили, що діють на нього, зрівноважені. Відхилившись, тіло повертається до рівноваги, за інерцією «проскакує» її і рухається далі в інший бік."], "ul": ["Коливання — повторюваний у часі рух.", "Положення рівноваги — середнє положення, навколо якого відбувається рух.", "Для виникнення коливань потрібна сила, що повертає тіло до рівноваги (сила пружності, сила тяжіння).", "Тіло має бути здатне за інерцією проходити положення рівноваги.", "Тертя поступово зменшує розмах коливань — коливання загасають."]}, {"h": "Коливальні системи", "p": ["Тіла, які можуть вільно коливатися, утворюють коливальну систему. Найпростіші моделі — пружинний маятник (тягарець на пружині) і нитяний (математичний) маятник (невелика кулька на довгій легкій нитці).", "Вільні коливання відбуваються лише завдяки початковому запасу енергії, вимушені — під дією зовнішньої періодичної сили (наприклад, голка швейної машинки чи мембрана динаміка)."], "ul": ["Пружинний маятник: повертає тіло сила пружності.", "Нитяний маятник: повертає тіло складова сили тяжіння.", "Вільні коливання — після одноразового поштовху.", "Вимушені коливання — під дією зовнішньої періодичної сили.", "Під час коливань потенціальна енергія періодично перетворюється на кінетичну і навпаки."]}, {"h": "Амплітуда, період і частота", "p": ["Амплітуда A — найбільше відхилення тіла від положення рівноваги; вимірюється в метрах. Період T — час одного повного коливання; вимірюється в секундах. Частота ν — кількість коливань за 1 секунду; вимірюється в герцах (Гц).", "Період і частота — взаємно обернені величини: що коротший період, то більша частота. Наприклад, якщо T = 0,5 с, то за секунду відбувається 2 коливання, тобто ν = 2 Гц."], "ul": ["Одне повне коливання — рух від крайнього положення до іншого крайнього і назад.", "За один період тіло проходить шлях 4A.", "1 Гц — одне коливання за секунду.", "Період нитяного маятника залежить від довжини нитки, але не залежить від маси кульки.", "За малих відхилень період маятника майже не залежить від амплітуди — на цьому побудовано маятниковий годинник."]}, {"h": "Коливання навколо нас", "p": ["Серце людини скорочується з частотою близько 1 Гц (60–80 ударів за хвилину), крила бджоли — кілька сотень разів за секунду, кварцова пластинка в наручному годиннику — 32 768 разів за секунду. Коливання — основа годинників, музичних інструментів, сейсмографів, двигунів."], "ul": ["Маятниковий і кварцовий годинники.", "Струни, мембрани, голосові зв’язки.", "Коливання мостів і будівель (їх обов’язково враховують інженери).", "Амортизатори автомобіля, які гасять коливання кузова."]}], "formulas": [{"f": "T = t/N", "d": "T — період (с), t — час коливань (с), N — кількість повних коливань"}, {"f": "ν = N/t", "d": "ν — частота (Гц), N — кількість коливань, t — час (с)"}, {"f": "ν = 1/T", "d": "частота й період — взаємно обернені величини"}, {"f": "T = 2π√(l/g)", "d": "період нитяного (математичного) маятника: l — довжина нитки (м), g ≈ 9,8 м/с² — прискорення вільного падіння"}], "terms": [["Механічні коливання", "рух тіла, який точно або приблизно повторюється через однакові проміжки часу."], ["Положення рівноваги", "положення, у якому сили, що діють на тіло, зрівноважені."], ["Амплітуда", "найбільше відхилення тіла від положення рівноваги."], ["Період", "час, за який відбувається одне повне коливання."], ["Частота", "кількість повних коливань за одиницю часу."], ["Вільні коливання", "коливання, що відбуваються завдяки початковому запасу енергії без зовнішньої періодичної дії."], ["Вимушені коливання", "коливання, що відбуваються під дією зовнішньої періодичної сили."]], "examples": [{"q": "Маятник здійснив 30 коливань за 60 с. Знайдіть період і частоту коливань.", "s": ["Дано: N = 30, t = 60 с.", "Знайти: T, ν.", "Розв’язання: T = t/N = 60 с / 30 = 2 с; ν = 1/T = 1 / 2 с = 0,5 Гц.", "Відповідь: T = 2 с, ν = 0,5 Гц."]}, {"q": "Тягарець на пружині коливається з амплітудою 4 см і періодом 0,5 с. Який шлях він пройде за 5 с?", "s": ["Дано: A = 4 см, T = 0,5 с, t = 5 с.", "СІ: A = 0,04 м.", "Розв’язання: кількість коливань N = t/T = 5 с / 0,5 с = 10. За одне коливання шлях 4A = 0,16 м, отже s = N·4A = 10·0,16 м = 1,6 м.", "Відповідь: s = 1,6 м."]}], "lab": null, "f": "Галілео Галілей, за переказами, помітив, що період коливань люстри в соборі не залежить від розмаху, вимірюючи час власним пульсом.", "pr": ["Виміряйте період коливань саморобного маятника (ключ або гайка на нитці завдовжки близько 1 м): засічіть час 20 коливань і обчисліть T та ν.", "Наведіть 5 прикладів коливань у природі й техніці та для кожного вкажіть, вільні вони чи вимушені."], "qz": [{"q": "Що називають амплітудою коливань?", "o": ["Час одного коливання", "Найбільше відхилення від положення рівноваги", "Кількість коливань за секунду", "Шлях за одне коливання"], "a": 1, "why": "Амплітуда — максимальне відхилення тіла від положення рівноваги."}, {"q": "Одиниця частоти в СІ —", "o": ["герц", "секунда", "метр", "ньютон"], "a": 0, "why": "Частоту вимірюють у герцах: 1 Гц = 1/с."}, {"q": "Період коливань 0,2 с. Яка частота?", "o": ["0,2 Гц", "2 Гц", "20 Гц", "5 Гц"], "a": 3, "why": "ν = 1/T = 1/0,2 с = 5 Гц."}, {"q": "Маятник здійснив 50 коливань за 25 с. Його період дорівнює", "o": ["2 с", "0,5 с", "25 с", "50 с"], "a": 1, "why": "T = t/N = 25 с / 50 = 0,5 с."}, {"q": "Який шлях проходить тіло за один період, якщо амплітуда 3 см?", "o": ["3 см", "6 см", "12 см", "9 см"], "a": 2, "why": "За період тіло проходить 4A = 4·3 см = 12 см."}, {"q": "Які коливання є вимушеними?", "o": ["Коливання голки швейної машинки", "Коливання гойдалки після одного поштовху", "Коливання тягарця на пружині, який відпустили", "Коливання струни після удару"], "a": 0, "why": "Голку періодично рухає двигун — це зовнішня періодична сила."}, {"q": "Як зміниться період нитяного маятника, якщо збільшити масу кульки вдвічі?", "o": ["Збільшиться вдвічі", "Зменшиться вдвічі", "Збільшиться в √2 раза", "Не зміниться"], "a": 3, "why": "Період математичного маятника залежить лише від l і g, а не від маси."}, {"q": "Чому коливання гойдалки з часом припиняються?", "o": ["Зменшується маса", "Через тертя й опір повітря енергія перетворюється на внутрішню", "Збільшується період", "Зникає сила тяжіння"], "a": 1, "why": "Сили тертя й опору поступово забирають механічну енергію — коливання загасають."}]}, {"n": "38", "type": "theory", "t": "Виникнення і поширення механічних хвиль. Види хвиль. Фізичні величини, які характеризують хвилі", "gr": "ГР2", "g": "З’ясувати, як виникають і поширюються механічні хвилі, розрізняти їх види та обчислювати довжину й швидкість хвилі.", "blocks": [{"h": "Як виникає хвиля", "p": ["Якщо кинути камінець у воду, від місця падіння розбігаються кола. Частинки води не тікають разом із хвилею — вони лише коливаються вгору-вниз, а далі передається збурення. Механічна хвиля — це поширення коливань у пружному середовищі.", "Хвиля виникає, бо частинки середовища взаємодіють: коливна частинка «тягне» за собою сусідню, та — наступну, але з невеликим запізненням. Тому хвиля переносить енергію, але не переносить речовину."], "ul": ["Для механічної хвилі потрібні джерело коливань і пружне середовище.", "У вакуумі механічні хвилі не поширюються.", "Хвиля переносить енергію, а не речовину.", "Поплавок на хвилях лише гойдається, але не пливе разом із хвилею."]}, {"h": "Поперечні та поздовжні хвилі", "p": ["У поперечній хвилі частинки коливаються перпендикулярно до напрямку поширення хвилі (хвиля на мотузці, хвилі на поверхні води — наближено). Утворюються «горби» і «западини».", "У поздовжній хвилі частинки коливаються вздовж напрямку поширення — утворюються згущення і розрідження (звук у повітрі, стиснення пружини-«слінкі»)."], "ul": ["Поперечні механічні хвилі можуть поширюватися лише у твердих тілах (і на поверхні рідини).", "Поздовжні хвилі поширюються у твердих тілах, рідинах і газах.", "Під час землетрусу поздовжні сейсмічні хвилі приходять раніше за поперечні.", "Звук у повітрі — поздовжня хвиля."]}, {"h": "Величини, що характеризують хвилю", "p": ["Довжина хвилі λ — відстань між двома найближчими точками, які коливаються однаково (наприклад, між сусідніми гребенями). За один період хвиля поширюється саме на відстань λ.", "Тому швидкість хвилі v = λ/T = λν. Частота хвилі дорівнює частоті джерела й не змінюється при переході в інше середовище, а швидкість і довжина хвилі — змінюються."], "ul": ["Амплітуда A — найбільше відхилення частинок середовища (м).", "Період T і частота ν — як у джерела коливань.", "Довжина хвилі λ — у метрах.", "Швидкість хвилі v — у м/с; залежить від властивостей середовища.", "Чим більша частота за тієї самої швидкості, тим менша довжина хвилі."]}], "formulas": [{"f": "v = λ/T", "d": "v — швидкість хвилі (м/с), λ — довжина хвилі (м), T — період (с)"}, {"f": "v = λν", "d": "ν — частота хвилі (Гц)"}, {"f": "λ = vT = v/ν", "d": "довжина хвилі через швидкість і період або частоту"}], "terms": [["Механічна хвиля", "поширення механічних коливань у пружному середовищі."], ["Поперечна хвиля", "хвиля, у якій частинки коливаються перпендикулярно до напрямку її поширення."], ["Поздовжня хвиля", "хвиля, у якій частинки коливаються вздовж напрямку її поширення."], ["Довжина хвилі", "відстань між двома найближчими точками, що коливаються однаково; відстань, на яку хвиля поширюється за один період."], ["Швидкість хвилі", "швидкість поширення коливань у середовищі."], ["Пружне середовище", "середовище, частинки якого взаємодіють між собою силами пружності."]], "examples": [{"q": "Відстань між сусідніми гребенями хвиль на озері 2 м, а поплавок здійснює одне коливання за 0,8 с. Знайдіть швидкість хвилі.", "s": ["Дано: λ = 2 м, T = 0,8 с.", "Розв’язання: v = λ/T = 2 м / 0,8 с = 2,5 м/с.", "Відповідь: v = 2,5 м/с."]}, {"q": "Хвиля поширюється мотузкою зі швидкістю 6 м/с, частота коливань руки 3 Гц. Яка довжина хвилі?", "s": ["Дано: v = 6 м/с, ν = 3 Гц.", "Розв’язання: λ = v/ν = 6 м/с / 3 Гц = 2 м.", "Відповідь: λ = 2 м."]}], "lab": null, "f": "Цунамі у відкритому океані може мати висоту менш як метр, але мчати зі швидкістю реактивного літака — кілька сотень кілометрів за годину.", "pr": ["Покладіть легкий шматочок паперу на воду у ванні чи мисці й створіть хвилі. Опишіть, як рухається папірець, і поясніть, чому хвиля не переносить речовину.", "Хвиля на воді має частоту 0,5 Гц і довжину 4 м. Обчисліть її швидкість."], "qz": [{"q": "Що переносить механічна хвиля?", "o": ["Речовину", "Енергію", "І речовину, і енергію", "Нічого"], "a": 1, "why": "Частинки лише коливаються, а далі передається енергія."}, {"q": "У якому середовищі механічна хвиля НЕ може поширюватися?", "o": ["У воді", "У повітрі", "У вакуумі", "У сталі"], "a": 2, "why": "Механічній хвилі потрібне пружне середовище з частинками."}, {"q": "Звук у повітрі — це хвиля", "o": ["поздовжня", "поперечна", "електромагнітна", "поверхнева"], "a": 0, "why": "У повітрі утворюються згущення і розрідження вздовж напрямку поширення."}, {"q": "Поперечні механічні хвилі можуть поширюватися всередині", "o": ["газів", "рідин", "газів і рідин", "твердих тіл"], "a": 3, "why": "Лише тверді тіла мають пружність зсуву, потрібну для поперечних хвиль."}, {"q": "Довжина хвилі 3 м, період 1,5 с. Швидкість хвилі —", "o": ["4,5 м/с", "0,5 м/с", "2 м/с", "1,5 м/с"], "a": 2, "why": "v = λ/T = 3 м / 1,5 с = 2 м/с."}, {"q": "Швидкість хвилі 10 м/с, частота 5 Гц. Довжина хвилі —", "o": ["50 м", "2 м", "0,5 м", "15 м"], "a": 1, "why": "λ = v/ν = 10/5 = 2 м."}, {"q": "Що НЕ змінюється, коли хвиля переходить з одного середовища в інше?", "o": ["Швидкість", "Довжина хвилі", "Частота", "Напрямок поширення"], "a": 2, "why": "Частоту задає джерело, тому вона залишається незмінною."}, {"q": "Як зміниться довжина хвилі, якщо частоту джерела збільшити вдвічі (швидкість та сама)?", "o": ["Зменшиться вдвічі", "Збільшиться вдвічі", "Не зміниться", "Збільшиться в 4 рази"], "a": 0, "why": "λ = v/ν: за сталої v збільшення ν удвічі зменшує λ удвічі."}]}, {"n": "39", "type": "theory", "t": "Звукові хвилі та їх характеристики. Інфразвук та ультразвук", "gr": "ГР2", "g": "Пояснити природу звуку, зв’язати гучність, висоту й тембр із фізичними характеристиками хвилі та дізнатися про інфразвук і ультразвук.", "blocks": [{"h": "Природа звуку", "p": ["Звук — це механічні поздовжні хвилі, які сприймає вухо людини. Їх створюють коливні тіла: струни, мембрани, голосові зв’язки, крила комах. Людина чує коливання з частотою приблизно від 16–20 Гц до 20 000 Гц (20 кГц).", "Звук поширюється лише в речовині. Швидкість звуку в повітрі за кімнатної температури ≈ 340 м/с, у воді ≈ 1500 м/с, у сталі ≈ 5000 м/с. Що щільніше «зв’язані» частинки середовища, то швидше поширюється звук."], "ul": ["Джерело звуку — тіло, що коливається зі звуковою частотою.", "У вакуумі звук не поширюється — у космосі тиша.", "Блискавку бачимо раніше, ніж чуємо грім, бо світло набагато швидше за звук.", "Звук відбивається від перешкод — так виникає луна."]}, {"h": "Гучність, висота, тембр", "p": ["Гучність звуку визначається насамперед амплітудою коливань: що більша амплітуда, то гучніший звук. Рівень гучності вимірюють у децибелах (дБ): шепіт ≈ 20–30 дБ, розмова ≈ 60 дБ, рок-концерт ≈ 110–120 дБ; звуки понад 85 дБ за тривалої дії шкодять слуху.", "Висота тону визначається частотою: що більша частота, то вищий звук. Тембр — «забарвлення» звуку — залежить від того, які додаткові коливання (обертони) накладаються на основний тон; саме тембр дозволяє відрізнити скрипку від фортепіано на тій самій ноті."], "ul": ["Гучність ↔ амплітуда.", "Висота ↔ частота.", "Тембр ↔ набір обертонів (форма коливань).", "Чистий тон — коливання однієї частоти (камертон).", "Тривале прослуховування гучної музики в навушниках може незворотно погіршити слух."]}, {"h": "Луна та ехолокація", "p": ["Відбитий від перешкоди звук повертається до слухача — це луна. Якщо відомі швидкість звуку v і час t між сигналом і луною, відстань до перешкоди s = vt/2 (звук проходить шлях туди й назад).", "На цьому принципі працюють ехолоти суден, а кажани й дельфіни орієнтуються за допомогою ехолокації."], "ul": ["Ехолот вимірює глибину моря.", "Ехолокація кажанів — ультразвукова.", "Луну чути окремо, якщо вона запізнюється більш як на ≈ 0,1 с.", "У залах для концертів стіни роблять так, щоб уникнути зайвої луни."]}, {"h": "Інфразвук і ультразвук", "p": ["Інфразвук — коливання з частотою, нижчою за 16–20 Гц. Його створюють землетруси, шторми, вулкани, потужні двигуни; він далеко поширюється й може негативно впливати на самопочуття людини. Деякі тварини (слони, кити) спілкуються інфразвуком.", "Ультразвук — коливання з частотою понад 20 кГц. Його чують собаки, кажани, дельфіни. Ультразвук використовують у медицині (УЗД), для виявлення дефектів у металах, очищення деталей, у ехолотах."], "ul": ["Інфразвук: менше ніж ≈ 16–20 Гц.", "Чутний звук: ≈ 16–20 Гц … 20 кГц.", "Ультразвук: понад 20 кГц.", "УЗД — безпечний спосіб «зазирнути» всередину організму.", "Ультразвукова дефектоскопія знаходить тріщини в рейках і деталях."]}], "formulas": [{"f": "v = λν", "d": "зв’язок швидкості звуку, довжини хвилі та частоти"}, {"f": "s = vt/2", "d": "відстань до перешкоди за луною: v — швидкість звуку, t — час від сигналу до повернення луни"}, {"f": "s = vt", "d": "відстань, яку звук проходить за час t (наприклад, до місця удару блискавки)"}], "terms": [["Звук", "механічні хвилі з частотою приблизно від 16–20 Гц до 20 кГц, які сприймає вухо людини."], ["Гучність звуку", "характеристика звуку, яка залежить насамперед від амплітуди коливань."], ["Висота тону", "характеристика звуку, яка визначається частотою коливань."], ["Тембр", "забарвлення звуку, що залежить від набору обертонів."], ["Луна", "звук, відбитий від перешкоди, який повертається до слухача."], ["Інфразвук", "механічні хвилі з частотою, меншою за нижню межу чутності людини."], ["Ультразвук", "механічні хвилі з частотою понад 20 кГц."]], "examples": [{"q": "Ехолот надіслав ультразвуковий сигнал до дна, і відбитий сигнал повернувся через 0,4 с. Яка глибина моря, якщо швидкість звуку у воді 1500 м/с?", "s": ["Дано: t = 0,4 с, v = 1500 м/с.", "Розв’язання: сигнал пройшов глибину двічі, тому h = vt/2 = 1500 м/с · 0,4 с / 2 = 300 м.", "Відповідь: h = 300 м."]}, {"q": "Грім почули через 6 с після спалаху блискавки. На якій відстані вдарила блискавка? Швидкість звуку в повітрі 340 м/с.", "s": ["Дано: t = 6 с, v = 340 м/с.", "Розв’язання: світло доходить майже миттєво, тому s = vt = 340 м/с · 6 с = 2040 м ≈ 2 км.", "Відповідь: ≈ 2 км."]}], "lab": null, "f": "Кажани випромінюють ультразвукові сигнали і за луною «бачать» у темряві навіть тоненькі нитки та дрібних комах.", "pr": ["Порівняйте звучання однієї ноти, зіграної на двох різних інструментах (або заспіваної двома людьми). Опишіть, що в них однакове, а що різне, використавши терміни «висота», «гучність», «тембр».", "Хлопчик крикнув біля скелі й почув луну через 2 с. Обчисліть відстань до скелі (v = 340 м/с)."], "qz": [{"q": "Звукові хвилі в повітрі є", "o": ["поперечними", "електромагнітними", "поздовжніми", "світловими"], "a": 2, "why": "У повітрі звук — це чергування згущень і розріджень уздовж напрямку поширення."}, {"q": "Від чого залежить висота тону?", "o": ["Від частоти", "Від амплітуди", "Від швидкості звуку", "Від тривалості звучання"], "a": 0, "why": "Що більша частота коливань, то вищий звук."}, {"q": "Гучність звуку визначається насамперед", "o": ["частотою", "амплітудою", "тембром", "довжиною хвилі"], "a": 1, "why": "Більша амплітуда коливань — гучніший звук."}, {"q": "Ультразвук — це коливання з частотою", "o": ["менше 16 Гц", "від 16 Гц до 20 кГц", "рівно 1 кГц", "понад 20 кГц"], "a": 3, "why": "Ультразвук лежить вище верхньої межі чутності людини (20 кГц)."}, {"q": "У якому середовищі звук поширюється найшвидше?", "o": ["У повітрі", "У воді", "У сталі", "У вакуумі"], "a": 2, "why": "У сталі ≈ 5000 м/с, у воді ≈ 1500 м/с, у повітрі ≈ 340 м/с, у вакуумі — не поширюється."}, {"q": "Луна повернулася через 3 с. Відстань до перешкоди (v = 340 м/с) —", "o": ["510 м", "1020 м", "340 м", "113 м"], "a": 0, "why": "s = vt/2 = 340·3/2 = 510 м."}, {"q": "Що дозволяє відрізнити голоси двох людей, які співають ту саму ноту однаково гучно?", "o": ["Висота", "Тембр", "Амплітуда", "Швидкість звуку"], "a": 1, "why": "Тембр залежить від обертонів, які в кожного голосу свої."}, {"q": "Звук частотою 680 Гц поширюється в повітрі (v = 340 м/с). Довжина хвилі —", "o": ["2 м", "0,2 м", "5 м", "0,5 м"], "a": 3, "why": "λ = v/ν = 340/680 = 0,5 м."}]}, {"n": "40", "type": "lab", "t": "Експериментальна робота № 1 «Дослідження звукових коливань різноманітних джерел звуку за допомогою сучасних цифрових засобів»", "gr": "ГР1", "g": "Дослідити звукові коливання різних джерел за допомогою смартфона чи комп’ютера та встановити зв’язок між характеристиками звуку і параметрами коливань.", "blocks": [{"h": "Теорія до роботи", "p": ["Мікрофон смартфона чи комп’ютера перетворює звукові коливання тиску повітря на електричний сигнал. Програма-осцилограф показує графік цього сигналу в часі (осцилограму), а спектроаналізатор — які частоти присутні у звуці і наскільки вони сильні.", "За осцилограмою можна визначити період T (час між двома сусідніми однаковими точками графіка) і обчислити частоту ν = 1/T; висота «горбів» відповідає амплітуді, тобто гучності. Складна форма графіка свідчить про наявність обертонів — тембр."], "ul": ["Чистий тон дає на осцилограмі плавну синусоїду.", "Голос і музичні інструменти дають складну, але повторювану форму.", "Шум — неповторюваний хаотичний графік.", "Безкоштовні застосунки на кшталт «phyphox» мають режими «Осцилограф», «Аудіоспектр», «Генератор тону».", "Для онлайн-генерації чистого тону підійде будь-який генератор звуку (тон-генератор)."]}, {"h": "Що можна виконати вдома", "p": ["Робота повністю безпечна й виконується вдома. Не вмикайте генератор тону на великій гучності і не тримайте динамік біля вуха. Якщо смартфона з потрібним застосунком немає, скористайтеся віртуальною лабораторією PhET «Хвилі: вступ» (розділ «Звук»)."], "ul": ["Смартфон або ноутбук з мікрофоном.", "Різні джерела звуку: голос, свисток, гітара, ложка по склянці, камертон.", "Зошит для таблиці та висновків."]}], "formulas": [{"f": "ν = 1/T", "d": "частота звуку за періодом, визначеним з осцилограми"}, {"f": "T = t/N", "d": "період через час t, за який на осцилограмі вкладається N коливань (так точніше)"}, {"f": "λ = v/ν", "d": "довжина звукової хвилі; v ≈ 340 м/с — швидкість звуку в повітрі"}], "terms": [["Осцилограма", "графік залежності звукового сигналу від часу."], ["Спектр звуку", "набір частот, з яких складається звук, і їх відносна інтенсивність."], ["Основний тон", "коливання найнижчої частоти у складному звуці, яке визначає його висоту."], ["Обертони", "додаткові коливання вищих частот, що визначають тембр звуку."]], "examples": [], "lab": {"goal": "Дослідити звукові коливання різних джерел за допомогою цифрових засобів: визначити період, частоту, оцінити амплітуду та порівняти форму коливань (тембр).", "equip": ["Смартфон або комп’ютер з мікрофоном", "Застосунок з функціями осцилографа та аудіоспектра (наприклад, «phyphox»)", "Генератор тону (застосунок або онлайн-генератор)", "2–4 джерела звуку: голос, свисток, музичний інструмент, склянка з ложкою, камертон"], "safety": ["Не встановлюйте генератор тону на максимальну гучність.", "Не підносьте джерело звуку чи динамік щільно до вуха.", "Скляний посуд стукайте обережно, щоб не розбити.", "Робіть перерви, якщо звук неприємний або викликає дискомфорт."], "steps": ["Запустіть застосунок у режимі «Осцилограф» і перевірте, що графік реагує на звук.", "Увімкніть генератор чистого тону 440 Гц на помірній гучності біля мікрофона. Зупиніть (заморозьте) графік і визначте за шкалою часу період T (краще виміряйте час кількох коливань N).", "Повторіть для частот 220 Гц і 880 Гц. Запишіть, як змінюється вигляд графіка.", "Не змінюючи частоту, зробіть звук тихішим і гучнішим. Порівняйте висоту «горбів» осцилограми.", "Дослідіть 2–3 інші джерела (голос, свисток, інструмент). Для кожного визначте приблизний період за осцилограмою й основну частоту за режимом «Аудіоспектр».", "Порівняйте форму осцилограм різних джерел на однаковій ноті (наприклад, голос і інструмент) і опишіть різницю.", "Заповніть таблицю та сформулюйте висновки."], "calc": ["T = t/N — період за осцилограмою.", "ν = 1/T — частота; порівняйте з показом генератора чи спектра: δ = |ν_вим − ν_ген| / ν_ген · 100 %.", "λ = v/ν, v ≈ 340 м/с — довжина звукової хвилі для кожного джерела."], "table": ["№", "Джерело звуку", "Період T, с", "Частота ν = 1/T, Гц", "Частота за спектром, Гц", "Довжина хвилі λ, м", "Амплітуда (мала/середня/велика)", "Форма коливань"], "sample": "Очікується, що виміряні за осцилограмою частоти тонів генератора збігатимуться з заданими з похибкою кілька відсотків, вищий звук матиме коротший період, гучніший — більшу амплітуду, а голос і музичні інструменти дадуть складну повторювану форму сигналу на відміну від синусоїди чистого тону.", "questions": ["Як за осцилограмою визначити частоту звуку?", "Як змінюється осцилограма, якщо збільшити гучність? висоту тону?", "Чому осцилограми голосу і камертона на одній ноті відрізняються?", "Чим осцилограма шуму відрізняється від осцилограми музичного звуку?", "Обчисліть довжину хвилі звуку частотою 440 Гц у повітрі."]}, "f": "Нота «ля» першої октави з частотою 440 Гц — міжнародний стандарт для налаштування музичних інструментів.", "pr": ["Оформіть звіт: мета, обладнання, таблиця результатів, обчислення, відповіді на контрольні запитання, висновок.", "Якщо немає смартфона із застосунком — виконайте дослідження у віртуальній лабораторії PhET «Хвилі: вступ» (режим «Звук»): змінюйте частоту й амплітуду та опишіть, як змінюються довжина хвилі й гучність."], "qz": [{"q": "Що показує осцилограма звуку?", "o": ["Залежність сигналу від часу", "Набір частот", "Швидкість звуку", "Температуру повітря"], "a": 0, "why": "Осцилограма — графік коливань у часі."}, {"q": "На осцилограмі 10 коливань займають 0,02 с. Частота звуку —", "o": ["50 Гц", "200 Гц", "500 Гц", "2000 Гц"], "a": 2, "why": "T = 0,02/10 = 0,002 с; ν = 1/T = 500 Гц."}, {"q": "Звук став гучнішим. Що змінилося на осцилограмі?", "o": ["Період зменшився", "Збільшилася висота «горбів» (амплітуда)", "Частота зросла", "Нічого"], "a": 1, "why": "Гучність пов’язана з амплітудою коливань."}, {"q": "Чим визначається тембр звуку?", "o": ["Лише амплітудою", "Лише частотою основного тону", "Швидкістю звуку", "Набором обертонів (формою коливань)"], "a": 3, "why": "Тембр — це форма коливань, яку задають обертони."}, {"q": "Довжина звукової хвилі частотою 340 Гц у повітрі —", "o": ["0,5 м", "1 м", "2 м", "340 м"], "a": 1, "why": "λ = v/ν = 340/340 = 1 м."}, {"q": "Яке джерело дасть осцилограму, найближчу до синусоїди?", "o": ["Шелест паперу", "Оплески", "Камертон", "Голос під час розмови"], "a": 2, "why": "Камертон випромінює майже чистий тон однієї частоти."}]}, {"n": "41", "type": "problems", "t": "Розв’язування задач", "gr": "ГР3", "g": "Навчитися розв’язувати розрахункові та якісні задачі на механічні коливання, хвилі та звук.", "blocks": [{"h": "Алгоритм розв’язування задач", "p": ["Уважно прочитайте умову й визначте, про що йдеться: про коливання тіла (маятник, пружина) чи про хвилю (поширення збурення, звук, луна). Запишіть «Дано», переведіть величини в СІ (см → м, мс → с, кГц → Гц, хв → с).", "Підберіть формулу, яка пов’язує відомі й невідомі величини, виразіть шукану величину, підставте числа з одиницями, обчисліть і перевірте, чи реальна відповідь (наприклад, швидкість звуку в повітрі не може бути 5 м/с)."], "ul": ["Коливання: T = t/N, ν = N/t, ν = 1/T; за період шлях 4A.", "Хвиля: v = λ/T = λν; λ = v/ν.", "Луна: s = vt/2 — звук проходить шлях туди й назад.", "Частота хвилі не змінюється при переході в інше середовище; змінюються v і λ.", "Швидкість звуку: у повітрі ≈ 340 м/с, у воді ≈ 1500 м/с, у сталі ≈ 5000 м/с."]}], "formulas": [{"f": "T = t/N", "d": "період коливань: t — час, N — кількість коливань"}, {"f": "ν = N/t = 1/T", "d": "частота коливань (Гц)"}, {"f": "T = 2π√(l/g)", "d": "період нитяного маятника"}, {"f": "v = λ/T = λν", "d": "швидкість хвилі"}, {"f": "s = vt/2", "d": "відстань до перешкоди за часом повернення луни"}], "terms": [], "examples": [{"q": "Крила комара здійснюють 6000 помахів за 10 с. Яка частота і період коливань крил?", "s": ["Дано: N = 6000, t = 10 с.", "Розв’язання: ν = N/t = 6000 / 10 с = 600 Гц; T = 1/ν = 1/600 с ≈ 0,0017 с.", "Відповідь: ν = 600 Гц, T ≈ 1,7 мс."]}, {"q": "Хвиля поширюється зі швидкістю 4 м/с. Відстань між найближчими гребенем і западиною 0,5 м. Знайдіть частоту коливань.", "s": ["Дано: v = 4 м/с, відстань гребінь–западина = 0,5 м.", "Розв’язання: між гребенем і найближчою западиною — половина довжини хвилі, тому λ = 2 · 0,5 м = 1 м. ν = v/λ = 4 м/с / 1 м = 4 Гц.", "Відповідь: ν = 4 Гц."]}, {"q": "Звукова хвиля частотою 500 Гц переходить з повітря у воду. Знайдіть довжину хвилі в обох середовищах (v_пов = 340 м/с, v_вод = 1500 м/с).", "s": ["Дано: ν = 500 Гц, v₁ = 340 м/с, v₂ = 1500 м/с.", "Розв’язання: частота не змінюється. λ₁ = v₁/ν = 340/500 = 0,68 м; λ₂ = v₂/ν = 1500/500 = 3 м.", "Відповідь: у повітрі 0,68 м, у воді 3 м (довжина хвилі збільшилася ≈ в 4,4 раза)."]}, {"q": "Ехолот на кораблі отримав відбитий від дна сигнал через 1,2 с після випромінювання. Яка глибина моря (v = 1500 м/с)?", "s": ["Дано: t = 1,2 с, v = 1500 м/с.", "Розв’язання: h = vt/2 = 1500 м/с · 1,2 с / 2 = 900 м.", "Відповідь: h = 900 м."]}, {"q": "Учень ударив молотком по кінцю довгої сталевої труби. Його товариш на іншому кінці почув два удари з інтервалом 2 с. Яка довжина труби (v_пов = 340 м/с, v_ст = 5000 м/с)?", "s": ["Дано: Δt = 2 с, v₁ = 340 м/с, v₂ = 5000 м/с.", "Розв’язання: звук сталлю приходить раніше: t₁ = l/v₁, t₂ = l/v₂, Δt = l/v₁ − l/v₂ = l(v₂ − v₁)/(v₁v₂).", "l = Δt·v₁v₂/(v₂ − v₁) = 2 · 340 · 5000 / 4660 ≈ 730 м.", "Відповідь: l ≈ 730 м."]}], "lab": null, "f": "", "pr": ["Тягарець на пружині за 1 хв здійснив 90 коливань з амплітудою 2 см. Знайдіть період, частоту і шлях за 1 хв. (T ≈ 0,67 с; ν = 1,5 Гц; s = 7,2 м)", "Рибалка помітив, що поплавок робить 12 коливань за 24 с, а відстань між сусідніми гребенями хвиль 1,5 м. Яка швидкість хвиль? (0,75 м/с)", "Довжина звукової хвилі в повітрі 1,7 м. Яка її частота (v = 340 м/с)? (200 Гц)", "Туристи почули луну від скелі через 4 с після вигуку. Яка відстань до скелі (v = 340 м/с)? (680 м)"], "qz": [{"q": "Тіло здійснило 120 коливань за 1 хв. Частота коливань —", "o": ["120 Гц", "0,5 Гц", "2 Гц", "60 Гц"], "a": 2, "why": "ν = 120 / 60 с = 2 Гц."}, {"q": "Частота 25 Гц. Період —", "o": ["0,04 с", "0,25 с", "25 с", "4 с"], "a": 0, "why": "T = 1/25 = 0,04 с."}, {"q": "Хвиля: λ = 0,8 м, ν = 5 Гц. Швидкість —", "o": ["0,16 м/с", "6,25 м/с", "5,8 м/с", "4 м/с"], "a": 3, "why": "v = λν = 0,8 · 5 = 4 м/с."}, {"q": "Звук перейшов з повітря у воду. Що сталося з довжиною хвилі?", "o": ["Зменшилася", "Збільшилася", "Не змінилася", "Стала нулем"], "a": 1, "why": "Частота стала, швидкість зросла, тому λ = v/ν збільшилася."}, {"q": "Луна від стіни повернулася через 0,5 с. Відстань до стіни (v = 340 м/с) —", "o": ["85 м", "170 м", "340 м", "680 м"], "a": 0, "why": "s = vt/2 = 340·0,5/2 = 85 м."}, {"q": "Амплітуда коливань 5 см. Який шлях пройде тіло за 3 періоди?", "o": ["15 см", "30 см", "60 см", "20 см"], "a": 2, "why": "За період 4A = 20 см, за 3 періоди — 60 см."}, {"q": "Чому в космосі не чути вибухів?", "o": ["Там дуже холодно", "Звук поширюється надто швидко", "Звук там має надто високу частоту", "У вакуумі немає середовища для звукових хвиль"], "a": 3, "why": "Звук — механічна хвиля, якій потрібна речовина."}, {"q": "Довжина нитки маятника збільшилася в 4 рази. Період", "o": ["збільшився в 4 рази", "збільшився в 2 рази", "зменшився в 2 рази", "не змінився"], "a": 1, "why": "T = 2π√(l/g): √4 = 2, отже період зріс удвічі."}]}, {"n": "42", "type": "theory", "t": "Електромагнітне поле та електромагнітні хвилі", "gr": "ГР2", "g": "Пояснити, як виникає електромагнітне поле і як воно поширюється у вигляді електромагнітних хвиль, та навчитися обчислювати їх довжину і частоту.", "blocks": [{"h": "Електромагнітне поле", "p": ["Ви вже знаєте, що змінне магнітне поле породжує електричний струм у котушці (електромагнітна індукція). Джеймс Клерк Максвелл у 1860-х роках дійшов висновку: змінне магнітне поле породжує вихрове електричне поле, а змінне електричне поле — магнітне поле.", "Тому змінні електричне й магнітне поля нерозривно пов’язані й утворюють єдине електромагнітне поле. Його джерелом є заряди, що рухаються з прискоренням, наприклад електрони, які коливаються в антені."], "ul": ["Нерухомий заряд створює лише електростатичне поле.", "Заряд, що рухається рівномірно, створює ще й магнітне поле.", "Заряд, що коливається (рухається з прискоренням), випромінює електромагнітні хвилі.", "Електромагнітне поле — особлива форма матерії, що має енергію."]}, {"h": "Електромагнітна хвиля", "p": ["Поширення змінного електромагнітного поля в просторі називають електромагнітною хвилею. Електричне й магнітне поля в хвилі коливаються перпендикулярно одне до одного і до напрямку поширення, тому електромагнітна хвиля — поперечна.", "На відміну від механічних хвиль, електромагнітним хвилям не потрібне середовище: вони поширюються й у вакуумі зі швидкістю c ≈ 3·10⁸ м/с — швидкістю світла. Існування таких хвиль передбачив Максвелл, а експериментально в 1888 р. їх отримав Генріх Герц."], "ul": ["Електромагнітна хвиля — поперечна.", "Поширюється у вакуумі зі швидкістю c ≈ 3·10⁸ м/с.", "У речовині швидкість менша, ніж у вакуумі.", "Переносить енергію (сонячне тепло дістається Землі саме так).", "Відбивається, заломлюється, поглинається, як і інші хвилі."]}, {"h": "Характеристики електромагнітних хвиль", "p": ["Електромагнітну хвилю характеризують частотою ν, періодом T і довжиною хвилі λ, які пов’язані зі швидкістю світла: c = λν. Що більша частота, то коротша хвиля.", "Наприклад, FM-радіостанція на частоті 100 МГц випромінює хвилі завдовжки 3 м, а мікрохвильова піч (≈ 2,45 ГГц) — хвилі завдовжки близько 12 см."], "ul": ["1 кГц = 10³ Гц, 1 МГц = 10⁶ Гц, 1 ГГц = 10⁹ Гц.", "1 нм = 10⁻⁹ м, 1 мкм = 10⁻⁶ м.", "λ = c/ν — довжина хвилі.", "Частота хвилі визначається частотою коливань зарядів у джерелі."]}], "formulas": [{"f": "c = λν", "d": "c ≈ 3·10⁸ м/с — швидкість електромагнітних хвиль у вакуумі, λ — довжина хвилі (м), ν — частота (Гц)"}, {"f": "λ = cT", "d": "T — період коливань (с)"}, {"f": "ν = 1/T", "d": "зв’язок частоти й періоду"}], "terms": [["Електромагнітне поле", "єдине поле, що складається із взаємопов’язаних змінних електричного й магнітного полів."], ["Електромагнітна хвиля", "поширення змінного електромагнітного поля в просторі."], ["Швидкість світла", "швидкість поширення електромагнітних хвиль у вакуумі, c ≈ 3·10⁸ м/с."], ["Вихрове електричне поле", "електричне поле, яке породжується змінним магнітним полем і має замкнені лінії."], ["Антена", "пристрій для випромінювання або приймання електромагнітних хвиль."]], "examples": [{"q": "Радіостанція працює на частоті 100 МГц. Яка довжина хвилі?", "s": ["Дано: ν = 100 МГц, c = 3·10⁸ м/с.", "СІ: ν = 1·10⁸ Гц.", "Розв’язання: λ = c/ν = 3·10⁸ / 1·10⁸ = 3 м.", "Відповідь: λ = 3 м."]}, {"q": "Довжина електромагнітної хвилі 30 см. Знайдіть частоту та період.", "s": ["Дано: λ = 30 см, c = 3·10⁸ м/с.", "СІ: λ = 0,3 м.", "Розв’язання: ν = c/λ = 3·10⁸ / 0,3 = 1·10⁹ Гц = 1 ГГц; T = 1/ν = 1·10⁻⁹ с.", "Відповідь: ν = 1 ГГц, T = 1 нс."]}], "lab": null, "f": "Максвелл обчислив, що його передбачені хвилі мають швидкість, яка збігається з відомою тоді швидкістю світла, і зробив висновок: світло — це теж електромагнітна хвиля.", "pr": ["Знайдіть удома 4 пристрої, які випромінюють або приймають електромагнітні хвилі, і поясніть, для чого вони це роблять.", "Обчисліть довжину хвилі вашої улюбленої FM-радіостанції (частота вказана в МГц на приймачі чи в застосунку)."], "qz": [{"q": "Хто теоретично передбачив існування електромагнітних хвиль?", "o": ["Фарадей", "Максвелл", "Герц", "Ньютон"], "a": 1, "why": "Максвелл створив теорію електромагнітного поля й передбачив хвилі."}, {"q": "Хто вперше експериментально отримав електромагнітні хвилі?", "o": ["Герц", "Ампер", "Ом", "Ерстед"], "a": 0, "why": "Генріх Герц у 1888 р. отримав і зареєстрував електромагнітні хвилі."}, {"q": "Що є джерелом електромагнітних хвиль?", "o": ["Нерухомий заряд", "Постійний магніт", "Заряд, що рухається з прискоренням", "Незаряджене тіло"], "a": 2, "why": "Лише прискорений рух зарядів, наприклад коливання в антені, випромінює хвилі."}, {"q": "Електромагнітна хвиля є", "o": ["поздовжньою", "поперечною", "то поздовжньою, то поперечною", "механічною"], "a": 1, "why": "Електричне й магнітне поля коливаються перпендикулярно до напрямку поширення."}, {"q": "Швидкість електромагнітних хвиль у вакуумі приблизно", "o": ["340 м/с", "3·10⁵ м/с", "1500 м/с", "3·10⁸ м/с"], "a": 3, "why": "Це швидкість світла c ≈ 3·10⁸ м/с."}, {"q": "Частота хвилі 300 МГц. Довжина хвилі —", "o": ["1 м", "10 м", "0,1 м", "3 м"], "a": 0, "why": "λ = 3·10⁸ / 3·10⁸ = 1 м."}, {"q": "Чим електромагнітні хвилі принципово відрізняються від звукових?", "o": ["Не переносять енергію", "Не відбиваються", "Можуть поширюватися у вакуумі", "Завжди мають меншу частоту"], "a": 2, "why": "Електромагнітним хвилям не потрібне середовище."}, {"q": "Як зміниться довжина електромагнітної хвилі, якщо частоту збільшити в 3 рази?", "o": ["Збільшиться в 3 рази", "Не зміниться", "Збільшиться в 9 разів", "Зменшиться в 3 рази"], "a": 3, "why": "λ = c/ν, c стала, тому λ обернено пропорційна ν."}]}, {"n": "43", "type": "theory", "t": "Шкала електромагнітних хвиль", "gr": "ГР2", "g": "Ознайомитися з діапазонами шкали електромагнітних хвиль, їх джерелами, властивостями та застосуванням.", "blocks": [{"h": "Одна природа — різні діапазони", "p": ["Радіохвилі, світло, рентгенівські промені — усе це електромагнітні хвилі однієї природи, які у вакуумі поширюються з однаковою швидкістю c. Відрізняються вони лише довжиною хвилі (і частотою), а від цього залежать їх властивості та способи отримання.", "Розміщені за зростанням частоти (зменшенням довжини хвилі), вони утворюють шкалу електромагнітних хвиль. Межі між діапазонами умовні, сусідні діапазони частково перекриваються."], "ul": ["Радіохвилі — від кілометрів до міліметрів.", "Інфрачервоне (ІЧ) випромінювання — від ≈ 1 мм до ≈ 760 нм.", "Видиме світло — ≈ 380–760 нм.", "Ультрафіолетове (УФ) — ≈ 380 нм … 10 нм.", "Рентгенівське випромінювання — ≈ 10 нм … 0,01 нм.", "Гамма-випромінювання — менше ніж ≈ 0,01 нм."]}, {"h": "Радіохвилі та інфрачервоне випромінювання", "p": ["Радіохвилі випромінюють антени, у яких коливаються електрони. Їх використовують для радіо, телебачення, мобільного зв’язку, Wi-Fi, радіолокації; мікрохвилі (НВЧ) нагрівають їжу в мікрохвильовій печі.", "Інфрачервоне випромінювання дають усі нагріті тіла, зокрема тіло людини. Ми відчуваємо його як тепло. Його використовують у тепловізорах, пультах дистанційного керування, приладах нічного бачення, для сушіння й обігрівання."], "ul": ["Радіохвилі добре огинають перешкоди й проходять крізь атмосферу.", "НВЧ-хвилі поглинаються водою, тому нагрівають їжу.", "Тепловізор «бачить» ІЧ-випромінювання навіть у повній темряві.", "ІЧ-світлодіод пульта невидимий для ока, але його видно камерою смартфона."]}, {"h": "Видиме світло та ультрафіолет", "p": ["Видиме світло — вузький діапазон, який сприймає око: від фіолетового (≈ 380 нм) до червоного (≈ 760 нм). Біле світло — суміш усіх кольорів.", "Ультрафіолет випромінюють Сонце, кварцові та спеціальні лампи. У невеликих дозах він сприяє утворенню вітаміну D у шкірі, але надмірний ультрафіолет спричиняє опіки й шкодить очам. Його використовують для знезараження, перевірки банкнот, у солярії. Озоновий шар Землі поглинає значну частину сонячного ультрафіолету."], "ul": ["Червоне світло має найбільшу довжину хвилі у видимому діапазоні.", "Фіолетове — найменшу.", "УФ знезаражує повітря й воду (бактерицидні лампи).", "Сонцезахисні окуляри та креми захищають від УФ."]}, {"h": "Рентгенівське і гамма-випромінювання", "p": ["Рентгенівське випромінювання (відкрите Вільгельмом Рентгеном у 1895 р.) виникає під час різкого гальмування швидких електронів. Воно проходить крізь м’які тканини, але затримується кістками й металами, тому його використовують у медицині, а також для перевірки багажу.", "Гамма-випромінювання має найбільшу частоту й енергію; воно виникає під час ядерних реакцій і радіоактивного розпаду. Його застосовують для знищення ракових клітин, стерилізації медичних інструментів. Обидва види є іонізуючими й небезпечними у великих дозах."], "ul": ["Що менша довжина хвилі, то більша проникна здатність і енергія випромінювання.", "Рентгенологи працюють у захисних фартухах зі свинцем.", "Іонізуюче випромінювання здатне руйнувати молекули живих клітин.", "Земна атмосфера поглинає космічне рентгенівське і гамма-випромінювання, тому їх досліджують телескопами в космосі."]}], "formulas": [{"f": "c = λν", "d": "для всіх діапазонів шкали, c ≈ 3·10⁸ м/с"}, {"f": "λ = c/ν", "d": "довжина хвилі за частотою"}], "terms": [["Шкала електромагнітних хвиль", "неперервна послідовність діапазонів електромагнітних хвиль, розміщених за довжиною хвилі або частотою."], ["Видиме світло", "електромагнітні хвилі довжиною приблизно 380–760 нм, які сприймає око людини."], ["Інфрачервоне випромінювання", "електромагнітне випромінювання, довжина хвилі якого більша за довжину хвилі червоного світла; його випромінюють нагріті тіла."], ["Ультрафіолетове випромінювання", "електромагнітне випромінювання з довжиною хвилі, меншою за довжину хвилі фіолетового світла."], ["Рентгенівське випромінювання", "електромагнітне випромінювання з дуже малою довжиною хвилі, що виникає під час гальмування швидких електронів."], ["Гамма-випромінювання", "електромагнітне випромінювання найвищих частот, що виникає під час ядерних процесів."]], "examples": [{"q": "Зелене світло має довжину хвилі 500 нм. Яка його частота?", "s": ["Дано: λ = 500 нм, c = 3·10⁸ м/с.", "СІ: λ = 5·10⁻⁷ м.", "Розв’язання: ν = c/λ = 3·10⁸ / 5·10⁻⁷ = 6·10¹⁴ Гц.", "Відповідь: ν = 6·10¹⁴ Гц."]}, {"q": "Мікрохвильова піч працює на частоті 2,45 ГГц. Знайдіть довжину хвилі та визначте діапазон.", "s": ["Дано: ν = 2,45 ГГц.", "СІ: ν = 2,45·10⁹ Гц.", "Розв’язання: λ = c/ν = 3·10⁸ / 2,45·10⁹ ≈ 0,12 м = 12 см.", "Відповідь: λ ≈ 12 см — це мікрохвилі (НВЧ), частина діапазону радіохвиль."]}], "lab": null, "f": "Камера смартфона «бачить» інфрачервоне світло пульта дистанційного керування: натисніть кнопку пульта, дивлячись на нього через камеру, — і побачите спалахи.", "pr": ["Складіть таблицю «Діапазон — довжина хвилі — джерело — застосування — вплив на людину» для всіх шести діапазонів шкали.", "Перевірте камерою смартфона, чи світиться ІЧ-світлодіод пульта від телевізора, і поясніть результат."], "qz": [{"q": "Чим відрізняються різні діапазони шкали електромагнітних хвиль?", "o": ["Швидкістю у вакуумі", "Природою", "Довжиною хвилі (частотою)", "Тим, що одні поперечні, а інші поздовжні"], "a": 2, "why": "Усі вони — електромагнітні хвилі з однаковою c у вакуумі, різниться лише λ (ν)."}, {"q": "Яке випромінювання має найбільшу частоту?", "o": ["Гамма-випромінювання", "Видиме світло", "Радіохвилі", "Інфрачервоне"], "a": 0, "why": "Гамма-промені стоять на кінці шкали з найменшою λ і найбільшою ν."}, {"q": "Тепловізор реєструє", "o": ["ультрафіолет", "рентгенівське випромінювання", "радіохвилі", "інфрачервоне випромінювання"], "a": 3, "why": "Нагріті тіла випромінюють ІЧ-хвилі, які й фіксує тепловізор."}, {"q": "Яке світло має найбільшу довжину хвилі у видимому діапазоні?", "o": ["Фіолетове", "Червоне", "Зелене", "Синє"], "a": 1, "why": "Червоне світло ≈ 760 нм — межа видимого діапазону з боку ІЧ."}, {"q": "Для знезараження приміщень використовують", "o": ["ультрафіолетові лампи", "інфрачервоні обігрівачі", "радіохвилі", "видиме світло"], "a": 0, "why": "УФ-випромінювання знищує мікроорганізми."}, {"q": "Частота 1·10¹⁵ Гц. Довжина хвилі —", "o": ["3 мкм", "300 нм", "30 нм", "3 м"], "a": 1, "why": "λ = 3·10⁸ / 10¹⁵ = 3·10⁻⁷ м = 300 нм (ультрафіолет)."}, {"q": "Чому рентгенівський знімок показує кістки?", "o": ["Кістки світяться", "Кістки відбивають видиме світло", "Кістки сильніше поглинають рентгенівське випромінювання, ніж м’які тканини", "Рентгенівські промені не проходять крізь шкіру"], "a": 2, "why": "Різне поглинання тканинами створює контрастне зображення."}, {"q": "Що захищає живі організми на Землі від надмірного сонячного ультрафіолету?", "o": ["Хмари", "Магнітне поле Землі", "Океани", "Озоновий шар"], "a": 3, "why": "Озон у стратосфері поглинає значну частину УФ-випромінювання."}]}, {"n": "44", "type": "theory", "t": "Фізичні основи сучасних бездротових засобів зв’язку. Принципи радіолокації. Електромагнітні хвилі як джерело знань про Всесвіт", "gr": "ГР2, ГР3", "g": "З’ясувати, як за допомогою електромагнітних хвиль передається інформація, як працює радіолокатор і що астрономи дізнаються про Всесвіт з електромагнітного випромінювання.", "blocks": [{"h": "Як передається інформація без дротів", "p": ["Передавач створює в антені високочастотні коливання — несучу хвилю. Щоб передати звук, зображення чи дані, параметри несучої хвилі змінюють відповідно до сигналу — це модуляція (амплітудна — AM, частотна — FM, цифрова). Приймач виділяє сигнал потрібної частоти і перетворює його назад на звук, зображення чи дані — це демодуляція.", "Сучасний зв’язок переважно цифровий: інформація кодується послідовністю нулів і одиниць, що робить його стійким до завад і дозволяє передавати величезні обсяги даних."], "ul": ["Передавач: генератор → модулятор → антена.", "Приймач: антена → налаштування на частоту → демодулятор → динамік/екран.", "Кожна станція працює на своїй частоті, щоб не заважати іншим.", "Що вища частота несучої, то більше даних можна передати за секунду."]}, {"h": "Мобільний зв’язок, Wi-Fi, супутники", "p": ["Мобільний телефон — це водночас радіопередавач і радіоприймач. Він обмінюється сигналами з найближчою базовою станцією, а станції з’єднані між собою кабелями та радіорелейними лініями. Територія поділена на «соти», тому зв’язок називають стільниковим.", "Wi-Fi і Bluetooth — зв’язок на малі відстані на частотах близько 2,4 ГГц і 5 ГГц. Супутниковий зв’язок і навігація (GPS тощо) використовують сигнали від супутників на орбітах: приймач визначає своє положення за часом надходження сигналів від кількох супутників."], "ul": ["Стільниковий зв’язок — мережа базових станцій.", "Wi-Fi — бездротовий доступ до інтернету в будинку.", "Bluetooth — навушники, годинники, колонки.", "Супутникове телебачення й інтернет.", "Навігаційні системи визначають координати з точністю до кількох метрів."]}, {"h": "Радіолокація", "p": ["Радіолокація — виявлення об’єктів і визначення їх положення за допомогою відбитих радіохвиль. Радіолокатор (радар) випромінює короткий імпульс, який відбивається від літака, корабля, хмари й повертається. Знаючи час t між випромінюванням і поверненням, обчислюють відстань s = ct/2.", "Напрямок на об’єкт визначають за положенням вузьконапрямленої антени, а за зміною частоти відбитого сигналу — швидкість об’єкта. Радари використовують в авіації, флоті, метеорології, військовій справі, для контролю швидкості на дорогах."], "ul": ["Імпульс проходить шлях до цілі й назад, тому ділимо на 2.", "Радіохвилі проходять крізь туман, хмари й темряву.", "Метеорадари показують зони опадів.", "Радари протиповітряної оборони виявляють повітряні цілі.", "Радіолокацією вимірювали відстань до Місяця й планет."]}, {"h": "Електромагнітні хвилі розповідають про Всесвіт", "p": ["Майже все, що ми знаємо про зорі, галактики й планети, ми дізналися з їх електромагнітного випромінювання. За спектром світла зорі визначають її температуру й хімічний склад, за зміщенням ліній спектра — швидкість руху.", "Різні діапазони показують різне: радіотелескопи досліджують холодний газ і реліктове випромінювання — «відлуння» ранньої історії Всесвіту; інфрачервоні телескопи (зокрема космічний телескоп «Джеймс Вебб») бачать крізь пил і найвіддаленіші галактики; рентгенівські й гамма-телескопи на орбіті реєструють надгарячі процеси біля чорних дір і вибухи наднових."], "ul": ["Оптичні телескопи — видиме світло.", "Радіотелескопи — радіохвилі.", "Інфрачервоні телескопи — ІЧ-випромінювання.", "Рентгенівські та гамма-телескопи працюють лише в космосі, бо атмосфера поглинає це випромінювання.", "Дивлячись на далекі об’єкти, ми бачимо їх такими, якими вони були в минулому."]}], "formulas": [{"f": "s = ct/2", "d": "відстань до об’єкта в радіолокації: c ≈ 3·10⁸ м/с, t — час від випромінювання імпульсу до повернення"}, {"f": "c = λν", "d": "зв’язок довжини хвилі й частоти"}], "terms": [["Несуча хвиля", "високочастотна електромагнітна хвиля, на яку накладається сигнал для передавання."], ["Модуляція", "зміна параметрів несучої хвилі (амплітуди, частоти) відповідно до сигналу, що передається."], ["Демодуляція", "виділення сигналу з модульованої хвилі в приймачі."], ["Радіолокація", "виявлення об’єктів і визначення відстані до них за допомогою відбитих радіохвиль."], ["Базова станція", "приймально-передавальна станція стільникового зв’язку, що обслуговує певну територію."], ["Радіотелескоп", "прилад для приймання радіовипромінювання космічних об’єктів."]], "examples": [{"q": "Радіоімпульс, відбитий від літака, повернувся до радара через 200 мкс. На якій відстані літак?", "s": ["Дано: t = 200 мкс, c = 3·10⁸ м/с.", "СІ: t = 2·10⁻⁴ с.", "Розв’язання: s = ct/2 = 3·10⁸ · 2·10⁻⁴ / 2 = 3·10⁴ м = 30 км.", "Відповідь: 30 км."]}, {"q": "Радіосигнал, відправлений до Місяця, повернувся через ≈ 2,56 с. Оцініть відстань до Місяця.", "s": ["Дано: t = 2,56 с, c = 3·10⁸ м/с.", "Розв’язання: s = ct/2 = 3·10⁸ · 2,56 / 2 ≈ 3,84·10⁸ м = 384 000 км.", "Відповідь: ≈ 384 000 км."]}], "lab": null, "f": "Космічні апарати «Вояджер», запущені в 1977 р., досі передають на Землю сигнали, які йдуть до нас понад 20 годин.", "pr": ["Складіть схему «шлях повідомлення»: від вашого смартфона до смартфона друга в іншому місті. Позначте, де сигнал передається радіохвилями, а де — кабелем.", "Радар отримав відбитий сигнал через 0,6 мс. Обчисліть відстань до цілі."], "qz": [{"q": "Що таке модуляція?", "o": ["Підсилення звуку", "Зміна параметрів несучої хвилі відповідно до сигналу", "Приймання хвиль антеною", "Вимикання передавача"], "a": 1, "why": "Модуляція «накладає» інформацію на високочастотну несучу хвилю."}, {"q": "Радіоімпульс повернувся через 100 мкс. Відстань до цілі —", "o": ["15 км", "30 км", "3 км", "150 км"], "a": 0, "why": "s = 3·10⁸ · 10⁻⁴ / 2 = 1,5·10⁴ м = 15 км."}, {"q": "Чому в формулі радіолокації s = ct/2 ділимо на 2?", "o": ["Бо радіохвиля сповільнюється", "Бо антен дві", "Бо імпульс проходить шлях туди й назад", "Через опір повітря"], "a": 2, "why": "Час t — це час руху до цілі й назад."}, {"q": "Мобільний телефон є", "o": ["лише приймачем", "лише передавачем", "джерелом рентгенівського випромінювання", "і приймачем, і передавачем радіохвиль"], "a": 3, "why": "Телефон і приймає, і випромінює радіосигнали."}, {"q": "Чому рентгенівські телескопи розміщують у космосі?", "o": ["Там тепліше", "Атмосфера Землі поглинає рентгенівське випромінювання", "Там більше світла", "Через магнітне поле Землі"], "a": 1, "why": "Рентгенівське випромінювання з космосу не доходить до поверхні Землі."}, {"q": "Що можна дізнатися про зорю за її спектром?", "o": ["Температуру і хімічний склад", "Лише її масу", "Вік її планет", "Кількість супутників"], "a": 0, "why": "Спектральні лінії «видають» хімічні елементи, а розподіл енергії — температуру."}, {"q": "Wi-Fi-роутер зазвичай працює на частоті", "o": ["50 Гц", "100 МГц", "3·10¹⁸ Гц", "2,4 ГГц або 5 ГГц"], "a": 3, "why": "Wi-Fi використовує діапазони близько 2,4 і 5 ГГц."}, {"q": "Перевага радіолокації перед оптичним спостереженням —", "o": ["радіохвилі не відбиваються", "радари дешевші за бінокль", "радіохвилі проходять крізь туман і хмари, працюють уночі", "радари працюють лише вдень"], "a": 2, "why": "Радіохвилі слабко поглинаються туманом і хмарами й не потребують освітлення."}]}, {"n": "45", "type": "review", "t": "Узагальнення та систематизація знань", "gr": "ГР3", "g": "Узагальнити знання про механічні коливання, механічні, звукові й електромагнітні хвилі та підготуватися до підсумкової роботи.", "blocks": [{"h": "Механічні коливання", "p": ["Коливання — рух, що повторюється через однакові проміжки часу навколо положення рівноваги. Їх описують амплітудою A, періодом T і частотою ν = 1/T. Розрізняють вільні (за рахунок початкової енергії) і вимушені (під дією зовнішньої періодичної сили) коливання."], "ul": ["T = t/N, ν = N/t, ν = 1/T.", "За один період тіло проходить шлях 4A.", "Період нитяного маятника T = 2π√(l/g) не залежить від маси.", "Під час коливань потенціальна й кінетична енергії перетворюються одна на одну.", "Через тертя вільні коливання загасають."]}, {"h": "Механічні хвилі", "p": ["Механічна хвиля — поширення коливань у пружному середовищі; вона переносить енергію, а не речовину. Хвилі бувають поперечні (частинки коливаються перпендикулярно до напрямку поширення) і поздовжні (вздовж напрямку поширення)."], "ul": ["v = λ/T = λν.", "Поперечні механічні хвилі — у твердих тілах і на поверхні рідини.", "Поздовжні — у твердих тілах, рідинах, газах.", "При переході в інше середовище частота не змінюється, а v і λ змінюються.", "У вакуумі механічні хвилі не поширюються."]}, {"h": "Звук, інфразвук, ультразвук", "p": ["Звук — поздовжні механічні хвилі з частотою ≈ 16–20 Гц … 20 кГц. Гучність залежить від амплітуди, висота — від частоти, тембр — від обертонів. Інфразвук — нижче ≈ 16–20 Гц, ультразвук — вище 20 кГц."], "ul": ["Швидкість звуку: повітря ≈ 340 м/с, вода ≈ 1500 м/с, сталь ≈ 5000 м/с.", "Луна і ехолокація: s = vt/2.", "УЗД, ехолоти, дефектоскопія — застосування ультразвуку.", "Гучні звуки понад 85 дБ шкодять слуху."]}, {"h": "Електромагнітні хвилі та їх застосування", "p": ["Змінні електричне й магнітне поля утворюють єдине електромагнітне поле, яке поширюється як поперечна електромагнітна хвиля, у тому числі у вакуумі, зі швидкістю c ≈ 3·10⁸ м/с. Джерело хвиль — заряди, що рухаються з прискоренням."], "ul": ["c = λν.", "Шкала: радіохвилі → ІЧ → видиме світло (≈ 380–760 нм) → УФ → рентгенівське → гамма (зростає частота, зменшується λ).", "Зв’язок: несуча хвиля, модуляція, демодуляція; стільниковий зв’язок, Wi-Fi, супутники.", "Радіолокація: s = ct/2.", "Астрономія досліджує Всесвіт у всіх діапазонах випромінювання."]}, {"h": "Типові помилки", "p": ["Найчастіше помиляються під час переведення одиниць і забувають ділити на 2 у задачах на луну та радіолокацію. Також плутають, що змінюється при переході хвилі з одного середовища в інше."], "ul": ["Забувають, що в луні шлях подвійний: s = vt/2, а не vt.", "Плутають період і частоту: T у секундах, ν у герцах, ν = 1/T.", "Не переводять МГц, ГГц, нм, мкс у СІ.", "Вважають, що частота змінюється при переході в інше середовище — ні, змінюються v і λ.", "Думають, що звук поширюється у вакуумі.", "Пишуть, що шлях за період дорівнює A, а не 4A."]}], "formulas": [{"f": "T = t/N", "d": "період коливань"}, {"f": "ν = N/t = 1/T", "d": "частота коливань"}, {"f": "T = 2π√(l/g)", "d": "період нитяного маятника"}, {"f": "v = λ/T = λν", "d": "швидкість механічної хвилі"}, {"f": "s = vt/2", "d": "відстань до перешкоди за луною"}, {"f": "c = λν", "d": "швидкість електромагнітної хвилі, c ≈ 3·10⁸ м/с"}, {"f": "s = ct/2", "d": "відстань до цілі в радіолокації"}], "terms": [["Амплітуда", "найбільше відхилення тіла від положення рівноваги."], ["Період", "час одного повного коливання."], ["Частота", "кількість коливань за одиницю часу."], ["Механічна хвиля", "поширення механічних коливань у пружному середовищі."], ["Довжина хвилі", "відстань, на яку хвиля поширюється за один період."], ["Звук", "механічні хвилі, які сприймає вухо людини (≈ 16–20 Гц … 20 кГц)."], ["Ультразвук", "механічні хвилі з частотою понад 20 кГц."], ["Електромагнітна хвиля", "поширення змінного електромагнітного поля в просторі."], ["Модуляція", "зміна параметрів несучої хвилі відповідно до сигналу."], ["Радіолокація", "виявлення об’єктів і визначення відстані до них за допомогою відбитих радіохвиль."]], "examples": [{"q": "Камертон коливається з частотою 440 Гц. Звук від нього проходить у повітрі, а потім у воду. Знайдіть період коливань і довжину хвилі в повітрі та у воді (v_пов = 340 м/с, v_вод = 1500 м/с).", "s": ["Дано: ν = 440 Гц, v₁ = 340 м/с, v₂ = 1500 м/с.", "Розв’язання: T = 1/ν = 1/440 ≈ 0,0023 с.", "λ₁ = v₁/ν = 340/440 ≈ 0,77 м; λ₂ = v₂/ν = 1500/440 ≈ 3,4 м (частота не змінюється).", "Відповідь: T ≈ 2,3 мс; λ₁ ≈ 0,77 м; λ₂ ≈ 3,4 м."]}, {"q": "Метеорадар працює на хвилі завдовжки 3 см. Відбитий від грозової хмари імпульс повернувся через 0,4 мс. Знайдіть частоту радара й відстань до хмари.", "s": ["Дано: λ = 3 см, t = 0,4 мс, c = 3·10⁸ м/с.", "СІ: λ = 0,03 м, t = 4·10⁻⁴ с.", "Розв’язання: ν = c/λ = 3·10⁸ / 0,03 = 1·10¹⁰ Гц = 10 ГГц.", "s = ct/2 = 3·10⁸ · 4·10⁻⁴ / 2 = 6·10⁴ м = 60 км.", "Відповідь: 10 ГГц; 60 км."]}], "lab": null, "f": "Світло від Сонця до Землі йде близько 8 хвилин, тож ми завжди бачимо Сонце таким, яким воно було 8 хвилин тому.", "pr": ["Складіть опорну схему (ментальну карту) розділу «Механічні та електромагнітні хвилі» з усіма формулами й прикладами застосування.", "Розв’яжіть: маятник за 2 хв здійснив 60 коливань. Знайдіть період, частоту і довжину нитки (g ≈ 9,8 м/с², π² ≈ 9,8)."], "qz": [{"q": "Тіло за 4 с здійснило 20 коливань. Період —", "o": ["0,2 с", "5 с", "80 с", "2 с"], "a": 0, "why": "T = 4/20 = 0,2 с."}, {"q": "Яка хвиля може поширюватися у вакуумі?", "o": ["Звукова", "Хвиля на воді", "Електромагнітна", "Сейсмічна"], "a": 2, "why": "Лише електромагнітним хвилям не потрібне середовище."}, {"q": "Швидкість хвилі 20 м/с, частота 4 Гц. Довжина хвилі —", "o": ["80 м", "5 м", "0,2 м", "24 м"], "a": 1, "why": "λ = 20/4 = 5 м."}, {"q": "Висота звуку визначається", "o": ["амплітудою", "тембром", "швидкістю", "частотою"], "a": 3, "why": "Що більша частота, то вищий звук."}, {"q": "Луна від будинку повернулася через 0,2 с. Відстань (v = 340 м/с) —", "o": ["34 м", "68 м", "17 м", "340 м"], "a": 0, "why": "s = 340·0,2/2 = 34 м."}, {"q": "Розташуйте за зростанням частоти: 1) видиме світло; 2) радіохвилі; 3) рентгенівське.", "o": ["1, 2, 3", "2, 1, 3", "3, 1, 2", "2, 3, 1"], "a": 1, "why": "Радіохвилі мають найменшу частоту, рентгенівське — найбільшу з трьох."}, {"q": "Частота радіостанції 75 МГц. Довжина хвилі —", "o": ["0,25 м", "40 м", "4 м", "25 м"], "a": 2, "why": "λ = 3·10⁸ / 7,5·10⁷ = 4 м."}, {"q": "Що випромінюють усі нагріті тіла, зокрема людина?", "o": ["Ультрафіолет", "Гамма-промені", "Радіохвилі FM-діапазону", "Інфрачервоне випромінювання"], "a": 3, "why": "Теплове випромінювання тіл кімнатної температури лежить в ІЧ-діапазоні."}, {"q": "Що НЕ змінюється при переході хвилі з повітря у воду?", "o": ["Частота", "Швидкість", "Довжина хвилі", "Нічого не змінюється"], "a": 0, "why": "Частоту задає джерело."}, {"q": "Радіоімпульс повернувся від цілі через 1 мс. Відстань —", "o": ["300 км", "150 км", "30 к
